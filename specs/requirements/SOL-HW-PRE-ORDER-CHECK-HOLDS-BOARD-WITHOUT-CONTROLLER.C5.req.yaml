text: |
  The check's text report names, for each failing case of the pin allocation and connectivity rules, the rule and the channel or part, and a passing controller-less design reports no failure. The check has no machine-readable report, and none is added here. Failures of rules other than the pin allocation and connectivity rules are out of scope.
