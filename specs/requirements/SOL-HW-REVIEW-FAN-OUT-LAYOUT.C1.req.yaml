id: SOL-HW-REVIEW-FAN-OUT-LAYOUT.C1
type: criterion
title: The layout caller takes its units and their couplings from the review folder's method and the board's plan, and plans each coupled set into one group
status: active
version: 3
measurement_type: binary
verification: test
text: |-
  From a synthetic review folder the caller's declaration gives one unit per area heading of the folder's layout practice catalogue, one for the board's own items when the plan's table has rows, and one for the comparison with the plan and the free pass, with the couplings it states, and the units are planned into groups with each coupled set in one group; a coupling the declaration states that no cross-reference of the catalogue supports fails the test, a cross-reference alone does not make a coupling, and the declared couplings (power with mains, ground with the manufacturing items) leave at least six groups, the largest within the declared time budget; the shared context holds the whole catalogue, and each unit's prompt holds its own area and the items to judge; a folder whose method has no catalogue areas or lacks a section the shared context needs, or whose plan's table cannot be read, is refused naming what is missing. Out of scope: the content of any catalogue item and the narrow round's units.
