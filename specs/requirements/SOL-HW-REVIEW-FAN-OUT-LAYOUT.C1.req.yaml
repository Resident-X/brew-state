id: SOL-HW-REVIEW-FAN-OUT-LAYOUT.C1
type: criterion
title: The layout caller takes its units from the review folder's method and the board's plan
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  From a synthetic review folder the caller's units are one per area heading of the folder's layout practice catalogue, one for the board's own items when the plan's table has rows, and one for the comparison with the plan and the free pass; a folder whose method has no catalogue areas, or whose plan's table cannot be read, is refused naming what is missing. Out of scope: the content of any catalogue item and the narrow round's units.
