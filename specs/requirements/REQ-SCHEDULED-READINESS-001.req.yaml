id: REQ-SCHEDULED-READINESS-001
type: requirement
category: functional
title: The machine can reach readiness on a schedule or on request without a person present
status: active
priority: could
version: 4
text: |
  Reaching readiness heats the machine to a state it already holds whenever it is switched on and left alone. Nothing is dispensed and no drink is made, which is what keeps it on the permitted side of the remote-interface boundary; whether water moves inside the machine to get there is not what that boundary turns on.

  The reference machine gains least from this, because how long it takes to reach readiness is separately bounded against what its own physics permits. The capability exists for adopters whose hardware has a floor long enough that the wait shapes how the machine is used, and for whom removing the wait entirely is worth more than shortening it.
rationale: |
  Priority is could, and honestly so. The capability has no real value on the reference machine, and recording it as anything higher would misrepresent what this project needs in order to be finished.

  Bounded to readiness rather than operation, which is the distinction the remote-interface decision now rests on. Reaching readiness sends nothing out of the machine and produces no drink; delivery requires somebody to be holding a cup. A machine that expelled water to get to temperature would have performed a delivery, which is the boundary doing its work rather than an exception to it.

  Required to be disableable because on the reference machine it should be off. A capability that cannot be turned off is one that has to be reasoned about on every machine rather than only on the ones that want it.
