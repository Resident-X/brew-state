id: REQ-SCHEDULED-READINESS-001
type: requirement
category: functional
title: The machine can reach readiness on a schedule or on request without a person present
status: active
priority: could
version: 1
text: |
  Reaching readiness heats the machine to a state it already holds whenever it is switched on and left alone. Nothing moves, nothing is dispensed, and no drink is made.

  The reference machine gains almost nothing from this: a thermoblock is at temperature in well under a minute. It exists for adopters running hardware that takes fifteen to twenty-five minutes.
rationale: |
  Priority is could, and honestly so. The capability has no real value on the reference machine, and recording it as anything higher would misrepresent what this project needs in order to be finished.

  Bounded to readiness rather than operation, which is the distinction the remote-interface decision now rests on. Warm-up releases energy but moves no water and produces no drink; delivery requires somebody to be holding a cup.

  Required to be disableable because on the reference machine it should be off. A capability that cannot be turned off is one that has to be reasoned about on every machine rather than only on the ones that want it.
