id: SOL-HW-CONTROLLER-BOARDS-ORDERED.C2
type: criterion
title: Each board's placement file gives every placed part's rotation and position in the assembler's own footprint frame
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The placement step takes the assembler's published footprint for each placed part's catalogue number and finds the rotation and the shift that bring it onto the board's pads, matched by pad number. The file carries each part's corrected rotation and the position of the assembler's footprint origin. A part whose pads cannot all be matched is refused, naming the part, and enters the file only through a recorded per-part override with its reason. The assembler's footprints are fetched once for each catalogue number, at a pace its service accepts, and kept outside the repository. A test over synthetic footprints holds that a part rotated and shifted against the assembler's footprint is brought onto it exactly, that a part with an unmatched pad is refused, and that each of a wrong rotation sign, a missing flip of the vertical axis and a dropped origin shift is caught. Out of scope: the assembler's own corrections after upload.
