id: SOL-PRE-ORDER-CHECK-SENSING-CLEARANCE-AND-GROUND-RETURNS.C5
type: criterion
title: Each rule is shown to fail on a fault seeded for it in a copy of the throwaway proof design
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The on-demand seeded-fault proof introduces into a copy of a throwaway design, outside the tracked tree, a sensing item closer to a noisy net than the declared clearance, a board rules record that is silent on sensing, a connector below the declared ratio of signal to ground-return pins, a connector pin on a class declared neither ground nor signal and a connector of two signal classes below the stricter ratio, and requires the check to fail each, the record of each seeded run naming the fault and the rule that caught it; the committed proof design stays passing. A missing record or declaration the rule needs fails; a design with no connector or sensing class the rule inspects is not failed for that; an explicit none is accepted. The proof is the existing on-demand seeded-fault proof, extended, and runs in neither gate. Out of scope: the existing seeded-fault proofs and the rules owned by other leaves of this task.
