id: REQ-ELECTRICAL-INSTALL-001.C4
type: criterion
title: Switching devices stay within their rated temperature in the assembled enclosure
status: active
version: 2
measurement_type: threshold
verification: test
text: |
  Devices switching several amps continuously dissipate real power, and a rating quoted for free air does not describe a sealed box in a hot kitchen.

  The judgement is made against the assembled condition in service rather than against the figure on the datasheet.
