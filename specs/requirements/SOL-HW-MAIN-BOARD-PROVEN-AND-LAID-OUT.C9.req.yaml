id: SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C9
type: criterion
title: The controller's converter-input map that the firmware's sensor check reads is authored beside the pin allocation record
status: deprecated
version: 2
measurement_type: binary
verification: inspection
text: |
  The map names, for each sensor channel the pin allocation record carries, the converter input of the selected controller part on the pin the record names, taken from the part's maker's description, so the firmware's sensor check has the map it reads. Wiring the pin checks to the records and changing the checks are out of scope.
