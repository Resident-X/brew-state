id: SOL-HW-MAIN-BOARD-INTERLOCK-ENTRY-JUDGED.C7
type: criterion
title: Each owner decision the division record holds against the main board is settled, or the board is recorded as drawn one way with the consequence of the other carried
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  The decisions are the tab moves against the mounting-hole rule, the current sensing placement, the voltage measurement's distance from the relay, the fuse arrangement, the varistors and the removal order of the channel kinds. Each record names the drawn default, the other choice and what it would change. Redesigning the board to the choice not drawn is out of scope; only its consequence is carried.
