id: SOL-HOST-ARITHMETIC-REPRODUCIBLE-ACROSS-HOSTS.C1
type: criterion
title: The golden-trajectory test passes on correct code on every supported host
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The plant model's golden-trajectory test passes on unmodified, correct code on macOS arm64 with Apple clang, on Linux x86-64 with GCC, and under the mutation build, and on each of them still fails when the trajectory drifts in the way it exists to refuse, shown by altering the plant's arithmetic and observing the failure on each host. Out of scope: other tests in the plant suite whose comparisons do not depend on host arithmetic, and host platforms beyond these.
