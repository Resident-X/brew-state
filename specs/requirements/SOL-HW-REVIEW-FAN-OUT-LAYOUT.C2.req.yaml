id: SOL-HW-REVIEW-FAN-OUT-LAYOUT.C2
type: criterion
title: A narrow round's units are the areas its listed items fall in, and only the listed items are judged
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  From a synthetic narrow round whose listed items fall in two areas, the caller has a unit for each of the two areas and none for the rest, each unit's prompt names only its listed items, and the merge accepts a verdict only for a listed item; a narrow round whose items fall in one area is judged in the setup session. Out of scope: how the designer chooses the listed items.
