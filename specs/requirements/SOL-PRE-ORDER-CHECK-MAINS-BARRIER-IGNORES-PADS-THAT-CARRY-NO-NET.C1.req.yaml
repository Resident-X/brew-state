id: SOL-PRE-ORDER-CHECK-MAINS-BARRIER-IGNORES-PADS-THAT-CARRY-NO-NET.C1
type: criterion
title: A lone no-connect pad lying among a part's Mains-class pads is in neither group and the part is measured
status: active
version: 1
measurement_type: binary
verification: test
text: |
  On a synthetic layout, a part with Mains-class pads and a pad on a net named unconnected-(...) carried by no other pad, lying among them, is measured by the strip between its Mains-class pads and its other netted pads, with the no-connect pad in neither group. The figure BARRIER_COPPER_MM2, the strip geometry and the main board's layout are out of scope.
