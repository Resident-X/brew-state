id: REQ-EXTENSIBILITY-001.C2
type: criterion
title: A new output is covered by actuation confirmation and fault response without those being reopened
status: active
version: 1
measurement_type: binary
verification: analysis
text: |
  Confirmation and fault handling written per-output leave every addition either uncovered or requiring the same work again.

  An output added without confirmation is a silent gap, since nothing reports the absence of a check that was never written.
links:
