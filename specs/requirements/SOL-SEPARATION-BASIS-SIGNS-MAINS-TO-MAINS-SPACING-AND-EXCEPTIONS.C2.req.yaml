id: SOL-SEPARATION-BASIS-SIGNS-MAINS-TO-MAINS-SPACING-AND-EXCEPTIONS.C2
type: criterion
title: Each mains_to_mains figure rests on a table row that cites its table, locator and any interpolation, and the floor rule passes on them
status: active
version: 3
measurement_type: binary
verification: test
text: |-
  The record's table_rows hold a row for each figure: the clearance row (2.5 kV), a terminal row carrying location terminal, and a derived creepage row at 253 V whose figure is the interpolation of the 250 V and 320 V rows, 4.04 mm, signed rounded up to 4.1 mm, a deliberate 0.1 mm design margin over the standard's own rounded result of 4.0 mm, its citation naming both rows, the arithmetic and the clause that allows the interpolation (IEC 60664-1:2007 clause 5.2.4). The derived row restates the inputs it was read at, material group included, as signed. Each row has its citation (document, edition and the table and row), its inputs and its figure. The check's floor rule, run on the record's own figures taken as signed, finds no figure below its floor, and a creepage figure of 4.0 mm would fail it. Rows for the mains_to_low_voltage figures are out of scope and stay as signed.
