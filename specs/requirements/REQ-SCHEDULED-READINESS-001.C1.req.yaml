id: REQ-SCHEDULED-READINESS-001.C1
type: criterion
title: Readiness can be reached on a schedule or on request with nobody present
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  The machine heats and holds, which is what it does whenever it is switched on and left alone, so the unattended state is not a new one.

  What is new is that nobody chose it at the moment it began, which is why the remaining criteria bound it.

  Reaching readiness on a schedule means arriving at the chosen time, so when heating has to begin follows the same declared conditions the timeliness bound does. Lead time computed at nominal is late on a low supply and early on a high one, and the first of those is the one the operator experiences as the schedule not working.
