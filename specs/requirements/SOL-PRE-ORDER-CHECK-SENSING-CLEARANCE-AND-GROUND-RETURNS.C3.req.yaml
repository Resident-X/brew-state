id: SOL-PRE-ORDER-CHECK-SENSING-CLEARANCE-AND-GROUND-RETURNS.C3
type: criterion
title: The rules extend the existing pre-order check and its record reader
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The sensing-clearance rule and the ground-return rule are added to the existing pre-order check as further rules reading through the record reader already built to accept the new records and keys, run by the same one task-runner command, with each rule reading only the design's files and the records the design is held to. A key the decisions do not define still fails. Out of scope: a second tool, a parallel reader, any read of firmware source, and applying the rules to a real board's own records, which is that board's design task.
