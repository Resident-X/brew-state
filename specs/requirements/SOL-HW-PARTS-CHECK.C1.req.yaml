id: SOL-HW-PARTS-CHECK.C1
type: criterion
title: A part whose stated properties or catalogue number differ from the specification record fails the check
status: active
version: 1
measurement_type: binary
verification: test
text: |
  For each position the design places, the check fails the design when the position is absent from the specification record, when the part's value, package or rating differs from what the record states for it, or when the part's LCSC symbol field is absent or differs from the record's. A property the record leaves unstated is not compared. Each failure names the position, the property, the record's value and the design's value. Out of scope: the catalogue extract, which the next criterion covers, and the choice of which properties a real board's record states.
links:
