title: The copper lock, a layout review round, the placement history and the full check run before the item closes
status: active
version: 1
measurement_type: binary
verification: inspection
scope: The closing steps for this change; one round may serve this item and the pour, decoupling-via, thermal-relief and silkscreen item together when both are built on one branch.
text: |
  The copper lock and a fresh copper record cover the changed locked copper, a layout review round on the changed board has run and is recorded, the placement and critical-routing history names the three parts and the re-routed copper, and the full pre-order check on the changed board has run, each recorded in the item's evidence; the item stays open until all four have run. Out of scope: the owner's decision on the five vias in pads.
