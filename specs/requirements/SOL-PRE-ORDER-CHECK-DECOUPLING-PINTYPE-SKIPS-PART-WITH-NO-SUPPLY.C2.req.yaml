id: SOL-PRE-ORDER-CHECK-DECOUPLING-PINTYPE-SKIPS-PART-WITH-NO-SUPPLY.C2
type: criterion
title: A pad typed power on a part with a no-supply category fails, and a malformed category fails the extract read
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A position whose entry's category is in the closed list and whose footprint has a pad typed power input or power output fails decoupling_pintype naming the position. A category that is an empty string or is not a string fails the catalogue extract read naming the entry, and the part is then not skipped. The main board's records and any rule other than decoupling_pintype are out of scope.
