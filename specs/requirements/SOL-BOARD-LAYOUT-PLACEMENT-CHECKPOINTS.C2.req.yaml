id: SOL-BOARD-LAYOUT-PLACEMENT-CHECKPOINTS.C2
type: criterion
title: A board's placement is chosen from several candidates, each measured and judged before any track is drawn
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Write into the method, between planning the layout and the rules before routing, a placement step that an agent can follow from its text alone, and amend the planning and rules steps to suit it. The floorplan table in the layout plan gains a column listing, for each region, the reference designators of the parts it holds, comma-separated and without ranges, a part spanning two regions listed in both; the planning step's cross-checks gain one that every part on the schematic is listed in at least one region and no listed reference is unknown; and the proof design's layout plan is migrated to that form. Setting the board-wide minimum track width and clearance from the manufacturer's record, with their rows in the rules table, moves from the rules step to before placement, because the placement view takes its resolution from them; the rest of the rules step stays after placement. The catalogue marks the items judged at placement by naming the placement view in their Judged on line, those being the items whose subject is where parts sit, FLOOR-1, DECOUPLE-1, CLOCK-1, MAINS-2, CONN-1, EMI-5 and WORK-1 among them, and the layout review's list of views gains the placement view. The placement step places the parts that cannot move first, connectors, mounting holes and the mains region, then the rest by signal flow and current loop within the floorplan, the main integrated circuit before the parts that serve it, each part turned so its pins face the pins they join. It produces at least two candidate placements, renders and measures each with the unrouted-connection command, judges each against the items whose Judged on line names the placement view, and records, in a placement section of the board's layout plan, each candidate's measures, the command that renders its view, its verdict on each of those items and the reason the chosen one was chosen, committed before any track is drawn, so the order is checkable from the repository's history; the images themselves are not committed, as the review views are not, since the command regenerates them. A candidate that leaves a part outside its floorplan regions is not chosen; among the rest the choice is a judgement on the item verdicts with the measures cited as its grounds, not a fixed weighting of the measures. Out of scope: the command itself, and routing.
