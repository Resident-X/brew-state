id: SOL-BOARD-LAYOUT-PLACEMENT-CHECKPOINTS.C2
type: criterion
title: A board's placement is chosen from several candidates, each measured and judged before any track is drawn
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Write into the method, between planning the layout and the rules before routing, a placement step that an agent can follow from its text alone, and amend the planning and rules steps to suit it. The floorplan table in the layout plan gains a column listing, for each region, the reference designators of the parts it holds, comma-separated and without ranges, a part spanning two regions listed in both; the planning step's cross-checks gain one that every part on the schematic is listed in at least one region and no listed reference is unknown; and the proof design's layout plan is migrated to that form. Setting the board-wide minimum track width and clearance from the manufacturer's record, with their rows in the rules table, moves from the rules step to before placement, because the placement view takes its resolution from them; the rest of the rules step stays after placement. The catalogue marks the items judged at placement by naming the placement view in their Judged on line, those being the items whose Asks question asks where a part sits, and MAINS-2, whose mains copper includes the pads placement puts down: FLOOR-1, FLOOR-3, POWER-2, DECOUPLE-1, DECOUPLE-3, DECOUPLE-4, DECOUPLE-5, SENSE-2, SENSE-3, SENSE-5, CLOCK-1, CLOCK-3, MAINS-2, CONN-1, CONN-2, CONN-3, TEST-2, EMI-3, EMI-4, EMI-5 and WORK-1. Because the final review judges each item on every view its Judged on line names, the placement view reaches it: the layout review's list of views gains the placement view, its rendering step and that step's cross-check run the placement command beside the views command into the same uncommitted folder, and the seeded blind review's folder builder renders the placement view and its measures into the folder it hands the reviewer, its fixed reviewer prompt naming them among the views it is given. The placement step places the parts that cannot move first, connectors, mounting holes and the mains region, then the rest by signal flow and current loop within the floorplan, the main integrated circuit before the parts that serve it, each part turned so its pins face the pins they join. It produces at least two candidate placements, commits each as its own commit before rendering it, renders and measures each with the unrouted-connection command, judges each against the items whose Judged on line names the placement view, and records, in a placement section of the board's layout plan, each candidate's measures, the commit that holds it and the command that renders its view from that commit, its verdict on each of those items and the reason the chosen one was chosen, committed before any track is drawn, with a cross-check in the placement step that the history shows the placement section and every candidate's commit before the first commit carrying a track; the images themselves are not committed, as the review views are not, since the command regenerates them from each candidate's commit. A candidate that leaves a part outside its floorplan regions is not chosen; among the rest the choice is a judgement on the item verdicts with the measures cited as its grounds, not a fixed weighting of the measures. Out of scope: the command itself, and routing.
