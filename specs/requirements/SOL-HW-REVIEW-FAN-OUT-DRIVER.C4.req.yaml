id: SOL-HW-REVIEW-FAN-OUT-DRIVER.C4
type: criterion
title: The command exits 0, 1 or 2 with the board commands' REFUSED and CANNOT RUN lines and reports in text and in JSON with the same content
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The exit status is 0 when the merged record is written, 1 when the command refuses or a unit fails, and 2 when the agent command line is missing or not logged in, each with a line beginning REFUSED or CANNOT RUN as the other board commands print; a review folder inside the repository, a folder that does not exist, an unknown caller and a bound below one are refused. The report is available as text and as JSON and the two hold the same facts. Out of scope: the merge's own refusals, which each caller names.
links:
