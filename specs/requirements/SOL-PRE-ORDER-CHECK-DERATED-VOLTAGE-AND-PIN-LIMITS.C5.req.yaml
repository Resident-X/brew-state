id: SOL-PRE-ORDER-CHECK-DERATED-VOLTAGE-AND-PIN-LIMITS.C5
type: criterion
title: Each rule is shown to fail on a fault seeded for it in a copy of the throwaway proof design
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The on-demand seeded-fault proof introduces into a copy of a throwaway design, outside the tracked tree, a part whose net exceeds the policy's voltage share of its rating, a position without its class, a position naming a class the policy lacks, a pin whose net exceeds absolute_max_v, a pin whose net falls below absolute_min_v, a pin driven from another domain while its own is unpowered, and an integrated circuit the pin-limit record omits, and requires the check to fail each, the record of each seeded run naming the fault and the rule that caught it; the committed proof design stays passing. A missing record or declaration the rule needs fails; a design with no semiconductor, integrated-circuit or covered part is not failed for that; an explicit none is accepted. The proof is the existing on-demand seeded-fault proof, extended, and runs in neither gate. Out of scope: the existing seeded-fault proofs and the rules owned by other leaves of this task.
