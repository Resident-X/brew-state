id: SOL-SIM-STEAM-FEED-HOLDS-PRESSURE-HEATER-HOLDS-DRYNESS.C2
type: criterion
title: The feed holds pressure and heater power holds a declared superheat setpoint, and no pressure loop drives the heater
status: active
version: 1
measurement_type: threshold
verification: test
text: |-
  During a draw the steam control law drives the feed pump to hold measured pressure inside the declared band and drives heater power to hold the modelled outlet superheat at a declared setpoint carrying its origin; no loop takes pressure error into the heater command. In host simulation, closing the loop through the truth plant, a test shows: pressure stays in band for the whole of a draw of any duration within the declared model-error tolerance; superheat stays at or above its setpoint for the whole draw; and perturbing heater power changes superheat while leaving the pressure loop's feed command the sole pressure actuator. The existing steam control law and declaration are extended in place rather than a parallel loop built. Does not cover: the feed-withhold-below-ready behaviour, which stays the readiness gate's, and the casting margin in every phase, which DEL-CASTING-MARGIN-HELD-IN-EVERY-PHASE owns.
