id: SOL-HW-SEPARATION-BASIS-SIGNED.C1
type: criterion
title: The machine's basis record states every input its figures are read at, and its figures meet their own floor
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  A separation basis record, not marked synthetic, sits in the machine's hardware folder in the form the separation-basis decision sets. It states:
  - the named standard, or a cited, freely available derivation of its tables;
  - the declared supply, and the working voltage at the top of its span;
  - the pollution degree, taken as 3 unless the boards are protected against moisture, and saying which;
  - the material group, with its reason;
  - the environment, with water, steam and repeated heating;
  - the overvoltage category and the altitude;
  - the barriers. Every barrier named has exactly one barrier_types entry, giving its insulation type, basic or reinforced, whether its low-voltage side is bonded to protective earth, the low-voltage parts a person can touch beyond it (such as a service port, the operator's controls or the enclosure), and the part or spacing that forms it;
  - only the table rows its own inputs select, never a whole table, each with its citation.
  The mains-to-low-voltage clearance and creepage are at or above the floor those rows give. A test finds the committed record valid under the board check's own reading of it, including the floor its own inputs set. Out of scope: any board layout, and separation pairs other than mains to low voltage, which the check does not compare.
