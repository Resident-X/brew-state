id: SOL-HW-REVIEW-KIT.C2
type: criterion
title: The executor has a stub, a replay and the real command line, saves every stream, retries a rate limit, types a failure, and a contract smoke asserts the facts a shared context depends on
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The stub, the replay and the real-command-line executors satisfy one interface. The replay returns the recorded stream for the hash of a specification, a parent and a message, and fails naming the hash when none is recorded. The real executor reads the command line's name from one environment variable and writes each stream, with the specification and message hashes, into the output folder as the command line printed it. Against the stub with an injected clock, a call refused for a rate limit is retried after waits that grow, a bounded number of times, without the test sleeping, and a call that still fails comes back as a typed rate-limit result; an error exit and an empty answer each come back as a typed result carrying what the command line returned, and nothing else is retried by the executor. The smoke's assertions run over recorded probe streams: a fork's system prompt equal to its root's passes and a differing one fails, a fork whose first call reads at least its parent's prefix from the cache passes, and the recorded probe in which the result-schema flag differed between a root and its fork, so that the fork read nothing from the cache, is flagged as a cache miss. When the agent command line is missing or not logged in the smoke prints a CANNOT RUN line naming the cause and what to do, and exits 2. The task runner's description of the smoke says that it spends a few cents, is on demand, and is run when the command line's version changes. Out of scope: the live run of the smoke, whose streams are the fixtures.
