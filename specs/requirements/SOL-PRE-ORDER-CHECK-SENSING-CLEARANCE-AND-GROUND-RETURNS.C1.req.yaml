id: SOL-PRE-ORDER-CHECK-SENSING-CLEARANCE-AND-GROUND-RETURNS.C1
type: criterion
title: A sensing net closer to a switching or drive net than the declared clearance fails
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  A board rules record, board-rules.yaml, found by the nearest-folder rule and marked synthetic in a proof design, holds a sensing mapping of classes (net classes carrying precision sensing), noisy_classes, clearance_mm and source, and each mapping may state none explicitly; silence, a clearance without its source, or no figure fails. The check appends, as the last rule on a temporary copy, one rule per sensing and noisy class pair at the declared clearance so nothing the design writes overrides it, and fails where a sensing item sits closer. The layout practice catalogue's sensing item moves from reviewer judgement to enforced. Out of scope: inferring classes from net names and the choice of the real clearance figure.
