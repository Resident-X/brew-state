id: SOL-PRE-ORDER-CHECK-SENSING-CLEARANCE-AND-GROUND-RETURNS.C1
type: criterion
title: A sensing net closer to a switching or drive net than the declared clearance fails
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  A board rules record, board-rules.yaml, found by the nearest-folder rule and marked synthetic in a proof design, holds a sensing mapping of classes (net classes carrying precision sensing), noisy_classes, clearance_mm and source, and each mapping may state none explicitly; silence, a clearance without its source, or no figure fails. The check inserts on a temporary copy, ahead of the signed Mains rule so that the signed rule stays last and wins, one rule per sensing and noisy class pair at the declared clearance, and fails where a sensing item sits closer. The layout practice catalogue's sensing item moves from reviewer judgement to enforced. Out of scope: inferring classes from net names and the choice of the real clearance figure.
