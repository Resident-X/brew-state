id: SOL-MAIN-BOARD-NET-PAIR-EXCEPTIONS-DRAFTED.C4
type: criterion
title: No net-pair entry reduces the figure of a pair that can reach the supply voltage or of a held pair
status: active
version: 3
measurement_type: binary
verification: test
text: |-
  No net-pair entry of the committed record holds a working_voltage_v of 250 or more, lists both nets of a pair in held_at_reinforced on opposite sides, lists LINE_MOD, a snubber net, LINE_IN, LINE_F, LINE1 or a load net, lists a triac gate net or the zero-cross LED anode on either side against any net but /NEUTRAL, lists either of them among the neutral-referenced set of entries 1 and 2, or lists a pump gate network net (PUMP_C_GATE_R or PUMP_S_GATE_R), which stays at the full figure against every net. Out of scope is a pair the leaf's list does not name.
links:
