id: SOL-PLANT-STEAM-FLASH-GENERATOR.C1
type: criterion
title: With the wand open, steam pressure follows the steam made through the restriction as the square of its rate, not the casting temperature
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  In the thermoblock structure, while a draw is open, steam pressure is the drop across the tube, valve and tip given by one declared restriction coefficient times the square of the steam mass rate actually made (the lower of demand and commanded feed). A test holding feed and opening fixed while stepping casting temperature across its working range shows pressure unchanged beyond floating-point tolerance, and a test stepping feed at fixed casting temperature shows pressure moving as the square of the made rate; a mutation of the square or the coefficient fails a test. The relation is algebraic, with no pressure time constant. Out of scope: the control law that chooses the feed, and any laminar or valve-position-dependent restriction model.
