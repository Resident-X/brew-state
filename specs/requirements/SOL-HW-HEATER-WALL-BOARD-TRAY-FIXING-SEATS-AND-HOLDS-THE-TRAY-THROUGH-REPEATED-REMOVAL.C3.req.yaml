text: |
  The case record states the insert's pull-out allowance with its source, marking the figure for printed ASA in this layer direction as an assumption, and re-judges the tray root's tension and the triac end's motion at the new fixing in both the push-on and the pull-off direction against the limits the record already states, and gives the owner's proof load with home kit. Out of scope: the printed plastic's measured strength.
