id: SOL-HW-STEAM-TRANSDUCER-BASIS-RECORDED.C2
type: criterion
title: The ratings the chosen part must carry above that pressure are recorded with the baseline they are checked against
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  State in controller-board-design-constraints.md the proof pressure of at least 7.5 bar gauge and burst pressure of at least 10 bar gauge the part must carry, as 1.5 and 2 times the in-service pressure, graded project assumption with what replaces them named; the earlier design's 0.5 MPa XDB401 with its relayed overload (read as the proof pressure) and burst as the baseline that meets both, graded published unverified; and the range requirement as two bounds: a full scale no greater than the accuracy divided by the family's fractional accuracy, taking 0.25 bar as the binding accuracy figure and 0.775 bar as the ceiling the record already holds, and a range that covers the control's ready-pressure-bar. Out of scope - choosing the part.
