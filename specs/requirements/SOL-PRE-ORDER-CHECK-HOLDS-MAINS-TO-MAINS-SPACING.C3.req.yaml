id: SOL-PRE-ORDER-CHECK-HOLDS-MAINS-TO-MAINS-SPACING.C3
type: criterion
title: A design with a missing, invalid or contradicted MAINS_ENTRY declaration fails mains_declaration
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  MAINS_ENTRY unset or holding anything but present or none fails; present with no net in the Mains_Entry class, or with a Mains_Entry net outside the Mains class, fails; none with a net in the Mains_Entry class fails. Each failure names the variable or the net. A design that declares MAINS none is out of scope and needs no MAINS_ENTRY. A fixture, a design that declares NOT_FOR_MANUFACTURE true and is held by a record marked synthetic, is likewise out of scope and passes with MAINS_ENTRY unset when its record carries no mains_to_mains mapping, and a value it sets is read as above; a fixture whose record carries the mapping, an orderable design, and a design marked not for manufacture but held by a record not marked synthetic, each need it.
