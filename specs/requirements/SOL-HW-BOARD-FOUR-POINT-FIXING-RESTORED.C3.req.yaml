id: SOL-HW-BOARD-FOUR-POINT-FIXING-RESTORED.C3
type: criterion
title: Every statement of the point 3 decision and its consequences is brought to match, and the record's check passes
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Every statement in the board division record, and in any other record that restates it, of the point 3 fixing, of the tabs that move for the fixings, and of the fixing-rule decision the record lists as pending, is brought to match the corrected design; a figure that changed is replaced and not annotated. The record's check script and its expected output are regenerated from the corrected data, and the script's commands for each board, for the tables and for its self-test are run and shown to end as the record says they end. The record states how the four-point fixing holds the board, and says plainly what has not been analysed about board stiffness. Out of scope: a stiffness analysis of the board.
