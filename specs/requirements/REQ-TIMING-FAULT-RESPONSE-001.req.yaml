id: REQ-TIMING-FAULT-RESPONSE-001
type: requirement
category: functional
title: The machine detects and responds to its own timing failures
status: active
priority: must
version: 1
text: |
  A late answer and a wrong answer have the same effect on the machine, and the obligation above this one says so. What it does not say is what the machine does when lateness happens anyway.

  Overruns occur on hardware that was analysed carefully, which makes the machine's response to its own timing failure a behaviour rather than a contingency.
rationale: |
  Authored because the timing obligation had nothing beneath it. Its criteria about worst-case analysis and measurement on target are properties of how the work is done and belong to the delivery chain; these are properties of the running machine, and no node stated them.

  Requires detection before response, because defined overrun behaviour is unreachable without it. A machine that cannot tell a deadline was missed has undefined behaviour by default, whatever was written down.

  Distinguishes a single overrun from a persistent one. Treating every overrun as a fault produces a machine that stops working on hardware where the occasional overrun is normal; treating none of them as a fault produces a machine that degrades silently until something else notices.

  Silent on what the response is. Whether a delivery continues, degrades or ends depends on which deadline was missed and what it was carrying, and fixing one answer here would be wrong for most of them.

  The shared-state criterion is stated as an observable property rather than as a mechanism, because the failure it prevents is visible from outside: a value read part-way through being written is wrong in ways that do not reproduce, and no amount of retrying finds it.
