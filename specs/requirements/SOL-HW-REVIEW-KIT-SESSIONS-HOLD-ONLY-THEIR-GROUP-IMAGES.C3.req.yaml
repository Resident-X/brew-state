id: SOL-HW-REVIEW-KIT-SESSIONS-HOLD-ONLY-THEIR-GROUP-IMAGES.C3
type: criterion
title: The plan reports each group's image count and tokens against the budget, in text and in JSON, and can be produced without starting a session
status: active
version: 3
measurement_type: binary
verification: test
text: |-
  Over a synthetic declaration, the plan record and the report, in text and in JSON with the same content, give the shared documents' tokens, then for each group the root its sessions continue, and for each root the groups it serves, the number of images and the tokens its sessions hold in all, the budget it is held to and the margin; the predicted cost counts each root as written once; and a plan-only invocation writes the plan and the report, exits 0 and starts no session, or exits 1 with the refusal when a group is over the budget. Out of scope for this criterion: the prices.
links:
