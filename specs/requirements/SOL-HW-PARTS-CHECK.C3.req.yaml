id: SOL-HW-PARTS-CHECK.C3
type: criterion
title: A design with no usable specification record or catalogue extract fails, and a synthetic one passes only a design not for manufacture
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A design with no specification record or no catalogue extract at or above its folder, one that cannot be parsed, one missing a required key and one that lists nothing each fail, since an empty record would otherwise pass any design. A record or extract marked synthetic satisfies only a design marked not for manufacture. Out of scope: the content of a real board's record and extract, which that board's design task authors.
