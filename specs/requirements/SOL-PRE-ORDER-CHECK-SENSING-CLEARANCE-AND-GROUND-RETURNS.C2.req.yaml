id: SOL-PRE-ORDER-CHECK-SENSING-CLEARANCE-AND-GROUND-RETURNS.C2
type: criterion
title: A connector with fewer ground returns than the declared ratio for its signals fails
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The board rules record's ground_returns mapping holds ground_classes and, per signal net class, a minimum ratio of signal pins to ground-return pins with the ratio's source; it may state none explicitly, and a missing mapping, a ratio without its source or an empty rule fails. The rule counts per connector, a connector being a part whose reference designator begins with J, the signal pins and the pins on a ground class, and fails a connector below the declared ratio for its signal class. Out of scope: signal integrity analysis beyond the declared ratio and parts that are not connectors.
