id: SOL-PRE-ORDER-CHECK-SENSING-CLEARANCE-AND-GROUND-RETURNS.C2
type: criterion
title: A connector with fewer ground returns than the declared ratio for its signals fails
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  The board rules record's ground_returns mapping holds ground_classes, the net classes that are returns, non_signal_classes, the net classes such as power rails and Mains whose pins the ratio does not apply to, and signal_classes, a list with one entry per signal net class, each holding class, signal_pins_per_return (a positive whole number, the most signal pins one ground-return pin may serve) and source; it may state none explicitly, and a missing mapping, an entry without its source or a non-positive or non-whole signal_pins_per_return, or an empty rule, fails. The rule counts per connector, a connector being a part whose reference designator begins with J, the signal pins, being pins on a net of a signal class the mapping declares, and the pins on a ground class, and fails a connector whose signal pins exceed its signal class's signal_pins_per_return times its ground-return pins, compared exactly on whole pins, so a connector with signal pins and no ground-return pin fails. A connector pin on a class declared none of ground, signal or non-signal fails, a connector that carries several signal classes is held to the smallest signal_pins_per_return among them, and a design with no connector is not failed for that. Out of scope: signal integrity analysis beyond the declared ratio and parts that are not connectors.
