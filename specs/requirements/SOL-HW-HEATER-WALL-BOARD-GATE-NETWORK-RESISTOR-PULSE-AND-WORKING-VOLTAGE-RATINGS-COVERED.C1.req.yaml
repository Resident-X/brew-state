id: SOL-HW-HEATER-WALL-BOARD-GATE-NETWORK-RESISTOR-PULSE-AND-WORKING-VOLTAGE-RATINGS-COVERED.C1
type: criterion
title: The set of mains gate-network resistors is derived from the schematic nets and stated as closed
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  The board's records state which resistors are mains gate-network resistors, defined as every resistor with a pad on a net between an opto-triac output and a triac gate, derived from the schematic's references and the parts record, and state that list as the complete set; a resistor in a gate network on any sheet that is missing from the list fails the criterion. Out of scope: resistors outside a gate network and any change to the circuit.
