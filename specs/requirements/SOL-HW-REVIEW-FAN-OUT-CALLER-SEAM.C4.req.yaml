id: SOL-HW-REVIEW-FAN-OUT-CALLER-SEAM.C4
type: criterion
title: A caller's rendered record is written into the output folder after the merge and named in the report
status: active
version: 3
measurement_type: binary
verification: test
text: |-
  A caller may supply a function of the review folder and the merged tables that returns file names with their text. The driver calls it before writing anything, then writes each file into the output folder after the merge and lists the names it wrote in the record it writes and in its report, in text and in JSON with the same content. It accepts a name only if it is one plain component of ASCII letters, digits, full stops, underscores and hyphens that begins with a letter or digit and ends in neither a full stop nor the suffix the driver gives its own scratch files, and refuses any other name. It also refuses a name that, compared without regard to case, equals a name the driver itself uses in the output folder or another name rendered in the same merge, and a name that the output folder already holds unless an earlier merge wrote it and it is still a regular file, which the driver knows from the list of rendered names in the record that merge wrote, so a merge after running named units again replaces the files the earlier merge wrote and never a file put there by anyone else, nor one that has since become a link or a folder. A function that raises fails the run naming the caller, after the record in table form is written and with the report naming the earlier merge's rendered files as not of this merge. A caller that supplies none writes no file beyond the record in table form. Out of scope: the content of any rendered record.
