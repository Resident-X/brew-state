id: SOL-PRE-ORDER-CHECK-DECOUPLING-PINTYPE-SKIPS-PART-WITH-NO-SUPPLY.C1
type: criterion
title: A part whose catalogue entry's published category is in the closed no-supply list and none of whose pads is typed power is not refused, and any other integrated circuit without a typed supply pad still is
status: active
version: 1
measurement_type: binary
verification: test
text: |
  On a synthetic design not marked not for manufacture with a synthetic extract, a U-referenced footprint with netted pads and none typed power input or power output passes decoupling_pintype when its position's catalogue number maps to an extract entry whose category is one of the closed list of no-supply categories. The same footprint fails, naming the position, when it is a real integrated circuit: its entry carries a regulator category or a gate-drive optocoupler category, or its entry has no category, its category is outside the list, its lcsc is none, its number is absent from the extract, or no extract can be read. The skip changes no other circuit's decoupling measurement, and every design that passed before still passes. The main board's records and the decoupling via measurement are out of scope.
