text: |-
  C606 is a 0402 part, U520 is the UMW 74LVC1G17, the headers J622, J623, J627 and J628 carry a 1x2 part number, and the reed J862 is absent from the placement file and the parts list and carries a fitting note stating its lead and pitch checks, in the schematic, the parts list and the placement file alike. A part that differs in any of the three fails. Out of scope: the mains parts and the supplier's stock.
