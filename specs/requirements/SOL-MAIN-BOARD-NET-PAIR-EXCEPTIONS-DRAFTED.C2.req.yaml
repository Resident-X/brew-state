id: SOL-MAIN-BOARD-NET-PAIR-EXCEPTIONS-DRAFTED.C2
type: criterion
title: Every net a net-pair entry lists is a Mains-class net of the main board
status: active
version: 2
measurement_type: binary
verification: inspection
text: |-
  Inspected against the main board's branch (the board is not tracked on this base), each net named in nets_a or nets_b of the committed record's net-pair entries is one of the Mains-class patterns of the main board's project file, written with its sheet prefix as the netlist writes it. A test of the committed record checks only that each name has the form of a net name and that no net repeats within a list. Out of scope is a net the entries do not name.
