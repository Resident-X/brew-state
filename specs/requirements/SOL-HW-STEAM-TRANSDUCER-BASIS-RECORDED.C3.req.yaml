text: |-
  State in controller-board-design-constraints.md the check that the chosen part's own datasheet gives proof and burst pressures at or above the stated ratings and a range that meets the accuracy, that the figures are recorded against the part with their source, and that the pending mark held against the steam-path pressure transducer cites the recorded basis. Out of scope - reading any datasheet.
