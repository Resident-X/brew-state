id: SOL-HW-REVIEW-FAN-OUT-DRIVER.C6
type: criterion
title: The merge keeps each table's columns and verdicts, renumbers this round's findings only, reports findings that concern one place, and does not depend on arrival order
status: active
version: 3
measurement_type: binary
verification: test
text: |
  Over synthetic unit results and a synthetic caller, the merge rejects a table with a column the caller's table does not have and a verdict outside the caller's set, replaces every finding number a reviewer wrote with the number the checklist's order gives and rewrites the citations of them in the verdict rows, leaves a citation of an earlier round's finding as written, tells the two by the round each citation carries against the round the caller names as this one, and refuses a citation of an earlier round's finding that the review folder's earlier rounds do not hold, reports two findings that the caller's key assigns to the same item or place and keeps both, and gives the same record for every order the units arrive in. For a caller that declares no findings table nothing is renumbered. It reads no model and no file outside the unit results and the review folder. Out of scope: what a caller's tables must cover and whether a verdict is right.
links:
