id: SOL-HW-REVIEW-FAN-OUT-LAYOUT.C8
type: criterion
title: A fanned-out blind review of the layout review proof's seeded copy meets the kit's pooled criterion against the recorded single-reviewer runs
status: active
version: 3
measurement_type: binary
verification: demonstration
text: |-
  Run the fanned-out form of the layout review once on a seeded copy of the layout review proof design, from the review folder the folder command assembles with the design from the seeded copy's repository and commit kept by the seeding command's opt-in flag, in sessions with no record of the seeds, at the full group count with the groups running together and the replicas the design-loop round uses, and judge it against the recorded single-reviewer runs of the same seeded copy, model and tool commit by the kit's pooled criterion with a cost multiple of 1.25: the seeds found are no fewer than the fewest any recorded single run found, no seed every single run found is missed, the wall time is at most half the single mean and the cost at most 1.25 times its mean. The record gives every seeded defect reported as a finding against the catalogue item that covers it, the findings that match no seed, the verdicts item by item with a difference explained, each session's time, tokens read, written and generated, cost, first-call cache read and document retrievals with any that failed, any call refused for a rate limit, and the replicas that raised each seed; the layout caller's bound on groups at once is set from it. The pre-order round's three replicas are run once and their figures recorded. The single reviewer is not run again. A seed not reported is closed where the gap lies, a catalogue amendment, a correction to the review step or to what it gives a reviewer, and the run repeated in a new session. The evidence names the exact model and the commit. Out of scope: the schematic, critical-routing and production-files proofs.
