id: SOL-HW-REVIEW-FAN-OUT-LAYOUT.C8
type: criterion
title: A fanned-out blind review of the layout review proof's seeded copy finds every seed the single-reviewer form finds, in no more time and at no more cost
status: active
version: 2
measurement_type: binary
verification: demonstration
text: |
  Run the single-reviewer form and the fanned-out form on one seeded copy of the layout review proof design from the review folder the folder command assembles from the seeded copy's repository and commit, both forms with the same four tools, in sessions with no record of the seeds, the fanned-out form at the full unit count with the reviewers running together. The fanned-out form reports every seeded defect as a finding against the catalogue item that covers it, and every seed the single reviewer reports; the findings that match no seed and the verdicts item by item are compared and a difference explained. Record for the setup and each unit and for each run the wall time, the tokens read, written and generated, the cost, the document retrievals and any that failed, and any call refused for a rate limit, and set the layout caller's bound on reviewers at once from that. The fanned-out run takes no more time and costs no more than the single-reviewer run. A seed not reported is closed where the gap lies, a catalogue amendment, a correction to the review step or to what it gives a reviewer, and the run repeated in a new session. The evidence names the exact model and the commit. Out of scope: the schematic, critical-routing and production-files proofs.
