id: SOL-HW-MAIN-BOARD-SCHEMATIC-OPEN-FINDINGS-CLOSED-BEFORE-ORDER.C6
type: criterion
title: The coil flyback pulse is held to the zener's published pulse curve from a measured or bounded coil inductance
status: deprecated
version: 1
measurement_type: binary
verification: analysis
scope: 'Out of scope: choosing a different zener unless the bound exceeds the curve, and bring-up measurement of the pulse.'
text: |
  The inductance of the pump coil the zener protects is measured on the owner's coil, or bounded from a stated source. The flyback pulse is L x 6.159 ms per henry, compared with the zener datasheet's pulse-power curve, which stops at 10 ms (about 1.6 H). Where the bound exceeds the curve, the record states how the pulse is judged beyond it. The record's present worst case of 4.73 H is compared with the curve and the result stated.
  Out of scope: choosing a different zener unless the bound exceeds the curve, and bring-up measurement of the pulse.
links:
  - target: SOL-HW-MAIN-BOARD-SCHEMATIC-OPEN-FINDINGS-CLOSED-BEFORE-ORDER
    type: criterion-of
attributes:
  deprecation_reason: The criterion asked for a coil inductance measured on the owner's coil or bounded from a stated source; the maker's sheet prints no inductance and no other source bounds it, so the record carries it to a reading instead. The owner signed this off in session. Its successor C9 states what the record does.
