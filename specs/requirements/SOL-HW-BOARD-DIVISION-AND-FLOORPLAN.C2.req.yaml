id: SOL-HW-BOARD-DIVISION-AND-FLOORPLAN.C2
type: criterion
title: A block-level floorplan per board shows it fits the enclosure as found, with the large parts, mounting, interlock and mains separation placed
status: active
version: 1
measurement_type: binary
verification: analysis
text: |-
  Each board has a dimensioned block-level floorplan drawn against the controller enclosure, mounting and installed-part clearances recorded from the machine as found. Each floorplan places the board outline, its mounting points, its large parts, every connector, and a block for the proof-of-life interlock, sized with its stated basis. The interlock block sits on the board or assembly that carries the heater drive it gates, and every heater-drive path crosses it, so no path to a heater bypasses the block. Mains-referenced blocks are kept apart from low-voltage blocks by at least the clearance and creepage of the machine's separation basis. Every board fits inside the usable envelope with those clearances held. A board that does not fit is a failed outcome, not a note. The floorplan's dimensions are stated in text beside any drawing, so a builder holding only the repository and free tools can check the fit. Out of scope: component-level placement and routing, which each board's design task does.
