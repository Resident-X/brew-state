id: SOL-HW-BOARD-DIVISION-AND-FLOORPLAN.C2
type: criterion
title: A block-level floorplan per board shows it fits the enclosure as found, with the large parts, mounting, interlock and mains separation placed
status: active
version: 2
measurement_type: binary
verification: analysis
text: |-
  Each board has a dimensioned block-level floorplan drawn against the controller enclosure, mounting and installed-part clearances recorded from the machine as found. Each floorplan places the board outline, which need not be rectangular, its mounting points, its large parts, every location-dependent part at its recorded position (the reed element's lower lead at X = 122 mm, Y = 17.5 mm and its upper lead 20 mm above it, within 1 mm), every connector, and a block for the proof-of-life interlock, sized with its stated basis. The interlock block sits on the board or assembly that carries the supply path of the heaters it gates, and every path that powers a heater crosses it in series, so a shorted heater switch is still removed; a block on a low-voltage signal line that a shorted switch bypasses does not meet this. The record shows the actual supply path the block interrupts and states which board carries mains as a result. Each heater's element lead keeps its female terminal and plugs onto an in-line blade joiner, so no board tab is needed for it; the current goes out through the enclosure wall on a new wire to the heater wall board's switch and returns on a new wire to a neutral landing on the main board, and the record sizes the copper that carries the heater current for the element current at 1 oz and shows where the interlock sits on that path. Heat sources are placed against the enclosure air temperature the machine record assumes, kept apart from each other and from parts that derate with heat. A part the owner hand-fits has hand access marked and is not counted in machine assembly. A snubber, where one is fitted, sits beside the switching device it protects. Mains-referenced blocks are kept apart from low-voltage blocks by at least the clearance and creepage of the machine's separation basis. Each block's area includes a stated allowance for the support parts inside it that no part selection has yet named (decoupling and bulk capacitors, pull resistors, input protection and the like), with its basis: the passive counts of the reference designs the function-forms record cites and the per-channel passives it states; a block area that is an estimate is marked as one. Every board fits inside the usable envelope with those clearances held. A board that does not fit is a failed outcome, not a note. The floorplan's dimensions are stated in text beside any drawing, so a builder holding only the repository and free tools can check the fit. Out of scope: component-level placement and routing, which each board's design task does.
