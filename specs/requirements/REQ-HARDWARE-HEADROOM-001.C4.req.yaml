id: REQ-HARDWARE-HEADROOM-001.C4
type: criterion
title: Software written before the controller is selected does not narrow which controllers can run it
status: active
version: 1
measurement_type: binary
verification: analysis
text: |
  A capability that only some candidate parts provide, required by software
  written while the choice is still open, settles that choice without anyone
  deciding it, and surfaces much later as a part that will not do for a reason
  nobody was looking at. The arithmetic the software is written in is one such
  capability.

  The implementation behind the hardware seam is tied to a part deliberately and
  is out of scope here, as are which controller is eventually selected and what
  the software costs in time on it.
