id: SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C7
type: criterion
title: The layout passes the layout checklist, read from rendered views of every layer and every critical net, with the findings recorded and resolved
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  The review uses views of every layer and every critical net, closes on a clean full round by a reviewer that did not draw the board, and its findings are recorded and resolved. Ordering the board is out of scope. The layout carries every part and net the schematic's verdicts settled for the interlock, its series element, the barrier parts and the entry; a departure is a finding recorded and resolved. Each schematic-review finding the owner's recorded decision carries to this review is read against the finished layout and its disposition recorded: where the surge clamp at the cable connector sits and which parts share its net, how close the data-line clamp sits to the receptacle, whether the service level the owner declares needs a clamp on the panel keys and knobs, whether the entry's filtering meets the emission limit where one is stated and that none is stated where it is not, the copper that sets the heat rise of the pump triacs and the current rating of the tabs and the mains jumper, and the drawing defects found when the sheets are rendered again.
