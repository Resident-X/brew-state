text: |-
  The review uses views of every layer and every critical net, closes on a clean full round by a reviewer that did not draw the board, and its findings are recorded and resolved. Ordering the board is out of scope. The layout carries every part and net the schematic's verdicts settled for the interlock, its series element, the barrier parts and the entry; a departure is a finding recorded and resolved.
