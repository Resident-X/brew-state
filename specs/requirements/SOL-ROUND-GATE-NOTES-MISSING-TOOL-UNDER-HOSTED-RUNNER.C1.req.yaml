id: SOL-ROUND-GATE-NOTES-MISSING-TOOL-UNDER-HOSTED-RUNNER.C1
type: criterion
title: The gate notes a task's missing-tool marker line whether or not the task runner colours its output
status: active
version: 1
measurement_type: binary
verification: test
text: |
  The round gate's run of a task notes the line the task writes to standard error that begins with the missing-tool marker whether or not the task runner colours its output, with colouring forced as the hosted runner's CI setting does and with it cleared, so a board tool absent on the hosted runner is reported as absent in both the round and the night. The line is still passed through to standard error unchanged. The test of this runs the real task runner on a throwaway task under both settings and fails if either does not note the line, and a pure case feeds the gate a marker line preceded by an escape sequence. Out of scope: other tests in the round gate's suite and what the gate does with a noted marker.
