id: SOL-HW-REVIEW-KIT.C11
type: criterion
title: The task runner and hardware notes describe the command, and a test reads every review task's description from the parsed file
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The task runner's description of the command and the hardware notes' section on it say that it runs a declared review as forks of one shared context, that it is on demand and in neither the build round nor the nightly, that it needs the agent command line on the path and logged in, that the command line's name is read from one environment variable, what the report records, what a start report cannot show or exclude, and that the model flag takes a full model id; the descriptions of the board tooling's tests and the list of tested tools name the kit's tests. A test parses the task runner's file and finds each review task's description. A test reads each place for these clauses. Out of scope: the earlier driver's removal, which the layout solution's last criterion makes when the last caller has moved, and the callers.
links:
  - target: SOL-HW-REVIEW-KIT
    type: criterion-of
