id: REQ-PREENERGISATION-VERIFICATION-001.C5
type: criterion
title: Verification carried out away from the machine binds the machine's behaviour
status: active
version: 1
measurement_type: threshold
verification: test
text: |
  The control law is exercised before the machine exists, which means exercising
  it somewhere the machine is not. A result obtained there carries only as far as
  the two agree: where the same description and the same inputs produce different
  answers in each, the verification standing between a fault and an energised
  machine is weaker than it reads.

  The agreement required is declared rather than assumed, and is judged across the
  behaviour rather than at its end. Out of scope: whether the model resembles a
  real machine, which no amount of agreement between two computations of the same
  equations can establish.
