id: SOL-PRE-ORDER-CHECK-SEPARATION-FLOOR-AND-MOUNTING-HOLES.C3
type: criterion
title: The rules extend the existing pre-order check and its record reader
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  The separation-floor rule and the mounting-hole rule are added to the existing pre-order check as further rules, run by the same one task-runner command, each reading only the design's files and the records the design is held to. The check's record reader already accepts the separation basis keys overvoltage_category, altitude_m and barrier_types and the table rows; this leaf extends it to return those inputs and rows to the rules, and the reader still fails a key the decisions do not define. Out of scope: a second tool, a parallel reader, any read of firmware source, and applying the rules to a real board's own records, which is that board's design task.
