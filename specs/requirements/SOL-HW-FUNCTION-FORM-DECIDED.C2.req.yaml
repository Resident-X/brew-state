id: SOL-HW-FUNCTION-FORM-DECIDED.C2
type: criterion
title: A part placed outside the enclosure or off the boards is judged for drop-in fit and for its rated temperature
status: active
version: 1
measurement_type: binary
verification: analysis
text: |-
  For every function whose chosen form places a part outside the controller enclosure or off the boards, such as the heater switching devices mounted on the machine's wall, the record states whether the replacement still drops into the machine as found or the part is a device the retrofit adds and so falls outside that requirement's scope, with the reason, and states where that part is judged against its rated temperature, including any heat it passes into the enclosure through a shared wall, against the enclosure air temperature the constraints record holds, cited with its grade as an assumption that bring-up measures, so the judgement is not read as resting on a measured figure. A placement with no drop-in judgement or no thermal judgement fails. Out of scope: the heatsink and wall thermal design itself, which belongs to the design task for the board or assembly carrying the part; parts that stay on a board inside the enclosure.
