id: REQ-SAFETY-CHAIN-001.C4
type: criterion
title: Once the non-restoring protection has operated, no resettable element can return power to the load
status: active
version: 2
measurement_type: binary
verification: test
text: |
  Resettable protection can weld or drift, and anything that closes again after cooling gives a failing machine repeated attempts at the same hazard.

  Once it operates the machine stays off until a person intervenes, which forces someone to find out why.
