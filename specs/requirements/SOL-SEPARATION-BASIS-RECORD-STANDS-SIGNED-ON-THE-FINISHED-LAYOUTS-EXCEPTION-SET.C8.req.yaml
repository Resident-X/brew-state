id: SOL-SEPARATION-BASIS-RECORD-STANDS-SIGNED-ON-THE-FINISHED-LAYOUTS-EXCEPTION-SET.C8
type: criterion
title: The main-board records, the machine-record documents and the pull request text state the basis and the derating policy as signed
status: active
version: 4
measurement_type: binary
verification: inspection
text: |-
  Inspection of every document in the main-board folder (apart from the frozen rounds of the layout and schematic review records), the machine-record folder and the pull request text finds each statement of the signature state of the separation basis or the derating policy saying they are signed by the owner, on his written instruction entered by Claude (the separation basis on 2026-11-05, re-signed on 2026-11-06 and accepted again by the owner in the working session on 2026-11-18, the derating policy on 2026-11-05), with the owner's further acceptances of the basis on 2026-11-07 and on 2026-11-14 stated as history that the acceptance of 2026-11-18 superseded on every entry, and none saying they are unsigned or drafts until the owner signs, and none stating the earlier days or the split of the entries across them as the days the record or an entry now carries; the pairs and positions those statements name are the entries the records hold: 42 exception entries in the basis, every one dated 2026-11-18 as the record's own date is, and ten in the derating policy. The frozen review rounds keep the state they were reviewed at and the review-history check still reads the layout review as valid. Out of scope is any document outside those named.
