id: SOL-SEPARATION-BASIS-RECORD-STANDS-SIGNED-ON-THE-FINISHED-LAYOUTS-EXCEPTION-SET.C8
type: criterion
title: The main-board records, the machine-record documents and the pull request text state the basis and the derating policy as signed
status: active
version: 3
measurement_type: binary
verification: inspection
text: |-
  Inspection of every document in the main-board folder (apart from the frozen rounds of the layout and schematic review records), the machine-record folder and the pull request text finds each statement of the signature state of the separation basis or the derating policy saying they are signed by the owner, on his written instruction entered by Claude (the separation basis on 2026-11-05 and re-signed on 2026-11-06, the derating policy on 2026-11-05), with the owner's further acceptances of the basis on 2026-11-07 and on 2026-11-14, and none saying they are unsigned or drafts until the owner signs; the pairs and positions those statements name are the entries the records hold: 42 exception entries in the basis, of which 23 are dated 2026-11-06, 3 are dated 2026-11-07 and 16 are dated 2026-11-14 (the record's own date being 2026-11-14), and ten in the derating policy. The frozen review rounds keep the state they were reviewed at and the review-history check still reads the layout review as valid. Out of scope is any document outside those named.
