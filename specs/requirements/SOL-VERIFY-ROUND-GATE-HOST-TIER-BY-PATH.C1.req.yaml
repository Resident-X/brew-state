id: SOL-VERIFY-ROUND-GATE-HOST-TIER-BY-PATH.C1
type: criterion
title: The round gate runs the host tier and the emulation tier only for changes each exercises
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A task-runner command for the build round, declared under the name the project's instructions and the operator build skill use for a build round's gate, runs every build, every build-time check, every host test and every host executable under the sanitizers when the branch, measured from its merge-base with the remote-tracking main and including uncommitted changes and new files not yet committed, touches anything the host tier reads: the firmware tree as a whole, the task-runner declaration, the automation workflow declarations the firmware tooling's tests check, and the other files those tests open. A branch that touches none of them runs no part of the host tier, and the command says so and names the changed paths it judged by. It runs the emulation tier when the branch touches anything the emulation tier reads: the firmware tree as a whole (its sources, headers, parameter descriptions and declarations, build configuration, the tooling the build and the emulation suite load, and the suite itself), the documentation records the emulation suite checks against, and the task-runner declaration. The two sets of paths are each declared once, beside the command. When the host tier fails, the command stops there and states that the tiers after it were not reached. The command's exit status is its verdict: it fails when any tier it ran fails and passes when every tier it ran passes, a correctly skipped tier included. It states which tiers it ran and, for each it skipped, why, in statements a gate worker with no knowledge of the task layout can report from directly. It never runs the full mutation sweep. The complete verification keeps its own declaration of every gate. The gate's declaration admits further round-scoped checks beside its tiers, the way the changed-lines sweep and the board check are added. The selection is a cost measure, not a trust boundary: it guards its measurement against unusually configured repository state, a stale remote-tracking main is kept rare by branching from a freshly fetched main rather than checked for, and it does not defend against a producer that rewrites the hooks, configuration or refs of the tree it runs in. A change that escapes the selection meets the reviews before it merges and the nightly complete verification after. Out of scope: selecting individual tests within a tier, and the changed-lines sweep and board check themselves.
