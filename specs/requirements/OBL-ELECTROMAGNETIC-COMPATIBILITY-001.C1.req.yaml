id: OBL-ELECTROMAGNETIC-COMPATIBILITY-001.C1
type: criterion
title: Disturbance the controller emits is limited at its sources by design
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Filtering at the supply inlet, and the layout practice that bounds switching loops, edge rates and the paths noise currents take, are each shown present in the design. Measured emission levels are out of scope here, since measuring them needs instruments a builder without a laboratory does not have.
