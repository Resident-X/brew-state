id: SOL-HW-CONTROLLER-BOARDS-ORDERED.C1
type: criterion
title: Each board's production files are checked against the manufacturer's assembly preview and the quoted cost of the order is recorded against the running total before payment
status: active
version: 1
measurement_type: binary
verification: inspection
text: |-
  Each board's check compares every placed part with the preview, and payment waits until every row of both boards' tables matches. The quoted cost of the order is recorded against the running total of the declared spend before the order is placed. Payment is the owner's and out of scope.
