id: SOL-HW-REVIEW-FAN-OUT-CRITICAL-ROUTING.C2
type: criterion
title: The merged pass gives every item one verdict row, renders those bearing on no critical net as the list, and is read by the placement and critical routing history command as a single reviewer's pass is
status: active
version: 4
measurement_type: binary
verification: test
text: |
  Over synthetic unit results, the merge fails naming an item that has no verdict row and an item given twice; it fails a pass whose number, commit judged or views are missing or malformed; and it renders the pass in the form the method gives for the plan's critical routing section as a file in the output folder, which the check's runner appends below the earlier passes and never in place of one. A plan holding the rendered pass appended to a synthetic plan and a hand-written pass are passed through the reader the board placement and critical routing history command uses, and what it reads from the two has the same shape. It fails a finding on an item that does not fail, a fail that cites another item's finding, a finding with no what and where, an item that bears on no critical net given without a reason, and a pass in which no item bears on a critical net; and the caller refuses, before any session starts, a review folder whose round file is not a pass's, one holding a kind or check lines. It fails a pass that still holds a cannot judge, naming the item and the view it needs, and renders a resolved one as `cannot judge, then <verdict>`; a fail is rendered as a plain fail for the designer to put right in the row before the router runs. A replica's `bears on no critical net` gives way to another replica's verdict for the same item. Out of scope: whether a verdict is right and the history command's checks of the repository's history.
