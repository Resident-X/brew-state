id: SOL-PLANT-STEAM-FLASH-GENERATOR.C2
type: criterion
title: A held liquid inventory separates the trapped shut block from a dry one
status: active
version: 2
measurement_type: binary
verification: test
text: |
  The thermoblock structure carries a held liquid inventory state in millilitres, bounded by a declared capacity: commanded feed raises it up to the capacity, the steam made through the open wand (the made rate of C1) lowers it, and it never goes below zero or above the capacity. With the wand shut nothing is made and nothing leaks, so a shut block keeps its inventory. The initial inventory is a declared parameter between zero and the capacity, carrying its origin, and defaults to the water the tube keeps from its last use. A description declaring an initial inventory above the capacity is refused wherever a model is built from the description, at load and at model construction, naming the parameter, and is not clamped. Saturation pressure at the casting temperature applies only while the inventory is above zero with the wand shut; a shut block whose inventory is zero reports zero gauge pressure and not saturation at its casting temperature, however hot the casting is, as a stated model simplification that is conservative for the ceiling. The condition ends when the wand opens and the orifice law takes over; every surface that reads steam pressure (the sensed reading, the estimator, the host run) reads the single pressure the structure reports for the current step, and the step is single-threaded so no concurrent act can see two. Tests cover a block declared to start with no inventory and never fed, a shut block fed to its capacity (the inventory clamps and the structure stays admissible), and an open-then-shut transition. Out of scope: the hardware layer that contains trapped pressure without power, sensing or command, which DEL-HW-DESIGN-CONSTRAINTS.C6 owns.
