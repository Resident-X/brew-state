id: SOL-PLANT-STEAM-FLASH-GENERATOR.C2
type: criterion
title: A held liquid inventory separates the trapped shut block from a dry one
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The thermoblock structure carries a held liquid inventory state: commanded feed raises it, boiling at the rate the steam-side energy balance turns water to steam lowers it, and it never goes below zero. Saturation pressure at the casting temperature applies only while the inventory is above zero with the wand shut; a shut block whose inventory has reached zero reports no saturation pressure from its casting temperature, however hot the casting is. The condition ends when the inventory reaches zero by boiling or when the wand opens and the orifice law takes over; every surface that reads steam pressure (the sensed reading, the estimator, the host run) reads the single pressure the structure reports for the current step, and the step is single-threaded so no concurrent act can see two. Tests cover a shut block that is fed then left to boil dry, a shut block never fed, and an open-then-shut transition. Out of scope: the hardware layer that contains trapped pressure without power, sensing or command, which DEL-HW-DESIGN-CONSTRAINTS.C6 owns.
