id: REQ-ELECTRICAL-INSTALL-001.C16
type: criterion
title: A spacing shortfall a part's geometry forces is passed only as an exception the owner has signed for that pair
status: active
version: 3
measurement_type: binary
verification: analysis
text: |
  Where a part's own geometry leaves less than a distance the separation basis states, whether between mains and low voltage or between conductors at different mains potentials, the owner accepts the shortfall for the one pair of pads or nets concerned, stating the least distance accepted, the owner's ground and the independent element that bounds the fault the shortfall could cause. An element is independent when a fault of the pair does not also defeat it, which means it is independent of the pair and of the mechanism that fails the pair. Where the bounding element acts only when the controller commands it, the acceptance also names the detection of the fault and the disconnection that follows it, which the machine's confirmation of its outputs provides (REQ-ACTUATION-CONFIRMATION-001.C6), and states what that detection resolves and what it does not. Another pair involving the same part is not excused by it. An acceptance that is unsigned, that names a pair showing no shortfall, or that covers a distance greater than the one actually left is not an acceptance, and a shortfall without one is not passed.
