id: SOL-BOARD-HISTORY-CHECK-PASSES-ON-THE-MAIN-BOARD-AFTER-ITS-FOLDER-RENAME.C3
type: criterion
title: An earlier design that reused a board's folder name is not that board's history
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A test on a throwaway repository, using generic names, shows that when an earlier design's commits on the branch's line of history hold a board at a folder name that a later board then reuses, the history command judges the later board from the commit that first holds that board and not from the earlier design's commits, in plain and in routed mode and in its text and JSON output, and that the earlier design's copper does not stand as the later board's first copper. The same repository with the later board's own placement record misordered still fails. Out of scope: judging the earlier design.
