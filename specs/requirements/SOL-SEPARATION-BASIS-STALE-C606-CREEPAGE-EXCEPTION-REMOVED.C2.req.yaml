id: SOL-SEPARATION-BASIS-STALE-C606-CREEPAGE-EXCEPTION-REMOVED.C2
type: criterion
title: The tests and records that restate the record's entry count or the pair agree with it
status: active
version: 1
measurement_type: binary
verification: test
scope: Statements of the count or of this pair; wording unrelated to them stays.
text: |-
  Every test and every record under the repository that states the number of the record's exceptions as 33, or lists the C606 pair among them, states 32 and omits the pair, and the record-reading tests pass on the committed record. The finished header item's criterion that restates 33 (SOL-SEPARATION-BASIS-HEADER-STATES-THE-COAT-AFTER-BRING-UP-AND-THE-RE-SIGNING.C2) is not edited and stands superseded by this item, so a test that traces it states 32 and names this item as the superseding one. Out of scope: statements of the count or of this pair; wording unrelated to them stays. The record's test fails on a record whose top-level accepted_on or any entry's accepted_on differs from 2026-11-06, and on a header that does not state the removal of the C606 entry and the owner's instruction.
links:
