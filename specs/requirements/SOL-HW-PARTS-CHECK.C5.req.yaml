id: SOL-HW-PARTS-CHECK.C5
type: criterion
title: Every tracked design passes the parts check, and a change to a specification record or catalogue extract re-runs the board tier in the build round
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Every board design the repository tracks, both throwaway designs included, carries a synthetic specification record and a synthetic catalogue extract and passes the parts check, and the round gate runs its board tier on a change to any specification record or catalogue extract. Out of scope: the content of a real board's records and extract, which that board's design task authors.
