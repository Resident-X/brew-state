id: SOL-HW-REVIEW-KIT.C6
type: criterion
title: Units are planned into coupled groups under a flat plan, and a scheduler bounds the sessions and appends a step for each failure
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Over synthetic declarations, units a caller declares as coupled are in one group; units are packed so that no group's expected output exceeds the largest single unit's; and the plan record lists every node with its role, parent, group, replica and attempt, the hash of each prefix, the session specification, the predicted cost and time with the prices and rates they used, the agent command line's version and the tool commit. The same declaration gives the same plan. Over synthetic catalogues, the plan has one shared context and one fork per group and replica; the plan record holds the saving a tree would give and the threshold it was compared with; and a shared context larger than the declared context budget is refused naming its size and the budget before any session starts. Against the stub with sleeping sessions and an injected clock, the shared context is started once and before every fork, no more than the stated number of sessions run at once however many units there are, a bound below one is refused, and the record is the same for every order the stub finishes the sessions in. Against the stub, a fatal result appends a fresh fork of the same parent as the next attempt of the unit, a local problem appends a repair turn in that unit's own session, a rate limit waits on the clock and retries the same node, and a unit still holding a problem after its stated number of attempts is reported naming the unit and what it returned while the other units' results are kept. A verdict row of cannot judge in a unit's first answer appends one repair turn in that unit's own session, advising it to retrieve a document its Why asks for with the retrieval tool the caller grants and otherwise to keep the cannot judge naming the view it needs; the repaired answer stands whatever it says, so a cannot judge that remains is not a failed attempt and goes to the caller's resolution at the merge. Out of scope: classing the problems, which the results module does.
