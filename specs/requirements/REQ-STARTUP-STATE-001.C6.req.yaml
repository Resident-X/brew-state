id: REQ-STARTUP-STATE-001.C6
type: criterion
title: Power-on proceeds to readiness once the known safe state is established
status: active
version: 1
measurement_type: binary
verification: test
text: |
  An operator reaching for the switch has asked for coffee, and a machine that comes up inert and waits to be asked a second time has added a wait to every use of itself.

  This takes nothing from the known-state requirement it sits beside: heating begins from the established safe state rather than instead of it. Nor does it leave the machine holding heat indefinitely, because readiness reached this way expires on the same terms as readiness reached any other way.
links:
