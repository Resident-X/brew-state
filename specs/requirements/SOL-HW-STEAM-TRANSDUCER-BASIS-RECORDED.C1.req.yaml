id: SOL-HW-STEAM-TRANSDUCER-BASIS-RECORDED.C1
type: criterion
title: The in-service pressure the transducer must survive is recorded with its derivation, premise and grades
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  State in controller-board-design-constraints.md the in-service pressure of the steam path, 5 bar gauge, graded inferred, derived as the larger of the steam pump's over-pressure valve setting (opening at about 4 to 5 bar, positioned on the pump at its outlet and so limiting the feed pressure whether or not a check valve lies downstream) and the saturation pressure at the casting ceiling (under 4 bar gauge). State the premises with the grade of each and who stated it and when: the relief opens at no more than about 5 bar gauge (owner statement, 2026-10-11), the relief sees the pump outlet (owner statement, 2026-10-11) and the casting ceiling holds (a control limit); each marked as a premise the machine inspection confirms or revises. State that the absence of a check valve between the relief and the block is the owner's reasoning and is not a premise of this figure. Out of scope - the fault pressure at the thermostat trip, which the hardware pressure layer answers to.
