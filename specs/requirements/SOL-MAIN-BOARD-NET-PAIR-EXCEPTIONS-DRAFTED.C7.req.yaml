id: SOL-MAIN-BOARD-NET-PAIR-EXCEPTIONS-DRAFTED.C7
type: criterion
title: Each same-part entry states its ground and bounding element
status: active
version: 1
measurement_type: binary
verification: inspection
text: |-
  Each same-part between entry's reason names that the part's pitch forces the gap, that both pads are on nets of the neutral-referenced set with a working voltage under 10 V across the gap, and that the part is not changed, and its bounded_by names the energy limit of the circuit and the entry fuse for any path to the line. Out of scope is the owner's acceptance.
