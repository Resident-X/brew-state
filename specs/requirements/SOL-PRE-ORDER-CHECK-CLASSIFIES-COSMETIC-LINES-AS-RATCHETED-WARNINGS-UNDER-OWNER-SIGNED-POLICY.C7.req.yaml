id: SOL-PRE-ORDER-CHECK-CLASSIFIES-COSMETIC-LINES-AS-RATCHETED-WARNINGS-UNDER-OWNER-SIGNED-POLICY.C7
type: criterion
title: A routing-neatness line is a WARNING on any net when its class is marked WARNING
status: active
version: 2
measurement_type: binary
verification: test
text: |
  On a synthetic design whose signed policy marks a routing-neatness class WARNING, a line of that class on a mains net, on a sensing net, on a net of a critical class and on an ordinary net each prints as a WARNING line and is counted, none as a violation, and a clearance or creepage shortfall on the same net still fails under its own rule. Out of scope is a silkscreen or designator class.
