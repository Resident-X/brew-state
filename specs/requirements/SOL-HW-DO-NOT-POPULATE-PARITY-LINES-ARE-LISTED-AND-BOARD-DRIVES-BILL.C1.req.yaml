id: SOL-HW-DO-NOT-POPULATE-PARITY-LINES-ARE-LISTED-AND-BOARD-DRIVES-BILL.C1
type: criterion
title: The production parts list omits each part whose schematic symbol is marked do-not-populate
status: active
version: 2
measurement_type: binary
verification: test
text: |
  On a synthetic schematic with one symbol marked do-not-populate by attribute and one fitted, the parts list the production seed builds lists no row for the marked part and lists the fitted one. Out of scope is a symbol marked only by a text field, which the parts list does not read.
