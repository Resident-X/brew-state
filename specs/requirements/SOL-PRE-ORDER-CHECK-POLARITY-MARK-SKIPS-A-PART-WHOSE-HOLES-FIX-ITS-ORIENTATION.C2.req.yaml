id: SOL-PRE-ORDER-CHECK-POLARITY-MARK-SKIPS-A-PART-WHOSE-HOLES-FIX-ITS-ORIENTATION.C2
type: criterion
title: A polarised part with no pad numbered 1 whose through-hole holes a turn maps onto themselves fails polarity_mark
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A polarised part with no pad numbered 1 and only through-hole pads fails polarity_mark when a turn other than the identity maps its holes onto themselves in position and drill, as with four pads named A1, A2, 13 and 14 in a square, naming the part. Out of scope: which parts are polarised, the silk marks on the main board and the mark margin.
