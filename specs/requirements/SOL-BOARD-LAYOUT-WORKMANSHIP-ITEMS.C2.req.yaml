id: SOL-BOARD-LAYOUT-WORKMANSHIP-ITEMS.C2
type: criterion
title: The pre-order check measures every rule-kind workmanship item and fails a board that breaks one
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Extend the repository's pre-order check so that, for every board design it finds, it reads the board file with the check's existing board-file reader and measures each rule-kind workmanship item against the figure the board's rules give for it, failing the board on any breach. KiCad's own rule check cannot express qualities such as a corner's angle or a route's length against the straight-line distance it spans, so these are measured by the check itself, as a fourth form of rule beside the board-wide minimum, the net class's figure and the custom rule. Write that measured form into the method wherever the three forms are defined or relied on: the catalogue's definition of rule kind; the rules step, so each measured rule's figure is written with its source in the board's rules in a form the check reads, and the rules table states where it is set and what confirms it in effect; the review's basis for a rule-kind verdict; and the review's test of whether a finding can be a rule, so a finding a measurement can state becomes a measured rule. A board that gives no figure for a measured rule that applies to it fails the check, naming the missing figure. The report names the board, the item, the net, the place on the board and the measured figure against the allowed one, in terms a builder can act on. Every design committed to the repository, the gate's own proof design included, passes with the measures in force; a committed design that breaks one is tidied, and the gate's existing seeded-fault proof is shown still to pass afterwards. Each measure is shown by a test to fail on a fault seeded for it in a throwaway design built outside the repository and to pass on the clean one. Out of scope: judgement-kind items, which the layout review judges, and any change to KiCad's own checks.
