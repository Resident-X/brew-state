id: SOL-BOARD-LAYOUT-WORKMANSHIP-ITEMS.C2
type: criterion
title: The pre-order check measures every rule-kind workmanship item and fails a board that breaks one
status: active
version: 2
measurement_type: binary
verification: test
text: |
  Extend the repository's pre-order check so that every rule-kind workmanship item is in force on every board design it finds, and a board that breaks one fails. The items KiCad's own layout rule check can measure, the angle at a joint, the length of a segment and a via left unconnected, are custom rules in each board's rules file, so KiCad's check enforces them and the existing gate fails the board on any report; the check fails a board whose rules file carries no corner or jog rule, while the unconnected-via item needs none, since KiCad reports an unconnected via unaided. The items KiCad cannot measure, a track stub with one free end, a route's track length against the shortest straight-line tree joining its net's pad centres, a track's direction against the board's edges, a pad entered off its long axis, and a route narrowed partway along away from a pad, are measured by the check itself from the board file with its existing reader, against a figure the board sets as a project text variable: a fourth, measured form of rule beside the board-wide minimum, the net class's figure and the custom rule. The width rule fails only a narrowing: a route widened where there is room, as the power-path item asks, passes it. The geometry the route-length measure rests on, each pad's centre and the shortest straight-line tree joining a net's pads, is written once in its own module among the board tools, with its own tests, so the method's placement checkpoint can use it rather than build its own. A board that gives no figure, or a malformed one, for a measured rule fails the check, naming the missing figure, and the report states the figure it read for each measured rule. Write the measured form into the method wherever the three forms are defined or relied on: the catalogue's definition of rule kind; the rules step, so each figure is written with its source in the rules table, the table states where it is set and what confirms it in effect, and the step warns that a rule figure written with a unit KiCad does not accept drops the whole rules file; the review's basis for a rule-kind verdict; and the review's test of whether a finding can be a rule, so a finding a measurement can state becomes a rule in whichever form can enforce it. Each failure names the board, the item, the net, the place on the board and the measured figure against the allowed one, in terms a builder can act on. Every design committed to the repository, the gate's own proof design included, passes with the rules in force; a committed design that breaks one is tidied, and the gate's existing seeded-fault proof is shown still to pass afterwards. Each rule, KiCad's and measured alike, is shown by a test to fail on a fault seeded for it in a throwaway design built outside the repository and to pass on the clean one. Out of scope: judgement-kind items, which the layout review judges, and any change to KiCad's own checks.
