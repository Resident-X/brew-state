id: SOL-FW-CHANNELS-MAPPED-TO-THE-MAIN-BOARD-PINS-AND-COMPARED.C1
type: criterion
title: Each firmware channel the board wires carries its enumerator in the pin allocation record
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Every entry of the main board's pin allocation record whose channel the firmware drives or reads carries the firmware channel or firmware sensor key naming that channel exactly as the firmware's enumeration does, and an entry the firmware has no channel for carries neither. A test reads the record and the enumerations and asserts every enumerator is named by exactly one entry. Out of scope: moving any pin on the board.
