id: SOL-HW-REVIEW-KIT.C4
type: criterion
title: A recorded session is checked for its shape, cache miss, differing system prompt, re-opened artefacts and foreign citations, and its figures sum to the reports within two per cent
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Over recorded streams, the stream of a session that read documents in several calls and narrated between them fails the shape check naming the reason, the stream of the one-call acknowledgement passes, and a thinking block that carries text, a redacted one, and a text other than the acknowledgement each fail it. Over the recorded layout run whose forks made 390 opens of 91 distinct view tiles, the count of opens of artefacts held in the prefix and of new opens is the count the fixture states; a recorded verdict row that cites a view neither in the unit's prefix nor opened by it is flagged naming the row. Over the recorded streams of the live runs, a fork's cost and time are its reported figures less the parent's, because the command line reports them cumulatively, and its turns are as reported, because it reports a session's own, calls are counted by distinct message identifier, tokens are split into read from the cache, written to it, fresh and generated, and the sum of the sessions' own cost is within two per cent of the cost the runs' reports give. The run's figures give the sharing ratio, the tokens written in more than one session, the critical-path time and the predicted against the actual time and cost. A fork whose first call's cache read is below the parent's prefix size is flagged with both figures, the recorded probe in which the result-schema flag differed between root and fork is flagged, a fork that reads the prefix is not, and the streams of one review that carry different system prompts, or a fork whose system prompt differs from its parent's, are flagged naming the sessions; the recorded start reports of the earlier live runs, whose forks carried the setup session's rule, are fixtures the check rejects. The system prompt a session used is read from the transcript Claude Code writes for that session, found by the session's identifier, because the start report carries none. The fixtures are reductions of recorded sessions committed under the board tools' test fixtures, with image bytes replaced by their size and absolute paths of the recording machine scrubbed, made by a reduction tool whose own test shows no path or image byte remains; the narrated setup, the acknowledgement, the schema-flag cache miss, the layout run with its opens and the setup-rule start reports are among them. Out of scope: judging whether a run was worth its cost.
