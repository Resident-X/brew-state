text: |-
  hardware/README.md states, in its adopter steps, that pollution degree 3 is taken unless the enclosure protects the boards against moisture and that pollution degree 2 is credited, never 1, on the stated conditions with a coat only as a supporting measure, and describes the functional band rows of table_rows beside the record keys it lists. Out of scope is the net_pairs exception form, which the pre-order check leaf documents.
