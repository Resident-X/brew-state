id: SOL-HW-MAIN-BOARD-SCHEMATIC-OPEN-FINDINGS-CLOSED-BEFORE-ORDER.C4
type: criterion
title: The anode rail's fall at brown-out is bounded either by a clamp drawn on the board or by a recorded calculation
status: active
version: 1
measurement_type: binary
verification: analysis
scope: 'Out of scope: choosing the hardware, and the wall board''s design.'
text: |
  Before the boards are ordered, the fall of the anode rail that the wall board's indicators share is bounded, so that it cannot pull a controller pin beyond its limit while the controller's supply is falling. The bound is either a clamp diode footprint drawn on the board, or a recorded calculation showing the fall stays within the limit without one; the schematic holds no clamp now, and the choice between the two is recorded with the ground the owner gives.
  Out of scope: choosing the hardware, and the wall board's design.
