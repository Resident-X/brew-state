text: |
  State in the ambient section of reference-machine.md the lowest and highest room temperature the machine works across, 10 degC and 28 degC, with the builder as the source and the statement that it was declared from the room the machine stands in, not measured. Out of scope: the temperature inside the enclosure, which the measurement of the running machine establishes.
