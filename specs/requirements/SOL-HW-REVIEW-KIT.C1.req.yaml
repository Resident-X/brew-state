id: SOL-HW-REVIEW-KIT.C1
type: criterion
title: Every session of a review is started from one session specification, and a start report that differs from it fails the run naming the session
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Against the stub executor, the root, a fork, a repair turn and an adjudication turn of one review are each started with the same system prompt, appended system prompt, tool list, model and schema arguments, and differ only in the message and the resume and fork arguments; a specification that changes after the first session of a review has started is refused naming the field. The agent command line's arguments are built from the specification alone. Over recorded start reports, a session that reports other tools than the specification grants, another model, any MCP server, an instruction source the command line was asked to exclude or another working directory fails the run naming the session. Out of scope: the checks of a session's recorded stream, which the stream criterion covers.
links:
  - target: SOL-HW-REVIEW-KIT
    type: criterion-of
