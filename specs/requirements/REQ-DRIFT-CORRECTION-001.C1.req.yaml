id: REQ-DRIFT-CORRECTION-001.C1
type: criterion
title: A persistent bias in the prediction error is distinguished from transient excursions
status: active
version: 2
measurement_type: threshold
verification: test
text: |
  Every delivery produces a momentary divergence and none of them mean the machine has changed. Drift shows up as accumulated bias, not as any single large departure.

  Getting this wrong is costly both ways: reacting to noise degrades a correct description, and waiting for certainty means months of controlling against one already known to be doubtful.
