id: SOL-SEPARATION-BASIS-PUMP-TRIAC-EXCEPTIONS-FOLLOW-THE-LAND-DRAWN.C1
type: criterion
title: The record's pump-triac exceptions are those of the land the board draws, without a figure pinned by the package
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  accepted_exceptions holds four mains_to_mains creepage entries for the pump triacs, one for each of T701 and T711 for the tab pad (pad 2) against each outer lead pad (pads 1 and 3) of the two-lead land the main board draws for it, which has no middle-lead pad, each with accepted_mm 2.0, and holds no entry naming a pad the land lacks, so none for a pair of lead pads of one triac. Each such entry's accepted_mm equals the edge-to-edge distance between its two pads read from that land, to 0.01 mm, which is at or above the signed terminal clearance and under the signed creepage; it names the one pair of pads it excuses in between; its reason and bounding element are each non-empty and name the tab pad and the lead pad; and it carries the owner's accepted_by and accepted_on, dated no later than the record. A pair at or above the signed creepage has no entry. Out of scope: choosing a different triac, the owner's acceptance, the entries for R105 and the 1206 series resistors that their own leaves hold, and the mains-to-low-voltage entries.
