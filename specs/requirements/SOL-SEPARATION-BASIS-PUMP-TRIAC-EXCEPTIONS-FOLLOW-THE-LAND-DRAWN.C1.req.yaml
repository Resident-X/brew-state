id: SOL-SEPARATION-BASIS-PUMP-TRIAC-EXCEPTIONS-FOLLOW-THE-LAND-DRAWN.C1
type: criterion
title: The record's pump-triac exceptions are those of the land the board draws, without a figure pinned by the package
status: active
version: 1
measurement_type: binary
verification: test
text: |
  accepted_exceptions holds a mains_to_mains entry for each of the pump triacs T701 and T711 for the tab pad (pad 2) against each outer lead pad (pads 1 and 3) of the two-lead land the main board draws for it, which has no middle-lead pad, and holds no entry naming a pad the land lacks. Each such entry's accepted_mm equals the edge-to-edge distance between its two pads read from that land, to 0.01 mm; its constraint is clearance when that distance is under the signed terminal clearance and creepage when it is at or above the signed terminal clearance and under the signed creepage, and a pair at or above the signed creepage has no entry; and its reason and bounding element are each non-empty and name the tab pad and the lead pad. The record also holds a clearance entry with accepted_mm 1.65 for R105 and one with 1.8 for each 1206 series resistor. Every entry names the one pair of pads or nets it excuses in between and has its accepted_by and accepted_on left empty for the owner's acceptance; each accepted_mm is below the signed figure it relaxes, a part's other pairs have no entry, and a part the owner did not accept has none. The mains-to-low-voltage entries are out of scope here. Out of scope: choosing a different triac and the owner's acceptance.
