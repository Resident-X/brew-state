id: SOL-BOARD-REVIEW-RECORD-HISTORY-CHECK.C1
type: criterion
title: One command fails a review record whose rounds do not stand as first recorded or whose closing round predates a design change
status: active
version: 2
measurement_type: binary
verification: test
text: |
  Provide one task-runner command that, given a board's folder, reads its layout review record and the repository's history and fails when any round's opening lines, verdict table or findings differ from that round's end-of-round commit, when a round recorded in an earlier commit is missing, when a round's end-of-round commit is not an ancestor of a later commit that changes the board's design files (the files KiCad reads for it, never the board's own records, the review record among them), or when the board's design files have changed since the closing round's commit, naming the board, the round and what differs. It passes a record whose rounds only ever grew. It reports in a text form and in a JSON form that carry the same checks and verdict, and its exit status tells a pass (0), a failed check (1) and a refusal (2) apart: it refuses, rather than judging, a shallow clone and a record or design file that is untracked, absent or differs from HEAD. Tests in throwaway repositories built outside this one show it fails a record with a round deleted, a finding removed, renumbered or reworded, a design change committed before the round that judged it, and a design changed after the closing round, passes a record built round by round and a record whose only change after a round is a finding's closure, and refuses each case above, each in both output forms with the exit status given. Out of scope: judging any verdict.
