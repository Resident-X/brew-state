id: SOL-HW-REVIEW-FAN-OUT-LAYOUT.C5
type: criterion
title: A review folder for a committed board holds what the layout review step gives a reviewer and nothing of the designer's reasoning
status: active
version: 4
measurement_type: binary
verification: test
text: |
  Over a synthetic repository with a committed board, a command writes a review folder outside the repository holding the board's design files as the commit holds them, its plan, rules table and the records those name, the method, the hardware notes, the rendered views and placement view the round's first step names, a layout-facts extract written from the board file that lists the positions, pads, segments, vias and zones the layout items measure, and the check's report, together with one round file holding the round's number, kind, commit judged, views, check lines and, for a narrow round, listed items with a reason for each, changed regions and the line saying why every other item is not judged, taken from the command's arguments, and holds no session or notes file and no other file the commit does not hold; it holds no review record for a first round, and for a later round only the earlier rounds of the record as recorded, because a verdict row may cite a finding an earlier round closed by a reason. It refuses a folder inside the repository, a folder that is not new or empty, a commit that does not hold a board, views that are missing, and round fields of the set in use that are missing or malformed, the set being a parameter of the command, a narrow round without its reasons, changed regions or why-others line included. An add-view mode adds a rendered view and its command to the added-views folder of a folder the command wrote and records the item whose cannot judge asked for it, with that Why and the view, in a resolutions file there, neither being part of the shared context and the round file not being rewritten, and an add-document mode adds a text file holding the figure or passage that a cannot judge's Why asks for, with its source, to the same folder and records the item, that Why and the document in the same resolutions file, since a cannot judge can need a document the folder lacks and no address in the plan to fetch it from, and each mode refuses a file that does not exist or a folder the command did not write. The review seeding command's copy of the commit's files is generalised to take the repository, commit and design, with the documents optionally from a second repository, rendering stays in the seeding command, and the seeding command's existing tests still pass. Out of scope: rendering the views and running the check.
