id: SOL-PRE-ORDER-CHECK-FAILS-A-FOOTPRINT-NUMBERED-CLOCKWISE.C4
type: criterion
title: No acceptance record waives a clockwise-numbered footprint
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A clockwise-numbered footprint fails the design whatever the acceptance records beside the design say. The rule is in neither the set of workmanship rules an acceptance record may cover nor the set of classes the owner may mark as warnings. Out of scope: any other rule of the check and the acceptance of its lines.
