id: REQ-STORED-DATA-INTEGRITY-001
type: requirement
category: functional
title: Stored parameters and configuration are verified intact before they are used
status: active
priority: must
version: 2
text: |
  Everything the machine carries between power cycles can be damaged: the plant model's parameters, the declared supply budget, the operator's recipes. Damage that leaves values looking reasonable is the case that matters, because damage that leaves them absurd is already caught by plausibility checks elsewhere.

  A corrupt value is not an approximate one. It carries no information at all, and treating it as a slightly worse version of what was stored is the error this requirement exists to prevent.
rationale: |
  Singles out the supply budget because corruption must never become a route to a more permissive figure than was ever declared. The undeclared case already resolves to the most restrictive supported value, and corruption resolves the same way; otherwise a bit flip becomes a permission escalation on the one constraint that protects the building's wiring.

  Requires failure to be reported rather than silently repaired, because falling back to a default is a change in the machine's behaviour that the operator will otherwise experience as the machine mysteriously performing differently.

  Silent on how integrity is established. Several approaches are adequate and the choice has cost and complexity consequences that belong in a decision.
