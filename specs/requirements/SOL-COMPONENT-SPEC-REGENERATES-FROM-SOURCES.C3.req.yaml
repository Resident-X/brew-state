text: |-
  The check is a task-runner target run by the round gate whenever the branch changes a path the documents or their sources live under, extending the existing generated-record convention that pins inputs by digest rather than a parallel mechanism, and is also part of the nightly verification. Out of scope: any new verification tier and any change to the sweep or board tiers.
