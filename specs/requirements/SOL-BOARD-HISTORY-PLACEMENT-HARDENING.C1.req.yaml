id: SOL-BOARD-HISTORY-PLACEMENT-HARDENING.C1
type: criterion
title: The history command fails the three orderings it was found to pass
status: active
version: 3
measurement_type: binary
verification: test
text: |
  Change the history command so that it fails two candidates whose parts sit identically, judged by each part's reference, position, angle and side rather than by the board file's bytes; fails a placement section judged against a floorplan whose region bounds or parts differ from the floorplan in the commit before the first commit whose board holds a footprint, the commit the method judges the plan in, the only allowed difference being references appended to a region's parts, each listed in the plan of every parent of the commit where its footprint first appears, each such parent coming after the commit before the first placement; fails when that commit is the root, is a merge, or is one of several first appearances on separate lines of history, and when no plan is readable in it; and counts a copper pour as the first copper when it lands before any track, arc or via, a pour being a zone on a copper layer and a zone that is a rule area being no copper. The hardware tools' guide, the task's description and the command's own description state each changed behaviour, so none of them contradicts the command on what counts as first copper, what makes candidates distinct, or what the plan is compared with. Tests in throwaway repositories built outside this one show each of the fails on a history that commits it and that a history keeping the order still passes. Out of scope: the review step's record history.
