id: SOL-BOARD-HISTORY-PLACEMENT-HARDENING.C1
type: criterion
title: The history command fails the three orderings it was found to pass
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Change the history command so that it fails two candidates whose parts sit identically, judged by each part's reference, position, angle and side rather than by the board file's bytes; fails a placement section judged against a floorplan whose region bounds differ from the floorplan in the last commit before the first part was placed, except where the method's planning step allows the floorplan to be amended; and counts a copper pour as the first copper when it lands before any track, arc or via. Tests in throwaway repositories built outside this one show each of the three fails on a history that commits it and that a history keeping the order still passes. Out of scope: the review step's record history.
