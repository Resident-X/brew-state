id: REQ-MODEL-COMMIT-001.C3
type: criterion
title: Committed model parameters persist across power cycling
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Commissioning is expensive in the builder's time and the machine's wear, and anything that has to be re-established after every power interruption will be skipped.

  Only the parameters need persist, not the data they were derived from.
