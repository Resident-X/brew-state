id: SOL-MAIN-BOARD-V2-MAINS-SIDE-RE-LAID-FOR-THE-NEW-PARTS-AND-THE-BOARD-FINISHED-TO-A-PASSING-CHECK.C7
type: criterion
title: Every mains net and every low-voltage net of the finished board is connected
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  A design rule check that refills the zones reports no unconnected item on the main board, for any mains net and any low-voltage net, after the low-voltage copper was reconnected to the re-laid mains side. An unconnected item on any net fails. Out of scope: the lines the pre-order check accepts on a signed entry.
