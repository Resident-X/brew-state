id: REQ-STARTUP-STATE-001.C2
type: criterion
title: An interrupted delivery is not resumed automatically
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Stored intent describes the world before the interruption, and the operator, the cup and the machine's thermal state have all moved since without being observed.

  Resumption is a fresh command from the operator, not a continuation the machine elects to make.
