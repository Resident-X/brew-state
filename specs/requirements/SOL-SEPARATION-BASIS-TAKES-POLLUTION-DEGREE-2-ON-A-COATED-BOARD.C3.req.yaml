id: SOL-SEPARATION-BASIS-TAKES-POLLUTION-DEGREE-2-ON-A-COATED-BOARD.C3
type: criterion
title: The record's header holds the six conditions of the pollution degree 2 credit
status: active
version: 3
measurement_type: binary
verification: test
text: |
  The header comment of the committed record holds a numbered block of six conditions, each naming its subject, in this order and with these figures: the credit standing on the enclosure, with the coat before the boards are energised in the machine as a supporting measure, the coat type and datasheet named in the fabrication notes and the gaps between mains pads covered except documented contact keep-outs; the protection stated as the enclosure's with the coat a supporting measure, and credited at pollution degree 2 only, never 1; a laminate comparative tracking index of at least 175; slots in creepage paths at least 1.0 mm wide, 1.5 mm if a pollution degree 3 credit must survive; the bring-up reading of board temperature against the dew point of the enclosure air during cool-down after a steam session and in the first minutes of a cold start, confirming no condensation while energised, with the fall back to pollution degree 3 and 4.1 mm as a fresh basis; and the whole record re-signed by the owner. The header no longer says that coating the boards later would be a fresh basis. Out of scope is any condition beyond those six. The header also names the open reproductions the figures rest on (the EMA table, TI SLUP421 and SLUAAR5, IECEx document 1422 and the IECEE decision sheet) and says they are reproductions and not the standard's text, lists the readings the owner or a test house is to confirm, states that the figures are single-sourced reproductions and that IEC 60335-1, IEC 60335-2-15, IEC 60664-1 and IEC 60664-3 are unread, an owner-accepted residual risk dated 2026-10-31 quoting the owner's words "I'm not buying the standards, this is a hobby project, we probably won't insulation test with equipment", and names by node id the layout leaves and the bring-up task that carry the coat, the laminate and the humidity requirements.
