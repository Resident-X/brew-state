id: SOL-PRE-ORDER-CHECK-JUDGES-SIGNED-SPACING-EXCEPTIONS.C2
type: criterion
title: A shortfall for a listed part and constraint at or above its accepted distance is reported as an accepted exception and does not fail
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  On a seeded layout with the pair of items an entry's between lists closer than the signed figure but no closer than the entry's accepted_mm, the report holds a line naming the pair, the measured distance, the accepted distance and the owner's reason, and the design passes. The same holds for a mains_to_low_voltage creepage entry and a mains_to_mains clearance entry. Shortfalls between any other pair are out of scope and keep failing.
