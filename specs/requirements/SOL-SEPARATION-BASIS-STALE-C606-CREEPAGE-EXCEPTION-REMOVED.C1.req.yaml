id: SOL-SEPARATION-BASIS-STALE-C606-CREEPAGE-EXCEPTION-REMOVED.C1
type: criterion
title: The signed record holds no exception for the C606 pad pair and its other entries are unchanged
status: active
version: 2
measurement_type: binary
verification: test
scope: The one entry named; the other 32 entries and every figure of the record are outside this item.
text: |-
  The main board's separation basis record holds no accepted_exceptions entry for mains_to_mains creepage between C606.1 and C606.2. The record's test fails on a record that holds such an entry, whether the pair is named in an entry's between, nets_a or nets_b. Out of scope: every other entry and every figure of the record.
