id: SOL-SEPARATION-BASIS-HEADER-STATES-THE-COAT-AFTER-BRING-UP-AND-THE-RE-SIGNING.C2
type: criterion
title: The record carries the owner's re-signing day on itself and on every exception, and the header states it
status: deprecated
version: 2
measurement_type: binary
verification: test
text: |-
  The committed record's top-level accepted_on reads 2026-11-14, the latest acceptance, and the accepted_on of each of its 42 accepted_exceptions entries reads the day the owner last accepted that entry: 2026-11-06 for the 25 the owner re-signed, 2026-11-07 for the 3 that name R630 and R631, and 2026-11-14 for the 14 the re-laid mains side changed or added; every accepted_by is unchanged, no exception is dated later than the record, and the header states that the owner re-signed the whole record on 2026-11-06 in writing and states each later acceptance and the entries it dated. The check's reader on the committed record finds it and every exception signed. The test fails on a record or an exception dated otherwise, an exception dated after the record, or a header that does not state the re-signing and the later acceptances. Out of scope is the derating policy and any field of the record other than accepted_on and the header.
links:
  - target: SOL-SEPARATION-BASIS-HEADER-STATES-THE-COAT-AFTER-BRING-UP-AND-THE-RE-SIGNING
    type: criterion-of
attributes:
  deprecation_reason: 'Totals wrong: states 25, 3 and 14 where the committed record holds 23, 3 and 16 (corrected and pinned by SOL-SEPARATION-BASIS-RE-SIGNING-ITEM-DAY-COUNTS-MATCH-THE-RECORD.C1). Clauses now owned elsewhere: every exception signed and dated no later than the record, SOL-SEPARATION-BASIS-RECORD-STANDS-SIGNED-ON-THE-FINISHED-LAYOUTS-EXCEPTION-SET.C1; the Kinghelm entries day and header statement, .C9; the 23/3/16 split, the day-counts item .C1; the statements of the signature days in the records and documents, .C8. Held only by the verified-evidence history of this criterion and its test: top-level accepted_on 2026-11-14, per-entry day and accepted_by rule, and the header stating the 2026-11-06 re-signing and later acceptances.'
