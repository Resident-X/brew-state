id: SOL-HW-MAIN-BOARD-SCHEMATIC-PROVEN.C2
type: criterion
title: Every load the board switches is held off without firmware acting while the controller's supply is rising or failing and when a cable to a load's switch comes loose
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  The design holds each heater switch, pump and valve drive off in reset, unpowered and disconnected, with the circuit shown for each. The behaviour of the built board is out of scope.
