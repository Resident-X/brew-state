id: SOL-HW-REVIEW-FAN-OUT-LAYOUT.C7
type: criterion
title: The layout review step and the hardware notes say that a round may be judged by unit, and the repeat-the-proof sentence names the form that changed
status: active
version: 2
measurement_type: binary
verification: inspection
text: |-
  The method's layout review section says that a round may be judged by unit and what the merge checks, that the round's fields come from whoever starts it, that the unit which raised a finding writes its Planning shortfall entry from the plan row, that a cannot judge is resolved by adding the view and re-running the unit with the row recording the cannot judge, the view and the verdict, that the merged round is appended below the earlier rounds and committed by whoever started the round, and that judging it with one reviewer stays valid; the sentence that a proof is repeated after the step changes names the form that changed; the hardware notes describe the layout caller and the folder command and what each needs. Checked by reading each place against these clauses. Out of scope: the routing section's critical-routing check.
