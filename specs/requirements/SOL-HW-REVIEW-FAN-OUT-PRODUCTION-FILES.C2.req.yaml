id: SOL-HW-REVIEW-FAN-OUT-PRODUCTION-FILES.C2
type: criterion
title: The merge gives a parts row to every row of the placement file and a layers row to every fabrication layer, and reports every row that is not a match as blocking the order
status: active
version: 4
measurement_type: binary
verification: test
text: |-
  Over a synthetic placement file and synthetic unit results, the merge fails naming a placement row with no parts row or with two, a parts row for a part not in the file, and a fabrication layer, the drill file or the outline with no layers row. It rejects a verdict outside the three the ordering step allows, refuses, before any session starts, opening fields that are missing or malformed and a round file that is not a production one, a placement file with a duplicate designator (compared without case), a blank designator, a row of the wrong width or text that is not UTF-8, a footprint-drawings index that is unreadable, malformed, names a missing file or carries one designator in two drawings, a layer-images index that lists a layer twice, lacks the drill file or the outline (Edge.Cuts) or names a missing file, a parts list lacking the Designator or Footprint column, more than one parts specification record, a placement designator equal to a layer name (compared without case), and a review folder lacking a preview image, a layer view image, a placement, assembly or 3D view image, or any of the placement file, the parts list, the record, the round file and the four index text files, refuses a verdict other than cannot judge for a part whose footprint has no drawing, fails a part row lacking its four part cells and a layer row lacking File or Compared with, a row that is not matches with no Why, a differs with no finding naming its item, a finding of a matches row or of an item not in the check, an empty what-and-where and a Why citing another item's finding, and writes the check record in the form the ordering step gives under the one file name production-files-check.md, and reports every row that is not a match as blocking the order. Over the same inputs each unit's prompt names the unit's rows, the three verdicts and where the drawings and images lie in the review folder, so a reviewer on the small tier needs only the folder and the prompt, and the record names every row that is not a match with what it blocks. Out of scope: whether a verdict is right.
