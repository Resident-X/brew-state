id: SOL-HW-ENCLOSURE-AMBIENT-MEASURED.C2
type: criterion
title: The figure the parts are graded to is the measured rise above the room added to the top of the declared ambient span
status: deprecated
version: 3
measurement_type: binary
verification: analysis
text: |
  Take the highest settled reading across the positions less the room temperature read at the same time, add the instrument's stated accuracy once for each of those two readings, add the result to the top of the room-temperature span the declared configuration states, and record each figure and the arithmetic, stating that the rise is taken as independent of the room temperature of the run. Out of scope: the replacement boards' own dissipation, which the derating analysis adds and bring-up measures.
