id: REQ-MEASUREMENT-001
type: requirement
category: constraint
title: Measurement is accurate enough to hold target against the protection margin
status: active
priority: must
version: 2
text: |
  The coffee side runs close to its protection trip point. The gap between the temperature the controller is aiming for and the temperature at which hardware protection removes power is small, and measurement error eats directly into it.

  This makes absolute accuracy a requirement on that channel, not just repeatability. A channel that is consistently wrong by a known amount is fine for repeatability and fatal here.

  The requirement covers more than the coffee-side temperature channel. It also requires that the quantities the control acts on are known rather than inferred: how much water moves, the pressure in the brew path and in the steam path, the temperature of the water leaving each heated mass, and the supply voltage that sets heater and pump delivery.
rationale: |
  Distinguishes absolute accuracy from repeatability because the two are not interchangeable and only one of them is threatened by the protection margin. A sensor that reads consistently high is perfectly repeatable and will command the machine into its own protection.

  Stated as a constraint on the measurement channel rather than as a choice of sensing technology. Which sensor type, interface and compensation scheme meet it is a decision with cost consequences, and it is exactly the decision the cost-discipline requirement expects to be argued channel by channel.

  Silent on numbers. The margin depends on the protection device actually fitted and on the commanded target, neither of which belongs in a requirement.

  The scope widens beyond temperature accuracy because the same argument applies to each of these quantities: a controller that reconstructs a value from what it commanded confirms the command, not the condition, and the error it carries is the one a measurement would have removed. Each such channel is held to a declared accuracy, and which sensor or reconstruction meets it stays a decision argued channel by channel.
