id: SOL-PRE-ORDER-CHECK-POLARITY-MARK-ACCEPTS-A-NAMED-FIRST-PAD.C2
type: criterion
title: The through-hole exemption is shown against a seeded fault and is stated in the hardware notes
status: active
version: 1
measurement_type: binary
verification: test
text: |
  The seeded-fault harness holds a row on the throwaway proof design that renames a polarised through-hole part's pads from numbers to names that a turn maps onto themselves, with no pad numbered 1, caught as polarity_mark, and the required-names dictionary in test_board_check_kicad_marks.py requires it. The hardware notes' polarity_mark entry and the paragraph on the rule state that a polarised part with no pad numbered 1 needs no first pin only when every plated pad is through-hole and no turn other than the identity maps its pads onto themselves, and fails otherwise. The main board's silkscreen and every other pre-order rule are out of scope.
