id: SOL-BOARD-TIER-TESTS-RUN-SIDE-BY-SIDE.C1
type: criterion
title: The board tier's tooling tests run each test file in a process of its own, several at once, and a failing file fails the stage naming it
status: active
version: 3
measurement_type: threshold
verification: test
text: |-
  Over a synthetic directory of test files, the stage runs each file in a process of its own from the serial run's working directory, with the serial run's environment and test selection, several at once, at most six unless asked for more; reports each file's result as it finishes; and exits non-zero naming every file that fails, a file that crashes or cannot be imported included. A directory holding no test file fails the stage rather than passing. A file that cannot run because a tool it needs is missing makes the stage report that tool by name on its error output in the form the round reads as a failure to look, once however many files report it, so the round stops naming the tool rather than reporting a finding. The stage gives the same verdict run side by side as run one file after another, and two synthetic files that each need the one installed CAD tool both pass when run side by side. The on-demand full run of the board tooling's tests runs its files the same way. A test file divided to shorten the stage keeps every test it held, each in exactly one of the files it is divided into: the stage runs the same tests before and after the division, and the tests that need the seeded-fault proof stay outside the stage and inside the on-demand full run, as before. Over the round's own board tooling test files, on an unloaded 10-core development machine with the tools already installed and warm, the stage takes at most one third of the time the same files take run one after another, and the serial time, the side-by-side time, their ratio and the stage's peak memory are recorded. Out of scope: selecting tiers by changed path and the seeded-fault proof.
