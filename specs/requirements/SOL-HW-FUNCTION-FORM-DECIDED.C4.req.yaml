id: SOL-HW-FUNCTION-FORM-DECIDED.C4
type: criterion
title: The record can be followed by a builder holding only the repository and the public sources it cites
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  The record of forms lands in the machine's record folder beside the constraints record, and every reason and figure in it cites a source a reader holding only this repository and the publicly available documents it names can follow; nothing rests on knowledge private to the author, an unpublished conversation, or a part in hand that the record does not describe. Its readers are the builder, who designs, builds and maintains the retrofit with hobbyist means, and the agent sessions that carry out the later board and assembly design tasks with no person at the editor; an adopter on a different machine or supply reads it too. Each of them can tell from it which function has which form and why, without re-deriving the choice: each function's form, its reason and its sources are stated in that function's own entry, every term and figure the entry relies on is either defined there or cited to the section that defines it, and no entry depends on the reader having followed an earlier conversation or another entry's unstated context, so the least capable agent session the board design tasks use, reading the record cold, reaches the same form for each function as the record states. Out of scope: the board design tasks that consume it, and translating the record for another machine, which an adopter does against their own record.
