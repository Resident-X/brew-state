id: SOL-BOARD-LAYOUT-WORKMANSHIP-ITEMS.C3
type: criterion
title: The clean proof design meets every workmanship item
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Tidy the layout review's committed throwaway proof design, the one the seeded layout-review proof seeds, and update its floorplan and plan, so that it meets every workmanship item that applies to it, including the defects it was found to carry: square corners, the supply route running the long way round, the signal route looping to its partner, and the jogs and stubs beside two parts. The tidied design passes the pre-order check with the workmanship measures in force, and its layout review closes with every workmanship item passing. It is the clean baseline the seeded workmanship defects are placed against. Out of scope: the pre-order check's own proof design, which the measuring criterion handles, and any real board.
