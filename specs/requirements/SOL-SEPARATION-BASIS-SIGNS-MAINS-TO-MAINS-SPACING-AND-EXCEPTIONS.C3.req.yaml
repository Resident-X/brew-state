id: SOL-SEPARATION-BASIS-SIGNS-MAINS-TO-MAINS-SPACING-AND-EXCEPTIONS.C3
type: criterion
title: The record holds an accepted exception for each mains-to-mains shortfall the owner accepted
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  accepted_exceptions holds a mains_to_mains clearance entry with accepted_mm 1.08 for T701 and T711, one with 1.65 for R105 and one with 1.8 for each 1206 series resistor, every entry naming its parts by reference, with a reason, a bounding element and the signed acceptance. Each accepted_mm is below the signed figure it relaxes, and a part the owner did not accept has no entry. The mains-to-low-voltage entries are the next criterion's and out of scope here.
