id: SOL-HW-BOARD-DIVISION-AND-FLOORPLAN.C1
type: criterion
title: Every function is assigned to one board or off-board assembly, each owner starting point followed or departed from with its reason
status: active
version: 2
measurement_type: binary
verification: inspection
text: |-
  Every function the function-forms record gives a form is assigned to exactly one board or off-board assembly, with the reason for the assignment. An off-board assembly is one not installed in the enclosure with the boards; it may still be made as a section that snaps off one of them. Each of the owner's stated starting points is recorded as followed or departed from, with the reason; they are inputs to weigh, not mandates. The starting points are: both boards inside the existing controller enclosure; mains connections on its left and low-voltage harnesses on its right, left and right taken facing the front of the machine with left the vertical edge where the mains wiring enters; heater switches off-board; valve relays and pump drive on a mains board, or on a board shared with the low-voltage circuitry with the separation basis's clearance and creepage held on the board itself; the controller board made as narrow as it can be, a board need not be rectangular and may be an elbow that wraps around another; the heater wall board made a section that breaks off another board, to cut fabrication cost, rather than a board of its own; each board within the manufacturer's lowest price band, weighed against one board of about the enclosure's width that meets the mounting points; and the layer count chosen per board, with a ground plane favoured under the sensing. Each board's layer count is stated with its reason. The record compares at least these candidate divisions: one board spanning the enclosure to meet the mounting points, with the mains and low-voltage circuitry on it separated by the basis's clearance and creepage; a separate mains board and low-voltage board; and a three-board split. The comparison states, for each, the fabrication, assembly and inter-board connector cost at block level from the manufacturer's public price bands and fees, and the fit and separation consequences; the chosen division is the one the comparison supports, with the reason. The comparison also states which parts are hand-fitted by the owner rather than placed by the manufacturer, such as the tank reed and other through-hole parts that raise assembly cost, and the cost each saves; and, for parts outside the manufacturer's basic library, the extended-part fee total set against the saving of hand-sourcing them, the choice left to the owner. Each board's copper weight follows the current its paths drive, at 1 oz, the manufacturer's introductory price, wherever wide tracks or pours carry that current; where they cannot, heavier copper and off-board wiring are weighed against each other and the price effect is stated in the comparison for the owner to decide. The detailed estimate of the chosen division is the cost estimate's, not this record's. The heater wall board's form, its own board or a section that breaks off another, is decided here with its reason: the cost each form carries within the lowest price band, how the triac tabs reach the machine's wall as heatsink, and the separation from mains where the section joins the board it breaks from. The inspector compares the function-forms record's list of functions with the division record, and a function left unassigned fails. The record opens with the owner intent it carries: a table of each owner statement with its date, what it changed in the division, and the criterion or section that holds it, followed by the divisions and options considered and dropped, each with its reason, so a later reader does not have to rediscover them from the sessions that produced them. Out of scope: schematics and part selection, which each board's design task does.
