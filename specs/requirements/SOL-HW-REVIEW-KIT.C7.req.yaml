id: SOL-HW-REVIEW-KIT.C7
type: criterion
title: A rerun of named units rebuilds the recorded path byte for byte and refuses what would leave a stale result
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Given the names of units to run again, the scheduler runs only those along the recorded path with identical bytes, replaces their results and records which units were run again, when, and that a new shared context was started if the first one's cache had lapsed; it refuses a name that is not a unit of the review, a run that leaves out a unit whose last run failed, naming it, and a review folder whose hash differs from the recorded one, except for a change confined to paths the caller's declaration lists as added during the round, none of which may be an artefact of the shared context. A fresh run refuses an output folder that already holds a record, and the output folder holds a lock while a run is in it. Out of scope: deciding which units to run again.
