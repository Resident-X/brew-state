id: SOL-SEPARATION-BASIS-SIGNS-MAINS-TO-MAINS-SPACING-AND-EXCEPTIONS.C7
type: criterion
title: The record signs material group IIIa on the ground of a comparative tracking index of at least 175 required of the main board's fabrication notes
status: active
version: 3
measurement_type: binary
verification: inspection
text: |-
  A footnote of the household-appliance standard's creepage tables, as reproduced in two certification reports, allows the lowest material group (IIIb) at pollution degree 3 only up to a working voltage of 50 V. The record signs material_group IIIa. The stated ground is a requirement on the main board's fabrication notes, carried by the main-board layout leaf (SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT): a laminate whose published comparative tracking index is at least 175. No laminate is chosen yet, so the record states that ground as a requirement on the fabrication notes and cites no laminate maker's document. The creepage rows at 253 V are equal for groups IIIa and IIIb (5.0 mm at the 320 V row), so no figure changes. The mains_to_low_voltage 10.0 mm figure rests on the same basis and is unchanged. A reading of the standard's own text, which the reports only reproduce, is out of scope and is noted as unread. The derived row's material_group input is stated as IIIa.
