id: SOL-HW-BOARD-CLASS-READ-ANY-SIZE.C1
type: criterion
title: A net class's membership is read completely and identically on every run, on a board of any size
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  On a synthetic board carrying more items than KiCad's per-kind report limit, whose Mains nets alone carry more items than that limit, reading the Mains class's membership through the board tooling returns exactly its known set of nets on every one of repeated runs, and the pre-order check, the review-view render and the locked-copper reading each see that same set. A class read whose run's reports reach the limit is refused with a message naming the class and the limit, rather than read as complete; a correct read of a class with more items than the limit is never refused. A design whose own assertion rules fail on more items than the limit, with the check's marker present, fails the pre-order check with a message saying KiCad's report was cut short, rather than passing on a truncated report. Every design the pre-order check passes before the change still passes, and the check's seeded-fault proof still catches every fault it caught.
