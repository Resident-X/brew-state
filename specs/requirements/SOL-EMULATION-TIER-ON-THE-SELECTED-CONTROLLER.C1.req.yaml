id: SOL-EMULATION-TIER-ON-THE-SELECTED-CONTROLLER.C1
type: criterion
title: The emulated machine describes the selected part
status: active
version: 1
measurement_type: binary
verification: inspection
text: |-
  The machine the emulation tier runs is described for the selected part: its memory map, its clock and reset controller and the peripherals the firmware drives, and the description names no other part as the controller. Each part of the description is read against the selected part's reference manual and the reading recorded clause by clause. Out of scope: a clock tree the firmware does not set.
