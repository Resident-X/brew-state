text: |-
  The signed separation basis record holds 42 entries on the re-laid board, each entry covers a shortfall the layout shows and the record is signed, its own accepted_on and that of every entry reading the owner's acceptance of 2026-11-18. An entry that covers no shortfall, or a shortfall on the board with no entry, fails. Out of scope: the owner's confirmation of the entries signed on his behalf.
