id: SOL-HW-REVIEW-KIT.C10
type: criterion
title: The command runs a declared review end to end and exits 0, 1 or 2 with REFUSED and CANNOT RUN lines and the same report in text and in JSON
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Over the stub, the exit status is 0 when the merged record is written, 1 when the command refuses or a unit fails, and 2 when the agent command line is missing or not logged in, each with a line beginning REFUSED or CANNOT RUN naming its cause and what to do; a review folder inside the repository or that does not exist, an output folder inside the review folder or containing it or inside the repository, a declaration or caller that cannot be loaded, an output folder that holds a record when no unit is named to run again, an output folder in use by another run, a bound below one and a shared context over the budget are each refused. The report is available as text and as JSON and holds the same facts: the plan, each session's own figures, the run's, the predicted against the actual, the checks that failed and the files rendered. Over the stub with a synthetic declaration and review folder, a run builds the plan, runs the shared context and the forks and replicas, merges, writes the caller's rendered files and the run's figures into the output folder and lists them in the report; a second run naming one unit replaces that unit's result and merges again. Out of scope: the content of the stub's answers.
links:
