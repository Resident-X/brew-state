id: REQ-RECIPE-CUSTODY-001.C6
type: criterion
title: A kept recipe is not discarded by the bound that discards history
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Recipes and delivery history share the room they are stored in and have opposite retention rules. A recipe lost to the bound on history would be discovered only when the operator next asked for that drink, long after the deliveries that displaced it.
