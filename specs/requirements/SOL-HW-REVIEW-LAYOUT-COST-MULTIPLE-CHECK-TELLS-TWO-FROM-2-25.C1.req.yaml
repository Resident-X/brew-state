text: |-
  Change the test so it refuses a document that states the layout review's cost multiple as 2 and does not refuse one that states another multiple beginning with 2, such as 2.25 or 20, so the board tier of the build round passes on the production-files proof's task description. Checked by running the test against the current documents, which pass, and against text carrying a multiple of 2, which it refuses. Out of scope: the figures the documents state, and any other check in that test module.
