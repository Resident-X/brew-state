id: SOL-HW-MAIN-BOARD-SCHEMATIC-PROVEN.C7
type: criterion
title: Every figure the constraints record holds pending against the board is recorded with its source, or keeps its pending mark and the act that settles it
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  For each of a rail's budget, a branch fuse's rating, and the time a protective device takes to clear with the energy it lets through at the declared fault current, the constraints record states the figure with its source or, where no maker's sheet prints it, keeps its pending mark and names the act that settles it. Measuring the figures on a built board is out of scope.
