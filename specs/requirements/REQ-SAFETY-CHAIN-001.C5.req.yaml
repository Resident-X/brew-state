id: REQ-SAFETY-CHAIN-001.C5
type: criterion
title: Pressure is contained or released without power, sensing or command
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Pressure can rise while every electrical device behaves exactly as commanded, so nothing electrical addresses this hazard, and removing heat does not remove pressure already present.

  Whatever holds or releases it acts on the pressure itself, and stays effective with the machine unpowered and nothing aware a hazard exists. It answers to the highest pressure the machine can generate, including from heating a volume whose outlet is shut, rather than the highest seen in ordinary use.
