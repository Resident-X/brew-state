id: SOL-HW-BOARD-COST-ESTIMATED.C2
type: criterion
title: The total is weighed against what remains of the declared spend, and an overrun is acted on rather than recorded
status: active
version: 2
measurement_type: binary
verification: analysis
text: |-
  The declared spend figure and where it is recorded in the component specification are quoted, and the criterion fails if no figure is declared there. The count the declared spend takes is what the owner pays for the minimum order, with the cost per machine shown beside it. The sum of every estimate, together with spend to date as recorded there, is weighed against what remains of the declared spend, and the running total there is brought current. Where the total exceeds what remains, the estimate records what is changed to bring it inside, or that the owner is asked to revisit the declared figure, in which case this criterion and the leaf stay unmet until the owner answers. It is never left as an overrun noted and carried on. Out of scope: changing the declared figure, which only the owner does.
