id: SOL-HW-REVIEW-KIT.C3
type: criterion
title: An answer is read tolerantly, its problems are classed and repaired, cells round-trip, and every attempt is kept with the best standing
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Over a corpus of answers recorded from the live runs, an answer returned as structured output is read from it, and an answer that has prose before the object, a code fence around it, a trailing remark, or a second object without a tables key is read as the one object holding a tables key; an answer with no such object is typed as holding none. No recorded correct answer is discarded. Over synthetic answers, a cell holding a vertical bar or a line break, a column name differing in case or space, and a number given as text are each classed cosmetic, repaired and listed in the unit's record; a finding or verdict row whose item is not on the unit's checklist, such as one cell naming two items, a citation of a finding the unit did not raise, an item with no verdict or two, and a verdict outside the declared set are each classed local; an answer with no object and one whose tables cannot be mapped to the declared schema are each classed fatal. Over generated strings, including vertical bars, line breaks, leading and trailing space, backticks and non-ASCII text, a cell rendered into a record table and read back through the reader the review record history command uses gives the string as the unit wrote it, and the unit's kept result holds the raw text. Over attempts of one unit, the standing attempt is the one with no problems, else the fewest local problems, else the most items covered, else the first; a later attempt with more problems than a kept one does not replace it; and every attempt remains in the unit's record. A sequence of attempts of the shape in which a worse retry once replaced a better attempt is a synthetic fixture. Out of scope: deciding when to make another attempt.
