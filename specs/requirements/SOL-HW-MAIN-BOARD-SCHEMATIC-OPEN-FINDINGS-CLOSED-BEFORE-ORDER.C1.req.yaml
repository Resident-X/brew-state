id: SOL-HW-MAIN-BOARD-SCHEMATIC-OPEN-FINDINGS-CLOSED-BEFORE-ORDER.C1
type: criterion
title: The core-regulator capacitors' datasheet window, the fitted part's arithmetic against it and the carried reading that settles it are recorded
status: active
version: 2
measurement_type: binary
verification: analysis
scope: 'Out of scope: the other ceramics that set a filter, a stability or a reference, the layout and any bring-up measurement.'
text: |
  The record states, for each of the two capacitors on the controller's core-regulator output pins (C412 and C413), the window the controller's datasheet gives (2.2 uF with a variation of plus or minus 20 percent tolerated, so an effective capacitance of 1.76 to 2.64 uF, and an ESR below 100 milliohm), the arithmetic for the part fitted at the maker's own tolerance and temperature limits before any DC-bias loss (1.68 uF, below the floor, and equally so for any 10 percent ceramic of the X5R or X7R class in this footprint, because both carry a 15 percent temperature limit), that the maker's catalogue states no DC-bias or temperature curve for the part, and that the floor is therefore settled by the carried reading of the effective capacitance on the built board (item 5.7 of the carrying decision), with its limit, its method for a home builder before mains, and the part change that follows a reading below the limit. The part and the footprint stay as drawn, so no copper changes.
  Out of scope: the other ceramics that set a filter, a stability or a reference, the layout and the reading itself.
