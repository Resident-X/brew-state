id: SOL-FW-PIN-ASSIGNMENT-MATCHES-RECORD.C1
type: criterion
title: A channel assigned to a different controller pin than the record names fails the check
status: active
version: 2
measurement_type: binary
verification: test
text: |
  The check fails when the firmware assigns a channel to a controller pin other than the one the pin allocation record names for it, naming the channel and both pins. The pin is the controller pin's own name, port letter then number, as in PC6; the check reads it from the firmware table's port and pin constants, and matches the firmware channel to the record entry whose firmware_channel names it. A channel named twice, and two channels on one controller pin, fail whether the repeat is in the firmware table or in the record. A firmware assignment that matches the record on every channel passes. Out of scope: the connector and net, which the board check holds to the same record.
links:
