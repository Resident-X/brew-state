id: SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C8
type: criterion
title: The pre-order check passes on the finished board with no judgement weighed against a failure
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  The pre-order check, run on the finished layout against the records the schematic leaf authored, passes, and a failing rule is resolved by a change to the design or to a record, never by judging the failure unimportant. Authoring the records, and comparing the cable between the two boards' headers pin for pin, are out of scope.
