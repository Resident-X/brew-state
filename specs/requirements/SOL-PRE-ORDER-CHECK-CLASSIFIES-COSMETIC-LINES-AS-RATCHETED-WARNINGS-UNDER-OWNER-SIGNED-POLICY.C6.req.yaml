id: SOL-PRE-ORDER-CHECK-CLASSIFIES-COSMETIC-LINES-AS-RATCHETED-WARNINGS-UNDER-OWNER-SIGNED-POLICY.C6
type: criterion
title: A policy entry that names a class the policy cannot cover fails the check naming it
status: active
version: 2
measurement_type: binary
verification: test
text: |
  On a synthetic design, a policy entry, at either severity, naming a class outside the closed list of ten (`silk_overlap`, `silk_edge_clearance`, `designator_astray`, `reference_off_silkscreen`, `track_angle`, `track_segment_length`, `workmanship_direction`, `workmanship_pad_entry`, `workmanship_pad_corner` and `workmanship_detour`), among them `silk_over_copper`, `test_point_courtyard`, `courtyards_overlap`, `items_not_allowed`, `workmanship_width`, and a class that carries a safety, mains spacing, creepage, clearance, derated-voltage, pin-limit, mounting-hole, plated-hole, connectivity, hole, annular ring, drill, other manufacturing, paste, solder or separation basis finding, fails the check under the rule `severity_policy` naming the entry, as does an entry naming a class the check does not report, and in each case the whole policy is void: no line is printed as a WARNING and every line stands as a violation. Out of scope is any class the policy may cover.
