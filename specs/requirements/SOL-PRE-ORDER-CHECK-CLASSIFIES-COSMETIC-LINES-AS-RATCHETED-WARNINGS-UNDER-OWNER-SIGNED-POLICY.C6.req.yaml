id: SOL-PRE-ORDER-CHECK-CLASSIFIES-COSMETIC-LINES-AS-RATCHETED-WARNINGS-UNDER-OWNER-SIGNED-POLICY.C6
type: criterion
title: A policy entry that names a class the policy cannot cover fails the check naming it
status: active
version: 2
measurement_type: binary
verification: test
text: |
  On a synthetic design, a policy entry, at either severity, naming a class outside the closed list of fourteen (`silk_overlap`, `silk_edge_clearance`, `designator_astray`, `reference_off_silkscreen`, `track_angle`, `track_segment_length`, `workmanship_direction`, `workmanship_pad_entry`, `workmanship_pad_corner`, `workmanship_detour`, `track_width`, `workmanship_width`, `ground_return` and `test_point_courtyard`), among them `silk_over_copper`, `courtyards_overlap`, `items_not_allowed`, and a class that carries a safety, mains spacing, creepage, clearance, derated-voltage, pin-limit, mounting-hole, plated-hole, connectivity, hole, annular ring, drill, other manufacturing, paste, solder or separation basis finding, fails the check under the rule `severity_policy` naming the entry, as does an entry naming a class the check does not report, and in each case the whole policy is void: no line is printed as a WARNING and every line stands as a violation. On the same design a policy whose entries name each of the fourteen classes of the closed list, at WARNING with a count and at ERROR without one, does not fail as a record, and a line of each of those classes is printed as a WARNING line under a WARNING entry and stands as a violation under an ERROR entry, so that none of the fourteen is refused. Out of scope is any class the policy may cover.
