title: The full pre-order check passes every design with no violation on the main board and every warning under a signed entry
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The full pre-order check run over every board design in the repository passes, and on the main board it reports no violation and 265 warning lines, each covered by an entry in the severity policy or the workmanship acceptance record. A violation on any design, or a warning line that no signed entry covers, fails. Out of scope: the confirmation by the owner of the entries signed on his behalf, and any layout review from rendered views.
