id: SOL-BOUGHT-PART-CREEPAGE-OF-K201-K731-K741-AND-U602-JUDGED.C2
type: criterion
title: Each of the four parts meets the signed figures on a published figure, has an accepted exception, or is replaced
status: active
version: 2
measurement_type: binary
verification: test
text: |
  For each of K201, K731, K741 and U602, the committed record and schematic show exactly one of three states, and the check passes the layout on it: the part's published creepage and clearance meet 10.0 mm and 3.0 mm and it has no entry; or it has an accepted_exceptions entry for the one pair of pads it falls short on, with accepted_mm no greater than the published figure, a stated ground and a bounding element; or the part is replaced by one in the first or second state. A figure the maker does not publish counts as absent: the part is in none of the three states until the owner has decided and the decision is recorded. The owner's signature of the record is out of scope here and belongs to the acceptance leaf.
