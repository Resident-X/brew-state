id: SOL-BOARD-METHOD-SCRIPTED-LAYOUT-TOOLS-ARE-TRACKED-AND-REUSED-BY-THE-NEXT-BOARD.C8
type: criterion
title: The acceptance generator refuses a line on a Mains-class net or inside a mains region
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Given a check log whose failing neatness lines include one on a Mains-class net and one inside a mains region, the generator writes no entry for either, names each as refused and exits with failure. Tests cover a line on a Mains-class net, a line inside a mains region, a line on neither and a log with no failing lines, in text and in JSON. This does not cover entries for any line other than a failing neatness line.
