id: SOL-MAIN-BOARD-FIVE-GROUND-VIAS-IN-SMD-PADS-AWAIT-OWNER-DECISION.C1
type: criterion
title: The via-in-pad survey is the evidence and the item stays open until the owner decides
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  The via-in-pad survey of the committed main board lists exactly the five same-net ground vias of 0.75 mm inside surface-mount pads (C302 pad 2 twice, D523 pad 1, Q823 pad 2, Q824 pad 2) and no other via of 0.75 mm or more inside a pad of another net or the same net, and this item records that the owner has not decided between moving each via out of its pad and a justified narrow exception. The item records no acceptance and the board and the rules file are unchanged until the owner decides; once he decides, this criterion is amended to verify the chosen resolution before any build. Out of scope: the thermal vias of 0.6 mm and under in exposed pads and the three back-side parts.
