text: |
  The on-demand seeded-fault proof introduces into a copy of a throwaway design, outside the repository, a tool-named net and a sheet with a blank name, and requires the check to fail each by name. The proof is an on-demand command beside the existing proof and runs in neither gate.

  Out of scope: the pre-order check's other rules and the existing seeded-fault proofs.
