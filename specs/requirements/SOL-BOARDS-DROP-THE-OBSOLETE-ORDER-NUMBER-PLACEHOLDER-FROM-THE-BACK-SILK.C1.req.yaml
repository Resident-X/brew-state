text: |
  The back silkscreen of the main board and of the heater wall board holds no text reading `JLCJLCJLCJLC`, and the Gerber file of each board's back silkscreen exported from the committed design holds no such text. The front silkscreen, the copper, the mask and the drill file of both boards are out of scope and stay as they were.
