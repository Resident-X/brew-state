id: SOL-PRE-ORDER-CHECK-JUDGES-OWNER-ACCEPTED-DERATING-EXCEPTIONS.C5
type: criterion
title: Each new failure is shown to fail on a fault seeded for it in a copy of the throwaway proof design
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The on-demand proof seeds into a copy of the proof design an over-limit part with no entry, an entry below the working voltage, an unsigned entry, an entry for no position, an entry for a part within its limit, an entry no failure uses, and an entry for one part beside a second over-limit part, and requires each to fail under its rule, the design itself passing first. Faults of the other rules are out of scope.
