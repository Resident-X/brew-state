id: SOL-HW-HEATER-WALL-BOARD-PROVEN-AND-LAID-OUT.C4
type: criterion
title: Every channel crossing the board's header resolves to a controller-pin channel of the main board's pin allocation record, which is not changed, and the board authors no converter-input map
status: active
version: 2
measurement_type: binary
verification: test
text: |
  The channels crossing the board's header are heat_c_drv, heat_s_drv, mains_pres_c and mains_pres_s, listed as far channels, with the supply and return pins listed as rails, and the header's pins are listed in the order the main board's drawing of the header carries: +5V_WB, HEAT_C_LED_K, HEAT_S_LED_K, ground, MAINS_PRES_C, MAINS_PRES_S, then four spare. Each far channel resolves to a channel of the main board's pin allocation record that carries a controller pin, and the main board's record is not changed to make it. A pin assignment in the firmware that disagrees with the board fails a check before the board is ordered, because the firmware's pin and sensor checks read the main board's record and the wall board's far channels resolve to it. Comparing the cable between the two headers pin for pin is out of scope.
