id: SOL-HW-HEATER-WALL-BOARD-PROVEN-AND-LAID-OUT.C4
type: criterion
title: Every channel crossing the board's three-way header resolves to a controller-pin channel of the main board's pin allocation record, and the board authors no converter-input map
status: active
version: 4
measurement_type: binary
verification: test
text: |
  The channels crossing the board's header are heat_c_drv and heat_s_drv, listed as far channels, with the supply pin listed as a rail. Each far channel resolves to a channel of the main board's pin allocation record that carries a controller pin, so a pin assignment in the firmware that disagrees with the board fails a check before the board is ordered, because the firmware's pin and sensor checks read the main board's record and the wall board's far channels resolve to it. Comparing the cable between the two headers pin for pin is out of scope.
