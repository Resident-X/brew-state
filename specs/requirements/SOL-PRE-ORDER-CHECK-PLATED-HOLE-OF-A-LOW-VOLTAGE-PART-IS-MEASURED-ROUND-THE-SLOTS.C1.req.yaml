id: SOL-PRE-ORDER-CHECK-PLATED-HOLE-OF-A-LOW-VOLTAGE-PART-IS-MEASURED-ROUND-THE-SLOTS.C1
type: criterion
title: A plated hole of a part on a net outside Mains is held to the signed distance of Mains copper by the creepage route round the barrier slots
status: active
version: 2
measurement_type: binary
verification: test
text: |
  On a synthetic layout with a barrier slot between a plated hole of a part's pad on a net outside Mains and a Mains-class pad, where the straight-line distance between them is at or above the signed clearance but under the signed creepage and the shortest route round the slot is at or above the signed creepage, the check gives no mounting_hole violation for the pair. Each of these fails naming the hole, the Mains item and the distance measured: the same pair with the slot absent, a pair whose route round the slot is under the signed creepage, and a pair whose straight-line distance is under the signed clearance although its route round the slot is at or above the creepage. Out of scope is a fixing's own pad and courtyard, and the signed figures.
