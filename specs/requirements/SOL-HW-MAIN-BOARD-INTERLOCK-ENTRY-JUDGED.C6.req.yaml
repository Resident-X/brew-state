id: SOL-HW-MAIN-BOARD-INTERLOCK-ENTRY-JUDGED.C6
type: criterion
title: The mains entry's fuse is rated for the whole entry chain, its surge clamp is judged, and whether suppression is needed is decided with the reason recorded
status: active
version: 1
measurement_type: binary
verification: analysis
text: |
  The fuse rating, the surge clamp's rating against the surge the overvoltage category assigns, and the conducted emission the machine would put on the supply with no filter are judged with the arithmetic shown. The record states whether suppression at the entry is needed and why, since no inlet filter is fitted. Placing the fuse, clamp and any suppression parts on the board is out of scope.
