id: REQ-POWER-BUDGET-001.C6
type: criterion
title: The budget is spent against what the loads draw at the worst of the declared supply span
status: active
version: 1
measurement_type: binary
verification: analysis
text: |-
  A load that is a resistance draws more as the supply rises, so an allocation that balances at nominal exceeds the budget at the top of the declared span -- and the protecting device responds to the current that actually flowed, not to the figure the allocation was computed from.

  Constraining what is commanded rather than what is measured leaves the arithmetic with no feedback to correct it. That is the deliberate choice C2 makes, and its price is that the figures going in are the pessimistic ones rather than the typical ones.
