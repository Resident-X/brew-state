id: SOL-HW-REVIEW-KIT.C12
type: criterion
title: A fanned-out review is judged against the recorded single runs by one pooled criterion, reusing baselines and never running the single again
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Over the stub, the single-reviewer form is a plan with one unit holding every item and no shared context, the single reviewer under the shared context is the same unit under a shared context, and the fanned-out form is the grouped plan, each run by the same scheduler and recorded in the same shape. Over recorded baselines keyed by the seeded commit, the tool commit, the model, the form and the prompt hash, a proof loads the recorded single-reviewer runs, refuses to run a form whose baseline for the key is recorded and names the key, runs a form whose key differs, and loads the five recorded layout runs as baselines. Over recorded runs, the criterion passes when the seeds found in each fanned-out run are no fewer than the fewest any single run found, no seed every single run found is missed by every fanned-out run, the fanned-out wall time is at most half the single mean and the cost is at most the stated multiple of the single mean cost, and fails and names the clause when any does not; a second fanned-out run is required only when the first is within ten per cent of a bound. The record of a proof over recorded runs gives each run's seeds found, the findings matching no seed, the verdict differences with an explanation, each session's time, tokens read, written and generated, cost and first-call cache read, and for each seed the replicas that raised it, from which the rate at which one replica misses a seed and the correlation between replicas are reported. Out of scope: the explanation's content.
