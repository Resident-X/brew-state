id: SOL-MAIN-BOARD-VARISTOR-FOOTPRINT-MATCHES-ITS-STAGGERED-LEADS.C2
type: criterion
title: RV101 stands square on the new pads, clear of its neighbours, with the layout rule check unchanged
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  RV101 stands at rotation 0 or 180 degrees on the new pads, which lie 7.5 mm apart along the part and 3.0 mm across, its body and courtyard overlap no other part's courtyard, its two nets reach the new pads, and the layout rule check run with the design tool's command line reports the same violations after the change as before it. This is checked by comparing that report and a render of the area before and after. Every part other than the varistor and the copper of its two nets is out of scope, except a part the new courtyard requires moved by the least distance that clears it.
