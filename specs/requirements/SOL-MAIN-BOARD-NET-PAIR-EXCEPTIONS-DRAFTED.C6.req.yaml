    type: criterion-of
attributes:
  deprecation_reason: Carried in the finished state by SOL-SEPARATION-BASIS-RECORD-STANDS-SIGNED-ON-THE-FINISHED-LAYOUTS-EXCEPTION-SET.C4, which states the same-part entries the finished layout uses; this criterion required entries for twenty-seven pairs including the C606 pad pair, whose entry was removed on 2026-11-07 (SOL-SEPARATION-BASIS-STALE-C606-CREEPAGE-EXCEPTION-REMOVED), and two R105 pairs were removed on 2026-11-14.
