id: SOL-NIGHTLY-VERIFY-INSTALLS-THE-KICAD-THE-BOARD-CHECKS-ARE-PINNED-TO.C3
type: criterion
title: A dispatched nightly run reaches the board gates and reports their verdicts
status: active
version: 1
measurement_type: binary
verification: demonstration
text: |-
  A manual dispatch of the nightly workflow on the branch starts the board check (hw:verify) and the board tooling's tests (hw:test:round) and reports each one's own verdict, whether or not any other gate in the run failed. Out of scope: the verdicts of the firmware gates, and any layout defect a board check reports.
