id: SOL-BOARD-LAYOUT-PLACEMENT-CHECKPOINTS.C1
type: criterion
title: One command draws a placement's unrouted connections and measures them
status: active
version: 2
measurement_type: binary
verification: test
text: |
  Add a command among the repository's hardware tasks that, from a placed board's files, routed or not, renders an image of the board's parts with each net's connections drawn as straight lines between the pads they join, and writes beside it the placement's measures. The connections of a net are the minimum spanning tree over its pad centres, taken from the shared geometry module the pre-order check's detour measure already uses rather than built again; copper already laid is ignored, so a board measures the same before and after routing and a re-placement can be measured on a routed board. The command writes into an output folder of its own, never one the views command writes, under its own index as text and JSON in which the image is named placement, and takes the layout review views' form, its rendering, captions, tiling, resolution and refusals taken from the views tool rather than copied: dark background, a caption drawn into the image, resolution from the board-wide minimum track width and clearance, tiles within the views' size limits, and the views' refusals for a board open in an editor, an unset minimum, and an output folder inside a design's folder or already holding files; the floorplan's region rectangles are drawn and named on it. The measures are written as text and as JSON: the total length of the connections and each net's length; the number of crossings, a crossing being two segments of different nets that intersect, touch or overlap, segments of one net never counted against each other, in total and by net; and every part outside its regions. The command reads each region's rectangle and the parts it holds from the floorplan table in the board's layout plan. A part's extent is its courtyard, or the extent of its pads where it has none; a part is outside when that extent is not covered by the union of the rectangles of the regions it is listed in, so a part listed in two regions, such as an isolator whose pins lie either side of the mains boundary, is outside only when it leaves both, and a part the floorplan lists in no region is outside. A region whose bounds are recorded as none is read as a region with no rectangle. A missing floorplan, a region row that cannot be read, a part listed in a region recorded as none, or a listed part that is not on the board stops the command with a message naming it. The hardware tools' guide describes the command as it describes the views command: its task, its outputs and their names, its measures, its refusals and stops, and the tools it needs. Tests on a throwaway design built in a temporary folder outside the repository show that each connection is drawn between the right pads; that the measures are right for a known placement, including a part listed in two regions and a part listed in none; that crossings between nets are counted, including a connection passing through another net's pad centre, and segments of one net are not; that a region recorded as none is read; that a routed copy of a board measures the same as the unrouted original; that each stop is made; that the text and JSON measures agree; and that a worse placement of the same parts measures worse. Out of scope: choosing between placements, and routing.
