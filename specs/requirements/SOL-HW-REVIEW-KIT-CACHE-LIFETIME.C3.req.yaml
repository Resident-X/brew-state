id: SOL-HW-REVIEW-KIT-CACHE-LIFETIME.C3
type: criterion
title: The cost model prices cache writes per lifetime and a plan is predicted at its own lifetime's price
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Each model the price table holds carries a write price for each lifetime, the five-minute price being the one-hour price times 1.25 over 2 until a five-minute run is recorded, with read and generated prices shared by both lifetimes. Against the stub, the same plan predicted at five minutes costs less than at one hour by exactly the shared contexts' and forks' written tokens times the difference in write price, and the plan names the lifetime and the prices it used. A fit over sessions recorded at one lifetime refits that lifetime's write price and leaves the other's as it was. Each proof record names the lifetime of every run it holds, the baselines' included, and a baseline's key does not change with the lifetime. Out of scope: the figures a later refit gives.
