id: OBL-ELECTROMAGNETIC-COMPATIBILITY-001.C2
type: criterion
title: Load switching stays within the flicker and harmonic current limits for household appliances
status: active
version: 1
measurement_type: binary
verification: analysis
text: |
  Heaters are switched in individual supply half-cycles, so the current drawn steps by a whole element's draw as often as every half-cycle, a source of flicker; a pattern that energises more half-cycles of one polarity than the other draws a direct component and even harmonics; and a load controlled within each cycle draws current that is not sinusoidal. The switching the control actually commands is analysed against the flicker and harmonic current limits of the governing standard, at the top of the declared supply span.
