text: |-
  The method's schematic review section says that a round may be judged by unit, what the merge checks including the coverage of every net, part and sheet, and that judging it with one reviewer stays valid; its list of what the circuit review's proof folder holds names the sheet drawings; the sentence that a proof is repeated after the step changes names the form that changed; the hardware notes describe the circuit review proof's fanned-out run and the task runner's description says what the command needs. Checked by reading each place against these clauses. Out of scope: the layout and ordering sections.
