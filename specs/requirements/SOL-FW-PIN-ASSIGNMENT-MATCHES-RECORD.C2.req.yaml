id: SOL-FW-PIN-ASSIGNMENT-MATCHES-RECORD.C2
type: criterion
title: A channel present in only one of the firmware assignment and the record fails the check
status: active
version: 3
measurement_type: binary
verification: test
text: |
  A channel the firmware assigns that no record entry names fails the check, and so does a record entry naming a channel the firmware does not assign, each naming the channel. Only record entries that carry a firmware_channel key take part in the comparison; the board check holds the rest. A record that cannot be parsed, repeats a key, has no entry naming a channel, or has an entry whose firmware_channel is empty or not a name, or that names a channel but lacks its controller_pin, fails, since an empty record would otherwise pass any firmware, and so does firmware in which no pin table is found. Out of scope: comparing sensor channels, which a separate solution carries, and wiring the check to a machine's real record, which that board's design task does.
