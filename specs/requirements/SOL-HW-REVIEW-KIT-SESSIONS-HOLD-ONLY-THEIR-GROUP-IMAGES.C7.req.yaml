id: SOL-HW-REVIEW-KIT-SESSIONS-HOLD-ONLY-THEIR-GROUP-IMAGES.C7
type: criterion
title: The hardware notes and the method's by-unit paragraphs state the per-group context, the budget, the refusal and its remedy
status: active
version: 6
measurement_type: binary
verification: inspection
text: |-
  The hardware notes (hardware/README.md) section on the review kit command states that each group is judged from a root holding the shared documents and only the views of the groups the root serves, that groups share a root when their views fit the budget together, that a budget is declared by the caller as a figure or as a headroom fraction of the model's declared window, and where the window table is, that a group over it is refused naming the group and the figures, how to correct the declaration, the plan-only invocation and its flag in the command's --help, and the per-group and per-root figures the report holds; the refusal table in the notes has a row for the new refusal with its cause and action; the notes of the critical-routing, layout, production-files and schematic callers name the units' needs and the budget each declares; and the four paragraphs of docs/board-design-method.md on judging a round by unit each say that a reviewer is given only the views of the groups its root serves and that the by-unit form may be used on a full-size board. A session that holds only those texts and the command's refusal line can state what the command needs, what it refuses and what to change. Out of scope: the wording of any caller's prompts.
