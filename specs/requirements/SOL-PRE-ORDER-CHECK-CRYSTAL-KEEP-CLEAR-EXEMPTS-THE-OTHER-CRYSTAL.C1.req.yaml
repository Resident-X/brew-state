id: SOL-PRE-ORDER-CHECK-CRYSTAL-KEEP-CLEAR-EXEMPTS-THE-OTHER-CRYSTAL.C1
type: criterion
title: A keep-clear rule that exempts the other crystal does not count as naming it, and a rule that names a crystal as A or B by == still fails
status: active
version: 1
measurement_type: binary
verification: test
text: |
  On a synthetic layout of two crystals with generic references, rules for each crystal that exempt the other with B.Reference != pass the crystal keep-clear. A courtyard_clearance rule outside the one form that names a crystal as A.Reference == or B.Reference == still fails for that crystal, whether or not a keep-clear rule exists for it; a keep-clear below the floor, one that exempts every other part, a crystal with no rule of its own and a keep-clear not naming its crystal as A each still fail; and a single-crystal layout reports as it did. The message of each failure is unchanged. The related-part list of CLOCK-3, the 10 mm floor and the main board's rules file are out of scope.
