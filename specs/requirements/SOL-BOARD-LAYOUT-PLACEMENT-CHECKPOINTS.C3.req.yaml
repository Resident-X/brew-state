id: SOL-BOARD-LAYOUT-PLACEMENT-CHECKPOINTS.C3
type: criterion
title: Critical routing is checked against the catalogue before automated routing runs
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Amend the method's routing step so that, after the critical nets are routed and locked and before the automated router runs, the board's views are rendered and every catalogue item bearing on those nets, workmanship items included, is judged, with each verdict recorded in a critical routing section of the board's layout plan, in the form the layout review records its verdicts, and committed before the router runs, with a cross-check in the routing step that the history shows that section before the first commit carrying the router's tracks; a failing item is put right before the router runs. A judgement-kind item is judged on the views. A rule-kind item is judged at this checkpoint on its rows in the rules table alone, because the pre-order check fails a board that is not fully routed; its record says that its measured half is judged by the pre-order check the routing step already runs after the router. Out of scope: judging the routes the router adds, which the final review does, and any partial-routing mode of the pre-order check.
