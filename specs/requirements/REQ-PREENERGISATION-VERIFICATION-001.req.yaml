id: REQ-PREENERGISATION-VERIFICATION-001
type: requirement
category: functional
title: Control behaviour is verified against a plant model before anything is energised
status: active
priority: must
version: 2
text: |
  Two distinct classes of error have to be caught before hardware is involved: a control law that is wrong, and a correct control law implemented wrongly on the target. They have different fixes and are far cheaper to separate than to untangle after the fact.

  Neither is fully visible by reading source. Both need the behaviour exercised in time.
rationale: |
  Separates design error from implementation error as a requirement rather than leaving it to whatever the verification approach happens to catch. Verifying only the finished product on hardware leaves the two indistinguishable, and the debugging cost of that confusion falls on a single builder with no colleague to divide it with.

  Timing is called out explicitly because it is the class of failure that source review cannot reach and that a purely numerical comparison will not surface. Where actuation is tied to the mains waveform, a late answer and a wrong answer have the same consequence.

  Silent on how the plant model is obtained, what executes the control law during verification, and what tooling is involved. Those are decisions with real alternatives and material cost differences.
