id: SOL-PRE-ORDER-CHECK-CLASSIFIES-COSMETIC-LINES-AS-RATCHETED-WARNINGS-UNDER-OWNER-SIGNED-POLICY.C1
type: criterion
title: A malformed severity policy entry fails the record naming the entry and the key
status: active
version: 2
measurement_type: binary
verification: test
text: |
  On a synthetic design, a severity policy with an entry that is not a mapping, one with a missing key, one with an extra key, one whose severity is neither ERROR nor WARNING, two entries for one class, a WARNING entry with no count or a count that is not a non-negative whole number and an ERROR entry carrying a count each fail the check under the rule `severity_policy` naming the entry and the key, and in each case the whole policy is void: a line of a class that a well-formed signed entry of the same policy marks WARNING stands as a violation and no line is printed as a WARNING. The same policy with well-formed entries does not fail as a record. Out of scope is the judgement of a well-formed entry.
