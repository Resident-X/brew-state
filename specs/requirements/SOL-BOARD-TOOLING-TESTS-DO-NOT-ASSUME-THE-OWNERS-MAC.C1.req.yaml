text: |
  The test of the layout tools' refusal to run without the layout editor's board module gives the tools an interpreter that cannot import it and asserts they refuse, and it passes on a host where the interpreter running the tests can import the module. Out of scope are the tools' behaviour under an interpreter that can import it.
