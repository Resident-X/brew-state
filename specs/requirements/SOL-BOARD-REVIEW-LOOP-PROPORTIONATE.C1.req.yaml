id: SOL-BOARD-REVIEW-LOOP-PROPORTIONATE.C1
type: criterion
title: After a fix a fresh reviewer may judge only the items the change touches, and only a full round closes the review
status: active
version: 2
measurement_type: binary
verification: test
text: |
  After a fix to the board the method lets a fresh reviewer judge only the catalogue items that the changed regions and nets touch, naming the regions from the fix commits and listing each item judged with the reason, while the automated checks and views run in full. A narrow round never closes the review: it closes only on a full round, which judges every item, that leaves no finding open. Each round states its kind, full or narrow, in its opening lines; the review record's check refuses a closing round that states no kind and fails a closing round that is narrow, and a seeded fault in the check's tests shows each. The wording of SOL-BOARD-LAYOUT-REVIEW-FEEDS-RULES.C3 that requires the whole checklist after any change is superseded by SOL-BOARD-LAYOUT-REVIEW-FEEDS-RULES.C5 in the same change. Each closed proof design's review record, hardware/proof/review-proof/layout-review.md and hardware/proof/method-proof/layout-review.md, gains a new closing full round that states its kind, judged on design files unchanged since its present closing round and recorded without altering any earlier round, so that both pass the review record's check with the closing-round rule in force and the check's test on the repository's own proof record keeps passing. Out of scope: the review's other steps and safety closure.
