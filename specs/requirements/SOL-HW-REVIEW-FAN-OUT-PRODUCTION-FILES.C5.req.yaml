id: SOL-HW-REVIEW-FAN-OUT-PRODUCTION-FILES.C5
type: criterion
title: A fanned-out blind check of seeded production files meets the kit's pooled criterion against the recorded single-reviewer runs
status: active
version: 2
measurement_type: binary
verification: demonstration
text: |-
  Run the single-reviewer form and the fanned-out form on the layout review proof design's production files seeded by a session that does not then check them, in sessions with no record of the seeds. The fanned-out form reports every seeded defect, a rotated part and a reversed polarised part among them, by a parts row or a layers row that is not a match, and every seed the single reviewer reports; the verdicts row by row are compared and a difference explained. Record for the shared context and each session and for each run the wall time, the tokens read, written and generated, the cost, and any call refused for a rate limit. The kit's pooled criterion judges the fanned-out run against the recorded single-reviewer runs of this review's seeded proof, running the single form only where no baseline is recorded: the seeds found are no fewer than the fewest any single run found, the wall time is at most half the single mean and the cost is at most the multiple the review's proof states. A seed not reported is closed where the gap lies and the run repeated in a new session. The evidence names the exact model and the commit. Out of scope: placing an order and the other proofs.
