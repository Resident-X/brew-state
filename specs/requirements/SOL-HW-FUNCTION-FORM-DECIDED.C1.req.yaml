id: SOL-HW-FUNCTION-FORM-DECIDED.C1
type: criterion
title: Every function is given a form with a reason that names what makes that form better
status: active
version: 1
measurement_type: binary
verification: analysis
text: |
  The record gives a form, a circuit the project designs or a module it buys, to every function in the set: each channel row of the component specification, the logic supply, the supply-timing front end, the controller (including whether it is designed onto a board or remains a module), and the proof-of-life interlock; and it reopens each module of the earlier design by name, the controller module, the pump dimmers, the relay module, the supply carrier and the energy meters, none kept by default. Each reason names what about the function makes the chosen form better, weighed against the fixed constraints in the controller boards' design-constraints record (including the carried-forward module properties, which the chosen form is shown to meet) and the cost boundary, with reused and commodity parts as the default and any departure carrying its specific argument. Each function either cites the published reference design its form follows or records that none was found and where it was looked for. Hardware already bought for the controller is weighed as an option before anything replaces it. Where the choice changes the controller, its effect on the firmware already written, at the hardware seam and the target build, is stated. Each form is judged against the component specification's own row for the channel, cited rather than restated. A function absent from the record fails the criterion. The operator-interface channels are served directly by the replacement, since the front panel is a passive assembly with no controller of its own to speak to, so retaining the panel board is not one of the options reopened. The pump drive keeps its phase-capable arrangement, so it serves whichever modulation the coffee plant model's ripple simulation selects; whether stroke-level pump coil current is measured is left to that simulation and carried as an anticipated channel rather than decided by this record. Out of scope: dividing the functions between boards, the floorplan, the separation basis, headroom reservation and cost estimates, which are later leaves; formal selection of the machine's controller, which stays open.
