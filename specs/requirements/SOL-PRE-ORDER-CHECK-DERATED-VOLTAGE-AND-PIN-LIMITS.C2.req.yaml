id: SOL-PRE-ORDER-CHECK-DERATED-VOLTAGE-AND-PIN-LIMITS.C2
type: criterion
title: A pin whose net can exceed its absolute maximum or minimum fails
status: active
version: 4
measurement_type: binary
verification: test
text: |-
  The pin-limit record holds domains (rail and highest_voltage_v) and per part by LCSC number its datasheet source (document, revision, section, read_on) and pins with domain, absolute_max_v, absolute_min_v and tolerates_driven_unpowered. The mains domain is the power domain whose rail is on a net of the Mains net class. The lowest voltage a net can reach is used only to test absolute_min_v, and is the smallest of 0 V where it is the rail of a domain other than the mains domain, minus the domain's highest_voltage_v where it is the rail of the mains domain, the lowest voltage of every listed pin's domain on it, and that of any net joined to it as below. The highest voltage a net can reach is the largest of its rail's highest_voltage_v, the domain voltage of every listed pin on it, and that of any net joined to it, directly or in a chain, through a ferrite bead, inductor, fuse or zero-ohm link. A resistor or capacitor never carries one net's voltage onto another, so a divider or a decoupling capacitor never lifts a net, and a net reached only through those and carrying no listed pin takes no limit from this rule. A connector pin driven from outside the board is declared in the connector's entry. The rule fails a listed pin that the placed part's symbol does not have, a pin whose net can exceed absolute_max_v or fall below absolute_min_v, a pin whose net is driven from another domain while its own is unpowered where tolerates_driven_unpowered is false (a domain whose highest_voltage_v is zero never drives), and every semiconductor or integrated-circuit part the record omits; a passive or mechanical part needs no entry. A part's kind is read from the exact leading letters of its reference designator: U is an integrated circuit, D, Q or LED a semiconductor, FB, L, F or R with the value zero a part that joins nets, and any other designator a passive or mechanical part. A pin whose datasheet limit is a current is not listed. A key in these records the decisions do not name fails. Out of scope: current and power limits and the choice of real datasheet figures.
