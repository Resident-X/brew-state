id: SOL-MAIN-BOARD-EXCEPTIONS-COVER-EVERY-REPORTED-SHORTFALL-PAIR.C2
type: criterion
title: Every entry the record holds is signed by the owner and the record stands signed
status: active
version: 2
measurement_type: binary
verification: inspection
text: |-
  Every entry the separation basis record holds names the owner in accepted_by and carries a valid accepted_on dated no later than the record's own, the record's own accepted_by and accepted_on are present, none is empty or a placeholder, and the check's reader finds no problem with the record. Inspection of the committed record against the check's reader. Out of scope is the owner's instruction itself.
