id: REQ-MEASUREMENT-001.C5
type: criterion
title: Water movement through the machine is measured, not inferred
status: active
version: 2
measurement_type: rate
verification: test
text: |
  Flow is the dominant disturbance on a flow-through heated mass and the machine's main source of advance notice, and several behaviours depend on observing it: acting before its effect appears, and confirming that a commanded pump actually moved water.

  Inferring it from temperature response gives a lagged, filtered version of something directly observable, and cannot distinguish no flow from flow that is not removing heat.
links:
