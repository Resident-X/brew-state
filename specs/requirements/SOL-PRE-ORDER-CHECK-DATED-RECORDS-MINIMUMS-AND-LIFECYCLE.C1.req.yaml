id: SOL-PRE-ORDER-CHECK-DATED-RECORDS-MINIMUMS-AND-LIFECYCLE.C1
type: criterion
title: A board whose minimums are looser than the dated manufacturer record fails
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  A manufacturer limits record, found by the nearest-folder rule and marked synthetic in a proof design, states the date read, its source, a max_age_days and per process the limits (minimum track width, clearance, drill, annular ring, hole-to-hole and every other board-setup or rule key it bounds) each with the citation of the published entry it was read from. The design's process is its copper layer count, derived from its own layer stack, and its finished outer copper weight, declared in the board rules record's fabrication mapping because no layout file carries it. The rule fails a board whose board-setup minimums, each net class's clearance and track width, or any minimum a custom rule sets, is looser than its process's limit; a board whose process the record does not list; a board-setup minimum the record bounds that the project file does not state; a design that declares no outer copper weight; a design with no usable record; a synthetic record applied to an orderable board; and a record older than its own max_age_days, as the catalogue extract is. A test holds each recorded figure of a record not marked synthetic to the matching entry of the dated prose manufacturer record it cites (SOL-HW-MANUFACTURER-BOUNDS-DATED.C1), each citation naming the entry's section, limit and condition, so the record cannot drift from its source. Out of scope: choosing the real manufacturer figures and the copper weight for a real board, and any minimum the record does not state.
