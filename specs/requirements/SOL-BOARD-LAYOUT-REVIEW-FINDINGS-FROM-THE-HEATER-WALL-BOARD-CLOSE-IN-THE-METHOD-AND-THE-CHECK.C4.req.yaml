text: |-
  The main board's and the heater wall board's manufacturer limits records carry recommended_mm for each limit that has one and a below_recommended entry for each minimum their design settings hold below it, each naming its cause, so that no tracked design fails the rule, and hardware/README.md states the new keys and the check's line. Out of scope - the board designs themselves.
