id: SOL-HW-REVIEW-FAN-OUT-PRODUCTION-FILES.C3
type: criterion
title: A review folder for a real order holds the production files, the footprint drawings, the design's views and the preview, and nothing of the designer's reasoning
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  Over a synthetic repository with a committed design and exported production files, a command writes a review folder outside the repository holding the placement file, the parts list, the Gerber and drill files, the image of every layer and the drill file, the footprint drawings with their index and rotation rule, the design's rendered views, the assembler's preview as supplied, the parts specification record, the manufacturer's record, the method and the hardware notes, and holds no check record and no file the commit does not hold. It takes the commit as an input and records it, and refuses a folder inside the repository, a folder that is not new or empty, and a missing preview. The command is `task hw:production-review-folder`; its round file is written through the layout folder command's round-file machinery with the fields commit, tools, commands and preview. Out of scope: exporting and rendering, and obtaining the preview.
links:
  - target: SOL-HW-REVIEW-FAN-OUT-PRODUCTION-FILES
    type: criterion-of
