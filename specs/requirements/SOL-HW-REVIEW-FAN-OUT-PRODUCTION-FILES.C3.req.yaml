id: SOL-HW-REVIEW-FAN-OUT-PRODUCTION-FILES.C3
type: criterion
title: A review folder for a real order holds the production files, the footprint drawings, the design's views and the preview, and nothing of the designer's reasoning
status: active
version: 4
measurement_type: binary
verification: test
text: |-
  Over a synthetic repository with a committed design and exported production files, a command writes a review folder outside the repository holding the placement file, the parts list, the Gerber and drill files, the image of every layer and the drill file, the footprint drawings with their index and rotation rule, the design's rendered views, the assembler's preview as supplied, the parts specification record, the manufacturer's record, the method and the hardware notes, and holds no check record and no file the commit does not hold. It takes the commit as an input and records it, and refuses, reporting every cause at once, a symbolic link in any supplied folder, a production-files-check.md already in any supplied folder, an output folder inside the documents repository or inside any input folder, a folder that is not new or empty, a missing preview, a work folder lacking placement.csv, parts-list.csv, or gerbers, layers or footprints files (layers and footprints each holding index.txt and index.json), an unreadable placement file, a views or placement-view folder lacking index.txt, a commit holding no board at the design (one project, one layout) or no parts specification record at the design, a documents repository or commit lacking any of the method, the hardware notes or the manufacturer's record, a tools line, command or preview note that is blank, spans lines or holds a code fence, a check with no command, round-file keys beyond tool, fields, commit, tools, commands and preview, and production field names mixed with another review's; the layout folder command refuses round-file fields naming tools, commands or preview; a failure while writing removes the folder. The command is `task hw:production-review-folder`; it assembles the folder through the assembly the production-files seeding script already holds, whose behaviour and tests are unchanged, and its round file is written through the layout folder command's round-file machinery with the fields commit, tools, commands and preview. Out of scope: exporting and rendering, and obtaining the preview.
links:
  - target: SOL-HW-REVIEW-FAN-OUT-PRODUCTION-FILES
    type: criterion-of
