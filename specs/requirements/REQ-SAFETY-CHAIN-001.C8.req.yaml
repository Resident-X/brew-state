id: REQ-SAFETY-CHAIN-001.C8
type: criterion
title: Every single component fault in the chain removes heater power, leaves its hazard bounded by an independent element, or is detected
status: active
version: 2
measurement_type: binary
verification: analysis
text: |
  Each part of the chain is taken in turn as failed in each way its kind can fail, open, short or stuck, and the outcome is shown to be one of: heater power removed; the hazard that part guards against still bounded by a named element of the chain that is independent of the failed part and of the controller; or the fault detected before a second fault can combine with it, the machine then being held from heating until a person attends. Detection is by the chain's own means, such as a test the chain imposes before heater power can be made available, and never by the controller or its firmware noticing, since the chain owes nothing to either. A fault that leaves the chain looking healthy while no independent element still bounds the hazard it guarded against is the case this exists to exclude.
