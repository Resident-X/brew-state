id: SOL-PRE-ORDER-CHECK-JUDGES-SAME-CONNECTOR-PLATED-HOLE-SPACING-EXCEPTIONS.C5
type: criterion
title: Each new failure is shown to fail on a fault seeded for it in a copy of the throwaway proof design
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The on-demand seeded-fault proof gains one row for each failure above (a malformed entry, a shortfall at another centre spacing, a shortfall between different parts, a shortfall below the accepted distance, an unsigned entry, an entry relaxing nothing, an entry for an absent connector and an entry no shortfall uses), each made in a copy outside the tracked tree and caught under the rule named for it, and the rows join the proof's required-names dictionary. Rules this leaf does not touch get no row. Rows for the mains-spacing exceptions are out of scope here.
