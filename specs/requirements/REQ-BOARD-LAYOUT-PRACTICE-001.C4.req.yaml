id: REQ-BOARD-LAYOUT-PRACTICE-001.C4
type: criterion
title: A board's first full review finds no failure of safety or function against an item its plan covered
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Practice is designed into the board, not reached by repeated review. The board's first full review finds no failure, bearing on safety or on whether the board works, against an item its design-time plan said it would meet; such a failure fails this criterion for that board even once the board is changed.
