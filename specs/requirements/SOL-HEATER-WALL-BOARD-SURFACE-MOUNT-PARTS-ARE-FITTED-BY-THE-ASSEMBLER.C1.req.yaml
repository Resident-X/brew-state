id: SOL-HEATER-WALL-BOARD-SURFACE-MOUNT-PARTS-ARE-FITTED-BY-THE-ASSEMBLER.C1
type: criterion
title: The six surface-mount parts are in the position file and the fiducial rule carries a signed exception
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  The heater wall board's U911, U921, R911, R912, R921 and R922 are no longer excluded from the position file, the board's fiducial rule carries a signed exception whose ground is the manufacturer's published statement that it supplies the fiducials for Economic assembly, and the board's copper, mask, drill and silkscreen are unchanged. The layout rule check reports no violation that the board did not report before the change. Adding fiducials and changing any mains copper are out of scope.
