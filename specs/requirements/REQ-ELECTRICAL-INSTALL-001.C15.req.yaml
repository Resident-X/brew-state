id: REQ-ELECTRICAL-INSTALL-001.C15
type: criterion
title: Conductors at different mains potentials on a board stand at or above the signed mains-to-mains clearance and creepage
status: active
version: 3
measurement_type: binary
verification: analysis
text: |
  Two conductors of a board that sit at different potentials of the mains supply stand at least the clearance and creepage the governing standard gives for the declared supply, overvoltage category, pollution degree, material group and altitude, read from that standard or from a cited, freely available derivation of it. Where the working voltage lies between two rows of a creepage table, the figure is the linear interpolation between them rounded up, and never the figure of a row below the working voltage. Where a fault between the pair is cleared only by the supply's own protection, the creepage is the basic-insulation distance; the lower functional-insulation distance serves downstream of a protective device only where that device is shown to clear a tracking fault between the pair at the prospective fault current. The terminals of a part are held to a larger clearance than conductors elsewhere, for the movement a terminal allows. A pair across a device whose bypass would defeat a safety function, such as the open contact of the interlock relay, is outside these figures and is held at the mains-to-low-voltage reinforced figures. A pair of conductors that a part or a chain of parts joins and divides the supply between, such as a resistor divider, a series chain or the midpoint of a line-to-neutral pair, may be held to the creepage the same table column gives for the voltage across its gap, interpolated and rounded up as above and never below the pair's clearance, only where the record lists that pair with its working voltage written and its derivation; a pair that can reach the full supply voltage in any state of the circuit is not reduced, and every pair not listed is held to the creepage for the supply's working voltage. The pollution degree the figures are read at is 3 unless the boards are protected against moisture; a conformal coat applied before the boards are energised may credit 2, never 1, and the record states the protection and the conditions of the credit. The figures are stated in the separation basis and signed with it, so an adopter on a different supply recomputes them rather than inherits them.
