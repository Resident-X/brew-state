id: REQ-ELECTRICAL-INSTALL-001.C15
type: criterion
title: Conductors at different mains potentials on a board stand at or above the signed mains-to-mains clearance and creepage
status: active
version: 2
measurement_type: binary
verification: analysis
text: |
  Two conductors of a board that sit at different potentials of the mains supply stand at least the clearance and creepage the governing standard gives for the declared supply, overvoltage category, pollution degree, material group and altitude, read from that standard or from a cited, freely available derivation of it. Where the working voltage lies between two rows of a creepage table, the figure is the linear interpolation between them rounded up, and never the figure of a row below the working voltage. Where a fault between the pair is cleared only by the supply's own protection, the creepage is the basic-insulation distance; the lower functional-insulation distance serves downstream of a protective device only where that device is shown to clear a tracking fault between the pair at the prospective fault current. The terminals of a part are held to a larger clearance than conductors elsewhere, for the movement a terminal allows. A pair across a device whose bypass would defeat a safety function, such as the open contact of the interlock relay, is outside these figures and is held at the mains-to-low-voltage reinforced figures. The figures are stated in the separation basis and signed with it, so an adopter on a different supply recomputes them rather than inherits them.
