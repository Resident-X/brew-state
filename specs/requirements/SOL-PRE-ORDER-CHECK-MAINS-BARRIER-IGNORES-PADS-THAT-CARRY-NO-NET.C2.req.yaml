id: SOL-PRE-ORDER-CHECK-MAINS-BARRIER-IGNORES-PADS-THAT-CARRY-NO-NET.C2
type: criterion
title: The grouping is shown against seeded faults and is stated in the method and the hardware notes
status: active
version: 1
measurement_type: binary
verification: test
text: |
  The seeded-fault harness holds two rows on the throwaway proof design's bridging part, one with a no-connect pad added beside a mains pad and copper under the part, and one with a pad on a Mains-class net given no number and copper under the part, each caught as mains_barrier, and the required-names dictionary in test_board_check_kicad_marks.py requires both. MAINS-5 in the method and the mains_barrier entry and MAINS-5 paragraph in the hardware notes state that a pad with no net and no number or no copper, and a pad on a net named unconnected-(...) that no other pad carries, is no pad off the class, and that a pad on a Mains-class net counts whatever its number or layer. The main board's layout and every other pre-order rule are out of scope.
