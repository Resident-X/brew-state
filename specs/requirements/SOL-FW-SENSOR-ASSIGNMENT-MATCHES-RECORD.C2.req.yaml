id: SOL-FW-SENSOR-ASSIGNMENT-MATCHES-RECORD.C2
type: criterion
title: A sensor channel present in only one of the firmware assignment and the record fails the check
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  Only record entries that carry a firmware_sensor key take part in the comparison; the other checks hold the rest. A sensor channel the firmware assigns that no such entry names fails the check, and so does a record entry naming a sensor channel the firmware does not assign, each naming the channel. A converter input the map does not list, and a map, record or firmware that cannot be read or lists nothing to compare, fail, since an empty subject would otherwise pass. Out of scope: wiring the check to a machine's real record and map, which that board's design task does.
links:
  - target: SOL-FW-SENSOR-ASSIGNMENT-MATCHES-RECORD
    type: criterion-of
