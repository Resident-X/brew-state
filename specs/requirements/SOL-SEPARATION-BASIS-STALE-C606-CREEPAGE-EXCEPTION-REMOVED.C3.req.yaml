id: SOL-SEPARATION-BASIS-STALE-C606-CREEPAGE-EXCEPTION-REMOVED.C3
type: criterion
title: The record's signature day is entered only on the owner's written instruction
status: active
version: 1
measurement_type: binary
verification: inspection
scope: Signature day and its header statement only; no figure, pair or reason changes.
text: |-
  The record's top-level accepted_on and the accepted_on of each of its 32 remaining entries still read 2026-11-06, and the header states in one sentence that the entry for the C606 pad pair was removed on 2026-11-07 on the owner's written instruction, that the removal excuses nothing and relaxes nothing, and that the record's signature day is unchanged. An inspection of the record by reading it is the check; the test that fails on a changed day or a missing header statement is required by the criterion on the tests that follow the removal. Out of scope: any figure, pair or reason.
