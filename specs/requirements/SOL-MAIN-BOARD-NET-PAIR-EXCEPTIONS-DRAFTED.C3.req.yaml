id: SOL-MAIN-BOARD-NET-PAIR-EXCEPTIONS-DRAFTED.C3
type: criterion
title: Each creepage entry's accepted distance is the band figure for its working voltage
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  For each creepage net-pair entry of the committed record, accepted_mm equals the creepage band figure the record's functional rows give for the entry's working_voltage_v, and for each clearance net-pair entry it equals the clearance band figure for it (0.2 mm at 10 V). A copy of the record with one accepted_mm lowered by 0.1 mm fails the check's own reader's judgement of the entry. Out of scope is the check's judgement against a layout.
