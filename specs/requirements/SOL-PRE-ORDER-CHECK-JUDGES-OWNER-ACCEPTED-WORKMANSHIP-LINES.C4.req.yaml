id: SOL-PRE-ORDER-CHECK-JUDGES-OWNER-ACCEPTED-WORKMANSHIP-LINES.C4
type: criterion
title: An entry that is unsigned, names an unknown rule or place, names a rule outside the workmanship set, or is used by no line fails naming it
status: active
version: 1
measurement_type: binary
verification: test
scope: The failures of an entry as a whole. Out of scope is a well-formed signed entry that a line uses.
text: |-
  On a synthetic design, an entry with an empty, placeholder or angle-bracketed accepted-by value, an entry with an empty, malformed or future date, an entry naming a rule outside the closed set the leaf states (each of hole_to_hole, workmanship_rule, workmanship_figure and workmanship_pad_copper, and any rule that is not a workmanship or neatness rule), a courtyards_overlap entry used by a line that names a custom rule such as the crystal keep-clear, an items_not_allowed entry used by a line that names a rule other than the floorplan region rule, an entry naming a mains spacing, derated-voltage or pin-limit rule, an entry for a place the design does not have, and an entry that no line uses each fail the check naming the entry, and a design marked synthetic is honoured only when it is marked not for manufacture. On the same design, for each of the nineteen names of the closed set (workmanship_detour, workmanship_pad_entry, workmanship_pad_corner, workmanship_width, workmanship_direction, track_angle, track_segment_length, courtyards_overlap, test_point_courtyard, designator_astray, silk_overlap, items_not_allowed, pour_gap, decoupling_via, starved_thermal, silk_over_copper, footprint_symbol_field_mismatch, footprint_symbol_mismatch and lib_footprint_mismatch), a signed entry at the place of a line of that name, with a count equal to the lines there, is accepted and used by that line, and the same entry fails as stale when no line of that name stands at its place; a signed entry whose accepted-by value reads 'david (signed by Claude on his standing instruction of 2026-11-07)' is accepted as signed. The same entry for side_fiducials, hole_to_hole, workmanship_rule, workmanship_figure or workmanship_pad_copper fails as naming a rule outside the set. Out of scope is a well-formed signed entry that a line uses.
