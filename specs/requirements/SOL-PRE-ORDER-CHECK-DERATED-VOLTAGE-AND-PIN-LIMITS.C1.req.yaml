id: SOL-PRE-ORDER-CHECK-DERATED-VOLTAGE-AND-PIN-LIMITS.C1
type: criterion
title: A part whose net can exceed its derated voltage rating fails
status: active
version: 4
measurement_type: binary
verification: test
text: |-
  Every position of the parts specification record carries class, naming a class of the derating policy exactly, or the value none for a part no class covers and whose rating, in the record and in the design's Rating field, states no figure in V, VDC or VAC, so a part that states such a figure and names none fails; a position without it, or naming a class the policy lacks, fails. Every position whose part falls in a covered class carries a rating written as a figure with unit V, VDC or VAC in both that record and the design's Rating field, and one without it fails. An AC figure is taken at its peak. The working voltage of a part is the largest, over every pair of nets it connects, of the difference between their highest voltages, each worked out as for pin limits, except that a pair whose two nets both take their highest voltage from the mains domain counts as that domain's highest_voltage_v, since a part across them sees the mains swing between them, and a covered part with a net whose voltage cannot be worked out, being reached only through resistors or capacitors with no rail or listed pin, fails until that net is declared as the rail of a power domain in the pin-limit record; for a part on a mains-referenced net the mains rating is the peak of the basis working_voltage, read as the working voltage at the top of the declared supply span. A mains domain in the pin-limit record is required when mains is declared present and is at least that peak. The rule fails a part whose working voltage exceeds the policy's voltage share times its rating. Out of scope: the power and temperature shares of the policy and the choice of derating figures.
