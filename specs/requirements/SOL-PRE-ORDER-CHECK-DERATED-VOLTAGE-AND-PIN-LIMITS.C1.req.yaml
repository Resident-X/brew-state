id: SOL-PRE-ORDER-CHECK-DERATED-VOLTAGE-AND-PIN-LIMITS.C1
type: criterion
title: A part whose net can exceed its derated voltage rating fails
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  Every position of the parts specification record carries class, naming a class of the derating policy exactly, or the value none for a part no class covers; a position without it, or naming a class the policy lacks, fails. Every position whose part falls in a covered class carries a rating written as a figure with unit V, VDC or VAC in both that record and the design's Rating field, and one without it fails. An AC figure is taken at its peak. The working voltage of a part is the largest, over every ordered pair of nets it connects, of the highest voltage of one net less the lowest voltage of the other, each worked out as for pin limits, and a covered part with a net whose voltage cannot be worked out, being reached only through resistors or capacitors with no rail or listed pin, fails until that net is declared as the rail of a power domain in the pin-limit record; for a part on a mains-referenced net the mains rating is the peak of the basis working_voltage, read as the working voltage at the top of the declared supply span. A mains domain in the pin-limit record is required when mains is declared present and is at least that peak. The rule fails a part whose working voltage exceeds the policy's voltage share times its rating. Out of scope: the power and temperature shares of the policy and the choice of derating figures.
