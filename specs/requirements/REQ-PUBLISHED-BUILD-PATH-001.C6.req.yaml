title: Every board's schematic can be read by someone who did not draw it
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Every design git tracks passes the two refusals. A change to a design's schematic or sheets re-runs the board tier of the build round, and the nightly run of main runs the refusals whatever changed, through the board gate the pre-order check already uses. No new gate and no new tool is introduced.

  Out of scope: a new gate, a new tool, and the full seeded-fault proof, which stays on demand.
