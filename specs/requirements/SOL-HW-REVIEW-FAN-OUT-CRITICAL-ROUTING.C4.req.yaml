id: SOL-HW-REVIEW-FAN-OUT-CRITICAL-ROUTING.C4
type: criterion
title: A fanned-out critical-routing check of a seeded copy meets the kit's pooled criterion against the recorded single-reviewer runs
status: active
version: 2
measurement_type: binary
verification: demonstration
text: |
  Run the single-reviewer form and the fanned-out form on a copy of the method proof design, whose layout plan holds a critical routing section, seeded by a session that has not read the catalogue with defects on critical nets, among them a ground drawn as thin traces, a decoupling capacitor routed the long way round and a sense connection tapped off a load track, the seed list written apart, in sessions with no record of the seeds. The fanned-out form reports every seed the single-reviewer form reports, as a failing verdict against the item that covers it; the verdicts item by item are compared and a difference explained. Record for the shared context and each session and for each run the wall time, the tokens read, written and generated, the cost, the document retrievals and any call refused for a rate limit. The kit's pooled criterion judges the fanned-out run against the recorded single-reviewer runs of this review's seeded proof, running the single form only where no baseline is recorded: the seeds found are no fewer than the fewest any single run found, the wall time is at most half the single mean and the cost is at most 1.25 times the single mean, the multiple the layout proof uses, unless the review's first measured run shows its replicas need more, in which case the proof states the new multiple and the evidence says why. A seed not reported is closed where the gap lies and the run repeated in a new session. The evidence names the exact model and the commit. Out of scope: the layout review round's proof.
