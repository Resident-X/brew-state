id: SOL-PRE-ORDER-CHECK-SEPARATION-FLOOR-AND-MOUNTING-HOLES.C2
type: criterion
title: A mounting hole that breaches the separation from mains fails
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  A mounting hole is a footprint whose pads are all holes and every non-plated hole; a fixing's extent is the larger of its pad and its courtyard. After the signed Mains rule the check appends rules holding the hole clearance and courtyard distance to the Mains class at no less than the signed clearance on every layer, and fails a hole, its plating or fixing inside the signed distance of a Mains net, and a plated hole on a non-Mains net inside that distance. The signed figure governs whether or not the fixing is bonded to protective earth. Out of scope: the mechanical strength of the fixing and any fixing outside the board file.
