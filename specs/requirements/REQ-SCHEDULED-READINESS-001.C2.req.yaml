id: REQ-SCHEDULED-READINESS-001.C2
type: criterion
title: Reaching readiness never leaves the machine able to deliver unattended
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Being hot and being able to serve are separate states, and only the first is safe to reach without a person.

  A delivery still requires somebody at the machine, exactly as it does when readiness was reached locally.
