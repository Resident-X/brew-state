id: SOL-HW-REVIEW-FAN-OUT-SCHEMATIC.C2
type: criterion
title: The merge gives every catalogue item a verdict row and covers every net, part and sheet of the schematic, and names no row for anything that does not exist
status: active
version: 5
measurement_type: binary
verification: test
text: |-
  Over a synthetic netlist, a synthetic sheet list and synthetic unit results, the merge fails naming a catalogue item with no verdict row, a net, part or sheet of the netlist or sheet list that appears in no item's rows, and a row that names a net, part or sheet that does not exist. It also fails a row for an item not on the checklist, a net, part or sheet in no item's rows, a free-pass row that is not none, a none row beside other rows of the same item within one replica's own answer, a pass or fail with empty Rests on, a not applicable or fail with empty Why, a fail citing no finding of its own item or valid earlier-round finding or citing another item's finding, a finding for an item that does not fail, a finding whose Raised by is not its item or `free pass`, a severity outside safety, function, quality and cosmetic, a non-empty Closed by, an empty What and where, and a recorded cannot judge for an unknown item or a pair with no row. The caller refuses before any session starts a round file that is not a schematic one, a netlist whose parts or sheets differ from the schematic's, a missing netlist, method-extract section, drawing, check report or schematic, and a catalogue area with no item; the rendered round file is named round-<n>.md. It rejects a table with a column the method's table does not have, numbers this round's findings at the merge as the kit does, and gives the same record whatever order the units arrive in. When replicas disagree whether an item selects anything, the rows of the replica that judged what it selects stand and the none row gives way. It fails a round that still holds a cannot judge, naming the item and what it needs, and renders a resolved one as `cannot judge, then <verdict>`. Out of scope: which nets an item selects, whether a verdict is right, and the free pass.
