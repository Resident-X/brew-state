id: SOL-SEPARATION-BASIS-RECORD-MAINS-TO-MAINS-ACCEPTED-BY-OWNER.C3
type: criterion
title: The acceptance covers the interpolation position, the terminal allowance, the pollution degree 2 column, the coat conditions and the net-pair working voltages
status: active
version: 2
measurement_type: binary
verification: inspection
text: |-
  For each of the readings the record marks for the owner's check, the household-appliance standard's position on interpolating its creepage table, the 0.5 mm terminal allowance, the pollution degree 2 material group III column of the 250 V and 320 V rows, the six conditions of the coat credit and the working voltage of each net-pair entry, the session records the owner's answer before acceptance is entered, as accepted or corrected. A corrected reading returns to the record's leaf and no acceptance is entered until the amended record has been shown again. Reading the standards' own text is out of scope here.
