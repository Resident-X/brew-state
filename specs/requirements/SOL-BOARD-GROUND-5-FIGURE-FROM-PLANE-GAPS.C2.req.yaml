title: The corrected GROUND-5 figure is worked for the review-proof design and the proof designs still pass
status: active
version: 3
measurement_type: binary
verification: test
text: |
  State in the GROUND-5 item a worked figure for the review-proof design, giving its widest annulus among the pins in a ground plane, the gaps taken and the zone's minimum thickness with the arithmetic, and show that the pre-order check still passes on the three proof designs under hardware/proof and the corrected figure in the rules file of each design that already carries the rule. Method-proof, which carries it, recomputed under the corrected item gives the figure its rules file already holds. Review-proof, whose review is closed, and gate-proof, with no ground plane and so no figure, have their rules files left as they are. The check's run on each of the three designs is the evidence. Out of scope: moving copper on any proof design, and the other catalogue items.
