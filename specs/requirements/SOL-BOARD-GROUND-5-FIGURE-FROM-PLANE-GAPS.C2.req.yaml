text: |
  State in the GROUND-5 item a worked figure for the review-proof design, giving its widest annulus among the pins in a ground plane, the gaps taken and the zone's minimum thickness with the arithmetic, and show that the pre-order check still passes on the three proof designs under hardware/proof with the corrected figure in their rules files where the item requires one. Method-proof recomputed under the corrected item gives the figure its rules file already holds, and gate-proof, with no ground plane, has no figure. The check's run on each of the three designs is the evidence. Out of scope: moving copper on any proof design, and the other catalogue items.
