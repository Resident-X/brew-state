id: SOL-HW-HEATER-WALL-BOARD-REACHABLE-CONNECTOR-DISCHARGE-LEVELS-DECLARED.C1
type: criterion
title: Every connector of the board is classed reachable or not, closed over the board's connector list
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  The board's records list every connector the board places, derived from its schematic and parts record, and state the list as complete; each is classed reachable or not reachable by a person with the machine assembled. A connector whose reachability depends on the printed case is classed reachable, and its record names the printed-case design as the work that can relax the class. Out of scope: the case design itself and any physical discharge measurement.
