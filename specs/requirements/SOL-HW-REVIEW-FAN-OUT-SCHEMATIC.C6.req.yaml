id: SOL-HW-REVIEW-FAN-OUT-SCHEMATIC.C6
type: criterion
title: A fanned-out blind review of a seeded proof schematic finds every seed the single-reviewer form finds, in no more time and at no more cost
status: active
version: 1
measurement_type: binary
verification: demonstration
text: |-
  Run the single-reviewer form and the fanned-out form on one copy of the circuit review proof design seeded by a session that has not read the catalogue, in sessions with no record of the seeds, the fanned-out form at the full unit count. The fanned-out form reports every seeded defect as a finding against the catalogue item that covers it, and every seed the single reviewer reports; the findings that match no seed and the verdicts item by item are compared and a difference explained. Record for the setup and each unit and for each run the wall time, the tokens read, written and generated, the cost, the number of datasheet retrievals and any that failed, and any call refused for a rate limit. The fanned-out run takes no more time and costs no more than the single-reviewer run. A seed not reported is closed where the gap lies and the run repeated in a new session. The evidence names the exact model and the commit. Out of scope: the layout, critical-routing and production-files proofs.
