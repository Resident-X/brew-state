id: SOL-HW-FUNCTION-FORM-DECIDED.C3
type: criterion
title: Every figure held pending against the choice of form is recorded with its source and the mark ended
status: active
version: 1
measurement_type: binary
verification: inspection
text: |-
  Every entry the controller boards' design-constraints record marks pending against the partition and feasibility task's choice of form is ended: the figure is recorded with its source, a bought part's figure read from its manufacturer's current datasheet with its revision or read date, including the isolation rating of each part forming a mains barrier (supply module, heater switches, pump drives and their zero-cross output, valve switches) and of the pressure sensors' insulation from the water path, the steam-path transducer's part with its proof pressure, burst pressure and full scale checked against the recorded basis, the availability and price of each bought module the catalogue does not stock, and, where a designed isolated converter is chosen, its transformer's rated insulation. A rating that cannot be sourced is recorded as absent, not adequate, and the form is not chosen on it. Each document that restates an ended figure is brought to match in the same change. A pending mark against this choice left standing fails. Out of scope: marks held against the design task of a board (rail budgets, branch fuse ratings, protective clearing times), which the per-board design tasks end.
links:
