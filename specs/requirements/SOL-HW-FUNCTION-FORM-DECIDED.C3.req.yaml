id: SOL-HW-FUNCTION-FORM-DECIDED.C3
type: criterion
title: Every figure held pending against the choice of form is recorded with its source and the mark ended
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Every entry the controller boards' design-constraints record marks pending against the partition and feasibility task's choice of form is ended: the figure is recorded with its source, a bought part's figure read from its manufacturer's current datasheet with its revision or read date. For each part forming a mains barrier (supply module, heater switches, pump drives and their zero-cross output, valve switches) and for the pressure sensors' insulation from the water path, the record states the rating the part is required to carry as a design target and proves the form feasible with one candidate whose isolation rating is sourced from its manufacturer's current datasheet with its revision or read date; the part actually fitted is selected by the design task of the board or assembly carrying it against that target, not by this record. For the steam-path transducer, the record states the proof pressure, burst pressure and full scale the part must carry, checked against the recorded basis, and a candidate whose figures are sourced the same way. The record also states the availability and price of each bought module the catalogue does not stock and, where a designed isolated converter is chosen, its transformer's required insulation. A mark whose other half belongs to a board's design task, such as the spreader plate, if one is needed, per heater switch or a barrier rating shared with the separation basis, is re-pointed to that task, not deleted. A rating that cannot be sourced is recorded as absent, not adequate, and the form is not chosen on it. Each document that restates an ended figure is brought to match in the same change. A pending mark against this choice left standing fails. Out of scope: marks held against the design task of a board (rail budgets, branch fuse ratings, protective clearing times), which the per-board design tasks end.
