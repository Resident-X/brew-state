id: SOL-HW-HEATER-WALL-BOARD-WALL-STEEL-RECORDED-AND-TRIAC-THERMAL-JUDGEMENT-HOLDS-ON-IT.C1
type: criterion
title: Steel grade, thickness and joint resistance recorded with source
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  The heater wall board's records state the wall's material, its grade (magnetic or not) and its thickness at the owner's cut, the conductivity of that material at the lowest plausible value for its kind with the source, whether a coating lies between the spreader plate and the wall at the joint, and the thermal resistance of the bolted joint, each with its source; a quantity only the owner can measure on the machine is marked as the owner's measurement, states its bounding figure and names the measurement that closes it, and that mark is reconciled with the owner's recorded acceptance that carries the grade and thickness to the cut-time checks, so that the owner is asked once. Out of scope: measuring the wall on the owner's behalf and the cut's size, which the cut-confirmation work already covers.
