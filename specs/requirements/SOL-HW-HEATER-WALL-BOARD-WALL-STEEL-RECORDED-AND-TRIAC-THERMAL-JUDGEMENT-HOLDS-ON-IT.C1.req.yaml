id: SOL-HW-HEATER-WALL-BOARD-WALL-STEEL-RECORDED-AND-TRIAC-THERMAL-JUDGEMENT-HOLDS-ON-IT.C1
type: criterion
title: Steel grade, thickness and joint resistance recorded with source
status: active
version: 1
measurement_type: binary
verification: inspection
text: |-
  The heater wall board's records state the wall steel's grade (magnetic or not) and thickness at the owner's cut, and the thermal resistance of the bolted joint between the spreader plate and the wall, each with its source; a quantity only the owner can measure on the machine is marked as the owner's measurement and is closed by the owner's dated statement. Out of scope: measuring the wall on the owner's behalf, and the cut's size, which the cut-confirmation work already covers.
