id: SOL-SEPARATION-BASIS-RECORD-MAINS-TO-MAINS-ACCEPTED-BY-OWNER.C4
type: criterion
title: The check's reader finds the accepted record signed and its exceptions dated no later than the record
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  With the acceptance committed, the pre-order check run over the repository reports no separation_basis failure on the record as unsigned, as holding an exception entry unsigned, or as holding an exception dated after the record's own acceptance. Failures that concern a board's layout against the figures are out of scope here.
