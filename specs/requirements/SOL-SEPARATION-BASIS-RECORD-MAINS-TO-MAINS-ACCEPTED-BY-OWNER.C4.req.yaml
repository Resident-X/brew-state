id: SOL-SEPARATION-BASIS-RECORD-MAINS-TO-MAINS-ACCEPTED-BY-OWNER.C4
type: criterion
title: The check's reader on the committed record finds it signed and its exceptions dated no later than the record
status: active
version: 2
measurement_type: binary
verification: test
text: |
  With the acceptance committed, the check's reader on the committed record, the existing test route, finds it signed and reports no separation_basis failure of the record as unsigned, and the check's judgement of the record's accepted exceptions, in each of its three entry forms, reports no spacing_exception failure of an entry as unsigned or as dated after the record's own acceptance. Failures that concern a board's layout against the figures are out of scope here.
