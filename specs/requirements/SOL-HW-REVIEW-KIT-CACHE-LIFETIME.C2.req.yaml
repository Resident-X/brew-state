id: SOL-HW-REVIEW-KIT-CACHE-LIFETIME.C2
type: criterion
title: A recorded session whose cache writes landed at another lifetime than its specification's fails the run naming the session
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Every session is checked against the lifetime its specification gives, a specification that names none giving one hour. Over recorded streams, a session that wrote to the cache at that lifetime passes; the recorded one-hour probe and shared-context streams fail when the specification gives five minutes, and a five-minute stream fails when it gives one hour, each naming the session, the lifetime asked and the tokens written at each lifetime; a stream of a run recorded after the change that records cache writes without saying at which lifetime fails naming the session, because it cannot be told; and a session that wrote nothing to the cache passes. Every run's record names its lifetime, and the stream reducer keeps each call's split of cache writes by lifetime, its own test showing the split survives a reduction. The streams of a run whose record names no lifetime, made before the change and among them the committed layout-run fixtures that were reduced without the split, are not checked for it, so every check that passes over them today still passes. The contract smoke asserts the same of its probes. Out of scope: whether a fork read its parent's prefix, which the cache-miss check already covers.
