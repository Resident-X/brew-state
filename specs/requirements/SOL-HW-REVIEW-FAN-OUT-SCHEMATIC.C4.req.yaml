id: SOL-HW-REVIEW-FAN-OUT-SCHEMATIC.C4
type: criterion
title: A review folder for a committed schematic holds what the schematic review step gives a reviewer, the sheet drawings included, and nothing of the designer's reasoning
status: active
version: 4
measurement_type: binary
verification: test
text: |-
  Over a synthetic repository with a committed schematic, an exported netlist and rendered sheet drawings, a command writes a review folder outside the repository holding the schematic and its project files as the commit holds them, the netlist, every record the review step reads, the sheet drawings, the method, the hardware notes and the check's report, and holds no review record for a first round and, for a later round, only the earlier rounds of the schematic review record as recorded, and no file the commit does not hold. It refuses a folder inside the repository, a folder that is not new or empty, a missing netlist, a netlist whose parts or sheets differ from the committed schematic's, and a sheet with no drawing. It also refuses a folder inside any input or that is a file; a commit the repository lacks; a design without exactly one project and its schematic; an unreadable or uncommitted schematic or sheet file; a sheet with a slash in its name or no name; a netlist that is unreadable, not a netlist in the design tool's format, empty, cut off or a symlink, or a netlist command that is not one line; an empty or symlinked drawing; no sheets folder; a missing or symlinked check report; no record, a record given twice, or a record that is an absolute path, escapes the commit, is not at the commit, is not a markdown or yaml file or is named schematic-review.md, designer-notes*, session* or *-review.md; those names are matched without regard to case and in every component of the record's path, not only its basename; a round number that is not a whole number of 1 or more; a method lacking the schematic review, schematic drawing convention or circuit practice catalogue section, or a documents repository lacking the method or README; and a later round whose commit's record lacks an earlier round. The add modes refuse a target that is not a net, part or sheet of the folder, --cannot-judge-target on a folder that is not a schematic one, and a resolutions file carrying a target in a non-schematic folder or unknown entry keys; the round-file readers of every review refuse unknown keys. The command is `task hw:schematic-review-folder`, with add-view and add-document modes as the layout folder command's. Out of scope: exporting the netlist, drawing the sheets and running the check.
