id: SOL-HW-REVIEW-FAN-OUT-SCHEMATIC.C4
type: criterion
title: A review folder for a committed schematic holds what the schematic review step gives a reviewer, the sheet drawings included, and nothing of the designer's reasoning
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Over a synthetic repository with a committed schematic, an exported netlist and rendered sheet drawings, a command writes a review folder outside the repository holding the schematic and its project files as the commit holds them, the netlist, every record the review step reads, the sheet drawings, the method, the hardware notes and the check's report, and holds no review record and no file the commit does not hold. It refuses a folder inside the repository, a folder that is not new or empty, a missing netlist, a netlist older than the committed schematic, and a sheet with no drawing. Out of scope: exporting the netlist, drawing the sheets and running the check.
links:
