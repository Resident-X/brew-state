id: REQ-BOARD-LAYOUT-PRACTICE-001.C2
type: criterion
title: A layout finding that bears on safety is closed only by a change to the board or a named person's recorded acceptance
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Safety here covers separation between mains and anything a person or a low-voltage circuit can reach, fusing, protective earthing and insulation. The acceptance is a named person's, on the record; no agent that designed or reviewed the board closes such a finding by its own judgement.
