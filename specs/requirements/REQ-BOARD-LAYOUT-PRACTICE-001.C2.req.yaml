id: REQ-BOARD-LAYOUT-PRACTICE-001.C2
type: criterion
title: A layout finding that bears on safety is closed only by a change to the board or a named person's recorded acceptance
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Safety here covers separation between mains and anything a person or a low-voltage circuit can reach, fusing, protective earthing and insulation. Neither the designer nor the reviewer of the board can close such a finding by judging it acceptable.
