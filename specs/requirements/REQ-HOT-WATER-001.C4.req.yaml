id: REQ-HOT-WATER-001.C4
type: criterion
title: Demands on a shared heated mass are serialised by the machine, and a deferred demand proceeds once conditions return
status: active
version: 1
measurement_type: binary
verification: test
text: |
  One water channel serves both hot water and extraction, so the two are mutually exclusive whatever the electrical budget permits. Arbitrating power alone does not arbitrate this.

  Deferral rather than refusal is the required behaviour: a drink whose two halves both need the same mass is a drink the machine is required to serve, so it waits for conditions to return and then proceeds.
