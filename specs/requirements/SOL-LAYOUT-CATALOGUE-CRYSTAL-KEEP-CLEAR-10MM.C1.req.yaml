id: SOL-LAYOUT-CATALOGUE-CRYSTAL-KEEP-CLEAR-10MM.C1
type: criterion
title: CLOCK-3 and CLOCK-4 hold parts unrelated to the oscillator 10 mm from the crystal and the board check's floor is 10 mm
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  In docs/board-design-method.md, CLOCK-3 and CLOCK-4 state 10 mm in place of 25 mm everywhere they state the figure: CLOCK-3's Passes and Fails text, and CLOCK-4's heading ('Parts unrelated to the oscillator keep 10 mm from the crystal's courtyard, by the board's rules'), Asks, Passes, Fails, rule block (`min 10mm`) and the sentence naming CLOCK-3's figure, with no mention of one inch as the figure. CLOCK-3's Source keeps its two published sources and records that the owner lowered the figure to 10 mm because the one-inch figure is conservative for the 8 MHz and 32.768 kHz crystals and what protects them is close load capacitors, short tracks, ground beneath and no digital track beside. CLOCK-3's Source sentence on the 25 mm measured from the crystal's centre and its sentence on pin-side parts within 25 mm, and CLOCK-4's Source line quoting layout-review.md finding 1.5 ('within 25 mm of the crystal'), are quoted historical records and stay. The definition of a part related to the oscillator is unchanged word for word. In hardware/tools/board_check.py KEEP_CLEAR_MM is 10.0, so a crystal keep-clear rule at 10 mm or more passes the crystal_keepclear check and one below 10 mm fails with a message naming 10 mm. hardware/README.md states 10 mm in its crystal_keepclear row (:546) and in the paragraph after the table that describes the rule's constraint (:562). The change is checked by reading each of those files for the string 25 in a crystal keep-clear context and finding none other than the quoted historical records named above, and by the tests of the next criterion. Out of scope: the definition of a part related to the oscillator, the form of the keep-clear rule, the proof design's rules files and recorded reviews, and every other catalogue item.
links:
