id: SOL-BOARD-PRODUCTION-FILES-CHECKED-BEFORE-PAYMENT.C3
type: criterion
title: Following the ordering step blind on seeded production files finds every seeded defect
status: active
version: 2
measurement_type: binary
verification: demonstration
text: |
  Have a session that does not then check the files seed the production files of a proof design with defects of its own choosing, at least one rotated part and one reversed polarised part among them, recording the seeds apart from the copy; the proof design is a committed throwaway design holding a polarised surface-mount part, as the pre-order check's own proof design holds none. A fresh session with no record of the seeds follows the ordering step, and the findings are compared with the seed list. Out of scope: placing an order.
