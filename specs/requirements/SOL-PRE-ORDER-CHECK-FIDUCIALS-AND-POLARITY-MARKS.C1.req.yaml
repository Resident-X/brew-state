id: SOL-PRE-ORDER-CHECK-FIDUCIALS-AND-POLARITY-MARKS.C1
type: criterion
title: A design missing fiducials or a polarised part's polarity or first-pin mark fails
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  A fiducial is a pad carrying KiCad's global fiducial pad property, counted on the side its footprint sits on, and the rule requires at least three on each side that carries surface-mount parts, a side carrying them when it holds a footprint with the surface-mount attribute that is not itself a fiducial. A polarised part is one that meets any of: its schematic pins are named for anode and cathode or plus and minus; its schematic symbol is a polarised capacitor, a library item whose name begins C_Polarized; it has three or more pads on distinct nets. A footprint whose pads are all one net or all holes is excluded. Its first pin is the pad numbered 1, and its mark is present when a graphic item of the part's own footprint, not text, on the silkscreen layer of the part's own side lies nearer to the copper of pad one than to the copper of every other pad. The rule fails a side short of fiducials, a polarised part without its mark on its own side, and a polarised part with no pad numbered 1; a design with no surface-mount part is not failed for fiducials. The fiducial requirement is added to the layout practice catalogue as a new rule-kind item with a published source that states the count, the catalogue holding no fiducial item before it. Out of scope: fiducial size and keep-out and the legibility of the silkscreen.
