id: JRN-MAINTAIN-MACHINE-001.C2
type: criterion
title: A routine needing anything of the operator says so before it starts
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A machine that discovers half way through that it needed something is a machine left part way through, with the operator sent away to find it.

  What the routine will ask for is knowable before it begins.
