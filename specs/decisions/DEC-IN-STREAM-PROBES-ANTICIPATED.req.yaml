id: DEC-IN-STREAM-PROBES-ANTICIPATED
type: decision
category: operational
title: Two in-stream PT1000 probes are anticipated channels the controller reserves room for
status: active
version: 1
decided_by: David Baker
text: |
  Two in-stream temperature probes are anticipated channels the controller reserves room for: one in the delivered brew water at the brew outlet and one in the steam at the steam outlet, each a PT1000 read by an RTD-to-digital converter of the MAX31865 class on a shared serial bus with its own chip select, the converter's front end able to take a 2-wire or 3-wire probe per channel. The operator settled this on 2026-10-23. Neither probe is fitted, selected or placed by this decision.
rationale: |
  Context: REQ-HARDWARE-HEADROOM-001.C1 asks that sensing channels of the kinds already anticipated can be added without replacing the controller, and REQ-MEASUREMENT-001.C9 requires the temperature of the water leaving each heated mass to be known to the accuracy its delivery is held to. The casting sensors sit one lag away from the water. The operator stated on 2026-10-23 that two in-stream probes are expected, one in the delivered brew water at the brew outlet and one in the steam at the steam outlet. No decision records them, so the controller selection would otherwise be made without them.

  Trade-offs: Leaving them unrecorded costs nothing now and lets the controller be chosen without room for them, which is the foreclosure the headroom requirement exists to prevent. NTC probes would reuse the conversion inputs the casting sensors use, at a cost of two conversion inputs each carrying a divider, and an NTC reads less linearly and less accurately over the span from cold water to steam than a platinum element. PT1000 probes behind an RTD-to-digital converter per probe cost no conversion input and about five digital pins on a shared serial bus with one chip select each. A converter whose front end takes a 2-wire or 3-wire probe per channel leaves the probe bought to decide the wiring.

  Reversibility: High. This reserves room and fits nothing; the probes, their converters and the pins are chosen by the board task, and a different probe class changes only the pin and conversion-input count recorded against this decision.

  Consequences: The component specification's room-for-anticipated-channels table carries two in-stream temperature rows costing about five digital pins and no conversion input. The earlier design carried a PT1000 outlet probe and a PT1000 front-end option, read as input and history. Neither probe is fitted or selected; the placement and the probe wiring are not decided here.
options_considered:
  - option: Two PT1000 probes, each read by an RTD-to-digital converter that takes a 2-wire or 3-wire probe, on a shared serial bus
    reason_rejected: ""
  - option: Leave the in-stream probes unrecorded
    reason_rejected: the controller would be selected without room for them, which is the foreclosure REQ-HARDWARE-HEADROOM-001.C1 prevents
  - option: Two NTC probes on conversion inputs
    reason_rejected: costs two conversion inputs with dividers, and an NTC is less linear and less accurate from cold water to steam
chosen: Two PT1000 probes, each read by an RTD-to-digital converter that takes a 2-wire or 3-wire probe, on a shared serial bus
