id: DEC-VERIFICATION-ROUND-TARGETED-NIGHTLY-FULL
type: decision
category: operational
title: Build-round verification is targeted, and the full verification runs nightly on main
status: active
version: 3
text: |
  Verification runs at two cadences.

  A build round runs a targeted gate once, and the build round's gate is the only verification a change gets before it merges. The round gate runs the host tier in full every time: every build, every build-time check, every host test and every host executable under the sanitizers. It runs the emulation tier only when the branch changes something the emulation exercises: the firmware's sources, its headers, its parameter descriptions and declarations, its build configuration, or the emulation suite itself, measured from the branch's merge-base with main. When the branch changes the plant model's arithmetic, the round also sweeps the mutants drawn from the lines the branch changed, so a plant change still meets mutation testing before it merges. The round never runs the full mutation sweep.

  The full verification runs nightly against main: every gate the round can skip, the emulation tier unconditionally, and the full mutation sweep over the whole population, each run to completion even after another fails. It runs on hosted runners from a scheduled workflow, which can also be started by hand, and that workflow's run history is the record of what main last verified. An operator session reads the latest result before it offers work, and a red result is corrected through a solution in the maintenance lane.

  The complete verification keeps its single declaration listing every gate. The nightly runs exactly that list; the round runs the subset this decision names. The mutation sweep keeps its sharded form on hosted runners, now started by the nightly as well as by hand.

  The board designs' pre-order check is a third tier on the same terms. The round runs it when the branch changes a KiCad file or anything a board design reads, including the separation basis record it is held to and the libraries and library tables it reaches, or the board check's own tooling and task definitions, measured from the merge-base with main in the same way as the emulation tier, and runs it anyway when it cannot tell what changed; a branch that changes none of those runs without the board tools. The complete verification's declaration lists the board check, so the nightly runs it.

  The hand-curated seeded faults stay on demand, run when a check is added or reworked; that holds for the board check's seeded-fault proof as for the firmware's.
rationale: |
  Context: The project declared one complete verification, and every build round ran all of it. That took over forty minutes, more than thirty of them in the mutation sweep, and longer whenever two sessions ran it on the same machine at once. A round that changed only documents waited the same forty minutes as one that rewrote the plant model. The sweep had been specified not to run on every change: SOL-PLANT-MUTATION-SWEEP.C3 put it on demand, "not wired into the gate that runs on every push", because what it answers, whether the tests notice the model being wrong, does not move between commits the way test results do. The complete verification later absorbed it anyway, and every round inherited its cost.

  Trade-offs: Moving the full sweep to a nightly run means a surviving mutant in code the round did not sweep is found up to a day late, against main rather than on the branch that introduced it. The changed-lines sweep in the round narrows that to mutants whose survival depends on a test elsewhere weakening, which is rare and is what the nightly is for. A branch that changes only the triage record of judged survivors, or only removes a test, changes no line in the sweep's population, so the round sweeps nothing for it: a judgement it adds for a mutant that does not exist, or a survivor it creates on an unchanged line, is found by the nightly against main rather than in the round. Scoping the emulation tier by changed paths means a change outside the declared paths that still alters emulated behaviour is caught only at night. The paths are drawn wide (sources, headers, parameters, the suite) so that case needs a change to build configuration or tooling to reach it. Running every tier on every round was rejected for its cost: it made iteration slower than the work it verified. Dropping emulation from the round entirely was rejected because emulation is the only tier that runs the artefact the machine will run, and firmware changes should meet it before merging. A self-hosted runner on the development machine would have run the nightly where emulation is already proven, but it means a runner for a public repository on a personal machine, and its provisioning. Hosted runners already run the sweep. Emulation on them is the one thing still to prove.

  Reversibility: Cheap. The cadences are task definitions and one scheduled workflow. Folding the nightly back into the round restores the old cost and nothing else. The changed-path scoping can be widened by editing one declared path set.

  Consequences: The task runner declares a round gate, a daily full verification and a reader for the daily result. The operator skills name the round gate as the build round's verification and read the daily result before offering work. The firmware documentation and the sweep's task description stop saying the sweep runs in every gate. Solutions that require new plant arithmetic to survive the sweep are met in the round by the changed-lines sweep, and again by the nightly. A red nightly is the trigger for corrective work, not something a later round discovers.
options_considered:
  - option: Targeted round gate with a changed-lines sweep, and the full verification nightly on hosted runners
    reason_rejected: ""
  - option: Run the complete verification every round
    reason_rejected: over forty minutes per round, more than thirty of it in a sweep whose answer does not change between commits
  - option: Round never runs the emulation tier
    reason_rejected: emulation is the only tier that runs the artefact the machine will run, so firmware changes would merge without meeting it
  - option: Run the nightly on a self-hosted runner on the development machine
    reason_rejected: a runner for a public repository on a personal machine, with its own provisioning, when hosted runners already run the sweep
chosen: Targeted round gate with a changed-lines sweep, and the full verification nightly on hosted runners
