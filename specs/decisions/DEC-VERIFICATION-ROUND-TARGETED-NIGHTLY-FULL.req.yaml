id: DEC-VERIFICATION-ROUND-TARGETED-NIGHTLY-FULL
type: decision
category: operational
title: Build-round verification runs only the units whose inputs changed, and the full verification runs nightly on main
status: active
version: 5
text: |
  Verification runs at two cadences.

  A build round runs a targeted gate once, and the build round's gate is the only verification a change gets before it merges. The round selects verification units, not whole tiers. A unit is the smallest piece of verification that runs in a process of its own and gives its own verdict: one host build, one build-time check, one firmware unit-test suite, one host executable run under the sanitizers, one test module of the firmware tooling or of the emulation suite, one test file of the board tooling, and the pre-order check of one board design. Every unit declares what it reads: the files and folders it opens, the repository code it loads, and the shared products it consumes, such as a firmware build or a simulation run, each of which declares what it reads in turn. The round runs a unit when the content of anything the unit reads, whether git tracks it, the unit's declaration, the selection code or the versions of the tools it needs differ from the last time that unit passed on the same machine, when no such pass is recorded, or when the recorded pass is older than a set age, and skips it otherwise. The builder can have a round disregard the recorded passes. A unit whose declaration cannot be read, or that names a path or product that does not exist, runs, and the round names it. When the round cannot tell what the working tree holds, it runs every unit.

  The tiers remain the order the round runs units in and the groups it reports by: host, then emulation, then board, then the changed-lines sweep. A failing tier stops the round, and what follows is reported as not reached. A tier with no unit selected is not started, and the round says so. A selected unit that needs a tool the machine lacks, or has at too old a version, stops the round naming the tool; a round that selects no unit needing a tool runs without it. A board design file present in the working tree but not tracked by git fails the round naming it, since the board check finds only tracked designs.

  When the branch changes the plant model's arithmetic, the round also sweeps the mutants drawn from the lines the branch changed, measured from the branch's merge-base with main, so a plant change still meets mutation testing before it merges. The round never runs the full mutation sweep.

  A skip is safe only while each declaration is the whole of what its unit reads. The nightly runs every unit regardless, so a declaration that misses a read costs at most a day: the defect a wrongly skipped unit lets through fails the nightly against main. The nightly also checks the declarations themselves where that is cheap. It runs every unit written in the tooling's scripting language with its reads observed and fails, naming the unit and the file, when a unit reads a repository file its declaration does not cover; it compares each build's compiler dependency output with the build's declaration; and it runs the host tier in a tree holding only what the host units declare. Reads made inside a tool a board or emulation unit starts, such as the CAD tool following a library table, are declared through the products and the board check's own read listing and are not proven separately. A unit with no declaration runs in every round and fails the nightly. The nightly workflow can be started by hand against a branch, and a change to the selection itself is evidenced that way rather than by waiting for main.

  The full verification runs nightly against main: every unit, the emulation tier and the board check unconditionally, and the full mutation sweep over the whole population, each run to completion even after another fails. It runs on hosted runners from a scheduled workflow, which can also be started by hand, and that workflow's run history is the record of what main last verified. An operator session reads the latest result before it offers work, and a red result is corrected through a solution in the maintenance lane.

  The complete verification keeps its single declaration listing every gate. The nightly runs exactly that list; the round runs the units this decision selects. The mutation sweep keeps its sharded form on hosted runners, now started by the nightly as well as by hand. The firmware tooling's tests and the board tooling's tests run side by side, one process per unit, and a run that finds no test fails.

  The hand-curated seeded faults stay on demand, run when a check is added or reworked; that holds for the board check's seeded-fault proof as for the firmware's.
rationale: |
  Context: The project declared one complete verification, and every build round ran all of it. That took over forty minutes, more than thirty of them in the mutation sweep, and longer whenever two sessions ran it on the same machine at once. A round that changed only documents waited the same forty minutes as one that rewrote the plant model. The sweep had been specified not to run on every change: SOL-PLANT-MUTATION-SWEEP.C3 put it on demand, "not wired into the gate that runs on every push", because what it answers, whether the tests notice the model being wrong, does not move between commits the way test results do. Moving the full sweep to the nightly and selecting the host, emulation and board tiers by changed path followed.

  Selecting whole tiers by path then left each round's cost set by the widest reader in each tier. Over the twenty-five branches merged before this revision, an edit to a sentence in the hardware notes ran the host tier and the board tooling tests, about forty-five minutes, to repeat checks of that file that take under a second. Any edit under the firmware tree, its tooling tests and documentation included, ran the emulation tier, about twenty minutes, which reads neither. Any edit under the hardware tree ran every board test file and checked every design. An edit to the controller boards' figures record ran emulation for a text comparison that needs no simulation. A catalogue of the project's 246 verification units on 2026-10-23 found that most read a handful of files, that the expensive part of a tier is a few shared products (the builds, the simulation runs) rather than the tests as a whole, and that every file the board tests read but the board tier's selection missed lay in the one tier the nightly did not hold to a declaration. The host tier, which the nightly did hold to its declaration, had none.

  Trade-offs: Moving the full sweep to a nightly run means a surviving mutant in code the round did not sweep is found up to a day late, against main rather than on the branch that introduced it. The changed-lines sweep in the round narrows that to mutants whose survival depends on a test elsewhere weakening, which is rare and is what the nightly is for. A branch that changes only the triage record of judged survivors, only removes a test, or only changes which plant structures the sweep draws from, changes no line in the sweep's population, so the round sweeps nothing for it, and the nightly finds the consequence against main.

  Selecting individual tests was rejected in an earlier revision because the build-time checks and the sanitizer runs have no per-test coverage map, and a wrong map skips a test silently, where a path set that fails closed cannot. Declared reads answer both objections. Every unit kind, the checks and sanitizer runs included, declares its reads, and the nightly fails on a read a declaration omits, which is the property the host tier's single path set had, now held per unit. A heavier proof, running the board and emulation tiers in trees holding only their declared files, was left out: the nightly runs every unit anyway, so what it would add is finding a missed declaration a little sooner, at the cost of doubling the longest nightly jobs. What remains is a day's delay: a declaration that omits a read lets a change to that file skip its unit in rounds until the nightly fails. Keying a skip on the content a unit reads, rather than on the branch's difference from main, means a recorded pass is reused across rounds and branches on the same machine, so a second round after a fix runs only what the fix touched, and a stale view of main no longer mis-measures a branch. A unit whose result depends on something outside both its inputs and the tool versions in its key could pass in the round on a reused record and fail at night; that is the nightly's to find, and deleting the records restores a full round. The selection's cost is the declarations themselves, which are written and kept beside each unit, and the restructuring that makes them narrow: checks of documents taken out of modules with expensive setup, and the task-runner definition divided by task group.

  Running every tier on every round was rejected for its cost: it made iteration slower than the work it verified. Dropping emulation from the round entirely was rejected because emulation is the only tier that runs the artefact the machine will run, and firmware changes should meet it before merging. A self-hosted runner on the development machine would have run the nightly where emulation is already proven, but it means a runner for a public repository on a personal machine, and its provisioning. Hosted runners already run the sweep.

  Reversibility: Cheap. The cadences are task definitions and one scheduled workflow. Deleting the recorded passes makes the next round run every unit. Treating every unit as reading the whole of its tier's folders restores tier selection by path without removing any declaration.

  Consequences: The task runner declares a round gate, a daily full verification and a reader for the daily result. The operator skills name the round gate as the build round's verification and read the daily result before offering work. Every verification unit carries a declaration of what it reads, and the round gate keeps no list of paths of its own. The nightly observes the scripted units' reads, compares the builds' dependency output with their declarations, and runs the host tier in a tree holding only what the host units declare. The project instructions, the hardware notes and the firmware documentation describe unit selection, the recorded passes and how to clear them. Solutions that require new plant arithmetic to survive the sweep are met in the round by the changed-lines sweep, and again by the nightly. A red nightly is the trigger for corrective work, not something a later round discovers.
options_considered:
  - option: Round runs each verification unit whose declared inputs changed since it last passed, with a changed-lines sweep, the declarations proven nightly, and the full verification nightly on hosted runners
    reason_rejected: ""
  - option: Targeted round gate selecting whole tiers by changed path, with a changed-lines sweep, and the full verification nightly on hosted runners
    reason_rejected: a one-sentence document edit paid a whole tier, up to forty-five minutes, for checks that take under a second, and the board tier's path set missed files its tests read
  - option: Run the complete verification every round
    reason_rejected: its cost made iteration slower than the work it verified
  - option: Round never runs the emulation tier
    reason_rejected: emulation is the only tier that runs the artefact the machine will run, and firmware changes should meet it before merging
  - option: Run the nightly on a self-hosted runner on the development machine
    reason_rejected: a runner for a public repository on a personal machine, and its provisioning, where hosted runners already run the sweep
  - option: Round selects individual host tests by coverage
    reason_rejected: the build-time checks and sanitizer runs have no coverage map, and a wrong map skips a test silently; declared reads proven nightly cover every unit kind and fail closed
chosen: Round runs each verification unit whose declared inputs changed since it last passed, with a changed-lines sweep, the declarations proven nightly, and the full verification nightly on hosted runners
