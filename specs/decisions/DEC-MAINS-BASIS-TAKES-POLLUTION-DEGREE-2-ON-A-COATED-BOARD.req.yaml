id: DEC-MAINS-BASIS-TAKES-POLLUTION-DEGREE-2-ON-A-COATED-BOARD
type: decision
category: strategic
title: The separation basis is read at pollution degree 2 on boards their enclosure protects, with the conformal coat as support, and the 2.6 mm creepage is lowered only for listed pairs at the voltage across their gap
status: active
version: 3
decided_by: david
risk_level: medium
text: |-
  Owner decision of 2026-10-31, given in session on the drafter's recommendations ("I've merged those and accept your recommendations, assuming they are safe. Continue"): use pollution degree 2, hold the full figure only between nets at genuinely different potential as IEC 60664-1 sizes creepage, draft same-part exceptions that cover joined copper, fix the floorplan island and scope the trunk track width. The last two are layout and rules work and are outside this decision. The owner's acceptance of the record itself stays a separate act, and nothing here is signed by an agent.

  What changes. The record's pollution_degree becomes 2 where it was 3, and the creepage rows are read from the pollution degree 2, material group III column of Table F.4 ("other materials", not the printed-board column): 125 V 1.5 mm, 160 V 1.6 mm, 200 V 2.0 mm, 250 V 2.5 mm, 320 V 3.2 mm. At 253 V the linear interpolation is 2.5 + 0.7 x 3 / 70 = 2.53 mm, which the record's existing convention, round up to 0.1 mm, signs as 2.6 mm; this replaces 4.1 mm for creepage_mm and creepage_ahead_of_fuse_mm. A pair of conductors at the full line-to-neutral voltage, basic insulation, is read at the 250 V row rationalised up to 2.6 mm, never at a divided voltage. The clearances (1.5 mm, 2.0 mm at a part's terminals), the mains-to-low-voltage figures (3.0 mm clearance, 10.0 mm creepage, unchanged and conservative: the reinforced floor at pollution degree 2 is twice 3.2 mm, 6.4 mm) and the pair across the open interlock contact (held at the reinforced figures, with no credit for the relay's contact gap) are unchanged. Creepage is never signed below the clearance of the same pair.

  The working-voltage reduction. IEC 60664-1 sizes creepage by the voltage across the gap. Where two nets are joined by a part or a chain that divides the supply between them (the discharge pair R101 to R104, the line divider R601 to R604, the zero-cross feed R630 and R631, each pump's gate network R704, R705, R714 and R715), the voltage across a gap between them is a fraction of the line. The record may list such a pair or set of pairs with its working voltage written, its derivation and its source, and the creepage for that pair is the band figure for that voltage: the five rows above, linearly interpolated between adjacent rows and rounded up to 0.1 mm, the lowest row (10 V) for any voltage below it, and no reduction above the 250 V row for a pair at the supply voltage. This is the functional-insulation reading of the same column; a pair the record does not list keeps 2.6 mm. The working voltage of a listed pair is the largest rms difference of its two nets at the top of the declared span, taking each net's potential from its place in the circuit, and a pair that reaches the full supply voltage in normal operation is never reduced. A pair that can reach it only on a single fault of a part or of the circuit (a shorted resistor of a divider, for example) is reduced only where the record holds, for that listing, a single-fault table naming the fault, the voltage it puts across the gap and the current limit that bounds it, and showing that the fault creates no hazard; this is how the household-appliance standard treats functional insulation, at the working voltage of normal operation and then against a single fault. A gate network net that floats to the line while its opto-triac is off reaches the full voltage in normal operation and is not reduced. The reduction never applies to the pair across the open interlock contact, nor to any pair between a mains net and a low-voltage net. It is the owner's to accept in the record, pair by pair, as an exception entry.

  Conditions the owner's acceptance carries, each of them a condition of the pollution degree 2 credit:
  1. The credit stands on the enclosure, not on the coat: the enclosure keeps liquid water off the boards and allows no more than occasional, temporary condensation, which the owner's statement that the enclosure is sealed from the steam wand and the humidity reading of condition 5 bear out. The boards are also conformally coated before they are energised in the machine, as a supporting measure that does not itself earn the credit: the fabrication notes name the coat type and cite its datasheet, and the coat covers the gaps between mains pads, except the keep-outs documented for contacts.
  2. The record states that the enclosure protects the boards against moisture, names the coat as a supporting measure only, and credits pollution degree 2 only. Pollution degree 1 is never credited: no coating test is planned and none is claimed.
  3. The laminate's comparative tracking index is at least 175 (material group IIIa), required by the main board's fabrication notes already.
  4. Every slot cut to lengthen a creepage path is at least 1.0 mm wide (1.5 mm if a pollution degree 3 credit must survive). The layout practice's slot item already requires wider than 1 mm.
  5. The bring-up reading of the closed machine compares each board's temperature with the dew point of the enclosure air during the cool-down after a steam session and during the first minutes of a cold start, the times a board can be colder than its air, and confirms no condensation on the boards while energised. If condensation appears, the basis falls back to pollution degree 3 and 4.1 mm, which is a fresh basis for the owner to accept; the drafted main board does not route at those figures as found, so that fallback reopens the layout.
  6. The whole record is re-signed by the owner. The previous acceptance covers figures this decision replaces and does not stand for them.

  Sources. The Table F.4 rows are read from reproductions, not the standard's text: the EMA Design Automation creepage table (https://www.ema-eda.com/ema-resources/blog/pcb-clearance-and-creepage-distance-table/), the Texas Instruments papers SLUP421 and SLUAAR5, the IECEx document 1422 on interpolation, and an IECEE decision sheet quoting note 1 of Table F.4. The standard's own text was not read, and the material-group column and the interpolation position of the household-appliance standard (IEC 60335-1) are readings for the owner to check. The IEC 60335-1 reading of the same table stays unverified, and if that standard refuses interpolation the fallback is the 320 V row, 3.2 mm at pollution degree 2.

  Standards unread, an owner-accepted residual risk. The machine heats liquids, so the Part 2 that applies with IEC 60335-1 is IEC 60335-2-15 (appliances for heating liquids). The figures of this decision are single-sourced reproductions, and the text of IEC 60335-1, IEC 60335-2-15, IEC 60664-1 and IEC 60664-3 is unread, so the pollution degree, creepage and functional-insulation readings for this machine are unverified against the standards. The owner accepted that on 2026-10-31, in these words: "I'm not buying the standards, this is a hobby project, we probably won't insulation test with equipment". The conservative reading is used wherever it is cheap (the 'other materials' column, rounding up, the full figure for any pair not listed), and the record's header states the risk and its acceptance. No purchase of the standards, no independent read and no insulation-resistance or withstand test with equipment is required; the owner's acceptance of the record remains a separate act that no agent signs.

  The low-voltage rows and the clearance column. The band table also carries rows below 125 V, from an open-source follow-up: creepage in the pollution degree 2, material group III "other materials" column of 0.40 mm at 10 V and below, 0.50 mm at 25 V and 1.20 mm at 50 V; and a clearance column of 0.2 mm for every row up to 50 V (Table F.2 up to its 1.0 kV row; Table F.1 gives equipment up to 50 V at overvoltage category II a rated impulse of 500 V, hence 0.2 mm) and 1.5 mm, the signed mains-to-mains clearance, for the rows from 125 V up. Between rows the figure is interpolated linearly and rounded up to 0.1 mm as for creepage. The conservative "other materials" column is used on purpose, not the printed-wiring column (0.04 mm), because the conditions of that column's footnote were not read and are not known to hold for these boards.
  Status of these rows. They are unverified: they come from open reproductions, the rows below 25 V from KiCad's source tables, and the IEC text was not read. The owner's acceptance covers them as readings. A short-circuit analysis showing that a bridge between two nets of one low-voltage circuit cannot create a hazard on the touchable side is a recommended bring-up inspection item and is carried by DEL-HW-BRING-UP.C18.
rationale: |
  Context: at the drafted basis, pollution degree 3 with 4.1 mm of creepage between any two different mains nets, the main board cannot be routed in its regions. The placement study (candidate 3, 2026-10-31) routed the six trunk links but only 15 of the 39 mains nets, and 24 of 39 with working-voltage groups, because tens of same-part pad pairs and the copper joined to them stand closer than 4.1 mm whatever the placement. The 4.1 mm came from taking pollution degree 3 as the default for conditions that cannot be measured (REQ-ELECTRICAL-INSTALL-001.C14, SOL-HW-SEPARATION-BASIS-SIGNED.C1), with the boards left unprotected. The owner has stated the facts that bear on the degree (SOL-HW-AMBIENT-SPAN-DECLARED.C2): the enclosure is sealed from the steam wand, steam may be present around it, moisture beyond the room's humidity would need a failure such as a burst line beside it, and a conformal coat is planned. Homework on open-source reproductions of the standard finds pollution degree 2 to be the household-appliance norm and degree 3 the conservative default. Residual risk (e) of DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER already says the coat needs a fresh basis; this is that basis.

  Trade-offs: pollution degree 3 everywhere is safe and does not route, so it would send the layout to a larger board or to exceptions for most of the mains nets, each of which weakens the basis. Pollution degree 2 alone cuts the figure to 2.6 mm but spends the same area on pairs whose gap carries a few volts or a fraction of the line, which IEC 60664-1 does not size at the line voltage; listing those pairs with their voltage and derivation, as exceptions the owner signs, keeps the basis the one place the figures live and makes each reduction an owned decision, not a default. Reinforced insulation everywhere would double the figure to 5.2 mm and answers no hazard. Crediting pollution degree 1 needs a sealed or potted assembly or a tested coating, neither of which is planned. The enclosure is the load-bearing assumption and the coat supports it: both are stated as conditions, the coat put into the fabrication notes and the bring-up sequence as criteria, and the enclosure's effect checked by a board-temperature and dew-point reading of the closed machine, so neither is left as prose. Reducing the figure by a working voltage is not a derating of the line: only pairs the record lists are reduced, each with its voltage written, and the check fails an entry that claims less than the band figure for its voltage.

  Reversibility: moderate. The figure lives in the record, read by the check, so a return to pollution degree 3 is a record change plus a layout rework, and the check fails a board that no longer meets it. The coat is physical and removing it is not an option once the machine relies on it. The decision is cheap to revisit before the boards are ordered and expensive after.

  Consequences: the separation basis record is redrafted at pollution degree 2 (SOL-SEPARATION-BASIS-TAKES-POLLUTION-DEGREE-2-ON-A-COATED-BOARD), unsigned, and everything that restated 4.1 mm or pollution degree 3 is brought to match: the mains-to-mains leaf's criteria and the pre-order check's mains-to-mains leaf, the board division record, the design constraints record, the hardware notes and the design method. REQ-ELECTRICAL-INSTALL-001.C15 gains the working-voltage reading and the coated pollution degree 2 condition. DEC-BOARD-SEPARATION-BASIS-RECORD gains the net_pairs exception form and the functional band rows, and DEC-BOARD-PRE-ORDER-RULE-READINGS the judgement of it. The pre-order check gains a net-pair exception form that reads the band rows (SOL-PRE-ORDER-CHECK-JUDGES-NET-PAIR-SPACING-EXCEPTIONS), and the main board's record gains the drafted entries (SOL-MAIN-BOARD-NET-PAIR-EXCEPTIONS-DRAFTED). The coat is required of the two mains-carrying boards' fabrication notes and of the bring-up sequence, and the humidity confirmation is a bring-up criterion. The owner-acceptance leaf shows the owner these readings before the record is signed. Not decided here: the IEC 60335-1 reading of the creepage table, and the verification of the low-voltage rows against the standard's text.
options_considered:
  - option: Pollution degree 2 on coated boards with working-voltage creepage for listed pairs, each an exception the owner signs
    reason_rejected: ""
  - option: Pollution degree 3 everywhere, 4.1 mm between every pair of different mains nets
    reason_rejected: The main board does not route in its regions at that figure, 15 of 39 mains nets at best, and the exceptions needed to close the gap would weaken the basis pair by pair
  - option: Pollution degree 2 with 2.6 mm between every pair of different mains nets and no working-voltage reduction
    reason_rejected: Spends board area on pairs whose gap carries a few volts or a fraction of the line, which IEC 60664-1 does not size at the line voltage, and leaves the discharge, divider, zero-cross and pump-gate chains at the full figure
  - option: Reinforced insulation between every pair of mains nets
    reason_rejected: Doubles the figure to 5.2 mm at pollution degree 2 and answers no hazard the basic figure leaves, since a fault between two mains conductors is cleared by the supply's own protection
  - option: Pollution degree 1 for the coated boards
    reason_rejected: Needs a sealed or potted assembly or a coating tested to a standard for it, neither of which is planned, so the credit could not be stated truthfully
chosen: Pollution degree 2 on coated boards with working-voltage creepage for listed pairs, each an exception the owner signs
