id: DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER
type: decision
category: strategic
title: The main board's residual risks are accepted by the owner, each on a stated ground and bounded by a named element
status: active
version: 22
decided_by: david
text: |-
  The main board's residual risks are accepted by the owner on 2026-10-29, each on a stated ground and each bounded by a named element that does not depend on the failed part or the controller, except where a clause below says otherwise: the safety relay welding shut, the USB cable-position plug-in surge, the 250 V valve relays, fuses and supply module against the 253 V top of the declared span, the not-fitted pump snubbers and inrush thermistor, bought-part creepage under the board's figure and the isolated converter standing about 5 mm from the safety relay. On 2026-11-05 the owner accepted four more, each on his stated reason: a pump triac tab-to-lead breakdown bounded by the interlock relay, which is not independent of the controller and is not claimed to be, interlock gate leakage, rail over-voltage fault states, and sense routing and filter distance. A fifth the same day, the entry fuse's breaking capacity, was accepted on Claude's recommendation with the owner's agreement in session, and a sixth, the measurement paths that carry no accuracy figure, was recommended by Claude and confirmed by the owner on 2026-11-06. A seventh the same day, (o), the pre-order check staying red on the remaining workmanship and neatness lines, the plated coil-pin lines (which are a tool artefact, measured to meet the held figures) and the added classes named in its entry, the owner accepted on his stated condition, which Claude assessed as holding. The schematic review cites this decision to close the findings that rest on them. On 2026-11-06 the owner, asked what the risk of acceptance (i) is and how a tracking fault would be detected, re-affirmed (i) as it stands for the pump-triac tab-to-lead pairs and the four gate-resistor pairs, on these stated grounds: the board sits in a sealed cavity whose only openings are the harness entries on the sides, and the 10-year-old board it replaces was clean when he removed it. Those grounds are the owner's evidence for the contamination the creepage figure guards against; they are not an analysis of the fault, and the earlier wording that the shortfall is not a shock or fire route is withdrawn to that extent. REQ-ELECTRICAL-INSTALL-001.C16 asks for an independent bounding element; the owner has since decided a clarification of what 'independent element' means, and (i) is restated in the rationale against it: the conflict is resolved by the named detection, which REQ-ACTUATION-CONFIRMATION-001.C6 requires and no delivering node yet provides, and until one does the bound is incomplete in fact. On the same day the owner stated that the machine is earthed, that the pump-triac off-state leak is detected through the existing mains current channel with a startup test sequence, and that the conformal coat comes at a much later stage, once the machine is deemed functional from a hardware perspective; SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C17 and DEL-HW-BRING-UP.C16 now place it after bring-up, so the first connection to mains and the bring-up bench tests run on an uncoated board in a clean room. The detection that statement describes is required by REQ-ACTUATION-CONFIRMATION-001.C6 (after power-on and before any load runs, each output is commanded and an output commanded off is confirmed to draw nothing), from the independent observation of REQ-ACTUATION-CONFIRMATION-001.C1, and the analysis of SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C19 shows the mains current channel resolves a leak of 50 mA and above with every output commanded off. That check is a downstream firmware slice that no delivering node yet targets, so nothing performs it today; a leak below 50 mA, or while a heater is on, is not caught by it. On 2026-11-06 the owner also confirmed (n), the measurement paths that carry no accuracy figure, and agreed (p), the tab-pitch acceptance recorded in the rationale. On 2026-11-06 the owner also answered 'yes' to a numbered list on Claude's recommendation: (a) is extended to a shorted interlock clamp diode with forward conduction of its series zener, and nine acceptances (q) to (y) are added for the pile-C findings of schematic review round 7 (USB residue and bulk capacitance, the cable-position surge across the +5V net, a harness bridge on the analogue headers, unfused +5V header pins and unanalysed harness shorts, the derating exceptions, the ESD service level, the interlock buffer stress, the entry fuse's sustained current, and the logic supply module named in (e)). The derating exceptions among them are accepted here, and the board check's derating rule, which judges working voltage only, reports none of those positions that needs an entry in the derating policy (the rationale states which). On 2026-11-06 the owner, shown six decisions one by one, answered 'Yes accept all', entered here by Claude on the owner's written instruction: (z3) the surge level behind the mains varistor (round 7 finding 7.36) and (z4) the touch current of the logic supply module (7.40) are accepted, on the grounds in the rationale; the thirteen derating acceptances of (u) and (x) are signed here on his behalf; the clarification of REQ-ELECTRICAL-INSTALL-001.C16 is applied; the conformal coat comes after bring-up; and the wording of the eight pump-triac and gate-resistor exceptions of the separation basis record is refreshed for his re-signing. On 2026-11-06 the owner answered 'Accept all and resign', entered here by Claude on the owner's written instruction, to the three half-findings left undecided and to a re-signing of the separation basis record: (z5) the gauge control lines back-fed into the gauge driver's inputs (7.11, the driver-side half), (z6) the +5V lockout half of 7.30 and (z7) the ANODE_RAIL half of 7.82 are accepted, on the grounds in the rationale. Round 7 finding 7.34 is not covered by any acceptance here. On 2026-11-06 the owner answered 'yes go' to Claude's recommendation on three value changes: seven like-for-like resistor swaps are made (R607 and R608 from 330 ohm to 470 ohm, R791 to R795 from 100 ohm to 470 ohm, one basic part, C23179), which is a design change and not an acceptance; U402 is kept as drawn, accepted in (z); and layout round 4 and schematic round 8 are not run for the value-only change, accepted in (z2) with the checks that stand in their place.
rationale: |
  Context: the main board's schematic review (round 3) left findings open that no change to the schematic closes without adding parts the owner has declined: the safety relay welding shut (2.16), the bought parts' creepage under the board's 10.0 mm figure (2.17, 2.18), a plug-in surge on the USB cable position above two parts' absolute maximum (2.1), 250 V parts against the 253 V top of the declared span (2.4), and the unfitted pump snubbers and inrush thermistor (2.13, 2.22). The review closes a finding only as met, not applicable, or overridden by a requirement the board serves or a catalogue item it must also meet, so an owner's acceptance had to become a graph decision the review can cite. The owner gave the acceptances in session on 2026-10-29 ("agree, proceed. I am signing that off, sign on my behalf"), and the same instruction re-signed the separation basis with the interlock-relay and isolated-measurement barriers added. The project is a hobbyist build on a bench and in one machine.

  Trade-offs: removing each risk by hardware would add a second series relay or contactor, creepage-wide isolation parts including through-hole optocouplers, higher-rated fuses and relays, and the snubber and inrush parts, at the cost of parts, assembly effort and hand soldering the owner declined; each risk is already bounded by an element named below, so the hardware buys margin on a fault that does not become a hazard alone. Leaving the findings open and unrecorded would keep the review from closing and lose the owner's reason. Recording each acceptance costs a residual risk that is held by one named element and not removed, and the creepage exceptions of (e) are signed into the separation basis record as accepted exceptions when the layout shows a shortfall, which the board check reads (on the final board the slots hold those gaps at the figure and the check reports none, so the record carries no such entry), while the other acceptances are carried in the record's header comment and the open-items record, the basis having no field for them.

  Per risk, the owner's acceptance of 2026-10-29 ((i) to (m) of 2026-11-05; (n) is confirmed by the owner on 2026-11-06; (o) is the owner's, on a condition Claude assessed; (z3) and (z4) are confirmed by the owner on 2026-11-06, 'Yes accept all', entered by Claude on the owner's written instruction; (z5) to (z7) are confirmed by the owner on 2026-11-06, 'Accept all and resign', entered by Claude on the owner's written instruction), its bounding element, and the condition under which it is revisited:
  (a) Safety relay K201 welding shut (2.16). Owner: a welded contact is bounded by the independent element, so no second relay and no hardware detector are to be added. Bounded by the series overheat thermostats now and the one-shot non-restoring thermal cutoff, owed and to be fitted before mains is first connected (DEL-BENCH-SAFETY-CHAIN-INSPECTION C7 and DEL-HW-BRING-UP C4), the third outcome DEC-CHAIN-FAULT-BOUNDED-BY-INDEPENDENT-ELEMENT admits. The firmware startup confirmation (REQ-ACTUATION-CONFIRMATION-001.C6) is a best-effort layer and does not count as detection of this fault; (i) names the same confirmation as the detection of the pump-triac tracking fault, which it can resolve, as its text states. The same bound covers three further single faults of the interlock drive, each bounded as circuit-proof.md A states: U201 oscillating of itself with no input edge, which holds both channels and the contact closed; a short of Z201 or Z202 where the coil inductance exceeds 1.10 H, which leaves the coil decay later than the 100 ms interval; and the coil's low end POL_COIL_LO shorted to ground, which bypasses both channels. A fourth single fault of the interlock drive is named on the owner's 'yes' of 2026-11-06 (schematic review round 7 finding 7.33): a shorted clamp diode D205 or D206, which forward-biases its series zener Z201 or Z202 from +5V into the Q201 and Q202 stack whenever they conduct, about 1 A against the 400 mA drain current of the transistors (NX3008NBK) and 200 mA forward current of the zener (BZX84). The owner asked whether this is unsafe to humans or to the hardware, and was told: the direct effect is overstress of the two small interlock transistors and the zener on the low-voltage side, which is damage to the hardware and is not detected by the board; a hazard to people arises only if the relay K201 is then stuck closed (a transistor failing drain-source short bypasses both channels, the POL_COIL_LO case above) and a second independent fault, a heater switch stuck on, coincides, and that combination is bounded by the series overheat thermostats and the one-shot thermal cutoff owed before mains, the same elements as above; how the transistors fail under this overload is not shown by their datasheets and is undetermined. Owner, 2026-11-06: 'yes' to accepting it under (a), on Claude's recommendation. Revisited if the cutoff is not fitted before mains, or if the bench inspection finds the thermostats reset.
  (b) USB cable-position plug-in surge (2.1). Owner: a surge up to the 10.3 V clamp level of D402 exceeds the 7.0 V absolute maximum of U201 and U791 and is accepted for bench use. Bounded by the clamp D402, a failed buffer leaving the relay open (circuit-proof.md), which is the safe state, and the cable position being a bench state with mains off. Revisited if the cable position is ever used with mains connected or in service.
  (c) Valve relays K731 and K741, 250 VAC maximum switching voltage against the 253 V top of the declared span, about 1 % (2.4). Owner: accepted, the machine's other factory parts are rated 250 V. Bounded by the usual margin on 230 V and 240 V mains and firmware voltage monitoring that may warn near the top of the span.
  (c2) The 250 VAC fuses F101, F701, F711 and F731 and the logic supply module U301 (85-305 Vac input, 0.8 factor, 345.07 V peak) against the same top of span (357.8 V peak against 353.55 V). Owner, 2026-10-29: 'accept the fuse' for F101, on top of the earlier acceptance of the others, for the reasons of (c). The derating rule excepts a position only on an owner-signed entry of the derating policy's accepted_exceptions (SOL-PRE-ORDER-CHECK-JUDGES-OWNER-ACCEPTED-DERATING-EXCEPTIONS), so it reported these positions until the entries were signed; they are carried as signed entries in hardware/sunbeam-em7000/main-board/derating-policy.yaml, F101, F701, F711, F731, K731 and K741 citing this acceptance, signed on 2026-11-05 with the basis, by entry on the owner's written instruction. The accepted list is F101, F701, F711, F731, K731, K741, U301; U301 is not reported, since the policy's integrated-circuit voltage share of 1 holds it to its maker's 305 Vac, 431 V peak, and it has no entry. Revisited if the declared span is widened above 253 V or monitoring shows the supply above it.
  (d) The unfitted pump snubbers (R706 C701, R716 C711) and inrush thermistor RT301 (2.13, 2.22). Owner: they stay not fitted, as decided. Bounded by bring-up measurement, which decides whether either is fitted. Revisited at bring-up; a measurement that shows the pump switches or the module inrush outside their ratings fits the part.
  (e) Bought-part creepage under the board's 10.0 mm figure, accepted at the maker's figure (2.17, 2.18): U601 AMC131M02 8.0 mm, K201 and K731/K741 over 8 mm, U701/U711 MOC3052M at least 7 mm (the owner decided against the through-hole 0.4 inch spacing option for its assembly cost and hand soldering), U602 LTV-814S and the K201 clearance unknown until read from the makers. Owner's reasons: the enclosure is sealed and inside the machine; the board has slots between pad rows where the spacing is ours; a conformal coat is planned; nothing mains-referenced is touchable beyond the items listed under each barrier. Board spacing stays 10.0 mm creepage, 3.0 mm clearance, 4.0 kV between mains and low voltage; the pollution degree the basis reads its other figures at was 3 on this acceptance and became 2 on the owner's decision of 2026-10-31 that declares the credit on the enclosure with the coat as a supporting measure (DEC-MAINS-BASIS-TAKES-POLLUTION-DEGREE-2-ON-A-COATED-BOARD), the fresh basis the coat needed, which leaves these mains-to-low-voltage figures unchanged. Revisited if a maker figure read later is lower than those above, if the coat is withdrawn, or if the enclosure is opened to the user.
  (f) The USB data pins PA11 and PA12 behind the ESD array D401. The clamp's residue (17 V at 5 A, 8/20 us) exceeds the controller's 6.0 V pin maximum (4.0 V with the supply absent) for the nanoseconds of an ESD pulse, and the controller datasheet states no pulse withstand. Owner, 2026-10-29, answering 'go' to the proposal that included accepting findings that close only on unpublished maker figures: accepted, on the ground that ST's application note AN4879 (Rev 10, 2.3 and Table 13) recommends this protection for the USB pins of this controller family, with the clamp as close as possible to the receptacle, and the board follows its arrangement. Bounded by that arrangement and the shield network R403 and C419. Revisited if a maker figure shows the residue is above the pin's pulse withstand.

  (g) A mains surge above the pump triacs' 600 V rating (finding 4.17). Owner, 2026-10-29: "accept the surge". The mains varistor RV101 clamps at about 0.80 to 0.89 kV (775 V at 50 A, the maker's figure) against the 600 V repetitive peak voltage of the pump triacs T701 and T711 and of the pump opto-triacs U701 and U711; no in-stock 800 V part pair exists (WeEn BTA204S-800B has no stock; the only 800 V surface-mount opto-triacs cost about 3 to 5 USD each with one to three in stock and need the gate drive re-proven), and a lower-clamping varistor does not reach 600 V. Bounded by the entry fuse, the branch fuses, and the series safety relay, which removes a pump whose triac has failed short when the controller stops commanding it; the surge level is a declared assumption (1 kV line to line, 2 kV envelope) and the board does not rely on protection upstream of the machine, which the owner may add as an advisory outside the design. The owner's assessment (2026-10-29): a surge that carries the clamped line past 700 V is an extreme event for a consumer appliance in a house, not a protection level houses or appliances are built to. Revisited if an in-stock 800 V triac with an 800 V opto-triac driver appears at similar price, if a pump triac fails in service, or if the declared surge level changes.
  (h) The isolated converter U601 standing about 5 mm from the interlock relay K201 (the division record's decision D4). Owner, 2026-10-29, replying "Yes" to: 'U601 may sit about 5 mm from K201, U601 treated as a 125 C part per its datasheet, relay-side air temperature measured at bring-up'. The division record's A8 asked 15 mm between the relay, a source of about 1 W, and any part rated to 85 C, and its A21 took U601 as such a part; the AMC131M02 sheet rates it to a 125 C ambient (SBASA56 6.3), 55 K over the assumed 70 C air, so it is outside A8's 15 K class, and the 15 mm figure is replaced for it by the owner's 5 mm. The distance of about 5 mm is the owner's allowance and not a thermal prediction: the record holds no thermal model of the enclosure. Bounded by the part's own 125 C rating and by the bring-up measurement of the air temperature at U601's body, beside K201 with the machine running at full load (row M25 of open-items.md), against that rating. Revisited if the measured air at U601 is over its 125 C ambient limit, or the relay's temperature rise moves it nearer its limit than the owner expects. Confirmed by David, 2026-11-05, on the condition that it raises no safety or performance concern: the acceptance stands as the bounded thermal allowance above, and the bring-up measurement of the air at U601's body (row M25 of open-items.md) is what tests that condition, so it is revisited exactly as stated. The division record (decision D4) and open-items.md restate the same 2026-10-29 quote.
  (i) A pump triac tab-to-lead breakdown, bounded by the interlock relay K201 (the separation basis record's four pump-triac entries T701.2 and T711.2 against pads 1 and 3, REQ-ELECTRICAL-INSTALL-001.C16, SOL-SEPARATION-BASIS-PUMP-TRIAC-EXCEPTIONS-FOLLOW-THE-LAND-DRAWN). The facts from the record's own figures: no fuse clears the fault, because a breakdown carries only the pump's own current (0.46 A coffee, 0.19 A steam), below the branch fuses (0.8 A and 0.5 A) and far below F101 (10 A). K201 opens when the controller stops refreshing it, so it is NOT independent of the controller as DEC-CHAIN-FAULT-BOUNDED-BY-INDEPENDENT-ELEMENT defines independence, and this acceptance does not claim it is. The consequence is a pump that runs on (fail-on), not a shock or fire route; the same fail-on outcome is already accepted for the surge case (g). The four gate-resistor entries of the same record, R704, R705, R714 and R715 (each a 1206 whose two pads stand 1.80 mm apart, the package's own gap), cite this acceptance too: a bridge between a resistor's pads leaves its partner alone to limit the opto-triac's gate pulse (358 ohm or more for its 1 A surge rating), the opto-triac could fail, and the pump would run on until K201 opens, the same fail-on outcome and the same bound. Owner, 2026-11-05, delegating the call and accepting it: the board firmware will run a startup check that toggles the heaters and the interlock, the fault requires a dual failure, and it is not unsafe to the user. Owner, 2026-11-06, asked what the risk is and how a tracking fault would be detected, re-affirmed (i) as it stands on these grounds: the board sits in a sealed cavity whose only openings are the harness entries on the sides, and the 10-year-old board it replaces was clean when he removed it. He also stated that the machine is earthed, that the pump-triac off-state leak is detected through the existing mains current channel with a startup test sequence, and that the conformal coat comes at a much later stage, once the machine is deemed functional from a hardware perspective (SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C17 names the coat). The grounds are his evidence for the contamination the creepage figure guards against and his account of the detection, not an analysis of the fault. What bounds the fault, stated completely and in the order it acts: (1) The mains current channel is an independent observation of the current drawn (REQ-ACTUATION-CONFIRMATION-001.C1). The analysis in leak-detection.md (SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C19) shows it resolves a leak of 50 mA and above with every output commanded off, against an idle current that is an estimate of 30 to 55 mA until bring-up measures it and sets the threshold (DEL-HW-BRING-UP.C23). A tracking fault that lets a pump run on draws the pump's own 0.46 A (coffee) or 0.19 A (steam), which is above that figure and is seen when every output is commanded off; a partial leak near 10 mA is marginal and one below it is not seen. The early stage of a developing leak (about 10 to 100 mA) is therefore caught only at 50 mA and above with all outputs off, and with a heater on only a leak above about 0.3 to 0.5 A can be separated. (2) The check that uses the observation is REQ-ACTUATION-CONFIRMATION-001.C6, a power-on check: after power-on and before any load runs, a leak found with all outputs commanded off fails the check, so the machine does not run its loads, and the firmware stops refreshing K201, which opens. It is not built: it is a downstream firmware slice that no delivering node targets yet, so until that slice exists nothing performs it, and a leak that starts after power-on is found by this check only at the next power-on. REQ-ELECTRICAL-INSTALL-001.C16, as clarified on 2026-11-06, asks that the bounding element be independent of the pair and of the mechanism that fails the pair, and, where it acts only when the controller commands it, that the acceptance name the detection of the fault and the disconnection that follows it and state what the detection resolves and what it does not. This item does so: K201 is the bounding element, independent of the pair and of the mechanism (a tracking fault between two pads of a triac does not defeat a relay contact in the live feed); the detection is this check against the observation of (1), and the disconnection is the machine not running its loads and K201 opening; the check resolves a leak of 50 mA and above with every output commanded off, and does not resolve a smaller leak, a leak that starts after power-on until the next power-on, or a leak with a heater on below about 0.3 to 0.5 A. (3) K201 opens when the controller stops refreshing it, so it is NOT independent of the controller as DEC-CHAIN-FAULT-BOUNDED-BY-INDEPENDENT-ELEMENT defines independence, and this acceptance does not claim it is. Two senses of 'independent' therefore stand in the graph and are recorded here so the difference is on the record: DEC-CHAIN-FAULT-BOUNDED-BY-INDEPENDENT-ELEMENT means independent of the failed part and of the controller, and C16 as clarified means independent of the pair and of the mechanism that fails it, with the detection and disconnection named where the controller commands the bound. K201 with the check of (2) meets the second sense and does not meet the first. (4) The pump's own current is the most the bridge carries, and no fuse clears it. (5) The owner's grounds above. (6) The conformal coat, applied after bring-up once the machine is deemed functional from a hardware perspective (owner, 2026-11-06; SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C17 and DEL-HW-BRING-UP.C16 are amended to say so); until it is applied it is no part of the bound. The pollution degree 2 credit stands on the enclosure and not on the coat (DEC-MAINS-BASIS-TAKES-POLLUTION-DEGREE-2-ON-A-COATED-BOARD, condition 1), so the first connection to mains and the bring-up bench tests run on the uncoated board in a clean room, which the owner states and which no record measures. Against C16 as clarified, the acceptance names the bounding element, its independence of the pair and of the mechanism, and the detection and disconnection with what they resolve and do not; the detection is not yet delivered, so until a delivering node targets REQ-ACTUATION-CONFIRMATION-001.C6 the bound is incomplete in fact and finding 7.34 stays open. Nothing in (1) to (6) is independent of the controller in the sense of DEC-CHAIN-FAULT-BOUNDED-BY-INDEPENDENT-ELEMENT, and this acceptance does not claim it. Condition for bring-up: confirm that the machine's mechanical pressure relief limits the pump when it runs on; this is not verified anywhere in the repository. Revisited if the pressure relief is absent or does not limit the pump, if a pump triac fails in service, or if the lead pads are moved outward to reach the creepage.
  (j) Interlock gate leakage (schematic review round 6 finding F2, circuit-proof.md): at the stacked datasheet-maximum gate and diode leakage the relay cannot be held on. Owner, 2026-11-05: accepted, on the ground that the risk is low and, once the first board is tested, goes to zero. The failure is fail-safe: the relay drops out and the heaters stay off. Bounded by the relay dropping out and by the bench reading of the gate at TP201 and TP202 on the first board. Revisited if the bench reading shows the gate sagging.
  (k) Rail over-voltage fault states: the +5V module trip at 5.75 to 6.75 V, the +3V3 rail after a regulator short, and the gauge and load-cell 5 V rails (schematic review findings 6.3, 6.4, 6.7, 6.9, 6.10). Owner, 2026-11-05: accepted for these first boards, which are a five-board minimum order with spares. The cause is the regulating part failing short-circuit and passing its input rail to the downstream rail; the damage stays in low-voltage logic and there is no mains route. A dead controller stops refreshing the interlock and K201 opens, the safe state. Bounded by that: the harm is limited to the low-voltage parts and the interlock fails safe. Revisited if a regulator fails in service, or if the build goes beyond a prototype run.
  (l) Sense routing and filter distance: sense tracks (SENSE-4) beside noisy ones at 0.3 to 0.8 mm with no free side at the 0.4 mm lane pitch, and ADC filters 5.2 to 12 mm from the controller pins, with 12 to 40 mm for the filters placed at connectors by design. Owner, 2026-11-05: accepted as a workmanship and performance compromise. Bounded by the converters averaging the noise and by checking the noise at bring-up. Revisited if the bring-up noise reading shows the sense channels outside their accuracy.
  (m) The entry fuse F101 (SETfuse SCT520, 10 A, 250 V): its breaking capacity and let-through (circuit-proof.md, entry fuse rows; traceability.md, row P1). The maker's sheet gives 10 kA at 250 VAC on the UL reading, which covers the 6 kA design figure, but 2 kA on the CQC and TUV reading, 3.0 times short of it, and gives no let-through at 6 kA, so no conductor row of the proof can be computed. Owner, 2026-11-05, on the reasoning: the household general-purpose outlets this machine plugs into are limited by the plug type to 10 A, and the circuit breaker limits the circuit total (probably 20 A at most), so F101 at 10 A is the board's own protection against overloads the breaker would not trip on. The reasoning does not claim that the circuit breaker limits the let-through: for a hard short the fuse and the breaker race and the fuse is usually the faster. The question is only whether F101 interrupts the prospective fault current at the outlet, which the sub-circuit cable's impedance sets: typically a few hundred amperes and rarely above 1 to 2 kA at an outlet, the 6 kA of the design being the maximum at the switchboard, so the 2 kA reading is likely adequate; this is not verified for any particular installation. Accepted as residual risk on Claude's recommendation with the owner's agreement in the session. Bounded by the household installation's cable impedance, which sets the current the fuse has to interrupt at the outlet. Revisited if the machine is installed on a supply close to a switchboard on a short heavy cable, on a dedicated high-current circuit, or outside a household installation.
  (n) The nine measurement paths that carry no accuracy requirement figure: the steam wand temperature, the brew-path pressure, the analogue fallback inputs, the current inputs, the zero-cross delay, the supply voltage, the supply current, the in-stream probes and the load cells (traceability.md, the list of paths with no figure; error-budget.md). CONFIRMED BY THE OWNER on 2026-11-06 ("that's fine, we reviewed in this session and accepted"), on Claude's recommendation: for the first build these paths are indicative, their conditioning proven only against the figures that exist, and their accuracy characterised at bring-up (DEL-HW-BRING-UP.C5 measures each channel; DEL-HW-BRING-UP.C22 calibrates the supply voltage and current channels). The owner asked to be told, was told, and confirmed it. Revisited when the owner declares an accuracy for any of them (REQ-MEASUREMENT-001.C10 asks for one for the supply voltage), or when a bring-up reading puts a channel outside what its use needs.
  (o) The pre-order check stays red on main for the remaining workmanship and neatness lines and for the plated coil-pin lines of the bought relays K201, K731 and K741. Owner, 2026-11-05, in session: "If we can't do any more on workmanship, any change results in a net negative when considering safety then performance then workmanship then yes I accept red." The check exits non-zero on any line, and it has no mechanism to accept a workmanship line as it accepts a mains spacing shortfall through the separation basis record's accepted exceptions. Claude's assessment, recorded as Claude's and not as the owner's: the condition holds for each remaining class, on the evidence of the layout passes and the router and pass plans the board's records summarise. Router angle, segment-length, pad-entry, corner and detour lines, about 750: 320 are runs between anchors under 1 mm apart, where a track cannot satisfy the angle and segment rules at once; 35 are three-track junctions; 56 are short-leg corners where two workmanship rules (the corner rule and the short-segment rule) conflict, so fixing one breaks the other; and the detours need a router that moves a net between layers, which the board tooling does not have, so a hand edit of each would be a safety-relevant change to dense routed copper with no tool to prove it. Courtyard overlaps (9) and test-point courtyards (21) need moves of 0.7 to 4.9 mm on dense copper, or have no legal site within 1 mm, and a move disturbs the sense and mains spacing the board was proven against. Stray designators (93) and silkscreen overlaps (14) remain because the courtyards tile the area, leaving no free silk. Hole-spacing pairs (27) are adjacent pins of one 2 mm connector, which no layout choice changes. The one part outside its region, C406, sits on locked +3V3 copper that a move would break. The 16 plated coil-pin lines of K201, K731 and K741 are an artefact of the tool: its mounting-hole rule measures a straight line from the drilled hole edge to any mains-class copper and ignores the board's slots, whereas the held figure is 10.0 mm along the surface path round the slots, plus 3.0 mm straight. Measured by slot-aware path on commit 1f9f8357 (hardware/sunbeam-em7000/main-board/coil-pin-paths.md, four independent methods) all 16 meet 10.0 mm (paths 10.76 to 29.2 mm) and 3.0 mm straight (smallest 6.12 mm). They are not covered by acceptance (e), which names pad-row creepage of the bought parts, and this decision as first written to the owner described them that way in error; the owner re-confirmed (o) on 2026-11-06 with this corrected description ("Yes to both"). The tightest pair is K201 pin A2 to C601 pad 2 at 10.414 mm by path, 0.414 mm over the figure, and nothing should move K201, C601 or that copper nearer the pin. Each class was tried in the layout passes and left where a change cost a net negative on safety, then performance, then workmanship. Consequence, stated plainly: after this branch merges, the board tier of the round gate and the nightly complete verification are red on main until the revisit condition is met; the pre-order check does not pass on this board anywhere, and nothing in the records claims it does. The lines that remain are of the workmanship, neatness and bought-part-geometry classes above and the classes the owner added on 2026-11-06 ("Yes to both", on Claude's recommendation after the blind review found them outside the first wording), and no other, which is what keeps the acceptance inside the owner's condition; a line of any other class is a failure. The classes added on 2026-11-06, with the final check's counts on commit 1f9f8357: ground_return 17 (return-path lines), track_width 51 and workmanship_width 14 (tracks narrower than the per-class rule, in the dense areas the layout passes could not widen without breaking a spacing figure), pour_gap 7, decoupling_via 4 (decoupling paths that reach ground by one via), side_fiducials 1 (the back side has three assembled parts and