id: DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER
type: decision
category: strategic
title: The main board's residual risks are accepted by the owner, each on a stated ground and bounded by a named element
status: active
version: 18
decided_by: david
text: |-
  The main board's residual risks are accepted by the owner on 2026-10-29, each on a stated ground and each bounded by a named element that does not depend on the failed part or the controller, except where a clause below says otherwise: the safety relay welding shut, the USB cable-position plug-in surge, the 250 V valve relays, fuses and supply module against the 253 V top of the declared span, the not-fitted pump snubbers and inrush thermistor, bought-part creepage under the board's figure and the isolated converter standing about 5 mm from the safety relay. On 2026-11-05 the owner accepted four more, each on his stated reason: a pump triac tab-to-lead breakdown bounded by the interlock relay, which is not independent of the controller and is not claimed to be, interlock gate leakage, rail over-voltage fault states, and sense routing and filter distance. A fifth the same day, the entry fuse's breaking capacity, was accepted on Claude's recommendation with the owner's agreement in session, and a sixth, the measurement paths that carry no accuracy figure, was recommended by Claude and confirmed by the owner on 2026-11-06. A seventh the same day, (o), the pre-order check staying red on the remaining workmanship and neatness lines, the plated coil-pin lines (which are a tool artefact, measured to meet the held figures) and the added classes named in its entry, the owner accepted on his stated condition, which Claude assessed as holding. The schematic review cites this decision to close the findings that rest on them. On 2026-11-06 the owner, asked what the risk of acceptance (i) is and how a tracking fault would be detected, re-affirmed (i) as it stands for the pump-triac tab-to-lead pairs and the four gate-resistor pairs, on these stated grounds: the board sits in a sealed cavity whose only openings are the harness entries on the sides, and the 10-year-old board it replaces was clean when he removed it. Those grounds are the owner's evidence for the contamination the creepage figure guards against; they are not an analysis of the fault, and the earlier wording that the shortfall is not a shock or fire route is withdrawn to that extent. The conflict with REQ-ELECTRICAL-INSTALL-001.C16, which asks for an independent bounding element, remains on the record and is not waived by this decision. Detection is not independent today: the mains current channel could read a leak through a triac commanded off, but no criterion requires the firmware to look, and that check is recommended and not yet required. REQ-ACTUATION-CONFIRMATION-001.C3 asks that an output being off be confirmed as well as on, and a read of the mains current channel with a pump triac commanded off is a way to meet it for these pairs; no criterion names this fault or this check, so it is recommended for the firmware and not required by this decision. On 2026-11-06 the owner also confirmed (n), the measurement paths that carry no accuracy figure, and agreed (p), the tab-pitch acceptance recorded in the rationale. On 2026-11-06 the owner also answered 'yes' to a numbered list on Claude's recommendation: (a) is extended to a shorted interlock clamp diode with forward conduction of its series zener, and nine acceptances (q) to (y) are added for the pile-C findings of schematic review round 7 (USB residue and bulk capacitance, the cable-position surge across the +5V net, a harness bridge on the analogue headers, unfused +5V header pins and unanalysed harness shorts, the derating exceptions, the ESD service level, the interlock buffer stress, the entry fuse's sustained current, and the logic supply module named in (e)). The derating exceptions among them are accepted here but excuse nothing until the owner signs their entries in the derating policy; the list is in the rationale. Three round 7 findings, 7.34, 7.36 and 7.40, are not yet decided by the owner and no acceptance here covers them.
rationale: |
  Context: the main board's schematic review (round 3) left findings open that no change to the schematic closes without adding parts the owner has declined: the safety relay welding shut (2.16), the bought parts' creepage under the board's 10.0 mm figure (2.17, 2.18), a plug-in surge on the USB cable position above two parts' absolute maximum (2.1), 250 V parts against the 253 V top of the declared span (2.4), and the unfitted pump snubbers and inrush thermistor (2.13, 2.22). The review closes a finding only as met, not applicable, or overridden by a requirement the board serves or a catalogue item it must also meet, so an owner's acceptance had to become a graph decision the review can cite. The owner gave the acceptances in session on 2026-10-29 ("agree, proceed. I am signing that off, sign on my behalf"), and the same instruction re-signed the separation basis with the interlock-relay and isolated-measurement barriers added. The project is a hobbyist build on a bench and in one machine.

  Trade-offs: removing each risk by hardware would add a second series relay or contactor, creepage-wide isolation parts including through-hole optocouplers, higher-rated fuses and relays, and the snubber and inrush parts, at the cost of parts, assembly effort and hand soldering the owner declined; each risk is already bounded by an element named below, so the hardware buys margin on a fault that does not become a hazard alone. Leaving the findings open and unrecorded would keep the review from closing and lose the owner's reason. Recording each acceptance costs a residual risk that is held by one named element and not removed, and the creepage exceptions of (e) are signed into the separation basis record as accepted exceptions when the layout shows a shortfall, which the board check reads (on the final board the slots hold those gaps at the figure and the check reports none, so the record carries no such entry), while the other acceptances are carried in the record's header comment and the open-items record, the basis having no field for them.

  Per risk, the owner's acceptance of 2026-10-29 ((i) to (m) of 2026-11-05; (n) is recommended and recorded, not confirmed; (o) is the owner's, on a condition Claude assessed), its bounding element, and the condition under which it is revisited:
  (a) Safety relay K201 welding shut (2.16). Owner: a welded contact is bounded by the independent element, so no second relay and no hardware detector are to be added. Bounded by the series overheat thermostats now and the one-shot non-restoring thermal cutoff, owed and to be fitted before mains is first connected (DEL-BENCH-SAFETY-CHAIN-INSPECTION C7 and DEL-HW-BRING-UP C4), the third outcome DEC-CHAIN-FAULT-BOUNDED-BY-INDEPENDENT-ELEMENT admits. The firmware startup confirmation (REQ-ACTUATION-CONFIRMATION-001.C6) is a best-effort layer and does not count as detection. The same bound covers three further single faults of the interlock drive, each bounded as circuit-proof.md A states: U201 oscillating of itself with no input edge, which holds both channels and the contact closed; a short of Z201 or Z202 where the coil inductance exceeds 1.10 H, which leaves the coil decay later than the 100 ms interval; and the coil's low end POL_COIL_LO shorted to ground, which bypasses both channels. A fourth single fault of the interlock drive is named on the owner's 'yes' of 2026-11-06 (schematic review round 7 finding 7.33): a shorted clamp diode D205 or D206, which forward-biases its series zener Z201 or Z202 from +5V into the Q201 and Q202 stack whenever they conduct, about 1 A against the 400 mA drain current of the transistors (NX3008NBK) and 200 mA forward current of the zener (BZX84). The owner asked whether this is unsafe to humans or to the hardware, and was told: the direct effect is overstress of the two small interlock transistors and the zener on the low-voltage side, which is damage to the hardware and is not detected by the board; a hazard to people arises only if the relay K201 is then stuck closed (a transistor failing drain-source short bypasses both channels, the POL_COIL_LO case above) and a second independent fault, a heater switch stuck on, coincides, and that combination is bounded by the series overheat thermostats and the one-shot thermal cutoff owed before mains, the same elements as above; how the transistors fail under this overload is not shown by their datasheets and is undetermined. Owner, 2026-11-06: 'yes' to accepting it under (a), on Claude's recommendation. Revisited if the cutoff is not fitted before mains, or if the bench inspection finds the thermostats reset.
  (b) USB cable-position plug-in surge (2.1). Owner: a surge up to the 10.3 V clamp level of D402 exceeds the 7.0 V absolute maximum of U201 and U791 and is accepted for bench use. Bounded by the clamp D402, a failed buffer leaving the relay open (circuit-proof.md), which is the safe state, and the cable position being a bench state with mains off. Revisited if the cable position is ever used with mains connected or in service.
  (c) Valve relays K731 and K741, 250 VAC maximum switching voltage against the 253 V top of the declared span, about 1 % (2.4). Owner: accepted, the machine's other factory parts are rated 250 V. Bounded by the usual margin on 230 V and 240 V mains and firmware voltage monitoring that may warn near the top of the span.
  (c2) The 250 VAC fuses F101, F701, F711 and F731 and the logic supply module U301 (85-305 Vac input, 0.8 factor, 345.07 V peak) against the same top of span (357.8 V peak against 353.55 V). Owner, 2026-10-29: 'accept the fuse' for F101, on top of the earlier acceptance of the others, for the reasons of (c). The derating rule excepts a position only on an owner-signed entry of the derating policy's accepted_exceptions (SOL-PRE-ORDER-CHECK-JUDGES-OWNER-ACCEPTED-DERATING-EXCEPTIONS), so it reported these positions until the entries were signed; they are carried as signed entries in hardware/sunbeam-em7000/main-board/derating-policy.yaml, F101, F701, F711, F731, K731 and K741 citing this acceptance, signed on 2026-11-05 with the basis, by entry on the owner's written instruction. The accepted list is F101, F701, F711, F731, K731, K741, U301; U301 is not reported, since the policy's integrated-circuit voltage share of 1 holds it to its maker's 305 Vac, 431 V peak, and it has no entry. Revisited if the declared span is widened above 253 V or monitoring shows the supply above it.
  (d) The unfitted pump snubbers (R706 C701, R716 C711) and inrush thermistor RT301 (2.13, 2.22). Owner: they stay not fitted, as decided. Bounded by bring-up measurement, which decides whether either is fitted. Revisited at bring-up; a measurement that shows the pump switches or the module inrush outside their ratings fits the part.
  (e) Bought-part creepage under the board's 10.0 mm figure, accepted at the maker's figure (2.17, 2.18): U601 AMC131M02 8.0 mm, K201 and K731/K741 over 8 mm, U701/U711 MOC3052M at least 7 mm (the owner decided against the through-hole 0.4 inch spacing option for its assembly cost and hand soldering), U602 LTV-814S and the K201 clearance unknown until read from the makers. Owner's reasons: the enclosure is sealed and inside the machine; the board has slots between pad rows where the spacing is ours; a conformal coat is planned; nothing mains-referenced is touchable beyond the items listed under each barrier. Board spacing stays 10.0 mm creepage, 3.0 mm clearance, 4.0 kV between mains and low voltage; the pollution degree the basis reads its other figures at was 3 on this acceptance and became 2 on the owner's decision of 2026-10-31 that declares the credit on the enclosure with the coat as a supporting measure (DEC-MAINS-BASIS-TAKES-POLLUTION-DEGREE-2-ON-A-COATED-BOARD), the fresh basis the coat needed, which leaves these mains-to-low-voltage figures unchanged. Revisited if a maker figure read later is lower than those above, if the coat is withdrawn, or if the enclosure is opened to the user.
  (f) The USB data pins PA11 and PA12 behind the ESD array D401. The clamp's residue (17 V at 5 A, 8/20 us) exceeds the controller's 6.0 V pin maximum (4.0 V with the supply absent) for the nanoseconds of an ESD pulse, and the controller datasheet states no pulse withstand. Owner, 2026-10-29, answering 'go' to the proposal that included accepting findings that close only on unpublished maker figures: accepted, on the ground that ST's application note AN4879 (Rev 10, 2.3 and Table 13) recommends this protection for the USB pins of this controller family, with the clamp as close as possible to the receptacle, and the board follows its arrangement. Bounded by that arrangement and the shield network R403 and C419. Revisited if a maker figure shows the residue is above the pin's pulse withstand.

  (g) A mains surge above the pump triacs' 600 V rating (finding 4.17). Owner, 2026-10-29: "accept the surge". The mains varistor RV101 clamps at about 0.80 to 0.89 kV (775 V at 50 A, the maker's figure) against the 600 V repetitive peak voltage of the pump triacs T701 and T711 and of the pump opto-triacs U701 and U711; no in-stock 800 V part pair exists (WeEn BTA204S-800B has no stock; the only 800 V surface-mount opto-triacs cost about 3 to 5 USD each with one to three in stock and need the gate drive re-proven), and a lower-clamping varistor does not reach 600 V. Bounded by the entry fuse, the branch fuses, and the series safety relay, which removes a pump whose triac has failed short when the controller stops commanding it; the surge level is a declared assumption (1 kV line to line, 2 kV envelope) and the board does not rely on protection upstream of the machine, which the owner may add as an advisory outside the design. The owner's assessment (2026-10-29): a surge that carries the clamped line past 700 V is an extreme event for a consumer appliance in a house, not a protection level houses or appliances are built to. Revisited if an in-stock 800 V triac with an 800 V opto-triac driver appears at similar price, if a pump triac fails in service, or if the declared surge level changes.
  (h) The isolated converter U601 standing about 5 mm from the interlock relay K201 (the division record's decision D4). Owner, 2026-10-29, replying "Yes" to: 'U601 may sit about 5 mm from K201, U601 treated as a 125 C part per its datasheet, relay-side air temperature measured at bring-up'. The division record's A8 asked 15 mm between the relay, a source of about 1 W, and any part rated to 85 C, and its A21 took U601 as such a part; the AMC131M02 sheet rates it to a 125 C ambient (SBASA56 6.3), 55 K over the assumed 70 C air, so it is outside A8's 15 K class, and the 15 mm figure is replaced for it by the owner's 5 mm. The distance of about 5 mm is the owner's allowance and not a thermal prediction: the record holds no thermal model of the enclosure. Bounded by the part's own 125 C rating and by the bring-up measurement of the air temperature at U601's body, beside K201 with the machine running at full load (row M25 of open-items.md), against that rating. Revisited if the measured air at U601 is over its 125 C ambient limit, or the relay's temperature rise moves it nearer its limit than the owner expects. Confirmed by David, 2026-11-05, on the condition that it raises no safety or performance concern: the acceptance stands as the bounded thermal allowance above, and the bring-up measurement of the air at U601's body (row M25 of open-items.md) is what tests that condition, so it is revisited exactly as stated. The division record (decision D4) and open-items.md restate the same 2026-10-29 quote.
  (i) A pump triac tab-to-lead breakdown, bounded by the interlock relay K201 (the separation basis record's four pump-triac entries T701.2 and T711.2 against pads 1 and 3, REQ-ELECTRICAL-INSTALL-001.C16, SOL-SEPARATION-BASIS-PUMP-TRIAC-EXCEPTIONS-FOLLOW-THE-LAND-DRAWN). The facts from the record's own figures: no fuse clears the fault, because a breakdown carries only the pump's own current (0.46 A coffee, 0.19 A steam), below the branch fuses (0.8 A and 0.5 A) and far below F101 (10 A). K201 opens when the controller stops refreshing it, so it is NOT independent of the controller as DEC-CHAIN-FAULT-BOUNDED-BY-INDEPENDENT-ELEMENT defines independence, and this acceptance does not claim it is. The consequence is a pump that runs on (fail-on), not a shock or fire route; the same fail-on outcome is already accepted for the surge case (g). The four gate-resistor entries of the same record, R704, R705, R714 and R715 (each a 1206 whose two pads stand 1.80 mm apart, the package's own gap), cite this acceptance too: a bridge between a resistor's pads leaves its partner alone to limit the opto-triac's gate pulse (358 ohm or more for its 1 A surge rating), the opto-triac could fail, and the pump would run on until K201 opens, the same fail-on outcome and the same bound. Owner, 2026-11-05, delegating the call and accepting it: the board firmware will run a startup check that toggles the heaters and the interlock, the fault requires a dual failure, and it is not unsafe to the user. Recorded honestly: the startup check is a best-effort firmware layer that the graph does not count as detection (see (a) and REQ-ACTUATION-CONFIRMATION-001.C6), so it is the owner's reason and not an independent bound. Bounded by K201 opening when the controller stops refreshing it, the pump's own current as the most the bridge carries, and the conformal coat with pollution degree 2. Condition for bring-up: confirm that the machine's mechanical pressure relief limits the pump when it runs on; this is not verified anywhere in the repository. Revisited if the pressure relief is absent or does not limit the pump, if a pump triac fails in service, or if the lead pads are moved outward to reach the creepage.
  (j) Interlock gate leakage (schematic review round 6 finding F2, circuit-proof.md): at the stacked datasheet-maximum gate and diode leakage the relay cannot be held on. Owner, 2026-11-05: accepted, on the ground that the risk is low and, once the first board is tested, goes to zero. The failure is fail-safe: the relay drops out and the heaters stay off. Bounded by the relay dropping out and by the bench reading of the gate at TP201 and TP202 on the first board. Revisited if the bench reading shows the gate sagging.
  (k) Rail over-voltage fault states: the +5V module trip at 5.75 to 6.75 V, the +3V3 rail after a regulator short, and the gauge and load-cell 5 V rails (schematic review findings 6.3, 6.4, 6.7, 6.9, 6.10). Owner, 2026-11-05: accepted for these first boards, which are a five-board minimum order with spares. The cause is the regulating part failing short-circuit and passing its input rail to the downstream rail; the damage stays in low-voltage logic and there is no mains route. A dead controller stops refreshing the interlock and K201 opens, the safe state. Bounded by that: the harm is limited to the low-voltage parts and the interlock fails safe. Revisited if a regulator fails in service, or if the build goes beyond a prototype run.
  (l) Sense routing and filter distance: sense tracks (SENSE-4) beside noisy ones at 0.3 to 0.8 mm with no free side at the 0.4 mm lane pitch, and ADC filters 5.2 to 12 mm from the controller pins, with 12 to 40 mm for the filters placed at connectors by design. Owner, 2026-11-05: accepted as a workmanship and performance compromise. Bounded by the converters averaging the noise and by checking the noise at bring-up. Revisited if the bring-up noise reading shows the sense channels outside their accuracy.
  (m) The entry fuse F101 (SETfuse SCT520, 10 A, 250 V): its breaking capacity and let-through (circuit-proof.md, entry fuse rows; traceability.md, row P1). The maker's sheet gives 10 kA at 250 VAC on the UL reading, which covers the 6 kA design figure, but 2 kA on the CQC and TUV reading, 3.0 times short of it, and gives no let-through at 6 kA, so no conductor row of the proof can be computed. Owner, 2026-11-05, on the reasoning: the household general-purpose outlets this machine plugs into are limited by the plug type to 10 A, and the circuit breaker limits the circuit total (probably 20 A at most), so F101 at 10 A is the board's own protection against overloads the breaker would not trip on. The reasoning does not claim that the circuit breaker limits the let-through: for a hard short the fuse and the breaker race and the fuse is usually the faster. The question is only whether F101 interrupts the prospective fault current at the outlet, which the sub-circuit cable's impedance sets: typically a few hundred amperes and rarely above 1 to 2 kA at an outlet, the 6 kA of the design being the maximum at the switchboard, so the 2 kA reading is likely adequate; this is not verified for any particular installation. Accepted as residual risk on Claude's recommendation with the owner's agreement in the session. Bounded by the household installation's cable impedance, which sets the current the fuse has to interrupt at the outlet. Revisited if the machine is installed on a supply close to a switchboard on a short heavy cable, on a dedicated high-current circuit, or outside a household installation.
  (n) The nine measurement paths that carry no accuracy requirement figure: the steam wand temperature, the brew-path pressure, the analogue fallback inputs, the current inputs, the zero-cross delay, the supply voltage, the supply current, the in-stream probes and the load cells (traceability.md, the list of paths with no figure; error-budget.md). CONFIRMED BY THE OWNER on 2026-11-06 ("that's fine, we reviewed in this session and accepted"), on Claude's recommendation: for the first build these paths are indicative, their conditioning proven only against the figures that exist, and their accuracy characterised at bring-up (DEL-HW-BRING-UP.C5 measures each channel; DEL-HW-BRING-UP.C22 calibrates the supply voltage and current channels). The owner asked to be told, was told, and confirmed it. Revisited when the owner declares an accuracy for any of them (REQ-MEASUREMENT-001.C10 asks for one for the supply voltage), or when a bring-up reading puts a channel outside what its use needs.
  (o) The pre-order check stays red on main for the remaining workmanship and neatness lines and for the plated coil-pin lines of the bought relays K201, K731 and K741. Owner, 2026-11-05, in session: "If we can't do any more on workmanship, any change results in a net negative when considering safety then performance then workmanship then yes I accept red." The check exits non-zero on any line, and it has no mechanism to accept a workmanship line as it accepts a mains spacing shortfall through the separation basis record's accepted exceptions. Claude's assessment, recorded as Claude's and not as the owner's: the condition holds for each remaining class, on the evidence of the layout passes and the router and pass plans the board's records summarise. Router angle, segment-length, pad-entry, corner and detour lines, about 750: 320 are runs between anchors under 1 mm apart, where a track cannot satisfy the angle and segment rules at once; 35 are three-track junctions; 56 are short-leg corners where two workmanship rules (the corner rule and the short-segment rule) conflict, so fixing one breaks the other; and the detours need a router that moves a net between layers, which the board tooling does not have, so a hand edit of each would be a safety-relevant change to dense routed copper with no tool to prove it. Courtyard overlaps (9) and test-point courtyards (21) need moves of 0.7 to 4.9 mm on dense copper, or have no legal site within 1 mm, and a move disturbs the sense and mains spacing the board was proven against. Stray designators (93) and silkscreen overlaps (14) remain because the courtyards tile the area, leaving no free silk. Hole-spacing pairs (27) are adjacent pins of one 2 mm connector, which no layout choice changes. The one part outside its region, C406, sits on locked +3V3 copper that a move would break. The 16 plated coil-pin lines of K201, K731 and K741 are an artefact of the tool: its mounting-hole rule measures a straight line from the drilled hole edge to any mains-class copper and ignores the board's slots, whereas the held figure is 10.0 mm along the surface path round the slots, plus 3.0 mm straight. Measured by slot-aware path on commit 1f9f8357 (hardware/sunbeam-em7000/main-board/coil-pin-paths.md, four independent methods) all 16 meet 10.0 mm (paths 10.76 to 29.2 mm) and 3.0 mm straight (smallest 6.12 mm). They are not covered by acceptance (e), which names pad-row creepage of the bought parts, and this decision as first written to the owner described them that way in error; the owner re-confirmed (o) on 2026-11-06 with this corrected description ("Yes to both"). The tightest pair is K201 pin A2 to C601 pad 2 at 10.414 mm by path, 0.414 mm over the figure, and nothing should move K201, C601 or that copper nearer the pin. Each class was tried in the layout passes and left where a change cost a net negative on safety, then performance, then workmanship. Consequence, stated plainly: after this branch merges, the board tier of the round gate and the nightly complete verification are red on main until the revisit condition is met; the pre-order check does not pass on this board anywhere, and nothing in the records claims it does. The lines that remain are of the workmanship, neatness and bought-part-geometry classes above and the classes the owner added on 2026-11-06 ("Yes to both", on Claude's recommendation after the blind review found them outside the first wording), and no other, which is what keeps the acceptance inside the owner's condition; a line of any other class is a failure. The classes added on 2026-11-06, with the final check's counts on commit 1f9f8357: ground_return 17 (return-path lines), track_width 51 and workmanship_width 14 (tracks narrower than the per-class rule, in the dense areas the layout passes could not widen without breaking a spacing figure), pour_gap 7, decoupling_via 4 (decoupling paths that reach ground by one via), side_fiducials 1 (the back side has three assembled parts and no fiducials), sensing_clearance 1 (a false line: the guard misreads KiCad's long uncut clearance list, SOL-PRE-ORDER-CHECK-SENSING-CLEARANCE-GUARD-IGNORES-A-LONG-UNCUT-CLEARANCE-LIST), footprint_symbol_mismatch 3, footprint_symbol_field_mismatch 2 and lib_footprint_mismatch 1 (parity lines between the schematic symbols and the board's footprint copies), silk_edge_clearance 11 and silk_over_copper 1 (silkscreen, with the silkscreen overlaps above), and one stale-record spacing_exception line (accepted_exceptions[16], C606 pads 1 and 2, which KiCad's report shows in some runs and not others). starved_thermal 3 (pad 2 of J635, pad 2 of C609 and pad 3 of U602 each join their ground pour by one spoke where the rule wants two; ground stays connected, there is no safety or performance effect, and the only assembly effect is a mild cold-joint risk on the through-hole J635 pins, for which the first board's J635 joints can be hand-checked); the owner accepted it on 2026-11-06 ("Accept starved thermal as is"). Revisited if a later review finds a cheap fix that harms neither safety nor performance, or when the check can declare accepted workmanship lines (SOL-PRE-ORDER-CHECK-JUDGES-OWNER-ACCEPTED-WORKMANSHIP-LINES), at which point the lines are entered and the owner signs them.
  (p) The mains tab pitch of J101 to J102 (8.3 mm) and J108 to J109 (8.0 mm) against the 8.5 mm floor of layout review item BOARD-14 (round 3 finding 3.82, recorded as a fail). CONFIRMED BY THE OWNER on 2026-11-06 ("agree"), on Claude's recommendation: the two pitches are accepted as drawn. The reasoning is Claude's: the receptacle housing is about 7 mm wide (an assumed 10 x 7 mm housing, the same assumption the J103 and J110 check uses, and not yet read from the bought part's drawing, which SOL-HW-MAIN-BOARD-SCHEMATIC-PROVEN.C4 asks for), so an 8.0 mm pitch leaves at least 1.0 mm between housings; restoring 8.5 mm would break the 10 mm mounting-hole figure for mains copper or need a chain of moves of the mains connectors. Bounded by the housings not touching; revisited if the drawing of the bought receptacle shows a housing wider than 7.5 mm at the 8.0 mm pitch, or the pitch is wanted at 8.5 mm. The owner's acceptance is in session and is not a signed record entry; layout review round 3 keeps the item as a fail.
  (q) The USB pin residue and the capacitance behind F401, extending (f) (round 7 findings 7.3 and 7.27). The data pins PA11 and PA12 see about 23 V at 24 A with D402 on VBUS, beyond the 17 V at 5 A of (f), against the 6.0 V pin maximum; the 81.3 uF behind F401 in the cable position is above the 10 uF a USB 2.0 port allows, so a host may trip its own over-current on plug-in. The consequence is a damaged USB data pin on a service port, or a nuisance trip, on a bench cable position with mains off. Owner, 2026-11-06: 'yes' to the numbered list of pile-C themes of schematic review round 7, on Claude's recommendation. Bounded by (f)'s arrangement (D401 beside J402, the shield network R403 and C419) for the residue, and by (b) (bench use, mains off) and the host's own port protection for the capacitance. Revisited on the conditions of (f) and (b), and if the bring-up reading of the plug-in charge (DEL-HW-BRING-UP.C15) exceeds the port's limit.
  (r) The cable-position surge reaching every part on the +5V net, widening (b) (round 7 findings 7.10 and 7.16). The 10.3 V clamp level of D402 exceeds the ratings of the gauge driver, the wall board, the relay coils K201, K731 and K741 and the HX711 load-cell amplifiers, not only the 7.0 V maximum of U201 and U791 that (b) names. The consequence is low-voltage damage in a bench state with mains off; the interlock fails safe. Owner, 2026-11-06: 'yes' to the numbered list of pile-C themes of schematic review round 7, on Claude's recommendation. Bounded as (b) is: the clamp D402, a failed buffer or coil leaving the relay open, and the cable position being a mains-off bench state. Removing it would take a series limiter on +5V. The HX711 figures are a datasheet gap carried to bring-up, not accepted here. Revisited as (b) is.
  (s) A harness bridge between +5V (pin 1) and the 3.3 V feed (pin 2) on J523, J524 and J525, extending (k) to a harness fault (round 7 findings 7.7 and 7.14). A frayed cable or crushed plug lifts +3V3 to about 4.7 to 5.2 V, the LT1963A cannot sink and the series PTC does not clear it, so the controller and 3.3 V parts are damaged; there is no mains route. Owner, 2026-11-06: 'yes' to the numbered list of pile-C themes of schematic review round 7, on Claude's recommendation. Bounded as (k) is: the harm stays in low-voltage logic, a dead controller stops refreshing the interlock and K201 opens, and the first boards are a five-board run with spares. No independence from the controller is claimed. Revisited as (k) is, or if a harness fault of this kind occurs.
  (t) Unfused +5V header pins and unanalysed harness shorts (round 7 findings 7.56, 7.58, 7.79 and 7.82): +5V pin 1 of J520, J523, J524, J525, J570 and J571 (3 A contacts), J630 and J635 (2 A contacts), and the ANODE_RAIL, +5V_GAUGE, +5V_WB and GAUGE_*_B conductors of J791, J821 and J761, carry no fuse, so a cable short draws the supply module's overload (4.6 to 6.4 A, hiccup) through the contact and wire. The consequence is a warm or damaged cable and a +5V collapse that opens K201, the safe state. Owner, 2026-11-06: 'yes' to the numbered list of pile-C themes of schematic review round 7, on Claude's recommendation. Bounded by the supply module's hiccup limit and the interlock failing safe; the analysis rows for these shorts are written into circuit-proof.md. Revisited if a cable is damaged by such a short, or if a harness is fitted to the board that the module's overload would not collapse.
  (u) Derating exceptions (round 7 findings 7.51, 7.55, 7.60 and 7.49): D401 and D402 at 100 % and 87.5 % of stand-off against the 0.75 share; the six PESD5V0F1BL clamps D520, D529, D530, D531, D570 and D571 at 82 to 100 %; R763 and R773 at 155 mW against 150 mW in the +5V_WB-shorted state; the emitters of U701 and U711 at 31.6 mW against 30.1 mW at the stacked worst corner. Each is 3 to 25 percent over its share and inside the maker's own rating, so the consequence is a shorter life or a little TVS leakage, with no hazard. Owner, 2026-11-06: 'yes' to the numbered list of pile-C themes of schematic review round 7, on Claude's recommendation. Bounded by the makers' own ratings. Accepted here; the board check excuses a position only through a signed entry of accepted_exceptions in derating-policy.yaml (c2), so these excuse nothing until the owner signs the entries, which are owed: D401, D402, D520, D529, D530, D531, D570, D571, R763, R773, U701, U711, and F101 for its sustained current (x). Revisited if a maker rating is withdrawn or a measured level exceeds the figures above.
  (v) The ESD service level (round 7 findings 7.37 and 7.39). KEY1 to KEY5 and the knob lines reach controller pins with no clamp, and the record declares every other connector 'does not apply: inside the enclosure'. Declared level, owner, 2026-11-06: the board is kept as drawn, service reach is handled by procedure (the enclosure is opened to fit, test and replace parts, and a service person discharges before touching a connector), and the panel keys are read at bring-up; clamps are added only if the owner later asks. Owner, 2026-11-06: 'yes' to the numbered list of pile-C themes of schematic review round 7, on Claude's recommendation. The consequence is a controller pin damaged by a panel zap or a service touch, more likely in dry air. Bounded by the handling procedure and the sealed enclosure in use. Revisited if a key or knob input fails in service, or if the bring-up reading of the keys shows a fault.
  (w) The interlock buffer U201 driving C202 and C204 with no series resistor (round 7 finding 7.48): a first-edge peak of 110 mA against the 25 mA output rating at every refresh edge. The consequence is possible early wear of the buffer, whose failure direction is the relay opening. Owner, 2026-11-06: 'yes' to the numbered list of pile-C themes of schematic review round 7, on Claude's recommendation. Bounded by that fail-safe direction. Revisited if the layout is reopened for the interlock sheet, when the two 330 ohm resistors are the right fix, or if a buffer fails in service.
  (x) The entry fuse F101 at 10 A sustained against 9.2 A derated at 70 C air (round 7 finding 7.44, current part; the voltage part is (c2) and the breaking capacity is (m)). The consequence is the fuse opening early on a hot machine under full heater load, which is the safe direction; a larger fuse is not available against the 10 A plug. Owner, 2026-11-06: 'yes' to the numbered list of pile-C themes of schematic review round 7, on Claude's recommendation. Bounded by the fuse opening in the safe direction. Accepted here; the derating entry for the current is owed to the owner's signature (u). Revisited when the bring-up measurement of the enclosure air replaces the assumed 70 C.
  (y) The logic supply module U301 named in (e) (round 7 finding 7.35, the rider only). (e) is read as covering U301's creepage at the maker's figure, which is unread, as it covers U601 and the relays; the signed basis lists a supply-module barrier and (e) did not name it. Owner, 2026-11-06: 'yes' to the numbered list of pile-C themes of schematic review round 7, on Claude's recommendation. Bounded as (e) is, and revisited on (e)'s conditions and when the maker's creepage figure for U301 is read. The other maker and impulse figures of finding 7.35 are datasheet gaps and are not accepted here.
  Not yet decided by the owner: round 7 findings 7.34 (the pump triac pairs against REQ-ELECTRICAL-INSTALL-001.C16), 7.36 (the surge level behind RV101 and the clamp above 50 A) and 7.40 (touch current estimated at 0.34 mA against the project's 0.25 mA). The owner has not yet answered the questions on them, and nothing in this decision accepts, bounds or closes them.
  Policy (owner, 2026-11-05): workmanship items are fixed where reasonable in context and are not chased to perfection.
  Reversibility: each acceptance can be withdrawn before the boards are ordered by a schematic change; after ordering, removing a risk by hardware is a board revision. Recording the acceptance changes no board part.

  Consequences: the schematic review cites this decision in 'overridden by:' for the findings above, with the owner's reason and the bounding element it names; the finding for (a) closes on the bounding elements as they stand: the series overheat thermostats, which are on the machine now, and the bring-up gate (DEL-HW-BRING-UP.C4) that requires the one-shot cutoff fitted before mains is first connected; the finding reopens if either is withdrawn, and no part of this decision stands in for fitting the cutoff. The board check excuses each of the ten over-limit positions (the six above, and R102, R104, R706 and R716) only through its signed entry in the derating policy record, which the owner's acceptance of 2026-11-05 signed (an unsigned entry excuses nothing; the thirteen positions of (u) and (x) accepted on 2026-11-06 are likewise unsigned and excuse nothing until the owner signs them); it reads the creepage exceptions of (e) that the owner signs into the separation basis record, and fails any bought-part creepage shortfall of (e) that the record does not list, K201, K731, K741 and U602 included, until the makers' figures are read and each is either met or signed as an exception. The board check stays red on the workmanship and neatness lines of (o), which no signed record can excuse until the workmanship acceptance mechanism exists; a red check on main on those lines is the owner's accepted state, and any other line is a failure. A new residual risk is a new acceptance on this decision or a new decision, not a silent closure.
options_considered:
  - option: Record each residual risk as an owner acceptance with the ground and the independent element that bounds it
    reason_rejected: ""
  - option: Remove each risk by hardware (a second series relay or contactor, wider-creepage isolation parts including through-hole, higher-rated fuses and relays, snubber and inrush parts fitted)
    reason_rejected: cost, assembly effort and hand soldering the owner declined on a hobbyist project, and each risk is already bounded by an existing element
  - option: Leave the risks unrecorded as open review findings
    reason_rejected: the review never closes and the owner's reason is lost
chosen: Record each residual risk as an owner acceptance with the ground and the independent element that bounds it
