id: DEC-STEAM-DRYNESS-IS-A-MODELLED-OUTLET-SUPERHEAT
type: decision
category: tactical
title: Steam dryness is a modelled outlet superheat that no sensor yet confirms, and the heater holds it
status: active
version: 1
rationale: |
  Context: DEC-STEAM-BLOCK-IS-A-FLASH-GENERATOR makes heater power the dryness actuator and names superheat above saturation at the measured pressure as the only proof of dryness. The firmware has no superheat or dryness quantity anywhere. The temperatures the machine senses on the steam side are the casting NTC and a wand disc NTC whose relation to the steam is not established; none is at the outlet, and no node requires or plans an outlet probe.

  Trade-offs: The casting is hotter than the steam by an unknown, load-dependent amount, so casting minus saturation is a proxy and not proof. The plant can compute superheat at its own modelled outlet from the measured pressure, which lets the heater loop be exercised against the plant before hardware exists while claiming only what the model represents. Whether an outlet or tip temperature sensor will be fitted is a fact and a hardware choice owned outside this work, by the inspection and sensing nodes, so this work does not add one and does not stand in for them. Where no sensor confirms the modelled superheat, the plant description says so in what it leaves out.

  Reversibility: The modelled superheat is a plant quantity and a declared setpoint. If a probe is later fitted, the claim moves from the modelled outlet to the measured one without changing the control structure.

  Consequences: The plant reports superheat at its modelled outlet. The heater loop holds a declared superheat setpoint with its origin. Every statement that steam is dry names the superheat and the measured pressure it rests on, and carries the caveat that droplet carry-over is not excluded. The identifiability work for steam dryness is left to the sensor-necessity task, which finds whether the modelled superheat is observable.
options_considered:
  - option: The plant reports superheat at its modelled outlet from the measured pressure, the heater loop holds a declared superheat setpoint, and the omission of a confirming outlet sensor is stated
    reason_rejected: ""
  - option: Claim dryness from casting minus saturation
    reason_rejected: the casting is hotter than the steam by an unknown load-dependent amount, so it is a proxy and not proof
  - option: Add an outlet or tip probe to the bill of materials in this work
    reason_rejected: the sensing and inspection nodes own that fact and choice, and this work does not stand in for them
  - option: Claim dryness without superheat
    reason_rejected: it contradicts the flash-generator decision that superheat is the only proof
chosen: The plant reports superheat at its modelled outlet from the measured pressure, the heater loop holds a declared superheat setpoint, and the omission of a confirming outlet sensor is stated
