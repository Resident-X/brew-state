id: DEC-PROOF-OF-LIFE-INTERVAL-BOUNDED-BY-FIRST-PROTECTIVE-TRIP
type: decision
category: tactical
title: The proof-of-life removal interval is bounded by the time to the first protective trip
status: active
version: 1
text: |
  The interval within which loss of the controller's proof of life must remove heater power is derived from the time a heater takes to reach its retained protection's trip point when left fully on, and the shorter of the machine's two heaters sets it.

  The derivation takes the worst case on every input: each heater driven at full power at the top of the declared supply span, starting from the highest temperature that heater's casting reaches while the controller is holding it, taken across the plant model's declared corners, with the lower bound of its thermal mass. The casting, not the commanded variable, is the starting point: the coffee loop controls the water leaving the block and the steam loop controls pressure during a draw, and in both the casting runs hotter than the commanded figure by an amount that is not fixed. Until that peak is derived, the interval is pending rather than taken from the commanded figure. The trip points are the declared ones, 107 °C on the coffee thermoblock and 195 °C on the steam thermoblock. The interval is the shorter of the two times, so the interlock removes power before either retained protective device has to act.

  Both heated masses are flow-through thermoblocks. There is no steam vessel holding a stored volume at pressure, so the thermoblock's protection trip, not a vessel's pressure rating, is the first point at which the machine depends on its backstop rather than its controller.
rationale: |
  Context: REQ-SAFETY-CHAIN-001.C3 requires the interval between the controller stopping and power being removed to be short enough that the machine cannot reach a hazardous state within it. DEC-PROOF-OF-LIFE-INTERLOCK-IN-FIRST-HARDWARE left the timing bound to design work. The figures record for the controller boards must derive that bound rather than choose it, and no node said what "hazardous state" the derivation runs to.

  Trade-offs: Bounding the interval by the first protective trip makes the interlock the primary defence and the retained thermostats and thermal fuse a backstop that is never exercised by a controller failure alone. It uses figures the graph already declares, so it can be derived now, at the inferred grade the estimated thermal masses carry. Bounding it by a pressure limit was considered for the steam side, but the machine has no steam vessel: both heaters are flow-through thermoblocks, so there is no stored pressurised volume whose rating sets an earlier limit. Deriving the interval only from measured thermal masses would leave it pending until commissioning, and commissioning needs the boards this interval feeds, which is circular. Bounding it by a temperature beyond the trip point would make the interlock's correctness depend on the retained devices working, which is the case it exists to cover.

  Reversibility: The basis is cheap to change before the interlock's timing is fixed in hardware. Once the thermal masses are measured at commissioning the figure tightens or loosens without the basis changing. A different basis after the boards are built may mean a component change in the interlock's timing.

  Consequences: The figures record states the interval with this derivation, graded inferred, citing the declared trip points, the declared supply span and the estimated thermal masses. The interlock's design works to that interval. A later measurement of either thermoblock's thermal mass re-derives it.

  Amendment: the first statement of this decision started from the highest temperature the controller commands. Review of the derived figure showed that bounds the commanded variable, not the casting, so it is not the worst case the decision requires: with 7 K between the coffee block's commanded ceiling and its trip point, each kelvin the casting stands above the commanded figure removes about a sixth of a second from the interval. The basis is the casting's peak under control instead.
options_considered:
  - option: Time for a heater left fully on to reach its retained protection's trip point
    reason_rejected: ""
  - option: Time for the steam side to reach a vessel pressure limit
    reason_rejected: the machine has no steam vessel; both heaters are flow-through thermoblocks
  - option: Pending until thermal masses are measured at commissioning
    reason_rejected: circular, because commissioning needs the boards this interval feeds
  - option: Time to a temperature beyond the trip point
    reason_rejected: the interlock would then depend on the retained protective devices working, the case it exists to cover
chosen: Time for a heater left fully on to reach its retained protection's trip point
