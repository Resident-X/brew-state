id: DEC-PROOF-OF-LIFE-INTERVAL-BOUNDED-BY-FIRST-PROTECTIVE-TRIP
type: decision
category: tactical
title: The proof-of-life removal interval is 100 ms, chosen, and sits under the time to the first protective trip
status: active
version: 3
decided_by: david
decided_on: "2026-10-27"
text: |
  The interval within which loss of the controller's proof of life must remove heater power is 100 ms, chosen by the owner. It is counted from the controller's last valid proof of life to the opening of the interlock's contact, so it includes the drive circuit's delay, the coil's fall to the relay's drop-out voltage and the contact's release. It is short enough that the controller refreshes its proof of life well inside it, with a wide margin on the controller part selected.

  The chosen interval is held under a ceiling, which is derived, not chosen: the time a heater takes to reach its retained protection's trip point when left fully on, the shorter of the machine's two heaters setting it. The ceiling takes the worst case on every input: each heater driven at full power at the top of the declared supply span, starting from the highest temperature that heater's casting reaches while the controller is holding it, taken across the plant model's declared corners, with the lower bound of its thermal mass. The casting, not the commanded variable, is the starting point, because both loops regulate a quantity other than the casting and the casting runs hotter than the commanded figure by an amount that is not fixed. The trip points are the declared ones, 107 °C on the coffee thermoblock and 195 °C on the steam thermoblock. The ceiling is pending until the control holds each casting below its trip point; until then no ceiling can honestly be taken from the shipped control, which lets the coffee casting pass its trip point.

  The interlock's design works to the chosen 100 ms and does not wait for the ceiling. The ceiling check waits, and it gates the first connection of mains to the built boards, not the design of the boards.

  Both heated masses are flow-through thermoblocks. There is no steam vessel holding a stored volume at pressure, so the thermoblock's protection trip, not a vessel's pressure rating, is the first point at which the machine depends on its backstop rather than its controller.
rationale: |
  Context: REQ-SAFETY-CHAIN-001.C3 requires the interval between the controller stopping and power being removed to be short enough that the machine cannot reach a hazardous state within it. DEC-PROOF-OF-LIFE-INTERLOCK-IN-FIRST-HARDWARE left the timing bound to design work. The first two forms of this decision derived the interval from the time to the first protective trip and designed the interlock to the derived figure. The owner has now chosen 100 ms.

  Trade-offs: Choosing a short interval makes the interlock the primary defence and the retained thermostats and thermal fuse a backstop that a controller failure alone does not exercise, as before, and costs only that the controller must refresh its proof of life inside it, which a controller of the selected class does at a small fraction of its time. Deriving the interval instead held the main board's design behind the control correction and its re-simulation to settle one timing value, so the boards could not be designed and costed until an unrelated firmware and plant-model programme finished, and the owner needs the boards designed to decide whether the project is feasible and affordable at all. Holding the chosen figure under the first-trip time keeps the requirement honestly met: a short interval is safe only if it is shorter than the time to the hazard, and that is a check, not a design input. Bounding the ceiling by a pressure limit was considered for the steam side, but the machine has no steam vessel: both heaters are flow-through thermoblocks. Deriving it only from measured thermal masses would leave the ceiling pending until commissioning, and commissioning needs the boards, which is circular. Bounding it by a temperature beyond the trip point would make the interlock's correctness depend on the retained devices working, which is the case it exists to cover.

  Reversibility: Changing the chosen figure before the boards are ordered is a change to the timing parts' values in the schematic, and the circuit proof is shown again. After the boards are built it may mean replacing those parts. The ceiling check can tighten or loosen the allowed figure when the thermal masses or the casting peak are measured, without the basis changing.

  Consequences: The controller boards' figures record states 100 ms with this decision as its source and no pending mark against it. DEL-HW-INTERLOCK-INTERVAL-DERIVED is the ceiling check and waits on the corrected control; the main board's design task does not depend on it, and bring-up does. The interlock's timing arithmetic covers the drive circuit's delay, the coil's fall and the relay's release inside 100 ms, and the firmware's refresh period inside the interlock's timeout. The record of the casting peak states the interval as chosen and the ceiling as derived from its peak later.

  Amendment: the first statement of this decision started from the highest temperature the controller commands. Review of the derived figure showed that bounds the commanded variable, not the casting, so the second statement took the casting's peak under control as the starting point. The third statement, by the owner on 2026-10-27, chooses the interval at 100 ms and keeps the derived first-trip time as the ceiling it must sit under, because the derivation made the board design wait on the control correction.
options_considered:
  - option: Choose 100 ms and show it sits under the time for a heater left fully on to reach its retained protection's trip point
    reason_rejected: ""
  - option: Derive the interval from the time a heater left fully on takes to reach its retained protection's trip point and design the interlock to the derived figure
    reason_rejected: holds the main board's design behind the control correction and its re-simulation to settle one timing value, so the boards cannot be designed and costed to decide whether the project is feasible; withdrawn by the owner on 2026-10-27
  - option: Time for the steam side to reach a vessel pressure limit
    reason_rejected: the machine has no steam vessel; both heaters are flow-through thermoblocks, so no stored pressurised volume sets an earlier limit
  - option: Pending until thermal masses are measured at commissioning
    reason_rejected: commissioning needs the boards this interval feeds, which is circular
  - option: Time to a temperature beyond the trip point
    reason_rejected: makes the interlock's correctness depend on the retained protective devices working, which is the case it exists to cover
chosen: Choose 100 ms and show it sits under the time for a heater left fully on to reach its retained protection's trip point
