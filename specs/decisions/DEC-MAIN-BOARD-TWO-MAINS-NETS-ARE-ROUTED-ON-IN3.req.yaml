id: DEC-MAIN-BOARD-TWO-MAINS-NETS-ARE-ROUTED-ON-IN3
type: decision
category: tactical
title: Two mains nets of the main board, the hot valve feed and the zero-cross LED feed, are routed on inner layer In3 inside the mains region
status: active
version: 2
decided_by: design owner, on an independent verdict, signed on the project owner's behalf under his standing instruction of 2026-11-07
text: |
  The routed v2 main board carries two mains nets on In3.Cu inside the mains rule areas, and only those two: HOTVALVE, the hot valve feed from J109 pin 1 to K741 pin 13, and ZC_LED_A, the zero-cross LED feed from U602 pad 2 to R631. Neither has a path on F.Cu, In2.Cu or B.Cu. HOTVALVE runs its whole length on In3.Cu, 43.9 mm in five tracks 0.30 mm wide with no via, between the through-hole pads of its two ends, and crosses under the VALVE_COM line that runs on B.Cu. ZC_LED_A runs 56.5 mm on In3.Cu in three tracks 0.25 mm wide, joined to F.Cu at each end by a plain through via of 0.6 mm pad and 0.3 mm drill, two vias in all, each joining copper on exactly two layers.

  What else is fixed for In3.Cu inside the mains rule areas. No other net, mains or low voltage, is routed there, and In1.Cu and In4.Cu stay free of mains copper. In3.Cu lies one prepreg ply, about 0.11 mm on the maker's default six-layer build, under In2.Cu, so an In3.Cu mains track lies under In2.Cu copper only of its own net, for ZC_LED_A the neutral set, and for HOTVALVE the In2.Cu neutral pour. The overlap is measured, and for HOTVALVE it is at most 5 mm2: as built it is 3.952 mm2, and ZC_LED_A lies under 13.142 mm2 of the neutral set, which is not capped because its stress against neutral is about 1.2 V. Any other In2.Cu mains net may be crossed only at right angles and each crossing is listed: the one crossing as built is HOTVALVE over the PUMP_S_OPTO_MT track on In2.Cu, at 90 degrees, 0.075 mm2. The In2.Cu neutral pour stays one piece, its narrowest neck 1.1 to 1.2 mm as built against the verdict's floor of 0.90 mm. A net keeps one track width, plain through vias are not placed in a pad, and a via is placed only where the barrel clears every other-net copper on every layer it passes by 1.5 mm, as built 1.56 mm from the In2.Cu neutral pour at both ZC_LED_A vias.

  Every mains figure is unchanged and is met on all six layers. Mains copper stands 3.0 mm straight and 10.0 mm by path round the slots from every low-voltage item on every layer; as built the nearest low-voltage copper is 12.586 mm from HOTVALVE and 10.818 mm from ZC_LED_A, and no ZC_LED_A via is nearer than 8.81 mm. Inner copper and vias stay 1.5 mm or more from slot walls and the barrier strips of K731, K741, U602, U701 and U711 stay empty on every layer. Mains copper stays 1.5 mm clear and 2.6 mm creepage from other mains nets, or at the signed pair for ZC_LED_A against the neutral set, 0.4 mm and 0.2 mm; as built the nearest other mains copper on In3.Cu and In4.Cu is 2.642 mm from HOTVALVE and 2.627 mm from ZC_LED_A. No entry of the separation basis changes and nothing is re-signed. The decision was taken by the design owner on an independent verdict and is signed on the project owner's behalf under his standing instruction of 2026-11-07, on 2026-11-14.
rationale: |
  Context: on the re-laid mains side two nets had no legal route on the surface or on In2.Cu. The front band between the two pump triac tabs is full, the B.Cu line VALVE_COM is a wall from K731 to K741 that HOTVALVE has to cross, and the In2.Cu neutral pour keeps one neck that feeds the east group of parts, so a route for either net through In2.Cu would cut that neck. In2.Cu inside the mains rule areas had been the only inner layer for mains copper, but that was layout-plan prose in four places and not a figure of the separation basis, and no rule of the pre-order check names a layer. The check holds every mains item to 3.0 mm straight and 10.0 mm round the slots against every low-voltage item in plan view whatever layers the two are on, holds inner copper of any net 1.5 mm from slot walls, and measures the barrier strips on every layer, so In3.Cu mains copper is judged exactly as In2.Cu mains copper is. In1.Cu and In4.Cu hold no copper inside the mains region and In3.Cu low-voltage tracks lie outside it, so the plan-view rule leaves no low-voltage neighbour above or below. An independent verdict was taken because the design owner was anchored on the In2.Cu stack, as the layer-stack consequence of the board design method requires.

  Trade-offs: the one new thing is the ply. Until now the thinnest dielectric between two different mains nets was about 0.65 mm (F.Cu to In2.Cu), and the repository held no figure for the In2.Cu to In3.Cu ply, which is functional insulation between mains nets and not the barrier to low voltage. ZC_LED_A against the neutral pour sees about 1.2 V in normal work, and with the LED open it floats to line through R630 and R631, 118 kilohm, which is 253 / 118000 = 2.14 mA, a pair already signed at 0.4 mm and 0.2 mm. HOTVALVE against the neutral pour sees 253 V rms, 358 V peak, whenever the valve is off, because the valve's live lead is on LINE1 and K741 switches the neutral side: 358 V over 0.109 mm is 3.3 kV/mm against 30 kV/mm or more for FR-4 prepreg, a margin of about 9, and about 3 with the entry varistor holding surges under about 1 kV. If the ply ever failed, the valve would be energised through its own coil, 0.129 A steady and 0.203 A inrush for both coils, the same effect as a welded K741 contact, with no over-current and no path to the low-voltage side. A senior engineer accepts that for a coil-limited branch if the exposed area stays small and written down, which is why the overlap cap and the right-angle crossing rule are recorded. Current and timing are not a cost: 0.129 A in 0.3 mm inner copper at 0.5 oz is within the track's rating, and about 30 mm of 0.3 mm track under the neutral pour adds about 3 pF across the LED, 118 kilohm times 3 pF is 0.4 microseconds against a zero-cross that needs about 100 microseconds; the pour also screens the LED feed from the triac tabs. Rejected: swapping the relay pins and moving U602 0.4 mm toward its slot, because it puts mains pads 0.35 mm from the slot wall of the reinforced barrier (the rule is 0.3 mm, the signed margin held 0.75 mm), spends margin on the barrier that protects the user to solve a functional-insulation problem, edits schematic sheet 710 and still leaves ZC_LED_A open. Rejected: re-placing U602, which needs a new slot, a new barrier strip, new floorplan rows, a low-voltage re-route and a full placement round with its re-proof, far out of proportion to a hop of two nets. Rejected: a zero-ohm jumper, because the wall is on B.Cu where no parts stand and the front band is full, so there is no site, and moving the neutral neck or adding a B.Cu neutral link track adds track-width lines and still does not free ZC_LED_A. The cost accepted is a board rule of its own, the ply rule above, which is not a figure of the separation basis and is judged at the layout review. The verdict named 0.3 mm tracks and 0.75 mm via pads in its working figures and counted four vias; the as-built figures stated in the text replace them. The via pad is 0.6 mm because a 0.75 mm pad missed the signed 0.4 mm to the LED's own neutral pad by 0.055 mm; its 0.15 mm ring is inside the maker's stated capability and the net carries milliamps, as the 0.25 mm track does. No separation figure is bent by either.

  Reversibility: moderate. The two runs are tracks and vias on one layer, but removing them means a pin swap with U602 moved, or a re-placement of U602 with a schematic edit, so it is a board change before the boards are ordered and a revision after. If a condition cannot be met on a later board the work stops and relaxes no figure; the fallback for HOTVALVE alone is the relay pin swap and 0.3 mm valve nets without moving U602, and for ZC_LED_A it is the U602 re-placement round, never a custom narrowed land or a triac moved to zero margin.

  Consequences: the board's design records are amended in the same change: the stack paragraph and the mains-joins row of the layout plan, the stackup row of the design rules and the copper layers row of the fabrication notes now say that In3.Cu carries the two mains runs inside the mains region. The rows that speak of the mains inner layer stay true as written. No change is made to the separation basis, the pre-order check, its rule record or the board's design-rule file, and no stack-up order change is asked of the maker. The two nets enter the locked-copper record as new mains copper with the rest of the re-laid mains side. The ply rule is carried by the board's records and the owner's sign-off entry, which states the HOTVALVE and ZC_LED_A figures above, and this decision adds no residual safety risk beyond the one that entry accepts: a failure of the ply under HOTVALVE would energise the hot-water valve through its own coil as a welded relay contact would, and is not a shock or fire path. The stack-change condition of the board design method is met: an independent owner's verdict with conditions and a sign-off entry.
options_considered:
  - option: In3.Cu carries the two mains runs HOTVALVE and ZC_LED_A inside the mains region, under the conditions of the independent verdict
    reason_rejected: ""
  - option: Swap the relay pins and move U602 0.4 mm toward its slot, with the valve nets at 0.3 mm
    reason_rejected: puts mains pads 0.35 mm from the slot wall of the reinforced barrier, edits a schematic sheet and still leaves the zero-cross LED feed open
  - option: Re-place U602 with a new slot and barrier strip
    reason_rejected: needs a new slot, floorplan rows, a low-voltage re-route and a full placement round with its re-proof, far out of proportion
  - option: A zero-ohm jumper
    reason_rejected: 'no site: the wall is on the back where no parts stand and the front band is full, and moving the neutral neck or adding a back neutral link track does not free the zero-cross LED feed'
chosen: In3.Cu carries the two mains runs HOTVALVE and ZC_LED_A inside the mains region, under the conditions of the independent verdict
