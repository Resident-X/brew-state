id: DEC-PROFILE-SEGMENTS-COMMAND-PRESSURE-OR-FLOW
type: decision
title: A brew profile is an ordered list of segments, each commanding pressure or flow, limiting the other and carrying its own water temperature
status: active
version: 2
decided_by: david
text: |-
  A brew profile is an ordered list of segments, each commanding one of pressure or flow and limiting the other.
rationale: |
  Context: A brew profile is an ordered list of segments. Each segment commands one primary variable, pressure or flow, chosen per segment, and holds the other as a limit. It also states a transition shape into the segment (a step or a linear ramp over a stated duration), an exit condition (elapsed time, delivered volume, delivered weight where weight is measured, or a pressure or flow threshold) and a water temperature target for the segment, or a statement that it holds none. Flow and pressure are coupled through a puck whose resistance changes with grind, dose, distribution and age, so only one of them can be commanded at a time; the other is whatever the puck produces in response, and the limit keeps it bounded. Quantities the machine measures and only reports, neither commands nor limits, are the volume delivered, the puck resistance derived from pressure and flow together, and the supply voltage. Pressure is additionally bounded by a safety-only relief that is never in service (DEC-BREW-RELIEF-VALVE-IS-SAFETY-ONLY), so a segment's pressure limit is a control limit below that relief, not the relief. The earlier decision fixed the command at flow for every segment and capped pressure mechanically; the owner has since decided that the choice belongs to the segment.

  Trade-offs: The evidence base is secondary: vendor and community documentation, not measurement on this machine. Decent Espresso documents pressure or flow selectable per step with the other as a limiter, and adaptive profiles. Gaggimate and Gaggiuino command pressure or flow per phase. Community consensus is that neither alone is better. Flow control forgives variation in the puck, but a small flow error then produces a large pressure spike. Pressure control is predictable for the cup but gushes as the puck degrades. A per-segment choice lets an early segment command flow to fill and wet the puck without spiking pressure, and a later segment command pressure to hold the extraction, with the limit protecting whichever variable is free. Flow only, as the earlier decision had it, cannot express a held-pressure extraction. Pressure only leaves the delivered amount the free variable, which the endpoint and the thermal feedforward need to be predictable. Commanding pump duty directly profiles neither: duty is not a quantity anyone can reason about in the cup, and its relation to flow and pressure moves with every variable in the puck. A fixed hybrid, for example flow to a pressure then pressure for the rest, builds one operator's habit into the machine and cannot express other profiles.

  Reversibility: Reversible in the control law without touching the requirement layer, which states the course and its end condition without naming a quantity. The hardware consequence is that a pressure-commanded segment needs the brew pressure measurement the retained sensor provides (DEC-BREW-PRESSURE-SENSOR-IS-RETAINED-FOR-PRESSURE-MAP-AND-DRIFT) and a flow-commanded segment needs the flow measurement (DEC-FLOW-SENSED-UPSTREAM-OF-PUMP), so both channels are required in the brew path, not one. Dropping either later gives up that command mode.

  Consequences: Every place that treats the command as flow alone has to treat it as the segment's primary variable: the pump trim toward the commanded quantity, the report of departure from the commanded course, the plant model's flow term, and the confirmation that commanded pumping moved water. Pressure measured in the brew path is now load-bearing for control and not only for the pressure map, so REQ-MEASUREMENT-001.C7 is needed by the control and stays open until the sensor is fitted and read; the earlier statement that no decision added a brew pressure channel no longer holds. The per-segment water temperature target is a command into the brew temperature loop and is held to the delivery's declared band; a segment that states none leaves the loop holding nothing for it.
options_considered:
  - option: Segments each command pressure or flow, hold the other as a limit, and carry a transition shape, an exit condition and a water temperature target
    reason_rejected: ""
  - option: Command flow only and cap pressure mechanically
    reason_rejected: Cannot express a held-pressure extraction, and moves the pressure bound into a fixed mechanical setting chosen once
  - option: Command pressure only and let flow follow
    reason_rejected: Makes the delivered amount the free variable, which the endpoint and the thermal feedforward need to be predictable, and gushes as the puck degrades
  - option: Command pump duty directly and profile neither
    reason_rejected: Duty is not a quantity anyone can reason about in the cup, and its relation to both flow and pressure moves with every variable in the puck
  - option: A fixed hybrid, flow to a pressure and then pressure for the rest
    reason_rejected: Builds one extraction style into the machine and cannot express profiles that start or end the other way
chosen: Segments each command pressure or flow, hold the other as a limit, and carry a transition shape, an exit condition and a water temperature target
