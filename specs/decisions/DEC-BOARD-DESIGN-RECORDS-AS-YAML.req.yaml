id: DEC-BOARD-DESIGN-RECORDS-AS-YAML
type: decision
category: tactical
title: Board design records are YAML files in the machine's hardware folder that the connectivity and parts checks compare a design against
status: active
version: 13
text: |
  The three records a board design is checked against are YAML files in the machine's hardware folder, hardware/<machine>/, found the way the separation basis record is found: a design is held to the record in the nearest folder at or above its own, and a proof design carries its own records marked synthetic: true. A record marked synthetic satisfies only a design marked not for manufacture. A record that cannot be parsed, or lacks a required key, fails like a missing one, and a design with no record to be held to fails rather than passes.

  The pin allocation record, pin-allocation.yaml, holds a list under the key channels. Each entry names the channel exactly as the channel enumeration names it, the schematic net that carries it, the controller pin, the connector reference and the connector pin. The controller pin is written as the controller's own pin name, port letter then number, as in PC6, so the connectivity check reads it off the controller symbol and the firmware check reads it off the target's port and pin constants. An entry whose channel the firmware drives also carries the firmware's own identifier for that channel under the key firmware_channel, and an entry whose channel the firmware reads through a converter input carries the firmware's identifier for it under the key firmware_sensor. Each firmware check compares only the entries that carry its own key, so an entry takes part in at most one of them, and the connectivity check ignores both keys. Each check reads only the keys it names and ignores the rest. The sensor check also reads the controller's converter-input map, controller-input-map.yaml in the same folder, which holds a list under the key inputs; each entry names a converter input as the firmware names it under the key converter_input and the controller pin it reaches, written as the record writes a controller pin, under the key controller_pin. The design task that chooses the controller authors that map beside the pin allocation record. A channel that stays on the board with no connector states no connector. The connectivity check fails a channel whose net does not reach the stated controller pin and connector pin, a channel the record lists that the design lacks, and any net on a connector pin or controller pin that the record does not list.

  Amended for a board that places no controller, and for supply pins on a connector. A pin allocation record whose top level carries controller: none declares that its design places no controller. A design so declared must place no part with a port-named pin and no part whose LCSC number equals the machine's controller part record; one that does fails, naming the part; where the machine folder holds no controller part record, the declared design is checked for port-named pins alone. Each entry of such a record names the channel, the net, the connector and the connector pin, carries no controller pin, and carries exactly one of far_channel, the name, as the channel enumeration names it, of a channel that another design in the same machine folder lists with a controller pin and a connector, and rail, the name of the supply or return the pin carries. A far channel that no other design's record lists fails the design, so a header pin dropped on the controller's own board is caught; a design with no machine folder, such as a proof design, is exempt from that cross-check. An entry that carries rail instead of a controller pin may also appear in the record of a design that does place a controller, so that the supply and return pins of a connector can be listed. A rail entry's channel is a label unique within the record, not a name from the channel enumeration, and a rail entry is exempt from the rule that a net is listed once, so a connector with several supply or several return pins is listed in full; each connector pin is still listed once. The check reports its findings in one text report; it has no machine-readable report. The connectivity check still fails a channel whose net does not reach its connector pin, a channel the record lists that the design lacks, and any net on a pin of a listed connector that the record does not list. The check does not compare the cable between two boards' headers pin for pin; it holds that each far channel exists and is driven. A design that places no controller and carries no declaration still fails, as before. A different microcontroller that has no port-named pin and another catalogue number is the case neither this rule nor the controller part rule can see.

  The parts specification record, parts-specification.yaml, holds a list under the key positions. Each entry names a position by its reference designator and states what the part there must satisfy as keys: value, package and rating, each optional, and the LCSC number of the part chosen. The design carries each part's manufacturer catalogue number in a symbol field named LCSC, its rating in a symbol field named Rating, its value in the symbol's Value field, and its package as the footprint's library item name. The parts check fails a placed part whose stated value, package or rating differs from the record, a part whose LCSC field is absent or differs, and a position the design places that the record does not list. A position the manufacturer does not place states its catalogue number as the word none, lowercase, in both the record's lcsc key and the design's LCSC symbol field; the two must agree, an absent number still fails, and for such a position the check looks nothing up in the catalogue extract and still compares its value, package and rating.

  The catalogue extract, catalogue-extract.yaml, is a committed reading of the manufacturer's public catalogue. It states the date it was read, its source, a max_age_days beyond which the check refuses it, and a list under entries of LCSC number, library class, stock and unit price. Each entry also carries a lifecycle mapping holding status, the part's lifecycle status as published, or a statement that no source publishes one; source, where it was read, the part maker's published status or the manufacturer's catalogue, naming the sources looked at where none publishes it; and read_on, the date it was read. The lifecycle mapping is required on the entry of every part a design places, and holds all three; status is one of active, not recommended for new designs, end of life, obsolete, or a statement that no source publishes one. An entry may also carry the optional key category, the first category name of the part's parts-library record copied verbatim, a non-empty string when present; the decoupling pin-type rule skips an integrated circuit only when its entry's category is in a closed list of categories of parts that have no supply pin, and a malformed category fails the extract read. The parts check never fetches the catalogue: it fails a part whose LCSC number is absent from the extract, a part the extract shows out of stock, and an extract older than its own max_age_days.

  Every entry of the parts specification record also carries class, naming a derating policy class exactly, or none for a part no class covers.

  Four further records, found and marked synthetic the same way, hold what the derating, pin-limit, board-minimum and sensing checks compare a design against. The manufacturer limits record, manufacturer-limits.yaml, and the board rules record, board-rules.yaml, are defined, with what each rule compares, by the decision on the further pre-order rule readings.

  The derating policy record, derating-policy.yaml, states the policy a board's parts are held to: its source, and a list under the key classes, each entry naming a part class under the key class and holding, under the keys voltage, power and temperature, a mapping of share, a number above zero and at most one, being the fraction of that rating a part of the class may use, and source, where that share was taken from. A part class the policy names is covered by it, and every position whose part falls in a covered class must carry a rating in the parts specification record and in the design's Rating field, written as a figure with its unit; the derating check fails such a position without one. The parts check is unchanged and still treats rating as optional where no derating applies.

  The pin-limit record, pin-limits.yaml, holds the limits of each part's pins and the power domains of the board. Under the key domains it lists each power domain by name, with rail, the net that supplies it, and highest_voltage_v, that rail's highest voltage in service. A domain may also carry rides_on, naming another listed domain whose voltage it follows, with exactly one of fraction (above 0, at most 1: its share of that domain's highest_voltage_v) or offset_v (signed and not zero: volts added to that domain's figure, so a positive offset puts the riding net above its host and a negative one below it); the domain's own highest_voltage_v must equal the highest figure so derived, which is the host's figure with the fraction applied or offset_v added and is above 0, and the domain's lowest voltage is worked out from the host's lowest the same way. A rides_on that names no listed domain, names its own domain or forms a cycle, a fraction or offset_v without rides_on, both together, an offset_v of zero, and an offset_v that leaves the derived figure not above 0 each fail. Under the key parts it lists each part by its catalogue number under lcsc, with source, a mapping of document, revision, section and read_on (the date read), and a list under pins, each holding pin (the name or number), domain (naming a listed domain), absolute_max_v, absolute_min_v, and tolerates_driven_unpowered (true or false). The check refuses any key inside these two records, inside the controller part record, and inside the manufacturer limits and board rules records, that this text and the decision on the further pre-order rule readings do not name, and the check that reads their keys reads each record when a design's folders hold it and does not itself fail a design that holds neither. The pin-limit check fails a pin whose net can reach a voltage beyond its limits, counting a net driven from another domain while the pin's own is unpowered, and a semiconductor or integrated-circuit part on the board that the record omits; a passive or mechanical part needs no entry.

  The controller part record, controller-part.yaml, is found and marked synthetic the same way and names the one microcontroller a design is held to. It holds part, the maker's orderable part number; lcsc, the manufacturer catalogue number a design carries in the LCSC symbol field of its controller; pins, a non-empty list of the port-pin names the part has, each written port letter then number as in PC6 and each listed once; and synthetic, true or false when present. The check refuses any other key. A design's controller is every placed part with a pin whose name is a port pin, the definition the connectivity check already uses, so the board tool holds no second definition of a controller. The LCSC field of each such part must equal the record's lcsc, and a part whose field is absent or differs fails, naming the part. A pin allocation entry whose controller pin is not among the record's pins fails, naming the channel and the pin. A design that places no such part is not failed for the record or its absence, and a design that places one and has no usable record fails, as a missing or unparsable pin allocation record fails. No key exempts a design: a proof design is exempt only through its own record marked synthetic, which names a synthetic controller of its own and satisfies only a design marked not for manufacture. The record names the machine's selected controller and is authored by the controller's selection, not by a board's design task. The record that names it is the one in the machine's own folder, hardware/<machine>/, and no record nearer to a design can stand in for it: a controller part record that is not marked synthetic and sits anywhere but the machine's own folder fails the design that finds it, naming the record, so a board's own folder cannot hold a design to a different controller. A record marked synthetic may sit nearer, in a proof design's folder, and satisfies only a design marked not for manufacture.

  The firmware's channel-to-pin assignment is compared with the pin allocation record by a separate check in the firmware verification tier, so the board tool never reads firmware source and the firmware tier never reads a board.

  These records are the contract between the checks and whoever produces the pin allocation and parts for a board. The checks are built and proven on synthetic records beside the proof designs, so they exist before any real board is drawn; applying them to a real board is the work of that board's design task, which also authors that board's records and keeps the catalogue extract current for the parts it uses.
rationale: |
  Context: the connectivity and parts checks compare a board with a record, but no record of either exists in a form a tool can compare. The channel enumeration and the component specification are prose tables, the only pin allocation is a working document of the earlier bought-module direction, and the manufacturer's stock and prices are a dated reading in a prose table. Whatever form the first checks pick becomes the contract for the partition work and for every board's design task, so it is settled here once, ahead of the checks, as the separation basis record was.

  Trade-offs: YAML in the machine's hardware folder reuses the form and the discovery rule the separation basis already uses, so a builder learns one convention and the tooling already has a strict reader for it. Parsing the existing prose tables was rejected because they carry free-text cells such as undecided and a stated capability floor, and a tool that guesses at prose passes what it misreads. Reading the connectivity from a KiCad parts-list export alone was rejected because the export carries no channel names, so it could not say which channel lands where. A live catalogue lookup was rejected because it makes the round and the nightly depend on a third party's site, and because a reader without an account could not repeat it; a dated extract is checkable offline and its age is itself checked. Two channel keys, firmware_channel for driven channels and firmware_sensor for read ones, carry the firmware's identifier because the channel enumeration names channels in prose the firmware cannot carry, and comparing by position or by guessing at prose would pass a misread. Reading the firmware's pin table from the board tool was rejected because it would tie the hardware tool to the firmware's source layout and make the board tier trigger on firmware edits.

  Reversibility: moderate. Key names are read by the checks and written by whoever produces each record, so renaming one is a sweep across both, caught by the check failing on the old form rather than passing silently. Moving a record between folders costs nothing because designs are found by the nearest-folder rule.

  Consequences: the checks and their seeded-fault proofs are built against synthetic records now. The partition and each board's design task author the real pin allocation and parts specification in these forms, and each board's design task keeps the catalogue extract in this form current for the parts it uses. A board's order is blocked by a failure of either check exactly as it is by a failed rule check. The derating policy and pin-limit records are added for the further pre-order checks a design review asked for; they are new files and new keys, and the rating field becomes required only where a derating policy covers a position. The catalogue extract's lifecycle field is a new key on an entry, required on every part a design places, and the delivered parts check fails any entry key it does not know, so an extract carrying it fails that check until the pre-order check is extended to accept and read it; that extension is delivered with the further pre-order checks, and no real board's extract carries the field before it lands. The connectivity check is unaffected.

  Amended for the further pre-order rules: the lifecycle mapping became required so the end-of-life rule decides every placed part, the pin-limit omission rule was narrowed to semiconductors and integrated circuits to match the proof designs' records, and the class key and two records were added; the reasoning is in the decision on the further pre-order rule readings.

  Amended for the controller part: the selected microcontroller was recorded nowhere a tool could compare a design against, so a board could be drawn around a different controller and every other check would pass it. The controller part record carries it, found by the nearest-folder rule like the others. The controller is identified structurally, by the port-pin test the connectivity check applies, rather than by a reference designator or a parts-specification position, so there is one definition of a controller and a board that renames its reference designators still meets the rule. A design with no such part passes, since a board with no microcontroller is a legitimate design, and a design that places one without a record fails, as the decision already requires of a design with no record to be held to. The record's pins let the check refuse a pin allocation naming a pin the selected package does not have without reading a symbol library.

  Amended for a board that places no controller. The heater wall board switches mains heaters from signals its own board only receives, so it has no controller pin to name, and the check as first decided required one of every design and listed every pin of a connector it names, so neither that board nor a supply or return pin on the main board's header could be held to a record. A declaration, not silence, admits a board without a controller, because a missing record or an empty channel list must still fail; the far-channel check holds the receiving board's header to the board that drives it; and the declaration is refused for any design that places a controller, so it cannot be used to dodge the check.
options_considered:
  - option: Three YAML records in the machine's hardware folder, with the catalogue as a committed dated extract and the firmware compared in its own tier
    reason_rejected: ""
  - option: Parse the existing prose tables
    reason_rejected: free-text cells such as undecided make a parser guess, and a guess passes what it misreads
  - option: Read connectivity from a KiCad parts-list export alone
    reason_rejected: the export carries no channel names, so it cannot say which channel lands where
  - option: Look the catalogue up live at check time
    reason_rejected: it makes the round and nightly depend on a third-party site and an account-free reader cannot repeat it
  - option: Board tool reads the firmware pin table
    reason_rejected: it ties the hardware tool to firmware source layout and makes the board tier trigger on firmware edits
chosen: Three YAML records in the machine's hardware folder, with the catalogue as a committed dated extract and the firmware compared in its own tier
