id: DEC-U8-BOARD-RETENTION-UNVERIFIED
type: decision
category: strategic
title: The operator-interface channels are served directly, there being no panel-mounted controller to speak to instead
status: active
version: 2
text: |
  The circuit diagram shows the two OEM microcontrollers exchanging signals over exactly two wires --
  CMDTX from the part driving heaters, pumps, valves and reading zero-cross, and SLVOK from the part
  reading buttons and driving indicators and the two gauge steppers. Read as a link between two
  boards, that raised a real architectural option: if a new controller could speak whatever protocol
  runs on those two wires, the entire button, indicator and stepper board could be retained untouched,
  with no channel rewired onto new hardware.

  Neither chip's firmware is available, and there is no documented protocol for that link -- both are
  proprietary Holtek parts. Nothing on paper settled whether the link was a simple, easily-replicated
  framing or something particular to the two chips' own timing. This decision therefore assumed full
  replacement and named a bench capture, a logic analyser on the two lines while the original board
  was intact and powered, as the work that would settle it.

  That premise does not hold. The owner's direct account of the physical machine, not yet
  bench-verified and recorded with that provenance in reference-machine.md, finds no 28-pin part on
  the front panel: both microcontrollers sit on the main control board, and the panel is a passive assembly
  carrying the indicator elements, ten switches wired as five parallel pairs, and the buzzer, reached by one nine-way harness. The two wires are a connection between two chips on one board rather
  than a link between two boards, and this project replaces both chips. The panel board is retained, as a passive assembly; what it does not carry is a controller, so there is nothing to speak to and no protocol to reverse-engineer, and the bench capture named above answers a
  question that does not arise.

  The conclusion this decision reached is unchanged: every one of those channels is something a
  replacement controller must serve directly. What changes is its standing. It was a conservative
  assumption pending a bench capture, and it now rests on an inspection of the machine instead -- weaker
  than a bench capture as evidence goes, but answering a different and more basic question than the
  one the capture was aimed at, and enough to retire it -- the enumeration and any procurement-facing
  list built on it were not merely safe but correct. The inference that put the channels on a separate
  board came from the circuit diagram, and a circuit diagram groups by function rather than by board;
  it cannot establish where a part is mounted. That is the reading error this correction records, and
  it is the reason the panel's device elements separate cleanly from the circuit that drove them,
  which `DEC-DEVICE-RETENTION-BOUNDARY` now relies on.

  One boundary this decision does not reach: the gauge assembly. It is a second front-mounted board,
  it carries the stepper driver and the low-water indicator, and it is retained rather than replaced
  -- so the conclusion here, that no front assembly carries a controller to be spoken to, is reached for the button panel and holds for the gauge assembly too, which carries a motor driver rather than a controller.
rationale: |
  Context: reference-machine.md stated the OEM control electronics are replaced entirely, written before
  this project's reading of the service manual identified the two-wire link between the two Holtek parts
  or what rides on it. Read as a link between two boards, that raised a real architectural option --
  retaining the button, indicator and stepper board and driving it over its native link -- which the
  existing full-replacement statement foreclosed without having considered it. This decision was first
  recorded as an assumption pending a bench capture that would settle whether the link could be spoken.
  It is no longer an assumption. Physical inspection finds no 28-pin part on the front panel: both
  microcontrollers sit on the main control board, the panel is a passive assembly carrying the indicator elements, ten switches wired as five parallel pairs, and the buzzer, and it is reached by one nine-way harness. The two wires are a connection between two chips on one board.

  Trade-offs: When the option was live, assuming full replacement cost nothing, kept the default the
  project was already designing against, and avoided baking an unverified guess about undocumented
  proprietary firmware into a design decision. Assuming retention would have done the opposite. Blocking
  hardware-facing work until a bench capture happened was rejected as disproportionate. That comparison
  is now historical: the retained-board alternative does not exist to be weighed, because there is no controller on that board. What remains is the same conclusion reached on better grounds -- every channel on the
  panel is one a replacement controller must serve directly, and now because nothing else can serve it
  rather than because nobody has checked whether something else could.

  Reversibility: The question this decision held open is closed rather than reversible. Work built under
  the full-replacement default -- the enumeration, the headroom argument, the procurement-facing list --
  does not become wrong or even conservative; it becomes correct. What would reopen it is not a bench
  capture but a different machine: the reading rests on inspection of this one, recorded with that
  provenance rather than as a document claim, and a second machine of the same model wired differently
  would be a different case.

  Consequences: The enumeration and any procurement-facing list present the button, indicator, buzzer and
  stepper channels as things a candidate controller must serve directly, which they already did. The
  bench capture this decision once named as its next step -- a logic analyser on the two lines while the
  original board was intact -- answers a question that does not arise, and is withdrawn rather than left
  outstanding. The headroom table in component-specification.md loses the second column that costed the
  retained-panel alternative. And the inference that put the panel channels on a separate board came from
  a circuit diagram, which groups by function rather than by board and cannot establish where a part is
  mounted; that reading error is what DEC-DEVICE-RETENTION-BOUNDARY relies on having been corrected,
  because it is what lets the panel's device elements separate cleanly from the circuit that drove them.
options_considered:
  - option: Serve the operator-interface channels directly, no panel-mounted controller existing to speak to instead
    reason_rejected: ""
  - option: Retain a panel board and drive it over the OEM two-wire link
    reason_rejected: the panel board is retained, but it carries no controller - both microcontrollers sit on the main board, so those two wires connect two chips this project replaces
  - option: Block hardware-facing work until a bench capture of the link answers the question
    reason_rejected: the question does not arise, so the capture is withdrawn rather than outstanding
chosen: Serve the operator-interface channels directly, no panel-mounted controller existing to speak to instead
links:
  - target: DEL-COMPONENT-SPECIFICATION.C4
    type: addresses
