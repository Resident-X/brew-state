id: DEC-BOARD-PRE-ORDER-RULE-READINGS
type: decision
category: tactical
title: Each further pre-order rule compares a named record figure and fails a design that omits what it needs
status: active
version: 18
text: |+
  Each further pre-order rule reads only the design's files and the records it is held to, and fails a design whose record or declaration the rule needs is missing, so a rule whose record is absent fails rather than passes. A design that simply has no item of the kind a rule inspects, such as no connector, no mounting hole or no surface-mount part, is not failed for that, and an explicit none in a declaration is accepted. The records are those defined by the board design records decision and its amendment; this decision fixes what each rule compares.

  Board minimums. A manufacturer limits record, manufacturer-limits.yaml, found by the nearest-folder rule and marked synthetic in a proof design, holds read_on, the date it was read; source, where it was read; max_age_days, beyond which the check refuses it; and processes, a list. Each process entry holds copper_layers, a whole number; outer_copper_oz, the finished outer copper weight in ounces, a number; and limits, a mapping from the name of the board-setup or rule key it bounds (min_track_width, min_clearance, min_through_hole_diameter, min_hole_to_hole and the like, each key a minimum as KiCad names it) to a mapping of mm, the limit in millimetres, and citation, the published entry it was read from, naming that entry's section, limit and condition, because several entries share one source. A process is keyed by its copper_layers and outer_copper_oz together. The design's copper layer count is derived from its own layer stack. Its finished outer copper weight is declared, because the manufacturer takes the weight as an order option and no layout file the manufacturer receives carries it: the board rules record holds a third mapping, fabrication, holding outer_copper_oz and source, the reason that weight was chosen, and it may not state none. The rule fails a board whose board-setup minimums, each net class's clearance and track width, or any minimum a custom rule sets, is looser than the limit of its process, a board whose process the record does not list, a design whose board rules record declares no outer copper weight, and a record older than its own max_age_days. A net class's clearance and track width, and a custom rule's constraint, are held to the limit of the matching board-setup key: clearance to min_clearance, track_width to min_track_width, hole_size to min_through_hole_diameter, hole_to_hole to min_hole_to_hole, annular_width to min_via_annular_width, via_diameter to min_via_diameter, hole_clearance to min_hole_clearance and edge_clearance to min_copper_edge_clearance; any other constraint, such as track_angle, creepage or courtyard_clearance, is not judged, a rule's figure is converted to millimetres from its own unit, and looser means smaller. A board-setup minimum the record bounds and the project file does not state fails, naming the key, since KiCad would then apply its own default, which no record reviews. A test holds each figure of a manufacturer limits record not marked synthetic to the matching entry of the dated prose manufacturer record that it cites, so the record cannot drift from its source; a synthetic record, which exists only to prove the rule against a throwaway design, is exempt.

  Separation floor. A signed mains_to_low_voltage figure is compared with the floor its own table_rows give. A row applies when its working_voltage_v and altitude_m are at or above the basis values, its overvoltage_category, pollution_degree and material_group equal the basis values, and its insulation equals the strongest insulation among barrier_types. The floor is the largest clearance_mm and the largest creepage_mm over the applicable rows. The basis keys overvoltage_category, altitude_m and barrier_types, optional on a record, are required when the design declares mains present, and working_voltage_v is the leading number of the basis working_voltage, in volts rms, being for a mains-present basis the value at the top of the declared supply span. An input a row does not state does not constrain whether it applies. The rule fails a signed figure below its floor and a design that declares mains present with no applicable row for either figure. The same floor is read for a signed mains_to_mains figure, from the rows whose location is conductor unless stated: clearance_mm against the largest clearance_mm of the applicable rows of insulation basic; terminal_clearance_mm against the largest clearance_mm of the applicable rows of insulation basic and location terminal; creepage_ahead_of_fuse_mm against the largest creepage_mm of the applicable rows of insulation basic; and creepage_mm against the same rows, or, where the mapping holds downstream_basis, against the applicable rows of insulation functional. A derived row at the basis working voltage applies like any other. A design that declares mains present with no applicable row for one of these figures fails, naming it, as does a creepage_mm below creepage_ahead_of_fuse_mm with no downstream_basis, and a held_at_reinforced pair naming a net that is not in the Mains class of the layout.

  Accepted separation exceptions. A spacing shortfall that the layout rule check reports under the signed Mains rules, or under the mains-to-mains rules the basis decision sets, between the pair of items that an accepted_exceptions entry's between lists, for that entry's pair and constraint, is judged against the entry. It is reported as an accepted exception when the measured distance is no less than the entry's accepted_mm, and as a violation, naming the entry, when it is less. A shortfall between any other pair, including another pair of the same part, is a violation. An entry fails when its acceptance is unsigned or dated after the record's own acceptance, when its accepted_mm is not below the signed figure it relaxes, when it names a pad or net absent from the layout, or when no reported shortfall uses it, so a record can neither carry a stale exception nor relax a figure by one. Every accepted exception is reported in the check's report, whose only form is text, with the pair, the measured distance, the accepted distance and the owner's reason, so an accepted shortfall is never silent.

  Mounting holes. A mounting hole is a footprint whose pads are all drilled holes and which has at least one mark of a fixing, namely every hole non-plated, exclusion from the bill of materials, a library item name beginning MountingHole, or a single pad, so that a forgotten attribute on a plated mounting pad does not skip the check, and every non-plated hole. A fixing's extent is the larger of its pad and its courtyard. The check appends, after the signed Mains rule, rules holding the hole clearance to the Mains class at no less than the larger of the signed clearance and the signed creepage on every layer, and measures from the layout file the distance from each mounting-hole footprint's pad copper and courtyard to every pad, track, via and pour fill of a Mains net on every layer, held to the same distance, because KiCad measures a courtyard only against another courtyard. It fails a plated hole on a non-Mains net inside the signed distance. The signed figure governs whether or not the fixing is bonded to protective earth.

rationale: |+
  Context: nine rules extend the pre-order check, and each needs a form for the figure it compares, a class it applies to, or a reading of a phrase the criteria leave open. The delivered decisions fix the separation and pin-limit record shapes but leave open where the manufacturer's limits, the sensing clearance, the ground-return ratio, a part's derating class and the fixing's extent are declared. Settled once here, ahead of the rules, so each rule's solution builds to one reading and the records every board's design task authors have one form.

  Trade-offs: a machine-readable manufacturer record beside the prose entry lets the minimums be compared, and holding each figure to its cited entry keeps the two from drifting; comparing against the prose, as the reviewer does now, passes what a reader misses. Deriving the layer count from the layer stack removes a declaration that could disagree with the board; the copper weight cannot be derived, since no layout file the manufacturer receives carries it, so it is declared where the order is decided and the board is held to the limits of that weight. A weight above the manufacturer's standard is a priced option that raises the board's cost many times over, so the standard weight is the starting point and the declared source states why a heavier one was chosen. Declaring sensing and noisy classes in a record, with an explicit none, follows the mains declaration, so silence never reads as compliance; inferring classes from net names was rejected because an unrecognised name would read as safe. Enforcing sensing clearance by appended rules reuses the separation mechanism and its guarantee that nothing the design writes overrides it. A pair without the Mains class sits ahead of the signed rule. A pair involving it sits after, on the clearance constraint alone at the larger of the two figures, because the signed rule matches every Mains pair and, being last, would otherwise hide a sensing figure above the signed one, while a rule after it at the larger figure can only tighten. Stating the ground ratio as signal pins per return makes a smaller number stricter and lets the test be exact on whole pins, where a ratio of signal to ground read as a minimum ran the wrong way. Requiring a class on a covered position, not inferring it from the part, keeps the derating check from guessing. Reading a part's kind from the exact leading letters of its reference designator, not from a prefix, keeps a light-emitting diode, a fiducial or a display from reading as an inductor, a fuse or a ferrite, and not from its policy class, follows the connector reading and keeps one free-text class name from deciding whether a part needs a pin-limit entry or joins nets; a class such as mains-rated part spans a fuse that joins nets and capacitors that do not. Taking the mains domain's lowest voltage as minus its peak, and every other domain's as zero, lets the below-minimum test be worked out with no further record key; it is kept out of the working voltage, where it would read two nets of the one mains source as twice the peak apart, and a part across two nets of the mains domain is instead held to the domain's peak. Narrowing the pin-limit omission rule to semiconductors and integrated circuits reconciles the earlier text with the proof designs, whose records list only such parts, and loses nothing because a passive has no absolute maximum a net can breach beyond its rating, which the derating rule covers. Requiring lifecycle on every placed part makes the end-of-life rule decide every part and not only those the extract happens to annotate. The polarity exemption is a geometry rule and not a record key because a key naming a part exempt, or a first pad, declares a choice with no guard against a convenient one, while the hole pattern is a property of the footprint the check can read; it compares hole position and drill and not the copper, because a hole pattern keys a part into the board and copper does not, so a two-pin diode with one rect and one round pad still fits either way. The decoupling skip is keyed on the catalogue's first category and not on a position key or a part class because a position key can be carried by any U position and the class cannot tell an isolator from a regulator, while the category is a published fact of the part the extract already records by catalogue number and fails closed when absent.

  Mains-to-mains figures are compared with their floor as the mains-to-low-voltage ones are, so a signed figure its own rows do not support is caught. A shortfall is judged against an exception rather than muted, because a muted rule passes a part whose geometry later worsens; an exception that no shortfall uses fails, so a stale acceptance does not outlive the layout it excused.

  Reversibility: moderate. Key names and the closed lifecycle vocabulary are read by the rules and written by every board's records, so renaming one is a sweep across both, caught by the check failing on the old form. The figures a record holds are the board design task's to choose and cite; nothing here fixes one.

  Consequences: the board design records decision is amended for the new records, the class key, the required lifecycle and the narrowed omission rule. Each rule's solution extends the record reader to accept the records and keys it introduces and still fail an undefined one, and proves the rule with a seeded fault; every tracked proof design gains the synthetic records it needs so it passes. The sensing practice keeps its judgement item for what a rule cannot decide and gains an enforced rule-kind item for the declared clearance in the layout practice catalogue, and the design method names that item's kind, a clearance between net classes that the board declares in its board rules record and the pre-order check writes into KiCad's own rule check, as a fifth form of rule beside the four it had, so that its statements of the forms stay true; a fiducial item, which the catalogue did not hold, is added to it as enforced. The polarity exemption and the category skip each narrow wording of sealed or delivered siblings (the first-pin statement of the fiducials and polarity marks leaf, and the entry-key enumeration of the parts check and the lifecycle leaf), which are left unedited and named in the leaves that narrow them, and the real board's relays K201, K731 and K741 are the parts the exemption was found for.

  Requiring an entry for every connected pin, and refusing an entry that stands for the rest, closes the case where a record lists a part's supply pin and the pins its author thought of while an unlisted pin on a net that can exceed its absolute maximum passes unjudged; the cost is a longer record, which the record's author writes once from the part's datasheet. A part carrying a rating the rule reads cannot opt out by naming none, since that would let a design pass by exempting what the rule exists to judge; a listed pin the part lacks fails, as a record naming a net the design lacks does. A reader of these records refuses an entry that is ambiguous or matches nothing in the design (a repeated name, number or rail, a rail that is no net, a rating shaped like a voltage that the rule cannot read), since each lets a producer pass a design by how an entry is spelled or repeated. A pin limited only by current is listed, not exempted, since an exemption the check cannot verify would let any pin be called current-limited.

options_considered:
  - option: Declare each rule's inputs in records beside the design and fail on omission
    reason_rejected: ""
  - option: Compare against the prose manufacturer entry and reviewer judgement
    reason_rejected: passes what a reader misses and cannot be run the same way every time
  - option: Infer sensing, noisy and part classes from net and part names
    reason_rejected: an unrecognised name would read as safe
  - option: Keep the pin-limit record required for every part
    reason_rejected: contradicts the proof designs and adds nothing the derating rule does not already check
chosen: Declare each rule's inputs in records beside the design and fail on omission
