id: DEC-BOARD-PRE-ORDER-RULE-READINGS
type: decision
category: tactical
title: Each further pre-order rule compares a named record figure and fails a design that omits what it needs
status: active
version: 14
text: |+
  Each further pre-order rule reads only the design's files and the records it is held to, and fails a design whose record or declaration the rule needs is missing, so a rule whose record is absent fails rather than passes. A design that simply has no item of the kind a rule inspects, such as no connector, no mounting hole or no surface-mount part, is not failed for that, and an explicit none in a declaration is accepted. The records are those defined by the board design records decision and its amendment; this decision fixes what each rule compares.

  Board minimums. A manufacturer limits record, manufacturer-limits.yaml, found by the nearest-folder rule and marked synthetic in a proof design, holds read_on, the date it was read; source, where it was read; max_age_days, beyond which the check refuses it; and processes, a list. Each process entry holds copper_layers, a whole number; outer_copper_oz, the finished outer copper weight in ounces, a number; and limits, a mapping from the name of the board-setup or rule key it bounds (min_track_width, min_clearance, min_through_hole_diameter, min_hole_to_hole and the like, each key a minimum as KiCad names it) to a mapping of mm, the limit in millimetres, and citation, the published entry it was read from, naming that entry's section, limit and condition, because several entries share one source. A process is keyed by its copper_layers and outer_copper_oz together. The design's copper layer count is derived from its own layer stack. Its finished outer copper weight is declared, because the manufacturer takes the weight as an order option and no layout file the manufacturer receives carries it: the board rules record holds a third mapping, fabrication, holding outer_copper_oz and source, the reason that weight was chosen, and it may not state none. The rule fails a board whose board-setup minimums, each net class's clearance and track width, or any minimum a custom rule sets, is looser than the limit of its process, a board whose process the record does not list, a design whose board rules record declares no outer copper weight, and a record older than its own max_age_days. A net class's clearance and track width, and a custom rule's constraint, are held to the limit of the matching board-setup key: clearance to min_clearance, track_width to min_track_width, hole_size to min_through_hole_diameter, hole_to_hole to min_hole_to_hole, annular_width to min_via_annular_width, via_diameter to min_via_diameter, hole_clearance to min_hole_clearance and edge_clearance to min_copper_edge_clearance; any other constraint, such as track_angle, creepage or courtyard_clearance, is not judged, a rule's figure is converted to millimetres from its own unit, and looser means smaller. A board-setup minimum the record bounds and the project file does not state fails, naming the key, since KiCad would then apply its own default, which no record reviews. A test holds each figure of a manufacturer limits record not marked synthetic to the matching entry of the dated prose manufacturer record that it cites, so the record cannot drift from its source; a synthetic record, which exists only to prove the rule against a throwaway design, is exempt.

  Separation floor. A signed mains_to_low_voltage figure is compared with the floor its own table_rows give. A row applies when its working_voltage_v and altitude_m are at or above the basis values, its overvoltage_category, pollution_degree and material_group equal the basis values, and its insulation equals the strongest insulation among barrier_types. The floor is the largest clearance_mm and the largest creepage_mm over the applicable rows. The basis keys overvoltage_category, altitude_m and barrier_types, optional on a record, are required when the design declares mains present, and working_voltage_v is the leading number of the basis working_voltage, in volts rms, being for a mains-present basis the value at the top of the declared supply span. An input a row does not state does not constrain whether it applies. The rule fails a signed figure below its floor and a design that declares mains present with no applicable row for either figure.

  Sensing and ground returns. A board rules record, board-rules.yaml, found the same way, holds three mappings, sensing and ground_returns, defined here, and fabrication, defined under board minimums. sensing holds classes, the net classes carrying precision sensing; noisy_classes, the net classes that switch or drive loads; clearance_mm; and source. ground_returns holds ground_classes, the net classes that are returns; non_signal_classes, the net classes such as power rails and Mains whose pins the ratio does not apply to; and signal_classes, a list with one entry per signal net class, each holding class, signal_pins_per_return (a positive whole number, the most signal pins one ground-return pin may serve) and source (the ratio's citation). The sensing and ground_returns mappings may each state none explicitly, as the mains declaration does; silence fails, and fabrication may not state none. The sensing rule is enforced as the separation rule is, on a temporary copy, and KiCad lets the last matching rule decide. For each sensing and noisy class pair that does not involve the Mains class, the check inserts, after the design's own rules and ahead of the signed Mains rule, one rule at the declared clearance. For each pair that involves the Mains class, the signed rule's condition already matches the pair and, being last, would decide its clearance, so the check instead appends after the signed rule one rule per such pair holding a clearance constraint only, at the larger of the declared clearance and the signed clearance; that rule can only tighten, and the signed creepage stays with the signed rule. A sensing item closer than its pair's figure fails. A local clearance override on a pad or footprint on a sensing or noisy class net that is below the declared sensing clearance fails, since KiCad ranks it above every custom rule; a footprint's override counts as on a net when any of its pads is. The ground-return rule counts, per connector, signal pins, being pins on a net of a signal class the mapping declares, and pins on a ground class, and fails a connector whose signal pins exceed its signal class's signal_pins_per_return times its ground-return pins, compared exactly on whole pins, so a connector with signal pins and no ground-return pin fails. A pin is a distinct pad number on the connector, however many of its pads carry that number; a pad without a number is never a ground-return pin and counts as a signal pin when it is on a signal class net; a pad on no net, or alone on a net named as KiCad names a net nothing else joins, is no pin. A connector pin on a class declared none of ground, signal or non-signal fails, and a connector that carries several signal classes is held to the smallest signal_pins_per_return among them. A connector is a part whose reference designator begins with J.

  Derated voltage. Every position of the parts specification record carries class, naming a class of the derating policy exactly, or the value none for a part no class covers and whose rating, in the record and in the design's Rating field, states no figure in V, VDC or VAC and no number followed by any other voltage unit, so a part that states a voltage figure, readable or not, and names none fails; a position without it, or naming a class the policy lacks, fails. The voltage rating is the figure written with unit V, VDC or VAC; an AC figure is taken at its peak, the figure times the square root of two. The working voltage of a part is the largest, over every pair of nets it connects, of the difference between their highest voltages, each worked out as for pin limits, except that a pair whose two nets both take their highest voltage from the mains domain counts as that domain's highest_voltage_v, since a part across them sees the mains swing between them below, unless one net rides on the other's domain or both ride on one host by rides_on, when the pair counts as the difference of the voltages so derived (two nets of one host with no stated relation still count the host's full highest_voltage_v), and a covered part with a net whose voltage cannot be worked out, being reached only through resistors or capacitors with no rail or listed pin, fails until that net is declared as the rail of a power domain in the pin-limit record. The rule fails a part whose working voltage exceeds the policy's voltage share times its rating. A mains domain in the pin-limit record is required when the design declares mains present and is at least the peak of the basis working_voltage, which the check reads as the working voltage at the top of the declared supply span.

  Pin limits. The omission rule applies to parts that are semiconductors or integrated circuits; passives and mechanical parts need no pin-limit entry. Every connected pin of such a part needs an entry in its record entry, and the rule fails a connected pin the entry omits, naming the part and the pin. A pin is connected when its net holds another pin, of the same part or of any other part, or is the rail of a declared domain; a pin on no other pin and no rail needs no entry. A pin is covered only by an entry that names it, by its number or its name, and no entry may stand for the pins it leaves unlisted. A part the record omits altogether is reported once, by the omission failure, and not again for each pin. A connected pin whose datasheet limit is a current and not a voltage takes an entry like any other: its absolute_min_v and absolute_max_v are the datasheet's stated voltage ratings for the pin and, where the datasheet states none in a direction, the lowest or highest voltage of the domain that drives its net, so that the entry exists and the pin's current is judged elsewhere. A part's kind is read from its reference designator, as a connector is: a designator whose leading letters are exactly U is an integrated circuit, exactly D, Q or LED a semiconductor, and exactly FB, L or F, or R with the value zero, a part that joins nets, and every other designator is a passive or mechanical part. The class key plays no part in deciding kind. The mains domain is the power domain whose rail is on a net of the Mains net class. The lowest voltage a net can reach is used only to test absolute_min_v, and is the smallest of: 0 V where it is a rail of a domain other than the mains domain; minus the domain's highest_voltage_v where it is the rail of the mains domain, since mains alternates; the lowest voltage of every listed pin's domain on it, by the same rule; and that of any net joined to it as below. The highest voltage a net can reach is the largest of: its rail's highest_voltage_v where it is a rail; the domain voltage of every listed pin on it; and that of any net joined to it, directly or in a chain, through a ferrite bead, inductor, fuse or zero-ohm link. A resistor or capacitor does not carry one net's voltage onto another, so a divider or a decoupling capacitor never lifts a net to the rail it hangs from, and a net reached only through those and carrying no listed pin takes no limit from this rule. A connector pin driven from outside the board is declared in the connector's entry in the pin-limit record. Two domains may not name the same rail, and a domain whose rail is no net of the design fails, as a record naming a net the design lacks fails elsewhere. The rule fails a listed pin that the placed part's symbol does not have, a pin whose net can exceed its absolute_max_v or fall below its absolute_min_v, and a pin whose net is driven from another domain while its own is unpowered where tolerates_driven_unpowered is false, a domain whose highest_voltage_v is zero never driving. A voltage held to its limit passes within a relative slack of one part in a billion, which absorbs float rounding only.

  Fiducials and marks. A fiducial is a pad carrying KiCad's global fiducial pad property, counted on the side its footprint sits on. A side carries surface-mount parts when it holds a footprint with the surface-mount attribute that is neither a fiducial nor excluded from the position file, so a test point the assembler does not place does not make a side count. The rule requires at least three fiducials on each side that carries surface-mount parts; a design with no surface-mount part is not failed for fiducials, and a fiducial's size and keep-out are not judged. A polarised part is one that meets any of: its schematic pins are named for anode and cathode or plus and minus; its schematic symbol is a polarised capacitor, a library item whose name begins C_Polarized; it has three or more pads on distinct nets. A footprint whose pads are all one net, or all non-plated holes such as a mounting hole, is excluded; a footprint with a plated pad, through-hole or surface-mount, is a candidate, so a forgotten pin name on a polarised capacitor, through-hole or not, does not skip the check. Its first pin is the pad numbered 1, and a polarised part with no pad numbered 1 fails as having no first pin to mark. A mark is present when both hold. A graphic item of the part's own footprint, a line, arc, circle, polygon or rectangle, on the silkscreen layer of the part's own side lies nearer to the copper of pad one than to the copper of every other pad by more than 0.05 mm, the nearest point of the item being the distance. And the part's silkscreen graphics on that layer taken together are not unchanged, to within 0.05 mm, by any reflection or rotation that maps the footprint's pads onto themselves in position, size and shape while moving pad one, so an outline that looks the same from either end marks nothing. Text, the reference designator and board-level silkscreen are not marks. The rules read the schematic's netlist for pin names and the layout for pads and graphics, and read no record. The fiducial requirement is added to the layout practice catalogue as a new rule-kind item with a published source that states the count, the catalogue holding no fiducial item before it.

  Lifecycle. The extract's lifecycle mapping is required on the entry of every part the design places. Its status is one of active, not recommended for new designs, end of life, obsolete, or no source publishes one, and its read_on is held to the extract's max_age_days. The rule fails a part whose status is end of life, obsolete or not recommended for new designs.

  Mounting holes. A mounting hole is a footprint whose pads are all drilled holes and which has at least one mark of a fixing, namely every hole non-plated, exclusion from the bill of materials, a library item name beginning MountingHole, or a single pad, so that a forgotten attribute on a plated mounting pad does not skip the check, and every non-plated hole. A fixing's extent is the larger of its pad and its courtyard. The check appends, after the signed Mains rule, rules holding the hole clearance to the Mains class at no less than the larger of the signed clearance and the signed creepage on every layer, and measures from the layout file the distance from each mounting-hole footprint's pad copper and courtyard to every pad, track, via and pour fill of a Mains net on every layer, held to the same distance, because KiCad measures a courtyard only against another courtyard. It fails a plated hole on a non-Mains net inside the signed distance. The signed figure governs whether or not the fixing is bonded to protective earth.

rationale: |+
  Context: nine rules extend the pre-order check, and each needs a form for the figure it compares, a class it applies to, or a reading of a phrase the criteria leave open. The delivered decisions fix the separation and pin-limit record shapes but leave open where the manufacturer's limits, the sensing clearance, the ground-return ratio, a part's derating class and the fixing's extent are declared. Settled once here, ahead of the rules, so each rule's solution builds to one reading and the records every board's design task authors have one form.

  Trade-offs: a machine-readable manufacturer record beside the prose entry lets the minimums be compared, and holding each figure to its cited entry keeps the two from drifting; comparing against the prose, as the reviewer does now, passes what a reader misses. Deriving the layer count from the layer stack removes a declaration that could disagree with the board; the copper weight cannot be derived, since no layout file the manufacturer receives carries it, so it is declared where the order is decided and the board is held to the limits of that weight. A weight above the manufacturer's standard is a priced option that raises the board's cost many times over, so the standard weight is the starting point and the declared source states why a heavier one was chosen. Declaring sensing and noisy classes in a record, with an explicit none, follows the mains declaration, so silence never reads as compliance; inferring classes from net names was rejected because an unrecognised name would read as safe. Enforcing sensing clearance by appended rules reuses the separation mechanism and its guarantee that nothing the design writes overrides it. A pair without the Mains class sits ahead of the signed rule. A pair involving it sits after, on the clearance constraint alone at the larger of the two figures, because the signed rule matches every Mains pair and, being last, would otherwise hide a sensing figure above the signed one, while a rule after it at the larger figure can only tighten. Stating the ground ratio as signal pins per return makes a smaller number stricter and lets the test be exact on whole pins, where a ratio of signal to ground read as a minimum ran the wrong way. Requiring a class on a covered position, not inferring it from the part, keeps the derating check from guessing. Reading a part's kind from the exact leading letters of its reference designator, not from a prefix, keeps a light-emitting diode, a fiducial or a display from reading as an inductor, a fuse or a ferrite, and not from its policy class, follows the connector reading and keeps one free-text class name from deciding whether a part needs a pin-limit entry or joins nets; a class such as mains-rated part spans a fuse that joins nets and capacitors that do not. Taking the mains domain's lowest voltage as minus its peak, and every other domain's as zero, lets the below-minimum test be worked out with no further record key; it is kept out of the working voltage, where it would read two nets of the one mains source as twice the peak apart, and a part across two nets of the mains domain is instead held to the domain's peak. Narrowing the pin-limit omission rule to semiconductors and integrated circuits reconciles the earlier text with the proof designs, whose records list only such parts, and loses nothing because a passive has no absolute maximum a net can breach beyond its rating, which the derating rule covers. Requiring lifecycle on every placed part makes the end-of-life rule decide every part and not only those the extract happens to annotate.

  Reversibility: moderate. Key names and the closed lifecycle vocabulary are read by the rules and written by every board's records, so renaming one is a sweep across both, caught by the check failing on the old form. The figures a record holds are the board design task's to choose and cite; nothing here fixes one.

  Consequences: the board design records decision is amended for the new records, the class key, the required lifecycle and the narrowed omission rule. Each rule's solution extends the record reader to accept the records and keys it introduces and still fail an undefined one, and proves the rule with a seeded fault; every tracked proof design gains the synthetic records it needs so it passes. The sensing practice keeps its judgement item for what a rule cannot decide and gains an enforced rule-kind item for the declared clearance in the layout practice catalogue, and the design method names that item's kind, a clearance between net classes that the board declares in its board rules record and the pre-order check writes into KiCad's own rule check, as a fifth form of rule beside the four it had, so that its statements of the forms stay true; a fiducial item, which the catalogue did not hold, is added to it as enforced.

  Requiring an entry for every connected pin, and refusing an entry that stands for the rest, closes the case where a record lists a part's supply pin and the pins its author thought of while an unlisted pin on a net that can exceed its absolute maximum passes unjudged; the cost is a longer record, which the record's author writes once from the part's datasheet. A part carrying a rating the rule reads cannot opt out by naming none, since that would let a design pass by exempting what the rule exists to judge; a listed pin the part lacks fails, as a record naming a net the design lacks does. A reader of these records refuses an entry that is ambiguous or matches nothing in the design (a repeated name, number or rail, a rail that is no net, a rating shaped like a voltage that the rule cannot read), since each lets a producer pass a design by how an entry is spelled or repeated. A pin limited only by current is listed, not exempted, since an exemption the check cannot verify would let any pin be called current-limited.

options_considered:
  - option: Declare each rule's inputs in records beside the design and fail on omission
    reason_rejected: ""
  - option: Compare against the prose manufacturer entry and reviewer judgement
    reason_rejected: passes what a reader misses and cannot be run the same way every time
  - option: Infer sensing, noisy and part classes from net and part names
    reason_rejected: an unrecognised name would read as safe
  - option: Keep the pin-limit record required for every part
    reason_rejected: contradicts the proof designs and adds nothing the derating rule does not already check
chosen: Declare each rule's inputs in records beside the design and fail on omission
