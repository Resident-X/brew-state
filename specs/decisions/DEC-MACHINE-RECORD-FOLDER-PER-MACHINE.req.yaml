id: DEC-MACHINE-RECORD-FOLDER-PER-MACHINE
type: decision
title: A machine's record is one folder named for that machine, and its derived views lose to their sources
status: active
version: 1
text: |
  The record of a machine lives in a folder named for that machine. For the machine this design was
  built against, that folder is docs/sunbeam-em7000, and it holds the machine's declared configuration,
  the wiring record, the channel enumeration, and the sheets derived from them for sourcing a
  controller. Material that holds for any machine of this shape stays outside it.

  The name is the point. A folder called docs, holding one machine's connector allocations beside
  analyses that hold generally, tells a reader nothing about which is which; they have to read the
  content to find out, and an adopter who does not know the difference is exactly the reader least able
  to work it out. A folder carrying a machine's name says what it is before anything inside it is read,
  and says what an adopter fitting a different machine has to replace: this folder, and a folder of
  their own beside it.

  Within the record, documents are not equal and the record says so. The enumeration of channels and the
  wiring record are sources; the bill of materials and the electrical requirements sheet are derived
  views of them, cut for sourcing rather than for describing the machine. Where a derived view disagrees
  with its source, the source governs, and the derived view is corrected rather than the disagreement
  being left for a reader to arbitrate.

  What this does not settle is what the record contains or how thoroughly. That follows the machine and
  the work, and it changes as tracing continues. This decision fixes where the material sits and which
  part of it wins an argument, so that both stay answerable without a requirement being amended.
rationale: |
  Context: The project's documentation directory had accumulated two unlike kinds of material with
  nothing but the reading to tell them apart. One kind describes the single machine this design was
  built against: its declared configuration, its connector and harness allocations, the channels it
  senses and drives, and the controller demand derived from them. The other holds for any machine of
  this shape and is generated by tooling from the emulation, each file headed as regenerated rather than
  edited. A reader who did not already know which was which had to open a file to find out. The
  obligation on open-source maintainability asks that assumptions specific to this machine be
  identifiable as such, and identifiable meant, in practice, identifiable to someone who already knew.

  Trade-offs: Naming the folder for the machine states the boundary structurally rather than in prose
  that has to be found and believed, and gives an adopter a unit to substitute. It costs every existing
  reference to those files an edit, and it puts a machine's name into paths that will look odd if this
  project ever holds only one machine forever. Leaving the directory flat costs nothing today and keeps
  the boundary in prose, which is where it had already failed to hold. Splitting by document kind --
  records in one place, generated analyses in another -- separates the same files along a different
  axis, and it is the wrong axis for the reader who matters: an adopter does not want the records, they
  want *this machine's* records, and a kind-split leaves them reading content to find the boundary
  again. Naming folders for machines also composes, where a kind-split does not: a second machine adds a
  folder rather than forcing every kind-folder to grow a machine dimension.

  Reversibility: Cheap and mechanical. The boundary is a directory and a set of references; moving the
  files back, or renaming the folder, is a rename and a sweep, and the engine's validation catches a
  reference left behind. Nothing in the requirement layer names the folder, so a later reorganisation
  changes this decision and the record, and touches no requirement. The precedence rule is the part with
  weight, because documents will have been written on the strength of it -- but reversing it would mean
  deciding a derived view outranks its source, which is not a reorganisation.

  Consequences: An adopter fitting a different machine gets a unit to replace rather than an audit to
  perform, which is what the maintainability obligation was asking for and was not getting. The
  requirement that the record be separable becomes checkable by looking rather than by reading. Every
  document derived from the record inherits a stated loser in an argument, so a disagreement between the
  bill of materials and the enumeration is a defect in the bill of materials rather than an open
  question. And the generated analyses stay where they are, which keeps the tooling that writes them
  unchanged and marks them, by their position, as the material that is not about this machine in
  particular.
options_considered:
  - option: One folder per machine, named for the machine
    reason_rejected: ""
  - option: A flat documentation directory mixing machine records with general analyses
    reason_rejected: The boundary stays in prose that a reader has to find and believe, which is the state that let machine-specific material read as general
  - option: A split by document kind, records apart from generated analyses
    reason_rejected: 'Separates the same files on the wrong axis: an adopter wants this machine''s records rather than records in general, and a kind-split does not compose when a second machine arrives'
chosen: One folder per machine, named for the machine
