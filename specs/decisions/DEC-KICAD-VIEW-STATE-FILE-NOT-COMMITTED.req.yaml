id: DEC-KICAD-VIEW-STATE-FILE-NOT-COMMITTED
type: decision
category: tactical
title: A KiCad per-user view-state file is deleted before a board is committed
status: active
version: 1
decided_by: claude-orchestrator
risk_level: low
text: |
  A KiCad editor writes a per-user view-state file, `<board>.kicad_prl`, beside a board whenever the board is opened or saved. It holds only the editor's own view settings (layer opacity, active layer, hidden nets), none of which any check reads, and it changes with each editor session. The board design method already tells the designer to delete it before committing. A board design or proof design in the repository therefore carries no such file, and a change that adds one is corrected by deleting it, not by ignoring it.
rationale: |
  The file carries nothing a design record, a check or a reviewer reads, so keeping it commits per-user view state and makes a diff on every editor session. Deleting it before the commit is the rule the board design method already states, and it needs no repository-wide ignore. An ignore rule would let the editor's file sit beside a design unseen by the person committing, and would state a repository rule for one editor's artefact where the method states it for the designer.
options_considered:
  - option: Delete the file before committing
    reason_rejected: ""
  - option: Keep it committed
    reason_rejected: it holds per-user view settings that change with every editor session, so each session would put a spurious diff in the design
  - option: Exclude it from git with an ignore rule
    reason_rejected: it states a repository-wide rule for one editor's artefact where the board design method already states the rule for the designer, and it would hide the editor's file from the person committing
chosen: Delete the file before committing
