id: DEC-MAINTENANCE-CONTINUOUS-LANE
type: decision
title: The maintenance epic is a continuous business-as-usual lane whose defects attach as child work rather than as a criterion per shortfall
status: active
version: 1
decided_by: david
text: |
  brew-state's maintenance epic began as a narrow remediation home: every confirmed shortfall in already-closed work became its own criterion, naming the closed criterion whose intent went unmet, with a solution wired beneath it. Adopting the engine's standing-lane model instead makes the epic a continuous business-as-usual lane. It carries the maintenance role marker and the continuous closure attribute the engine already honours, holds a single criterion that composes by cascade over its children, and takes each defect or maintenance item as an ordinary child that traces to the requirement criterion whose behaviour it restores. The lane is never itself sealed and does not surface when the delivery tree is walked from the roadmap; it is reached by name.
rationale: |
  Context: The epic's first model made every confirmed shortfall in sealed work its own criterion, each naming the closed criterion it missed, with a solution beneath. In practice the criterion list grew by one entry for every fix, a criterion — a specification of done — was being used as a work-tracking slot, and the "must name a closed criterion" gate excluded ordinary business-as-usual work (bugs, cleanup, patching) that corrects live or emergent behaviour without remediating a sealed deliverable. The engine already supports a standing-lane model — attributes.closure: continuous excludes a lane from the seal surfaces, attributes.role: maintenance classifies it for query, and a cascade criterion rolls child state up — so the question was whether to adopt it here.

  Trade-offs: The continuous-lane model keeps a single criterion forever and attaches each item as an ordinary child tracing to the requirement it restores, so the criterion count stops tracking the fix count and the lane covers all emergent work rather than only sealed-shortfall remediation. Its cost is a looser admission gate: an item no longer has to name a closed criterion, so the discipline that kept the lane from becoming a dumping ground moves onto each child's trace to the requirement it restores. Keeping the criterion-per-shortfall model preserved that explicit gate but conflated spec with work item and had no room for general maintenance. Running two lanes — the narrow remediation epic plus a separate business-as-usual lane — preserved the gate for sealed-work shortfalls but duplicates the standing-lane machinery and splits emergent work across two homes over a distinction (was the target sealed?) that the per-child requirement trace already records.

  Reversibility: Additive in both directions. Re-tightening the gate later means adding a criterion or obligation that requires each maintenance child to name the specific criterion it restores — no rebuild. The change supersedes the epic's prior rationale and this project's CLAUDE.md maintenance paragraph, which are prose rather than structure. The one non-trivial cost already paid is collapsing the four existing per-shortfall criteria into one, which re-anchors their delivered solutions onto the single cascade criterion.

  Consequences: DEL-MAINTENANCE carries attributes.closure: continuous and attributes.role: maintenance, is never itself sealed, and is excluded from the seal surfaces; its state is only the rolled-up state of its children. Its single criterion closes by cascade. Emergent and corrective work — defects, cleanup, patching, and remediation of sealed shortfalls alike — attaches as a child task or solution that traces to the requirement criterion it restores. The lane stays outside the roadmap's phases and is reached by name. Admission discipline is henceforth carried by that per-child requirement trace rather than by a per-shortfall criterion.
options_considered:
  - option: A single continuous lane with one cascade criterion, each defect and maintenance item attached as a child that traces to the requirement it restores
    reason_rejected: ""
  - option: A criterion per confirmed shortfall, each naming the closed criterion whose intent went unmet, with a solution wired beneath
    reason_rejected: Grows the criterion list by one for every fix, uses a criterion (a specification of done) as a work-tracking slot, and excludes general maintenance that corrects live or emergent behaviour rather than remediating a sealed criterion.
  - option: Two lanes — a narrow remediation epic for sealed-work shortfalls plus a separate business-as-usual lane
    reason_rejected: Duplicates the standing-lane machinery and splits emergent work across two homes over a distinction the per-child requirement trace already records.
chosen: A single continuous lane with one cascade criterion, each defect and maintenance item attached as a child that traces to the requirement it restores
