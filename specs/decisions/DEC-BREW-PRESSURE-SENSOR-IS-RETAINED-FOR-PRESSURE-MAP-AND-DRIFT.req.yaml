id: DEC-BREW-PRESSURE-SENSOR-IS-RETAINED-FOR-PRESSURE-MAP-AND-DRIFT
type: decision
title: The brew pressure sensor is retained for the pressure map and the drift watch, as the complement of the flow meter rather than a redundant copy
status: active
version: 1
rationale: |
  Context: Once a safety-only relief sits above the working range, the brew pressure sensor is no longer needed to find the cap, and the question is whether it stays. Flow and pressure are complementary rather than redundant: with pressure and the flow meter together the resistance of the puck is observable, while pressure alone cannot give volume per stroke and flow alone cannot give the pressure the coffee saw.

  Trade-offs: Keeping the sensor gives the operator a pressure map of the shot, gives the control headroom to watch pressure under the relief, and lets the pump's pressure and flow map be watched for drift. Removing it saves a part and a channel but leaves the controller commanding pressure it cannot see, and leaves the puck resistance and the pump's drift unobservable. It is kept for those jobs and not because it duplicates another sensor; a justification by redundancy would fail, because nothing else reads pressure.

  Reversibility: Reversible: the tap is a tee on the cold side and the sensor is a small part. Dropping it later means giving up the pressure map and the drift watch together.

  Consequences: The brew pressure measurement requirement is met by this sensor when it is fitted and read, and stays open until then. The tap sits on the cold side between the relief and the block so the relief's operation is visible at the sensor. The sensor's range has to cover the relief's setting.
options_considered:
  - option: Retain the brew pressure sensor as the complement of the flow meter
    reason_rejected: ""
  - option: Remove it once a safety relief sits above the working range
    reason_rejected: The controller would command pressure it cannot see, and puck resistance and pump drift would be unobservable
  - option: Justify it as redundant with the flow meter
    reason_rejected: They measure different quantities, so redundancy is false and the justification would fail on inspection
chosen: Retain the brew pressure sensor as the complement of the flow meter
