id: DEC-INLET-CHAIN-RATED-ABOVE-ITS-FUSE
type: decision
category: tactical
title: The mains entry chain is rated above its fuse, and the valve and pump branches are fused
status: active
version: 5
text: |
  The machine's mains entry chain, from the retained fixed mains lead through the entry fuse and varistor on the main board and the internal trunk to the load branches, is rated above the 10 A slow-blow fuse that protects it, and the valve branches and each pump branch carry a fuse of their own.

  - No inlet or inlet filter is fitted. The machine keeps its existing fixed mains lead, and the 10 A slow-blow fuse and a varistor are carried on the main board where the lead's conductors land, at tabs 2 and 3, the varistor hard against the fuse and downstream of it. Whether the entry also needs emission suppression, now that no inlet filter is fitted, is decided by the main board's design against the emission criteria, and if it is needed it is carried on the main board.
  - The internal trunk downstream of the fuse is at least 1.5 mm², rated well above 10 A, in place of the 1.0 mm² conductor rated exactly 10 A.
  - The entry fuse stays at 10 A slow-blow. It is the device that interrupts a fault anywhere downstream of the entry, and it now protects conductors rated above it rather than equal to it.
  - The valve branches share one subminiature slow-blow fuse on their common switched feed, sized to the coils' inrush rather than to the flex. The pumps were found by inspection to carry no branch fuse along the loom as seen at the board end (the far ends of their leads were not recorded), so each pump branch gains a subminiature slow-blow fuse of its own, sized to that pump's running current and its start surge, and the valves gain their shared one. The two pumps serve different water paths, so a fault in one does not need to stop the other, which is why they do not share a fuse as the valves do. The two heater branches carry no fuse of their own: the 10 A entry fuse is the device that protects them, so their conductors, including any board copper carrying their current, are rated for that fuse rather than for the element's own draw.

  Upstream of the entry fuse, the retained fixed mains lead is protected only by the building's circuit breaker. For this machine that breaker is declared as up to 20 A: an AU socket-outlet circuit is commonly protected at 16 A or 20 A, and the higher figure is the conservative one to design against.
rationale: |
  Context: Every element of the chain was rated 10 A: the inlet fuse, the 1.0 mm² trunk and the inlet filter of the earlier design. The machine's own worst-case draw is 10.5 A, at the top of the declared supply span (253 V); at 240 V it is 9.95 A. The filter is rated 10 A only up to 50 °C ambient, and the enclosure's estimated surroundings are 45-60 °C, unmeasured. A slow-blow fuse carries one and a half times its rating for half an hour or more before it opens, so between 10 A and roughly 15 A the fuse does not protect anything quickly. Sustained draw in that band is kept out only by the controller's supply budget (REQ-POWER-BUDGET-001), which plans total commanded draw within the 10 A rating of the socket outlet it is plugged into. That left the conductors and the filter loaded to their rating in normal running, below it once derated for enclosure temperature, and with no margin for the fuse's overload band. The valve branches ran on 0.75 mm² flex with no branch fuse. That flex is reportedly rated 7.5 A in AU (unverified against the standard), in which case a valve-branch fault between 7.5 A and the 10 A fuse, or the upstream breaker, was cleared by nothing. No fuse was seen on the pump branches along the loom at the board end, on flex of unrecorded rating (the far ends of their leads were not recorded), so they stood in the same position, and an earlier reading that the pumps already carried branch fuses was wrong.

  Trade-offs: Upsizing the trunk is a small parts change, and dropping the inlet filter removes the one element that was rated at 10 A only up to 50 °C. The machine as found has a fixed mains lead and no inlet; splicing an appliance inlet into that lead would add a joint and a part to a harness that already ends on the board, whereas the original board carried its own protection at its entry, so the same function on the new board costs board area and changes no harness. That makes the fuse the weakest rated element downstream of the entry, which is what a fuse protecting wiring needs. It also lets the supply budget keep the full 10 A of the outlet, so concurrent brew and steam stays available wherever the budget allows. Keeping the 10 A parts and lowering the budget to about 8.5-9 A would make the chain run below its rating, but it would give up concurrency at the top of the supply span and tie the machine's performance to an enclosure temperature nobody has measured. For the valve branches, a fuse costs about one 8.5 mm part and makes the flex's rating irrelevant. Upsizing the flex to the trunk's cross-section would put far more copper on a load of a few tens of milliamps and still leave the branch protected only at 10 A. One fuse shared by both valves is enough. A per-valve fuse would isolate a fault to one valve, but both valves serve the same water path, and a fault in either already stops the machine from brewing. The pump branches take one fuse each, two more parts of the same size class: the pumps draw a fraction of an amp, so each fuse is rated far below the flex and the valves' reasoning applies unchanged, but they serve different water paths, and a fault in one pump should not stop the other.

  Reversibility: Cheap before the boards and harness are built, because only parts choices change. After build, reversing it means re-terminating the trunk, and changing the entry fuse or varistor means a respin of the main board that carries them. The fixed mains lead is untouched, so the cord set does not change.

  Consequences: The figures record for the controller boards states the entry fuse as the device that interrupts a fault downstream of the entry, and the upstream breaker, declared as up to 20 A, as the device for the fixed lead ahead of it. The working parts list in the controller design folder drops its inlet filter and changes its trunk conductor, valve-branch fusing and pump-branch fusing to match, and the entry fuse and varistor are board parts. Its open item on the inlet chain's rating margin is closed by this decision. Board copper carrying the valve branches' fused feed, and each pump branch's, is sized for that branch's fuse, not for the trunk.
options_considered:
  - option: Keep the existing fixed mains lead, carry the entry fuse and varistor on the main board, upsize the trunk above the fuse, and fuse the valve branches together and each pump branch separately
    reason_rejected: ""
  - option: Upsize the inlet filter and trunk above the 10 A inlet fuse, fitting an appliance inlet, and fuse the valve branches together and each pump branch separately
    reason_rejected: The machine as found has a fixed mains lead and no inlet, so this splices a joint and a part into the retained lead, and the original board already carried its own entry protection on the board
  - option: Keep the 10 A filter and trunk and derate the supply budget
    reason_rejected: Gives up concurrent brew and steam at the top of the supply span and ties the machine's performance to an unmeasured enclosure temperature
  - option: Upsize the trunk only
    reason_rejected: Leaves the fuse and conductors rated alike, so the fuse protects nothing quickly between its rating and the overload band
  - option: Upsize the valve-branch flex to the trunk's cross-section instead of fusing it
    reason_rejected: Puts far more copper on a load of a few tens of milliamps and still leaves the branch protected only at 10 A
  - option: Fuse each valve branch separately
    reason_rejected: Both valves serve one water path, so a fault in either already stops brewing and one shared fuse is enough
chosen: Keep the existing fixed mains lead, carry the entry fuse and varistor on the main board, upsize the trunk above the fuse, and fuse the valve branches together and each pump branch separately
