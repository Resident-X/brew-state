id: DEC-INLET-CHAIN-RATED-ABOVE-ITS-FUSE
type: decision
category: tactical
title: The inlet chain is rated above its fuse, and the valve branches are fused
status: active
version: 1
text: |
  The machine's mains inlet chain, from the inlet filter through the internal trunk to the load branches, is rated above the 10 A slow-blow fuse that protects it, and the valve branches carry a fuse of their own.

  - The inlet filter is rated 15 A at 50 °C, the next rating up in the same filter family, in place of the 10 A part.
  - The internal trunk downstream of the fuse is at least 1.5 mm², rated well above 10 A, in place of the 1.0 mm² conductor rated exactly 10 A.
  - The inlet fuse stays at 10 A slow-blow. It is the device that interrupts a fault anywhere downstream of the inlet, and it now protects conductors rated above it rather than equal to it.
  - The valve branches share one subminiature slow-blow fuse on their common switched feed, sized to the coils' inrush rather than to the flex. The pumps keep their existing branch fuses and the valves gain this one. The two heater branches carry no fuse of their own: the 10 A inlet fuse is the device that protects them, so their conductors, including any board copper carrying their current, are rated for that fuse rather than for the element's own draw.

  Upstream of the inlet fuse, the supply cord and the inlet itself are protected only by the building's circuit breaker. For this machine that breaker is declared as up to 20 A: an AU socket-outlet circuit is commonly protected at 16 A or 20 A, and the higher figure is the conservative one to design against.
rationale: |
  Context: Every element of the inlet chain was rated 10 A: the inlet fuse, the 1.0 mm² trunk and the inlet filter. The machine's own worst-case draw is 10.5 A, at the top of the declared supply span (253 V); at 240 V it is 9.95 A. The filter is rated 10 A only up to 50 °C ambient, and the enclosure's estimated surroundings are 45-60 °C, unmeasured. A slow-blow fuse carries one and a half times its rating for half an hour or more before it opens, so between 10 A and roughly 15 A the fuse does not protect anything quickly. Sustained draw in that band is kept out only by the controller's supply budget (REQ-POWER-BUDGET-001), which plans total commanded draw within the 10 A rating of the socket outlet it is plugged into. That left the conductors and the filter loaded to their rating in normal running, below it once derated for enclosure temperature, and with no margin for the fuse's overload band. The valve branches ran on 0.75 mm² flex with no branch fuse. That flex is reportedly rated 7.5 A in AU (unverified against the standard), in which case a valve-branch fault between 7.5 A and the 10 A fuse, or the upstream breaker, was cleared by nothing.

  Trade-offs: Upsizing the filter and trunk is a small parts change. The 15 A filter is the same family, rated at the same ambient. It makes the fuse the weakest rated element downstream of the inlet, which is what a fuse protecting wiring needs. It also lets the supply budget keep the full 10 A of the outlet, so concurrent brew and steam stays available wherever the budget allows. Keeping the 10 A parts and lowering the budget to about 8.5-9 A would make the chain run below its rating, but it would give up concurrency at the top of the supply span and tie the machine's performance to an enclosure temperature nobody has measured. Upsizing only the trunk leaves the filter as the limit above 50 °C. For the valve branches, a fuse costs about one 8.5 mm part and makes the flex's rating irrelevant. Upsizing the flex to the trunk's cross-section would put far more copper on a load of a few tens of milliamps and still leave the branch protected only at 10 A. One fuse shared by both valves is enough. A per-valve fuse would isolate a fault to one valve, but both valves serve the same water path, and a fault in either already stops the machine from brewing.

  Reversibility: Cheap before the boards and harness are built, because only parts choices change. After build, reversing it means re-terminating the trunk and changing the filter, and nothing structural depends on the larger parts except the enclosure fitting the 15 A filter's body. That fit has to be confirmed when the enclosure layout is designed. So does the 15 A variant's appliance coupler: an IEC 60320 C14 inlet is rated 10 A under IEC, and a higher rating printed for the filter may be a UL figure. If the 15 A part changes the coupler, the cord set changes with it. If it keeps a 10 A coupler, the filter's own element still gains the thermal margin this decision is for.

  Consequences: The figures record for the controller boards states the inlet fuse as the device that interrupts a fault downstream of the inlet, and the upstream breaker, declared as up to 20 A, as the device for the cord and inlet ahead of it. The working parts list in the controller design folder changes its inlet filter, trunk conductor and valve-branch fusing to match. Its open item on the inlet chain's rating margin is closed by this decision. Board copper carrying the valve branches' fused feed is sized for that fuse, not for the trunk.
options_considered:
  - option: Upsize the inlet filter and trunk above the 10 A inlet fuse, and fuse the valve branches together
    reason_rejected: ""
  - option: Keep the 10 A filter and trunk and derate the supply budget
    reason_rejected: gives up concurrent brew and steam at the top of the supply span and ties performance to an unmeasured enclosure temperature
  - option: Upsize the trunk only
    reason_rejected: the 10 A filter stays the limiting element and is derated below 10 A above 50 °C ambient
  - option: Upsize the valve-branch flex to the trunk's cross-section instead of fusing it
    reason_rejected: far more copper for a load of tens of milliamps, and the branch is still protected only at 10 A
  - option: Fuse each valve branch separately
    reason_rejected: one more part to isolate a fault in a single valve, when a fault in either valve already stops brewing
chosen: Upsize the inlet filter and trunk above the 10 A inlet fuse, and fuse the valve branches together
