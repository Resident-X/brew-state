id: DEC-SCHEMATIC-REVIEW-FINDINGS-CARRIED-BY-OWNER
type: decision
category: strategic
title: The schematic review's open findings are carried by the owner to named later steps, each on a stated ground
status: active
version: 1
decided_by: david
text: |
  On 2026-10-29 the owner, david, closes the main board's schematic review by decision and not by a clean round. Each finding that round 5 of the review left open, and each that it found closeable but unwritten, is carried by name to a later step that the graph requires, on a stated ground, with the condition under which it returns to the schematic. The review record stays in the repository and states every finding in full, so none is lost. A schematic change made during layout is an amendment to the schematic leaf and is re-reviewed there. This decision does not stand in for any bring-up or layout step it names, and it waives no criterion of those steps.
rationale: |
  Context: the schematic review ran five rounds. Each cost about 3 USD and 12 minutes and found 25 to 30 findings open, because the reviewer's bar moved between rounds and many findings close only on maker figures that no search can produce. The review closes a finding only by a change, or by a reason written as met, not applicable or overridden by a requirement or decision, so a finding that waits on a later measurement, a later layout fact or an owner's act had no form in which to close. The owner, david, answered 'Close it' on 2026-10-29 to a proposal to close the review by the owner's decision and carry what is left by name to later steps. SOL-HW-MAIN-BOARD-SCHEMATIC-PROVEN.C1 is amended in the same change so that a recorded owner decision to carry a finding to a named later step is a way of closing it.

  Trade-offs: a further round would find a new set of findings of the same kind at the same cost and would not make a maker publish a figure. Amending the board design method's closing forms would change a method that has proofs to repeat, for one hobbyist board. Carrying the findings by name costs a schematic that is not clean on paper: each carried finding is a claim that a later step will settle it, and that claim is only as good as the step. Each finding below therefore names the step, and the step stays the place where the finding is settled.

  Findings carried (numbers are those of the Round 5 section of the review record). Destinations are criteria of the layout leaf (SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT, C4 suppression parts and tab separation, C5 inner-layer routing, C6 finished layout meeting the signed basis, C7 layout review, C8 pre-order check), criteria of DEL-HW-BRING-UP (C4 first connection of mains, C14 interlock drive measured, C15 every carried figure measured against its stated limit), SOL-HW-CONTROLLER-BOARDS-ORDERED-AND-RECEIVED (the catalogue stock and order-date reads), and the two maintenance solutions for the pre-order check's limits.

  5.1 The USB cable position lets a plug-in surge (D402 clamps at 10.3 V) reach more parts on +5V than the buffers: U201, U791, the HX711s, the relay coils, the sensor headers, the wall board and the gauge, and the acceptance in C11 names only the buffers. Ground: item (b) of DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER accepts the surge for bench use with mains off. Carried to the layout review (SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C7), which reads the clamp's placement and the parts on the net, and to DEL-HW-BRING-UP.C4, which keeps the cable position a mains-off state. Returns to the schematic if the cable position is to be used with mains connected, or if layout shows the clamp cannot sit at the connector.
  5.2 USB_DM and USB_DP: the clamp D401 passes 17 V at 5 A to pins limited to 6 V, and the controller's maker states no pulse withstand. Ground: item (f) of the same decision accepts the arrangement ST's application note recommends. Carried to SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C7, which reads the clamp as close to the receptacle as the note requires. Returns to the schematic if ST publishes a withstand below the residue.
  5.3 HX711 U630 and U631: published supply range 2.6 to 5.5 V, no absolute maximum, on a +5V rail that the module's over-voltage trip and the cable position take above 5.5 V. Ground: the maker publishes no figure. Carried to DEL-HW-BRING-UP.C15, with +5V read at the HX711 supply pins in those two states against 5.5 V. The decision DEC-UNPUBLISHED-MAKER-FIGURES-CARRIED-TO-BRING-UP excludes an absolute maximum that operation must stay inside, so this carry rests on this decision and not on that one. Returns to the schematic if a reading exceeds 5.5 V or the maker publishes a lower maximum.
  5.4 Valve relays K731 and K741 state 250 VAC maximum switching voltage against 253 V rms on the valve feed. Ground: item (c) of the residual-risk decision accepts it. Carried to SOL-HW-CONTROLLER-BOARDS-ORDERED-AND-RECEIVED, whose catalogue read at the order date looks for a relay at or above 253 V, and to SOL-PRE-ORDER-CHECK-DERATED-VOLTAGE-ACROSS-DERIVED-NETS for the rule's limits. Returns to the schematic if a catalogue part at or above 253 V is in stock at the order date.
  5.5 /POL_OUT drives U201 pin 2 from the 3.3 V domain with no stated unpowered tolerance and no series resistor. Ground: the maker's figure at VCC = 0 V is unpublished. Carried to DEL-HW-BRING-UP.C14, whose rest states include the controller unpowered. Returns to the schematic if the reading exceeds the pin's limit.
  5.6 Y402 states its shunt capacitance C0 as 1 pF typical only; start-up holds to 2.58 pF. Ground: unpublished maximum. Carried to DEL-HW-BRING-UP.C15, limit 2.58 pF. Returns to the schematic if a reading exceeds it.
  5.7 No bias, temperature and tolerance curves for the 40 ceramics that set a filter, a stability or a reference, including the VCAP pair C412 and C413. Ground: unpublished curves. Carried to DEL-HW-BRING-UP.C15, effective capacitance against each part's limit. Returns to the schematic if a reading falls outside its limit.
  5.8 Far-end output levels and currents of the four bus lines, the flow meter's output type and low level, the ZC_IN phototransistor's current and rise time, the indicator forward voltage for KEY1 to KEY5 and the off-board bus capacitance are in no record. Ground: they are the owner's bench readings and makers' figures. Carried to DEL-HW-BRING-UP.C15. Returns to the schematic if a reading breaks the stated limit.
  5.9 The HX711's sampling capacitor and source resistance are unstated for WT1_INA_N, WT1_INA_P, WT2_INA_N and WT2_INA_P (the STM32 and MAX31865 channels were closed in round 5). Ground: unpublished. Carried to DEL-HW-BRING-UP.C15. Returns to the schematic if the settled reading breaks its limit.
  5.10 The supply module's cold-start inrush has no maximum, duration or input capacitance, the tab rating is absent and RT301 stays not fitted. Ground: item (d) of the residual-risk decision, bring-up decides whether RT301 is fitted. Carried to DEL-HW-BRING-UP.C15, against the entry fuse's I2t of 500 A2s, and to DEL-HW-BRING-UP.C4, whose first connection is current-limited. Returns to the schematic if the reading exceeds the limit.
  5.11 81.3 uF behind F401 in the cable position, against the 10 uF a USB port allows. Ground: item (b), bench use. Carried to DEL-HW-BRING-UP.C15, the plug-in charge read against the port's limit. Returns to the schematic if the reading exceeds it.
  5.12 The sensors' 3.3 V feeds behind F520 to F524 have no declared sensor capacitance, and the unfitted snubber positions charge through R706 and R716 at 3.6 A with no pulse rating for the 2512 resistor. Ground: unpublished. Carried to DEL-HW-BRING-UP.C15. Returns to the schematic if a reading breaks its limit.
  5.13 U402's lowest threshold of 2.87 V is under the AMC131M02's 3.0 V and the 2.97 V parts, with no load-step dip arithmetic against 40 mV of hysteresis, and +5V has no supervisor. Ground: the dip is unmeasured. Carried to DEL-HW-BRING-UP.C15, the rail dip read at the load step. Returns to the schematic if the dip crosses a threshold.
  5.14 C302 and C792 have no reverse-voltage rating in the datasheets read. Ground: unpublished. Carried to DEL-HW-BRING-UP.C15, the reverse voltage read in each state. Returns to the schematic if a reading exceeds the limit.
  5.15 U201 oscillating, a Z201 or Z202 short above 1.10 H, and POL_COIL_LO to ground. Ground: item (a) of the residual-risk decision, as extended, bounded by the series overheat thermostats and the one-shot cutoff fitted before mains. Carried to DEL-HW-BRING-UP.C4 and, for the drive's behaviour, DEL-HW-BRING-UP.C14. Returns to the schematic if the cutoff is not fitted before mains or the thermostats are found to reset.
  5.16 Creepage and clearance: the basis keeps 10.0 mm, 3.0 mm and 4.0 kV while U601 (8.0 mm), K201, K731 and K741 (over 8 mm) and U701 and U711 (7 mm) are below, and several clearances and impulse figures are unstated. Ground: item (e) of the residual-risk decision. Carried to SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C6, where the finished layout is held to the signed basis and the owner re-declares the basis for any barrier it does not list. Returns to the schematic if a maker figure read later is below those accepted.
  5.17 A mains surge clamped at 0.80 to 0.89 kV against the pump triacs' and opto-triacs' 600 V. Ground: item (g) of the residual-risk decision, bounded by the entry fuse, the branch fuses and the series safety relay. Carried to SOL-HW-CONTROLLER-BOARDS-ORDERED-AND-RECEIVED, whose order-date read looks for an in-stock 800 V pair, and to DEL-HW-BRING-UP.C4. Returns to the schematic if such a pair is in stock at similar price or a pump triac fails in service.
  5.18 ESD: 'does not apply: inside the enclosure' is not borne out for service reach, and KEY1 to KEY5, KNOB_HOT and KNOB_STEAM have no clamp. Ground: the owner's service level is not yet declared. Carried to SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C7. Returns to the schematic when the owner declares a service level that needs a clamp.
  5.19 Touch current: U301's estimated 0.34 mA is compared with the Class I portable row of 0.75 mA, and no source in hand shows the row for a current from an unearthed accessible part. Ground: no residual-risk item covers touch current; item (e) rests on the enclosure being sealed. Carried to DEL-HW-BRING-UP.C4, whose isolation test and current-limited first connection read the current. Returns to the schematic if a reading exceeds the limit the owner states for that route.
  5.20 Emissions: only C101 filters the entry and no emission limit is named. Ground: the limit rows are not held and no requirement states a target. Carried to SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C4, which places the line-to-line capacitor and choke if the judgements find them needed. Returns to the schematic when a limit is published or stated.
  5.21 T701 and T711 re-applied voltage is 716 V undamped against 600 V. Ground: closeable by DEL-HW-BRING-UP.C15, TP702 and TP712 measured against 600 V with the snubbers fitted if exceeded. Carried to DEL-HW-BRING-UP.C15. Returns to the schematic if the reading exceeds 600 V with the snubbers fitted.
  5.22 The emission limit and its rows are absent for all 14 parts the stage-by-stage losses cover. Ground: as 5.20. Carried to SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C4. Returns to the schematic as 5.20.
  5.23 Parts without a graded margin: K731 and K741 (as 5.4); T701 at 122.8 degC against 110 degC; the D401 and D402 stand-off; the pulse ratings of R704, R705, R714, R715, R706 and R716; the drive level of Y401 and Y402; the current rating of the tabs and JP101. Ground: unpublished figures, and the derating rule's missing exception mechanism and its misreading of divider voltage. Carried as follows: K731 and K741 as 5.4; T701 and the tabs to SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C7, which reads the copper that sets them; the stand-off to SOL-PRE-ORDER-CHECK-DERATED-VOLTAGE-ACROSS-DERIVED-NETS; the pulse ratings and drive levels to DEL-HW-BRING-UP.C15; the missing catalogue number to SOL-PRE-ORDER-CHECK-PARTS-WITHOUT-CATALOGUE-NUMBER. Returns to the schematic if layout shows a part cannot hold or a reading breaks its limit.
  5.24 The entry fuse F101 and the branch fuses F701, F711 and F731 are rated 250 VAC against 253 V rms (101 %). Ground: item (c2) of the residual-risk decision. Carried to SOL-HW-CONTROLLER-BOARDS-ORDERED-AND-RECEIVED, whose order-date read looks for fuses at or above 253 V, and to SOL-PRE-ORDER-CHECK-DERATED-VOLTAGE-ACROSS-DERIVED-NETS for the rule. Returns to the schematic if such fuses are in stock.
  5.25 to 5.28 Cosmetic drawing defects: sheet symbols past the page border, overprinting pin labels, nine hierarchical labels wired to nothing, pins joined by labels where a short wire would do, and overlapping text. Ground: they affect no net. Carried to SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C7, where the sheets are rendered again; a drawing change made there is an amendment to the schematic leaf, re-reviewed there.
  5.29 The carried figures are in no board record with their measurement and limit, except the pump triac turn-off voltage. Ground: the records are authored by the schematic leaf's design-records work and are not a schematic change. Carried to DEL-HW-BRING-UP.C15, which measures only a figure a record carries, and to SOL-HW-CONTROLLER-BOARDS-ORDERED-AND-RECEIVED, since the decision on unpublished figures states each limit before the board is ordered.

  The findings that rest on safety (5.15, 5.16, 5.17, 5.19 and 5.24) are carried on the owner's acceptances recorded in DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER, items (a), (e), (g) and (c2), and on the bring-up and layout steps named above. The exception is 5.19, for which that decision holds no item. No part of this decision stands in for those acceptances or for those steps, and neither does it waive them: the pre-order check still reports the 250 V positions, so the criterion that the check passes with no judgement weighed against a failure (SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C8) is met only by a part change or a later requirement.

  Reversibility: the decision is withdrawn by supersession before the boards are ordered, and the review record, which is unchanged, supports a further round. After ordering, a carried finding that proves real is a board revision.

  Consequences: round 5 is the last round of the review. The schematic leaf closes its criterion C1 on this decision and not on a clean round. Each destination step owes the finding named for it, and a schematic change that step finds necessary is an amendment to the schematic leaf, re-reviewed there. The known limits of the pre-order check (the derating rule has no exception mechanism and misreads divider voltage, and the parts rule does not accept 'none' as a catalogue number) are recorded as limits and not as findings, and are the maintenance solutions named above.
options_considered:
  - option: Carry each open finding by name to a later step on the owner's recorded decision
    reason_rejected: ""
  - option: Keep running review rounds until a round is clean
    reason_rejected: Five rounds at about 3 USD and 12 minutes each left 25 to 30 findings open every time, the reviewer's bar shifted between rounds, and many findings wait on maker figures that no search can produce
  - option: Amend the board design method's closing forms to admit a carried finding
    reason_rejected: It changes a method that has proofs to repeat, for one hobbyist board
chosen: Carry each open finding by name to a later step on the owner's recorded decision
links:
  - target: SOL-HW-MAIN-BOARD-SCHEMATIC-PROVEN.C1
    type: addresses
