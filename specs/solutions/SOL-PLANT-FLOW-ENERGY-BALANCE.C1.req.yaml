id: SOL-PLANT-FLOW-ENERGY-BALANCE.C1
type: criterion
title: The casting loses energy to the water drawn through it
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A loss term proportional to the rate water is drawn and to the temperature difference across it joins
  the ambient loss the brew casting already carries, and every structure that answers the pump channel
  carries that term, not only the reference one. With a draw open and the heater off, the heated mass
  falls faster than the same structure falls with no draw; with the heater holding, the droop under draw
  is larger than the model produces today. The steam mass is out of scope and gains no such term — the
  steam draw is a separate omission of the description and stays open.
