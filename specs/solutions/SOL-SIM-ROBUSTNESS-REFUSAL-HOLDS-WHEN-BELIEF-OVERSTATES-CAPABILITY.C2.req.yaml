id: SOL-SIM-ROBUSTNESS-REFUSAL-HOLDS-WHEN-BELIEF-OVERSTATES-CAPABILITY.C2
type: criterion
title: The refusal fires for every course the true plant cannot deliver, whenever truth lies within belief's declared error band
status: active
version: 2
measurement_type: binary
verification: analysis
text: |
  For every belief that overstates capability relative to the simulated plant, provided the true plant diverges from belief along at most one authority-relevant coefficient -- or along the coefficients the description states move together under the one declared joint dependence, the mains-driven supply sag -- each within its own declared fraction of the believed value, every course the true plant cannot deliver is refused: the degraded-plant probe this solution introduces is never more capable than the true plant on that single-corner divergence, so nothing it cannot achieve is ever admitted. Belief driven weaker than truth, already covered by the existing companion check, is out of scope for this criterion. Truth diverging from belief independently across more than one coefficient at once, each individually within its own declared band, is also out of scope: the worst-corner enumeration this solution reuses from DEC-MARGIN-COMBINES-DECLARED-ERROR-BY-WORST-CASE runs one coefficient's corner at a time, so a joint divergence the description does not state as moving together can exceed every single corner the probe considers, and this criterion makes no guarantee against it. A mismatch beyond the declared band is a real improvement over the unchanged point-belief probe wherever it happens to bind, but is not a guarantee this criterion makes either -- the degraded plant can itself still overstate a true plant whose divergence from belief exceeds what was declared.
