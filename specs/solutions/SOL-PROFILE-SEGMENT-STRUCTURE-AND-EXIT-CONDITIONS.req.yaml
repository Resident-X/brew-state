id: SOL-PROFILE-SEGMENT-STRUCTURE-AND-EXIT-CONDITIONS
type: deliverable
category: solution
title: A profile is an ordered list of segments, each fully declared and ending on its own measured exit condition
status: active
version: 1
text: |-
  Extends the existing delivery profile surface from one course of flow to an ordered list of segments, each declaring its primary variable, limit, transition, exit condition and water temperature, with an incomplete profile or unmeasured exit quantity refused before the delivery begins.
