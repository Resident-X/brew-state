id: SOL-HW-MACHINE-AS-FOUND-FIT-RECORD.C1
type: criterion
title: The controller enclosure and its mounting are recorded as found, to the accuracy a board outline needs
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  The record gives the usable internal envelope of the space the original control electronics occupy, including any step, rib or boss that intrudes into it; the original board's outline and thickness; each original mounting point, with its position, hole size, standoff height and fixing; the clearances the installed parts around it need; and what the enclosure walls are made of. The envelope and the mounting points are measured in this machine to within plus or minus 0.5 mm, and the point where each harness enters the enclosure to within plus or minus 1 mm; each measured entry states the tolerance it was taken to. The cavity depth, which the working documents give as both 25 and 28 mm from different statements, is resolved by measurement and the earlier figures cited as superseded. Each entry carries its value with units where it has one, its evidence grade in the status vocabulary the machine's record already uses (measured, inspected, owner statement, schematic, parts list, published unverified, inferred, unmeasured) kept distinct rather than levelled, and a source a reader holding only the published repository can follow; a published source outside the repository, such as a photograph of the same model, is cited by its address and graded published unverified. Where the machine's record or a working design document already states a fact, the entry cites it rather than restating it. Out of scope: choosing any board's outline, partition or connector placement, which the partition and feasibility task decides from this record.
