id: SOL-HW-MACHINE-AS-FOUND-FIT-RECORD.C1
type: criterion
title: The controller enclosure and its mounting are recorded as found, to the accuracy a board outline needs
status: active
version: 1
measurement_type: binary
verification: inspection
text: |-
  The record gives the usable internal envelope of the space the original control electronics occupy, its original mounting points, and the clearances the installed parts around it need, established in the machine as found rather than taken from a nominal drawing or from memory, and stated to a stated tolerance fine enough to place a board outline and its connectors against. Each entry states its value with units, the kind of evidence behind it (measured, read off a drawing or datasheet, the owner's account, or inferred) kept distinct rather than levelled, and its source named so that a reader holding only the published repository can follow it without the author's private notes; where the machine's existing record or a working design document already states a fact, the entry cites it rather than restating it independently. Out of scope: choosing any board's outline, partition or connector placement, which the partition and feasibility task decides from this record.
