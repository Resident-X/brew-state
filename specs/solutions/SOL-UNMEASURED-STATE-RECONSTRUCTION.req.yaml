id: SOL-UNMEASURED-STATE-RECONSTRUCTION
type: deliverable
category: solution
title: The estimator seam, the state it reconstructs, and the residual it reports
status: active
version: 3
text: |
  The state worth reconstructing already exists. The slice this one depends on gave the
  reference structure a distinction it did not draw before — the temperature of the mass being
  heated is not the temperature of the water leaving it — and gave the plant seam a
  `plant_state_t` vocabulary that reaches both. The structure now keeps five states where the
  hardware seam reports four channels, and the one with no channel against it is the water on
  its way to the group: what the control law wants, and where no sensor can be placed. The gap
  this requirement exists to close is therefore open already, and this slice reconstructs
  across it rather than creating it.

  A named estimator interface is declared once as a plain C header under `firmware/include/`.
  It gives the control law a vocabulary for the states it works from, which is the estimator's
  own rather than the plant seam's: the seam's words describe what a structure keeps, and the
  states a control law asks for are a claim about the control law rather than about any
  structure. No signature names a plant structure or a structure-specific coefficient, so a
  translation unit including the header depends on the estimator seam and the plant-model seam
  rather than on either structure's equations.

  Behind that header sits one implementation. It holds a `plant_model_t` instance initialised
  from the parameter record the control law is given, advances it under the actuation that was
  commanded, and corrects it toward the channels `hw_interface.h` reports. Correcting requires
  comparing each predicted measurement against the observed one, and that difference is the
  residual: it is reported through the same seam rather than recomputed by whatever consumes it
  later, because a residual computed twice is two answers to one question. Correcting also
  requires putting the corrected value back, which the plant seam cannot express today — it
  reads a structure's states and writes none, and the encapsulation check that runs before
  every build refuses any consumer that reaches a field directly. So the seam gains a write
  beside its read, refusing on the same terms, and every structure answers it.
  `firmware/src/control/control.c` is rewired to drive from a reconstructed state instead of
  `hw_sensor_read(HW_SENSOR_BREW_TEMPERATURE)`, and to carry the parameter record the estimator
  needs, which its `control_init` signature does not take today.

  The estimator reaches the target as well as the host. `control.c` is compiled into every
  environment including `env:stm32`, so rewiring it onto the estimator without putting the
  estimator in that build leaves the target unable to link. The estimator also holds a
  plant-model instance, which the target build only gains through the slice that puts the plant
  model on the machine — hence the dependency recorded between them.

  Out of scope: what the estimator does when a measurement is briefly lost or reads
  implausibly, and the rate at which its output must be available to the control law. Both are
  properties of a correction strategy this slice chooses only as far as reconstruction and the
  residual demand, and both are deferred as premise-pending against this seam. Tuning the
  control law to the reconstructed signal is also out of scope, as is any claim that the
  structure's distinction is quantitatively right for the reference machine — that is settled
  by measurement, and the structure's support status already records that nothing has been on
  the bench.
rationale: |
  The plant seam gains a write because the correction step is otherwise unimplementable, not
  because the seam wanted rounding out. An observer that cannot put a corrected state back is
  not an observer, and the check that fails the build on any consumer touching a structure's
  fields is right to — the alternative is an estimator bound to one structure's equations,
  which is the thing the seam exists to prevent. Adding the write beside the read, refusing on
  the same terms, keeps that asymmetry from becoming a reason to go around.

  That the reference structure already distinguishes the heated mass from the water leaving it
  is the depended-on slice's work rather than this one's, and the criterion that asked for it
  here was retired when that slice delivered it. Replacing thin equations with less thin ones
  was the replaceability that slice delivered being used, not a shortfall in it. What remains
  here is the reconstruction, which is what this slice was always for.

  The residual is built here rather than deferred, reversing an earlier plan that deferred it.
  Both the parent requirement and the parent task state that estimation and error reporting are
  one mechanism and that splitting them invites them being built twice, and they are right: the
  correction step this slice performs computes predicted-minus-observed in order to correct at
  all. Deferring the residual would have meant a slice that computes it, does not expose it,
  and has to be reopened to expose it — which is the second build those rationales warn about,
  arriving by a different route. What is asserted is not merely that a residual appears, but
  that the one reported is the one the correction used; two residuals that agree today drift
  apart the first time either is touched.

  The estimator holds a plant-model instance rather than reimplementing the dynamics for the
  same reason. A second set of equations written to suit the estimator answers the same
  question differently as soon as either is corrected, and that divergence arrives disguised:
  predictions that stop matching observation look exactly like a machine that has drifted,
  which is the one thing this estimator exists to tell apart.

  The dependency on the onboarding slice is recorded rather than designed around. The control
  law compiles into every environment, so the moment it reads from the estimator, the target
  build needs the estimator, which needs the plant model, which the target does not carry until
  the other slice puts it there. An earlier plan asserted the two slices shared no seam and
  neither depended on the other; that was wrong, and the ordering is a fact about the build
  rather than a preference about sequencing.

  What cannot be settled before hardware exists is deliberately not claimed. That a
  reconstructed state is close enough to control a real machine with, and that the new
  distinction in the equations is quantitatively right, both wait on measured parameters. What
  can be settled now is that a state no sensor reports is produced, that it converges on the
  model's own truth rather than wandering, that the control law reads it, and that the
  comparison the correction relies on is the one anything downstream will see.
