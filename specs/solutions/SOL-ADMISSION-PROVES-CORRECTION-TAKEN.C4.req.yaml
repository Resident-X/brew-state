text: |
  Restores REQ-MODEL-STRUCTURE-SEAM-001.C2: the plant-model seam's statement of what a write of a state does says that a write reporting success leaves the state reading the value written, so the admission probe checks a documented guarantee rather than a convention.

  Verified by inspection of the seam's declaration of the state write against this clause: the statement is present, names the success case, and does not contradict the existing statement that a refused write changes nothing.
