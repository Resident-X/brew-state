text: |
  The puck, the pump's flow-versus-pressure characteristic, and the contention between two destinations
  drawing on one block are each left unclosed by this slice, and the description continues to say so — the
  rate entering these relations is the commanded rate, and the arrival of a flow term must not be readable
  as having closed them. The steam draw's energy cost is likewise not closed here, and this slice makes no
  assertion about whether it remains open elsewhere: a sibling task carries it, and whichever lands first
  owns that passage. Closing any of these is out of scope.
