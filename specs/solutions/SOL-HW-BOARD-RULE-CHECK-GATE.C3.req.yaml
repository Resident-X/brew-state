id: SOL-HW-BOARD-RULE-CHECK-GATE.C3
type: criterion
title: The separation basis is a written rule the layout check enforces at no less than the signed figure, and a mains-carrying design without it fails
status: active
version: 2
measurement_type: binary
verification: test
text: |
  Each design declares whether it carries mains through its MAINS project variable, set to present or none; unset or any other value fails. A design that declares present assigns its mains-referenced nets to the Mains net class and states, in its own custom layout rules, one rule holding the clearance and the creepage required between a Mains-class item and any item outside that class, with no narrowing by layer or area; KiCad's layout rule check enforces those distances, and it is run with the record's figures added as the highest-precedence rule, so a low-voltage conductor placed closer than the signed figure fails even where another rule in the design, whether or not it names the Mains class, would allow it. A design that declares present without that rule fails, so does one that declares present with no net in the Mains class, and a design that declares none while any net sits in the Mains class fails. Each declared clearance and creepage is compared with the separation basis record (separation-basis.yaml) in the nearest folder at or above the design, whose mains-to-low-voltage clearance and creepage are the figures compared: a declared figure smaller than the record's fails, a missing record fails, a record that cannot be parsed or lacks either figure or states one that is not a positive number fails, and a record whose acceptor is missing or a placeholder, or whose acceptance date is missing, invalid or later than the day the check runs, fails, so a design cannot pass by declaring less or by citing an unsigned basis. A record marked synthetic is accepted only for a design marked not for manufacture. Out of scope: detecting a mains-referenced net the design leaves out of the Mains class, which no rule check can see and which the design method's net-class step and the layout review own; choosing or signing for the separation figure itself, which the partition work declares; until it exists the check is proven against a synthetic basis record on the throwaway design.
