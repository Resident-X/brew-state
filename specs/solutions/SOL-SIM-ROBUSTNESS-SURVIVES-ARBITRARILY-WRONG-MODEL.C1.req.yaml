id: SOL-SIM-ROBUSTNESS-SURVIVES-ARBITRARILY-WRONG-MODEL.C1
type: criterion
title: The coffee side's existing refusal of an infeasible delivery still fires when the controller's belief about the plant is driven arbitrarily far from the plant actually simulated
status: active
version: 1
measurement_type: binary
verification: analysis
text: |
  The delivery-profile refusal already proven at nominal parameters is exercised again with the controller-versus-plant mismatch driven well beyond the declared error band, using the same separation the coffee side's existing mismatch harness already provides, and the refusal is confirmed to still fire before the infeasible delivery begins.

  Reaching a safe state, respecting the supply budget, and the actuator-limit invariant are out of scope for this criterion — none is exercised here.
