id: SOL-PLANT-FLOW-REPORTED.C5
type: criterion
title: A quantity no state observes cannot read as the first state
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A quantity that no state observes must not read as the first state. The estimator's table mapping each
  quantity to its observing state is sized by the quantity count and filled by designated initialiser, so
  an unlisted quantity resolves to the zeroth entry with no diagnostic — and the drawn rate is exactly
  such a quantity, since it is deliberately not given a state. The table therefore gains an explicit
  entry for it that cannot be mistaken for an observing state, and the reachability of the wrong-state
  reading is closed by construction rather than by assertion: no path from a quantity to a state may
  return a state the quantity does not actually observe. A blanket audit of unrelated
  designated-initialiser tables elsewhere in the firmware is out of scope.
