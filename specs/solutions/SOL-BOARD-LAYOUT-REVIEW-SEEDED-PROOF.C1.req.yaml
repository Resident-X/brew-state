id: SOL-BOARD-LAYOUT-REVIEW-SEEDED-PROOF.C1
type: criterion
title: Following the review step blind on a seeded copy of a proof design reports every seeded layout defect
status: active
version: 1
measurement_type: binary
verification: demonstration
text: |
  Build a clean throwaway proof design, never ordered, with its floorplan and plan, committed so the pre-order check over every design in the repository stays passing, and a seeding script that writes a copy of it outside the tracked tree carrying deliberately placed layout defects: at least one for each area the catalogue covers, and among them ground drawn as thin traces, a decoupling capacitor routed the long way round to its pin, silkscreen over a pad, low-voltage copper inside the mains region, and a high-current pad without the copper it needs. The script records the list of seeded defects and where each lies apart from the copy, where the review cannot read it. Review the copy by following the method's review step as written, in a session that has no record of what was seeded or where and is given only what that step gives a reviewer: the copy's design files, the checklist, the rendered views, the automated pre-order check's report on the copy, and the committed floorplan and plan. Compare the review's findings with the seed list afterwards: every seeded defect must be reported as a finding against the catalogue item that covers it, and a defect not reported is a gap in the catalogue or the views, closed and the blind review repeated before this step counts as done. Out of scope: ordering the proof design.
