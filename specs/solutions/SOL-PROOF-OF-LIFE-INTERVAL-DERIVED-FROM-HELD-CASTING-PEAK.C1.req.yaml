id: SOL-PROOF-OF-LIFE-INTERVAL-DERIVED-FROM-HELD-CASTING-PEAK.C1
type: criterion
title: The figures record derives the proof-of-life interval from the held peak and ends its pending mark
status: active
version: 1
measurement_type: binary
verification: analysis
text: |
  The controller boards' figures record replaces its pending proof-of-life removal interval with the interval derived from each thermoblock's peak casting temperature produced by the corrected control as the regenerated peak record gives it, its trip point, its element power at the top of the declared supply span and the lower bound of its thermal mass, showing the arithmetic and naming the shorter of the two heaters as the one that sets it, and no statement anywhere in the record still marks the interval pending or bounds it only by the times taken from the commanded temperatures. Out of scope: the interlock's design.
