id: SOL-HW-GATE-IN-ROUND-AND-NIGHTLY.C1
type: criterion
title: The build round runs the board check when the branch changes a board design, anything it reads, or the check
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The task runner build-round gate runs the board check and its tooling tests when the branch changes a tracked KiCad file anywhere, any file under the hardware tree, any file a discovered board design reads (its sheets, library tables and the libraries they reach, and the separation basis record it is held to, wherever these sit in the repository), or the board check's tooling or its task definitions, measured from the merge-base with main as the emulation tier is measured, and runs them when it cannot tell what changed. A missing or too-old KiCad then stops the round naming the tool rather than skipping the tier, and a branch that changes none of those paths runs without KiCad. Out of scope: the seeded-fault proof, which stays on demand.
