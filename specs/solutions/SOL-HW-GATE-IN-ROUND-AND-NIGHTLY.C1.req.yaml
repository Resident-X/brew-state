id: SOL-HW-GATE-IN-ROUND-AND-NIGHTLY.C1
type: criterion
title: The build round runs the board check when the branch changes a board design, anything it reads, or the check
status: active
version: 3
measurement_type: binary
verification: test
text: |-
  The task runner build-round gate runs the board check and its tooling tests, without the tests that run the seeded-fault proof, when the branch changes a tracked KiCad file anywhere, any file under the hardware tree, any file a discovered board design reads (its sheets, library tables and the libraries they reach, and the separation basis record it is held to, wherever these sit in the repository), or the board check's tooling, the round gate's own code, or the task-runner definition file, measured from the merge-base with main as the emulation tier is measured, and runs them when the changed paths cannot be told or the files a design reads cannot be listed. A KiCad design file present in the working tree but not yet tracked by git counts as a change to a board design, and the round fails naming it, since the check finds only tracked designs and must not pass one unseen. The tier is judged on changed paths alone, runs after the host and emulation tiers and before the changed-lines sweep, and a failing board tier stops the round with the sweep reported as not reached. The round's closing lines state whether the board tier ran, why it was skipped, or that it was not reached. A missing or too-old KiCad, or a missing rasteriser or monospaced font the tooling tests need, then stops the round naming the tool rather than skipping the tier, and a branch that changes none of those paths runs without the board tools. Out of scope: the seeded-fault proof, which stays on demand; unknown changed lines as a trigger.
