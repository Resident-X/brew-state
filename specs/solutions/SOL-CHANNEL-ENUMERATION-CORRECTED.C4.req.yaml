text: |
  The operator interface's eight discrete pushbuttons and its LED indicator segments are added to the enumeration as channels on a second microcontroller board, distinct from the two knob microswitches already enumerated, cited to the circuit diagram's switch and LED-driver nets.

  Out of scope: confirming the individual button labels and the exact LED element and indicator-function counts beyond the best reading the scanned sheet supports, which needs a recount at the panel or against a cleaner copy. Also out of scope: resolving whether a replacement controller could retain the board these channels sit on, which DEC-U8-BOARD-RETENTION-UNVERIFIED holds open pending a bench capture.
