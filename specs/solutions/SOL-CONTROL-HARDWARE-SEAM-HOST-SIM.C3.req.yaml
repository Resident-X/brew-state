id: SOL-CONTROL-HARDWARE-SEAM-HOST-SIM.C3
type: criterion
title: Selecting the simulated or target implementation changes no control-logic source
status: active
version: 1
measurement_type: binary
verification: demonstration
text: |
  The simulated implementation under firmware/src/hw/sim and the STM32 HAL-backed implementation
  under firmware/src/hw/stm32 both satisfy `firmware/include/hw_interface.h`, and which one is
  linked follows from the PlatformIO environment being built. The control-logic translation units
  under firmware/src/control produce identical preprocessor output in both environments, compared
  after preprocessing rather than on the raw sources, so that a macro defined by one environment
  and not the other is caught rather than hidden. Preprocessor branching on the environment inside
  a control-logic translation unit fails this criterion, as does an environment-defined macro that
  reaches one. Whether the target implementation drives real peripherals correctly is out of scope
  — no hardware exists to check that against.
links:
