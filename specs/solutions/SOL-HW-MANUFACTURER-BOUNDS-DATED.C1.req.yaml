id: SOL-HW-MANUFACTURER-BOUNDS-DATED.C1
type: criterion
title: The manufacturer's fabrication and assembly limits that bound the design are recorded with their date and source
status: active
version: 1
measurement_type: binary
verification: inspection
text: |-
  Every fabrication and assembly limit of the chosen manufacturer that bounds the boards, including minimum track and spacing, drill and via sizes, layer counts, the board-size thresholds of its price bands, what it assembles and on which side, and which parts must be fitted by hand, is recorded with the published source it was read from and the date it was read, so a later reader can tell a stale reading. Each entry states its value with units, the kind of evidence behind it (measured, read off a drawing or datasheet, the owner's account, or inferred) kept distinct rather than levelled, and its source named so that a reader holding only the published repository can follow it without the author's private notes; where the machine's existing record or a working design document already states a fact, the entry cites it rather than restating it independently. Out of scope: choosing a layer count, board size or assembly side for any board, which the partition and design tasks decide.
