id: SOL-HW-MANUFACTURER-BOUNDS-DATED.C1
type: criterion
title: The manufacturer's fabrication and assembly limits that bound the design are recorded with their date and source
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Every fabrication and assembly limit of the chosen manufacturer that bounds the boards is recorded with the published source it was read from, down to the page, and the date it was read, so a later reader can tell a stale reading and read the same figure again. The limits cover at least: minimum track width and spacing; drill, via and annular ring sizes; hole-to-hole and copper-to-edge clearances; silkscreen minimums; layer counts, board thickness and copper weight options; the board-size thresholds of its price bands; what it assembles, on which side, under which assembly service, and the smallest package or pitch it places; the setup fee and per-part fee of each parts library class; and which parts must be fitted by hand. Each entry carries its value with units where it has one, and the condition it holds under (such as layer count, copper weight or assembly service), since a limit without its condition cannot be checked against a board. Each entry carries an evidence grade, kept distinct rather than levelled, and the record itself states the meaning of every grade it uses, in the same words as the machine's record (published unverified read at source, inferred, unmeasured), so a record that holds for any machine depends on no file inside one machine's folder. A source is one a reader holding only the published repository can follow, cited by its address. Out of scope: choosing a layer count, board size or assembly side for any board, which the partition and design tasks decide.
