id: SOL-VERIFY-ROUND-GATE-TARGETED.C1
type: criterion
title: The round gate runs the host tier in full and the emulation tier only for changes it exercises
status: active
version: 2
measurement_type: binary
verification: test
text: |
  A task-runner command for the build round, declared under the name the project's instructions and the operator build skill use for a build round's gate, runs every build, every build-time check, every host test and every host executable under the sanitizers on every invocation. It runs the emulation tier when the branch, measured from its merge-base with the remote-tracking main and including uncommitted changes and new files not yet committed, touches anything the emulation tier reads: the firmware tree as a whole (its sources, headers, parameter descriptions and declarations, build configuration, the tooling the build and the emulation suite load, and the suite itself), the documentation records the emulation suite checks against, and the task-runner declaration that runs it. The set of paths that triggers emulation is declared once, beside the command. When the host tier fails, the command stops there and states that emulation was not reached. The command's exit status is its verdict: it fails when any tier it ran fails, and passes when every tier it ran passes, a correctly skipped emulation tier included. It states which tiers it ran and, for a tier it skipped, why, naming the changed paths it judged by, in statements a mid-tier gate worker with no knowledge of the task layout can report from directly. It never runs the full mutation sweep. The complete verification keeps its own declaration of every gate, unchanged. Out of scope: selecting individual tests within a tier.
