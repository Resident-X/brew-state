id: SOL-PLANT-FLOW-REPORTED.C4
type: criterion
title: The rate the pump moves water at full scale is a described coefficient
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Every structure that answers the pump channel gains the coefficient in its own parameter record, each
  carrying a declared error fraction and an origin marker, and each machine's description names it in
  prose. The build enforces the naming: the parameter-origin check fails any build whose description omits
  a coefficient or a quantity enumerator by name, so neither the coefficient nor the new quantity can ship
  undescribed in any structure. A structure that answers no pump channel needs no such coefficient.
  Establishing any value by measurement on a physical machine is out of scope — each is declared as
  estimated, with an error fraction wide enough to say so.
