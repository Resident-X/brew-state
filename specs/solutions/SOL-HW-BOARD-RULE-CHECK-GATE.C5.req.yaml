id: SOL-HW-BOARD-RULE-CHECK-GATE.C5
type: criterion
title: Each check this leaf enforces is shown to fail on a fault seeded for it in a throwaway design
status: active
version: 2
measurement_type: binary
verification: demonstration
text: |
  A throwaway board design, committed only to prove the check, never ordered and marked in its files as not for manufacture, passes the check when clean. Every failure condition the discovery, rule-check and separation criteria of this leaf state is a seeded fault: for each one, a fault is introduced into a copy of the design and the check is shown to fail, naming that fault, so a guard added to those criteria brings its seeded fault with it. They include at least electrical rule violations, layout clearance violations, a declared distance below the signed figure, a later rule that undercuts the signed figure once naming the Mains class and once matching mains items without naming it, a local clearance override on a mains pad, footprint or zone below the signed figure, a net class setting below it, a Mains rule narrowed by layer or area, a Mains rule holding only one of clearance and creepage, layout-schematic disagreement, a violation marked as excluded, a rule set to ignored, a mains-carrying design with no declared basis, a design silent on whether it carries mains or declaring an invalid value, a design declaring no mains while carrying a Mains-class net, a design declaring mains with no net in the Mains class, a missing basis record, a basis record that cannot be parsed or lacks a figure, an unsigned basis record, a synthetic basis record applied to a design not marked not for manufacture, a design that cannot be opened, a project missing its schematic or layout, a layout or schematic committed without its project, and an empty tree. The demonstration is recorded alongside the check's own result, so a later reader can see which fault was introduced for which check. Out of scope: the seeded-fault proofs for the connectivity and parts checks, which belong to the verification task's connectivity and parts criteria when they are sliced.
