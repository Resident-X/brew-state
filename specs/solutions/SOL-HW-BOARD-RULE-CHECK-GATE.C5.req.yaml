id: SOL-HW-BOARD-RULE-CHECK-GATE.C5
type: criterion
title: Each check this leaf enforces is shown to fail on a fault seeded for it in a throwaway design
status: active
version: 2
measurement_type: binary
verification: demonstration
text: |
  A throwaway board design, committed only to prove the check, never ordered and marked in its files as not for manufacture, passes the check when clean. For every rule family the check enforces, a fault is introduced into a copy of it and the check is shown to fail, naming that fault. The families are electrical rule violations, layout clearance violations, separation-basis violations including a declared distance below the signed figure, layout-schematic disagreement, a violation marked as excluded, a rule lowered to ignored, a mains-carrying design with no declared basis, a design silent on whether it carries mains, a design declaring no mains while carrying a Mains-class net, a design declaring mains with no net in the Mains class, a missing basis record, a basis record that cannot be parsed or lacks a figure, an unsigned basis record, a synthetic basis record applied to a design not marked not for manufacture, a design that cannot be opened, and an empty tree. The demonstration is recorded alongside the check's own result, so a later reader can see which fault was introduced for which check. Out of scope: the seeded-fault proofs for the connectivity and parts checks, which belong to the verification task's connectivity and parts criteria when they are sliced.
