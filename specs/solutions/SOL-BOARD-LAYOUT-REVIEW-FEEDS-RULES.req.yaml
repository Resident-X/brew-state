id: SOL-BOARD-LAYOUT-REVIEW-FEEDS-RULES
type: deliverable
category: solution
title: Each layout is reviewed against the practice catalogue with a verdict on every item, and findings that can be rules become rules
status: active
version: 2
text: |
  The method's layout review step, which confirms a board designed to the layout practice catalogue rather than being how it gets good. The checklist is the catalogue plus the board's own items, written before the layout. The reviewer, working without the designer's reasoning, judges every item on the rendered review views and records a verdict on each. Every finding stays open until a change to the board or a recorded reason closes it, and a safety finding closes only by a board change or a named person's signed acceptance. After any change the views are rendered again and the whole checklist is judged again. Every finding expressible as a rule is added to the method's rules so later boards are checked for it automatically. A proof board with deliberately placed defects shows the review finds what it claims to.
