id: SOL-BOARD-LAYOUT-REVIEW-FEEDS-RULES
type: deliverable
category: solution
title: Each layout is reviewed against the practice catalogue with a verdict on every item, and its findings feed the catalogue
status: active
version: 3
text: |
  The method's layout review step, which confirms a board designed to the layout practice catalogue rather than being how it gets good. The checklist is the catalogue plus the board's own items, its baseline written before the layout. The reviewer, working from the board, the views, the pre-order check's report and the board's committed plan but never from the designer's reasoning, judges every item and records a verdict on each, and compares the layout with the plan. Every finding stays open until a change to the board or a reason showing the item is met, does not apply or is overridden closes it, never a judgement that it is unimportant, and a safety finding closes only by a board change or a named person's acceptance. After any change the views are rendered again and the whole checklist is judged again. Every finding expressible as a rule is added to the catalogue as a rule so later boards are checked for it automatically, and a first-review failure against a planned item is traced to and corrected at its planning cause. The step extends the method where it already stands rather than adding a separate tool or file: a layout review section follows routing in the method, the planning step gains the table of the board's own items, and the method's introduction and its pointers that set the review out of scope are brought into line. The plan's commit before placement is the baseline's order, so no separate baseline file is kept, and the review record's checks are cross-checks stated in the method, as the planning and rules steps state theirs, rather than a new checking tool.
