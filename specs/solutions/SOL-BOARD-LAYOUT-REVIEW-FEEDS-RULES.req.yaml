id: SOL-BOARD-LAYOUT-REVIEW-FEEDS-RULES
type: deliverable
category: solution
title: Each layout is reviewed against a checklist written beforehand, and findings that can be rules become rules
status: active
version: 1
text: |-
  The method's layout review step: a checklist written before the layout, a review of rendered views of every layer, every finding recorded and closed by a board change or a recorded reason, and every finding expressible as a rule added to the rules so later boards are checked for it automatically.
