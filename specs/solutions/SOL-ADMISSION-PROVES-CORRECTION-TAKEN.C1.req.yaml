id: SOL-ADMISSION-PROVES-CORRECTION-TAKEN.C1
type: criterion
title: A structure is refused admission if the correction-target state does not carry the value written to it
status: active
version: 2
measurement_type: binary
verification: test
text: |
  Restores REQ-MODEL-STRUCTURE-SEAM-001.C2: the admission check that runs when a structure is brought up under the estimator is extended so that, for every reconstructed value, it proves the correction-target state carries the value written to it, not only that the write was accepted. The value written is one that differs bit for bit from the value the state held, for every held value including zero, the largest finite values, infinities and not-a-number, and the state is read back and compared bit for bit. A structure failing this probe is refused on the same terms a structure failing any of the existing probes already is.

  Verified by a test built directly against the failure this restores: a structure that accepts a write of the correction-target state and leaves the state as it was is refused at admission, where today it is admitted; and by a test that the value the probe writes differs bit for bit from the held value across those held values. Whether a structure recomputes that state from another on its next step, which the seam already treats as the structure's own answer rather than a refusal, is out of scope.
