id: SOL-BOARD-REVIEW-RENDER-VIEWS.C1
type: criterion
title: One task-runner command renders every layout review view of a board from its design files
status: active
version: 2
measurement_type: binary
verification: test
text: |
  Build the command among the repository's existing hardware tasks, locating KiCad and the rasteriser and reporting a missing or too-old tool the same way the pre-order check does, each overridable by a path variable as KiCad is, and name it, with the views it produces and the tools it needs with their minimum versions and where to get them, in the method and the hardware readme. The rasteriser is resvg, chosen because it ships as one prebuilt program for each common operating system. The command takes the board's layout file, its own project file, each critical class by name, and an output folder; it refuses an output folder inside any design's folder or one that already holds files, and resolves class membership by asking KiCad, with the same refusals as the routing check: an undefined or empty class, or a class list leaving out Mains on a board declaring mains.

  From those files it writes, as PNG images: an image of each copper, mask, paste, silkscreen and edge layer the board carries; an assembly view of each side, showing that side's fabrication, silkscreen and courtyard layers over the board edge; for each net in a critical class, that net's copper drawn over a faint image of the whole board, the net's copper taken from a filtered copy of the board holding only that net's tracks, arcs, vias, zones and pads; a map drawing each critical class in its own colour; a crop around each integrated circuit and the parts on its supply nets; and top, bottom and angled three-dimensional views. An integrated circuit is a footprint whose reference begins with U; its supply nets are the nets on its pads whose pin type is power input or power output; the parts on them are the two-pad parts with both pads on those nets, the decoupling pattern of one rail and one return.

  Every image is on a dark background. The resolution in pixels per millimetre is the stated number of pixels divided by the smaller of the board's own minimum track width and minimum clearance, read from the board's design rules; the method states the formula and that number, three pixels, so that the smallest track and the smallest gap each span at least three pixels; a board whose rules state no minimum track width or no minimum clearance fails the command naming the missing figure. Every whole-board view and every crop larger than the size limit is tiled, and every image is kept within the size limit: a long edge of no more than 1568 pixels and no more than 1568 visual patches of 28 by 28 pixels, the standard tier of the vendor's published limits, below which no reviewing model downsamples it; the method states the limit, its source and the date it was read. Each image carries a caption drawn into it stating its layers, its net or class, its scale in pixels per millimetre and the board coordinates in millimetres it covers, and the command writes an index of every image with the same caption fields, and a table of per-net facts: track width range, via count, zones and class; the index and the table are each written as text and as JSON.

  The board must carry both outer copper layers, both masks, both pastes, both silkscreens and an edge layer holding the outline; a board missing one fails the command with a message naming the layer. Tests on a throwaway proof design built by the tests outside the repository, with an integrated circuit, decoupling parts and two critical classes, check that every view is written; that a net's overlay holds that net's copper and no other; that each crop contains its circuit and its decoupling parts; that each crop and tile meets the derived resolution and, reduced by the vendor's published rule to the largest size a reviewing model reads without downsampling, is unchanged and so still spans the smallest track width and clearance over at least three pixels; that the index and fact table hold the right facts in both forms; and that an unknown class, a missing layer, a board stating no minimum, an output folder inside a design's folder, a missing tool and an unreadable board each fail the command with a message naming it. Out of scope: judging the images.
