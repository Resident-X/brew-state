id: SOL-BOARD-REVIEW-RENDER-VIEWS.C1
type: criterion
title: One task-runner command renders every layout review view of a board from its design files
status: active
version: 2
measurement_type: binary
verification: test
text: |
  The views are for whoever reviews the layout: a person or an agent session working for the Builder (PER-BUILDER-001) at a bench with freely available software, or an Adopter (PER-ADOPTER-001) running the command on their own board with only what is written, so the images and their index must carry every fact the review needs without the author's context. Build the command among the repository's existing hardware tasks, locating KiCad and the rasteriser and reporting a missing or too-old tool the same way the pre-order check does, each overridable by a path variable as KiCad is, and name it, with the views it produces and the tools it needs with their minimum versions and where to get them, in the method and the hardware readme. The rasteriser is resvg, chosen because it ships as one prebuilt program for each common operating system; the captions also need a monospaced font, which the readme names with where to get it. The command takes the board's layout file, its own project file, each critical class by name, and an output folder; it refuses a board KiCad's lock file shows open in an editor, since the views are drawn from the saved file, and an output folder inside any design's folder or one that already holds files, and resolves class membership by asking KiCad, with the same refusals as the locked-copper check's commands (rules confirmation, copper lock and copper record): an undefined or empty class, or a class list leaving out Mains on a board declaring mains.

  From those files it writes, as PNG images: an image of each copper, mask, paste, silkscreen and edge layer the board carries, and of every other layer that holds any item, so a keep-out or assembly note drawn on a user layer reaches the review; an assembly view of each side, showing that side's fabrication, silkscreen and courtyard layers over the board edge; for each net in a critical class, that net's copper drawn over a faint image of the whole board, the net's copper taken from a filtered copy of the board holding only that net's tracks, arcs, vias, zones and pads, made from a temporary copy of the whole board whose zones KiCad has refilled and saved first, so a pour is drawn as the whole board's copper leaves it and never refilled into space the filter emptied; a map drawing each critical class in its own colour; a crop around each integrated circuit and the parts on its supply nets; and top, bottom and angled three-dimensional views. An integrated circuit is a footprint whose reference begins with U; its supply nets are the nets on its pads whose pin type is power input or power output; the parts on them are the two-pad parts with both pads on those nets, the decoupling pattern of one rail and one return, each attributed to the one integrated circuit sharing those nets whose nearest pad is closest to the part, so a crop holds a circuit's own decoupling and never another circuit's on a shared rail. An integrated circuit with no pad typed as a power pin still gets its crop, and the index marks that crop as having no supply nets declared; one to which no part is attributed is marked as having no decoupling parts; so a missing decoupling set is never shown as an empty one or as another circuit's.

  Every image is on a dark background, and every output file has its own name, compared without regard to letter case and including any tile suffix, so no view overwrites another. Nothing the board holds is dropped from a view without a word: each whole-board view is framed on everything its layers hold, the outline and anything beyond it alike; a rule area, which KiCad does not plot, is drawn and named on every two-dimensional view of a layer it is on; a font KiCad substitutes, a fabrication or courtyard layer the board does not carry, and a part drawn in three dimensions without its model are each named in the captions where they bear, in the index and in the command's report. The resolution, tiling and coordinate rules that follow apply to the two-dimensional views; the three-dimensional views are each rendered as one image within the size limit, and their caption states the view direction and the image size instead of a scale and coordinates. The resolution in pixels per millimetre is the stated number of pixels divided by the smaller of the board's own minimum track width and minimum clearance, read from the board's design rules; the method states the formula and that number, three pixels, so that the smallest track and the smallest gap each span at least three pixels; a board whose rules state no minimum track width or no minimum clearance, or state zero or less, fails the command naming the missing figure. Every whole-board view and every crop larger than the size limit is tiled, and every image is kept within the size limit: a long edge of no more than 1568 pixels and no more than 1568 visual patches of 28 by 28 pixels, the standard tier of the vendor's published limits, below which no reviewing model downsamples it; the method states the limit, its source and the date it was read. Each image carries a caption drawn into it stating its layers, its net or class, its scale in pixels per millimetre and the board coordinates in millimetres it covers, and the command writes an index of every image with the same caption fields, and a table of per-net facts: track width range, via count, zones and class; the index and the table are each written as text and as JSON.

  The board must carry both outer copper layers, both masks, both pastes, both silkscreens and an edge layer holding the outline; a board missing one fails the command with a message naming the layer. Tests on a throwaway proof design built by the tests outside the repository, with an integrated circuit, decoupling parts, two critical classes and a zone whose fill depends on another net's copper, check that every view is written, the three-dimensional views among them within the size limit; that a net's overlay holds that net's copper and no other, its zone drawn with the fill the whole board gives it; that each crop contains its circuit and its decoupling parts and not those of another circuit on the same rail, a circuit with no attributed part is marked, and a circuit with no power-typed pad is marked in the index; that each crop and tile meets the derived resolution and, reduced by the vendor's published rule to the largest size a reviewing model reads without downsampling, is unchanged and so still spans the smallest track width and clearance over at least three pixels; that the index and fact table hold the right facts in both forms; that items beyond the outline, rotated and mirrored items, rule areas, substituted fonts, absent fabrication or courtyard layers, parts without a model and net names differing only in case are each framed, drawn or named as stated; and that an unknown, empty or doubled class, a class list leaving out Mains on a board declaring mains, a missing layer, a board stating no minimum or a zero or non-finite minimum, a board open in an editor, an output folder inside a design's folder or already holding files, a missing or too-old tool and an unreadable board each fail the command with a message naming it. Out of scope: judging the images.
