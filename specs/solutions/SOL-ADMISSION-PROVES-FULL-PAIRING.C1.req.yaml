id: SOL-ADMISSION-PROVES-FULL-PAIRING.C1
type: criterion
title: A structure is refused admission if it cannot answer every state a value it reconstructs will be corrected through, not only the state the reconstruction itself names
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Restores REQ-MODEL-STRUCTURE-SEAM-001.C2: the admission check that runs when a structure is brought up under the estimator is extended so that, for every reconstructed value, it also probes the state that value's own correction step will write toward -- not only the state the reconstruction is named after. A structure failing either probe is refused on the same terms a structure failing today's single probe already is: no state is left half-checked because a value happened to have two names for it.

  Verified by a test built directly against the failure this restores: a structure that answers the reconstruction-target state and refuses the correction-target state for the same value is refused at admission, where today it is admitted. Extending the check to a value with no correction step at all, and to a value observed by more than one channel, are out of scope -- this covers the one pairing shape the estimator's vocabulary has today.
