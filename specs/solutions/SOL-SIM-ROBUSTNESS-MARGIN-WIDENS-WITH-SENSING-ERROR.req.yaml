id: SOL-SIM-ROBUSTNESS-MARGIN-WIDENS-WITH-SENSING-ERROR
type: deliverable
category: solution
title: Commanded margin widens against the protection trip point by the declared sensing error, combined with the existing model-error contribution
status: active
version: 1
text: |
  SOL-SIM-ROBUSTNESS-MARGIN-WIDENS-WITH-MODEL-ERROR established the commanded margin itself, against the
  protection trip point, but its own scope statement named the sensing-error half of REQ-ROBUST-CONTROL-001.C3
  out of scope and left REQ-MEASUREMENT-001.C4 -- "sensing error is carried explicitly in the margin the
  controller commands within" -- as a separate, uncovered gap. Nothing in the machine today derives a margin
  contribution from declared sensing error: the commanded margin widens only for the model-error corners that
  solution enumerates.

  This solution closes that gap. For the channel the protection margin already guards, it declares that
  channel's own sensing error -- the accuracy figure the fitted sensor carries, sourced the way the existing
  trip-point figures were sourced, from the part actually specified rather than assumed -- and derives that
  channel's contribution to the widened margin from it, on the same terms model error already earns a
  contribution: a corner that degrades the margin by the declared sensing error, evaluated independently of
  the model-error corners that already exist. The two contributions are combined by the same worst-case
  convention the model-error margin already established, so one convention answers "how do several declared
  errors combine into a single conservative figure" across both the parameter side and the sensing side, and
  neither invents a second rule the other must reconcile against. The combined margin is what the controller
  commanded margin actually enforces, replacing the model-error-only figure the prior solution wired in.

  Verification reuses the existing corner-perturbation and margin-adequacy apparatus: a sensing-error corner
  is added to the enumeration the model-error solution already runs, and the same margin-adequacy check --
  does a delivery commanded at the widened margin's own edge still land within tolerance -- is asked of the
  combined figure rather than of the model-error figure alone.

  Out of scope: re-deriving or re-arguing the model-error contribution itself, which the prior solution
  already established and which this solution only combines with rather than recomputes; any sensing channel
  other than the one the protection margin already guards, since REQ-MEASUREMENT-001.C4 and the protection
  margin both concern that one channel and extending to others is a separate question; characterising the
  fitted sensor's true accuracy against its datasheet figure, which is a measurement-validation question this
  solution takes the declared figure as given for rather than re-establishes; and building the estimator-side
  error a reconstructed state carries, which REQ-STATE-ESTIMATION-001 already covers separately and which this
  solution's margin concerns itself with only through the one declared sensing figure, not through estimation
  error generally.
rationale: |
  Traced to DEL-MAINTENANCE.C1 rather than to DEL-SIM-ROBUSTNESS-VERIFICATION's own cascade criterion, on the
  same reasoning DEL-MAINTENANCE.C1 gives for every item under this lane: DEL-SIM-ROBUSTNESS-VERIFICATION is
  sealed, and what is owed is evidence against the requirement criteria the shortfall bears on -- REQ-MEASUREMENT-001.C4
  and REQ-ROBUST-CONTROL-001.C3 -- not a reopening of a closed deliverable. SOL-HELD-DELIVERY-REVALIDATED-ON-RESUME
  establishes the same pattern for a different sealed epic: a gap found in already-sealed work attaches as a
  maintenance child tracing to the requirement criterion it restores, rather than as a new child of the sealed
  parent.

  Found during phase-1 attestation of DEL-BREW-STATE-DELIVERY: REQ-ROBUST-CONTROL-001.C3 and REQ-MEASUREMENT-001.C4
  were both review-ready with no covering solution. SOL-SIM-ROBUSTNESS-MARGIN-WIDENS-WITH-MODEL-ERROR's own
  scope statement already named the gap explicitly rather than leaving it silently uncovered, so this is not a
  new discovery so much as picking up a boundary that solution already drew and declined to cross.

  Combining by the same worst-case convention the model-error margin already established, rather than deciding
  a second combination rule for sensing error, keeps one answer to "how do declared errors combine into a
  margin" across both contributions -- the same reasoning DEC-MARGIN-COMBINES-DECLARED-ERROR-BY-WORST-CASE and
  its reuse in SOL-SIM-ROBUSTNESS-REFUSAL-HOLDS-WHEN-BELIEF-OVERSTATES-CAPABILITY already give for not inventing
  a competing convention every time a new declared error needs a conservative figure.

  Scoping to the one channel the protection margin already guards, rather than every sensing channel the
  machine carries, follows the shape of REQ-MEASUREMENT-001.C4 itself: that criterion is about the margin the
  controller commands within, and only one channel runs close enough to its trip point for that margin to be
  the operative concern. A channel with no comparable trip point has no comparable margin to widen.
