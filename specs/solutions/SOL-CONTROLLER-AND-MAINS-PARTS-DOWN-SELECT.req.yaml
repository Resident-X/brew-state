id: SOL-CONTROLLER-AND-MAINS-PARTS-DOWN-SELECT
type: deliverable
category: solution
title: The controller and the mains-side parts are assessed against the channel enumeration, judged in interface resources rather than connector count
status: active
version: 3
text: |
  The machine's channel enumeration is already complete enough to assess candidates against: every sensing and
  actuation channel carries its signal, the peripheral kind it demands, its count and whether its failure bears
  on safety. What has never been done is the step between that list and a purchase -- taking a candidate and
  showing, channel by channel, that its timing and conversion resources reach every channel the enumeration
  names and leave room for the ones the graph anticipates.

  The judgement is made in resources rather than in connectors. A candidate is assessed on whether the capture
  channels, conversion inputs and interrupt lines each channel needs are simultaneously available on pins the
  board actually brings out, with the channels the graph already anticipates counted in. A purpose-built board
  from an adjacent application is admissible and may be the best value, but its spare capacity is spare for its
  own function first, and that is what the assessment has to see through.

  The mains side is specified alongside it and is independent of which controller is chosen. Each switched load
  is specified by the property its switching device must have rather than by a part: whether it must be
  commandable every half-cycle or only per delivery, what it carries continuously, what it must dissipate where
  it is mounted, and what state it fails into. The supply-timing front end is specified the same way, including
  that it presents both crossings of each cycle and that its barrier keeps the mains-referenced side away from
  everything the operator and the low-voltage circuits can reach.

  The list this produces is a specification the builder decides against rather than a set of choices made for
  them: each channel states what a part has to satisfy and what the existing device already achieves, so a
  candidate can be judged against the row. Which part serves a channel and whether it is bought, reused or
  salvaged is the builder's act, recorded once made. What is bought, what the machine already carries and is
  reused, what is salvaged from a donor machine, and what the whole comes to are kept against the declared spend
  as those decisions land, with any channel departing from a reused or commodity part carrying its reason against
  that channel. A salvaged part is not reuse: it costs the same nothing but has not shown it survives this
  machine, so it carries its own verification against the channel it serves.

  Out of scope, and deliberately so: formally selecting the machine's controller, which three active nodes hold
  open against measured plant parameters and which this item does not settle -- an assessment showing a candidate
  adequate is an input to that selection, not the selection itself. Also out of scope: characterising any part
  once bought, which is bench work under the measurement phase; establishing the phase offset between a true
  crossing and a detected edge, which no declared figure bounds; the bench capture of the original two-wire
  operator link, which its own assumption decision holds open; and the proof-of-life interlock, which has its own
  requirement criteria and is not settled by choosing parts.
