id: SOL-HW-MACHINE-AS-FOUND-FIT-RECORD.C3
type: criterion
title: The mains lead arrangement, the source of each live feed and the position of every location-dependent part are recorded
status: active
version: 5
measurement_type: binary
verification: inspection
text: |
  The record states how the mains leads enter and are arranged inside the enclosure, and traces each live feed the original board takes to the device upstream of it, or states that the upstream device was not read and names the work that will read it, so why the board takes more than one is established rather than guessed; it also states which fuse, if any, each pump branch carries as found. Feeds are traced by continuity with the machine unplugged. Each pending mark in the board design constraints record that names this solution for why the original board takes two live feeds and what protects each, or for a conductor fed by the second feed, ends with the traced fact and its source. A part of such a mark that the trace cannot settle, such as a protection figure that rests on a board design choice, instead names the work that will settle it. For every part whose location constrains the boards it establishes whether the part is mounted on the original board or separately, on which face, and its position relative to the mounting points and to whatever it senses. The tank-level sensor is recorded as a reed element soldered through the back of the board being replaced, with its position relative to the mounting points and to the float it senses, since a new board must put a sensing element where the float's magnet reaches. Each mains-presence sense channel is recorded as an opto-isolator mounted on that same board, which needs only the board it is on. The record names the version of the retention decision that places all three on the replaced side. Every arrangement and position the boards' floorplan depends on is established by inspecting this machine; only one the floorplan does not use may be marked pending. A mark of pending names the work that will settle it and ends only when that work records the fact and its source; every document derived from the record shows the mark rather than a value. Each entry carries its value with units where it has one, its evidence grade from the table of evidence grades in the board design constraints record, as this solution extends it with the grade inspected, kept distinct rather than levelled, and a source a reader holding only the published repository can follow; an inferred entry names the entries it rests on, so a reader can see which claims fall if one of them does; a published source outside the repository, such as a photograph of the same model, is cited by its address and graded published unverified. Where the machine's record or a working design document already states a fact, the entry cites it rather than restating it, and every document in the machine's record folder that restates a fact this record establishes or changes is corrected to match in the same change. Out of scope: amending the retention decision itself, which is its own change, and any change to the machine's wiring.
