id: SOL-HW-GATE-IN-ROUND-AND-NIGHTLY.C2
type: criterion
title: The nightly full verification runs the board check and its proof against main
status: active
version: 1
measurement_type: binary
verification: demonstration
text: |-
  The single declaration of the complete verification lists the board check and its seeded-fault proof, so the nightly scheduled run against main runs them, to completion even after another gate fails, on a hosted runner that installs KiCad from a free, named source at the version the check requires, and reports their failures the way it reports every other gate. Out of scope: runners for other operating systems, and caching the KiCad install beyond what the runner offers.
