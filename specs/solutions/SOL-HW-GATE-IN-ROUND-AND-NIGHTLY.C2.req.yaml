id: SOL-HW-GATE-IN-ROUND-AND-NIGHTLY.C2
type: criterion
title: The nightly full verification runs the board check against main
status: active
version: 2
measurement_type: binary
verification: demonstration
text: |
  The single declaration of the complete verification lists the board check and the tooling tests without the tests that run the seeded-fault proof, so the nightly scheduled run against main runs them, to completion even after another gate fails, on a hosted runner that installs KiCad from a free, named source at the version the check requires, together with the rasteriser and monospaced font the tooling tests need, and reports their failures the way it reports every other gate. Out of scope: the seeded-fault proof, which stays on demand as the verification-cadence decision sets; runners for other operating systems; caching the KiCad install beyond what the runner offers.
