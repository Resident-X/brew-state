id: SOL-HW-REQUIREMENT-FIGURES-SOURCED.C1
type: criterion
title: Every figure the requirements impose on the boards is recorded with its source
status: active
version: 1
measurement_type: binary
verification: inspection
text: |-
  The record holds every figure the requirements impose on the boards, covering at least the supply voltage range and frequency, the upstream protection the build relies on, the budget of each supply rail, each load's current, the accuracy each sensing channel must hold, the inputs to the separation basis, the fault current each conductor must survive until its protection acts, the interval within which loss of the controller's proof of life must remove heater power (derived from the time to a hazardous state rather than chosen), and the state each output must fail into. Board copper carrying mains current is treated as wiring throughout. Each figure names the requirement criterion or record entry it is derived from and the derivation. Each entry states its value with units, the kind of evidence behind it (measured, read off a drawing or datasheet, the owner's account, or inferred) kept distinct rather than levelled, and its source named so that a reader holding only the published repository can follow it without the author's private notes; where the machine's existing record or a working design document already states a fact, the entry cites it rather than restating it independently. Out of scope: choosing track widths, wire gauges, clearances or parts to meet these figures, which is design work.
