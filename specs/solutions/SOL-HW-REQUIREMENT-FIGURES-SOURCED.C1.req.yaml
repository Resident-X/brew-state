id: SOL-HW-REQUIREMENT-FIGURES-SOURCED.C1
type: criterion
title: Every figure the requirements impose on the boards is recorded with its source
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  The record holds every figure the requirements impose on the boards, covering at least the supply voltage range and frequency, the upstream protection the build relies on, the budget of each supply rail, each load's current, the accuracy each sensing channel must hold, the inputs to the separation basis, the fault current each conductor must survive until its protection acts, the interval within which loss of the controller's proof of life must remove heater power (derived from the time to a hazardous state rather than chosen), and the state each output must fail into. Board copper carrying mains current is treated as wiring throughout. Each figure names the requirement criterion or record entry it is derived from and the derivation. Each entry carries its value with units where it has one, its evidence grade in the status vocabulary the machine's record already uses (measured, owner statement, schematic, parts list, published unverified, inferred, unmeasured), plus project assumption for a value chosen where no fact exists and marked as one to replace, all kept distinct rather than levelled, and a source a reader holding only the published repository can follow; a published source outside the repository, such as a photograph of the same model, is cited by its address and graded published unverified. Where the machine's record or a working design document already states a fact, the entry cites it rather than restating it. Out of scope: choosing track widths, wire gauges, clearances or parts to meet these figures, which is design work.
