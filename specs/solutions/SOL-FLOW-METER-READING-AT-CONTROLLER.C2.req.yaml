id: SOL-FLOW-METER-READING-AT-CONTROLLER.C2
type: criterion
title: The meter's signal line is wired to the controller board running test firmware on an input matching its signal type
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Per DEC-HEATER-DRIVE-GATED-BY-SUPERVISION, the controller board, running bench test firmware, is wired
  to the meter's signal line on a timer input-capture peripheral.
  The meter's output is a digital pulse train, so the read path needs a timer input-capture peripheral and a pulse counter, which is new peripheral plumbing alongside hw_sensor_read rather than a value substituted into the existing ADC-poll table, since that function implements only an ADC poll today. The physical connection (board, pin, meter terminal) is documented in docs/sunbeam-em7000/reference-machine.md, and
  the code comment at hw_stm32.c's SENSOR_INPUT_NONE entry, which currently explains the absence by
  the meter being wired to the OEM controller rather than this board, is updated to match.

  Out of scope: the production controller, which is the part DEC-CONTROLLER-BASELINE-STM32H743 baselines and
  which this wiring does not constitute or foreclose, and driving any SSR or heater channel from this
  board, which DEC-HEATER-DRIVE-GATED-BY-SUPERVISION admits for bench work but which this slice does
  not cover.
links:
