id: SOL-HW-EARLY-PURCHASES-JUSTIFIED.C1
type: criterion
title: Each purchase ahead of verification names the property it settles
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Every sample or instrument bought for the boards before their design is verified, including any bought before this record existed, is recorded with what was bought, when, and the property the verification could not establish without it; a purchase ahead of verification that names no such property is listed with that absence shown, so the departure is visible rather than omitted. Each entry gives a source a reader holding only the published repository can follow, such as the order record or receipt. Out of scope: purchases made after a design passes its verification, and weighing spend against the declared figure, which the partition and feasibility task does.
