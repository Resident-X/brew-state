id: SOL-HW-EARLY-PURCHASES-JUSTIFIED.C1
type: criterion
title: Each purchase ahead of verification names the property it settles
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Every sample or instrument bought for the boards before their design is verified, including any bought before this record existed, is recorded with what was bought, when, and the property the verification could not establish without it; a purchase ahead of verification that names no such property is listed with that absence shown, so the departure is visible rather than omitted. The Builder, who decides what to buy and verifies with hobbyist means, reads the section to see whether an early purchase is justified, so each entry gives a source a reader holding only the published repository can follow, such as the order record or receipt, and an evidence grade. Where nothing has been bought the section states so as a dated owner statement, and a planned replacement not yet bought is listed as planned. The section is new in the controller boards' design-constraints record, after the carried-forward module properties. Out of scope: purchases made after a design passes its verification, and weighing spend against the declared figure, which the partition and feasibility task does.
