id: SOL-BOARD-RULES-AND-LOCKED-CRITICAL-ROUTING.C1
type: criterion
title: Every design rule and net class is written with its figure and source and confirmed in effect before routing
status: active
version: 4
measurement_type: binary
verification: inspection
text: |
  The method requires, before any track is routed, that every design rule and every net class is written down carrying the figure it enforces and where that figure comes from (for example the machine's constraints record, a requirement, the manufacturer's stated limits, or a layout review finding that became a rule), and that each is then confirmed in effect on the open board by reading it back from the board rather than assumed from having been written to the project. Among them, every board declares whether it carries mains through its MAINS project variable, set to present or none; a board that declares present assigns every mains-referenced net to the Mains net class and writes one custom layout rule in the single form DEC-BOARD-SEPARATION-BASIS-RECORD fixes and the pre-order gate accepts: its condition written exactly A.hasNetclass('Mains') && !B.hasNetclass('Mains'), with no narrowing by layer or area, holding both a clearance and a creepage constraint stated in millimetres, each no less than the separation basis record's mains-to-low-voltage figure, with that record as their stated source; and a board that declares none puts no net in the Mains class. The method warns that a local clearance override on a pad or footprint takes precedence over custom rules in KiCad, tells the designer to treat a zone's own clearance the same way although KiCad 10 was measured not to let it outrank a custom rule, and says the gate fails any of them that undercuts the signed figure. A rule with no stated source, a net class written to the project but not read back from the board, or a board with no mains declaration, fails the step. The step is stated so the Builder (PER-BUILDER-001) or the Adopter (PER-ADOPTER-001), who cannot ask the author and gets only what is written, working directly or through an agent session with no prior context, carries it out from the method's text alone, without reference to this project's graph identifiers or its author's context. Out of scope: the figures themselves, which belong to a machine's constraints record and its separation basis record, and the automated pre-order check that later enforces these rules. Out of scope also: the demonstration that a fresh agent session follows the whole method end to end, which SOL-BOARD-METHOD-FOLLOWABLE-AND-MACHINE-FREE owns; this step's own self-sufficiency is shown by inspection of its text.
