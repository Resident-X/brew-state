id: SOL-HW-MODULE-PROPERTIES-CARRIED-FORWARD
type: deliverable
category: solution
title: What each bought module in the earlier design supplied without being specified is stated as a constraint on whatever replaces it
status: active
version: 2
text: |
  For every bought module the earlier controller design specified, states the isolation, output behaviour, input thresholds and default states it would have provided without being specified, so a circuit designed in its place is held to them. The earlier design is the working design in the controller design folder: a paper direction whose modules were never bought, so no part is in hand to measure and each property is read from the module's datasheet or schematic. Lands as a new section of the controller boards' design-constraints record, its pending marks joining that record's table of pending marks.
