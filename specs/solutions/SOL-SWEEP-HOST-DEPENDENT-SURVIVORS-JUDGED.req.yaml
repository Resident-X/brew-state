id: SOL-SWEEP-HOST-DEPENDENT-SURVIVORS-JUDGED
type: deliverable
category: solution
title: The mutation sweep's host-dependent survivors in the plant parameter tables are judged
status: active
version: 1
text: |
  The mutation sweep the plant model is held to fails on the tree as it stands: two mutants in the plant parameter table code survive the tests and carry no judgement. The code has not changed since the last full re-judgement. Both mutants only make a lookup read one entry past the end of a compiled-in static table, and whether that kills or survives depends on what the linker places after the table, which differs between hosts and builds. The judgement record already describes this effect for two earlier entries; on this host the same effect now surfaces these two as survivors, and turns one earlier survivor, the ge-to-gt mutant at line 171 column 32 of the same file, into a kill; its judgement stays in the record for hosts where it still survives.

  The correction is to judge each of the two in the record with the verdict it already defines for this case: the effect is an out-of-bounds read only, a test reaches the mutated line, and the sanitized build aborts on it. Each judgement records the hand experiment that showed the sanitized build catching it, so it can be repeated. No test is added, because the observable result at the boundary is unchanged and only the undefined read differs, which no assertion can see reliably.
rationale: |
  The sweep is the check that the tests could fail on a plausible defect, so a survivor with no judgement is a claim nobody has examined that the tests are adequate, and the firmware gate correctly stops on it. Nothing the graph says was wrong; the record fell behind the host the sweep now runs on, which is maintenance rather than a new requirement. It is separate from the earlier full re-judgement because the cause differs: that one followed code moving under its judgements, this one follows the same code drawing different survivors on a different link layout. It was found when the board rule-check build ran the firmware gate on main.
