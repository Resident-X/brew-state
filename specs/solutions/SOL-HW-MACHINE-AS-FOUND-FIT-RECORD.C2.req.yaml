id: SOL-HW-MACHINE-AS-FOUND-FIT-RECORD.C2
type: criterion
title: Every retained harness is recorded with the connector it ends in and its first pin
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  For every harness that reaches the controller from a device the retention boundary retains, the wiring record identifies the connector it ends in (its family, or the measured pitch and way count that identify it), which contact is its first pin, what each contact carries, and where the harness enters the enclosure. Every harness and contact the boards' floorplan places is established by inspecting this machine; only a harness the floorplan does not use may be marked pending, and the set covers every retained harness, not only those a current design uses. A mark of pending names the work that will settle it and ends only when that work records the fact and its source; every document derived from the record shows the mark rather than a value. Each entry carries its value with units where it has one, its evidence grade in the status vocabulary the machine's record already uses (measured, owner statement, schematic, parts list, published unverified, inferred, unmeasured) kept distinct rather than levelled, and a source a reader holding only the published repository can follow; a published source outside the repository, such as a photograph of the same model, is cited by its address and graded published unverified. Where the machine's record or a working design document already states a fact, the entry cites it rather than restating it. Out of scope: selecting mating connectors on the new boards, and harnesses of devices the retrofit adds, which bring their own connections.
