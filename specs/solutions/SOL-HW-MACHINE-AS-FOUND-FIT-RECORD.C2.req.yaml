id: SOL-HW-MACHINE-AS-FOUND-FIT-RECORD.C2
type: criterion
title: Every retained harness is recorded with the connector it ends in and its first pin
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  For every harness that reaches the controller from a device the retention boundary retains, the wiring record identifies the connector it ends in (its family, or the measured pitch and way count that identify it), which contact is its first pin, what each contact carries, and where the harness enters the enclosure. The set is: the operator panel's keys, indicators and buzzer; the gauge assembly; the two control-knob microswitches; the tank water-level sensor; the flow meter; the leads of both thermoblock heating elements, both pumps and both solenoid valves; the two mains-presence sense channels; every device of the protective chain whose wiring reaches the board; and the leads of the three temperature sensing elements, which reach the board whichever element class later serves them. For each mains load, the record also states how its leads terminate and which physical device each lead drives. The harness entries agree with the machine's channel enumeration, controller-io.md: each contact that carries a channel names the same channel there. Every harness and contact the boards' floorplan places is established by inspecting this machine; only a harness the floorplan does not use may be marked pending. A mark of pending names the work that will settle it and ends only when that work records the fact and its source; every document derived from the record shows the mark rather than a value. Each entry carries its value with units where it has one, its evidence grade from the table of evidence grades in the board design constraints record, as this solution extends it with the grade inspected, kept distinct rather than levelled, and a source a reader holding only the published repository can follow; an inferred entry names the entries it rests on, so a reader can see which claims fall if one of them does; a published source outside the repository, such as a photograph of the same model, is cited by its address and graded published unverified. That vocabulary gains the grade inspected, for a fact read off this machine by eye without an instrument, such as a first-pin mark, a connector housing or the face a part is mounted on: the board design constraints record's table of evidence grades defines it, and the wiring record maps its own grades (traced, read, observed, inferred) onto the shared vocabulary in one stated correspondence, without regrading the rows it already holds. Where the machine's record or a working design document already states a fact, the entry cites it rather than restating it, and every document in the machine's record folder that restates a fact this record establishes or changes is corrected to match in the same change. Out of scope: selecting mating connectors on the new boards, and harnesses of devices the retrofit adds, which bring their own connections.
