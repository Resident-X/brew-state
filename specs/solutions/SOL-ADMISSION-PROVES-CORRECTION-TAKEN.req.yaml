id: SOL-ADMISSION-PROVES-CORRECTION-TAKEN
type: deliverable
category: solution
title: Admission proves the value written to the correction-target state is the value it afterwards holds
status: active
version: 3
text: |
  Admission now proves three things about a structure before it is admitted: that the quantity a reconstruction answers can be read, that the state that quantity is corrected through can be read, and that the same state can be written. The third of those proves the write is accepted. It does not prove the value the write carried is the value the state afterwards holds.

  A structure whose write reports success and discards its argument passes every probe admission makes and then has every correction against it dropped exactly as completely as one that refused the write outright: the reading arrives, the correction is computed, the write reports that it was taken, and the state carries on from where it already was until the accumulated gap exceeds the declared loss-tolerance window and the reconstruction is withdrawn. That is the identical externally observable failure the previous two corrections along this chain were made for, reached one step further down it. Nothing in the tree has that shape today — every structure's write stores what it was given — and nothing requires that to hold for a structure written next.

  What has to hold once this is corrected: admitting a structure proves the correction-target state carries the value written to it, not only that the write was accepted, and does so without leaving the structure's model displaced from where its own initialisation put it.

  The proof lives in the estimator's admission probe, reusing the probe that already reads and writes back each correction-target state; it adds no new seam. For each correction-target state the admission walk reaches, the probe reads the held value, writes a value that differs from it, reads the state back and requires the value it wrote, then writes the held value back and requires that write to be accepted and the state to read back as the held value. The written value is derived from the held value so that it differs from it bit for bit for every held value, including zero, the largest finite values, infinities and not-a-number; a fixed constant is not used, because a state holding that constant would let a write that discards its argument pass. Comparisons against what a state reads back are bit-exact, so a held not-a-number is restored and recognised as restored. A structure failing any step is refused on the same terms as one failing any existing probe: admission reports failure and the instance stays not ready, so no consumer ever sees a model the probe displaced. A structure that clamps or quantises a written state is refused by this probe, which is the intended consequence of the first criterion; whether a structure recomputes a state on its next step is the structure's own answer and out of scope. Admission is an in-process pass/fail with no formatted output, so there is no text and JSON pair to cover.

  The seam's statement of what a write does is widened to say that a write reporting success leaves the state reading what was written, so the probe checks a documented guarantee rather than a convention.

  Four criteria carry this: the first for the differing value being carried, the second for already-admitted structures, the third for the restore, the fourth for the seam's statement. Verified by a new fixture structure that accepts the write of its correction-target state and leaves the state as it was, with its own host suite following the precedent of the fixture that refuses the write; by a test that a structure whose restore does not read back as the held value is refused; and by every existing structure continuing to be admitted with its states exactly as its initialisation set them.
rationale: |
  Recorded as a maintenance item found while building SOL-ADMISSION-PROVES-CORRECTION-WRITABLE, rather than folded into that solution, because proving the write is accepted already fully satisfies that solution's own criteria: its first criterion asks admission to prove the correction-target state can be written rather than only read, and its own verification text scopes it to a structure that refuses the write. Nobody had asked that solution to prove what the write does to the state, so folding this in would have meant solving something nobody had specified yet rather than completing the specified work more thoroughly — the same reason its two predecessors along this chain were recorded rather than absorbed.

  Placement settled by the readiness pass against the code and the chain's precedent: the probe is the layer. A statement at the seam of what a write does costs no probe but has no runtime force, since the seam's own write tests cover only the structures already in the tree and nothing checks a structure written next; the gap is exactly that nothing requires the property to hold for a structure written next, so only a check at admission covers every structure at start-up. The statement is widened alongside the probe so the probe checks a documented guarantee. A probe that does not restore is rejected because it breaks the second criterion and the sibling criterion on the writable solution that the model is left as its initialisation set it. The risk that a proof which has to undo itself can leave a structure displaced if the undo is wrong is bounded: the instance being admitted is the only state at risk, the held value was just read from the same state, and a failed restore makes admission report failure with the instance not ready, so the displaced model is never seen by a consumer, and only a structure being refused anyway can reach that case.
