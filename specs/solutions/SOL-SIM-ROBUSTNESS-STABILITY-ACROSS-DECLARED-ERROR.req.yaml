id: SOL-SIM-ROBUSTNESS-STABILITY-ACROSS-DECLARED-ERROR
type: deliverable
category: solution
title: The closed loop's response stays bounded at each parameter's declared-error corners, on both plants
status: active
version: 1
text: |
  The model-error classification names staying-stable-across-the-declared-error-range among the behaviours in its bounded class — permitted to move as the model does, but only within the declared range this solution establishes stability across, not required to hold against an arbitrarily wrong model the way the classification's invariant class is. The existing per-parameter sensitivity sweep already perturbs every parameter carrying a declared error to its corners and re-runs a closed-loop draw on both the coffee and steam sides, but it measures how far the delivered quantity moves from a reference run as a fraction of the delivery's declared tolerance band — a magnitude-of-degradation metric that presumes the response stays bounded rather than establishing that it does. This solution reuses that sweep's corner-perturbation and course-driving apparatus, without altering its existing figures or its already-attested exclusion set, and at each corner runs the closed loop to a horizon long enough to show whether the response settles within that same declared tolerance band, or diverges and does not. A corner where the response fails to settle is reported as an instability finding, distinct from and not folded into the existing deviation metric. The finding is committed alongside the corners it was run against, in a form repeatable against a replacement model, matching the form the existing sweep already established for this kind of claim.

  Out of scope: perturbing more than one parameter jointly per corner, or otherwise honouring correlation in the declared error's shape rather than treating parameters independently — moving one parameter at a time already satisfies the independent-perturbation half of the shape question, and the statement of which shape was used is left to the criterion that takes up the shape of the error; a coefficient the plant description declares one-sided, which this analysis does not run since a corner on its unpopulated side is not a real perturbation; computing how commanded margin should widen with the established range; re-running the coffee side against the profile-commanded course rather than the temperature-held one; altering the existing sensitivity sweep's own committed deviation figures or exclusion set.
rationale: |
  A deviation metric alone cannot distinguish "moved further but still converges" from "diverged" — both would simply be a larger deviation number, and the existing sweep was never built to make that distinction because establishing stability wasn't its question. Reusing its corner-perturbation and course machinery rather than building a second sweep keeps one apparatus, and one set of courses, as the thing both analyses are checked against — a divergence in what the coffee side's closed loop means between the two would be a worse defect than either analysis alone. Running to a longer horizon changes nothing about the existing sweep's own committed deviation figures or its already-attested exclusion set: those are computed over the windows that already judge each delivery's quality, and this solution only extends what is checked after that window closes, keeping two independent verdicts on one shared apparatus rather than one revising the other.

  The corner-only scope, rather than a joint or correlated sweep, matches the parent task's own separation of its stability criterion from its shape-of-the-error criterion: folding correlation in here would answer a question this solution was not asked, on top of a mapping from declared-error range to required margin that has not yet been established for it to lean on. A coefficient declared one-sided has no far corner to run, so it is excluded here rather than forced through a perturbation the declaration does not describe; folding one-sidedness into the shape of the error, alongside correlation, is exactly the question the deferred criterion exists to take up, not a gap this solution silently leaves.
