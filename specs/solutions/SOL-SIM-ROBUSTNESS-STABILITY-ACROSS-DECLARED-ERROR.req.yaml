id: SOL-SIM-ROBUSTNESS-STABILITY-ACROSS-DECLARED-ERROR
type: deliverable
category: solution
title: The closed loop's response stays bounded at every corner the declared error implies, on both plants
status: active
version: 1
text: |
  The model-error classification names staying-stable-across-the-declared-error-range among the behaviours in its bounded class — permitted to move as the model does, but only within the declared range this solution establishes stability across, not required to hold against an arbitrarily wrong model the way the classification's invariant class is. The existing per-parameter sensitivity sweep already perturbs every parameter carrying a declared error to its corners and re-runs a closed-loop draw on both the coffee and steam sides, but it measures how far the delivered quantity moves from a reference run as a fraction of the delivery's declared tolerance band — a magnitude-of-degradation metric that presumes the response stays bounded rather than establishing that it does. This solution reuses that sweep's corner-perturbation and course-driving apparatus, without altering its existing figures or its already-attested exclusion set, and at each corner runs the closed loop to a horizon long enough to show whether the response settles within that same declared tolerance band, or diverges and does not.

  Two properties of the declared error are not carried by treating every coefficient as an independent, two-sided draw. A coefficient the plant description declares one-sided is run at its one declared corner rather than excluded, so its half of the range is still checked on the same standard as a two-sided coefficient's pair. And the brew and steam element ratings are known to move together rather than independently — both are mains-driven, so a sagging supply lowers both at once — which an independent, one-at-a-time sweep does not exercise by construction. This solution adds that one joint corner: both element ratings perturbed together under a stated dependence (equal fractional sag from a shared supply droop), checked for settling on the same standard as every independent corner, alongside — not instead of — the independent per-parameter corners the rest of the sweep already covers. Whether that stated dependence is the real one is a characterisation question and stays out of scope; what is established is that the sweep does not silently assume independence the description never claimed.

  A corner where the response fails to converge — independent or joint — is reported as an instability finding, distinct from and not folded into the existing deviation metric. The finding is committed alongside the corners it was run against, in a form repeatable against a replacement model, matching the form the existing sweep already established for this kind of claim.

  Out of scope: a general correlation sweep across every possible pairing of declared-error coefficients, rather than the one dependence the reference description's own construction already implies; computing how commanded margin should widen with the established range; re-running the coffee side against the profile-commanded course rather than the temperature-held one; altering the existing sensitivity sweep's own committed deviation figures or exclusion set.
rationale: |
  A deviation metric alone cannot distinguish "moved further but still converges" from "diverged" — both would simply be a larger deviation number, and the existing sweep was never built to make that distinction because establishing stability wasn't its question. Reusing its corner-perturbation and course machinery rather than building a second sweep keeps one apparatus, and one set of courses, as the thing both analyses are checked against — a divergence in what the coffee side's closed loop means between the two would be a worse defect than either analysis alone. Running to a longer horizon changes nothing about the existing sweep's own committed deviation figures or its already-attested exclusion set: those are computed over the windows that already judge each delivery's quality, and this solution only extends what is checked after that window closes, keeping two independent verdicts on one shared apparatus rather than one revising the other.

  A coefficient the plant description declares one-sided still carries a declared error and belongs in a sweep claiming to establish stability across the declared range; excluding it rather than running its one declared corner would leave part of that range unchecked, not merely defer a harder question. The brew and steam element ratings' shared dependence on the mains supply, by contrast, is not a property any single coefficient's own declared error carries — it is a relationship between two coefficients the reference description's own reasoning already states, and an independent, one-at-a-time sweep cannot exercise it by construction. Stating that one known dependence and running it as a single additional corner is a bounded, concrete addition; sweeping every possible pairing a description might one day declare is not, and stays out of scope until a description states one. Together these close both parts of the shape-of-the-error question this task's own criteria separate — one-sidedness and correlation — on the same apparatus and to the same standard as the independent corners, rather than leaving either as a silent gap.
