id: SOL-SIM-ROBUSTNESS-MARGIN-WIDENS-WITH-MODEL-ERROR
type: deliverable
category: solution
title: Commanded margin widens against the protection trip point by the worst-case combination of declared model error
status: active
version: 2
text: |
  No commanded margin today reads the declared per-parameter model-error budget: the existing corner sweeps prove a response settles or a refusal holds, but nothing derives a margin value from declared error and widens the operating band by it. REQ-ROBUST-CONTROL-001.C3 requires commanded margin to account for model error as well as sensing error, and SOL-SIM-ROBUSTNESS-STABILITY-ACROSS-DECLARED-ERROR explicitly excludes computing that margin from its own scope, handing the question to this solution. This solution establishes the commanded margin itself, for the first time, as the gap between a commanded target and the protection trip point — sized against declared model error rather than left at whatever gap the trip point alone implies. The trip point itself was previously undeclared anywhere machine-readable; DEC-PROTECTION-TRIP-POINTS-FROM-PARTS-LIST-LOW-TOLERANCE-END settles it at 107 C (coffee) and 195 C (steam) from the parts-list thermostat rating less its stated tolerance, closing REQ-MACHINE-CONFIGURATION-001.C2 for these two devices as a consequence of this solution's own work.

  For each parameter carrying a declared error, this solution derives that parameter's contribution to the widened margin from its assumed-error fraction. Contributions combine by worst-corner enumeration per DEC-MARGIN-COMBINES-DECLARED-ERROR-BY-WORST-CASE: one corner per coefficient with a path to the trip-point gap, run independently, plus one corner per stated joint dependence (the mains-driven element ratings), run together — the margin is the largest single-corner degradation across every enumerated corner, never a sum across all of them. The widened margin is never smaller than the un-widened trip-point gap and is strictly larger whenever any parameter with a path to that gap carries a nonzero declared error. The widened margin is wired into the delivery commands on both the coffee side and the steam side, so it is what the controller actually enforces rather than a value computed and left unused.

  Verification reuses the existing corner-perturbation apparatus and its established committed-record form (extended to cover this margin's mapping and corner verdicts, per the emulation tooling's docs/protection-margin.md), checking that a delivery still lands within its own tolerance band when commanded at the widened margin's own edge rather than at the nominal one — across every independent corner the declared-error budget implies, and across the one joint corner the reference description's own construction already implies (the mains-driven element ratings sagging together), extending that joint corner's existing settling check with the same margin-adequacy check the independent corners get. The refusal the widened margin enforces, and the delivery commanded at the margin's own edge, are each covered by a dedicated mutation-sensitive test on both loops; the per-corner tolerance sweep itself is unaffected by that refusal by design — the corners it runs never reach the margin's edge on the shipped description, so it is the edge tests, not the sweep, that would fail if the refusal were removed.

  At the shipped reference-machine description, the margin does not currently bind before other limits: on the coffee side the widened margin's edge (102.98 C) sits above the existing saturation ceiling (100 C), which is checked first, and brew.heater_power_w's declared error would need to widen roughly twelvefold before the margin became the operative constraint; on the steam side the margin's edge sits about 63 C above the shipped ready-temperature target. The mechanism is real and directly exercised by its own dedicated tests, but is not, on this machine as currently declared, the binding protection today.

  Out of scope: deriving an equivalent contribution to commanded margin from sensing error — REQ-MEASUREMENT-001.C4, the measurement side of commanded margin, has no covering solution and stays a separate, uncovered gap this solution does not close; a general correlation sweep across every possible pairing of declared-error coefficients, rather than the one dependence the reference description's own construction already implies (already out of scope for the sibling stability solution, and out of scope here for the same reason); characterising whether the stated joint dependence is the real one, which stays a characterisation question the sibling solution already left open; the steam-side corner at steam.feed_flow_ml_per_s's undeclared (one-sided) end, which the corner sweep records as not-claimed per the existing one-sided convention rather than judging it — worth a characterisation look, but not a claim this solution's declared-error budget makes.
rationale: |
  Building the margin computation against the protection trip point, rather than inventing a free-floating margin concept, keeps this solution anchored to the one place REQ-MEASUREMENT-001 and REQ-ROBUST-CONTROL-001.C3 already agree commanded margin means something: the gap the controller must not let a commanded target close against a physical trip point. Establishing that concept here, explicitly, rather than presupposing it already existed, avoids repeating the "already carries sensing error" premise the requirement's own rationale states but that REQ-MEASUREMENT-001.C4 has never actually built.

  Reusing the existing corner-perturbation apparatus for verification, rather than building a second one, keeps one set of courses and one closed-loop harness as what both the settling question (the sibling solution) and the margin-adequacy question (this solution) are checked against — the same reasoning the sibling solution already gives for reusing rather than duplicating that apparatus.

  Extending the joint corner's existing settling check with a margin-adequacy check, rather than declaring the joint corner out of scope, closes the one corner where two declared errors move together and a margin computed as if they moved independently would understate what the widened band must cover — leaving that corner's margin adequacy unchecked would be a known, named gap in a solution whose entire purpose is checking margin adequacy, not a defensible scope boundary.
