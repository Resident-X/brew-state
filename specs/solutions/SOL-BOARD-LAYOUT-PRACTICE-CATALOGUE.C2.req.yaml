id: SOL-BOARD-LAYOUT-PRACTICE-CATALOGUE.C2
type: criterion
title: Before placement, the method requires a written floorplan and a plan for each applicable catalogue item
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Write the step into the method, before placement, and amend the method's existing rules step so that it requires every board's rules to carry each rule-kind catalogue item that applies to the board, with that item as the rule's source. The floorplan places the board's mains, low-voltage, analog sensing and digital regions and its connectors; the plan states, for each catalogue item that applies to the board, how the layout will meet it, and marks the items that do not apply with the reason. The floorplan and plan are committed before any part is placed, so the order is checkable from the repository's history, and a plan item the finished layout does not meet is a finding at review. Out of scope: the review itself, and producing the review views.
