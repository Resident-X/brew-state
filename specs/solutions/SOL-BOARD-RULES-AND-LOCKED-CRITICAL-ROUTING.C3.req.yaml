id: SOL-BOARD-RULES-AND-LOCKED-CRITICAL-ROUTING.C3
type: criterion
title: A tested check records critical-class copper before the routing round trip and fails the board after it on any missing, unlocked, changed or added item
status: active
version: 2
measurement_type: binary
verification: test
text: |
  A check in the board tooling, beside the pre-order gate's own and reading KiCad's files with the gate's S-expression reader, records a board's critical-class copper before the routing round trip and compares the board against that record after it. Recording takes the board, its project file and the names of the board's critical classes, and refuses a named class the design does not define. It resolves which items belong to those classes by asking KiCad, extending the probe the pre-order gate already uses to learn Mains membership to any named class and running it on the board itself with its project file, so the project file's assignments and patterns and any class the layout file carries all count, as KiCad applies them; it never resolves membership by reading either file alone. It records every track, arc, via and zone on those nets: a track by its net, layer, end points and width, an arc also by its mid point, a via by its net, position, diameter, drill and layers, a zone by its net, layers and outline, each with whether it is locked. Recording refuses, naming each item, any track, arc, via or zone on a critical-class net that is not locked, so no critical item enters the round trip unlocked. The record is a working file written where the caller names, taken immediately before export, and is never kept in a design's folder, so the gate never copies it as part of a design; a deliberate re-route after recording needs a fresh record. Comparing takes the imported board, its project file and the record, and fails, naming each item, when a recorded item is missing, no longer locked or changed in any recorded property, or when a critical-class net carries a track, arc, via or zone the record does not hold; items are matched by their recorded properties and counted, so an added item identical to a recorded one is still reported as an addition; the critical nets at comparison are every net the record names as well as every net the critical classes hold then, and a class the record names that the design no longer defines fails the comparison, so a change to class membership between recording and comparing cannot hide added copper; copper on nets outside both is ignored. A record or board that cannot be read fails rather than passes. Recording and comparing are each run by a task-runner command beside the gate's own, needing the same tools, and the comparison's report names each failing item and its changed property. The check's tests drive it on synthetic boards covering each failure and refusal named here, an untouched board that passes, membership by assignment, by pattern and by a class the layout file carries, a change confined to non-critical nets that passes, and malformed input, and run with the tooling's own tests. Out of scope: running the router, and the board's own rule checks, which the gate provides.
