id: SOL-BOARD-RULES-AND-LOCKED-CRITICAL-ROUTING.C3
type: criterion
title: A tested check records critical-class copper before the routing round trip and fails the board after it on any missing, unlocked, changed or added item
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A check in the board tooling, beside the pre-order gate's own and reading KiCad's files with the gate's S-expression reader, records a board's critical-class copper before the routing round trip and compares the board against that record after it. Recording takes the board, its project file and the names of the board's critical classes; it resolves which nets belong to those classes from the project file's net-class assignments and patterns, because the board file does not carry net-class membership, and refuses a named class the project does not define. It records every track, arc, via and zone on those nets: a track by its net, layer, end points and width, an arc also by its mid point, a via by its net, position, diameter, drill and layers, a zone by its net, layers and outline, each with whether it is locked. The record is a working file written where the caller names, taken immediately before export, and is never kept in a design's folder, so the gate never copies it as part of a design; a deliberate re-route after recording needs a fresh record. Comparing takes the imported board, its project file and the record, and fails, naming each item, when a recorded item is missing, no longer locked or changed in any recorded property, or when a critical-class net carries a track, arc, via or zone the record does not hold; copper on nets outside the critical classes is ignored. A record or board that cannot be read fails rather than passes. The check's tests drive it on synthetic boards covering each failure named here, an untouched board that passes, membership by assignment and by pattern, a change confined to non-critical nets that passes, and malformed input, and run with the tooling's own tests. Out of scope: running the router, and the board's own rule checks, which the gate provides.
