id: SOL-POST-DRAW-DISTURBANCE-PROOF-RESTORED.C1
type: criterion
title: The search for a real, closed-loop-driven disturbance scenario is exhausted and recorded
status: active
version: 1
measurement_type: binary
verification: analysis
text: |
  Every admissible way to disturb the casting through a real, closed-loop-driven delivery on
  this reference machine's description is tried and measured -- a steady draw at the standing
  target, a draw served at a different but still-admitted target, an adversarial search over
  admitted course shapes, and a check of whether the plant's own dynamic coefficients could
  produce one within their declared plausible ranges -- and the result of each, with the
  reasoning for why it does or does not count as a genuine disturbance, is recorded in this
  solution's text.

  Out of scope: producing the disturbance itself, or choosing what replaces the two
  TEST_IGNORE'd tests, which is a separate, still-open item's to take up.
