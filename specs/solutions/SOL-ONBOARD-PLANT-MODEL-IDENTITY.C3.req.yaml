id: SOL-ONBOARD-PLANT-MODEL-IDENTITY.C3
type: criterion
title: The reference description travels in the target artefact rather than being read from a path
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  The bytes of `firmware/params/thermoblock.params` are carried into the `env:stm32`
  build as data rather than named by a `REFERENCE_DESCRIPTION_PATH`-style build flag,
  because the target has no filesystem to read one from at start-up. The embedding is
  generated by the build from the description file itself, not by a copy of its contents
  checked into a source tree. Whether the numbers in that description are right for the
  reference machine is out of scope — the provenance recorded against each value answers
  that question where it already lives.
links:
