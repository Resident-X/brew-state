id: SOL-DELIVERY-INFEASIBLE-PROFILE-REFUSED.C5
type: criterion
title: A target above the declared saturation temperature is refused
status: active
version: 2
measurement_type: binary
verification: test
text: |
  The call that sets a target temperature gains the same reporting sibling, and refuses as beyond saturation a target at or above 100.0 °C, the temperature water boils at under one atmosphere. Unlike the other two bounds this one is neither probed nor read from the machine, and the criterion says so plainly: the structures carry no phase change and will report 140 °C of liquid water if the element is left on, so a probe would call such a target reachable, and the figure the descriptions do carry sits in each structure's own parameter record under that structure's own spelling, on the steam side, where the control unit is not entitled to reach. The ceiling is therefore a figure of the delivery path's own: defined once in the control sources, accounting for itself among the loop's declared figures with a documented origin naming the saturation line of the standard steam tables, so that the declaration check refuses it a second home and a reader can challenge it.

  A test refuses 130.0 °C and 100.0 °C, admits 99.0 °C and the suite's 93.0 °C, and reads the ceiling back out of the refusal record rather than spelling it, so the suite carries no second copy of the declared figure. That the ceiling belongs to no structure is shown by perturbation rather than by inspection: the shipped description carries a saturation temperature of its own at the same hundred degrees, so the two agreeing establishes nothing while they agree, and the test rewrites the description's figure to 90.0 °C and requires both that the refusal still reports the declared ceiling and that a 95.0 °C target — above the description's figure, below the declared ceiling — is still admitted.

  One pre-existing test of the temperature command does change, and it is the test this criterion contradicts: it asserted that a 400 °C target is accepted, its own comment recording that reachability was work which did not yet exist. This is that work. The assertion moves to a temperature water can be delivered as, and the criterion that test serves — that the target is an input the control law reads rather than a constant compiled into it — is still fully exercised. Every other attested test of the temperature command is unchanged.

  Out of scope: pressurised operation above saturation, which no requirement asks for and which is the case this fixed figure would have to be revisited for; steam-side targets, which this path does not command; the low end, where a target below ambient is not refused because a machine that cannot cool is not thereby wrong to be asked; and showing the refusal under a second structure's description from this suite, which runs against one structure's environment and has no boiler-side control suite to run in.
