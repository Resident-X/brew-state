id: SOL-ADMISSION-PROVES-CORRECTION-TAKEN.C3
type: criterion
title: A structure is refused admission if the correction-target state does not read back as the value it held after the probe restores it
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Restores REQ-MODEL-STRUCTURE-SEAM-001.C2: after writing the differing value, the admission check writes the held value back and proves that write is accepted and that the state reads back, bit for bit, as the value it held before the probe. A structure whose restore write is refused, or whose state does not read back as the held value, is refused admission on the same terms as any other failing probe, with the instance left not ready so no consumer sees a model the probe displaced.

  Verified by a test built against a structure that accepts the differing write but whose restore does not read back as the held value, and which is refused at admission; and by a held value of not-a-number being restored and admitted.
