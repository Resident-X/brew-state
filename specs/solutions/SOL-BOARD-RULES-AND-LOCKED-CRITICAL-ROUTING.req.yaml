id: SOL-BOARD-RULES-AND-LOCKED-CRITICAL-ROUTING
type: deliverable
category: solution
title: Board rules are written and confirmed before routing, and the nets a board depends on are routed by hand and locked first
status: active
version: 1
text: |-
  The method's pre-routing and routing steps: write every design rule and net class with its figure and source, confirm them in effect on the board by readback, route power, decoupling, ground, mains and sensing paths deliberately and lock them, then let the external router place only what remains.
