id: SOL-HW-MACHINE-AS-FOUND-FIT-RECORD.C4
type: criterion
title: Each characteristic a retained device imposes on whatever drives or reads it is recorded
status: active
version: 4
measurement_type: binary
verification: inspection
text: |
  For every retained device, the wiring record states what the device requires of the circuit that drives or reads it, each as a constraint a replacing board must meet. By device class:
  - each solenoid valve: its coil voltage, its steady current and its inrush current, the inrush bounded above by the top-of-span voltage over the coil's resistance measured cold;
  - each pump: its running current at the top of the declared supply span;
  - each heating element: its resistance;
  - each key and microswitch: its contact type and rating;
  - each temperature sensing element: its resistance at a stated reference temperature and its curve constant;
  - the flow meter: its supply and output type;
  - the buzzer: its type and drive;
  - the gauge driver: its input thresholds, from the datasheet of the part the machine's service documents name, with the revision of the fitted part noted where its marking can be read and stated as unread where it cannot be, the constraint then being the datasheet figure, which the replacing design meets with margin, so no value is held pending for it;
  - each panel indicator element and the low-water indicator: its forward voltage and the current the original drive gives it;
  - each protective-chain device whose wiring reaches the board: its contact rating and what its contact carries;
  - the series resistances inherited on the front assemblies.
  A retained device of a class this list does not name records the quantity the circuit driving or reading it must be designed against, stated in the same way.
  No quantity is measured with the machine energised. A current is taken from the device's own marking or its datasheet. Where neither gives it, the current is a bound with its derivation shown: for a coil, from its resistance measured cold at the stated supply voltage, which overstates an inductive coil's current rather than understating it; for a pump whose coil resistance cannot be read because a series diode hides it, from the nameplate power at the top-of-span voltage and a stated power-factor floor. Each pending mark in the board design constraints record that names this solution, for valve coil current and for pump current, ends with the value and its source. A mark of pending names the work that will settle it and ends only when that work records the fact and its source; every document derived from the record shows the mark rather than a value. Each entry carries its value with units where it has one, its evidence grade from the table of evidence grades in the board design constraints record, as this solution extends it with the grade inspected, kept distinct rather than levelled, and a source a reader holding only the published repository can follow; an inferred entry names the entries it rests on, so a reader can see which claims fall if one of them does; a published source outside the repository, such as a photograph of the same model, is cited by its address and graded published unverified. Where the machine's record or a working design document already states a fact, the entry cites it rather than restating it, and every document in the machine's record folder that restates a fact this record establishes or changes is corrected to match in the same change. Out of scope: designing the circuits that meet these characteristics, and the margin a design applies to these values.
