id: SOL-DELIVERY-INFEASIBLE-PROFILE-REFUSED.C4
type: criterion
title: A target the machine cannot hold against the profile's peak draw is refused
status: deprecated
version: 2
measurement_type: binary
verification: test
text: |
  Admission probes the structure instead of reading its coefficients, because the parameter record is declared per structure and the control unit knows none of its field names. Beside the full-scale flow probe, the control unit stands up a throwaway plant instance from the parameter record it was initialised with, drives the brew heater channel at full scale with the pump at the level the profile's peak rate implies, steps it once by an interval long enough to settle — one hour of simulated time in a single call, exact because the structures integrate as a matrix exponential — and reads back the temperature the water leaves the group at. A settled temperature below the commanded target refuses the delivery as beyond the machine's authority, with the settled figure carried as the figure available.

  The bound is on the pair, so it is applied wherever the pair is completed rather than only where the course arrives. A target named while a course is already running is judged against that course's peak on the same evidence and refused on the same terms, because a delivery commanded before any target was named has no pair to judge and commanding the two in that order would otherwise be a way past the bound entirely. The peak is what is judged rather than the mean: a course gentle for most of its length and heavy for seconds is refused on those seconds, since a delivery that falls out of band while it is drawing hardest is a delivery that failed.

  Under the thermoblock description at the 93.0 °C the suite targets, the balance of 1000 W against 1.2 W/K of standing loss and 4.15 J/mL/K of feed water admits draws up to about 3.0 mL/s and refuses above it; under the boiler description, 1400 W against 2.0 W/K admits about 4.1 mL/s. A test asserts the boundary moves in both directions when the declared heater power is rewritten through the suite's description helper, with no edit to the control source — an implementation that had written the boundary down passes every assertion about which courses are refused and fails that one. The record the probe is built from is the one the control unit was initialised with, which the harness deliberately allows to differ from the machine the truth plant is: a test rewriting only the truth machine's heater power leaves the admission boundary where it was, because admission is a judgement against the description the loop holds and not against a machine nothing has measured. That last test records the property rather than stressing it, and says so — the control unit has no channel to the truth description, so no implementable mistake reaches through it.

  Out of scope: transient authority — a draw admissible in steady state may still dip out of the declared temperature band on the way there, which the tracking criterion and that declared band hold rather than admission; the steam side is out of scope with it.
