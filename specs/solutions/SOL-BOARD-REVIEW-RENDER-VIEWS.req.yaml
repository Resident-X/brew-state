id: SOL-BOARD-REVIEW-RENDER-VIEWS
type: deliverable
category: solution
title: The views a layout review judges a board on are rendered from the board's files by one command
status: active
version: 1
text: |
  A task-runner command that renders, from a board's own design files, every view the layout review judges the board on, together with the facts a picture cannot carry. An image of one layer shows no net names, so a ground drawn as a thin trace looks like any other track; the review needs views that show each critical net against the board, the critical classes against each other, each integrated circuit with its decoupling close enough to judge, and the assembled board in three dimensions. The views are produced by the free tools the method already names, plus a filter over the board file built on the repository's existing board-file reader, and are proven on a throwaway proof design.
