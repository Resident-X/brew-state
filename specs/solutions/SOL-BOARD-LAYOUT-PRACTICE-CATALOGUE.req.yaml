id: SOL-BOARD-LAYOUT-PRACTICE-CATALOGUE
type: deliverable
category: solution
title: The method carries a sourced layout practice catalogue that each board is planned against before placement
status: active
version: 1
text: |
  The method's layout practice catalogue and the design-time step that applies it. The catalogue is the one statement of what a well laid-out board looks like: the designer plans the board against it before placement, every item that can be a rule goes into the board's rules before routing, and the layout review later uses the same items as its baseline checklist. Quality is designed into the first layout from the catalogue rather than reached by repeated review.
