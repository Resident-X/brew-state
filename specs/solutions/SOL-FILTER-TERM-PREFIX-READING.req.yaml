id: SOL-FILTER-TERM-PREFIX-READING
type: deliverable
category: solution
title: A source-filter term is normalised by removing a prefix rather than a set of characters
status: active
version: 2
text: |
  The readers of `firmware/platformio.ini` answer the same question about a source-filter term, and answered it wrongly in the same way. `check_structure_selection.selected` decides which plant structure a build compiles; `build_environments.Environment.links_host_entry_point` decides whether an environment produces a host artefact. Each removed the leading `./` that means "from here" with `lstrip("./")`, which removes every leading `.` and `/` rather than that prefix, so `../plant/thermoblock/`, `/plant/thermoblock/` and `.generated/x` all arrived somewhere other than where they point.

  The reading moves into one module, `firmware/tools/filter_terms.py`, and every caller takes it from there. Each had its own copy of the term-matching pattern as well as its own copy of the normalisation, so what moves is both halves of reading a term; what stays with each caller is what it then asks of the answer, which is a different question in each. How many callers there are is not stated: a third was being written in another branch while this was, and a count is the kind of claim that is true when written and false when merged. A run of separators is collapsed before the prefixes are removed, so a term written `.//app/native/` keeps naming `app/native` rather than becoming an absolute path — the correction must not move an environment between the sets the gates cover, which would be a second defect wearing the first one's fix.

  Out of scope: whether a term reaching outside the source root is a sensible thing for a build to declare, which is PlatformIO's question rather than this project's; canonicalising paths beyond the separators and the prefix, which would be a claim about what a term may say rather than about reading what it says; and `+<*>`, which `selected` has never treated as naming the plant directory and does not begin to here.

  No entry is added to the mutation tool, and the absence is a decision rather than an oversight. That tool drives the real checks against the real sources and counts a mutation as caught only when the command reports having found the problem, distinguishing that from being unable to look. The only path from `platformio.ini` to this check on the real tree runs through a build, and the gate that builds reports being unable to look rather than having found the problem when a build stops — so an entry here would either be scored on the exit code that tool exists to refuse, or would have to declare it expects one. The tests drive the check as a subprocess against a tree carrying each term, which is the same demonstration at the scale where the answer means what it says.
rationale: |
  `lstrip` taking a set of characters rather than a prefix is a standing trap in Python, and both calls read as correct until the argument is one character longer than the thing being removed. What makes it worth a slice rather than a tidy-up is which questions the two readers answer. One of them decides which equations a build compiles, and it answers for the check whose whole job is to refuse a build that has not settled that — so a wrong answer is not something a later step catches, it is the catching step giving it.

  The consequence is loud rather than silent, and worth stating precisely because the temptation is to claim more. A build whose filter reaches outside the root still carries the include path, so it compiles and then fails at the link with the model's operations undefined. That is exactly the arrival `check_structure_selection` was written to replace with a refusal naming the problem, which is what its own docstring says and what the criterion behind it requires. Nothing wrong ships; what is lost is the diagnosis, and in the mirror case a correct build is refused outright.

  The reading is extracted rather than corrected twice. The first instinct was to fix both call sites in place and leave them separate, on the grounds that two callers do not justify a seam — but the defect is itself the argument against that. The two copies had not drifted apart; they were written the same and were both wrong, which is the failure mode a shared reader removes and a code review does not. Correcting them in place would have left the next reader to conclude the idiom was sound, and left a third caller to copy whichever one they found. There were copies of the term pattern as well, which settles it: one module now answers what a term names, and the callers keep only the question each asks of it.

  The correction stays narrow on purpose. It does not reject a term reaching outside the source root, and it does not canonicalise paths — each of those is a claim about what a filter may declare, where this is about reading what it does declare. A build that genuinely wants to compile something from outside its source root is PlatformIO's business, and it will now be told it names no structure, which is true.
