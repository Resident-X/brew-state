id: SOL-HW-MANUFACTURER-BOUNDS-DATED
type: deliverable
category: solution
title: The board manufacturer's fabrication and assembly limits, part availability and prices are recorded with the date each was read
status: active
version: 2
text: |
  Records what the chosen manufacturer can make and assemble, and which candidate parts it stocks for this machine's channels, in which library class and at what price. Each reading is dated and sourced so a later reader can tell when it has gone stale and read it again. Its readers are the Builder (PER-BUILDER-001), who orders the boards and weighs parts against the declared spend, and the agent session that designs a board, which reads the manufacturer's stated limits into each row of that board's design rules from the record's text alone; the partition and feasibility task reads the per-channel readings when it decides each function's form and estimates cost.

  Placement. The fabrication and assembly limits hold for any machine, so they live outside the machine's folder, in a record of their own beside the board design method and named for the manufacturer (docs/board-manufacturer-jlcpcb.md), so a second manufacturer adds a record rather than editing this one. They are not written into the board design method, which stays a lasting how-to free of dated readings. The method is left unchanged: it already names this source only by its role, the manufacturer's stated limits, and asks each design-rules row for the manufacturer and the date the figure was read, which is what each entry of this record carries. The per-channel availability and price readings are specific to this machine, so they are a new section of the machine's design-constraints record (docs/sunbeam-em7000/controller-board-design-constraints.md), which its sibling solutions already extend, with any pending marks they raise added to that record's table of pending marks. The channels are those the component specification enumerates in its table of what each channel requires, and that table governs: the section cites its channel rows and the capability floor already achieved rather than restating them, and never fills in a part chosen or a cost there.

  Rejected placements: hardware/, which holds board designs and the pre-order check only; the machine's folder for the limits, which would tie a machine-independent fact to one machine; extending the earlier design's part-number list or bills of materials in controller-design/, which belong to a superseded direction of bought modules, are not keyed by channel and are not baselined (they are cited where they name a candidate, never extended); and a separate spreadsheet, which splits the record's single-document form for no gain.
