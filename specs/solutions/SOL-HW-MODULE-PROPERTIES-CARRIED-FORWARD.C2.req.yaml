id: SOL-HW-MODULE-PROPERTIES-CARRIED-FORWARD.C2
type: criterion
title: Each property is carried forward as a sourced constraint, set aside with its reason, or pending against named work
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Each property carried forward is stated as a constraint the replacing circuit must meet, not as a description of the module, holds whether the function is later designed or kept as a module, and names the requirement criterion or decision that makes it binding. A property is not carried forward when no requirement or decision needs it, or when the replacing circuit must not inherit it, such as current passed through an open contact or a barrier the module lacked; it is recorded as set aside with that reason and, for one that must not be inherited, the criterion or decision it would breach. Default and failure states are stated as outcomes a designer can check rather than as the parts that produced them, and an output's failure state the record already gives is cited rather than restated. A constraint whose value no datasheet, schematic, requirement or decision fixes is marked pending, naming in words and by its node the work that will settle it: the partition and feasibility task's choice of form for a figure of the module it chooses, or the design task for the board that carries the circuit. Each such mark joins the record's table of pending marks, ends only when that work records the fact and its source, and is shown in place of a value in every document derived from the record. Out of scope: measuring parts, and designing the replacing circuits.
