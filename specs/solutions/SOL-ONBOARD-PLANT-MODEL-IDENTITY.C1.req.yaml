id: SOL-ONBOARD-PLANT-MODEL-IDENTITY.C1
type: criterion
title: The target build compiles exactly one plant structure, and one describing a machine
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  `env:stm32` in `firmware/platformio.ini` gains `+<plant/common/>` and exactly one
  structure directory in its `build_src_filter`, with the matching include path, and that
  structure is one declaring `PLANT_DESCRIBES_A_MACHINE` rather than the fixture, whose
  own header states its equations describe no machine. Compiling exactly one structure is
  not sufficient on its own: the fixture would satisfy a bare count while leaving the
  machine running equations that claim nothing about it. Which structure it is follows
  from the environment, as it does for every host environment, and from nothing read while
  the machine runs. Adding a second machine-describing structure to the target tree is out
  of scope.
links:
