id: SOL-HW-REQUIREMENT-FIGURES-SOURCED.C3
type: criterion
title: The supplying circuit's rating is declared, with the boards' sustained draw budgeted against it
status: active
version: 2
measurement_type: binary
verification: analysis
text: |
  The rating of the supplying circuit and the upstream protection the build relies on are each declared as a figure with its origin in the machine's declared configuration, which the record cites rather than restates, so a reader on a different supply sees a value to replace rather than a silence to inherit. For this machine they are a 10 A circuit, graded owner statement, and a circuit breaker of up to 20 A, graded project assumption. The declared supply span is amended to 216-253 V, the published standard tolerance about 230 V, so that the span the budget is spent against is the span the load figures already use. The sustained draw of everything the boards switch, at the top of that span, is stated against the circuit rating as a budget the controller plans within ahead of time. Out of scope: the arbitration that keeps draw within the budget at run time.
