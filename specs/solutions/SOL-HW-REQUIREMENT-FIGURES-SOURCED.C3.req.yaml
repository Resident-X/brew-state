id: SOL-HW-REQUIREMENT-FIGURES-SOURCED.C3
type: criterion
title: The supplying circuit's rating is declared, with the boards' sustained draw budgeted against it
status: active
version: 1
measurement_type: binary
verification: analysis
text: |
  The rating of the supplying circuit is declared as a figure with its origin, so a reader on a different supply sees a value to replace rather than a silence to inherit, and the sustained draw of everything the boards switch is stated against it as a budget the controller plans within ahead of time. Out of scope: the arbitration that keeps draw within the budget at run time.
