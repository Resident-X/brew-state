id: SOL-HW-REQUIREMENT-FIGURES-SOURCED.C3
type: criterion
title: The supplying circuit's rating is declared, with the boards' sustained draw budgeted against it
status: active
version: 2
measurement_type: binary
verification: analysis
text: |
  The rating of the supplying circuit and the upstream protection the build relies on are each declared as a figure with its origin in the machine's declared configuration, which the record cites rather than restates, so a reader on a different supply sees a value to replace rather than a silence to inherit. For this machine they are a 10 A circuit, graded owner statement, and a circuit breaker of up to 20 A, graded project assumption. The declared supply span is amended to 216-253 V, the published standard tolerance about 230 V, so that the span the budget is spent against is the span the load figures already use. The declared supply frequency is amended to the supply's nominal, 50 Hz, taken from the standard governing that supply rather than from a component's marking, and the record cites REQ-MACHINE-CONFIGURATION-001.C9 for it rather than the criterion it superseded. Every document in the machine's record, or in its working design folder, that restates the supply span, the supply frequency or the rule its provenance answers to, the circuit rating or the upstream protection is corrected to match the amended declaration rather than left to disagree with its source. The sustained draw of everything the boards switch, at the top of that span, is stated against the circuit rating as a budget the controller plans within ahead of time. Consumers of the declared span outside the machine's record and its working design folder are not corrected here and are not left unowned: the plant model's reference description, which restates the narrower 230-240 V span and sizes each element's power uncertainty against it, its accompanying notes, and the simulation results resting on that uncertainty are corrected by SOL-PLANT-MODEL-ELEMENT-POWER-COVERS-DECLARED-SPAN, which follows this amendment. Out of scope: the arbitration that keeps draw within the budget at run time, reading the supply's timing live while the machine runs, and editing the plant model or re-running simulation, which belong to other work.
