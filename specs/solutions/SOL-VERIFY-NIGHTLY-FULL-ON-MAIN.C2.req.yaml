id: SOL-VERIFY-NIGHTLY-FULL-ON-MAIN.C2
type: criterion
title: A scheduled workflow runs the daily verification against main on hosted runners
status: active
version: 2
measurement_type: binary
verification: demonstration
text: |
  A workflow, `.github/workflows/nightly-verify.yml` named "Nightly verification", runs the daily verification's gates against main once a night and on manual dispatch, on hosted runners the code host provides. It provisions what the emulation tier needs on that platform before running. The mutation sweep runs as the existing sharded sweep jobs, made callable from this workflow while still startable by hand, and the sweep workflow's own account of when it runs is updated to say so; the night's result is a failure if any gate or any shard fails, and a scheduled run is not cancelled by a later one. Its actions are pinned to full commit identifiers, its permissions are read-only, and it passes the project's workflow linter clean. It is shown working by a real run that completes against main; a failure in that run caused by the workflow's own provisioning or wiring is fixed here, and a defect a gate genuinely finds in main is recorded as its own maintenance item. If the emulation tier cannot run on hosted runners, the work stops and reports why rather than dropping the tier. Out of scope: running on self-hosted runners, and pull-request verification.
links:
  - target: SOL-VERIFY-NIGHTLY-FULL-ON-MAIN
