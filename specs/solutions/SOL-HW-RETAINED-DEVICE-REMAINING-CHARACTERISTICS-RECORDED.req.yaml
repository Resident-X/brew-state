id: SOL-HW-RETAINED-DEVICE-REMAINING-CHARACTERISTICS-RECORDED
type: deliverable
category: solution
title: The mains-side and position facts the first as-found recording left pending are recorded with their sources
status: active
version: 11
text: |
  Records, in the machine's record, the mains-side and position facts the first as-found recording could not read and that the division of the circuitry between boards rests on, each with its source and evidence grade, so the pending mark it leaves ends with a value rather than an estimate.

  The first recording takes every fact that a device's marking, a datasheet or a reading on the unplugged machine gives. What it leaves for this solution is three facts: which conductor of each load the original board's switching device interrupts, established by tracing the loom with the machine unplugged; what the live supply lead goes to upstream of the board, whether a cord, an inlet or a switch; and the position of the mains-bundle entry and of each mains tab to within 1 mm. The first decides whether a replacing board switches line or neutral and where its fuses go, the second what protects the lead the board is fed from, and the third where the connectors are placed. Each is read from the machine unplugged; none is measured energised.

  Each value is entered in the record in the entry the pending mark stood in, with its unit, its evidence grade from the board design constraints record and a source a reader holding only the published repository can follow, and the mark is removed in the same change. A fact that no inspection of the unplugged machine gives is recorded as a bound with its derivation shown, or stays pending with the reason.

  The retained devices' remaining characteristics, among them the buzzer's type and drive, the panel indicators' forward voltage and series resistances, the contact type and rating of each key and microswitch, the reed element's rating, the flow meter's output type, the temperature elements' curve constant and the protective-chain devices' contact ratings, are not held here. They follow the division of the circuitry into boards, and each is recorded by the design task for the board that carries the device, which records every figure the constraints record holds pending against its board.

  Settled before the build, from the owner's readings of 2026-10-20 on the unplugged machine (owner statements, each entered with its date):

  - Upstream of the live lead. The brown lead ends at the pin marked L of the machine's own mains lead, a fixed cord with a standard Australian 10 A plug with an earth pin, marked 7.5-10 A 250 V (inspected). There is no switch and no appliance inlet between the plug and the board. Brown reads continuous to the L pin and to the board's LINE tab (measured, continuity). A detachable inlet with an inline fuse in place of the cord was an option the owner was considering at that date; the owner has since ruled that the machine keeps its fixed lead and fits no inlet, so it is not an arrangement of this machine.
  - Which conductor the board switches. LINE1 reads 0 ohm to LINE, and LINE is the active by the continuity above; LINE1 daisy-chains to one side of every pump, valve and thermoblock element, so terminals 4 to 9 are each load's other lead. The owner traced the NEUTRAL tab as the input that runs to the board's switching devices, which the owner calls relays and triacs, and from those devices to the other tabs: the original board therefore switches the neutral side of every load. This is graded inspected (the owner's trace of the unplugged board). Which device serves which terminal is not recorded, because a replacing board does not reuse those devices and nothing in the record depends on the pairing; the record says so. The circuit diagram's line-side drawing is recorded as the contradicting reading that the owner's trace overrides. Which conductor a replacing board switches is a design choice of the board that carries it, and the record states that either side serves the loads, that both pumps carry a series diode in their own leads (the owner's statement of 2026-10-20 from a meter reading of open in one polarity and megohms in the other on each pump, graded inferred), and that each diode conducts on the opposite mains half-cycle if the board feeds that pump's common from neutral instead of active; the record names that as a fact the half-cycle actuation depends on, without deciding it.
  - Positions. The nine tabs' centres are at X = 8.5 mm in the datum frame, and at Y = 13.6, 22.3, 30.6, 52.9, 66.2, 79.1, 91.4, 101.2 and 111.4 mm for terminals 1 to 9, the owner's rule readings 12.5, 21.2, 29.5, 51.8, 65.1, 78.0, 90.3, 100.1 and 110.3 mm plus the owner's measured 1.1 mm from the datum to the rule's known point. Each tab is 6.36 mm wide by calipers (the owner reads 6.35 mm, which agrees within the 0.1 mm tolerance), 0.81 mm thick and stands 9.9 mm clear of the board. The values are carried at the record's tolerance of 1 mm, graded measured, replacing the inferred 2.5 mm offset the earlier board-edge figures used. The owner states that cable slack leaves a fit need of about 10 mm, looser than the 1 mm this solution reads to; criterion C1 is unchanged, and the owner's slack is recorded as the basis for the fit need. The mounting points' positions already in the record are the datum's reference and are not re-read.
  - Chasing. A changed fact is chased through every document that restates it: the table of what the OEM boards switch each load with in the machine's reference record, its mains-bundle entry row, the connector pinouts' tab table, entry paragraph and live-feed paragraph, the pending-marks index in the constraints record, and the controller-design working files that restate switching side or tab positions.
