id: SOL-FLOW-FIXTURE-STATE-CORRECTABLE.C1
type: criterion
title: A structure control_init accepts as reconstructing a state answers that state to the estimator's own correction path
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Restores REQ-MODEL-STRUCTURE-SEAM-001.C2 for `native_flow_fixture`: `plant_model_state` answers `PLANT_STATE_BREW_HEATED_MASS_TEMPERATURE_C` for this structure, or the estimator's channel-to-state correspondence is reconciled so the quantity `correct_against` reads for the brew-temperature channel resolves to the same state `control_init`'s own reachability check already probes -- so `correct_against` succeeds against `flow_fixture` on a step carrying a valid, in-bounds brew-temperature reading.

  Verified by extending `firmware/src/app/native/main.c`'s host exercise against `native_flow_fixture`: `exercise_untargeted_steps` and `exercise_actuating_steps` complete their full run of `EXERCISE_STEPS` control steps, and `task fw:run` exits 0, with a continuously valid sensor reading present throughout. Reconciling the estimator's channel-to-state correspondence for the other three structures, and any change to the loss-tolerance window or the correction gain, are out of scope -- this restores agreement for the one structure found inconsistent, not a retuning of a mechanism the other three already satisfy.
