id: SOL-PLANT-SEAM-GATE-COVERAGE
type: deliverable
category: solution
title: Every gate that guards the seams discovers its subjects rather than being given a list
status: active
version: 1
text: |
  The gates that guard the seams discover the structures and environments they cover instead of being handed a list of them. Today several are handed one. The check task in `firmware/Taskfile.yml` invokes the exclusivity check once per structure with the structure named on the command line and checks that calls through a seam are direct against one named artefact — so a structure whose lines nobody writes is not checked, and nothing says so. The analysis gate has the same shape from the other direction: it is verified against one named environment, so an environment added later could drop the sanitizers or the strict warning settings and no gate would notice. The task that runs the host artefacts names its artefact and parameter-description pairs by hand as well, which matters more than it looks, because a sanitizer reports nothing until the code runs. The task that runs the tests names its environment the same way, and that one is worse: a forgotten entry there produces no error at all, only tests that quietly never ran.

  The analysis point is a narrower claim than it might appear. Every host environment already gets the analysis: the sanitizer script sits on the shared base configuration and the strict warning settings are inherited from it, so the fixture environment compiles this project's sources with both, and the full gate already runs its binary under them. Nothing is unanalysed today. What is missing is that only one environment is ever checked to be, and a guarantee nobody verifies is one that decays the first time somebody adds an environment in a hurry.

  A gate discovers its subjects when they are a homogeneous set that grows with the tree, and names them when each named subject plays a distinct role in what the check means. Both plant-header checks name their header because each carries a different obligation — one is a seam, one is a vocabulary. The check that the control logic is identical across two builds names exactly two environments because comparing that pair is what the check is. The check that a misconfigured build is refused names the environments required to fail, and a forgotten name there fails loudly rather than silently, which is the opposite of the failure this change removes. The check that parameters are read as data needs two descriptions differing in a single coefficient before it can conclude anything, so discovering it per structure would demand a second description from every structure — a claim about what a structure must ship, not about how a gate is invoked, and not one this makes. Those keep their names.

  The environments required not to build are excluded from the analysis gate by name and with the reason recorded, since demanding a clean analysed build of a configuration that must not build at all would contradict the criteria requiring it to stop. The test environment keeps its own recorded exception from the strict warning settings, because the test runner's generated support file is compiled through the same path as this project's sources there and cannot be given different flags — an exception `firmware/platformio.ini` already states, alongside the fact that the same translation units are compiled strictly by the machine-describing environment. The target build is outside both obligations: it belongs to a different tier and its warning policy was chosen against a different toolchain.

  Every converted gate fails when it finds nothing to cover, because a gate that discovers an empty set reports success in exactly the way a gate nobody ran does.

  Out of scope: what the checks check, which is unchanged — this changes how they are reached, not what they conclude; the four gates that name their subjects, each for the reason recorded above; requiring a second parameter description from every structure, which is a claim about the seam and is not made here; re-imposing the strict warning settings on the test environment or extending them to the target build, both of which would overturn recorded decisions rather than honour them; and the list of environments the build task builds, which stays as it is because a forgotten entry there means an artefact that does not exist, and the discovered gates stop with an error on a missing artefact rather than passing over it — loud, which is the failure mode this change is trying to reach, not the one it is trying to remove. Adding any structure or environment is out of scope too; this makes it cheap rather than performs it.
rationale: |
  A check that has to be remembered is not a check. A gate invoked once per structure with the structure named provides not "every structure is exclusive" but "every structure somebody wrote a line for is exclusive", and the difference is invisible in a green build. The same shape appears wherever a gate names the artefact or the environment it covers: what is not named is not uncovered loudly, it is uncovered silently.

  The discriminator between discovering and naming is whether the named subjects are a set that grows and whether each name carries meaning. Structures, host artefacts and environments all grow as the project does, and each addition is a chance to forget. A gate that names exactly the two builds it compares, or the two configurations that must fail, is not carrying a list at all — the names are the content of the check, and a missing one produces an error rather than a silence. The check that parameters are read as data sits on the second side for a different reason again: it needs a pair of descriptions to conclude anything, so converting it would not change how a gate is invoked, it would impose a new obligation on every structure. That may well be the right obligation. It is not this node's to assume.

  Execution is included because that is where the analysis actually happens. A sanitizer is a run-time instrument; an environment verified to compile and link instrumented, and then never executed, satisfies the letter of the check while producing no analysis at all. A leaf arguing that gates should not depend on somebody remembering would be a poor one if it left the running of the artefacts depending on exactly that.

  This is deliberately not routed as remediation of closed work, and the reason is narrower than it first appeared. No source of this project's own reaches a host artefact outside the analysis today: the sanitizers and the strict warning settings are inherited by every host environment from the shared base configuration, so the outcome the closed criterion stated was honoured and is still holding. What is missing is generality — the gate verifies that outcome for one environment rather than for whatever environments exist. Requiring a check to hold against environments nobody has added yet is a wider claim than the one already made, not an unmet one, so it is authored as new scope rather than as a shortfall.

  It is kept out of the slice that adds a second structure on the axis that separated the channel contract from it. Converting a gate invocation edits shared build configuration; demonstrating that a structure can be added without touching anything else cannot be done in a slice that touches shared build configuration. Sequenced before it, this makes that slice's additivity claim true rather than exempted, and leaves it owing four environment entries, two lines in the task file and one further argument: the environments that build it, run its tests and give the two-structure refusal something to refuse for it, the key confining each test environment to its own suites, the build line, the parameters-as-data invocation over its own descriptions, and the argument naming the misconfigured configuration. Its tests need no task-file line at all, because the task that runs them discovers its environments. Every one is a subject some gate names by design, for the reasons above, and admitting the cost is the honest form of leaving them named.

  The exceptions are named rather than assumed because an unexplained exclusion and an oversight look identical six months later, and this whole change is an argument that the difference matters. That applies to the test environment's warning settings and to the target build as much as to the configurations required to fail. A gate that overturned a recorded decision would be enforcing a rule against the decision the rule exists to serve.
