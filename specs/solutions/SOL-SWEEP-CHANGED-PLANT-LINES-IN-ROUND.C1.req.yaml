id: SOL-SWEEP-CHANGED-PLANT-LINES-IN-ROUND.C1
type: criterion
title: The round gate sweeps the mutants drawn from the plant lines the branch changes
status: active
version: 1
measurement_type: binary
verification: test
text: |
  When the branch changes lines in the mutation sweep's population, as the sweep itself derives that population from the tree, the round gate runs the sweep restricted to the mutants on those changed lines, measured from the branch's merge-base with main. Survivors drawn are judged against the triage record as the full sweep judges them; a judgement whose mutant lies outside the restricted population is not reported stale in this mode. For every file the branch changes in the population, the round also checks each existing judgement in that file against the file's whole current population, so a judgement stranded by lines moving is caught in the round rather than at night. When the branch changes no line in the population, the round runs no sweep and says so. Whether the restriction uses the mutation tool's own changed-lines mode or filters the drawn population is the builder's choice; the population must be the same either way. Tests or a demonstration show a seeded surviving mutant on a changed line failing the round, a stranded judgement in a changed file failing the round, and an unchanged line's mutants not being drawn. Out of scope: the full population, which the nightly sweeps.
