id: SOL-SWEEP-CHANGED-PLANT-LINES-IN-ROUND.C1
type: criterion
title: The round gate sweeps the mutants drawn from the plant lines the branch changes
status: active
version: 3
measurement_type: binary
verification: test
text: |
  When the branch changes lines in the mutation sweep's population, as the sweep itself derives that population from the tree, the round gate runs the sweep restricted to the mutants on those changed lines, measured from the branch's merge-base with main by the same rule the round gate already uses to select the emulation tier (the remote-tracking main, counting uncommitted edits and new files). A changed line is a line on the new side of a zero-context diff from that merge-base to the working tree, and every line of a new, untracked file in the population. A population file counts as changed when it has any such hunk, including a hunk that only deletes lines and a file the branch deletes outright.

  Survivors drawn are judged against the triage record as the full sweep judges them; a judgement whose mutant lies outside the restricted population is not reported stale in this mode. For every file the branch changes in the population, the round also checks each existing judgement in that file against the file's whole current population, so a judgement stranded by lines moving, or by the file being deleted, is caught in the round rather than at night. Whether the restriction uses the mutation tool's own changed-lines mode or filters the drawn population is the builder's choice; the population must be the same either way, new untracked files included. The restricted run reports its build and execution time through the same timing record and table the full sweep uses.

  The sweep runs after the host tier, and after the emulation tier when that runs, and is not reached when an earlier tier has failed. When the branch changes no line in the population, the round runs no sweep and does not need the mutation toolchain. When the round cannot tell which population lines the branch changes, the host tier and the emulation tier still run as they already do in that case, and the sweep step then fails the round, naming the cause and what to do about it, running neither a restricted nor the full sweep. When the branch changes population lines and the host lacks the toolchain the sweep needs, the round fails and says the toolchain is missing.

  The round gate's closing lines state the whole round's verdict once the sweep runs, so a gate worker reading them never reports a pass before the sweep's own result. They say whether the sweep ran, was skipped because the branch changes no line in the population, was not reached, or could not run, and when it ran, how many changed lines it covered and its result, distinguishing a sweep that found a problem from one that could not look. Every statement of what the round gate runs, wherever it is made (the task descriptions for the round gate and the sweep, the round gate's own description of itself, the firmware documentation, and the project instructions), says the round runs the changed-lines sweep and never the full one, and none still says the sweep is absent from the round.

  Tests or a demonstration show a seeded surviving mutant on a changed line failing the round, a stranded judgement in a changed file failing the round, an unchanged line's mutants not being drawn, a branch with no population change running no sweep, and an unmeasurable change failing the round. Out of scope: the full population, which the nightly sweeps.
