id: SOL-UNMEASURED-STATE-RECONSTRUCTION.C2
type: criterion
title: The estimator reconstructs a quantity no sensor channel reports
status: active
version: 1
measurement_type: binary
verification: test
text: |
  At least one `plant_quantity_t` the estimator answers for corresponds to no member of
  `hw_sensor_channel_t`, and a host test reads a usable value for it after stepping the
  estimator against readings drawn only from the channels that do exist. Reading a
  quantity before the instance has been initialised, or one outside the enumerated set,
  is refused rather than answered with a default. Whether the reconstructed figure is
  close enough to control a real machine with is out of scope — this criterion asks only
  that the gap between what is sensed and what is needed is closed at all.
links:
  - target: SOL-UNMEASURED-STATE-RECONSTRUCTION
    type: criterion-of
