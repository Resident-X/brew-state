id: SOL-BOARD-LAYOUT-REVIEW-FEEDS-RULES.C2
type: criterion
title: Every review finding that can be expressed as a rule is added to the rules
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  For every recorded review finding, the method requires a stated judgement of whether it can be expressed as a design rule: a finding is expressible exactly when the automated pre-order rule check can enforce it, as a board-wide minimum, a net class's figure or a custom rule. Each one that can is added to the layout practice catalogue as a rule-kind item, with its figure and source like any other rule and naming the review it came from, so the rules step carries it into every later board's rules and it is checked without being remembered. A finding that needs judgement on the rendered views instead is added to the catalogue as a judgement-kind item when it holds for any board, or to the board's own checklist items when it holds for one machine only. A figure that depends on one machine is written in the catalogue by its role, its number living in that machine's board rules, so the method holds no machine's data. Separately, a finding of safety or function severity in a board's first full review, against an item the board's design-time plan said it would meet, is recorded as a planning shortfall too, and the catalogue item or the planning step is amended so a later board's plan would not miss it. A finding judged expressible but not added, a planning shortfall not acted on, or one with no recorded judgement, fails the step. Out of scope: building the automated check that runs the rules.
