id: SOL-VERIFY-DAILY-STATUS-READ-FIRST.C2
type: criterion
title: The operator session launcher reads the daily status first and offers a red result as the first choice
status: active
version: 3
measurement_type: binary
verification: inspection
text: |
  This repository's own session launcher (its start-work skill) makes one read of the daily status its first act, shown above the target list, and is shown doing so against a real nightly result. The launcher reads the status unconditionally, since the command always exists. When the status is red, the list gains a first option to fix that failure, carrying the run's link. A red result adds the option and nothing else: the launcher does not investigate before the operator picks. An unknown or none result is shown above the list, adds no option and does not delay the target question. Out of scope: the corrective work itself, which goes through the maintenance lane.
links:
