text: |
  The classification's three classes — invariant, bounded, and degrading — are named accurately here, and this solution's claim is scoped to one entry of the invariant class, refusing what cannot be delivered, rather than to the classification's other three entries or to either of the other two classes.

  Restating a class other than invariant, or an invariant behaviour other than the one this solution exercises, as if it were covered here is out of scope.
