id: SOL-PLANT-STRUCTURE-SEAM-SECOND-STRUCTURE
type: deliverable
category: solution
title: A second machine architecture behind the plant-structure seam
status: active
version: 1
text: |
  A second machine-describing structure sits behind the already-shipped plant-model seam, and it is a different architecture rather than the same equations with different numbers: a single heated vessel serving both the brew path and the steam path, where the reference machine has two independently heated masses. It defines its own state and parameter types under `firmware/src/plant/`, implements every operation the seam declares, and answers all four quantities the seam enumerates from its own states — so both temperature quantities follow one heater. Two parameter descriptions ship with it under `firmware/params/`, differing in a single coefficient so that the check that coefficients are read rather than compiled in has something to conclude from, and both state explicitly that they describe no real machine — which is both the truth and what exempts them from carrying a recorded origin against each value.

  Because that architecture has one heater where the reference machine has two, it is the first structure behind this seam that does not answer every actuation channel the machine's vocabulary carries. It does not have to negotiate anything for that: the seam already requires a structure to state which channels it answers and already refuses a command on one it does not, so this structure states its narrower set and complies with a contract that was in place before it arrived. The same is true of what it says about itself — the support-status vocabulary already exists and it states its value under it — and of the gates that check it, which already cover every structure they discover. All three are prerequisites of this work rather than parts of it, each delivered by its own leaf, precisely because establishing any of them edits things already behind the seam, which is the opposite of the claim this slice exists to make.

  What the addition demonstrates is what it does not touch. Introducing it changes no file under an existing structure's directory, neither of the seam headers, not the shared parameter loader, not the check tools, not any gate invocation that discovers its subjects, no existing test suite, and no translation unit that consumes the model; what it adds is its own directory, its own two parameter descriptions, its own test suite under `firmware/test/`, four environment entries in `firmware/platformio.ini` — one that builds it, one that runs its tests, one deliberately misconfigured configuration naming it alongside an existing structure, and the key on the test environment that already exists confining each test environment to its own suites — two lines and one further argument in the task file, and the documentation that says what it is. Every one of those is a subject something names by design: the build entry because a forgotten one yields no artefact, the parameters-as-data invocation because that check needs a pair of descriptions before it can conclude anything, and the added argument on the refusal check because a build that must not succeed cannot be discovered from among builds that must. The test environment costs no line at all — the task that runs the tests discovers the environments it runs. A seam that has to be renegotiated for each addition is not a seam, and every renegotiation risks changing behaviour an existing machine depends on.

  The checks that discover their subjects take the enlarged set up with nothing hand-maintained edited. They read the structures from the source tree and are invoked over everything they find, so the exclusivity they enforce now holds across every pair rather than only the pair they were written against, and the encapsulation check treats the new structure's own names as owned by it and fails a consumer that names them. A build naming the new structure alongside either existing one stops rather than letting the linker choose, and that guarantee is bought rather than inherited: the check providing it names the configurations it refuses, so this structure adds one and names it. The artefact built for the new structure carries its symbols and none of the others', and the artefacts built for the existing structures are unchanged by its arrival. The environment it adds falls inside the analysis gate rather than beside it, because that gate covers every environment producing a host artefact, and its artefact is run rather than merely built, because the task that runs them discovers them too.

  The new structure is published as unverified against hardware, stated where an adopter reads it before running it. Nobody on this project has a machine of this architecture, and the requirement makes supported status conditional on verification against one, so unverified is the correct final state of this claim rather than a gap left open. Making that statement is part of adding a structure rather than a separate concern: a structure published without one is published as though somebody had checked.

  Out of scope: whether the new structure's equations describe any real machine, which cannot be settled without one; the reference machine's own values and the origins recorded against them; the actuation-channel contract, the support-status vocabulary and the gates' coverage, all established before this work and none revisited by it; enlarging the seam's vocabulary of quantities for an architecture the present set cannot express, which would be a change to the seam rather than an addition behind it; and the control law and state estimator that will later consume the interface, including what either does when a command is refused. The new structure's equations may be the thinnest set that expresses its architecture, because what is established here is that the seam admits one, not the fidelity of its physics.
rationale: |
  The seam's central claim — that supporting a different architecture is implementing an interface rather than negotiating with everything that consumes the model — has so far been made by a seam with one machine-describing structure behind it and a fixture that describes nothing. That is the configuration in which the claim is cheapest to believe and least tested. The property stops holding quietly, the first time a second structure is added by editing the first, and nothing already in the graph would notice.

  The second structure is a different architecture on purpose. A structure of the same architecture with different numbers exercises the parameter path, which is already covered and is a weaker claim: the adopter promise the requirement draws distinguishes machines that differ in their numbers from machines that differ in their equations, and only the second kind tests whether the seam is drawn in the right place. A single heated vessel serving both paths is the sharpest available contrast to two independently heated masses, because it answers both temperature quantities from one state and responds to fewer actuation channels than the vocabulary carries. It does not test whether the quantity vocabulary is sufficient for architectures it cannot express; that is a different question and a change to the seam rather than an addition behind it.

  Designing this structure is what exposed three things the seam had not been asked for, and none of them is answered here. Every structure must say which actuation channels it answers; every structure must say whether hardware has verified it; and the gates must cover every structure and environment rather than the ones somebody remembered to name. Each of those means editing structures, seams and consumers that already exist, and this slice exists to demonstrate that adding a structure edits none of those. One slice cannot honestly make both claims: absorbing any of them would put a real change to standing behaviour inside a criterion that states its costs, where it would read as one more line of bookkeeping rather than as the thing it is. So each is its own leaf, sequenced before this one, and this slice arrives at a seam that already requires what it needs.

  The demonstration that nothing else changed is the diff, not a test, and that is the honest way to state it. No standing assertion can catch a future addition made by editing an existing structure, because the edit would be made by whoever also owns the test. What can be made standing is the surrounding set: the gates that discover their subjects, which admit the new structure with nothing written for it, and exclusivity that now holds pairwise across three. The refusal of a two-structure build stands over the enlarged set as well, but not for nothing — it is driven against a configuration this slice adds and names, which is why that cost is stated rather than claimed away. Those catch the regressions a later addition would produce; the change-set analysis catches the one this addition would.

  The new environment falls inside the analysis gate because that gate was widened before this slice rather than by it. A tier's criterion closes against the subject that existed then, and equations arriving in an environment outside the sanitizers is exactly the class of defect that tier exists to catch — so the widening is a prerequisite, and what this slice owes is only that its own environment be one the widened gate covers.

  Publishing the structure as unverified stays with this slice because it is inseparable from the act of adding a structure, even though the vocabulary it states that in comes from elsewhere. An adopter who discovers by running it that nobody has verified it has discovered it too late. The exemption its parameter description carries from recording an origin per value rests on a statement of the same kind: a description that says it describes no real machine has no origins to record, and it earns that by saying so rather than by which structure it belongs to.
