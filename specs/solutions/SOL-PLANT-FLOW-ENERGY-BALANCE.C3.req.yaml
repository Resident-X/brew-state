id: SOL-PLANT-FLOW-ENERGY-BALANCE.C3
type: criterion
title: The casting and the outlet advance as a coupled pair
status: active
version: 1
measurement_type: binary
verification: test
text: |
  The two states are integrated together over the interval the seam declares, replacing the two
  independent closed forms — one exact for a mass losing heat only to ambient, one exact for a block
  traversed linearly — which stop being exact once each state enters the other's equation. The scheme
  is chosen so its truncation error over the declared interval is bounded and stated. Adapting or
  subdividing the interval at run time is out of scope; the interval remains the one the seam declares.
