id: SOL-HW-GATE-IN-ROUND-AND-NIGHTLY
type: deliverable
category: solution
title: The board check runs in the build round for board changes and nightly on main
status: active
version: 1
text: |
  The pre-order board check runs at the same two cadences as the rest of the project's verification. The build round's gate gains a hardware tier: it runs the board check whenever the branch changes a tracked KiCad file, anything under the hardware tree, or the check's own tooling, measured from the branch's merge-base with main in the same way the round already decides whether to run the emulation tier, and it runs the tier anyway when it cannot tell what changed. A firmware-only branch does not need KiCad. The complete verification's single declaration lists the board check, so the nightly run of main, which runs exactly that declaration, runs it too, on a hosted runner with KiCad installed from a free, named source at the required version.

  The board check, its tooling tests and its seeded-fault proof already exist and run from the task runner; this solution only decides when they run. It follows the cadence decision's shape rather than adding a new one.
rationale: |
  The verification-cadence decision makes the build round's gate the only verification a change gets before it merges, and the nightly run the record of what main last verified. Both were defined over the firmware's gates before any board check existed, so a board design could merge without the round running the board check and without the nightly ever running it. The parent task's own statement is that a design is checked automatically before it can be ordered; this is the work that makes that true. It is sequenced before the partition task because the partition creates the per-board design tasks, and no board design should be started before its changes are checked automatically.
