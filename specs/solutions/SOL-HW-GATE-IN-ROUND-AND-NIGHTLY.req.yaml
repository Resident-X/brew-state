id: SOL-HW-GATE-IN-ROUND-AND-NIGHTLY
type: deliverable
category: solution
title: The board check runs in the build round for board changes and nightly on main
status: active
version: 5
text: |
  The pre-order board check runs at the same two cadences as the rest of the project's verification. The build round's gate gains a hardware tier: it runs the board check whenever the branch changes a tracked KiCad file, anything under the hardware tree, anything a board design reads (its sheets, libraries and library tables, and the separation basis record it is held to), or the check's own tooling, the round gate's own code, or the task definitions, measured from the branch's merge-base with main in the same way the round already decides whether to run the emulation tier, and it runs the tier anyway when it cannot tell what changed. The task definitions are taken as the whole task-runner definition file, as the emulation tier takes them, so a firmware branch that edits that file also runs the board tier. A KiCad design file present in the working tree but not yet tracked by git counts as a change to a board design, and the round fails naming it, since the check finds only tracked designs and must not pass one unseen. A design tracked or removed while the gate runs is judged as the gate found it when it measured the change, and the next run judges it afresh. A branch that changes none of those paths, a firmware-only branch that leaves that file alone included, does not need KiCad. The complete verification's single declaration lists the board check, so the nightly run of main, which runs exactly that declaration, runs it too, on a hosted runner with KiCad installed from a free, named source at the required version.

  The board tier is judged on paths alone. It runs when the changed paths are unknown or when listing what a design reads fails, and not on unknown changed lines alone, which the emulation tier also runs on. It runs after the host and emulation tiers and before the changed-lines sweep. A failure stops the round and the sweep is reported as not reached. The round's closing lines state whether the board tier ran, why it was skipped, or that it was not reached. The builder, and the AI agent that runs the round on the builder's behalf, read those lines and the named-tool stops, so each is a plain self-contained statement a weaker agent can report without reading the gate's code.

  The board check, its tooling tests and its seeded-fault proof already exist and run from the task runner; this solution only decides when they run, as the verification-cadence decision now sets out. The seeded-fault proof stays on demand, and the proof is part of the tooling test suite today, so the round and the nightly run the tooling tests without the tests that run the proof. The full suite stays runnable on demand. The tooling tests need the SVG rasteriser and a monospaced font that the layout review views use, so the round's board tier and the nightly runner require them, and the hardware notes stop describing the rasteriser as needed only for the review views. The firmware documentation's accounts of the round gate's tiers and of the nightly's contents name the board tier alongside the project instructions and the hardware notes. Where the hosted runner's KiCad comes from, and the pins for the rasteriser and the font, are settled when the nightly run first demonstrates them.
rationale: |
  The verification-cadence decision makes the build round's gate the only verification a change gets before it merges, and the nightly run the record of what main last verified. Both were defined over the firmware's gates before any board check existed, so a board design could merge without the round running the board check and without the nightly ever running it. The parent task's own statement is that a design is checked automatically before it can be ordered; this is the work that makes that true. It is sequenced before the partition task because the partition creates the per-board design tasks, and no board design should be started before its changes are checked automatically.
