id: SOL-BOARD-RULES-AND-LOCKED-CRITICAL-ROUTING.C2
type: criterion
title: Every net in a critical class is routed to its stated rules and locked before any automated routing runs
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  The method names the critical classes as including at least power, decoupling, ground, mains and sensing paths, and requires every net in every critical class to be routed deliberately to its stated rules and locked before any automated routing is run. Automated routing is run only through KiCad's exporter, the external router from its command line and KiCad's importer, places only what remains unrouted, and cannot move a locked track; a locked track changes only by a deliberate re-route that is itself locked again. Every track on a critical-class net is recorded before export, and after import each recorded track must still be present, locked and unchanged; a missing, unlocked or altered one fails the step whatever the router or importer reported. The router's own report of no violations is not accepted as evidence; the board's own electrical and layout rule checks are run after import. A board on which any critical-class net was placed by the automated router fails the step. Out of scope: judging layout quality, which is the layout review step, and choosing which nets of a particular board are critical beyond the named classes, which is that board's own design work.
