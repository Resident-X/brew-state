id: SOL-BOARD-RULES-AND-LOCKED-CRITICAL-ROUTING.C2
type: criterion
title: Every net in a critical class is routed to its stated rules and locked before any automated routing runs
status: active
version: 4
measurement_type: binary
verification: inspection
text: |
  The method names the critical classes as including at least power, decoupling, ground, mains and sensing paths, and requires every net in every critical class to be routed deliberately to its stated rules and locked before any automated routing is run. Automated routing is run only through KiCad's exporter, the external router from its command line and KiCad's importer, places only what remains unrouted, and cannot move a locked track; a locked track changes only by a deliberate re-route that is itself locked again. The board is closed in any editor holding it before export and reopened after import, so no editor works on a stale copy. A copper zone on a critical-class net, such as a ground or mains pour, is deliberate routing like a track: it is drawn and locked before export. Every track, via and zone on a critical-class net is recorded before export and compared after import with the board tooling's locked-copper check, never by hand. After import, each recorded item must still be present, locked and unchanged, and no critical-class net may carry a track, via or zone that was not recorded; a missing, unlocked, altered or added one fails the step whatever the router or importer reported. The method names where a reader who is not the author obtains the external router and the runtime it needs. The router's own report of no violations is not accepted as evidence; the board's own electrical and layout rule checks are run after import. The step is stated so a designer or an agent session with no prior context carries it out from the method's text alone, without reference to this project's graph identifiers or its author's context. That covers reaching the exporter and importer, locking, recording and comparing, and running the checks after import, each with whatever it requires of the board's state written in the method. A board on which any critical-class net was placed by the automated router fails the step. Out of scope: judging layout quality, which is the layout review step, and choosing which nets of a particular board are critical beyond the named classes, which is that board's own design work. Out of scope also: the demonstration that a fresh agent session follows the whole method end to end, which SOL-BOARD-METHOD-FOLLOWABLE-AND-MACHINE-FREE owns; this step's own self-sufficiency is shown by inspection of its text.
