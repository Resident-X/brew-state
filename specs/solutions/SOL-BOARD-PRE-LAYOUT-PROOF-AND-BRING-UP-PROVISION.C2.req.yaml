id: SOL-BOARD-PRE-LAYOUT-PROOF-AND-BRING-UP-PROVISION.C2
type: criterion
title: Every board is laid out for bring-up and a second spin
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  The method requires every board to carry a test point on every supply rail and on each key signal the board's design names, a link by which every rail can be isolated from its loads, and a means by which first power can be current-limited that is carried on the board or needs only what a builder without a laboratory has, such as a series resistor or lamp in a link position, because a first spin is expected to need changes and must be diagnosable when it does. A board on which any rail lacks a test point or an isolating link, or whose first power cannot be current-limited, fails the step. The step is stated so a designer or an agent session with no prior context carries it out from the method's text alone, including what counts as a rail (ground and return nets are the reference, not rails, and carry no isolating link; a mains-referenced supply net is a rail whose test point and link are held to the board's separation basis like any other mains copper) and how to tell a key signal, without reference to this project's graph identifiers or its author's context. Out of scope: carrying out bring-up on built boards, and choosing which signals of a particular board are key, which is that board's own design work.
