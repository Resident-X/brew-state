id: SOL-BOARD-PRE-LAYOUT-PROOF-AND-BRING-UP-PROVISION.C2
type: criterion
title: Every board is laid out for bring-up and a second spin
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  The method requires every board to carry a test point on every supply rail and on each key signal the board's design names, a link by which every rail can be isolated from its loads, and a means by which first power can be current-limited that is carried on the board or needs only what a builder without a laboratory has, such as a series resistor or lamp in a link position, because a first spin is expected to need changes and must be diagnosable when it does. A board on which any rail lacks a test point or an isolating link, or whose first power cannot be current-limited, fails the step. Out of scope: carrying out bring-up on built boards, and choosing which signals of a particular board are key, which is that board's own design work.
