id: SOL-VERIFY-DAILY-STATUS-READ-FIRST.C1
type: criterion
title: The daily status reader states main's latest nightly result and never reports a result it could not read
status: active
version: 3
measurement_type: binary
verification: test
text: |
  A task-runner command named check:daily reads the nightly workflow's run history for main through the GitHub command-line tool and prints the latest run that completed, by any scheduled or manual trigger. The first output line is a fixed verdict word: green when the conclusion is success, red when it is any other completed conclusion except cancelled, skipped or neutral (a timed-out run or one that failed to start is red), none when no run completed, and unknown when the history cannot be read. Cancelled, skipped and neutral runs and runs still in progress are passed over in favour of an older completed run. For green and red it also prints the conclusion, the commit it verified and a link to the run. It exits zero whenever it read a result, including red and none, and non-zero only for unknown. When the history cannot be read, it prints the reason and never reports green; a missing or unauthenticated GitHub tool, a failing call, unparseable output and a missing workflow are all unknown, and a missing tool is named in the reason. A history holding only passed-over runs reads as none. Tests drive it with a stand-in for the GitHub tool and cover a passing run, a failing run, a timed-out run, no runs, only in-progress runs, only cancelled runs, a newer in-progress or cancelled run above an older completed one, a failing call, malformed output and a missing tool, in text and in JSON output. A test also holds the workflow name the command asks for equal to the name the nightly workflow declares. Out of scope: investigating a failure.
links:
