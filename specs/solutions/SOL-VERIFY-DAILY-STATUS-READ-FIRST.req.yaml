id: SOL-VERIFY-DAILY-STATUS-READ-FIRST
type: deliverable
category: solution
title: An operator session reads main's latest nightly result before offering work
status: active
version: 1
text: |
  An operator session reads main's latest nightly result before it offers any work. A task-runner command reads the nightly workflow's run history and states the latest completed run's conclusion, the commit it verified and a link to it. The operator session launcher shows that result first, and when it is red, offers fixing it as the first choice.
