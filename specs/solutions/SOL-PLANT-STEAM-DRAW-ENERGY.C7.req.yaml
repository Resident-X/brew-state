id: SOL-PLANT-STEAM-DRAW-ENERGY.C7
type: criterion
title: The pressure-divergence-rate coefficient is a described coefficient with a declared origin and error
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  The plant description gains a coefficient for the rate the integrated pressure state departs
  from the affine relation while a draw is open, alongside the other described coefficients --
  the latent-heat coefficient SOL-PLANT-STEAM-DRAW-ENERGY.C2 declares, water_feed_temperature_c,
  water_heat_capacity_j_per_ml_k -- with a recorded origin and declared error, so this
  coefficient does not arrive undeclared the way the description's own standard forbids. Out of
  scope: identifying its value from measured data, which needs a machine on a bench.
