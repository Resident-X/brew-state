id: SOL-CASTING-PEAK-UNDER-CONTROL-DERIVED.C2
type: criterion
title: The figures record derives the proof-of-life interval from the peak and ends its pending mark
status: deprecated
version: 2
measurement_type: binary
verification: analysis
text: |
  The controller boards' figures record replaces its pending proof-of-life removal interval with the interval derived from each thermoblock's peak casting temperature under control as the generated record gives it, its trip point, its element power at the top of the declared supply span and the lower bound of its thermal mass, showing the arithmetic and naming the shorter of the two heaters as the one that sets it, and no statement anywhere in the record still marks the interval pending or bounds it only by the times taken from the commanded temperatures. Out of scope: the interlock's design.
links:
  - target: SOL-CASTING-PEAK-UNDER-CONTROL-DERIVED
    type: criterion-of
attributes:
  deprecation_reason: The proof-of-life interval cannot be derived under the shipped control, where the coffee casting exceeds its trip point; the derivation is re-homed in SOL-PROOF-OF-LIFE-INTERVAL-DERIVED-FROM-HELD-CASTING-PEAK.C1
