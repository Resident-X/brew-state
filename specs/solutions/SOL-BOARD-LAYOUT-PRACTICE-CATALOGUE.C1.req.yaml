id: SOL-BOARD-LAYOUT-PRACTICE-CATALOGUE.C1
type: criterion
title: The method carries a baseline layout practice catalogue whose every item cites its published source
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Write the catalogue into the method as its closing section, after the layout review views, which the method's opening names as a reference list the steps use rather than a step carried out in order. Each item carries an identifier made of its area and a number, never renumbered or reused, so a plan, a rule and a review can cite it; and it states the condition under which it applies to a board, in terms of what the board's schematic carries, so an item whose condition holds cannot be marked as not applying. Each item states the question it asks of a board, the pattern that passes, what a failing board looks like in the review views, which of the method's review views it is judged on (for a rule-kind item, the pre-order check's report), whether it is of rule kind, enforced by the automated pre-order rule check through the board's rules, or of judgement kind, judged on the rendered views, its severity (safety, function, quality or cosmetic, where safety covers what REQ-BOARD-LAYOUT-PRACTICE-001.C2 defines it to cover: separation between mains and anything a person or a low-voltage circuit can reach, fusing, protective earthing and insulation), and its published source with the section, or, for an item added from a layout review with no published source, that review. A practice that is only partly expressible as a rule becomes two items, one of each kind, so every item has a single kind. A published source is a document any reader can obtain without charge, such as a part or tool manufacturer's application note, design guide or datasheet, cited by title, publisher, section, address and the date it was read; a standard that must be bought, or a book the build could not open and read, is not a source, since the method needs no standard that must be bought. Each source is checked against the document itself, never cited from memory, and each item is stated fully enough to apply without reading its source. The rule-kind items are the method's one list of carried rules, joining on each board the rules the rules step already writes from the board's own constraints, each written in the form the rules step uses for its kind, a board-wide minimum, a net class's figure or a custom rule, with its figure and source; a rule on a net class names the class by its role, which each board's rules replace with that board's own class name, the mains class alone being named literally since its name is fixed; an item on separating mains from low voltage defers to the single form and the signed figure the rules step already fixes for that separation. The catalogue covers floorplan and partitioning, power paths and heat, grounding and return paths, decoupling and switching loops, sensing front ends, clocks, separation of mains from low voltage, connectors and mechanical fit, test access and bring-up, manufacture and assembly, and emissions. It holds no figure, part or board shape of any one machine: a figure that depends on the machine is named by its role, its number living in that machine's board rules. Out of scope: the review step that applies the catalogue to a finished layout, and producing the views.
