id: SOL-BOARD-LAYOUT-PRACTICE-CATALOGUE.C1
type: criterion
title: The method carries a baseline layout practice catalogue whose every item cites its published source
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Write the catalogue into the method. Each item states the question it asks of a board, the pattern that passes, what a failing board looks like in the review views, which view it is judged on, whether it is enforced by a board rule, by a check over the board file, or by visual judgement, its severity (safety, function, quality or cosmetic), and its published source with the section. Each source is checked against the document itself, never cited from memory, and each item is stated fully enough to apply without reading its source. The catalogue covers floorplan and partitioning, power paths and heat, grounding and return paths, decoupling and switching loops, sensing front ends, clocks, separation of mains from low voltage, connectors and mechanical fit, test access and bring-up, manufacture and assembly, and emissions. It holds no figure, part or board shape of any one machine: a figure that depends on the machine is named by its role. An item whose kind is a check over the board file is judged visually until such a check exists. Out of scope: writing the checks over the board file, and the review step that applies the catalogue to a finished layout.
