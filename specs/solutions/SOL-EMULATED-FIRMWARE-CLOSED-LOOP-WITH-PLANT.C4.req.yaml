text: |
  firmware/emulation/scripts/exercise.py drives the emulated core through a full draw-length sequence of TIM3 writes and ADC1 reads with the loop closed per .C2 and .C3, completing without a target board, ST-LINK, or any physical peripheral attached — the sequence REQ-PREENERGISATION-VERIFICATION-001.C5 relies on to bind the machine's eventual behaviour pre-energisation. Multi-draw sequences and the steam-side loop are out of scope.
