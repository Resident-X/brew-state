id: SOL-HW-MANUFACTURER-BOUNDS-DATED.C2
type: criterion
title: Availability, library class and price of the parts the design expects are recorded per channel, with their date
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  For every part class the boards are expected to need, channel by channel over the channels the component specification enumerates, the record gives catalogue candidates with stock, the library class that sets whether a setup fee applies, unit price and any per-part fee, each dated to the day and sourced, with parts from the libraries that carry no setup fee listed first. Where a function's form is still open, candidates are given for each form under consideration, such as a bought module and the parts of a circuit the project designs. Prices are in US dollars as the manufacturer publishes them, matching the declared spend, and each states its quantity break: the smallest break, and also the break nearest the build quantity where that differs. A part class for which no stocked candidate was found is recorded as such, with the search made and its date, rather than left out. The parts the machine already carries that can serve the channel, and any part bought ahead of verification as the design-constraints record states it, are named as the defaults the candidates are weighed against; no part of the earlier controller design was ever bought, so none is named as one. The cost of shipping a minimum board order to the builder's country is recorded with its method and the date it was quoted. Out of scope: selecting the part a board will carry, and the aggregate cost estimate against the declared spend, which the partition and feasibility task makes.
