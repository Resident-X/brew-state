id: SOL-SWEEP-TIME-ACCOUNTED.C1
type: criterion
title: The sweep reports build and execution time per shard
status: active
version: 2
measurement_type: binary
verification: test
text: |
  Each sweep run states, for every unit it builds and runs, the time spent building, the suite's unmutated run time, the time spent executing mutants and the number of mutant runs, with a total over the units. A unit is one environment and suite on the local run, and one environment, suite, directory and operator on a hosted shard; each row is keyed by its full identity on that path. Any other way of running the sweep reports through the same record and renderer, keyed by its unit's identity on that path. Toolchain installation and other workflow setup are named as outside the figures.

  The build and the unmutated run are measured as two separate calls of the test runner, one that builds without testing and one that tests without building, so the unmutated suite must still pass before anything is mutated. Execution time is the mutation runner's wall time, labelled as including that runner's own warm-up and baseline runs. The mutant count is every mutant result the unit's report lists, labelled as runs rather than as the population, since the same mutant runs once per suite. Every figure states its unit, and the total is stated as summed time, not elapsed time.

  Mutator discovery is a unit of its own, keyed by environment and directory. Its row states the build time, the unmutated run time, the time the mutation runner spends listing mutants without running them, and the number of mutants listed, labelled as listed rather than run. Discovery rows appear in the discovery job's own job summary; the merged total covers the shard rows only and says so.

  The figures appear in the local run's output and in the hosted workflow's job summaries. Each sweep job writes its own rows to its job summary, adding each phase's figure as that phase completes, so a job stopped part-way by its time limit still shows where its time went. The merge job folds the timing out of every shard report and writes the whole table with its total. A shard report carries its mutant results and its timing as two named parts, and the merge treats a report missing either as a shard it could not look at. The summary is written only when the hosted environment provides a summary file. Timings are printed for every completed unit before the sweep's verdict lines, on the error path as well, and never change the exit status, including when the summary file cannot be written.

  Tests drive a fake clock that advances by different amounts during the build, the unmutated run and the mutation run, and show: each figure attributed to its own column; the total equal to the sum of the rows; the merged table covering every shard; a report missing its timing, and one missing its mutant results, each refused; a discovery row carrying its listed count and listing time; the summary file written when the hosted environment provides one and not otherwise; a phase's figure in the summary before the next phase starts; completed units' timings printed before the verdict on the error path; an unwritable summary file leaving the exit status unchanged; and the plain-text and summary renderings carrying the same figures.

  Out of scope: changing what the sweep builds, mutates or judges.
