id: SOL-SIM-ROBUSTNESS-STABILITY-ACROSS-DECLARED-ERROR.C1
type: criterion
title: Every parameter carrying a declared error is run to its corners and checked for a response that settles within the delivery's own tolerance band, not only a bounded deviation
status: active
version: 1
measurement_type: threshold
verification: analysis
text: |
  The existing per-parameter sweep already perturbs each declared-error corner and re-runs a closed-loop draw on both the coffee side and the steam side, but it measures how far the outcome moves as a fraction of the delivery's own tolerance band — a magnitude that says nothing about whether the response actually settles. This slice runs the same corners to a horizon long enough to show whether the response settles within that same declared tolerance band, held for a stated trailing portion of the horizon, or does not.

  Perturbing more than one parameter at once, or otherwise honouring how the declared errors relate to each other rather than treating them independently, is out of scope, as is a coefficient the plant description declares one-sided.
