id: SOL-HW-MODULE-PROPERTIES-CARRIED-FORWARD.C1
type: criterion
title: Every bought module's unspecified properties are stated, including the ones it did not provide
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  For every bought module the earlier design specified, including the controller module, the heater switches, the pump drive modules and their shared zero-cross output, the valve relay module and its driver, the valve snubber modules, the pressure sensors, the logic supply and its carrier and the energy meters, and every other module row its bill of materials names except rows the design itself deferred, the record states the isolation it provided and what that isolation separated, its defined output behaviour including its state while powering up, in reset, unpowered and with its control signal disconnected, the input thresholds it presented, and its default states. Where a module provided none of one of these, such as no isolation, and where nothing in the earlier design provided a property a requirement needs, the record says so rather than leaving it out. The record states, as an owner statement with its date, that none of the earlier design's parts were bought, the product photographs and listings it cites being vendors' listings rather than parts in hand, so each property is read from the module's datasheet or schematic rather than measured. Each entry carries its value with units where it has one, its evidence grade in the status vocabulary the machine's record already uses (measured, owner statement, schematic, parts list, published unverified, inferred, unmeasured) kept distinct rather than levelled, and a source a reader holding only the published repository can follow; a published source outside the repository, such as a module's datasheet, is cited by its address and the date it was read and graded published unverified, and the record states that for these entries the grade means the figure is the manufacturer's published claim, read at its source but not established on a part. Where the machine's record or a working design document already states a fact, the entry cites it rather than restating it. Out of scope: deciding whether each function stays a bought module or becomes a designed circuit, which the partition and feasibility task decides.
