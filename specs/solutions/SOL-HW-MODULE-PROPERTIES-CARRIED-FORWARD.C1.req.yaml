id: SOL-HW-MODULE-PROPERTIES-CARRIED-FORWARD.C1
type: criterion
title: Every bought module's unspecified properties are stated
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  For every bought module the earlier design relied on, including the controller module, the pump drive modules, the valve relay module, the logic supply and its carrier and the energy meters, and any other module its bill of materials names, the record states the isolation it provided and what that isolation separated, its defined output behaviour including its state while powering up, in reset, unpowered and with its control signal disconnected, the input thresholds it presented, and its default states. Each entry carries its value with units where it has one, its evidence grade in the status vocabulary the machine's record already uses (measured, owner statement, schematic, parts list, published unverified, inferred, unmeasured) kept distinct rather than levelled, and a source a reader holding only the published repository can follow; a published source outside the repository, such as a photograph of the same model, is cited by its address and graded published unverified. Where the machine's record or a working design document already states a fact, the entry cites it rather than restating it. Out of scope: deciding whether each function stays a bought module or becomes a designed circuit, which the partition and feasibility task decides.
