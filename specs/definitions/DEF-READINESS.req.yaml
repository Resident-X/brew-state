id: DEF-READINESS
type: definition
title: readiness
status: active
version: 2
text: |
  Readiness is the condition in which the machine could begin a delivery immediately if one were asked for, having reached and settled at the state that delivery requires.

  It is a per-purpose condition rather than a single machine state: being ready to brew, to steam and to dispense hot water are different conditions with different settling behaviour, and a machine may be in one and not another. What distinguishes reaching readiness from a delivery is that nothing leaves the machine: water may move within it, since moving water through a heated mass is one of the ways a machine redistributes its own heat, but anything the machine sends out of itself is a delivery and carries everything that attaches to one.
rationale: |
  The boundary is drawn where the risk is, which is the same place the decision on remote interfaces draws it: a delivery puts water where a person has to be, and reaching readiness does not. Drawing it instead at whether water moves at all would be a proxy for that, and would forbid by wording a machine using its own pump to move heat around inside itself.

  The consequence is deliberate and worth stating plainly. A machine that expels water to shed heat has performed a delivery, not a step of reaching readiness, and everything attaching to a delivery attaches to it — including that it happens only for a person present at the machine. That leaves the strategy available where somebody is standing there and withholds it from the unattended case, which is the distribution of risk the safety argument already assumes.
