id: DEF-PROFILE
type: definition
title: profile
status: active
version: 2
text: |
  A profile is the sequence of segments a delivery follows over its course, in place of a single value held from start to finish. Each segment states what the delivery aims for in water temperature and in pressure or flow, with a limit on the one it does not aim for, and the condition on which the segment ends. The delivery ends when its last segment does.

  A profile states what it asks for as outcomes at the group, never as anything specific to one machine, so the same profile means the same thing on another machine and that machine decides whether it can deliver it. It belongs to a drink, or to a routine that keeps the machine in condition, and is chosen by the operator; what describes the machine itself is its plant model.
