id: DEF-STEAM-SIDE
type: definition
title: steam side
status: active
version: 1
text: |
  The steam side is the heated mass that serves steam, together with whatever moves, routes and senses water for it.

  It serves one mode only, which makes it the simpler of the two. What it shares with the coffee side is a property of the machine rather than of the term: on the reference machine that is the supply budget and the water both draw from.
