id: DEF-DRAW
type: definition
title: draw
status: active
version: 1
text: |
  A draw is a single continuous demand placed on the machine by the operator, lasting from when they open a path until they close it.

  Its duration is set by the operator rather than by the machine, which distinguishes it from a dosed or metered delivery. Steaming a jug of milk and dispensing hot water are both draws; the machine cannot know in advance when either will end.
