id: OBL-REALTIME-DISCIPLINE-001.C3
type: criterion
title: Ordering between concurrent activities is chosen deliberately wherever correctness depends on it
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Timing that depends on the ordering between concurrent activities is correct only if that ordering was chosen and written down, and an ordering that happens to work is a correctness argument nobody made.

  It is also the argument that silently stops holding when another activity is added.
