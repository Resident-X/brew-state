id: OBL-REALTIME-DISCIPLINE-001.C3
type: criterion
title: Interrupt priority and handler ordering are assigned deliberately
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Timing that depends on the ordering between handlers is correct only if that ordering was chosen, and a default ordering that happens to work is a correctness argument nobody made.

  It is also the argument that silently stops holding when a handler is added.
