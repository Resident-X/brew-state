id: OBL-ELECTRICAL-THERMAL-SAFETY-001.C6
type: criterion
title: Mains-referenced parts are isolated from anything a person or a low-voltage circuit can reach
status: active
version: 2
measurement_type: binary
verification: test
text: |
  The controller, its sensing and the operator's controls all sit at low voltage while the loads they command sit at mains. A single insulation or clearance failure bridging the two reaches the operator's hands and every low-voltage device at once.

  This holds under fault as well as in normal service, and under the conditions the machine actually runs in rather than bench conditions: water, steam, and repeated thermal cycling.
