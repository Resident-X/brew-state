text: |-
  The gap is carried to the window's edge, where the state still answers, and one interval past it, where it does not -- so the test says where the refusal arrives rather than only that one eventually does. The channel is then restored and the state answers again on the next accepted observation, with a fresh residual, showing the elapsed figure cleared rather than only ever growing. A channel arriving intact and absurd every step starves the state on the same path, which is what would notice if plausibility and availability were ever separated.
