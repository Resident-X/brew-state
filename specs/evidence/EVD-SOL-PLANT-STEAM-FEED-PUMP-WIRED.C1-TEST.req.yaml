text: |-
  Both advance functions read the steam-pump channel through one feed relation and take the lower of the demand and the commanded rate. A draw beyond the feed is held bit-identical to a draw at the feed on both the block and the path; the feed relation is proportional to the commanded level across a swept range including zero; a feed shut mid-draw holds the pressure departure rather than handing it back, which is what keeps the wand and not the pump the thing that decides whether the path is tied to its block. The reported draw quantity stays the demand, as the criterion that named it requires. boiler still refuses the channel. Run under task fw:verify.
