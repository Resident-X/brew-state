text: |-
  Each of the four channels is stood away from what the model predicts by a different amount and in a different direction, in that channel's own unit, and each reports exactly that difference -- so a correspondence with two channels crossed, or one that corrected against the brew channel alone, is caught rather than passing on the strength of one channel. Both were confirmed by mutation: restricting the correction loop to the brew channel, and crossing steam temperature onto the brew pressure state, each fail the suite. A channel's correction is shown to land on the state that channel observes and to leave every other state exactly where the equations left it. A channel the step did not correct against reports no residual at all rather than zero, and a channel whose prediction matched its observation reports zero and reports it as present, so the two are distinguishable.
