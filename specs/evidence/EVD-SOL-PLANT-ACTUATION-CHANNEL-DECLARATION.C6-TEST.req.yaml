text: |-
  The narrowly-declared structure is stepped twenty-five times from the same initial state under the same description, once with every unanswered channel explicitly zeroed and once with them left alone, and both trajectories are required to be identical in every quantity with neither step refused. The load-bearing assertion is that the zeroed instance reports OK rather than a fault: an implementation treating a zero on an absent actuator as a command refuses there, which is what would leave a control law that zeroes what it does not use unable to step at all. The mutation zero-on-an-unanswered-channel-refused is caught.
