text: |
  The exclusivity gate and the plant-seam direct-call gate are invoked with no structure named: they discover every structure under the plant root and, from the build file, the artefact carrying each. StructureExclusiveCheck drives that against a synthetic tree — every structure covered by an invocation naming none of them, a structure added to the tree covered with no change to the invocation, a structure no environment builds reported rather than skipped (the failure the naming form could not see at all), a failure in the second artefact found as well as the first, and a second artefact built for the same structure inspected rather than passed over. PlantSeamDirectCalls adds the same property for artefacts: a second artefact routing the seam through a pointer is caught although the first is clean.

  What each check concludes is unchanged and is the first-structure slice's evidence; what is established here is that it is reached for every subject rather than for the ones somebody remembered.
