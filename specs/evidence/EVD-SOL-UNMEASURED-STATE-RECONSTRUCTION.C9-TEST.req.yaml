text: |-
  A second model instance is advanced identically and left uncorrected, which is what the estimator predicted before it corrected anything. The reported residual is asserted equal to that prediction minus the observation exactly, and the amount taken out of the state is asserted to be the same proportion of the reported residual across two different imposed discrepancies -- so a residual recomputed for the report, after the correction had already moved the state, would read a different fraction and fail. A step that corrects nothing reports no residual rather than the one the step before it acted on: the reading is withdrawn and the residual goes absent, and a step the seam refuses leaves none behind either, because residuals are cleared before the step rather than after it.
