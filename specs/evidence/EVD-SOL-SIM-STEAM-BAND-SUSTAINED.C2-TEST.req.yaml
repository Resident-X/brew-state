text: |-
  Passes. A draw is brought to a settled duty and feed, then each untrustworthy condition is injected in turn: a reading below the declared low bound, one above the declared high bound, a sample the seam reports failed, and a channel reporting nothing fitted. In every case both the heater duty and the commanded feed are asserted unchanged from the step before, and the step reports itself sensor-invalid rather than ordinary. The pair of assertions is the point: a law that abandoned its last trusted value would drive toward the absurd figure, and one that cut feed on a single bad sample would chop the operator's draw off and back on. Sabotage check: acting on the absurd reading instead of the last trusted one fails this test (expected 661, was 1000).
