text: |
  The cited tests pass at 5edf898: excluded violations, project exclusions, every check KiCad lists as ignored (its own defaults included), and custom rules at severity ignore or exclusion each fail the design, and a design rule dressed as the check's own still has its findings reported.

  Known shortfall against this criterion, found by the final review at 5edf898 and not yet closed: two settings that make KiCad stop reporting a finding are not yet refused. Lowering a cell of the project's ERC pin-conflict map (erc.pin_map) below KiCad's default hides pin_to_pin violations without KiCad listing the check as ignored; a footprint's exemption attributes (allow_missing_courtyard, and presumably allow_soldermask_bridges) stop KiCad reporting the finding they name. Separately, a file the check reads itself that is not valid UTF-8 makes it stop with a traceback rather than a named failure; it still exits non-zero, so the order is still blocked. The separation guard is unaffected. Closing these is owed as a maintenance item tracing to this criterion.
