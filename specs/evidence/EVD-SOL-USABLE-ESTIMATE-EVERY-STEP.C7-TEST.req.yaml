text: |-
  control_step hands estimator_step the same now-minus-last difference it uses to decide admissibility, replacing the CONTROL_STEP_INTERVAL_MS it passed before; the comment recording the deferred choice went with it. The test withdraws every reading so the model is a pure function of the interval handed to it, drives hw_sim_advance_millis by three times nominal, and asserts the model matches a reference advanced by the elapsed figure and differs from one advanced by the nominal figure -- so it fails against the implementation being replaced rather than merely passing against the new one. The first accepted step has no predecessor to measure from and is advanced by the declared interval, tested with the clock run five seconds forward.
