text: |-
  Each of the thermoblock's eleven coefficients is perturbed alone and required to change the trajectory, compared over every quantity at every step rather than at the endpoint -- a time constant changes how fast a pressure settles, not what it settles at. Confirmed to fail on four separate mutations hard-coding a coefficient into the equations. At the artefact level, check_parameters_are_data.py runs one unchanged host executable against two descriptions differing in a single coefficient and requires two trajectories, hashing the executable either side so a rebuild between the runs cannot be mistaken for the property.
