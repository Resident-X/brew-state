text: |-
  The host tier's simulated-hardware closed loop and the emulation tier's closed loop are driven through an identical commanded draw (temperature + pump course, 300 intervals) and compared at every interval across all four sensed quantities. Measured worst separation is 0.000e+00 on all four quantities (bit-identical), well inside the 1.0e-3 tolerance. Varying the ADC/converter full-scale changes the trajectory (5.2e-3 / 1.3e-3 diffs, both exceeding tolerance), independently confirming the sensing round-trip is load-bearing rather than decorative. Verified by two independent blind-review passes, including hand re-derivation of the tolerance and re-running the converter-scale experiment.
