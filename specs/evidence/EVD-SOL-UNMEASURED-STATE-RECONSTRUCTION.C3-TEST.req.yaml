text: |-
  A reference plant_model_t instance is run 400 steps away from ambient and thereafter reports only the quantities hw_interface.h exposes as sensor channels. The estimator is started from ambient, more than one kelvin displaced from that truth, and is given nothing else. Over 4000 steps the error in the reconstructed outlet temperature falls below a tenth of the displacement, and the worst error over the final half of the run stays below it -- so a reconstruction that dipped through the truth and climbed out the far side would be caught. The suite runs in env:native_test against the machine-describing structure. No accuracy figure against a real machine is claimed; the coefficients are unmeasured and the structure's support status records it.
