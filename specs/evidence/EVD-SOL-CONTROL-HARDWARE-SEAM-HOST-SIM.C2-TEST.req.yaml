text: |-
  `pio run -e native` compiles the control-logic sources under firmware/src/control together with the simulated implementation under firmware/src/hw/sim and links a host executable. The build needs no STM32 toolchain, no CMSIS headers and no attached device. The linked executable then runs to completion under `task fw:run`, and the 13 Unity tests in firmware/test/test_control/test_control.c pass under `pio test -e native_test`, exercising the control logic through the simulated seam rather than merely proving the binary starts.

  Observed on branch req/SOL-CONTROL-HARDWARE-SEAM-HOST-SIM/host-sim-seam via `task fw:verify` from the repo root, which builds both PlatformIO environments, runs all five checks, runs 13 Unity tests and 48 Python tests, and runs the host executable.
