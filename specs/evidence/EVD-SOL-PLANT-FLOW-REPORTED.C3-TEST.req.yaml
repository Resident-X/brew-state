text: |-
  Five commanded levels including both endpoints are each checked against the figure the coefficient and full scale give, rather than against the neighbouring level, so a curve, dead band or early saturation fails rather than passing as monotonic. test_a_pump_commanded_off_reports_no_flow checks zero after a draw, catching a latched rather than recomputed value. test_the_drawn_rate_is_unmoved_by_the_heaters runs forty steps with both heaters at full scale and requires the same rate as the pump commanded alone. Held on the single-vessel structure by its own test of the same name.
