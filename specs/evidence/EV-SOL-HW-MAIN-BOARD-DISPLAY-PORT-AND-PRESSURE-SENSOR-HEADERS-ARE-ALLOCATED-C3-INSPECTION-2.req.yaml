text: |-
  Read the pad nets of hardware/sunbeam-em7000/main-board/main-board.kicad_pcb (sha256 38eb68f21d9cf9577df23d9291782348fceb2bc139937090c323dc511d4f8e02) at commit ea025b12ae07f61866a8bfaeb726d797ec4c892b. J524 pad 4 is net BREWA_RAW; R534 joins it to net BREWA_DIV and R536 joins that to net BREW_AN, which is the controller's pin 30. The controller pin table names pin 30 as PA6 with ADC12_INP3, against DS12110 Table 9.
   This is the reading of the board after its folder was renamed from main-board-v2 to main-board and its title silk was replaced (DEC-BOARD-VERSION-NAMING-V2-WORKING-NAME). The earlier reading, at sha256 9bcc3ebdd8a3c3f7e6d080947431c5375577251747638e63996a7dbebbad506e, read the same pads and nets. Between the two files only F.SilkS items differ (the old title text items are gone and the new title text and the logo polygons and lines are added; a comparison of the two files shows no changed footprint, pad, track, via or zone), and the locked-copper comparison of the four Mains classes passes on all 266 recorded items, so every pad net stated above holds on this board; the pad nets were carried over on that ground and not read again pad by pad.

  Change since the reading at sha256 b36b950ac2737d64f7b2e15742923e3163507bc7427bc0c925cb0c74c84f12f8 and commit 923d3d75bd2e1fc91c0b318fc3f3197e89bfd4d4: the board file now has sha256 38eb68f21d9cf9577df23d9291782348fceb2bc139937090c323dc511d4f8e02 at commit ea025b12ae07f61866a8bfaeb726d797ec4c892b, and the one difference is a single added locked F.Cu segment, net PUMP_C_MT2, 0.6 mm wide, from (42.05, 27.6625) to (42.05, 28.7), which joins R704 pad 1 to its own-net pour; the locked-copper comparison of the four Mains classes passes on 267 items. Nothing this reading rests on is touched by that segment.
