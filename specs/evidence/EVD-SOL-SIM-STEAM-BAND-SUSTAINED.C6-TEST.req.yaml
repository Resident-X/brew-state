text: |-
  Passes. Three demands -- 0.25, 1.0 and 5.0 millilitres a second, all above the declared sustainable rate -- are put behind the same open wand, and the commanded feed is asserted equal to the declared rate on every step past the margin interval and the feed's rise. Sampling only past the rise is deliberate: the rise is a separate criterion's concern. The point the criterion makes is that no law here could vary feed with demand even if it wanted to, because the microswitch reports only that the wand is turned. Sabotage check: removing the cap fails this test (expected 67, was 1000).
