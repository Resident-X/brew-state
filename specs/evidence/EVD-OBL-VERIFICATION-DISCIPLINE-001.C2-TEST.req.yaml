text: |
  Every mutation firmware/tools/mutate.py runs is a demonstration that some specific test or check earns its place: it is capable of failing, because it is shown failing, against a plausible defect named in the mutation's own "why" field (a cancelling settled-fraction computation, a coefficient compiled in rather than read from the parameter record, an unanswered actuation channel silently absorbed, and so on). A test that could not fail on any of these would not appear in the tool's list, because the tool refuses to run and report a catch unless the pre-mutation baseline already passes.
