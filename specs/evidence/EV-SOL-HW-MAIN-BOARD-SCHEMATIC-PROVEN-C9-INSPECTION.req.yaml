text: |
  Inspection of the criterion clause by clause, the drawn sheets against the figures the judgements leaf (SOL-HW-MAIN-BOARD-INTERLOCK-ENTRY-JUDGED) settled. Files are in hardware/sunbeam-em7000/main-board/ unless stated, and are unmodified against the commit named in the artifact version. Layout and the redoing of the judgements are out of scope and were not inspected.

  Clause (a) "the interlock circuit, its timing parts and whatever the judgements leaf settles to remove, bound or detect the interlock's own single faults".
  sheets/102-interlock.yaml (sheet "Interlock") draws: the relay K201 (HF115F-I/005-1HS3A) with its coil from +5V to POL_COIL_LO; the proof-of-life input path R207 (1 kohm) then POL_IN held by R201 and R202 (100 kohm each), the two inverting gates U201 and U203 (SN74AHCT1G14DCKR) in series through POL_INV with R208 (100 kohm to ground) and bypasses C201 and C206, and POL_BUF feeding two identical edge-pump channels: channel A is C202 (100 nF), D201, D202, C203 (4.7 nF), R203 (5.6 Mohm), R205 (100 kohm), Q201; channel B is C204, D203, D204, C205, R204, R206, Q202; the two N-FETs (NX3008NBK) are in series to the coil's low end; Z201 and Z202 (BZX84-C12) with D205 and D206 clamp the coil, and TP201, TP202, TP204, TP205 and TP206 give test access. The timing parts are C202/C204, C203/C205, R203/R204 and R205/R206. circuit-proof.md row "Interlock removal time" computes the removal as 61.88 ms of gate decay + 1.0 ms FET turn-off + 8.0 ms release + L x 6.159 ms per henry, 70.88 ms + 6.159 ms/H x L, at most 100 ms for L <= 4.73 H, 81.2 ms at the record's 1.68 H bound; the row states it is not met as an unconditional figure because the coil inductance is in no maker source, and open-items.md row M28 carries the inductance to a bench reading. The fault handling the judgements leaf settled for the interlock's own single faults is drawn: circuit-proof.md "FAULT table of the interlock, derived from the drawn netlist" lists each part open, short and stuck with the outcome removed, bounded or detected (U201 and U203 failures leave a level, R208 holds the inter-gate link low, held-high drive is removed only because of R205 and R206); the welded contact is bounded by an independent element under owner acceptance (a) in open-items.md (series overheat thermostats now, one-shot cutoff before mains). Matches.

  Clause (b) "the series element at the rating judged".
  controller-board-division.md (docs/sunbeam-em7000/), "The series element, judged": worst-case series current 10.96 A steady, 11.03 A at inrush, 15 A in the entry fuse's overload band; contact 16 A at 250 VAC; margins 16 / 15 = 1.07 and 16 / 10.96 = 1.46. The drawn part is sheets/102-interlock.yaml K201 "HF115F-I/005-1HS3A", rating text "16 A 250 VAC resistive (VDE 16 A at 85 C)", contact in series between LINE (pin 14) and LINE1 (pin 13). Same part, same rating as judged. Matches.

  Clause (c) "the relay and the voltage measurement's isolating part as judged against the basis".
  hardware/sunbeam-em7000/separation-basis.yaml carries barrier entries "interlock-relay" (bought part K201 HF115F-I/005-1HS3A, creepage coil to contact 10 mm) and "isolated-measurement" (bought part U601 AMC131M02, creepage and clearance 8.0 mm, VIOTM 7070 V pk, VIMP 7700 V pk), and its header lists U601 creepage 8.0 mm and K201 10 mm. The drawn parts are K201 (sheet 102) and U601 (sheets/E1-supply-voltage-and-current-measurement.yaml). U601's 8.0 mm against the board's declared 10.0 mm is a departure from the figure judged; it is recorded as a finding (schematic-review.md round 7, 7.35; open-items.md acceptance (e)) and resolved by the owner's acceptance at the maker's figure. K201's clearance and working isolation voltage are unstated by the maker; the review amendment of 2026-11-17 records K201 as "creepage 10 mm equals the declared 10.0 mm" with clearance and working voltage "still unstated" (finding 7.35 part, carried by the owner to DEL-HW-BRING-UP.C15 per the acceptance record). Matches, with that carried part stated rather than hidden.

  Clause (d) "the entry fuse and surge clamp at the entry".
  sheets/101-mains-entry-and-load-feed.yaml draws F101 (SETfuse SCT520PT, 10 A 250 VAC slow-blow, soldered pigtail) between LINE_IN (tab J102) and LINE_F, then JP101 to the LINE bus, and RV101 (14D471K varistor) and C101 (100 nF X2) on LINE against NEUTRAL; the circuit-verdicts.md J102 row (SURGE-1) states RV101 sits downstream of F101 on LINE. This is the 10 A fuse and varistor the leaf settled (its text: "the 10 A slow-blow fuse and the varistor are carried on the main board at tabs 2 and 3"). The fuse's 250 V rating against the 253 V span top is a recorded finding (7.1, 7.44) resolved by owner acceptance (c2) and a signed derating-policy.yaml accepted_exceptions entry for F101. Matches.

  Clause (e) "every load's live lead fed from the interlock's switched side".
  The only live output of the board toward the loads is net LINE1: sheets/101-mains-entry-and-load-feed.yaml net LINE1 is J101.1 and TP104.1 only (tab 1, "retained red lead (live out to the loads)"), and sheets/102-interlock.yaml puts LINE1 on K201 pin 13, the contact's output side. The nets on the upstream side, LINE, join K201.14, JP101, RV101, C101, R101/R103, and the measurement and supply taps (R601 on sheet E1, R630 on sheet E2, the logic-supply feed); none of them reaches a load tab. The valve branch is fed from LINE1 by the retained wiring (sheets/710-valve-drives.yaml notes), with the valve relays' contacts to VALVE_COM and the shared fuse F731. The premise that the retained harness feeds each load from the LINE1 wire rests on the owner's trace and is checked by continuity at bring-up (controller-board-division.md, "Owner intent carried in", row of 2026-10-24); that is the judged premise, and it is drawn that way. Matches.

  Clause "A part or net that departs from a judged figure is a finding recorded and resolved, not a silent change."
  The parts that changed after the judgements are each recorded in schematic-review.md, section "Amendment after round 7: schematic changes of 2026-11-07 to 2026-11-15" with a re-judged row: K201 (HF115F-Q to HF115F-I), F101 (clip cartridge to soldered pigtail), RV101 footprint, the eight tabs, U201 with new U203, R208 and C206 (the interlock buffer), the pump triacs and their clamps. Open points the amendment states, and which stay recorded and not closed: F16 (peak output current of the buffer into the coupling capacitors, 110 mA against 25 mA, circuit-verdicts.md F16 "lead decides") and F19 (power-up blip, 1.10 V for 17.3 ms, 30.2 mA against 51.3 mA pick-up, owner-accepted 2026-11-10, acceptance (m)). The owner accepted the same 110 mA first-edge stress as finding 7.48, acceptance (w) of 2026-11-06, which names U201 and the coupling capacitors C202 and C204 and the fail-safe direction (relay opens); after the buffer change that stress sits on U203, so acceptance (w) still names the earlier part. I read F16 as the same finding in the same direction and so as covered, and I state that the acceptance text was not restated for U203.

  Result: every clause is met as read, with F16's naming stated above.
