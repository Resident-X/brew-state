text: |-
  control_step reads the reconstructed state only after estimator_step has run for the same step. The first test shows the state read on each accepted step differing from the one before wherever the plant moved between them, so a reuse of the prior estimate fails rather than passing unnoticed. The second shows a step refused as CONTROL_STEP_TOO_SOON leaving the reconstruction, the step count and the drive level all unchanged -- it advances the estimator not at all and consumes no estimate. Both are ordering claims in simulated time; no wall-clock duration, deadline margin or worst case is measured.
