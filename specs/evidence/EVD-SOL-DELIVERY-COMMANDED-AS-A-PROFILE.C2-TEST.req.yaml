text: |-
  A commanded rate produces the actuation level the plant's declared figure implies, with the expectation computed independently through the seam rather than against the production arithmetic. A description declaring a different pump figure moves the level with no edit to the profile source: the same points and the same end condition are handed to a control path brought up against a machine that draws differently, and only the machine changed. The figure is probed once through plant_model_quantity rather than named as a coefficient, so check_plant_encapsulation passes and no duplicate figure exists anywhere in the control or profile source. A structure that draws nothing at full pump is refused rather than divided by. The linearity the conversion assumes is asserted through the seam at half scale, so a nonlinear structure fails loudly rather than delivering silently wrong rates.
