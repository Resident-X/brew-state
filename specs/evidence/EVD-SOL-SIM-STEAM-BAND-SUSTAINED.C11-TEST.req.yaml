text: |-
  Passes. A demand far beyond anything the block could sustain is put behind the wand; pressure is asserted inside the declared band throughout the delivered part of the draw, and the settled feed is asserted never past the declared rate. That the rate actually delivered does not climb is asserted at the seam rather than from the commanded level: two runs whose demands differ by a factor of twenty are required to produce pressure traces identical step for step, which they can only do if nothing downstream of the cap ever saw the larger demand -- the plant charges its pressure relation against the steam actually made. A third arm with a demand below the cap is required to produce a different trace, which is what keeps the identical pair from being explicable by a model that ignores demand altogether.
