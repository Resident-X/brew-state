text: |-
  Stepped against readings drawn only from the four channels hw_interface.h exposes, the estimator answers ESTIMATOR_STATE_BREW_TEMPERATURE_C -- the water on its way to the group, which corresponds to no member of hw_sensor_channel_t -- with a finite value equal to none of the four readings. Reading before initialisation, outside the enumerated set, through a null instance or into a null destination is refused rather than answered with a default, and the destination is left as the caller left it. A reconstruction that is not a number is refused on the same terms. The reconstruction keeps running when a reading is withdrawn, which is the regression guard on it being a model that is corrected rather than a reading passed through.
