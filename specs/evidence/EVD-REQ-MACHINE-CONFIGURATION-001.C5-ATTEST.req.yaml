text: |-
  Tier 2 attestation of REQ-MACHINE-CONFIGURATION-001.C5. Final-state intent: the local machine-configuration declaration (docs/sunbeam-em7000/reference-machine.md) states, for every value it carries, whether it was measured on this machine or taken on trust. Composition: DEL-BENCH-THERMOBLOCK-ELEMENT-POWER with contributing solution SOL-THERMOBLOCK-ELEMENT-POWER-MEASURED (evidence EVD-SOL-THERMOBLOCK-ELEMENT-POWER-MEASURED.C1-INSPECTION through .C4-TEST, all pass). Intent fit: read the whole of docs/sunbeam-em7000/reference-machine.md fresh rather than trusting the composition alone. Every table (Supply, Heating and load, Protection) carries a Provenance column with a stated source or an explicit 'not established'/'Inferred' label; narrative sections carry inline provenance parentheticals (e.g. the hydraulic routing note, the wand sensor hypothesis). Found one genuine gap the composition's own contribution did not touch: line 128's 'Other figures' (water tank, espresso pump bar rating, steam pump bar rating) carried no provenance at all. Resolved it directly as part of this attestation pass rather than attesting past it: the tank's 3 L is sourced to the EM7000's own specification (developer-supplied); the coffee pump's 15 bar is labelled as the Ulka EP5's nameplate figure, corroborated across independent reseller listings but not read from a manufacturer datasheet held in this repo; the steam pump's 4 bar is labelled not established to the same precision, since JYPC-4-family datasheets range 1.5-7.0 bar across variants and the specific variant fitted is unconfirmed -- an honest residual gap named as such rather than papered over. Acknowledged scope boundary: thermal mass, loss coefficients, pump flow/pressure-as-plant-parameters (distinct from the nameplate figures just resolved), and outlet geometry remain @estimated in firmware/params/thermoblock.params and are explicitly named in reference-machine.md's Thermal and hydraulic characteristics section as remaining for a future commissioning pass -- an acknowledged, stated deferral, not a silent one. Decision: attest. No unstated gap against the criterion's final-state intent.
