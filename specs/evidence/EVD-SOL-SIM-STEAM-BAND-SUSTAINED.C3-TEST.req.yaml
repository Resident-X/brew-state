text: |-
  All three pass. Two declarations differing only in a declared ready temperature settle the same machine at the two temperatures they name, ten degrees apart, with nothing rebuilt between them. The same draw against the same machine is then judged against two declared bands and the suite's own verdict moves with the declaration. The grammar test is the 'undeclared fails the gate' half: it drives every fault the loader can report, and carries one arm per declared figure -- generated from the word macros rather than written out -- asserting that a declaration leaving that figure out is refused as missing and names it. Every figure carries an origin kind and an account in params/steam_control.declaration.
