text: |-
  control.c no longer calls hw_sensor_read at all: it drives from estimator_state. The sensor is held at the setpoint while the reconstruction sits at 43 C and the heater goes to full scale, then the two are exchanged and the heater goes to nothing -- a control law reading the sensor would have answered the opposite way each time, so the drive level says which of them it acted on rather than merely that it acted. The existing refusals keep the behaviour they had: an untrustworthy reading de-energises and latches, a refused drive command is reported and latches, and a refused shutdown is still not recorded as the heater being off. The drive levels and output write counts recorded before the two channel vocabularies were unified are unchanged, so the mapping from a temperature to a drive level survived the substitution.
