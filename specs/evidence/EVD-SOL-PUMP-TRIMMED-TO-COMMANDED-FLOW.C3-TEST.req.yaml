text: |-
  An unreachable rate correctly reports trim_saturated once departed beyond tolerance; a fresh delivery inherits neither the prior one's saturation nor its departure; a course legitimately peaking at full-scale flow with an agreeing (in-tolerance) meter is not misreported as saturated, proving trim_saturated is gated on the tolerance band the same way departed is; and pump_trim_permille is bit-identical across a long saturated interval and moves again once released, mirroring the proof heater_command already carries at its own actuator bound. All four pass in native_test:test_control.
