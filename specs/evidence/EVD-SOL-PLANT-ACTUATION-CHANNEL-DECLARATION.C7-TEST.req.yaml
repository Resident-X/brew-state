text: |-
  The values compared against were recorded from the build as it stood before this change and are carried in the tests as hexadecimal literals, so they are exact and could not have been regenerated from the build afterwards. The machine-describing structure declares every channel the vocabulary carries; its four quantities are compared at four checkpoints along a rest-heating-working sequence and are required to match as stored rather than within a tolerance. The control logic's use of the hardware seam is pinned the same way: the level driven on the brew heater and the number of writes at each of ten readings from cold to past the setpoint, together with the too-soon, sensor-invalid and fault-latched steps that follow. An independent reviewer rebuilt both halves from the pre-change tree and reproduced every recorded value.
