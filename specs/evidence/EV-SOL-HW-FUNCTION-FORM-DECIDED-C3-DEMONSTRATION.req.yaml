text: |-
  Inspection of the constraints record against each clause. Every pending mark held against the choice of form is ended or re-pointed: supply module isolation (row and register row) now 4.2 kVac, Mean Well IRM-20 spec file IRM-20-SPEC 2025-11-21, read 2026-10-23; the wall-mount drop-in and thermal-judgement mark removed and answered in the forms record, prose at the enclosure-air section updated; barrier-rating mark re-pointed to DEL-HW-PARTITION-AND-FEASIBILITY.C3 and .C5; transducer part/check mark re-pointed to .C5 with the S1 check recorded; unstocked-module price mark re-pointed to .C5 for the two items not read (spreader plate and faston tabs, S1 transducer: recorded absent); heatsink mark re-pointed to the assembly task with datasheet targets; transformer mark removed (no designed converter chosen). The proof-of-life section and the interval register row were not touched (git diff shows no hunk in them); the two tests that read the record pass. Each barrier part has a sourced candidate rating with revision/date (IRM-20-5 4.2 kVac; onsemi MOC3083M opto-triac 4170 VACRMS one minute, MOC3083M/D Rev. 2 September 2022 (the heater switch; RA2425-D06 4000 VACrms kept as the comparison only; the triac tab 2500 VRMS, S17 DS2114 Rev 11, May 2018); MOC3052M 4170 VACRMS Rev 4; LTV-814 5000 Vrms Rev K; HF115F-Q 5000 VAC 2024 Rev 1.00; Ashcroft S1 500 Vac Rev I); ratings not sourced are recorded absent (EARU SSR; the BTA16 tab insulation test duration; XDB401 and Danfoss MBS 3000 withstand; WIKA A-10 burst; test durations). The numeric rating each barrier needs is the declared separation basis's (not yet declared) and is stated as such, not invented. Transducer: proof 13.8 bar against 7.5, burst 34.5 bar against 10, full scale 6.895 bar inside 2.0-25 bar. component-specification.md changed only where it restated an ended figure or form (heater ambient note, steam-pressure row, controller candidate sentences). Added after the cold review: the stocked Lite-On MOC3083 (C10797) 5000 Vrms, AC for 1 minute, Rev B 04/28/2010 (S18), onsemi MOC3083M kept as the second sourced equivalent; the steam transducer S1 is recorded as proving pressure, burst, range and insulation only, not shown fit for bare steam (media limit 125 C against 158.8 C saturation at 6 bar absolute), the form being a bought transducer behind a condensate leg (Ashcroft S19, ifm S20) whose geometry and element temperature are the off-board assembly's design, DEL-HW-PARTITION-AND-FEASIBILITY.C5. Added after the final review: the transducer form is restated non-circularly: a bought transducer behind a condensate leg meeting the targets, read over I2C by preference, with a filtered analogue fallback input; the Ashcroft S1 (S11) proves the form on the analogue fallback path, with the divider target for the board task (output 4.95 V at 5.5 V supply to 3.3 V: ratio at most 0.667, taken as 0.66). The preferred XDB401-class I2C part has its figures read at the maker's product pages (S21; overload 150 % FS, burst 300 % FS, 105 C operating, 80 C compensation, 100 Mohm at 500 V, +-1 % FS): proof 1.5 F >= 7.5 bar needs F >= 5.0, burst 3 F >= 10 bar needs F >= 3.34, accuracy 0.01 F <= 0.25 bar needs F <= 25, so F above 5 bar to 25 bar passes (7 bar: 10.5 and 21 bar). Its withstand voltage is absent, so it is not fitted until sourced, and the form is not chosen on it. The Ashcroft part is written 'the Ashcroft S1 (S11)' wherever it could collide with source S1 (Mean Well).
