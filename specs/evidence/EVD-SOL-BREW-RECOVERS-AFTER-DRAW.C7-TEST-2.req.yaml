text: |-
  The disturbed state the extraction is served from is produced by commanding the draw as an ordinary delivery and advancing the truth plant step by step through the closed-loop harness, unchanged from the previous evidence for this criterion: the volume the machine actually moved is accumulated from the plant's own reported flow and required to equal the two hundred millilitres asked for, and no plant state is written between bringing the loop up rested and the extraction that follows.

  What changed, under SOL-POST-DRAW-RECOVERY-PROOF-STILL-OWED.C1: the prior evidence (EVD-SOL-BREW-RECOVERS-AFTER-DRAW.C7-TEST) additionally required the casting to have ended outside the brew-temperature band, which SOL-POST-DRAW-DISTURBANCE-PROOF-RESTORED.C1 later proved no admitted closed-loop-driven scenario can do. That requirement is replaced with a floor read off the truth plant -- movement of more than 0.00005 C off the rested baseline -- which the volume-moved check already establishes came from a real draw rather than a written state. Run under pio test -e native_test. Supersedes EVD-SOL-BREW-RECOVERS-AFTER-DRAW.C7-TEST.
