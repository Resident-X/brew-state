text: |-
  With hw_sim_set_sensor(HW_SENSOR_FLOW, HW_READING_ABSENT, ...) and separately HW_READING_FAILED, both planting a value that would depart if treated as valid (800 against a 2000 commanded rate, 300 band), control_step does not return CONTROL_STEP_DELIVERY_DEPARTED on that cycle. Per DEC-DEPARTURE-OBSERVED-NOT-MODELLED, no reading is not evidence of a departed one.
