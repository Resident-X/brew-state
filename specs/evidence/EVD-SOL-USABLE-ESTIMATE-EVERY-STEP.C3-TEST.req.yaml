text: |-
  The observations each reconstructed state rests on are declared in include/estimator.h beside the state vocabulary as ESTIMATOR_STATE_OBSERVATIONS, read from there by estimator.c rather than restated, and width-guarded by a static assertion. Inside the declared window the state is still answered and still tracks a reference plant_model_t advanced identically, so an estimator that froze rather than predicted would part company with it. Withdrawing the steam temperature and both pressures -- channels the answered state does not rest on -- for two hundred steps, far beyond the window, leaves it answering, which a rule keyed on channels rather than states would not.
