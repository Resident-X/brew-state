text: |
  Inspection of the criterion clause by clause, read at the commit named in the artifact version, with the cited files unmodified against it. The record read is docs/sunbeam-em7000/controller-board-division.md, section "The anticipated channel kinds", its table of kinds (rows 1 to 12 and the frequency row), column "Interface: loading carried now -> added", against hardware/sunbeam-em7000/main-board/controller-pin-table.md, pin-allocation.yaml and the sheets under hardware/sunbeam-em7000/main-board/sheets/ (31-controller.yaml net membership and no_connect list; 52, E1 and E3 for the connectors and converters).

  Clause "Reserved capacity is on the interfaces in use and is not only unused connector count". Each row states its interface as a controller pin, a bus with its chip select, or a stated absence of one, and the row's pins match the pin table, the allocation record and the controller sheet:
  - Row 1 (supply voltage): "No conversion input of the controller", U601 on SPI3 (PC10, PC11, PC12), AMC_CS on PA15, AMC_DRDY on PC6, AMC_RESET on PC8. Pin table rows 77, 63, 65, 78 to 80 and pin-allocation.yaml amc_cs, amc_drdy, amc_reset, spi3_sck, spi3_miso, spi3_mosi give the same pins; sheet 31 puts U401 pins 77, 63, 65, 78, 79, 80 on those nets. "PB1 (ADC12_INP5) is unconnected": pin table row 35 "no connect", on sheet 31's no_connect list, absent from pin-allocation.yaml. The row's capacity statement, "8 of the 16 conversion pins are placed (PC0, PC1, PC4, PC5, PA0, PA2, PA3, PA6) and 8 are free (PA1, PA4, PA5, PA7, PB0, PB1, PC2_C and PC3_C)", equals the converter-input map's eight rows and its sentence "Eight conversion pins are placed. Eight remain free". "SPI3 carries three slaves, U601 and the converters U620 and U621, with selects on PA15, PD0 and PD1": E3 puts PT1_CS on U620 pin 13, PT2_CS on U621 pin 13 and SPI3_SCK on both, and pin table rows 81 and 82 name PD0 and PD1. "U601's two channels are both used (voltage and current)": the E1 sheet function text reads the mains voltage as channel 0 and the supply current as channel 1. Matches.
  - Row 2 (weight): "PD2 (WT2_DATA), PD3 (WT2_CLK), PD5 (WT1_DATA), PD6 (WT1_CLK)" equals pin table rows 83, 84, 86, 87 and sheet 31's nets for U401 pins 83, 84, 86, 87; pin-allocation.yaml carries wt1_data PD5, wt1_clk PD6, wt2_data PD2, wt2_clk PD3. "PD4 is unconnected": pin table row 85 "no connect", sheet 31 no_connect U401.85. "The committed pin table lists 22 unconnected pins, the analogue-only pads PC2_C and PC3_C and 20 port pins": the table has 22 "no connect" rows, and sheet 31 lists 22 U401 pins in no_connect (the other two entries are J401's). "14 digital-only (PB4, PC13, PB13 to PB15, PC9, PD4, PD7, PE1, PE7 to PE11)": counted, 14, and none carries an ADC channel in the table's function column. "6 that can also read an analogue level (PA1, PA4, PA5, PA7, PB0, PB1)": exactly the six with ADC channels in rows 23, 28, 29, 31, 34, 35. "11 of the 20 are 5 V-tolerant (FT) and 9 are 3.3 V-tolerant only (TT: PE7 to PE11, PA4, PA5, PA7, PB1)": from the table's class column the FT pins among the 20 are PC13, PA1, PB0, PB13 to PB15, PC9, PD4, PD7, PB4, PE1, which is 11, and the TT pins are the nine named. 11 + 9 = 20. The text's statement that the 26 pins of component-specification.md is the figure before routing is consistent with the pin table's own "Differences from the record's allocation" section. Matches. (The pin table's differences section also restates an earlier record's list of 20 5 V-rated free pins and what remains of it; that is a quotation of the earlier record and is not the division record's figure.)
  - Row 3 (further temperature and pressure inputs, not given): "two conversion inputs (PA4, PA5) and one on an I2C bus ... the bus is I2C1 on PB8 and PB9 (nets STM_SCL and STM_SDA, header J521)". PA4 and PA5 are free in the pin table (rows 28, 29). Pin table rows 95, 96 give I2C1_SCL and I2C1_SDA AF4 on PB8, PB9; sheet 52's header table gives J521 pin 3 = STM_SCL_X and pin 4 = STM_SDA_X; sheet 31 nets for U401 pins 95, 96 are STM_SCL and STM_SDA. "PB6 and PB7, once I2C4, carry the display link": see row 12. Matches.
  - Row 4 (group-head instrumentation, not given): "two conversion inputs (PA7, PB0)": both free (pin table rows 31, 34) and the pin table's converter-input map names them as the allocation record's direct group-head inputs. Matches.
  - Row 5 (second current channel): "PA3 (ADC12_INP15)": pin table row 25 CURR2_AN, converter-input map, pin-allocation.yaml curr2_an PA3. Matches.
  - Row 6 (further switched output): "None", recorded as "Not reserved, by the owner's choice (2026-10-24)", with no criterion named because none is weakened; no pin is claimed, and no further output pin is placed in the pin table. Matches.
  - Row 7 (spare analogue input): "PA0 (ADC1_INP16)": pin table row 22 SPARE_AN2, pin-allocation.yaml spare_an2 PA0, sheet 31 net SPARE_AN2. Matches.
  - Row 8 (first current channel): "PA2 (ADC12_INP14)": pin table row 24, pin-allocation.yaml curr1_an PA2. Matches.
  - Row 9 (total supply current): "No conversion input of the controller", channel 1 of U601 on the same SPI3 bus and select PA15; "PA1 (ADC1_INP17) is unconnected": pin table row 23 "no connect", sheet 31 no_connect U401.23. "U601 has no third channel": AMC131M02 is the two-channel part named in sheet E1 and in the row. Matches.
  - Row 10 (real-time clock): "PC14 and PC15 (OSC32); no further pin": pin table rows 8, 9 LSE_IN and LSE_OUT, pin-allocation.yaml lse_in PC14, lse_out PC15, sheet 31 nets LSE_IN and LSE_OUT on U401 pins 8 and 9. Matches.
  - Row 11 (in-stream probes): "SPI3 on PC10, PC11, PC12, chip selects PD0 (PT1_CS) and PD1 (PT2_CS)": pin table rows 78 to 82, pin-allocation.yaml pt1_cs PD0, pt2_cs PD1, sheet E3 chip-select nets on U620 and U621. "The probes themselves are not fitted": the row states it, matching the criterion's exclusion. Matches.
  - Row 12 (brew-path pressure transducer): "PA6 (ADC12_INP3, net BREW_AN) from J524 pin 4": pin table row 30, pin-allocation.yaml brew_an PA6; sheet 52 net BREWA_RAW holds J524.4 and runs through the divider and series resistor to the net BREW_AN (R536.2). "PB6 and PB7 ... carry the display unit's serial link on J522 pins 3 and 4 (USART1 transmit and receive, alternate function 7)": pin table rows 92, 93 read "USART1_TX AF7 (display link, header J522 pin 3)" and "USART1_RX AF7 (display link, header J522 pin 4)"; sheet 52's header table gives J522 3 = BREW_SCL_X and 4 = BREW_SDA_X; pin-allocation.yaml display_tx PB6, display_rx PB7. "The I2C1 pair on PB8 and PB9 on J521 is the steam-path sensor's": as row 3. Matches.
  - Frequency row: "PA10, capture on both edges (TIM1_CH3); adds nothing": pin table row 69 ZC_IN, TIM1_CH3 AF1; pin-allocation.yaml zc_in PA10. Matches.

  Clause "Fitting the probes or sensors themselves is out of scope". The division record fits no probe or sensor: row 11 says the probes are not fitted, and every row gives an interface and a place, not a fitted sensor. Nothing in the criterion is asked beyond the interfaces.

  Title clause "each anticipated channel kind is designed in at its place on the interfaces in use, and each not placed is recorded with the criterion reserving it would have weakened". Every kind has a row (12 rows and the frequency row). The kinds given a place name a header and circuit block and a pin or bus on the interfaces above; kinds 3 and 4 are not placed and each records the weakened criterion as "the fit", bound by the header regions; kind 6 is not reserved by the owner's choice and says no criterion is weakened. Free capacity is stated on the interfaces in use: eight free conversion pins named, SPI3 with three selects named, 20 unconnected port pins named with their 5 V class split, and U601's channels counted. Result: every clause holds.
