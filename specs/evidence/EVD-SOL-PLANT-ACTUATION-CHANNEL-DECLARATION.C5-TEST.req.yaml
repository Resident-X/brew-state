text: |-
  The refusal record carries the fault and the offending channel by its value in the shared set. One test requires the reported channel to be the one commanded; a second requires the unanswered-channel fault to be distinct from a null argument, an uninitialised instance, a zero interval and a level beyond full scale, and requires a step that ran to report OK rather than leave the previous record standing. A third commands a level that is both beyond full scale and on an unanswered channel eight times over, with the record pre-filled with a poison value each time, and requires the same fault and the same channel every time -- the fixed precedence the seam documents. Existing consumers that only test the boolean were not edited: the three-argument step operation keeps its signature and is written once in the shared plant sources. The mutation fault-order-left-to-the-implementation is caught.
