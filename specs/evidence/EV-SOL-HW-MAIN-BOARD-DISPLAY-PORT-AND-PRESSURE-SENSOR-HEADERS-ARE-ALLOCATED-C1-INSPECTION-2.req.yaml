text: |-
  Read the pad nets of hardware/sunbeam-em7000/main-board/main-board.kicad_pcb (sha256 b36b950ac2737d64f7b2e15742923e3163507bc7427bc0c925cb0c74c84f12f8) at commit 923d3d75bd2e1fc91c0b318fc3f3197e89bfd4d4. J522 pad 3 is net BREW_SCL_X and pad 4 is BREW_SDA_X; each reaches the controller through one series resistor, R527 to net BREW_SCL on controller pin 92 and R528 to net BREW_SDA on pin 93. The controller pin table names pin 92 as PB6 and pin 93 as PB7. The alternate function that makes PB6 and PB7 the first serial port's transmit and receive (AF7) is the datasheet's, DS12110 Table 10, as recorded in the component specification; the pin table lists I2C4 (AF6) for the pair and not USART1, and the datasheet table was not re-read here. J522 pad 1 is net BRWD_3V3, the 3.3 V feed, and pad 2 is GND; the logic is 3.3 V because the controller pins are 3.3 V parts on the 3.3 V rail.
   This is the reading of the board after its folder was renamed from main-board-v2 to main-board and its title silk was replaced (DEC-BOARD-VERSION-NAMING-V2-WORKING-NAME). The earlier reading, at sha256 9bcc3ebdd8a3c3f7e6d080947431c5375577251747638e63996a7dbebbad506e, read the same pads and nets. Between the two files only F.SilkS items differ (the old title text items are gone and the new title text and the logo polygons and lines are added; a comparison of the two files shows no changed footprint, pad, track, via or zone), and the locked-copper comparison of the four Mains classes passes on all 266 recorded items, so every pad net stated above holds on this board; the pad nets were carried over on that ground and not read again pad by pad.
