text: |-
  The test reads firmware/params/thermoblock.params off disk -- the file itself, through the path the build names, not a copy of its values -- and loads it into the thermoblock structure. It asserts no coefficient missing, none outside the range that structure declares admissible for it, and no line refused, the origin annotations included. A refusal reports the fault, line and coefficient rather than a bare failure.

  A model instance initialised from that record then advances over 1200 steps of 100 ms under simultaneous heating and pumping, every step returning true, and answers every quantity the seam enumerates with a finite value. Brew temperature is required to have risen above where the instance started, read back through the seam rather than out of the record, so a description arriving as zeroes or an instance answering with its own initial state fails.

  This is what catches the description drifting from the code on the day the structure's coefficient set changes, which is otherwise silent because nothing else reads the file that closely.
