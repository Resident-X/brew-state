  2. R828 (resistor 0.6 x 250 mW = 150 mW): open-items 'Wall board interface limits' (d). Recomputed: 5.25^2/100 = 0.2756 W shorted; (100+Rb)^2 >= 5.25^2 x 100/0.15 = 18,375; Rb >= 35.55 ohm (35.87 ohm at 99 ohm). Requirement: buzzer >= 36 ohm. Covered.
  3. C792 (33 mArms at 105 degC, 120 Hz): M35 calculation, margins 33/1.6 = 20.6, 33/5.4 = 6.1, 33/18 = 1.83 (record: >=20x smooth, 1.8x chopped). M35 (no longer labelled 'closed'; bounded by calculation and carried to bring-up) changed at 0e8b061d: the fixed 33 mVpp limit is dropped because the 0.5 ohm ESR is not a maker figure (DF 0.20 at 120 Hz = about 5.6 ohm there, nothing at 100 kHz); the limit is now Vpp / (2 x Z) <= 33 mArms, i.e. Vpp <= 66 mA x Z (recomputed 2 x 33 = 66), with Z read on a spare part at the ripple frequency (LCR at 100 kHz, or generator through 10 ohm: Z = Vcap/(Vres/10 ohm)). Same form as M36, rests on the maker's 33 mArms and two readings; open-items, circuit-verdicts C792 row, bring-up/D.yaml and bring-up-provision.md all agree (diff checked); fallback polymer part, same footprint. Covered.
  4. C302 (48 mArms at 105 degC, 120 Hz, Samyoung BDS(MVK); 1.08 at 100 kHz not used): M36 carried under DEC-UNPUBLISHED-MAKER-FIGURES-CARRIED-TO-BRING-UP; limit Vpp <= 96 mA x Z (recomputed 2 x 48 = 96; e.g. 48 mVpp at 0.5 ohm = 48 mArms); limit rests only on the maker's figure and two readings; failing reading changes part, same footprint; circuit-verdicts.md C302 row states it; bring-up/B.yaml step TP301. Covered.
