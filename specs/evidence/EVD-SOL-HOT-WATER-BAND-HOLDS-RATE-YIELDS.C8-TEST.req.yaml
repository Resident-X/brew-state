text: |-
  A flat-course test shows the yielding run asks less heater duty than the non-yielding one. A discriminating ramping-course test (two courses sharing a rate at the sampled instant, differing only in what they bend to ahead of it) shows the heater-duty gap between two peaks shrinks by the yield fraction while yielding rather than staying at its unyielded size -- the only construction that can tell a proportion from a difference, which is exactly what C8 requires.
