text: |-
  Two runs are driven with an identical injected reading sequence, differing only in the outlet conduction time constant the estimator reconstructs with. The commanded duty differs between them. A law closed on the sensed heated-mass temperature is handed the same numbers in both runs and could not produce a different duty, so that dependence is what establishes both that the objective is the reconstructed water temperature and that the two quantities are not related by a fixed offset.
