text: |-
  control_step no longer treats an absent brew residual as grounds for shut_down; it drives from the reconstructed state while the estimator supports it and shuts down on the estimator's refusal instead. The test replacing test_invalid_reading_de_energises_and_latches withdraws the reading for a run inside the window and shows the heater still driven and the fault flag still clear, then carries the gap past the window and shows the latch arrive, then shows a good reading afterwards does not un-latch it. The suite SOL-UNMEASURED-STATE-RECONSTRUCTION.C4 rests on keeps a case exercising a reading the control law cannot trust reaching the estimator rather than the sensor seam. Clearing the latch remains out of scope and untouched.
