text: |-
  Both structures' drawn_steam_power_w() sums the latent heat with the heat capacity times the lift from the feed temperature to saturation, and the tests hold the sum against the closed form of each structure's own balance. The half this slice added is isolated by moving the feed temperature alone; the shape of the term is pinned by the cost being the same wherever the block sits, which separates a difference between coefficients from one taken against the state; the zero-draw boundary and the feed-above-saturation floor are compared byte for byte. Run under task fw:verify with the mutation sweep clean.
