text: |-
  The fixture and boiler structures keep no state for the water leaving the heated mass, and against both the estimator refuses to initialise rather than running on a substitute: the instance answers nothing afterwards, steps refuse, and no residual is reported. The thermoblock structure keeps it and is accepted. The control law treats that refusal as it treats an untrustworthy reading -- the heater is commanded off and the fault latches -- and the host entry point walks that path, asserting the heater is off and that 64 subsequent steps are all latched. env:native_fixture and env:native_boiler build and run clean under task fw:run, whose artefact runner fails the gate on a non-zero exit, and all five artefact runs completed. The narrow and boiler suites pass, at 13 and 24 cases.
