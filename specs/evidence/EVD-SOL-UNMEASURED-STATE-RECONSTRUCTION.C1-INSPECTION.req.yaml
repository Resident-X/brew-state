text: |-
  check_plant_header reports that include/estimator.h declares 4 operations, names no structure and compiles against all 3 of them (boiler, fixture, thermoblock). Its vendor-neutrality is covered by check_encapsulation.py, which now takes the header as a subject alongside src/estimator: the header cannot be inspected by check_header_neutral.py, which requires a header to compile against nothing, and this one names the plant seam's neutral types by design. Both run before every build in every environment and fail it. The header enumerates estimator_state_t in its own words rather than reusing plant_quantity_t or plant_state_t, and carries no equation.
