text: |-
  estimator_step tests each channel's reading against that channel's declared span before reaching correct_against. The first test advances two instances identically, one with the brew channel reporting nine hundred degrees and one with it absent, and shows the reconstruction ending in the same place -- so an absurd reading takes exactly the path an unobtainable one takes -- and that no residual is reported for the skipped channel. The second exercises the declared low, the declared high, and the step either side of each, so a comparison written the wrong way round fails rather than passing.
