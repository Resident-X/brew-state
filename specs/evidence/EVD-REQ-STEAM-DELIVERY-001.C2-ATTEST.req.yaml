text: |-
  Tier 2 attestation of REQ-STEAM-DELIVERY-001.C2.

  Final-state intent: delivery is prevented until the steam side can sustain it, in a way the operator cannot act around by accident.

  Composition: SOL-SIM-STEAM-READINESS-GATE (active evidence C1 through C5-TEST).

  Intent fit: the solution withholds the steam feed pump -- the one thing standing between a draw and getting more steam made for it -- whenever measured pressure sits below the declared ready threshold, which is this criterion's prevention claim. The solution's own exclusion of physically blocking the manual valve is consistent with its stated premise that withholding feed is what prevention means for this actuation layout.

  Acknowledged scope boundary: verified in host simulation against the plant description's estimated parameters -- no real machine has been measured yet. That dependency is recorded explicitly as DEC-SIMULATION-FIDELITY-ASSUMED-UNTIL-MEASURED (an assumption decision with validation_horizon DEL-BREW-STATE-DELIVERY.C3), which this attestation's parent requirement links justified-by. Per DEL-BREW-STATE-DELIVERY.C1's own definition of phase-1 closure, that is the scope this phase's attestation is meant to reach -- not a claim about the real machine.

  Decision: attest. Within the acknowledged simulation-phase scope, no unstated gap against the criterion's final-state intent.
