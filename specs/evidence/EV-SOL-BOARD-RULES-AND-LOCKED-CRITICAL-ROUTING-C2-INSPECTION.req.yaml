  # Demonstration: rules confirmed, critical copper locked, and the routing round trip checked

  Verified commit: 587a9e7 (branch req/SOL-BOARD-RULES-AND-LOCKED-CRITICAL-ROUTING/build-rules-routing). The tooling exercised (hardware/tools/locked_copper.py, hardware/tools/board_check.py, Taskfile.yml hw:rules-confirm / hw:copper-lock / hw:copper-record / hw:copper-compare) is the committed state at that commit; the working tree was clean apart from .stage0/. Supersedes the run at 6664ab6.

  Releases: KiCad 10.0.7 (kicad-cli, its board editor and its bundled Python with pcbnew), Freerouting 2.5.0 (freerouting-2.5.0.jar, 64599107 bytes), Eclipse Temurin OpenJDK 26.0.1, Task 3.49.1, macOS 26.6.2, Konnect MCP server as installed.

  Throwaway board: a copy of hardware/proof/gate-proof in the session scratchpad (`demo/`, never committed), MAINS=present, Mains membership by the project's `/MAINS_*` pattern, the proof's own rules file (Mains separation rule, 3 mm / 4 mm). The critical copper was prepared as text (prepare.py: both low-voltage nets' tracks dropped and left for the router; /MAINS_L as an F.Cu track, a through via at (12.5, 10) and a B.Cu track; the two /MAINS_N tracks kept; a /MAINS_N zone on B.Cu), all of it UNLOCKED, so that the lock command does the locking. Hand routing through Konnect was not exercised: Konnect's routing tools act over KiCad's IPC endpoint, which another KiCad already running on this machine (holding a different project, left untouched) held, so a board editor started here took an endpoint of its own that Konnect does not reach. Working folder `demo-work/` is a sibling of the design folder. Commands are run from the board's folder in the method's order (KICAD_CLI, KICAD_PYTHON, FREEROUTING_JAR set to the local paths); Java final-field warnings, pcbnew wx asserts, task echo lines and Freerouting's other INFO lines are elided.

  ## Lock-file and editor measurements (KiCad 10.0.7, macOS, board editor started on its own)

  - Opening a board writes `~<board>.kicad_pcb.lck` and `~<board>.kicad_pro.lck` beside it, each holding exactly `{"hostname":"Mac","username":"david"}` (no process id).
  - `osascript -e 'quit app "pcbnew"'` removes both; a plain `kill` (SIGTERM) leaves both behind.
  - Reopening over a stale lock with the same user and host opened without blocking (the quit AppleEvent then returned at once) and rewrote the board's lock file, but left the stale project lock file after quitting.
  - Quitting the editor rewrote the project file with defaults filled in (7788 -> 14141 bytes) and wrote `<board>.kicad_prl`; MAINS and the Mains pattern came through unchanged.
  - A text variable and a net class pattern written to the project file while the editor held the board were gone after it quit: the editor writes its own copy over the file.
  - Konnect: no tool closes the board or the editor (project, config, verification, editor_navigation and pcb_routing toolsets loaded and read; list_toolboxes names UI control only in `verification`: `check_kicad_ui`, `launch_kicad_ui`). `open_project` naming a board reports only boards in the KiCad on `/tmp/kicad/api.sock`; a board editor started while another KiCad held it served `/tmp/kicad/api-<pid>.sock` and `open_project` reported the board not open (`requested_open: false`).

