  ## Reading the log

  The rules confirmation asked KiCad, on a copy of the board with its own rules file and the appended marker, and listed the Mains nets KiCad resolves through the project's pattern; a misspelled constraint made KiCad drop the whole rules file and the command failed naming the rejected rule; a MAINS of "yes" was refused. With the board open in the board editor, the lock command refused on KiCad's lock file and left the board unchanged; quitting the editor removed both lock files. With the board closed, the lock command refused a class list leaving out Mains on a board declaring mains, recording refused the six unlocked items by name, and the lock command then locked those six and nothing else (the board file's only change: six `(locked yes)` lines). The record took the six locked items; the exporter wrote each as `(type fix)`; Freerouting routed only the two low-voltage nets; the import's save did not rewrite the project file this time, since the editor's quit had already filled in KiCad's defaults. The comparison passed (7 segments: 4 locked Mains + 3 router-placed; 1 via; 1 zone; still 6 locked), and the pre-order check, on a throwaway git repository holding only the imported design, passed it. A stale lock file beside the board failed the comparison as OPEN; an unlocked via failed it by name. task's exit 201 wraps the check's exit 1.

  Not exercised here: hand routing through Konnect's routing tools and Konnect's `launch_kicad_ui` (another KiCad held the IPC endpoint and was not disturbed); quitting KiCad's project window with `osascript -e 'quit app "KiCad"'` (the only one running belonged to other work); the Windows and Linux forms.

  Also run at 587a9e7's content (code unchanged since): `task hw:test -- -p test_locked_copper.py` (45 tests, OK, 175 s) and `task hw:test -- -p 'test_board_check*.py'` (120 tests, OK, 686 s), KICAD_CLI set to KiCad 10.0.7's kicad-cli.

  Round 4 (commit 518a0b8, on top of the verified 587a9e7) changed only method and README text (the rules table's confirmation per row kind, the footprint-zone note) and the two Mains checks in hardware/tools/locked_copper.py (confirm refuses, and compare fails a record, leaving out Mains on a board declaring mains); observed `KICAD_CLI=/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli task hw:test -- -p test_locked_copper.py`: Ran 46 tests in 224.081s, OK.

  ## Round 5 — what KiCad's layout rule check enforces, measured (commit 7b06bab)

  Scratch copies of the synthetic `hardware/proof/gate-proof` board (outside the repo), each run with
  `kicad-cli pcb drc --severity-all --format json --units mm` (KiCad 10.0.7); pre-order check runs via `board_prove.check` (board_check.py).

  - baseline: 0 items; pre-order check `RESULT | PASS`, exit 0.
  - class Mains track_width 1.0 (Mains tracks 0.5): 0 items; pre-order check exit 0 — **not enforced**.
  - class Default via 1.2/0.6, via 0.6/0.3 on /LV_B: only `via_dangling | warning` (geometry), no size item — **not enforced**.
  - class Default clearance 3.0: `clearance | error | (netclass 'Default' clearance 3.0000 mm; actual 0.8400 mm)` ×4 — enforced.
  - board min_clearance 3.0: `clearance | error | (board minimum clearance ...)` ×8.
  - board min_track_width 0.3: `track_width | error | (board setup constraints min width 0.3000 mm; actual 0.2500 mm)` ×3.
  - board min_via_diameter 0.7: `via_diameter | error`.
  - board min_through_hole_diameter 0.4: `drill_out_of_range | error`.
  - board min_via_annular_width 0.2: `annular_width | error`.
  - board min_copper_edge_clearance 8: `copper_edge_clearance | error` ×7.
  - board min_hole_to_hole 1.0: `hole_to_hole | error`.
  - board min_silk_clearance 0.5: `silk_overlap | error` (silk to silk) and `silk_edge_clearance | warning | Silkscreen clipped by board edge`.
  - warning only (silk line crossing the edge): pre-order check `VIOLATION | ... | silk_edge_clearance`, `RESULT | FAIL`, exit 1 — warnings fail the board.
  - custom `(condition "A.hasNetclass('Mains')") (constraint track_width (min 1mm))`: `track_width | error | (rule 'w' min width 1.0000 mm; actual 0.5000 mm)` ×3; pre-order check exit 1.
  - custom via_diameter min 1.2mm on Default: `via_diameter | error | (rule 'v' ...)`; custom hole_size min 0.6mm: `drill_out_of_range | error | (rule 'h' ...)`.

  Rewrite (docs/board-design-method.md :5, :60, :76-91, :136, :146): the layout rule check enforces board-wide minimums and class clearance (error, or warning for silk-to-edge, both failing the pre-order check); a class's track width and via sizes are routing defaults only; a width or via size the board relies on is a custom rule conditioned on the class, confirmed by step 3 and enforced by the pre-order check. hardware/README.md left unchanged: its enforcement sentences (separation, warnings count, net class cannot undercut the appended rule) hold as measured. No tooling change.
