text: |
  Clause-by-clause inspection of the delivered text at commit 481acb79af3c3ebc2823dc363cd1c4db7d201ad0 against SOL-PRE-ORDER-CHECK-FAR-CHANNEL-NEEDS-A-CONTROLLER-PIN-ONLY.C2.

  Clause 1, the hardware readme states a far channel is held to a controller pin in another design's record: hardware/README.md line 407 reads "`far_channel`, on a record whose top level carries `controller: none`: the name, as the channel enumeration names it, of a channel that another design in the same machine folder lists with a controller pin; a connector on that entry is not required." and line 409 reads "Each `far_channel` must be a channel that another design's record in the same machine folder lists with a controller pin, whether or not that entry names a connector, and one that no such record lists, or lists with no controller pin, fails the design, naming the channel (`pin_allocation`)". Met.

  Clause 1, the design method states the same: docs/board-design-method.md line 5 reads "each a far channel that another board in the machine folder lists with a controller pin (a connector on that entry is not required), or a rail". Met.

  Clause 2, that a connector on that entry is not required: stated in the three passages above (README 407 "a connector on that entry is not required", README 409 "whether or not that entry names a connector", method line 5 "a connector on that entry is not required"). Met.

  Clause 3, no statement in either document says the far-side entry carries a connector: grep for "controller pin and a connector" over hardware/README.md, docs/board-design-method.md, hardware/tools/board_check.py and hardware/tools/board_prove.py returns zero matches in each; a case-insensitive search of docs/board-design-method.md for "far channel", "far-side" and "far_channel" finds line 5 alone, and the readme's rule that a controller:none record's OWN entries give connector and connector_pin (line 409, first sentences) concerns the wall-side entry, not the far side. Met.
