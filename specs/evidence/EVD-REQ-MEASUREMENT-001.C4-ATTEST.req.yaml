text: |-
  Tier 2 attestation of REQ-MEASUREMENT-001.C4.

  Final-state intent: sensing error is carried explicitly in the margin the controller commands within, on the channel that margin protects -- not merely acknowledged in prose, and not folded silently into a figure that could be zero without a reader noticing.

  Composition: SOL-SIM-ROBUSTNESS-MARGIN-WIDENS-WITH-SENSING-ERROR, with active evidence EVD-SOL-SIM-ROBUSTNESS-MARGIN-WIDENS-WITH-SENSING-ERROR.C1/.C2/.C3-TEST.

  Intent fit: protection_margin_t carries a dedicated sensing_error_c field, separate from unwidened_c and worst_corner_c, added on top of the model-error corner (never compared against it) per DEC-SENSING-ERROR-ADDS-TO-COMMANDED-MARGIN. Both control.c and steam_control.c's public margin readers carry a nonzero CONTROL_SENSING_ERROR_C / STEAM_CONTROL_SENSING_ERROR_C. Tests confirm the addition is exact (doubling the declared figure doubles what it adds -- distinguishing addition from a worst-case max) and that a non-positive or NaN sensing error contributes nothing, matching the same clamp discipline unwidened_c already carries. The committed record (docs/protection-margin.md) and its regenerate-and-compare test suite name the sensing-error figure explicitly on both loops, so the carrying is auditable, not merely present in memory.

  Acknowledged scope boundary: the declared sensing-error figure is an estimate (@estimated in params/control.declaration) rather than a measurement of a specified sensor part, because no temperature-sensing part has been selected for either channel yet (confirmed against docs/reference-machine.md and REQ-MEASUREMENT-001's own rationale, which leaves sensor choice open). The criterion requires the error be carried explicitly, not that it be measured -- REQ-MACHINE-CONFIGURATION-001.C5's own provenance-marking discipline is exactly what accommodates a declared-but-estimated figure, and the SOL's own text and rationale were amended (version 3) to say so plainly rather than claim a sourced-from-a-part reading. This deferral is named, not silent.

  Decision: attest. No unstated gap against the criterion's final-state intent.
