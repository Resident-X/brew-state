text: |-
  Tier 2 attestation of REQ-ROBUST-CONTROL-001.C3.

  Final-state intent: commanded margin accounts for model error as well as sensing error -- both halves of what a margin protecting a hardware trip point has to survive, not the model-error half alone with sensing error left implicit or assumed zero.

  Composition: DEL-SIM-ROBUSTNESS-VERIFICATION (aggregation deliverable, contributes via cascade, no direct evidence of its own), SOL-SIM-ROBUSTNESS-MARGIN-WIDENS-WITH-MODEL-ERROR (active evidence EVD-...C1/.C2/.C3-TEST, previously attested), SOL-SIM-ROBUSTNESS-MARGIN-WIDENS-WITH-SENSING-ERROR (active evidence EVD-...C1/.C2/.C3-TEST, this slice).

  Intent fit: the model-error solution established the commanded margin itself and its worst-corner enumeration over declared plant-coefficient error, wired into delivery admission on both loops. The sensing-error solution closes the half that solution explicitly left open: it adds each loop's declared sensing error on top of that worst corner (DEC-SENSING-ERROR-ADDS-TO-COMMANDED-MARGIN), reasoned as additive rather than worst-case because sensing error is present regardless of which model-error corner is real, so a worst-case-only combination would silently drop it in the ordinary case this requirement's own rationale names (model error larger than sensing error). Together the two solutions mean the margin the controller now enforces on both loops is unwidened gap + worst model-error corner + declared sensing error -- both terms this criterion names, combined by a rule specific to each term's actual relationship to the other rather than one borrowed rule applied to both.

  Acknowledged scope boundary: the sensing-error figure is a declared estimate rather than a measured or datasheet reading, since no sensor part is yet specified for either channel (see REQ-MEASUREMENT-001.C4's own attestation for the same point). This criterion asks that the margin account for sensing error, not that the account be built from a measured figure -- the accounting mechanism (explicit addition, provenance-marked) is what it requires, and that is fully built. No other deferral: the joint mains-droop corner, the model-error solution's own remaining scope boundaries, and estimator-side error (REQ-STATE-ESTIMATION-001's separate concern) are all named and unrelated to this criterion's own text.

  Decision: attest. No unstated gap against the criterion's final-state intent.
