text: |-
  check_plant_header.py passes on include/plant_model.h and, under --vocabulary-only, on include/plant_types.h. Both run inside every pio run. Each is required to name no structure, to reach into no structure's record, to carry no function definition, to name no vendor symbol, and to compile standalone against a freestanding compiler with each structure's directory in turn -- which is what a header naming a quantity only one structure has would fail. Both are inspected against a vocabulary that excludes the header itself, so neither can clear itself of what it does. Confirmed to fail on a planted macro reaching a thermoblock coefficient from each header in turn.
