text: |
  # SOL-BOARD-LAYOUT-PLACEMENT-CHECKPOINTS.C5: the seeded blind layout review repeated on the changed method

  **Verified commit:** `b4a8e0125b3c03b2889afe4c02d433ce363a3ad3` (branch `req/SOL-BOARD-LAYOUT-PLACEMENT-CHECKPOINTS/placement-checkpoints`). The commits after it on the branch change only the graph (`specs/`), never the design, the documents or the tools the seeding command reads.

  **Result:** 21 seeds, 21 reported against the catalogue item that covers them, none missed, in one blind run made in a new session after the catalogue's Judged on lines, the review's views (the placement view added beside them) and the review step (step 7's placement-caused closure) reached their final form on this branch.

  **How it was run.** `task hw:review-seed -- --seeds <tmp>/seeds.json --out <tmp>/review` at the verified commit, into a new folder outside the repository. It printed `CHECK | RESULT | PASS | all 1 designs passed`, `VIEWS | RESULT | WRITTEN | 119 images…`, `PLACEMENT | RESULT | WRITTEN | 4 images, their index and the placement's measures` and `SEEDS | 21 seeds`. A fresh headless session (`claude -p --model claude-opus-5-5`, tools Read, Grep and Glob only, started in the review folder) was given the fixed prompt `task hw:review-seed -- --print-prompt` prints, and nothing else. The seed list stayed outside the folder.

  **Folder.** Seed list sha256 `db531c6dcd2526ad59d373e40f873edd09d2490fc0ded9a20c6aa7c930760ce7`; `check-report.txt` sha256 `785def1989f08137f6e9c20b49ca221498f864cc7d8b0bec18040693b18407c0`; seeded `review-proof.kicad_pcb` sha256 `9f927fb964bbd9aa226ed98907ddeec83e5d3646aad79d42489a91fb4ed401a3` (its seeded items take fresh identifiers on each seeding).

  ## Run

  | Run | Commit | Session | Turns, time | Permission denials | Seeds reported against their item |
  |---|---|---|---|---|---|
  | 1 | `b4a8e0125b3c03b2889afe4c02d433ce363a3ad3` | `f7c9bb0d-cb22-4b88-9513-3c0878d38952` | 112 turns, 935 s, ended `success` | none | 21 of 21 |

  Scoring: a separate fresh session given only the seed list and the run's output matched each seed to the review's finding on the seed's own catalogue item at its place, strictly (a generic fail on the item not describing the defect did not count). Two seeds had a second part the review described under a neighbouring item as well as reporting the seed against its own: S14 (WORK-2's figure in 1.26; the +3V3 loop it also seeds described in 1.27 under WORK-3) and S15 (WORK-4's figure in 1.28; U3 pin 5's square entry described in 1.34 under WORK-10).

