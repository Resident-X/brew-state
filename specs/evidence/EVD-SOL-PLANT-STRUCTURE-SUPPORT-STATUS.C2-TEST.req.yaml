text: |
  The vocabulary declared in firmware/include/plant_support.h carries two values: unverified, and verified against hardware of the architecture. check_support_status.py reads it out of that header rather than carrying a copy, and refuses a vocabulary that has grown a third distinction or lost the verified value — VocabularyDrawsTheVerificationLine exercises both, and the refusal message names the added value. Every structure in the tree, including the one describing the architecture of the project's own machine, carries the unverified value; the check reports which value each structure claims on every build, so the two diverging would be visible rather than silent. firmware/README.md states the axis negatively as well as positively, above the layout table an adopter would otherwise choose from.

  The support-vocabulary-grows-a-distinction mutation adds a partially-verified term to the real vocabulary header and is caught by the wired check, so the refusal is demonstrated against the real sources rather than only against synthetic ones. The support-vocabulary-header-names-a-structure mutation covers the other way this vocabulary could stop being neutral: the header every structure includes reaching into one structure's own header, caught by the neutrality check that header was placed under.
