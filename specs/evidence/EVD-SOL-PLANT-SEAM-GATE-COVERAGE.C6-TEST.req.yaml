text: |
  The task that runs the tests discovers the environments carrying them from the property the build file already declares, rather than naming one. TheTestTaskDiscoversItsEnvironments drives it with a stand-in build system that records which environments it was asked to run: the environment carrying tests is run and the ordinary host environment is not, a second test environment added later runs with no change to the invocation, and a failing suite fails the task. A tree where no environment carries tests stops with an error rather than reporting success, which is the case this criterion exists for — a forgotten test entry leaves no artefact missing and nothing else to notice.

  The mutation harness makes the same point against the real build: the-tests-stop-being-run removes the declaration from the environment that carries the tests, and the task stops rather than quietly running nothing.
