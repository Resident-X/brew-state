text: |-
  Property sweep over sampled/corner coefficient descriptions x 40 steps at 50 mL/s stays finite with pressure >= 0. A demand the path cannot supply drives the pressure floor to exactly zero without the block going cold, and reverts fully afterward. Negative, NaN, +/-INFINITY demand are all read as no draw via an isfinite() guard (uniform across NaN/+INF/-INF rather than relying on fmax's NaN-only semantics), verified against a byte-exact zero-demand baseline.
