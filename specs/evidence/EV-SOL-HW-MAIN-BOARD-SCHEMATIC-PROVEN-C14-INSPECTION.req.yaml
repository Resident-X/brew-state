text: |
  Read the main board's schematic net lists at commit 0b7429798b0a982955a821e409e44d32296a23d3 against the criterion. Net STM_SCL_X holds J521.3, D521 and R523 and net STM_SDA_X holds J521.4, D522 and R524, reaching U401 pins 95 and 96 (PB8, PB9, I2C1). Net BREWA_RAW holds J524.4, D530 and R534, then the divider node BREWA_DIV with R535 and R536 towards net BREW_AN on U401 pin 30 (PA6, ADC12_INP3). Headers J523 and J525 each carry their own signal net (SPAREA_RAW, SPAN2_RAW) to a spare analogue input and name no sensor. The bring-up provision lists J761 pins 7 to 10 as spare and not connected.
