text: |-
  A structure claiming the verified value must also define PLANT_STRUCTURE_SUPPORT_EVIDENCE as text identifying what was run against what. VerificationCostsACitation exercises the claim with a citation (passes, including one split across lines), with no citation macro at all, with an empty citation, with a placeholder citation held to the same floor as an empty cell in the documentation table, and with a citation that is not string text — each refused with a message naming the line and what is missing. A citation on a structure not claiming verification is refused too, since it reads as a claim the structure is not making. The documentation side is held to the same floor: a row documenting verification with nothing an adopter can read is refused. Judging whether a cited verification was competently done is a review question and is deliberately not attempted.
