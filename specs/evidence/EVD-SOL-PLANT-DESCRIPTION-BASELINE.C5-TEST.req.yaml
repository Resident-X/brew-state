text: |-
  The reference description is named by the native_test environment through REFERENCE_DESCRIPTION_PATH, so the model's own tests read the file the machine's numbers live in rather than a copy. The host artefact reaches it by the same naming convention the artefact runner discovers: task fw:run executes .pio/build/native/program against params/thermoblock.params, and check_parameters_are_data runs the unchanged artefact against it and the variant.

  test_the_reference_description_claims_a_machine refuses a reference description that has picked up the exemption, because every value in it would then stop owing an account while the check went on passing. The build-time check enforces the same thing from the other side, reading which description each environment is exercised against out of the build file.

  The descriptions remaining in the tree for other purposes each state that they describe no real machine: params/fixture.params, whose single number means nothing, and params/thermoblock-variant.params, which exists so one linked artefact can be run against two descriptions differing in a single coefficient. Both carry the declaration that exempts them, and the variant's header names thermoblock.params as where the provenance of its other ten values lives.
