text: |-
  The control suite advances a plant instance of its own under the actuation the law commands each step and injects its temperature through the hardware seam, so the reading the estimator corrects against comes from a model it does not own. Perturbing that instance's pump flow away from the estimator's description degrades tracking rather than leaving it untouched, which is the check that the two are genuinely distinct. A disturbance applied to the machine alone, by a route the estimator is not told about, reaches the reconstruction, which is impossible unless the reading comes from a model the estimator does not own.
