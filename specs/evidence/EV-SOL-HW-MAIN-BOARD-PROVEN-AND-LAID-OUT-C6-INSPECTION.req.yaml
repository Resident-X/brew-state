   - Mains to mains: In3.Cu 2.620 to 2.656 mm against 2.6 (C5 file); the pairs under 2.6 on F.Cu, B.Cu and In2.Cu are covered by signed entries (layout-review.md line 5533: none between nets the entries do not name, none below an entry's figure).
