text: |
  Read the main board's schematic net lists at commit 0b7429798b0a982955a821e409e44d32296a23d3 against the criterion. In the schematic specification, net BREW_SCL_X holds J522.3, the TVS D525 and the 100 ohm series resistor R527, whose other end is net BREW_SCL on U401 pin 92 (PB6); net BREW_SDA_X holds J522.4, D526 and R528, whose other end is net BREW_SDA on U401 pin 93 (PB7). The pin allocation record lists channels brew_scl on PB6 and brew_sda on PB7, and the controller pin table lists PB6 and PB7 with the USART1 alternate function. J522.1 is the 3.3 V feed BRWD_3V3 and J522.2 is GND. No other controller pin reaches J522.
