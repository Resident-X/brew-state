text: |
  check_embedded_description compares the bytes each machine build would embed against the description the host verification tier is pinned to through REFERENCE_DESCRIPTION_PATH, read through the one module that reads the build file, and stops the build rather than warning. It runs inside the target build immediately after the bytes are rendered and before anything is compiled, and again from task fw:check against what the build actually produced. Neither run names an environment or a path: both are derived, so a second board is compared without a line naming it.

  Each of the three divergences the criterion enumerates is driven to fail rather than assumed unreachable. A build declaring a different description fails on the declaration before any bytes are read. A rendering left behind while the description moved on fails on the bytes. A rendering made from the variant sitting beside the intended description fails on the source it records, and one carrying two definitions fails because which description it carries is not settled. Two of the three are also mutations of the real tree: carried-description-is-not-the-verified-one and carried-description-left-stale.
