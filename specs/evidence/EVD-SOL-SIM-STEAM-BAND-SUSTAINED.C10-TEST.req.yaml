text: |-
  Both pass. The channel is asserted to carry the same present-or-absent and valid-or-failed discipline every other channel on this seam does: nothing stood up reports absent rather than a knob that is not turned, a failed sample carries no value, and a trustworthy sample reports each of the two discrete answers the seam spells. Standing the knob up is asserted to move no other channel, which is what makes it a channel of its own rather than folded into an analogue one. The second test puts every condition the seam can present to the law and reads back the law's own report of whether it has a draw: only a trustworthy set reading is one. A reading between the two answers is refused rather than rounded. Interpreting the bit as a demand rate is out of scope and nothing here does it.
