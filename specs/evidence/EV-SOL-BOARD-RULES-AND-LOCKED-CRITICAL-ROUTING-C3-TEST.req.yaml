text: |
  The cited tests pass at 7b06bab against KiCad 10.0.7's kicad-cli (46 locked-copper tests, run by the fix rounds and by both blind reviews): each failure and refusal the criterion names, an untouched board and a non-critical-only change passing, membership by assignment, by pattern and by a class the layout file carries, and malformed input.

  Known limit, stated in the method and the README rather than closed: only the board's own tracks, arcs, vias and zones are locked, recorded and compared. A copper zone held inside a footprint on a critical-class net is not covered. The router does not create or move such zones, so the round trip's guard is unaffected; a board that relies on one carries it unchecked by this tool.
