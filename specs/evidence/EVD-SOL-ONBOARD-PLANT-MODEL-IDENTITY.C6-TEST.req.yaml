text: |
  The structure and the shared loader arrive in env:stm32 through its build_src_filter, which is what puts them under build_src_flags alongside the control logic already compiled there. Nothing is admitted through a relaxation of those flags, and the target's flags are not widened to carry the host tier's analysis, which stays the host tier's to run.

  check_machine_build_settings establishes this rather than a reader of the build file. For every environment building for a board it requires the shared directories under src/plant to be compiled by the filter after every term is applied, requires the environment to apply some settings to this project's own sources, and refuses the strict-flags exemption outright, since that exemption exists for a build compiling sources which are not ours through the same path and a build for a machine compiles no such thing. The cases driving it include a filter that adds the shared sources and takes them back out again, one naming them from outside the source root, a host environment holding the exemption correctly not being asked, and a tree with no machine build failing rather than passing vacuously. They are enumerated by the suite rather than counted here, because a count in prose is wrong the first time a case is added. Three mutations drive the real tree: the settings emptied, the exemption claimed, and the shared sources dropped from the filter.
