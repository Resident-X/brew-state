text: |
  test_a_version_the_archive_offers_passes_the_check_silently_among_other_versions drives the same pre-install check with a stand-in listing that holds the wanted 10.0.8~ubuntu24.04.1 from the project archive among other versions: the check exits 0 with empty stderr; a listing holding only 10.0.8~ubuntu24.04.10 (a version that merely contains the wanted one) fails. The round gate on d8ba5f9f (.stage0/gate.log in the build worktree) printed 'ok     test_verify_gate: 50 tests in 16.1s' and ended 'ROUND GATE PASSED: the host tier (fw:build, fw:check, fw:test, fw:run), the emulation tier (fw:emulate) and the board tier (hw:verify, hw:test:round) all ran and passed'; that gate line is per module, not per test. The test file and the workflow are unchanged between d8ba5f9f and the run commit. On the hosted runner, run A (https://github.com/Resident-X/brew-state/actions/runs/46136364038, step 'Run the complete verification, the sweep left out for its own jobs') printed 'ok     test_verify_gate: 50 tests in 2.1s' twice (10:47:01Z and 10:51:23Z) and run B (https://github.com/Resident-X/brew-state/actions/runs/46136374257) printed 'ok     test_verify_gate: 50 tests in 2.4s' twice (10:47:50Z, 10:53:26Z), at commit 3c486bcd7fcbdc2efd767575118b6c67f61a570d. Covers the clause that the check is driven with the version present, so a version on offer is not failed.
