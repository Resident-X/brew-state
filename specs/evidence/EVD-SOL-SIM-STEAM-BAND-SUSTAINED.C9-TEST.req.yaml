text: |-
  All pass. The harness publishes what the truth plant reports through the simulated hardware seam, runs the control step, then advances that plant under the levels the step actually got onto the two channels -- so the law never sees the plant except through the seam. Two tests establish the instances are genuinely distinct rather than agreeing by construction: cooling the truth plant and nothing else moves the duty, which can only happen through the seam; and a machine whose steam path sags four times as hard as the declaration was sized against holds the band measurably worse than one it was sized for. Against an arrangement where the only model in the loop is the law's own view, both would pass for free.
