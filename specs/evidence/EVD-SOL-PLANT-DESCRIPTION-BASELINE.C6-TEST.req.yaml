text: |-
  The tests that pinned the loader's refusals before this change run unchanged against the extended grammar -- they are byte-identical in the diff, and none was adjusted to suit it.

  Each of those refusals is then driven again with a well-formed origin on the offending line, against a description annotated throughout: a name the structure does not have, a value outside its declared range, a value that is not a number, a token with a second number before the annotation, a not-a-number, a coefficient given twice, a line with no separator, an empty name, and an empty value whose line carries only an account. Every one is still refused, with the same fault, still naming the coefficient at fault, still leaving the caller's record untouched, and still substituting no default. A coefficient omitted from an annotated description is still refused as missing, driven for each of the eleven in turn. An annotated out-of-range refusal still reports the value that arrived and the bounds it missed, so a regression that kept the refusal and stopped populating them fails.

  An origin annotation that is itself malformed is refused on the same terms rather than skipped as though it were a comment -- no kind after the marker, a kind nobody declared, a kind with no account -- and so is a statement no description is entitled to make. Splitting the value at the marker before parsing is what leaves the value token what it always was.

  task fw:mutate exercises both halves against the real sources: an-origin-with-no-account-accepted and a-statement-the-description-cannot-make-ignored are each caught by the model's tests, and all 42 defects in the harness are caught.
