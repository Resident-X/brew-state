text: |-
  The profile surface is exercised in firmware/test/test_control against the truth plant the brew loop's harness already stands up, reaching the plant and the hardware only through plant_model.h and hw_sim. A delivery commanded as a profile drives the pump through hw_sim_output(ACTUATION_CHANNEL_PUMP) — the same read the existing held-level tests assert against — at the level the seam's own figure implies, and the truth plant's outlet temperature responds, so the level the profile computed was actually driven onto the machine rather than merely recorded. No new path into the plant or the hardware is opened: check_plant_encapsulation reports every source clean, and the evaluator now sits under src/control where check_control_identical compares it byte-for-byte between the host and target builds.
