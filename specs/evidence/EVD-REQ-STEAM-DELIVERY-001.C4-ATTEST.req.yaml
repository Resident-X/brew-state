  Decision: attest. Within the acknowledged simulation-phase scope, no unstated gap against the criterion's final-state intent.

  Correction (adversarial re-verification): the composition's marshalled citation pointed at the same unrelated knob-reading test. SOL-SIM-STEAM-BAND-SUSTAINED.C7-TEST (test_recovery_is_the_ready_holding_law_continuing, test_recovery_holds_its_bound_across_the_declared_model_error) is the test that shows recovery continues unattended after a draw. The attest decision stands; only the cited artifact was wrong.
