text: |-
  The check runs inside every pio run over firmware/src and firmware/test, exempting only the structures themselves, and fails with file, line and symbol. What a structure owns is derived from its own header rather than listed, so a structure gaining a coefficient does not need the check updated. Confirmed to catch a field access and a structure-header include in a real consumer. It refuses to run at all when there are no structures, no owned names, or no consumer sources, and refuses when a structure field shares a name with the seam's own vocabulary -- a collision that would otherwise be reachable from every consumer undetected.
