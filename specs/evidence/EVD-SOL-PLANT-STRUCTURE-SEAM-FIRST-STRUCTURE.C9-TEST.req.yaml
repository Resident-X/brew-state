  Every source under firmware/src, including the structures and the parameter loader, is required to compile with the address and undefined-behaviour sanitizers, with the flag that makes a finding abort rather than print and continue, and with the strict warning settings that make a conversion or a shadowed name a failure. Dropping any one of the five is reported. A build compiling no source of this project's own is a failure, so enlarging the subject cannot narrow the analysis. Both host artefacts are then exercised through the model under those sanitizers and report nothing.
