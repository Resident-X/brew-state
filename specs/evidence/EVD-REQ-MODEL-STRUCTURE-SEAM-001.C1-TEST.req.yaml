text: |-
  Every coefficient the structure declares is shown to reach the equations: test_every_coefficient_reaches_the_equations perturbs each one alone and requires the whole-trajectory signature to change, the signature accumulating in a wider type than the model's own so a coefficient that changes the path but not the endpoint still registers. The fixture descriptions are generated from the same table the loader validates against, so a coefficient added or dropped fails the suite rather than escaping it. At the artefact level, check_parameters_are_data.py runs one linked executable against two descriptions differing in a single coefficient and hashes the binary either side, so a compiled-in coefficient or a rebuild between runs is a failure rather than a pass. Inspection of both machine-describing structures confirms no machine coefficient survives as a literal in the equations, the only literals being unit conversions, though no gate enforces that last point.
