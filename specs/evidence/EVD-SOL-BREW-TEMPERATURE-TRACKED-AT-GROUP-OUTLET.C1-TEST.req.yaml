text: |-
  Five host cases assert the control unit answers back the band the shipped declaration carries, that a second declaration carrying a different band changes what the loop is held to with no source edit, and that a control path handed no band refuses rather than assuming one. Seventeen loader cases assert each refusal by its own fault code: absent, empty, no origin, kind without account, kind outside the vocabulary, zero, negative, beyond an int32, longer than the buffer, non-numeric, two figures, no separator, unnamed, unknown band, and declared twice. Fourteen gate cases assert the band is refused when undeclared, unaccounted, not a whole number, or given a second home in the source. The mutation the-declared-band-narrowed-past-what-the-loop-can-hold rewrites only the declared figure and is caught by the control suite, which is the behavioural form of the criterion rather than the structural one.
