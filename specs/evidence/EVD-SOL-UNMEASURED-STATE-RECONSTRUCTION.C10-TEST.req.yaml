text: |-
  control_init now takes a const plant_parameters_t * rather than the no-argument form it had. The record reaches the estimator rather than merely being accepted at the door: a reconstruction can be read after initialisation and settles at the description's declared ambient, which an estimator holding no model could not answer at all. Both entry points supply one -- the host entry loads the description named on its command line once and hands it to control_init before exercising anything, and the target entry passes the record it already parses out of the embedded description. An initialisation given no usable record leaves the control law in its pre-run condition with the heater commanded off and the fault latched, and every subsequent step keeps it there.
