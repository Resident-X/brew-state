text: |-
  Two targets commanded in one binary from one machine state produce two duty trajectories, which a compiled-in destination cannot express. A machine with no target commanded drives neither output, reports that as its own result rather than a latched fault, goes on counting steps and advancing the estimator, and drives the moment it is asked. A target that is not a temperature is refused while a finite but unreachable one is accepted, since refusing what the machine cannot reach is a different question this slice does not answer. Accumulated intent is discarded on a change of target and kept when the same target is restated.
