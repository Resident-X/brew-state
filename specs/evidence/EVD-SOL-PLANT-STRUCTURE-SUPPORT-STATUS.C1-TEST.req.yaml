  reference: firmware/tools/tests/test_plant_checks.py::StructureCarriesAStatus, ::DocumentationSaysWhatTheSourcesSay
text: |-
  check_support_status.py runs inside every pio build and from task fw:check, over every structure under src/plant rather than the one the build selected. Both structures declare PLANT_STRUCTURE_SUPPORT_STATUS in their own headers and are documented in firmware/README.md. StructureCarriesAStatus covers the declaration side: a structure with no status, a status outside the vocabulary, two statuses, a commented-out status, a status the preprocessor discards, a structure nothing compiles, and the vacuous cases (no structures, no plant root, no vocabulary header, a vocabulary declaring no status type) which return a distinct exit status rather than success. DocumentationSaysWhatTheSourcesSay covers the shared-documentation side: a structure missing from the table, a documented status disagreeing with the header, two rows for one structure, a row for a structure that is not there, and documentation with no status table at all. Removing the status from the thermoblock header was confirmed to stop a real pio run -e native build.
