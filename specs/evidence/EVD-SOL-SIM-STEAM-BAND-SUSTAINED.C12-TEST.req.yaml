text: |-
  Passes. Two arms differing in one declared figure, with the margin-building interval held fixed at its shipped nonzero value in both and asserted to be so -- the mirror of the margin criterion's own test, each holding the other's interval nonzero so neither is exercised as if it alone explained a good start. With the rise zeroed, feed is at the full declared rate on the first control step past engagement; with the rise present it is not. The rise is then asserted to be a rise rather than a delay followed by a step: the level is required to be non-decreasing, to climb strictly somewhere inside the declared interval, never to exceed the declared rate, and to have arrived at it by the end of the interval.
