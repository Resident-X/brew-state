text: |-
  Driven against the fixture structure, whose declaration is narrower than the vocabulary -- the machine-describing structure answers every channel and could not trigger the refusal. One test steps the instance well away from its initial state, then issues the same command with a level added on an unanswered channel, and requires every quantity to be exactly where it was. A second shows the command was not applied with the unanswered channel dropped: an instance refused it and an instance given only the answered channel end in different states. The refusal is the same through the form that takes no record. Three mutations pin it: unanswered-channel-absorbed, unanswered-channel-zeroed and zero-on-an-unanswered-channel-refused are each caught.
