  | S11 EMI-4 | FOUND, 1.1 by FLOOR-1 ("Also fails EMI-4"), EMI-4's verdict row `fail` citing it | FOUND, 1.25 against EMI-4 | FOUND, 1.24 against EMI-4 | FOUND, 1.24 against EMI-4 |

  No seed was missed in any run, so no catalogue amendment, views fix or review-step correction was needed for a seed. In run 4 every item's verdict row is filled in: 43 catalogue items, none `cannot judge`, and the plan's own-items table holds only its `none` row.

  ## Findings that match no seed

  Run 4 (final):
  - Consequences of the seeds, true findings rather than false positives:
    - 1.1 FLOOR-1: S11's bead in the digital region.
    - 1.3 FLOOR-3: S1 and S11.
    - 1.4 POWER-2: S4's detour.
    - 1.5 POWER-3: S1. With the planes and pours removed, one via carries the load return.
    - 1.6 POWER-4: S1. U4's exposed-pad land has no planes or pour.
    - 1.9 GROUND-2 and 1.10 GROUND-3: S1, and S5's track over no plane.
    - 1.12 DECOUPLE-2 and 1.16 CLOCK-2: S1.
    - 1.14 SENSE-4: S5.
    - 1.17 CLOCK-3: S11.
    - 1.22 EMI-1: S1 and S4.
    - 1.25 plan row TEST-1: S9.
    - 1.26 free pass: S9. TP5's moved fab reference overprints R1's value, the overprint the run-3 notes below already attribute to a seed that moves a part.
  - 1.23 EMI-3 is the same false positive as in runs 1 to 3, again against C1, and recorded rather than failing the proof. This time it also cites the lone ground via that S1 leaves C1. The reasoning under run 3 below still holds.

  Run 3:
  - Consequences of the seeds, true findings rather than false positives:
    - 1.1 FLOOR-1: S11's bead in the digital region.
    - 1.3 FLOOR-3: S1 and S11.
    - 1.4 POWER-2: S4's detour.
    - 1.5 POWER-3: S1. With the planes and pours removed, one via carries the load return.
    - 1.6 POWER-4: S1. U4's exposed-pad land has no planes or pour.
    - 1.9 GROUND-2 and 1.10 GROUND-3: S1, and S5's track over no plane.
    - 1.12 DECOUPLE-2 and 1.16 CLOCK-2: S1.
    - 1.14 SENSE-4: S5.
    - 1.17 CLOCK-3: S11, and S7's C5.
    - 1.22 EMI-1: S1 and S4.
    - 1.25 plan row TEST-1: S9.
  - 1.23 EMI-3 is a false positive, recorded and not failing the proof. Runs 1 and 2 raised it too, against C1 in the clean placement. EMI-3's Applies when ("a capacitor from a line that leaves the board at a connector to ground") also reads on the input capacitor of a supply that enters at a connector. C1 is U2's input capacitor, which DECOUPLE-1 places at U2's pin. The item's source (SZZA009 § 2.5.4 and § 3.3) concerns filtering lines leaving the board, so the finding goes against the item's intent but is true to its literal text. The catalogue was not amended: the wording is not plainly wrong against the source, because filtering a supply where it enters the board is itself sound EMI practice, and no one-line clarification would be faithful to the source without a judgement about scope.
  - The free pass raised nothing. The two clean-design defects run 2's free pass found were not raised again:
    - U4 drawn without a 3D model (run 2, 1.27). Fixed in 8b36ccf: U4 now uses `QFN-20-1EP_4x4mm_P0.5mm_EP2.5x2.5mm.step`, the model KiCad 10.0.7 ships for the same 4 x 4 mm, 0.5 mm pitch QFN-20. The footprint's own library model (EP2.6x2.6mm) is not shipped. views/index.txt in run 3 lists only TP1 to TP6 as not in 3D, because KiCad's test-point footprints declare no model.
    - Assembly-view text overprints (run 2, 1.28). Fixed in 8b36ccf. U3's value no longer prints over R2's, and every other overlap among a side's fab and silkscreen texts on the clean design is cleared too: U2/C1, Y1/C6/C5, FB1/C3/U3, C4, J2/D1, and the test points' doubled fab and silk references. Only fab-layer texts were moved. After the edit, a KiCad Python scan of every visible fab and silkscreen text, side by side, finds no overlap. Overprints that remain in the seeded copy, such as TP5's moved fab reference beside R1's value, follow from seeds that move parts.

  Runs 1 and 2, kept for the record:
  - Run 1's 1.11 (plan row SENSE-3 overstated how short R3's track is) and 1.20 (pads carried no pin types, so the crop views named no circuit's decoupling) were real defects of the clean design. Both are fixed in b05b736/b035a12 and were not raised again in runs 2 and 3.
  - Run 2's 1.27 and 1.28 are fixed in 8b36ccf, as above.
  - Every other unmatched finding in runs 1 and 2 was a consequence of a seed, or the EMI-3 false positive.

  ## Blocker from round 1 (resolved)

  Round 1 stopped on a defect outside this slice. The pre-order check and the views command read net-class membership unreliably on a board with more than KiCad's 199 reported violations of one type. SOL-HW-BOARD-CLASS-READ-ANY-SIZE fixed it, and this branch is rebased onto that fix. On 8b36ccf, `task hw:verify` passed three times out of three, the full `task hw:test` passed, and the seeding command's pre-order check and views ran without a refusal.
