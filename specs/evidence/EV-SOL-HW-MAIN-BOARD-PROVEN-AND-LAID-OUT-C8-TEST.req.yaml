   T2 test_the_84_test_points_use_the_small_footprint_that_clears_the_courtyard_rule_and_each_same_connector_header_pair_is_accepted_once (def line 1205)
  Both run the real pre-order check on the committed main board through full_check_lines() (board_check.check_design, the function hw:verify drives, Taskfile.yml hw:verify).

  (1) Pass on the finished layout against the records: T1 lines 1181-1183 assert zero VIOLATION lines and only ACCEPTED lines accepted; full_check_problems proves the accepted and warning tiers ran, with faults. Covered.
  (2) Failing rule resolved by a change, never judged unimportant: the check has no waiver except signed records (board_check.py hole_to_hole accepted only by a same_connector_pins entry; the workmanship record never accepts hole_to_hole, proved in board_prove.py). T1 shows the end state. The process half is not a test property.
  (3) No hole_to_hole violation outside same_connector_pins entries: T2 plated_hole_problems(lines, tree) == [] and a synthetic hole_to_hole line is found (T2 final assertions). Covered.
  (4) Each same_connector_pins entry confirmed against the finished layout: T2 loops the five headers (J630, J635, J791, J821, J861) and asserts the number of accepted lines equals plated_pairs_at_pitch(tree, header) read from the board, at least 2, with faults for a missing and a repeated line. Covered, traced to C8. (judge_same_connector in board_check.py also fails an entry whose connector or pitch is absent from the layout.)
  (5) Each mains exception entry confirmed against the finished layout: only through T1's run. judge_net_pair and the same-part judging run inside check_design, so an entry that no longer matches the layout prints as a VIOLATION and fails T1; T1 also asserts at least one covered spacing_exception line states ground and bound. Direct layout measurement exists only for the pump triac entries (test_separation_basis_record.py triac_pads/check_triac_entries, traced to SOL-SEPARATION-BASIS-RECORD-STANDS-SIGNED-ON-THE-FINISHED-LAYOUTS-EXCEPTION-SET.C2, not C8). Remaining gap: no test asserts that every mains entry (net-pair, R105 same-part, bought-part entries) is matched one-to-one by a reported shortfall pair on the layout, nor that an entry covering no shortfall is flagged; unused-entry detection rests on the check's own judging, unproved here.
  (6) Test-point courtyard rule, 84 test points on the board's small footprint: T2 asserts every TP uses the small footprint (pad_footprint_problems, 83-count and renamed-footprint faults), count 84, courtyard arithmetic (rule 1.0 mm, courtyard gap 1.0, pad gap 1.25, clear pitch 2.25 mm under the 2.5 mm library pitch), the measured board pairs against S-80 in owner-sign-off.md, and that every courtyard line the check reports is a signed pair. Covered.

