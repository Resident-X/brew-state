text: |-
  The profile type ships under firmware/include and expresses a delivery as a piecewise-linear course of commanded flow in millilitres per second. Two profiles of different shape, run in one binary, drive two different commanded-flow trajectories, and a mid-ramp step is asserted against the interpolated rate so a wrong-axis interpolation cannot pass. control_command_flow is retained unchanged as the actuation-level entry point: its own behaviour is pinned afresh, the nine already-attested tests calling it pass unchanged, and a level set directly while a delivery runs is overwritten by the delivery's own next step. Duty rises in the step a profile delivery is commanded in, with the reconstruction not yet fallen, so the profile's rate reaches the heater feedforward in the same step.
