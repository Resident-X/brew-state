text: |-
  The end condition is carried by delivery_profile_t itself rather than passed alongside it, so a delivery cannot be commanded without one. It carries the quantity it is stated in, and construction refuses a condition naming a quantity the machine cannot evaluate while the delivery runs: an endpoint in delivered volume is named in the enumeration and rejected at delivery_profile_init, as is a value outside the enumeration entirely, so a check that merely tested for a small integer could not pass. The documented refusals are pinned — a null profile, null points, and a point count above the fixed capacity, the last of which would otherwise be a stack overrun in the copy. A hand-assembled profile bypassing the constructor and carrying an unevaluable quantity ends on its first step rather than running on, so the unevaluable case errs toward stillness.
