  **Run 1's miss and how it was closed.** S4, the `+5V` trunk looped through the mains region at x 22 mm, was not reported against MAINS-2. Run 1 judged MAINS-2 a pass and rested the verdict only on the r1c1 tiles of `classes` and the copper layers, which cover y −1 to 30.3. But the mains region in `layout-plan.md` is (0, 0)–(28, 60), and the loop lies at y 47 to 50, on the r2c1 tiles. Run 1 described the same loop under POWER-2 (its finding 1.4), so the views showed it. The gap was in the review step. It said to judge every view an item's *Judged on* names, but not every tile of a view that is cut into tiles. `5c39f0d` amends the step, in `docs/board-design-method.md`, *Layout review*, step 2, *Rests on*. A tiled view is now judged and cited on every tile whose coordinates reach the place judged: every tile a floorplan region's bounds reach, and every tile for an item judged over the whole board. Run 2, in a new session, rested MAINS-2 on every tile and reported S4 as its finding 1.18.

  **The two runs' folders.** They hold the same seed list (sha256 `db531c6dcd2526ad59d373e40f873edd09d2490fc0ded9a20c6aa7c930760ce7`) and the same `check-report.txt` (sha256 `785def1989f08137f6e9c20b49ca221498f864cc7d8b0bec18040693b18407c0`). Every file of the design folder is identical, except the seeded `review-proof.kicad_pcb`. That file differs only in the identifiers the seeds' new items are drawn afresh on each run, and in the order KiCad's save writes them. In run 2 its sha256 is `3fbf61738d6e6cf61f3d0c927077ef4e295b2585b99a94a3a2c6ad96fcf12bb1`. Of the documents, only `docs/board-design-method.md` differs, by `5c39f0d`'s amendment.

