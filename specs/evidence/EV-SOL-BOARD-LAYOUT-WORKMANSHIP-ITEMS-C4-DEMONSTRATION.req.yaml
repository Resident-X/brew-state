  ### What the proof does not show

  For a rule-kind seed, the proof shows that the review reports the loosened figure. It does not show that the visual review sees every copper defect the figure admits, and nothing here should be read as showing it. The runs varied in which of that copper they named:

  | Seed | Copper the loosened figure admits | Run 2 | Run 1 | Run at `1d83c3f` |
  |---|---|---|---|---|
  | S15 | the square corner into U3's pin 5 | not named | not named | not named |
  | S16 | the jog in `AMP_FB` between R2 and R3 | named | not named | named |
  | S18 | R1's ground track 13 degrees off the board's edges | named | named | named |
  | S19 | the side entry into U3's pin 5 | not named | not named | not named |

  Those qualities are measured rules, so the item fails on the rules table either way. The pre-order check's own seeded faults prove that the check catches each of them.

