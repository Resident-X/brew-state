  # SOL-BOARD-LAYOUT-WORKMANSHIP-ITEMS.C4: blind review of the seeded review proof

  Following the review step blind on a seeded copy reports every seeded workmanship defect.

  **Verified commit:** `346b17e3ed806f2977c21f216bfc54a42d66b8cc` (branch `req/SOL-BOARD-LAYOUT-WORKMANSHIP-ITEMS/workmanship-items`), re-verified by seeding at that commit itself (see [Re-verified at `346b17e`](#re-verified-at-346b17e)); blind runs made at `5c39f0dbaafd24ca6603534072568e37017ee9a5`. The seeding command takes the design and the documents as the commit holds them.

  **Result:** 21 seeds, 21 reported against the catalogue item that covers them, none missed, in the second of two blind runs. The first run, at `78c0c34`, missed one seed. Its gap was closed in the review step by `5c39f0d`, and the second run was made in a new session (see [Runs](#runs)).

  This record replaces the one made at `1d83c3f` and re-verified at `f7c37b3`. Every blind run up to then was given a review folder holding the clean design's own review record, `hardware/proof/review-proof/layout-review.md`, because the seeding command copied every committed file of the design's folder. `78c0c34` stops that. The folder now gets only KiCad's files of the design, its plan, its rules table and the records that table reads its figures from. Both runs below were made with the review record withheld, and neither session's transcript names it.

  **Re-verified at `c5753a6`.** That commit changes how the pre-order check judges a track meeting a pad (from the copper, the end's round cap reaching the pad's copper, as KiCad's connectivity joins them) and stops a copper zone exempting a net from the route-length rule. It changes neither the design nor the seeds, so the blind review was not repeated. The seeding command was run once at `5c39f0d`, in a temporary worktree, and once at `c5753a6`, each into a new folder outside the repository, with the commands below. Both printed `CHECK | RESULT | PASS | all 1 designs passed`, so the seeded copy passes the corrected check, and `SEEDS | 21 seeds`. The two folders hold the same seed list (sha256 `db531c6dcd2526ad59d373e40f873edd09d2490fc0ded9a20c6aa7c930760ce7`) and the same `check-report.txt` (sha256 `785def1989f08137f6e9c20b49ca221498f864cc7d8b0bec18040693b18407c0`), both as recorded for run 2 below. Every file of the design folder is byte-identical but the seeded `review-proof.kicad_pcb`, whose raw sha256 differs (`7d7094480f2557d0ec87f10ee27572f93b17722f52b781cb6c3566a5a3131d58` at `5c39f0d`, `1ea30de465ae10ed5c958c0d3aa83f2a8948ee998070fa6e2ff7fc42e599488e` at `c5753a6`) only by the identifiers drawn afresh and the order KiCad's save writes items in: with every `uuid` and `tstamp` value blanked and the top-level items sorted, both hash to `3271a277840a50dcdd960f28f7bb6e9b81f39b9057df1f9bd7d4114b56e04187`. All 119 images are pixel-identical (42 differ in bytes, none in pixels), and `index.txt`, `index.json` and `facts.json` differ only in the scratch path naming the board. Of the documents, only `docs/board-design-method.md` and `hardware/README.md` differ, by `c5753a6`'s statement of the contact rule and of the route-length pad set.

  ### Re-verified at `ee74adc`

  `ee74adc` is the round's final commit. Over `c5753a6` it adds one seeded fault to the gate's own list (`custom_pad`, on `hardware/proof/gate-proof`) and that fault's rule to a test. It changes neither the review proof design nor the seeds, so the blind review was not repeated. The seeding command was run again, once at `5c39f0d` in a new temporary worktree and once at `ee74adc`, each into a new folder outside the repository, with the commands below. Both printed `CHECK | RESULT | PASS | all 1 designs passed`, `VIEWS | RESULT | WRITTEN | 119 images, their index and the per-net fact table`, `SEEDS | 21 seeds` and `RESULT | WRITTEN`, and exited 0, so the seeded copy passes the check as `ee74adc` holds it. Both folders hold the seed list and the `check-report.txt` recorded for run 2 below, with sha256 `db531c6dcd2526ad59d373e40f873edd09d2490fc0ded9a20c6aa7c930760ce7` and `785def1989f08137f6e9c20b49ca221498f864cc7d8b0bec18040693b18407c0`. The design folder holds the same eight files in each, and seven are byte-identical. The eighth, the seeded `review-proof.kicad_pcb`, has a different raw sha256 in each (`98ac161a3d35fd37a071d5cb7b30b9e1c94a9f173cc1bfc69c60d3215d1ae63e` at `5c39f0d`, `e7b888c3fab09eee717a828b1a68b55dd927e04e775b8e7bd6bd622d10cc8f4f` at `ee74adc`). Normalised, they are the same: each was parsed with `hardware/tools/sexpr.py`, every `uuid` and `tstamp` value was blanked, and the top-level items were each dumped and sorted before hashing. Both then hash to `c93f2ebd80718df036d82c3448b7d7ef69ad3a4a7dfb16604a5991e066a4ae81`. That figure is not comparable with the `3271a277…` above, which a different serialisation produced; the comparison that counts is between the two runs made with the same normaliser. All 119 images are pixel-identical: 40 differ in bytes, none in pixels. `index.txt`, `index.json` and `facts.json` are identical once the scratch path that names the board is set aside. Of the documents, `docs/board-design-method.md` and `hardware/README.md` differ from `5c39f0d`'s, and each is byte-identical to the file as `ee74adc` holds it. They differ only by `c5753a6`'s statement of the contact rule and of the route-length pad set.

  ### Re-verified at `346b17e`

  `346b17e` is the round's final commit. Over `ee74adc` it changes how the pre-order check measures three rule items and how it judges contact: route length against the tree joining all of a net's pads, which no zone enters; an arc's direction at its two ends; the board's edges from the outline's true straight sides; and a track joined to a pad wherever its copper reaches the pad's. It adds three seeded faults to the gate's own list, on `hardware/proof/gate-proof`, and states the changes in `docs/board-design-method.md` and `hardware/README.md`. It changes neither the review proof design nor the seeding command: `git diff 5c39f0d 346b17e -- hardware/proof/review-proof hardware/tools/review_seed.py` is empty. So the blind review was not repeated. The seeding command was run three times, each into a new folder outside the repository, with the commands below: at `5c39f0d`, where the blind runs were made, and at `ee74adc`, each in a new temporary worktree, and at `346b17e`. Each printed `CHECK | RESULT | PASS | all 1 designs passed`, `VIEWS | RESULT | WRITTEN | 119 images, their index and the per-net fact table`, `SEEDS | 21 seeds` and `RESULT | WRITTEN`, and exited 0, so the seeded copy passes the check as `346b17e` holds it. All three folders hold the same 134 files. They hold the seed list and the `check-report.txt` recorded for run 2 below, sha256 `db531c6dcd2526ad59d373e40f873edd09d2490fc0ded9a20c6aa7c930760ce7` and `785def1989f08137f6e9c20b49ca221498f864cc7d8b0bec18040693b18407c0`. The seeded `review-proof.kicad_pcb` has a different raw sha256 in each (`dd9dc77a4de1d95667823893127415028f1cf5a9428661919e16b6144d417e17` at `5c39f0d`, `20e762f2ee5029003182d593f989b6eba36ec379c99880ad711a6439208d2013` at `ee74adc`, `932dfbf5143d43c0a6235b421546853a14f872ddfc28d0b37a823ef0015e4440` at `346b17e`). Normalised, the three are the same: each was parsed with `hardware/tools/sexpr.py`, every `uuid` and `tstamp` value was set to the empty string, and the top-level items were each dumped and sorted before hashing. All three then hash to `d05ac84bb04a910225c6951b15ef14bdddf49b01ca57da5ff076cdad1ec2ed2d`. That figure is not comparable with the `c93f2ebd…` or `3271a277…` above, which other serialisations produced; the comparison that counts is between runs made with the same normaliser. Every other file of the design folder is byte-identical in all three. All 119 images are pixel-identical: 54 differ in bytes, none in pixels. `index.txt`, `index.json` and `facts.json` are identical once the scratch path that names the board is set aside. Of the documents, `docs/board-design-method.md` and `hardware/README.md` differ from `5c39f0d`'s, and each is byte-identical to the file as `346b17e` holds it. They differ by `c5753a6`'s and `346b17e`'s statements of the contact rule, the route-length tree and the direction rule.

