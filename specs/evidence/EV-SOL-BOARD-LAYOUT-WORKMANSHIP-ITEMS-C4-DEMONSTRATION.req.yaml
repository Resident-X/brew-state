  ## Commands

  Run from the worktree at the commit of each run, with `<scratch>` a new folder outside the repository for each:

  ```
  KICAD_CLI=/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli RESVG=/opt/homebrew/bin/resvg \
    task hw:review-seed -- --seeds <scratch>/seeds.json --out <scratch>/review
  task hw:review-seed -- --print-prompt > <scratch>/prompt.txt
  cd <scratch>/review && claude -p --model claude-sonnet-5-5 --effort high --output-format json \
    --allowedTools "Read Grep Glob" --disallowedTools "Bash Edit Write NotebookEdit WebFetch WebSearch Task Agent" \
    < <scratch>/prompt.txt
  ```

  Each time the seeding command printed `CHECK | RESULT | PASS | all 1 designs passed`, `VIEWS | RESULT | WRITTEN | 119 images, their index and the per-net fact table`, `SEEDS | 21 seeds` and `RESULT | WRITTEN`. The design folder in the review folder held `constraints.md`, `design-rules.md`, `layout-plan.md`, `review-proof.kicad_dru`, `review-proof.kicad_pcb`, `review-proof.kicad_pro`, `review-proof.kicad_sch` and `separation-basis.yaml`, and no `layout-review.md`. The seed list was written apart from the review folder. Each session was started in its review folder, which holds no copy of the list.

