text: |-
  plant_model.h declares plant_model_set_state beside plant_model_state, and the thermoblock, boiler and fixture structures each answer it. Each suite asserts that the write is accepted exactly where the read is answered and refused exactly where the read refuses, that a written state reads back as written, that writing one state leaves every other where it was, and that the four shared refusals -- null instance, uninitialised instance, out-of-enum state, and a state this structure does not keep -- change nothing. The thermoblock suite additionally shows that a written value is what the next step advances from rather than something the equations discard. The boiler suite shows that a write to either temperature moves the one vessel, which is what it means for them to be one body of water. No plausibility check is made on what is written, which the criterion places out of scope.
