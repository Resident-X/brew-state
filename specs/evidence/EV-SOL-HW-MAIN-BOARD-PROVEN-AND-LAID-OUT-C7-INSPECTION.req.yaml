text: |-
  SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C7 (inspection, version 2) - evidence body, checked at commit da0f08b3
  Records (all under hardware/sunbeam-em7000/main-board/): layout-review.md (LR), layout-plan.md (LP), owner-sign-off.md (SO), main-board.kicad_pcb. Board sha256 recomputed now = 8ca1288bd3e4d5fbf16af303c8d23dbb6cdd28eb96487a8ed85945ce4e1062fc, equal to the hash stated at LR 5746 (round 6), LR 5898 (round 7) and LR 6046 (round 8); the three rounds judged one byte-identical board.
  Verdict: PASS on clauses 3, 4 (limit noted), 5; clause 1 and clause 2 PASS with stated limits; clause 4 cites "history check 21 of 21", which is NOT in any committed record (see clause 4).

  CLAUSE 1 Views of every layer and every critical net. LR 6047 (round 8 Views bullet): the coordinator rendered 870 tiles with `python3 hardware/tools/board_views.py ... --class Mains --class MainsTrunk --class MainsBranch --class Mains_Entry --class Ground --class Supply5V --class Supply3V3 --class Sense --class Fast` from a scratch copy of the board, byte for byte (sha256 8ca1288b...), with only the slow creepage constraint line removed from the rules file; manifest sha256 4eb83c4f...; the views are a working folder, not committed. The reviewer opened 86 of the 870. Recounted from the exact names listed at LR 6047: 28 layer tiles (In1.Cu 5, In2.Cu 3, In3.Cu 3, In4.Cu 3, F.Cu 5, B.Cu 3, F.SilkS 1, B.SilkS 1, Edge.Cuts 4 = 28), 51 net tiles, 3 classes tiles, 1 assembly-top tile, 3 3d- views: 28+51+3+1+3 = 86. Every copper layer is opened more than once (In1 5, In2 3, In3 3, In4 3, F 5, B 3), both silk layers and Edge.Cuts are opened, the reed box is opened on every layer. Net tiles name: the mains and entry nets (LINE, LINE1, LINE_IN, NEUTRAL_IN, LINE_F, NEUTRAL, COFFPUMP, COFVALVE, HOTVALVE, STEAMPUMP, PUMP_C_MT2, PUMP_S_MT2, VALVE_COM, ZC_LED_A, SHUNT_SENSE_IN/NEUTRAL), the power nets (+5V, +3V3, +3V3A, GND, VCAP, +5V_MOD, +3V3_REG, USB_VBUS_F, VREF+), the sensing nets (NTC_COF/STM/WAND, STMP_AN, BREW_AN, SPARE_AN2, CURR1_AN, CURR2_AN, the three divider nets, PT1_FORCEP, PT1_RTDINP, WT1_INA_P/N, WT2_INA_P), the crystal nets (HSE_IN/OUT, LSE_IN/OUT), the fast nets (SPI3_MOSI/MISO/SCK, USB_DP, WT1_CLK). The round states these cover every critical net a plan row names, the 12 sensing nets of S-89 and the nets of S-90 that are in a critical class. LIMITS stated by the record and restated here honestly: (a) BREW_SCL and TANK_LEVEL are in no critical class and have no net view; LR 6047 says they are judged on the layer tiles of the reed box (they are seen on F.Cu, LR 6175). (b) The crop-<ref> tiles and assembly-bottom were not opened and the net tiles beyond the 86 were not opened; items resting on a part's neighbourhood (U302, U620, U621, U601, U401 pins) rest on data named in their rows plus the layer tiles. (c) The placement tiles of round 6 were read again as data (LENGTH 6391.6, CROSSINGS 1340, OUTSIDE 1: K201), tiles not read. Earlier rounds: rounds 4 to 7 opened no net views (round 6 LR 5747, round 7 LR 5899: task hw:views did not finish); round 8 is the round that closes that gap, with 51 net tiles. Result: PASS for every layer and for every critical-class net the plan names; the two non-critical-class nets and the unopened crops are the stated limits.

  CLAUSE 2 Closes on a clean full round by a reviewer that did not draw the board. Round 8: LR 6046 "a fresh Claude agent (model claude-sonnet-5-5) that did not draw the board, 2026-11-18"; LR 6070 "Round kind: full"; LR 6185 "Result. CLEAN: no ISSUE is open. The one open SUGGESTION is 7.1 of round 7 ... No mains figure is relaxed and no ISSUE-SAFETY"; LR 6189 "This round raises no finding." Pre-order check read at LR 6048: log line 83 DESIGN PASS (265 warnings, no VIOLATION line), line 663 RESULT PASS all 6 designs, KiCad DRC of a scratch copy 294 violations and 0 unconnected, all in accepted classes, no mains-to-non-mains clearance line. Round 7 (before it): LR 5898 same reviewer kind, LR 5922 full, LR 6035 CLEAN with SUGGESTIONs 7.1 and 7.2 (no ISSUE). Both closing rounds are full rounds on the byte-identical board. Result: PASS. Note: the "reviewer that did not draw the board" is a fresh model session, as the record states; that is what the record can show.

  CLAUSE 3 Findings recorded and resolved. Round 6 (LR 5744, full, LR 5883 NOT CLEAN): ISSUE 6.2 FLOOR-2 (table row LR 5890) and ISSUE 6.3 GROUND-2/EMI-1/SENSE-4 (LR 5891), SUGGESTIONs 6.1, 6.4, 6.5, 6.6 (LR 5889, 5892, 5893, 5894). Closed in round 7, LR 6025: 6.2 by the restored FLOOR-2 amendment (LP FLOOR-2 row, 12 nets and 124.0 mm, F.Cu 29.8 + B.Cu 62.0 + In3.Cu 32.2 = 124.0, seven unlisted nets 25.3 mm) and SO S-89 (SO line 120); the round-6 130.2 mm was the sampler's artefact, clipped 124.1 mm, split re-measured 75.6 + 35.4 + 13.0 = 124.0. 6.3 closed by owner override SO S-90 (SO line 121) with its test S-91 (SO line 133), its ground re-measured fact by fact (BREW_SCL 33.3 mm, VREF+ 12.8, WT1_CLK 12.5, TANK_LEVEL 32.1; In1.Cu 14 %, In4.Cu 0 %, In2.Cu +3V3 pour 78 %, 97.7 of 145.5 mm; R529/R527/R863/C863/C410/C411/R302; HX711 RATE pin on GND) with result "holds". 6.1, 6.4, 6.5 and 6.6 closed at LR 6025 by the corrected plan text and silk wording (24 vias in 19 groups, 14 single; 108 via pairs; COFFPUMP 17.85 mm). Round 7 findings: 7.2 closed by the records and re-tested in round 8 (LR 6173; S-90 calls 70 nV an estimate, same-sign sum 10 000 x 0.74 nV = 7.4 uV); 7.1 (approximate figures, LR 6038) is an open SUGGESTION in rounds 7 and 8 (LR 6173, 6185), no conclusion depends on it. Round 8 raises none (LR 6189) and checks S-89 and S-90 against the images (LR 6175: all twelve S-89 net views opened; In1.Cu/In4.Cu/In2.Cu tiles for S-90). STATED: the round 6 table cells at LR 5889 to 5894 (6.1 to 6.6, "Closed by" column) still read "open: ISSUE ..." or "open: SUGGESTION ..." in the file, unchanged since round 6; closure is recorded in round 7 (LR 6025) and re-tested in round 8, not by editing those cells. Round 7's 7.1 and 7.2 cells at LR 6040 and 6041 are likewise not edited. Result: PASS (resolved in the later rounds); the unedited cells are a presentation limit.

  CLAUSE 4 The layout carries every part and net the schematic's verdicts settled for the interlock, its series element, the barrier parts and the entry; a departure is a finding recorded and resolved. Checks: (i) grep of main-board.kicad_pcb (Reference property count = 1 each): K201 (interlock relay), K731, K741, F101, F701, F711, F731, C101, U201, U711, U701, U601, JP101, T701, T711, D401, D402, FB301, RT301, J106, J402: all present. (ii) Round 8 verdicts: FLOOR-1 (LR 6076): every one of 446 footprints in a listed region, 0 exceptions; MAINS-1, MAINS-3, MAINS-4, MAINS-5, BOARD-3, BOARD-4 all pass (LR 6107, 6109, 6110, 6111, 6148, 6149: no barrier strip carries copper on any of six layers, slots 1.2 mm wide at U601, U701, U711, K731, K741 and the K201 slit, barrier copper 0 mm2 = check log line 89, each triac tab pad has F.Cu and B.Cu copper joined by 24 and 12 vias). MAINS-2 (LR 6108) fails by the recorded departure at S-76, closed in round 4 and re-tested, not a new finding. (iii) Locked mains copper: LR 6179 "the locked-copper compare passes against the record taken at ea025b12 (all 267 recorded items present, locked and unchanged, none added)", straight separation from non-mains copper 3.747 mm or more on every layer, no mains figure (3.0 mm clearance, 10.0 mm creepage mains to low voltage, 1.5 mm mains to mains) relaxed. 267 of 267 is therefore evidenced at LR 6179 (also LR 6029, round 7 and commit 1897aaa6). DEFECT/LIMIT: a history check of "21 of 21" is not stated in layout-review.md, pre-order-check-result.md, or any other committed main-board record (grep for "21 of 21" over hardware/ and docs/ finds nothing; pre-order-check-result.md line 102 records the earlier history check as 68 of 94 failing before the final design, a different run). It cannot be cited from the committed records; the evidence stands on the round's own locked-copper compare (267 of 267), the MAINS and BOARD verdicts, and the board-file parts check above. If the 21 of 21 run exists it lives in a log outside the repository and must be committed before it is cited. Departures: every fail verdict in round 8 cites an earlier recorded finding and its closing reason (LR 6171 onward: "each fail verdict above that cites one was re-tested on this board"); no departure is open except SUGGESTION 7.1. Result: PASS on the records cited, with the 21 of 21 limit stated.

  CLAUSE 5 Carried findings read against the finished layout, dispositions recorded. Set confirmed from DEC-SCHEMATIC-REVIEW-FINDINGS-CARRIED-BY-OWNER (version 7, shown in full): the findings whose "Carried to" names SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C7 are 5.1, 5.2, 5.18, 5.20, 5.22, 5.23 (T701 and the tabs; K731/K741 go to 5.4, the stand-off to the derated-voltage solution, the pulse ratings to bring-up) and 5.25 to 5.28. (5.20 also names C4 for the line-to-line capacitor and choke if judged needed; the entry of 2026-11-18 names no C7 finding.) Dispositions, round 4 at LR 5541 to 5546 (heading LR 5539), reaffirmed LR 5701 (round 5), LR 5881 (round 6), LR 6033 (round 7) and LR 6183 (round 8, "dispositioned in round 4 and the readings stand on this board"):
   5.1 LR 5541: met as the finding's return condition asks (the clamp can sit at the connector and does): D402 3.99 mm from J402 pin 5 on a 6.4 mm spur; USB_VBUS holds four pads; the parts behind F401 stay under acceptance (b) and (q). Figure: pads D402.1 (88.611, 88.639), J402.5 (87.492, 84.806): distance sqrt(1.119^2 + 3.833^2) = 3.993 mm.
   5.2 LR 5542: met. D401 pads 1 and 3 stand 4.90 mm from J402 pins 1 and 2, inside the plan's 5 mm; D401's ground via 1.47 mm from its pad; the residue at the controller pins is a part limit under acceptances (f) and (q).
   5.18 LR 5543: the declared level is acceptance (v) of DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER, 2026-11-06 (board as drawn, service by procedure, panel keys read at bring-up, clamps only if later asked); KEY1 to KEY5, KNOB_HOT, KNOB_STEAM and TANK_LEVEL carry no clamp part; disposition: the declared level does not call for a clamp, the layout carries none, consistent.
   5.20 and 5.22 LR 5544: C101 (100 nF X2) alone, no choke and no line-to-earth capacitor (FB301 is the only inductive part, in the 3.3 V analogue supply); no emission limit is stated in any record the board reads and none is claimed; C101's distance from the entry is an owner override in the BOARD-9 row, checked at bring-up if the owner states a limit.
   5.23 LR 5545 and LP line 150 (POWER-5): T701 1.83 cm2 top, 3.10 cm2 with the back, 24 vias, Tj 111.4 degC top only and 106 degC with the back, against 110 degC; T711 0.76 and 1.90 cm2, 12 vias, 89 and 87 degC; tabs J101 5.0 mm 5 K, J102 3.6 mm 8 K, J103 4.4 mm 6 K, J110 4.7 mm 5 K, JP101 pad 1 side 2.19 mm 18 K; branch tabs under 3 K at 10.96 A; blade and link ratings carried to bring-up (DEL-HW-BRING-UP.C15). Recomputed: 2.19 mm per layer is 118.8 mil2 (LR 6039 POWER-2: IPC-2221 5.48 A on 118.8 mil2 is 18 K, on 195 mil2 8 K); the POWER-2 row's strip neck 3.6 mm = 195 mil2 as recorded. Disposition: copper read and recorded; the unread ratings are carried. Limit: SO S-40 (SO line 78) states different copper counts for T701 (135.9 front + 121.0 back mm2, 189.4 and 128.9 with the tab pad, Tj 106.6 to 108.4 pessimistic, 110.1 worst) from POWER-5 (1.83/3.10 cm2, Tj 111.4/106); neither cites the other, both put Tj at or within 1.4 K of 110 degC, settled at bring-up; this is not reconciled in the records.
   5.25 to 5.28 LR 5546: sheets rendered with hardware/tools/schematic_sheets.py (PASS, 18 sheets) and defects listed per sheet; disposition: unchanged, cosmetic, no net affected; a drawing change is an amendment to the schematic leaf. Round 5 read all 18 sheets; rounds 6 and 7 read the schematic diff since round 5; reed face 5.28 under SO S-86 (round 6 finding 6.6, silk, closed LR 6025).
  Round 8's own statement at LR 6183 relies on the round 4 reading; round 8 re-read the changed plan rows by diff (POWER-2 and BOARD-5 COFVALVE route, GROUND-2 wording, S-39, S-90: LR 6177) and its net views opened for +5V, USB_VBUS_F, LINE_F, LINE, NEUTRAL cover the entries behind 5.1 and 5.23. Result: PASS.

  OVERALL: every clause is evidenced by the committed records, with these stated limits: the 86-of-870 sample, BREW_SCL and TANK_LEVEL judged on layer tiles only, crop and assembly-bottom tiles not opened (clause 1); the round 6 and 7 table cells not edited (clause 3); "history check 21 of 21" not in any committed record (clause 4); the S-40 versus POWER-5 copper figures unreconciled (clause 5).


  Open suggestion 7.1 (FLOOR-2 and S-77 figures about 0.7 mm off the clipped measurement) remains an open SUGGESTION in round 7; the record states no conclusion depends on it. The round 8 views are a working folder, not committed (command, folder and manifest sha256 are recorded in the round text), so the image reading cannot be re-run from the repository alone.

  Checked against the committed records at commit da0f08b3 (round gate passed on that commit).
