text: |-
  Analysis of the delivered record. § Parts off the boards states the heater wall board is a device the retrofit adds, outside REQ-RETROFIT-FIT-001's scope, with the reason, and that the only retained harnesses that change are the two element leads (now ending at the wall board's faston tabs). It gives the thermal judgement to the assembly design task (DEL-HW-PARTITION-AND-FEASIBILITY.C5) against 70 C enclosure air, cited as a project assumption that DEL-HW-BRING-UP.C13 measures, and states what the task is given: element currents 4.80 A and 5.38 A and the 15 A overload band, mean current 0.900 x rms (4.32 A, 4.84 A), the dissipation formula P = VT0 x mean current + Rd x rms current squared, the opto-triac range -40 to +85 C (15 K above the 70 C assumption), the opto-triac surge 1 A giving a gate resistor of at least 358 ohm, and the bought relay's 5 W, 7 W figures as comparison only. The triac's figures are read from ST's BTA16 sheet (S17, DS2114 Rev 11, May 2018, the current revision, read 2026-10-23 from the Internet Archive's copy of the maker's PDF): Vto 0.85 V and Rd 25 mohm at 125 C, Rth(j-c) 2.1 C/W, Rth(j-a) 60 C/W, Tj max 125 C, IT(RMS) 16 A at Tc 86 C, tab 2500 VRMS (UL1557, no duration stated), ITSM 160/168 A, IGT 50 mA max. Dissipation 4.25 W coffee, 4.84 W steam, 17.1 W at 15 A; junction-to-case rise 8.9 K, 10.2 K, 35.9 K; gate drive checked: 18 V across 360 ohm plus VGT 1.3 V, peak gate current 0.99 A under the opto-triac's 1 A. The faston tab rating is recorded as the assembly task's to source. The per-half-cycle decision is re-argued for a zero-cross opto-triac driving a triac (inhibit voltage 20 V at most = 3.2 degrees = 0.18 ms at 50 Hz; turn-off at the triac's next current zero) with no invented response time. The snubber's off-state leakage is worked against the mains-presence confirm: 79.5 x C amperes at 253 V, 0.1 uF illustrative gives 7.9 mA, 0.42 V across the 52.7 ohm element, 3.5 uA in the 120 kohm branch against 1.8 mA; with the element open a capacitor above about 22.6 nF reads as mains present, passed to the board and assembly task. Added after the cold review: a 'Steam-path transducer' entry in Parts off the boards (device the retrofit adds under DEC-STEAM-PRESSURE-SENSOR-ADDED; wetted element judged against media temperature, absent from the constraints record; body and cable against the 70 C assumption only where placed in the enclosure; placement undecided). Added after the final review: the stale 'of the order of 6 W and 7 W' restatements in component-specification.md and controller-board-design-constraints.md now carry the record's sourced triac dissipation (4.25 W coffee, 4.84 W steam, 17.1 W in the 15 A overload band), citing Parts off the boards; the assembly task for an off-board assembly with the condensate leg designs the leg and records the temperature it delivers against the basis media temperature (DEL-HW-PARTITION-AND-FEASIBILITY.C5, text added).
