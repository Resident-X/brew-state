text: |-
  The loop is held against its limit for two intervals differing by a factor of two, both long enough that the machine settles where full duty and full draw leave it; the state each is released from is asserted equal, so the comparison is about the length of the saturated interval and not about two machines let go at two temperatures. The overshoot after release is the same for both. An integrator that merely unwinds quickly passes a single-interval check and fails this one. The integral is separately asserted frozen while saturated and resuming once the error points back into range, which excludes an integrator that is simply switched off.
