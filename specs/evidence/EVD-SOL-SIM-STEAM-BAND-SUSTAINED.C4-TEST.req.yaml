text: |-
  Passes. Two arms differing in exactly one declared figure -- the feedforward gain answering the commanded feed -- against the same machine, the same draw, the same duration and the same band: at the shipped figure the draw stays inside the band, and at five times the load it answers the loop drives the block past what the band admits and the identical run fails. No control law is rebuilt between the arms; both declarations are read at runtime through the same loader. The grammar test covers the same criterion from the refusal side, including a gain declared in the wrong unit and one declared as nothing.
