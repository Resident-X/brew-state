text: |
  Verified commit: e9d78d2a8bb68b42026138feef6146614eb34a5a (the commit the round gate passed on: the proof design, the method and the readme are committed in it, working tree clean). The review folder's copy of docs/board-design-method.md differs from it only in the opening phrase of the proof paragraph (`This step is shown to find...` there, `This review is shown to find...` at this commit), moved after the blind reviews so the layout review's own documentation test finds its marker; the blind reviews ran on design commit 191e533d2b5b65b38041ec9021ca580e99df793b, whose design files are identical to this commit's.

  ## Tools
  - claude (Claude Code) 2.1.302; every session below ran `--model claude-sonnet-5-5 --effort medium --output-format json`; the tool grant differs per session and is stated on each (the JSON usage also lists claude-haiku-5-5, the client's own helper model).
  - kicad-cli 10.0.7 (the binary in the KiCad application bundle, named by KICAD_CLI); Konnect 0.13.0 (schematic edits of RV1, R2, R5, R8, R13, C12 and the new C13 and R14 through `edit_schematic_component`, `add_schematic_component`, `connect_to_net`, `add_power_symbol`); KiCad's bundled Python with `pcbnew` for the layout edits (Konnect's board tools need a live KiCad over IPC, which a non-interactive session does not have).
  - pdftotext (poppler) to read datasheets for the record corrections.

  ## Rounds
  Round 1 (design before this round's fixes, recorded earlier): 13 seeds, 13 found after one catalogue amendment (PARTS-1); an unseeded baseline review of that design raised 23 findings. Round 2 (this record's final state): the baseline findings were triaged, the real defects fixed in the design, a second unseeded baseline review run, the remaining defects fixed once, and the blind proof repeated on the fixed design with a new seeding session and a new review session.

  ## Changes to the clean design (all in hardware/proof/circuit-review-proof/)
  Schematic and layout (Konnect for the schematic, pcbnew for the layout; each followed by `kicad-cli sch erc`, `kicad-cli pcb drc` and the pre-order check):
  - R8 (NRST pull-up) 10 kΩ to 47 kΩ and new C13, 10 nF, NRST to ground, its pad on the existing NRST track: the maker's guide (SLAAEG4C § 3.1, Figure 3-1; "47kΩ pullup resistor with a 10nF pulldown capacitor").
  - New R14, 1 kΩ, WDI to ground, on the back side with a pad on the existing WDI track: a floating WDI disables U5's watchdog (SLVS165O terminal functions), so WDI is held low while PA17 is not driving it; 1 kΩ × 190 µA = 0.19 V, below the 0.3 V of the IIL test condition, and 3.5 mA from PA17 is below the 6 mA of its VOH figure.
  - R2 (triac gate) 390 Ω to 1.1 kΩ: the gate pulse at line peak (0.325 A) and at RV1's 710 V clamp (0.652 A) is within U2's ITSM of 1 A at the policy's 0.7 share; turn-on stays at 16.2 degrees, under 18.
  - R5 (U2 LED resistor) 220 Ω to 330 Ω: its power at 5.25 V was 0.1265 W against the policy's 0.125 W; now 0.084 W, with the LED current 9.5 mA to 16.1 mA against the 5 mA trigger.
  - R13 1 kΩ to 4.7 kΩ and C12 100 nF to 22 nF: in the declared fault of 5.25 V on J5 the current into the controller pin's diodes was 2.15 mA against ±2 mA; now at most 1.10 mA, with settling 1.064 ms against 2 ms.
  - The declared mains span's top is 250 V rms (peak 353.6 V), so the 250 V ratings of F1, C2 and C3 are not exceeded.
  Records:
  - derating-policy.yaml: a class for mains-rated parts (X and Y capacitors, fuse, varistor, mains terminals and links), voltage share 1 with its stated reason, power 0.7, temperature 0.8.
  - pin-limits.yaml: U5 cites SLVS165O with TPS3823's own pins; D2 cites SLVSBQ9D (TPD4E1U06) with the pins it uses; Q2 and Q3 cite DS30144 Rev. 25-2; U2 cites Rev. 1.5; the mains domain 353.6 V; PA0 and PA1 tolerate being driven unpowered, the data sheet (SLASF90E § 9.1.1) saying the 5-V open-drain IO are fail-safe.
  - constraints.md: surge, leakage limits and class, static discharge level and scope, emission limit, heater load inductance, sensor bus mode, capacitance and sink limit, sense input range, converter sampling, supply rise and inrush, the debug probe's behaviour, and the off-board protective chain of the heater.
  - circuit-proof.md: rows 10 (reset network) and 11 (watchdog input idle level), the updated rows 1, 2 and 5, the surge item in *Not bounded by a source*, and a failure-mode table of the heater cut-off chain.
  - parts-specification.yaml, catalogue-extract.yaml (C9200036 for C13, C9200037 for C12), bring-up-provision.md and separation-basis.yaml kept consistent.
  Checks after the changes: pre-order check on the design alone (a temporary git repository holding only the proof folder: `python3 hardware/tools/board_check.py --root <tmp> --kicad-cli $KICAD_CLI`) PASS; `kicad-cli sch erc --severity-error --exit-code-violations` 0 violations; `kicad-cli pcb drc --severity-all` 0 violations and 0 unconnected; `python3 -m unittest test_board_history.Documentation` and `python3 -m unittest test_board_check -k test_the_tools_and_their_minimums` OK (they read hardware/README.md and the method, unchanged this round).

  ## Sessions and commands (round 2)
  Work trees are temporary folders outside the repository, one for the baselines and one for the blind proof. The seed list is kept apart from the seeded copy, the neutral work tree and the review folder.
  1. Baseline 2 (unseeded design after the first round of fixes, its own netlist and check report; fresh session): `claude -p --model claude-sonnet-5-5 --effort medium --output-format json --allowedTools "Read Grep Glob WebFetch Bash(curl:*)" < review-prompt.txt` in the folder; $2.54, 45 turns, 851 s; 15 findings (the first baseline had 23).
  2. After the one further round of fixes (R5, R13/C12, pin-limits PA0/PA1, the constraints wording), no third baseline (bounded).
  3. Seeding session (fresh, a copy of the proof folder only, the earlier seeding prompt unchanged but for the seed list path, no mention of a catalogue or method): `claude -p --model claude-sonnet-5-5 --effort medium --output-format json --allowedTools "Read Grep Glob Edit Write Bash" --permission-mode acceptEdits "<prompt>"` in the copy's work tree; 15 seeds, $0.93, 28 turns, 292 s. Netlist exported by the session with `kicad-cli sch export netlist --format kicadsexpr`; the pre-order check passes the seeded copy (`RESULT | PASS`, saved as check-report.txt in the review folder); ERC and the layout parity of the copy are consistent.
  4. Review folder (rebuilt after the cold review): the seeded design copied into a neutrally named git work tree (`$WORK`, outside the repository, no 'seed' in any path), its netlist exported there with `kicad-cli sch export netlist --format kicadsexpr -o $WORK/hardware/proof/circuit-review-proof/circuit-review-proof.net $WORK/hardware/proof/circuit-review-proof/circuit-review-proof.kicad_sch`, the pre-order check run on that tree (`python3 hardware/tools/board_check.py --root $WORK --kicad-cli $KICAD_CLI`, `RESULT | PASS`, saved as check-report.txt), then the design folder, docs/board-design-method.md and hardware/README.md (from the committed commit above) copied into the review folder. The KiCad-written .kicad_prl, which git does not track, is left out. `grep -r` and `find -iname` over the folder find no path or file name containing 'seed': the netlist's source line and the check report's header name `$WORK`. The only occurrences of the word in the folder are the readme's and the method's own prose about the repository's seeded-fault and layout-seed proofs (content of those documents, not paths). Never the seed list.
  5. Review session, final (fresh, one session, after the cold review found that the earlier session ran with an unenforced grant): `claude -p --model claude-sonnet-5-5 --effort medium --output-format json --tools "Read,Grep,Glob,WebFetch" --disallowedTools Bash < review-prompt.txt` in the review folder, the same fixed prompt (steps 1 to 4 of the method's schematic review, naming nothing seeded). Grant in force: Read, Grep, Glob, WebFetch only; Bash disallowed. The session's tool list also carried the MCP tools of the operator's environment (the flag restricts built-in tools only); the session JSON shows 62 turns with 38 Read, 12 WebFetch, 10 Grep, 1 Glob calls, no Bash call and no MCP call, empty permission_denials. Every datasheet opened through WebFetch (the response was the PDF, which the reviewer read from the copy the tool saved); the reviewer reports none it could not open. $3.82 (claude-sonnet-5-5 $3.73, the client's helper model claude-haiku-5-5 $0.10), 62 turns, 1180 s. All 15 seeds reported; no second round was needed.
  6. Superseded session: the first review session of this round ran with `--allowedTools "Read Grep Glob WebFetch Bash(curl:*)"`, which does not restrict the tools; its JSON shows 12 shell calls other than curl, so it is not counted as the blind proof (it also ran against a folder whose netlist named the seeded work tree). $3.13, 62 turns, 963 s; it reported 15 of 15 and revealed no seed list content. The unseeded baselines (item 1) ran under the same unenforced grant; they review the clean design, where no seed exists to leak, and are evidence for triage only.
  Total of this round's sessions: $10.42 ($2.54 baseline 2 + $0.93 seeding + $3.13 superseded review + $3.82 final review); the earlier round's sessions, about $11.0, are in the round 1 record.

  ## Seeds, round 2 (the final review session, review folder rebuilt); every seed found
  Finding numbers are those of the final session's findings table; "against" is the item and the part or net it was raised on.
  | Seed | Part and change | Found by finding | Item, against |
  |---|---|---|---|
  | S1 | C7 tantalum fitted reversed (+ on ground) | 1.8 | POLAR-1, C7 |
  | S2 | D1 status LED fitted reversed | 1.7 | POLAR-1, D1 |
  | S3 | C2 Y capacitor 2.2 nF to 22 nF (earth leakage 2.28 mA against 1.0 mA) | 1.17 | TOUCH-1, C2 and C3 |
  | S4 | C4 snubber capacitor rating 275VAC to 100V | 1.19 | EMSRC-2, C4 and R1 (the 100 V part across 353.6 V peak) |
  | S5 | R11 SDA pull-up 4.7k to 47k | 1.9 | BUSL-1, /SDA, R11 |
  | S6 | C5 regulator input capacitor 16V to 6.3V | 1.20 | DERATE-2, C5 |
  | S7 | R9 SDA series resistor 100 Ω to 4.7k | 1.9 | BUSL-1, /SDA_J, R9 (named in the same finding as R11) |
  | S8 | C6 regulator output capacitor 10 µF to 100 nF | 1.3 | PARTS-1, C6 |
  | S9 | C8 controller supply capacitor 10 µF to 1 µF | 1.4 | PARTS-1, C8 |
  | S10 | R5 phototriac LED resistor 330 Ω to 4.7k | 1.1 | PARTS-1, R5 |
  | S11 | R2 triac gate resistor 1.1k to 100 Ω | 1.2 | PARTS-1, R2 (3.5 A against ITSM 1 A) |
  | S12 | C13 NRST capacitor 10 nF to 100 nF | 1.5 | PARTS-1, C13 |
  | S13 | R14 WDI pull-down 1k to 100k | 1.6 | STRAP-1, R14 |
  | S14 | R12 SCL pull-up 4.7k to 100 Ω | 1.10 | BUSL-1, /SCL, R12 |
  | S15 | RV1 varistor 275 Vrms to 130 Vrms | 1.15 | SURGE-1, RV1 |
  15 of 15 found. (The superseded session of item 6 also reported 15 of 15, under finding numbers 1.1 to 1.18.)

  ## The earlier miss and its catalogue amendment (round 1)
  In round 1 the review (method before amendment) found 12 of 13 seeds; S10, a controller supply capacitor changed from 100 nF to 100 pF, was missed because the controller's datasheet recommends a supply capacitor without a value. Closed in the method: PARTS-1 in docs/board-design-method.md now says that a datasheet which recommends an external part without a value takes the value from the part maker's own hardware design guide, and that a controller's supply capacitor far below the guide fails, citing Texas Instruments, MSPM0 C-Series MCU Hardware Development Guide, SLAAEG4C, March 2026, § 2.4 (10 µF plus 100 nF), opened 2026-10-18. The blind review repeated in a new session then found all 13. That amendment is in the method this round's review folder holds, and nothing was missed this round.

  ## Findings matching no seed, with their disposition
  Baseline 1 (unseeded design, 23 findings), triaged:
  - Real defects, fixed in the design and re-run (baseline 2 no longer raises them): NRST pull-up and capacitor (1.7); WDI floating (1.8); the derating policy having no class for mains parts and F1, C2, C3, J1, J2, JP1, RV1 against the declared span (1.5, 1.6); U2's ITSM (1.21); pin-limits entries citing the wrong parts for U5, D2, Q2, Q3 and U2 (1.23); the mains domain voltage; record gaps the catalogue items read, now declared in constraints.md: surge level (1.3), leakage standard and limit (1.4), ESD level (1.17), emission limit (1.18 to 1.20), bus mode and capacitance (1.11), J5 input range (1.9), converter sample rate (1.13), supply rise and inrush (1.14), heater chain failure modes (1.1).
  Baseline 2 (the fixed design, 15 findings): 1.1 FAULT-1, 1.2 BARRIER-1, 1.3 SURGE-1, 1.4 and 1.5 PINV-1 and PINV-2 at J5, 1.6 PINV-2 at J4, 1.7 ESD-1, 1.8 CAPD-1, 1.9 POLAR-1, 1.10 EMSRC-3, 1.11 EMSRC-1, 1.12 DERATE-2 at R5, 1.13 DERATE-2 at R1 and R2, 1.14 and 1.15 free pass.
  - Real defects, fixed once more and not re-reviewed (bounded): 1.4 and 1.5 (J5's diode current 2.15 mA, now 1.10 mA, R13 4.7k with C12 22 nF); 1.12 (R5 0.1265 W, now R5 330 Ω, 0.084 W); 1.15 (PA0 and PA1 are fail-safe per SLASF90E § 9.1.1: record corrected); 1.10 and 1.11 (the constraints' declared edge-rate limit and filter attenuation did not match the design: the declaration corrected to the design's own 6.6 ns, 0.4 µs and 12 dB, which 17.6 dB meets).
  - Accepted judgement calls (stricter reading than the records can satisfy on a synthetic throwaway design, not fixed): 1.2 BARRIER-1 (the MOC3023M datasheet states no certified insulation type; the proof's own record declares reinforced); 1.1 FAULT-1 (single faults of Q1, Q3, U2 output leave the heater on; only the off-board protective chain bounds it, declared in constraints.md; the board imposes no detection test, stated in circuit-proof.md); 1.8 CAPD-1, 1.9 POLAR-1 and 1.14 free pass (the generic passives have no part number or datasheet address, the proof design's choice); 1.13 DERATE-2 (R1 and R2 carry no voltage rating); 1.6 PINV-2 at J4 (the probe's behaviour is declared in constraints.md, not drawn as a part); 1.7 ESD-1 (D2's clamp voltage above PA0 and PA1's 5.5 V, and J4, J5, J6 without clamps; the ESD scope is declared in constraints.md).
  - Accepted judgement call against the solution's rule that a real defect in the clean design is fixed (baseline 2 finding 1.3 SURGE-1): RV1 clamps at 710 V at 50 A, above U2's 400 V and Q1's 600 V repetitive off-state voltage, and no data sheet states a non-repetitive rating that covers it. It is a real limit of the clean design and it was not fixed. Reason: curing it needs different U2 and Q1 parts, which would be manufactured to satisfy the item rather than found by the design's own need; the limit is recorded in circuit-proof.md under *Not bounded by a source*, and the blind review of the seeded copy raises the same item only for the seeded RV1 (S15), so the decision is visible to a later reader.
  Round 2 blind review (seeded copy, final session), findings matching no seed, each with its disposition:
  - 1.11 CAPD-1 (no maker bias or temperature curve for the ceramic capacitors): accepted judgement call, as baseline 1.8; the generic passives carry no datasheet address by the proof design's choice.
  - 1.12 SUPPLY-1 (mains inrush into C1 to C3, no pulse rating for J1): not raised by baseline 2; accepted judgement call. The reviewer's own arithmetic puts I2t at 0.013 A2s against F1's 0.5 A2s, and J1 is a generic connector with no datasheet; not fixed and not re-reviewed (bounded).
  - 1.13 FAULT-1 and 1.14 BARRIER-1: the accepted judgement calls of baseline 2 (1.1 and 1.2), unchanged.
  - 1.16 ESD-1: the accepted judgement call of baseline 2 (1.7).
  - 1.18 EMSRC-1 (no derivation of the inlet filter's 12 dB): partly a consequence of seed S3; the declaration is the design's own, as baseline 2 1.11; accepted.
  - 1.21 DERATE-2 (no temperature rating sourced for the generic passives): the baseline 2 1.13 and 1.14 judgement calls (no part number or datasheet address), accepted.
  - 1.22 free pass (circuit-proof.md arithmetic no longer matches the seeded values): a consequence of the seeds, not a defect of the clean design.
  - 1.23 free pass (with 5.25 V on J5 and the board unpowered, 1.1 mA through R13 and PA27's diode may float the 3.3 V rail to about 4.1 to 4.5 V, at or above U4's 4.1 V): not raised by baseline 2, whose fixes brought the diode current under the limit; the rail-float arithmetic is the reviewer's estimate with no load stated. Not fixed and not re-reviewed (bounded); recorded here as a possible limit of the clean design in the declared J5 fault, to be settled when a real board declares that fault.
  False positives recorded without a fix: baseline 1 CAPD-1 (no bias curve), SUPPLY-2 (typical hysteresis only), POLAR-1 for C7 (no datasheet address) and baseline 2 1.8's remark on C5 and C8 (C5 is one of two regulator input capacitors, 38.4 µF together; C8's ±20 % is the tolerance the controller's datasheet footnote allows).

  ## Layout of what remains
  Review records (review-clean.md, review-clean2.md, review-1.md, review-2.md), session JSON, the seeded copy, the neutral work tree, both review folders and the seed list are in temporary folders outside the repository (the baselines' and the blind proof's work trees).
