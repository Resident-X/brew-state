  reference: firmware/test/test_control/test_control.c::test_a_step_past_the_tolerable_multiple_is_reported_late; ::test_a_late_step_still_drives_the_heater_and_advances_the_estimator
text: |-
  A step whose elapsed interval exceeds CONTROL_STEP_LATE_MULTIPLE times the step interval returns CONTROL_STEP_LATE rather than CONTROL_STEP_ACTUATED. Both sides of the threshold are exercised: exactly at the tolerable multiple the step is ordinary, one millisecond past it is late. The step still runs -- the heater is still driven, the fault flag stays clear, and the estimator is advanced by the elapsed figure, asserted against a reference model -- because being late is not a reason to stop controlling. What a caller should do about it, and why the step was late, are not addressed.
