  # Seeded-fault demonstration: SOL-HW-BOARD-RULE-CHECK-GATE.C5

  - Verified commit: `5edf89883c12cf0e420d24f3f3d92c3fbb0a573a` on branch `req/SOL-HW-BOARD-RULE-CHECK-GATE/rule-check-gate`, where the build round's own gate ran `task hw:prove` with tracked files clean: exit 0, `RESULT | PASS | 93 of 93 faults caught`. The per-fault lines below were first recorded on the pre-rebase commit e4cbad0, whose `hardware/` tree is byte-identical to 5edf898's; the rebase brought in only main's firmware and skill changes.
  - Run on: 2026-10-13, KiCad 10.0.7 (kicad-cli), Python 3.14.6, PyYAML 6.0.3, git 2.52.0, macOS
  - Commands: `task hw:prove KICAD_CLI=/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli` (exit 0) and `task hw:verify KICAD_CLI=...` (exit 0)
  - Method: each fault is introduced into a fresh copy of `hardware/proof/gate-proof` in a temporary git work tree outside the repository, committed there, and (for the faults about what the commit does not hold) edited or untracked after that commit. For the fault about what the machine running the check holds, the check is run with a KiCad configuration of that machine's own (`KICAD_CONFIG_HOME`) whose global footprint table names the library. The shipped `hardware/tools/board_check.py` is run on that copy. A fault counts as caught only when the check exits 1 *and* prints a `VIOLATION` line whose rule is the one the fault was seeded for and whose text names it.
  - Since the previous fix round's record (66 faults): 27 faults are new, marked **new** below. They prove that the check reads every file it reads itself in one strict form and fails any other by name (a rule holding two conditions, two rules of one name, a Mains rule whose condition, constraint, units or limits are not exactly the required form, a project file with a key given twice or a setting not of KiCad's type, a basis record with an unknown key, a key given twice, a merge key or a synthetic mark that is not true or false, a library table not in KiCad's form, a sheet naming its file twice); that a library no table the design carries names, or one only the machine running the check names, fails under `design_library` because KiCad runs with a configuration of the check's own; that a net tie joining a Mains-class net to another net fails; and that zones are refilled before the layout check judges them (an unfilled pour beside a mains pad shows a creepage violation of the signed rule only once refilled).

  ## Clean pass

  The throwaway design as committed, in a copy (first line of `hw:prove`):

  ```
  CLEAN | the throwaway design as committed | must pass | DESIGN | hardware/proof/gate-proof/gate-proof.kicad_pro | PASS / RESULT | PASS | all 1 designs passed
  ```

  The every-design gate on the repository itself (`task hw:verify`):

  ```
  Checking board designs under /Users/david/repos/coffee-wt-ddf59e with KiCad 10.0.7
  DESIGN | hardware/proof/gate-proof/gate-proof.kicad_pro | PASS
  RESULT | PASS | all 1 designs passed
  ```

