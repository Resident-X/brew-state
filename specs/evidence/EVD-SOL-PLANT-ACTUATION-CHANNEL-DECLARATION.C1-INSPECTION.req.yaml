text: |-
  The channels and the full scale their levels are expressed on are enumerated once, in a vocabulary-only header both seams include and neither owns. The hardware seam's output-channel type is a name for that enumeration rather than a second copy, and the plant seam's actuation carries levels indexed by it rather than three named fields; neither seam defines a full scale of its own. The new header is a subject of the vocabulary check that already runs over the seam headers, on the same terms, and the declaration check additionally fails any other header that enumerates one of the machine's channels a second time. Two mutations pin that: actuation-vocabulary-header-names-a-structure and a-second-list-of-the-machines-channels are each caught.
