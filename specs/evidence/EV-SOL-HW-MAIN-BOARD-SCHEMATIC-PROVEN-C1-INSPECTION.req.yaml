  Other clauses of C1, checked in this evidence (no other evidence node covers them):
  (a) Every net and part has a recorded verdict. Command: `kicad-cli sch export netlist --format kicadsexpr -o <scratch>/main.net hardware/sunbeam-em7000/main-board/main-board.kicad_sch` (KiCad 10.0.7), then a read-only counting script that names each netlist component reference and net in the verdict records. The repository has no test that counts verdict rows against the netlist; the count was made by this check. The netlist at HEAD holds 446 parts (446 distinct references) and 283 nets. Records read: hardware/sunbeam-em7000/main-board/circuit-verdicts.md (584 table rows; the specification-stage verdict, parts and nets by group A to E) and the closing full round (round 7, `- **Round kind**: full`, Verdicts table from the line `### Verdicts` of round 7) of hardware/sunbeam-em7000/main-board/schematic-review.md (about 1,240 rows, which judge the 24 catalogue items BARRIER-1 through TOUCH-1 against the drawn schematic and its netlist). Result: 446 of 446 parts are named by a verdict row (414 in circuit-verdicts.md, 440 in round 7; six parts, C206, D701, D711, R208, R545 and U203, were added after the commit round 7 judged and are judged in circuit-verdicts.md only). 275 of 283 nets are named by a verdict row (228 in circuit-verdicts.md, 270 in round 7, either 275). The 8 remaining are tool-named single-pin no-connect nets, unconnected-(U203-NC-Pad1) and unconnected-(U401-PB13-Pad52, PB14-Pad53, PB15-Pad54, PC9-Pad66, PD4-Pad85, PD7-Pad88, PE1-Pad98); each belongs to U203 or U401, which carry verdict rows. The record's own totals for circuit-verdicts.md are 427 PASS, 115 FINDING and 6 N/A rows, 548 in all.

  (b) The method's circuit practice is applied to this board. Method: docs/board-design-method.md, Circuit practice catalogue (24 items) and Schematic review. Commands, run read-only from hardware/tools with PYTHONDONTWRITEBYTECODE=1: `python3 -m unittest tests.test_main_board_schematic_records tests.test_circuit_proof_sheet_generator` gave Ran 9 tests, OK (the drawn wall-board header, the design records and catalogue extract, the panel cable and USB protection path, the generated sheets identical to the committed ones, the parts table naming only parts on the committed sheets, no deck carrying a do-not-populate part). In a scratch copy of hardware/sunbeam-em7000/main-board/sheets and circuit-proof, `python3 A_check_sheets.py` and `python3 C_check_sheets.py` exit 0 (C: 'problems: 0', sheets 50, 52 and 57 identical to the generator's output; A: sheets 101 and 102 hold 32 and 32 parts with no pin in two nets). `python3 E_check_sheets.py` exits 1 with three lines naming NT601 (a net tie: 'unknown pin count for Device:NetTie_2'); this is a limit of that script's symbol table, outside every gate, and not a drawing fault. Records: hardware/sunbeam-em7000/main-board/circuit-proof.md (its own summary: 128 rows, 78 yes, 46 NO, 4 n/a, with the section 'Rows that are not met, with what closes each') and the 239 files in hardware/sunbeam-em7000/main-board/circuit-proof/. Round 7 of schematic-review.md holds verdict rows for all 24 catalogue items. The test module tests.test_main_board_clamp_and_side was started and abandoned after 10 minutes without finishing, so it is not evidence here.

  (c) A reader with the repository can render every sheet. Command: `python3 hardware/tools/schematic_sheets.py --root . --kicad-cli kicad-cli --out <empty folder>` (the repository's own renderer, behind `task hw:sheets`; it draws from the tracked files). Result: exit 0, 'DESIGN | hardware/sunbeam-em7000/main-board/main-board.kicad_pro | PASS | 18 sheets', and 18 SVG files written for the main board (RESULT PASS, all 6 designs; the five proof designs hold one sheet each). A direct `kicad-cli sch export svg -o <folder> hardware/sunbeam-em7000/main-board/main-board.kicad_sch` also wrote 18 SVG files (the root and 17 sub-sheets, each 276 KB or larger; the 17 sub-sheet .kicad_sch files sit beside the root in hardware/sunbeam-em7000/main-board/). `python3 -m unittest tests.test_schematic_sheets` (hardware/tools/tests/test_schematic_sheets.py) gave Ran 27 tests, OK, including the test that a tool exiting 0 with fewer images than the design has sheets fails the design by name. kicad-cli printed 'schematic has annotation errors' as a warning on the export.
