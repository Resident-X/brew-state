text: |-
  The hardware notes' table of the pre-order check's rules carries one entry for each of the fiducial rule and the polarity-mark rule, naming what fails it, what exempts a design, and the name its failure is reported under. Out of scope: the design method's convention and the rules owned by other leaves of this task.
