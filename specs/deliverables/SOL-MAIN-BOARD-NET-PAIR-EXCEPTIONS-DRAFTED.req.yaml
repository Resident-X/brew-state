id: SOL-MAIN-BOARD-NET-PAIR-EXCEPTIONS-DRAFTED
type: deliverable
category: solution
title: The main board's net-pair and same-part spacing exceptions are drafted in the separation basis record, unsigned
status: active
version: 2
text: |
  Drafts, in the main board's separation basis record, the net-pair and same-part exception entries that the owner's acceptance of pollution degree 2 on a coated board (DEC-MAINS-BASIS-TAKES-POLLUTION-DEGREE-2-ON-A-COATED-BOARD) calls for, unsigned. At 2.6 mm of creepage between any two different mains nets the main board still has pairs whose gap carries a few volts or a fraction of the line, and same-part pad pairs that the part's pitch holds closer than 2.6 mm and than the 2.0 mm clearance of a part's terminals. This leaf writes one entry for each set of nets at a stated working voltage, and one entry for each same-part pad pair, in the forms the record's decision sets, and leaves every acceptance field empty for the owner. It adds no figure to the record and signs nothing.

  Settled for the build:
  - Net names are the layout's, written as the netlist writes them. With S for the prefix "/Supply voltage and current measurement/", P for "/Pump drives/", Z for "/Zero-crossing detector/" and M for "/Mains entry and load feed/", the neutral-referenced set N is: /NEUTRAL, M NEUTRAL_IN, /SHUNT_SENSE_IN, /SHUNT_SENSE_NEUTRAL, S AMC_AIN0P, S AMC_AIN0N, S AMC_AIN1P, S AMC_AIN1N, S AMC_DCDC_OUT, S AMC_DCDC_HGND, S AMC_HLDO_IN, S AMC_HLDO_OUT, S VMEAS_DIV, P PUMP_C_TRIAC_G, P PUMP_S_TRIAC_G and Z ZC_LED_A.
  - The net-pair entries are these nine, in the form of nets_a, nets_b and working_voltage_v, each of pair mains_to_mains, with accepted_mm the band figure of the record's functional rows for the working voltage (the creepage figure for a creepage entry, the clearance figure for a clearance entry):
    1. creepage, nets_a N (nets_b omitted), 10 V, 0.4 mm.
    2. clearance, nets_a N (nets_b omitted), 10 V, 0.2 mm. These read the 10 V band row (creepage 0.40, clearance 0.2, the conservative "other materials" column, rows from open reproductions with the IEC text unread); tracks between nets of N keep at least 0.4 mm.
    3. creepage, nets_a M DISCH_A and M DISCH_B, nets_b /LINE and /NEUTRAL, 126.5 V, 1.6 mm.
    4. creepage, nets_a M DISCH_A, nets_b M DISCH_B, 10 V, 0.4 mm.
    5. creepage, nets_a Z ZC_N1, nets_b /LINE, /NEUTRAL and Z ZC_LED_A, 126.5 V, 1.6 mm.
    6. creepage, nets_a S VMEAS_N1, nets_b /LINE and S VMEAS_N2, 84.5 V, 1.4 mm.
    7. creepage, nets_a S VMEAS_N2, nets_b S VMEAS_DIV, /NEUTRAL and M NEUTRAL_IN, 94.5 V, 1.4 mm.
    8. creepage, nets_a S VMEAS_N1, nets_b S VMEAS_DIV, /NEUTRAL and M NEUTRAL_IN, 178.8 V, 1.8 mm.
    9. creepage, nets_a /LINE, nets_b S VMEAS_N2, 168.6 V, 1.7 mm.
  - Each working voltage is derived in the entry's reason from the circuit, at the top of the span (253 V rms), and the entry says whose figure it is. Set N: every net rides on neutral (the AMC131M02 inputs within 2.7 V and its high side within 3.2 V of HGND by the pin-limit record's offsets, the shunt sense nets within a few volts of neutral, the divider tap at 750/900750 of the line, a triac gate within a few volts of its MT1 on neutral, the zero-cross LED anode 1.2 V above neutral), so a bound of 10 V covers any pair inside it: the nets stand 0.3 to 5 V from each other on the isolated side of the amplifier. DISCH_A and DISCH_B are the midpoints of the 1 Mohm pairs R101 with R102 and R103 with R104, half the line (126.5 V) from either end, and equal to each other within the resistors' tolerance. ZC_N1 is the midpoint of R630 and R631, half the line less the LED drop. The pump gate networks are not reduced: while the opto-triac is off the full supply stands across it and the gate network floats to the MT2 level, so a gate net stays at the full 2.6 mm figure against every net, including its own MT2 and opto-triac nets; the creepage across the pads of R704, R705, R714 and R715 is therefore a layout matter, and their existing clearance entries stay. The line divider R601 to R604 gives VMEAS_N1 at 0.666944 and VMEAS_N2 at 0.333888 of the line (the pin-limit record's fractions), so LINE to N1 and N1 to N2 are 84.3 V, N2 to the tap 84.3 V, N2 to neutral 84.5 V, N1 to neutral 168.7 V and LINE to N2 168.5 V; the entries with a neutral-referenced net on one side add the 10 V of set N, and the working voltages written are those figures rounded up to 0.1 V; 84.3 V is the value of the LINE to N1 pair, and the 84.5 V written on entry 6 is conservative within the same band. Every reason for a half-mains or divider midpoint (the discharge pair, the zero-cross chain, the divider chain) says that the reduction holds while the resistor chain is intact, with no component fault, and that a shorted resistor is a fault condition outside functional insulation.
  - What is not reduced. Every pair not listed stays at 2.6 mm: LINE or LINE_IN, LINE_F, LINE1 and the load nets against NEUTRAL or against each other, the pump gate network nets PUMP_C_GATE_R and PUMP_S_GATE_R against any net (while the opto-triac is off the full supply stands across it), PUMP_C_OPTO_MT or PUMP_S_OPTO_MT against its own triac gate net, MT2 against its opto-triac net across the chain, the snubber midpoints, LINE_MOD (the inrush thermistor's drop at switch-on is not bounded by the schematic), and every pair in held_at_reinforced. No entry lists a working voltage of 250 V or more.
  - The same-part pad pairs. For each pair of pads of one part, both on nets of set N, whose edge-to-edge gap in the main-board layout is below 1.5 mm, the record gains two between entries, one of constraint creepage and one of constraint clearance, each of pair mains_to_mains and accepted_mm the gap read from the layout rule check's own report, rounded down to 0.01 mm. The pairs read from the committed layout are: C601 pins 1 and 2 (about 0.90 mm), C602 (0.90), C603, C604, C605, C606 and C608 (0.65 each), F601 (0.70), F602 (0.70), R105 pad 1 with pads 2 and 3 and pad 4 with pads 2 and 3 (0.44 each) and pad 2 with pad 3 (1.19), R604 to R608 pins 1 and 2 (0.85 each), U601 pins 1 and 2, 2 and 3, 3 and 4, 4 and 5, 7 and 8, 8 and 9, 9 and 10 (0.67 each), and U602 pins 1 and 2 (1.04): twenty-seven pairs and so fifty-four entries. The pairs between 1.5 mm and 2.0 mm (C607 pins 1 and 2 at 1.80, R105 pads 1 and 4 at 1.65, U601 pins 1 and 3, 2 and 4, 3 and 5, 5 and 7, 7 and 9, and 8 and 10 at 1.94) are covered by net-pair entries 1 and 2, and R105 pads 1 and 4 already holds its own clearance entry, which stays. A pair at 2.0 mm or more needs none. Entries 1 and 2 do not cover the hot-side part's own pad pitch (0.65 mm pitch, gaps about 0.25 to 0.3 mm in the pairs that fall under 0.4 mm), which the same-part pad-pair entries cover because the parts are certified at their rated voltage. The list is the footprint reading; the layout rule check run on the committed layout with the redrafted record governs, and where it reports a pair this list lacks, or lacks one it lists, the entry is added or left out and the difference is carried to the main-board layout leaf. Each between entry names pads, as the existing entries do.
  - The ground and bounding element are the drafter's proposals for the owner to accept or correct, as the record's existing entries are. A same-part entry's ground is that the pitch of the part forces the gap, both pads are on nets of set N whose working voltage across the gap is under 10 V, and the part is not changed; its bounding element is the energy the neutral-referenced circuit can supply (the AMC131M02's isolated high-side supply, the shunt and the divider resistors) and, for any path to the line, the entry fuse F101 and the branch fuses.
  - Every entry's accepted_by and accepted_on are left empty. The record's own acceptance stays empty. The test reads the committed record through the check's own reader and finds the unsigned acceptance as the only problem; it never writes acceptance values into the record. The existing twenty-five entries of accepted_exceptions are not altered, and the new entries are appended after them; the record's comment that said the last five entries are of the same_connector_pins form is reworded so it is true of the new order.
  - Entries stay drafts until the finished layout exists: confirming that each entry is used by a reported shortfall, and removing the ones the layout does not use, belongs to the main-board layout leaf's pre-order criterion. This leaf's tests run on the committed record and the tracked proof designs; the main board is not tracked on this base, so the premise that each listed net is a Mains-class net of the board is verified by inspection against the board branch, and the tests check only the naming form and the distinctness of the entries and call the check's pure entry helper.
  - Out of scope: the owner's signature; any figure or row of the record; the check's judgement; the mains-to-low-voltage entries; copper spacing between nets of set N below the band figures (0.4 mm creepage, 0.2 mm clearance), which stays a violation; and the layout itself.
rationale: |
  Restores the behaviour REQ-ELECTRICAL-INSTALL-001.C15 and .C16 ask: the spacing between mains conductors is held to the signed figure for the voltage across each gap, and every shortfall a part's geometry or a divider chain forces is the owner's signed exception for the pair, stating the least distance, the ground and the bounding element. Without the entries the main board's divider, discharge, zero-cross and gate networks, and its fine-pitch neutral-referenced parts, fail the check at 2.6 mm with no way to state that the gap carries a few volts. The entries are drafted unsigned because the owner's acceptance cannot be entered by a build.
