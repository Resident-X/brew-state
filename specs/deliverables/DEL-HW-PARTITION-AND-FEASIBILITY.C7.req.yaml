id: DEL-HW-PARTITION-AND-FEASIBILITY.C7
type: criterion
title: The controller's microcontroller part is selected, with its reason and its effect on the firmware, before any board's pin allocation
status: active
version: 2
measurement_type: binary
verification: analysis
closes_by: cascade
text: |
  The microcontroller designed onto the controller board is selected, as a specific part, before any board's pin allocation is authored. The selection records the part, the reason it serves the channel enumeration and the headroom the project is required to preserve, and its source read from the manufacturer's current datasheet with revision or read date. The part is within the family the controller baseline decision names. The selection states the change the firmware's target build and the hardware-backed implementation of the seam need to run on the selected part, and names the delivery node that carries it. The selection shows the part carries, on pins free after the current channels, every bus function the function-forms record and the anticipated channels assign: two I2C-capable pin pairs, at least one of them also UART-capable, an SPI bus with two chip selects, and the load-cell amplifier lines. A board's pin allocation authored against a controller the selection has not named fails.

  Out of scope: the pin allocation itself, which each board's design task authors; the plant-parameter measurements the controller's headroom is later checked against.
