id: DEL-FIRMWARE-TARGET-ON-SELECTED-CONTROLLER.C2
type: criterion
title: The emulated machine describes the selected controller part with register maps taken from its manufacturer's description
status: active
version: 1
measurement_type: binary
verification: inspection
