id: SOL-ROUND-GATE-NOTES-MISSING-TOOL-UNDER-HOSTED-RUNNER
type: deliverable
category: solution
title: Three tests that pass only on the author's host are corrected so the nightly verification passes on the hosted runner
status: active
version: 2
text: |
  The nightly full verification of main runs on a hosted Linux runner, and three of its tests passed only on the author's machine. Each is a defect in sealed work where behaviour depended on the host the code was written on, and each fails the night's hw:test:round or fw:test (and so fw:host-closure) there.

  First, the round gate's test of its own task-running seam runs the real task runner on a throwaway task and requires the line written to standard error with the missing-tool marker to be noted. It passes on the author's machine and fails on the hosted runner, which sets CI: the task runner then colours its own command header and writes the colour reset after the newline, so the next line it passes through begins with an escape sequence and the gate's test for the marker at the start of the line does not match. It reproduces locally with CI=true; GITHUB_ACTIONS alone does not trigger it. The failure is not only in the test: the gate's noting of the marker is how a round or a night reports that a board tool is absent, so a board tool absent on the hosted runner is under-reported exactly where it matters. The correction is in the shared task-running seam, so a round and a night note the marker whether or not the task runner colours its output.

  Second, the production-files layer index lists the inner copper layers in the order the export's files are discovered, which differs between hosts, so the index of a board with In1.Cu and In2.Cu is not the same on every host. An index a reader works down must list layers in one stated order.

  Third, the review-kit declaration test that matches an `added_during_round` pattern against the path an artefact resolves to through a link includes a row whose source differs from the link only in case. It holds on a case-insensitive filesystem and fails on a case-sensitive one, where that source names nothing. The behaviour under test is path resolution and case-folded pattern matching; the row must exercise it on either kind of filesystem.

  The correction in each case is to make the behaviour host-independent and the test able to fail on a plausible regression on either host, not to skip it on the host where it fails. Out of scope: any other test in these suites, and what the gate does with a noted marker.
rationale: |
  Found by the nightly verification of main on its hosted Linux runner (https://github.com/Resident-X/brew-state/actions/runs/39741899288) and, for the first, earlier on a throwaway probe run (38981305869). All three are tests that had only ever run where they were written. Each restores behaviour that sealed work already requires to hold on every supported host, so they are one maintenance item: the same cause, the same gate, one correction round, verified by one hosted run. The solution's identifier names the first failure only; it is kept because the node is unbuilt and its identifier is already cited.
