id: SOL-HW-HEATER-WALL-BOARD-TRAY-FIXING-SEATS-AND-HOLDS-THE-TRAY-THROUGH-REPEATED-REMOVAL
type: deliverable
category: solution
title: The wall board's tray is fixed to the plate by an insert in each pilaster whose screws seat apart and hold through repeated removal
status: active
version: 2
text: |-
  Corrects the printed case's tray-to-plate fixing, which the plate-clearance solution it depends on left with two M3 countersunk screws in each pilaster at the same position along the plate, 4.5 mm apart in height. An M3 countersunk head is 5.5 mm across as made, so the two heads in a pilaster collide by about 1.0 mm and the countersinks in the bar's back face, about 6.3 mm across, merge by about 1.8 mm; the model draws the head at 6.0 mm, which is neither figure. The two cannot be moved apart: the lower is held by the plate's lower edge and the upper by the lid toe's pocket, so the pair can stand at most about 4.6 mm apart where clean countersinks need about 6.8 mm, and the pilaster is 5.5 mm wide, so there is no room to stagger them sideways. No check compares one head with another, so the case's checks passed a bar that cannot be assembled.

  The form the owner chose on 2026-11-28 after the homework below: one heat-set M3 insert melted into each pilaster's end face, and one short M3 countersunk screw through the bar into it, with the pilasters widened to carry the insert's wall. The tray is expected to come off the bar more than a few times, and a thread-forming screw in printed ASA wears and strips with each removal and then needs the tray reprinted, where an insert's brass thread does not wear that way. The insert is about 5.7 mm long in a 4.0 mm hole, which with about 1.6 to 2.0 mm of wall round it needs a solid about 7.2 to 8.0 mm wide, against 5.5 mm now. The case's shell follows the pilaster width along its whole length, so the tray and lid grow by the same amount at every position; the cavity, the board seat, the triac tab holes, the blade bays, the lid screw, every height, the 4.5 mm end wall, the stand-off and the ledge do not change. The bar's wall-bolt zones stay 10 mm at each end, so the bar lengthens by the case's growth and the opening in the machine's plastic wall by the same, from the 80 mm bar and 83.0 mm opening to about 85 mm and 88.0 mm for 2.0 mm of wall round the insert.

  Homework done before the choice, 2026-11-28: a heat-set M3 insert's maker pull-out is 680 to 730 N and its torque-out 1.6 N m in moulded ABS, higher in nylon; printed-part tests give about 1,170 to 1,775 N in PLA and PETG and show a good insert holding 3 to 4 N m against about 1 N m for a screw driven straight into the print. No maker publishes a figure for printed ASA, for a hole lying in the layer plane as this one does, or for the 70 degC enclosure air, so the printed pull-out stays an assumption the record states and the owner's proof load closes: the bar clamped with the tray fitted, and 15.5 kg, twice the design load of 75.6 N, which is 151 N, pulled at the blade end in both directions on a luggage scale. The load is the record's 75.6 N push-on at 70 mm, a 5.3 N m moment at the tray root, and the pull-off direction reverses it about the pilaster top; the insert's height is not midway between the two pivots as first drawn: the lid toe's pocket floor stands 16.5 mm up the pilaster and the pocket reaches 0.4 to 3.0 mm in from the outer face, where an 8.0 mm pilaster's insert hole spans 2.0 to 6.0 mm, so with 2.0 mm of wall the hole centre stands at most 11.67 mm up for a tear-drop hole and 12.5 mm for a round one, and at least 9.9 mm for the allowance below. The hole is printed lying in the layer plane, so the record takes the tear-drop form and the 11.67 mm bound, and the 12.5 mm figure is the round hole's, which this fixing does not use. Across that range the push-on load on one insert is 467 N at 11.67 mm and 407 N at 12.5 mm, and the pull-off load about the pilaster top is at most 299 N across the window (331 N is the round hole's figure, which this fixing does not use), which replaces the earlier figure of about 365 N. A single direct M3 x 16 screw with a 4 mm step low on each pilaster, which keeps the width and the bar, was the alternative with the same load margin and was set aside for the wear on removal. An M4 screw or insert needs a wider pilaster still and a 9.4 mm countersink 1.5 mm from the wall-bolt hole.

  This item corrects the behaviour of the shipped fixing and does not change the plate-clearance solution's criteria, which hold for the clearance and creepage they state; its counts of four tray holes and its stance figures are replaced by this solution's figures where the record states them. The owner's sign-off lines on the plate and the opening are re-read against the new figures and re-stated as the last settlement below says.

  Settled by the readiness pass on 2026-11-28, so the build leaves them to nothing but arithmetic. The wall round each insert hole is 2.0 mm at least, the figure the 85 mm bar and 88.0 mm opening already assume. The insert's pull-out allowance is the maker's lower moulded-ABS figure, 680 N, recorded as an assumption for printed ASA; at the design load that is 0.60 to 0.69 of the allowance, and the owner's twice-design proof puts 814 to 933 N on each insert, above the allowance and below the lowest printed-part test result of 1,170 N, so the record says the proof deliberately tests beyond the allowance and that a failed proof falls back to the direct M3 x 16 screw with a 4 mm step the decision names. The screw stays the ISO 7046 countersunk M3, 5.5 mm head as made and 6.3 mm countersink. The plate-clearance solution's sealed tests keep their names and read the count, stance and allowance from the case parameters, so their intent (marked from the tray, flush heads, clear of the pocket) stays tested while their figures move as this solution declares. The thermal judgement made at the 80 mm bar stands as the conservative one for the longer bar, since more plate lowers its thermal resistance, and is not re-run. The opening's span along the wall is set by the case: the limits the division record carries came from the retired bracket's mounting ears, not from any limit of the wall, and the record restates them. The owner's sign-off line W-19 states the plate cut to 80 mm and is re-stated at the new figures, signed on the owner's behalf under his standing instruction of 2026-11-07, as the plate-clearance solution's sign-off criterion did, and the entry sets the 85 mm bar beside the owner's recorded words that he could probably mount an 80 by 30 to 35 mm spreader, for him to read. The case drawings the model emits, and not only the plate drawing, state the fixing once: they carry the retired four-screw, pilot-hole statement today. The lid's skin follows the wider shell: the parameters that keep the eight streamlines, sixteen vents and eight far-end bars the look was judged with are re-fitted to the wider lid (the shortest streamline the skin keeps rises from 10.0 to 10.5 mm so that two stubs the widening would add are not drawn), the inlet free area is restated at the new width, and the look is not judged again. The insert's hole and depth come from the maker's published figures, read on 2026-11-28 from PEM's product pages for its M3 heat-stake inserts in ABS (the pull-out of 730 N and 680 N with 1.6 N m of torque-out, the hole of 4.01 mm to 4.09 mm and the minimum depth of 6.5 mm), which the lookup saw as search text only because the pages refuse automated fetch; the record says so and the owner confirms them against the part he buys. The model's hole is therefore 4.01 mm, the maker's lower figure, not the 4.0 mm first drawn.
