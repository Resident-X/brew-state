id: SOL-SEPARATION-BASIS-RECORD-STANDS-SIGNED-ON-THE-FINISHED-LAYOUTS-EXCEPTION-SET
type: deliverable
category: solution
title: The separation basis record and the main board's derating policy stand signed, and the basis holds the finished layout's 33 exceptions
status: active
version: 2
text: |
  Restates what the separation basis record and the main board's derating policy must hold now that the finished main-board layout exists and the owner's acceptance has been entered. Several sealed or evidenced criteria describe the record as drafted and unsigned, with exception sets the layout has since reduced: the net-pair leaf's C1 (eleven entries), C6 (twenty-seven pad pairs, each with a creepage and a clearance entry), C8 (every entry unsigned, twenty-five earlier entries) and C9 (a single-fault row for each of eleven entries); the mains-to-mains leaf's C4 (a mains-to-low-voltage entry for U601, U701 and U711, left empty for the owner); the bought-part leaf's C2 (entries for the pairs that fall short, left unsigned); the pollution degree 2 leaf's C4 and C9 (the unsigned acceptance as the only problem); the pump-triac leaf's C1 (a 1.65 mm clearance entry for R105 and 1.8 mm for each 1206 series resistor, left empty) and the same-connector leaf's C6 (each of the five header entries' own accepted_by and accepted_on empty). Each was true of the drafting act it records and stays as what was verified then. The record the repository now holds differs from them in two ways: it is signed, and its exception set is the finished layout's.

  Settled for the build:
  - The record is signed by the owner's act. On 2026-11-05 the owner instructed, in writing in the working session, that the owner's acceptance be entered on the owner's behalf, and it was entered: the record's accepted_by names the owner and records that the entry was made on that instruction, accepted_on is 2026-11-05, and each exception entry carries the same two fields. The signed figures are those already in the record: mains to mains clearance 1.5 mm, terminal clearance 2.0 mm, creepage 2.6 mm both ahead of the entry fuse F101 and downstream of it; mains to low voltage clearance 3.0 mm and creepage 10.0 mm; pollution degree 2, material group IIIa, 253 V, overvoltage category II. Signing changed none of them.
  - The exception set is the finished layout's, 33 entries. The layout check's signed run on the finished board found 29 of the 98 entries drafted before the layout was finished used by a shortfall and 69 used by none, and the 69 were removed; it also reported the four 1206 gate resistors R704, R705, R714 and R715 of the two pump drives short of the creepage figure at the package's own 1.80 mm pad gap, and each has an entry. The 33 are: 4 pump-triac tab-to-lead creepage entries at 2.0 mm, 5 same-connector hole-spacing entries at 1.25 mm, 7 net-pair entries (numbers 1, 2, 3, 5, 8, 10 and 11 of the eleven drafted), 9 same-part creepage entries (C606, the four sense-pad pairs of R105, and R605 to R608), 4 opto-triac pin-5 creepage entries at 0.76 mm (U701 and U711), and 4 gate-resistor creepage entries at 1.8 mm. The four removed net-pair entries (4, 6, 7, 9) are the pairs the finished pad positions leave no shortfall for; the single-fault table keeps the rows of the seven that remain. No same-part clearance entry is held, because the layout check does not test the clearance of two pads of one footprint, and no mains-to-low-voltage entry is held, because the slots between the pad rows of U601, U701, U711 and U602 hold their gaps at the figure, so the check reports no shortfall to excuse; the reader keeps the pair kind in its vocabulary. K201, K731 and K741 have none either, their pad gaps being held the same way and their internal creepage being carried by the owner's recorded acceptance and put to the owner as an open decision in the division record.
  - The four gate-resistor entries state, for each, that the 1.80 mm gap is the package's own pad gap and not a layout choice, why the part was not changed or slotted, and the bounding element: the steady voltage across the resistor is its gate current through 200 ohm, the exposure is a pulse of up to 179 V peak for microseconds, a bridge leaves the other resistor alone to limit the gate pulse so the opto-triac's surge margin falls, and what bounds the outcome is the interlock relay K201 opening when the controller stops refreshing it, which is not independent of the controller as DEC-CHAIN-FAULT-BOUNDED-BY-INDEPENDENT-ELEMENT defines independence and is not claimed to be, together with the detection that REQ-ELECTRICAL-INSTALL-001.C16, as clarified on 2026-11-06, asks to be named where the bounding element acts only on the controller's command (the machine's power-on check of its outputs against the independent observation of the mains current, which resolves a leak of 50 mA and above and no smaller one, and which no delivering node yet performs); the consequence is a pump that runs on, owner-accepted residual risk (i) of DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER, the same fail-on outcome as the accepted surge case.
  - The derating policy of the main board holds ten owner-signed accepted_exceptions, one each for F101, F701, F711, F731, K731, K741, R102, R104, R706 and R716, each with accepted_v, the owner's ground, a bounding element, and accepted_by and accepted_on signed as the record's are. The positions' derated limits and the shares are unchanged. This is the record's own criterion that the deprecated sixth criterion of the derating exceptions leaf (C6) carried as unsigned drafts, restated for the signed state; the derating rule's own criteria, which concern the check, are unchanged.
  - The records that restate the signature state of the basis or the policy are brought to it: the main board's records, the machine-record documents and the pull request text state them signed on 2026-11-05 by the owner's written instruction entered by Claude, the exception set as the entries above hold it, and the derating positions as signed. The frozen review rounds stay as written.
  - The sealed criteria above and their evidence are not edited; this item's criteria govern what the record holds, and the record's tests read these.
  - Out of scope: whether and when the owner gave the instruction, which is the owner-acceptance leaf's; any figure, input, barrier or table row; the owner's decision on the relays' and U602's internal creepage; the derating rule's own behaviour.
rationale: |
  Restores the behaviour REQ-ELECTRICAL-INSTALL-001.C15 and .C16 ask of a signed basis (the figures are signed, and every accepted shortfall is the owner's signed exception for that one pair, never a pair that shows no shortfall) and REQ-ELECTRICAL-INSTALL-001.C13 asks of the derating rule's exceptions (a position over its derated voltage is passed only on the owner's signed entry). The graph's criteria for the record were written while it was a draft, and the layout then reduced the set the check uses and added the gate-resistor pairs; left alone they would assert a state the repository no longer holds, so a test traced to them could only pass by testing the old state. The drafting criteria were right for the act they recorded, so they are left as verified and this item states the signed state; the deprecated derating criterion left the ten signed positions required by nothing, which this item corrects.
