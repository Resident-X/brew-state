id: SOL-HW-HEATER-WALL-BOARD-ASSEMBLY-JUDGED
type: deliverable
category: solution
title: The heater wall assembly's parts, heat sinking, bracket, harness and surge clamps are judged with their arithmetic and its owner decisions are settled or recorded as drawn
status: active
version: 4
text: |
  Judges, for the heater wall assembly, the parts, heat sinking, bracket, harness and surge clamps the wall board's schematic and layout must carry, and settles the owner decisions the division record holds against it, so the schematic and layout leaf draws to settled figures. It is analysis and record work: no KiCad project is opened. Every judgement is written into the controller boards' design records with its arithmetic and the source of each figure read.

  It covers: the opto-triacs and triacs selected against the targets the function-forms record sets; the thermal judgement of both triacs together on the one wall, whether the machine's wall alone sinks their heat or a spreader plate is needed, and the whole assembly against the enclosure air temperature the constraints record holds, including the heat passed into the enclosure through the wall; the bracket (the height of each triac's tab hole on the standing leg, its spacers, how it is made or sourced, and the interface material of the triac faces to the bracket and of the bracket to the wall); the element harness (each lead's termination, rating and reach to the board's terminals, and the current ratings of the blade terminals and joiners); whether the surge clamps on the heater branch are kept or dropped; the wall cut; and the owner decisions the division record holds against this board.

  Settled for the build:
  - The board is drawn as its own board, not a break-away section of the main board, unless the owner decides otherwise; the consequence of the other choice is carried in the record. The division record puts a section about 2.34 USD cheaper on fabrication, an area-proportional inference and not a quote, against a respin of the section taking the four-layer main board with it, which the record rates a high likelihood for this assembly. The heater board has no controller, no interlock and no reserved headroom whichever way it is drawn.
  - The board's outline is the division record's as an input and not a fixed figure: the owner may change it, for instance to a shorter and wider board of about the same area, once the layout can be seen. If he does, the record is amended first and the bracket's length, the window, the opening in the plastic and the wall-cut figures below follow the new outline, and the renewed acceptance is for the figure then current. The layout belongs to the next leaf, so a change of outline made after this leaf closes is re-derived there (bracket length, window, plastic opening and wall-cut figures, with the owner's acceptance renewed), and a rework of an already closed figure of this leaf is a child of the maintenance lane.
  - The 70 degC figure is the controller area's air, not the heater wall assembly's: the owner's plan of 2026-10-23 mounts both triacs outside the enclosure on the machine's metal wall, and the owner said the air there is basically room air, 'maybe we say 45 for some heating on a hot day'. The judgement takes 45 degC as the owner-stated working ambient of the wall assembly, keeps 70 degC as the constraints record's conservative case, and states for each ceiling the highest ambient at which the verdict holds, so the verdict does not rest on a figure nobody has measured; bring-up measures the air at the wall board.
  - The ceilings are two: the maker's absolute junction limit (125 degC, as the division record's heat paragraph uses) and one stated lower ceiling, each with its source or its stated reason. The permitted rise, and so the tab-to-air thermal resistance the bracket, interfaces and wall must meet (9.3 K/W for the 4.84 W triac alone and 4.9 K/W for both at 125 degC and 70 degC air), is worked for each. The board's derating policy, which the next leaf authors, carries the temperature and current shares this leaf judges against unchanged, so that leaf does not reopen the verdict.
  - The bracket is the heat spreader (the owner's L bracket, aluminium, screwed with thermal paste to the machine's 2.5 mm stainless steel side wall, the whole side of the machine), with no separate plate. The window, its length and its height are provisional data values (80 mm by 30 mm, inside the owner's estimate of 80 mm by 30 to 35 mm, unmeasured), and the judgement tabulates by length the steady power each holds, the time both heaters can run at full power from the ambient, and the highest ambient at which each verdict holds, with no idle fraction assumed. The owner's expectation that both heaters run at full power together for about two minutes at most is an expectation that nothing enforces; the maximum dual full-power time the judgement derives is an output for the control work and bring-up, and the switching devices' rated-temperature requirement and its bring-up measurement already carry it.
  - The wall cut has two figures, neither final: the window where the bracket's face meets the steel, 30.0 mm by 80.0 mm, 2400.0 mm squared, and the opening in the plastic wall that admits the unit as one piece, 89.0 mm by 45.0 mm, 4005.0 mm squared, derived from the geometry. No conductor passes through the cut, since the owner routes the element wires. The owner accepted 410 mm squared in three places before the bracket. A larger cut needs a recorded reason and the owner's renewed acceptance; this leaf records the reason and the criterion closes only on that acceptance.
  - The surge criterion is largely met already: the main board's judgement sourced the entry varistor (14D471K, 775 V at 50 A against the 2.5 kV overvoltage category II surge) and recorded the wall varistors as staying on the figures read. The remaining work is the kept wall varistors' own rating and closing D7, and the D7 row's 600 V blocking figure is checked against the opto-triac's 800 V in the function-forms record, the triac's 600 V governing.
  - The wall-cut acceptance is the owner's. After the figures are written the operator asks the owner in session, and the acceptance is recorded as a dated statement in the division record. The owner has said the cut size does not matter right now and has asked for a preliminary design of the whole board now, with its dimensions rearranged later; that is not an acceptance. Until it is given the criterion stays open and this leaf is not sealed.
  - The element leads' reach to the board, the plastic wall's depth, the gap from the cut plastic to the steel (about 10 mm, an estimate from drawings) and the bracket's fit in the cavity are unmeasured. They are recorded as the owner's measurements with what each settles, never assumed.
  - A rating that cannot be sourced from the maker's current document counts as absent; the carried current is up to 15 A. The surge rating the heater branch relies on once the clamps are dropped is sourced from the main board's entry varistor.
  - A barrier the signed basis does not list is reported and the owner re-declares the basis; a distance is never relaxed.

  Locus: docs/sunbeam-em7000/controller-board-function-forms.md, controller-board-division.md (the heater wall board section, its decision list and consequence table, and the appendix data block and script if the wall geometry changes) and controller-board-design-constraints.md. It writes no design record under hardware/sunbeam-em7000/: the board's YAML records, the derating policy among them, belong to the next leaf, as the main board's judgement wrote only the docs records. The wall board's schematic, layout and order belong to the next leaves.
rationale: |
  Sized as one leaf because the ten criteria are one kind of work, analysis and records read from the same three records and written into the same files, and because the thermal, bracket and part-selection judgements feed one another: the tab-hole height needs the part chosen and the thermal result decides whether a spreader plate changes the bracket. It is kept apart from the schematic and layout leaf so that a late layout change does not force a re-review of arithmetic that has not changed, and so the owner's wall-cut acceptance, which only the owner can give, holds this leaf open rather than the board design.
