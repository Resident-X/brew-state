id: SOL-HW-HEATER-WALL-BOARD-ASSEMBLY-JUDGED
type: deliverable
category: solution
title: The heater wall assembly's parts, heat sinking, bracket, harness and surge clamps are judged with their arithmetic and its owner decisions are settled or recorded as drawn
status: active
version: 3
text: |
  Judges, for the heater wall assembly, the parts, heat sinking, bracket, harness and surge clamps the wall board's schematic and layout must carry, and settles the owner decisions the division record holds against it, so the schematic and layout leaf draws to settled figures. It is analysis and record work: no KiCad project is opened. Every judgement is written into the controller boards' design records with its arithmetic and the source of each figure read.

  It covers: the opto-triacs and triacs selected against the targets the function-forms record sets; the thermal judgement of both triacs together on the one wall, whether the machine's wall alone sinks their heat or a spreader plate is needed, and the whole assembly against the enclosure air temperature the constraints record holds, including the heat passed into the enclosure through the wall; the bracket (the height of each triac's tab hole on the standing leg, its spacers, how it is made or sourced, and the interface material of the triac faces to the bracket and of the bracket to the wall); the element harness (each lead's termination, rating and reach to the wall cut, and the current ratings of the blade terminals and joiners); whether the surge clamps on the heater branch are kept or dropped; the wall cut; and the owner decisions the division record holds against this board.

  Settled for the build:
  - The board is drawn as its own board, not a break-away section of the main board, unless the owner decides otherwise; the consequence of the other choice is carried in the record. The division record puts a section about 2.34 USD cheaper on fabrication, an area-proportional inference and not a quote, against a respin of the section taking the four-layer main board with it, which the record rates a high likelihood for this assembly. The heater board has no controller, no interlock and no reserved headroom whichever way it is drawn.
  - The board's outline is the division record's as an input and not a fixed figure: the owner may change it, for instance to a shorter and wider board of about the same area, once the layout can be seen. If he does, the record is amended first and the bracket's length, the window, the passage and the wall-cut figure below follow the new outline, and the renewed acceptance is for the figure then current. The layout belongs to the next leaf, so a change of outline made after this leaf closes is re-derived there (bracket length, window, passage and wall-cut figure, with the owner's acceptance renewed), and a rework of an already closed figure of this leaf is a child of the maintenance lane.
  - The enclosure air temperature is an assumption that bring-up measures, and the judgement states it as one. It is not the triacs' own surroundings: the owner's plan of 2026-10-23, recorded in the constraints record's enclosure air premises, mounts both triacs outside the enclosure on the machine's metal wall, and the 70 degC figure excludes their dissipation. The triacs' real ambient is therefore unmeasured. The judgement keeps 70 degC as the conservative case and also states, for each ceiling it judges against, the highest ambient at which the verdict holds, so the verdict does not rest on a figure nobody has measured, and bring-up replaces the assumed ambient with the measured one.
  - The ceilings are two: the maker's absolute junction limit (125 degC, as the division record's heat paragraph uses) and one stated lower ceiling, each with its source or its stated reason. The permitted rise, and so the tab-to-air thermal resistance the bracket, interfaces and wall must meet (9.3 K/W for the 4.84 W triac alone and 4.9 K/W for both at 125 degC and 70 degC air), is worked for each. The board's derating policy, which the next leaf authors, carries the temperature and current shares this leaf judges against unchanged, so that leaf does not reopen the verdict.
  - The wall cut is 1028.1 mm squared in two places (a window for the bracket's whole standing leg and a passage for the mains conductors), against 410 mm squared in three places the owner accepted before the bracket. A larger cut needs a recorded reason and the owner's renewed acceptance; this leaf records the reason and the criterion closes only on that acceptance.
  - The surge criterion is largely met already: the main board's judgement sourced the entry varistor (14D471K, 775 V at 50 A against the 2.5 kV overvoltage category II surge) and recorded the wall varistors as staying on the figures read. The remaining work is the kept wall varistors' own rating and closing D7, and the D7 row's 600 V blocking figure is checked against the opto-triac's 800 V in the function-forms record, the triac's 600 V governing.
  - The wall-cut acceptance is the owner's. After the figures are written the operator asks the owner in session, and the acceptance is recorded as a dated statement in the division record. Until it is given the criterion stays open and this leaf is not sealed.
  - The element leads' reach to the wall cut, the plastic wall's depth and the bracket's fit in the cavity are unmeasured. They are recorded as the owner's measurements with what each settles, never assumed.
  - A rating that cannot be sourced from the maker's current document counts as absent; the carried current is up to 15 A. The surge rating the heater branch relies on once the clamps are dropped is sourced from the main board's entry varistor.
  - A barrier the signed basis does not list is reported and the owner re-declares the basis; a distance is never relaxed.

  Locus: docs/sunbeam-em7000/controller-board-function-forms.md, controller-board-division.md (the heater wall board section, its decision list and consequence table, and the appendix data block and script if the wall geometry changes) and controller-board-design-constraints.md. It writes no design record under hardware/sunbeam-em7000/: the board's YAML records, the derating policy among them, belong to the next leaf, as the main board's judgement wrote only the docs records. The wall board's schematic, layout and order belong to the next leaves.
rationale: |
  Sized as one leaf because the ten criteria are one kind of work, analysis and records read from the same three records and written into the same files, and because the thermal, bracket and part-selection judgements feed one another: the tab-hole height needs the part chosen and the thermal result decides whether a spreader plate changes the bracket. It is kept apart from the schematic and layout leaf so that a late layout change does not force a re-review of arithmetic that has not changed, and so the owner's wall-cut acceptance, which only the owner can give, holds this leaf open rather than the board design.
