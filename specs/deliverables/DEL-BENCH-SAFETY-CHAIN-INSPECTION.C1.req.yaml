id: DEL-BENCH-SAFETY-CHAIN-INSPECTION.C1
type: criterion
title: The steam side's relief and any check valve in front of it are established on the machine, with the pressure the relief opens at
status: active
version: 2
measurement_type: binary
verification: inspection
closes_by: cascade
text: |
  The steam side's over-pressure valve is identified, where it sits on the steam path (at the steam pump's outlet, ahead of any check valve between the pump and the block, or elsewhere) is established, whether a check valve lies between it and the steam block is established, and the pressure it opens at is read from the machine, each recorded with how it was established, and the opening pressure is compared with the in-service pressure recorded for the steam-path transducer, which that comparison confirms or revises.
