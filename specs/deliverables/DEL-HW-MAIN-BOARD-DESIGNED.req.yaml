id: DEL-HW-MAIN-BOARD-DESIGNED
type: deliverable
category: task
title: The main controller board is designed, proven against its records and made, carrying the proof-of-life interlock and the reserved headroom
status: active
priority: must
level: task
version: 2
text: |
  The main controller board is the one board the division places inside the enclosure. This task designs it, proves it against its design records and the signed separation basis, and has it made. It carries the proof-of-life interlock and every reserved headroom channel the board division record places, and the controller part the selection settled.

  The board's design is not complete until the owner decisions the division record holds pending against it (the tab moves against amending the separation rule, the voltage measurement's distance from the relay, the placement of current sensing, the fuse and varistor arrangement, and the order channel kinds are removed in) are each settled or recorded as drawn one way meanwhile, and the interlock cuts every load only if every load's live lead is fed through it, which bring-up confirms by continuity.
