id: SOL-HW-CONTROLLER-MCU-SELECTED
type: deliverable
category: solution
title: The controller board's microcontroller is selected as a specific part, shown to carry every current and anticipated channel, with its effect on the firmware stated
status: active
version: 1
text: |-
  Selects the specific microcontroller designed onto the controller board, before any board's pin allocation. It records the reason, the datasheet source and the cost, and shows that every bus function the anticipated channels need lands on free pins. It states the effect on the firmware's target build, and makes the board check fail any design built around a different controller.
