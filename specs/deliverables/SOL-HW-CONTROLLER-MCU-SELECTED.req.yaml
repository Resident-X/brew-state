id: SOL-HW-CONTROLLER-MCU-SELECTED
type: deliverable
category: solution
title: The controller board's microcontroller is selected as a specific part, shown to carry every current and anticipated channel, with its effect on the firmware stated
status: active
version: 2
text: |-
  Selects the specific microcontroller designed onto the controller board, before any board's pin allocation. It records the reason, the datasheet source and the cost, and shows that every bus function the anticipated channels need lands on free pins. It states the effect on the firmware's target build, and records the selected part in a form the board check reads, defining that record's keys in the design-records decision in the same change, so the board check fails any design built around a different controller.

  Settled before the build. The part defaults to the STM32F407VGT6 in the LQFP100 package that the component specification has already assessed and the target build already compiles for; the selection confirms it against the current datasheet and catalogue, and names another part only if the reads fail it. The board check identifies the design's controller structurally: every placed part with a pin whose name is a port pin (the definition the connectivity check already uses) is a controller, and its catalogue-number field must equal the record's. A design that places no such part passes the rule, so a board with no microcontroller is not failed. A design that places one but has no record to be held to fails, as the design-records decision already requires of a design with no record. Each proof design carries a synthetic controller record marked synthetic that names its own synthetic controller; no exemption key is added. The component specification's statement that controller selection is answered later against measured plant parameters is rewritten in the same change, since it contradicts the target-family decision and is false once this lands, and its 3.3 V output-high row cites the gauge-drive form rather than reopening it.
