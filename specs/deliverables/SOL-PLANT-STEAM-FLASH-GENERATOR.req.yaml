id: SOL-PLANT-STEAM-FLASH-GENERATOR
type: deliverable
category: solution
title: The thermoblock's steam side is a flash generator in the plant and the control, with feed holding pressure, heater power holding dryness and a casting ceiling bounding trapped vapour
status: active
version: 2
text: |
  Rewrite the thermoblock structure's steam side as a flash generator and cut the steam control law over to it in the same build: an orifice law of the steam made through the tube, valve and tip sets pressure with the wand open; a held liquid inventory, bounded by a declared capacity, decides when the shut block is at saturation of the casting temperature, bounded by a declared casting ceiling reported per run in text and JSON; the affine relation and the pressure-deficit state and coefficient are retired from this structure. The control law is re-allocated so the feed pump holds pressure and quantity and heater power holds a declared superheat at the plant's modelled outlet, computed from the measured pressure; every dryness claim names that superheat and pressure and carries the carry-over caveat in text and JSON; the declaration's ready and band figures are re-derived from the new relations. The ceiling report and the dryness report are printed by one host-run report seam that writes a text line and a JSON line from the same field list.

  The plant and the control law land in one build because a block that is fed nothing makes no steam and reads no pressure under the orifice law: the standing readiness gate withholds feed below the ready pressure and the standing loop drives the heater from pressure, so neither passes against the new plant, and the closed-loop steam suite runs the real thermoblock as its truth model.

  Retires, at close-out, by deprecating each of these criteria on its own sealed solution (their other criteria stand and stay): SOL-PLANT-STEAM-DRAW-ENERGY.C3, .C4, .C5 and .C7, which state the integrated pressure state, reversion to the affine relation, admissibility with the divergence term and the divergence-rate coefficient for the thermoblock (their boiler content is restated in this solution's C4); SOL-PLANT-STEAM-FEED-PUMP-WIRED.C1, whose deficit-widening clause has no subject (the clamp to the lower of demand and commanded feed is restated in C1); SOL-SIM-STEAM-READINESS-GATE.C1, whose withholding of feed whenever pressure is below the ready threshold, for a draw already under way, would starve every draw once pressure follows the feed (restated in C12 as a verdict taken when the wand opens); and SOL-SIM-STEAM-READINESS-GATE.C3, whose held deficit has no subject (restated in C1 as zero feed giving zero made rate). Also by deprecating each of these criteria on SOL-SIM-STEAM-BAND-SUSTAINED (its other criteria stand and stay): C1 (controlled variable by phase), C5 (band held under the retired sag coefficient), C6 (fixed sustainable feed rate regardless of demand), C7 (recovery as the same temperature control continuing), C8 (heater leads and feed lags), C11 (feed never above a fixed sustainable rate) and C12 (feed rises to a fixed rate over an interval). Their substance is restated in C7, C10, C11 and C12 of this solution.
