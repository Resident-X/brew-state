id: SOL-PLANT-STEAM-FLASH-GENERATOR
type: deliverable
category: solution
title: The thermoblock's steam side sets pressure by an orifice law of the feed while the wand is open, and by saturation only while the shut block holds liquid
status: active
version: 1
text: |
  Rewrite the thermoblock structure's steam side as a flash generator: an orifice law of the steam made through the tube, valve and tip sets pressure with the wand open; a held liquid inventory decides when the shut block is at saturation of the casting temperature, bounded by a declared casting ceiling reported per run in text and JSON; the affine relation and the pressure-deficit state and coefficient are retired from this structure.

  Retires, at close-out, the clauses of sealed solutions that state the replaced behaviour: SOL-PLANT-STEAM-DRAW-ENERGY.C3 (pressure as a state integrated from the affine relation), .C4 (reversion to the affine relation when demand returns to zero) and .C7 (the pressure-divergence-rate coefficient); the deficit-rate clamp in SOL-PLANT-STEAM-FEED-PUMP-WIRED.C1; and the deficit semantics of SOL-SIM-STEAM-READINESS-GATE.C3. Their other criteria still stand, so the successor carries each surviving criterion forward when the owning solution is superseded, and the readiness pass at build time settles which survive after reading each in full.
