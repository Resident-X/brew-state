id: SOL-PLANT-STEAM-FLASH-GENERATOR
type: deliverable
category: solution
title: The thermoblock's steam side sets pressure by an orifice law of the feed while the wand is open, and by saturation only while the shut block holds liquid
status: active
version: 1
text: |
  Rewrite the thermoblock structure's steam side as a flash generator: an orifice law of the steam made through the tube, valve and tip sets pressure with the wand open; a held liquid inventory decides when the shut block is at saturation of the casting temperature, bounded by a declared casting ceiling reported per run in text and JSON; the affine relation and the pressure-deficit state and coefficient are retired from this structure.

  Retires, at close-out, by deprecating each of these criteria on its own sealed solution (their other criteria stand and stay): SOL-PLANT-STEAM-DRAW-ENERGY.C3, .C4, .C5 and .C7, which state the integrated pressure state, reversion to the affine relation, admissibility with the divergence term and the divergence-rate coefficient for the thermoblock (their boiler content is restated in this solution's C4); SOL-PLANT-STEAM-FEED-PUMP-WIRED.C1, whose deficit-widening clause has no subject (the clamp to the lower of demand and commanded feed is restated in C1); and SOL-SIM-STEAM-READINESS-GATE.C3, whose held deficit has no subject (restated in C1 as zero feed giving zero made rate).
