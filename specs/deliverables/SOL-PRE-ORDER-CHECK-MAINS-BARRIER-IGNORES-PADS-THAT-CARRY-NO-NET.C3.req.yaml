id: SOL-PRE-ORDER-CHECK-MAINS-BARRIER-IGNORES-PADS-THAT-CARRY-NO-NET.C3
type: criterion
title: A part whose only pads off the Mains class are netless pads with no number or no copper layer is not reported
status: active
version: 1
measurement_type: binary
verification: test
text: |
  On a synthetic layout, a part with Mains-class pads whose only other pads have no net and either no number or no copper layer is not reported by the barrier rule, including a netless pad with no number but with copper, the accepted limit stated in the hardware notes. Out of scope: the figure BARRIER_COPPER_MM2, the strip geometry and the main board's layout.
