id: SOL-SEPARATION-BASIS-SIGNS-MAINS-TO-MAINS-SPACING-AND-EXCEPTIONS.C10
type: criterion
title: The terminal allowance and the interpolation are marked as drafter readings for the owner to check against the standard's text
status: active
version: 2
measurement_type: binary
verification: inspection
text: |-
  The record marks the 0.5 mm terminal allowance (Table 16 footnote of the household-appliance standard) as a reading from reproductions, with its source and its clause where the source gives one, unverified against the standard's own text, and the owner's acceptance includes checking it. The permission to interpolate creepage between voltage rows is verified against IEC 60664-1:2007 clause 5.2.4 (clause 5.2.3 carries the same wording for functional insulation): where the working voltage of 4.3.2.2.2 is used for dimensioning, interpolation for intermediate voltages is allowed, linear interpolation shall be used, and values are rounded to the same number of digits as the table values. That reading is of the 2007 edition text only; the 2020 edition and AMD1:2025 were not read. By that rounding rule the standard's own result at 253 V is 4.0 mm, so the signed 4.1 mm is a deliberate design margin of 0.1 mm over it and the record says so. Whether the household-appliance standard (IEC 60335-1) permits interpolation of its own creepage table is not verified, nothing having been found either way, and the owner, or a test house, confirms it before certification; if it is refused the figure falls back to the 320 V row, 5.0 mm. A clause the sources do not give is stated as not found, not guessed. The same owner check covers the material-group column of the 250 V and 320 V rows used: they are drafter readings of IEC 60664-1 Table F.4 from reproductions (pollution degree 3, group III: 250 V = 4.0 mm, 320 V = 5.0 mm). Reading the standard's own text beyond these points is out of scope.
