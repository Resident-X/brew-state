id: SOL-BOARD-GATES-PASS-ON-HOSTED-RUNNER
type: deliverable
category: solution
title: The board gates pass on the hosted runner's KiCad installation
status: active
version: 2
text: |+
  The nightly full verification of main fails its board gates on the hosted Linux runner, where KiCad is installed by the workflow from a named source. The board design check reports 81 violations on the review proof design, each one that the configuration does not include a standard symbol or footprint library; the likely cause is that the install omits recommended packages, so the standard libraries are absent. The board tooling's tests fail as well: every view-renderer test reports the three-dimensional export as unreadable, because the runner's command-line tool exits non-zero when a model is missing while still writing its output, which the renderer treats as failure; the seeded review folder's tests fail on a missing board file, probably downstream of the same missing libraries, and the check task's whole-repository test fails on the same 81 violations. The hosted-runner install is the part of the nightly that SOL-HW-GATE-IN-ROUND-AND-NIGHTLY.C2 names but whose passing no criterion requires, so a nightly that reports these gates red has satisfied it. This solution makes the board gates pass on the runner. The build confirms each likely cause against the runner before changing the install or the tooling.

  Placement, settled before the build. The install fix lives in the nightly workflow's KiCad install step (.github/workflows/nightly-verify.yml): it keeps --no-install-recommends and names the standard symbol and footprint library packages explicitly beside kicad, at pinned versions from the same named source, and asserts after installing that the library-table template the check reads is present, so a missing library fails as provisioning rather than as 81 board violations. Which packages and versions is found by probing the source's package listing during the build. The board check's isolation (hardware/tools/board_check.py, which names only the libraries KiCad installs with itself) is not changed and is not weakened: a runner without the libraries must still fail. The tooling fix extends the existing command wrapper in hardware/tools/board_views.py rather than adding a seam, and applies its status tolerance only to the three-dimensional export, deciding from the artefact (present, non-empty, and readable by the same reader the renderer already uses) and carrying KiCad's stated cause into both the text and the JSON output; every other command the module runs stays strict on status. Tests drive the wrapper with stand-in command-line tools: non-zero status with a valid artefact, non-zero with none, non-zero with an empty or corrupt one, and zero. A declaration test pins that the workflow's install still carries the pins and --no-install-recommends and names the library packages. The same nightly run also fails firmware gates that this solution does not own; the evidence for the two criteria is the board gates' lines in a dispatched run, not that run's overall status.

