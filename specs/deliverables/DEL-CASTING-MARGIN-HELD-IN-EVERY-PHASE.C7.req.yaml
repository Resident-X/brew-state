text: |
  The peak casting temperature under control and the proof-of-life removal interval derived from it (SOL-CASTING-PEAK-UNDER-CONTROL-DERIVED) are regenerated against the control as it then stands, with the generated record's pinned inputs refreshed, so the safety figure reflects the corrected controller and not the one that preceded it. A record generated before this task's control changes is stale and is not accepted as the figure.
