id: SOL-HW-HEATER-WALL-BOARD-PROVEN-AND-LAID-OUT.C9
type: criterion
title: The drawn board carries the triacs and opto-triacs selected, the tab-hole height and bracket mounting, and the surge clamps as kept or dropped, as the assembly judgements settled them
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  The schematic and the layout carry the parts selected, each triac's tab hole at the height fixed on the bracket's standing leg with the board's fixing, and the clamps as the judgements kept or dropped them, the varistors being kept. The two board-mount holes (3.1 mm, at u = -12.5 and 69.5) reach 0.55 mm under the ends of the standing leg (u = -11.5 to 68.5); the drawing resolves that by a notch or a mount position, stated with the figure drawn, and keeps every mains copper item 13.25 mm or more from each mount hole's centre. A part or dimension that departs from a judged figure is a finding recorded and resolved, not a silent change. Making the bracket and redoing the judgements are out of scope.
