id: DEL-DELIVERY-PROFILE-SEGMENTS.C12
type: criterion
title: A preset holds a complete recipe on the controller, starts on one press, stops on a second, and works with nothing else connected
status: active
version: 1
measurement_type: binary
verification: test
closes_by: cascade
text: |-
  With no other unit present or powered, a press of each preset control starts the recipe it holds and a second press during the delivery stops it. A recipe placed on a preset is checked when it is placed, and one the machine cannot deliver is refused.
