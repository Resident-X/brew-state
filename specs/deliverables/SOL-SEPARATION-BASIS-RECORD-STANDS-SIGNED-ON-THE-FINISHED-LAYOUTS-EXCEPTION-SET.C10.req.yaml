id: SOL-SEPARATION-BASIS-RECORD-STANDS-SIGNED-ON-THE-FINISHED-LAYOUTS-EXCEPTION-SET.C10
type: criterion
title: The two Kinghelm header entries state 1.15 mm with the maker's hole band as the reason, carry the acceptance of 2026-11-18, and the three JST header entries keep 1.25 mm
status: active
version: 1
measurement_type: binary
verification: test
text: |
  The committed record's two same-connector hole_to_hole entries for the Kinghelm load-cell headers J630 and J635 each state accepted_mm 1.15, each state in their reason the 0.80 +0.10/-0.00 mm hole the maker's sheet asks for, and each carry accepted_on 2026-11-18. The record's three same-connector hole_to_hole entries for the JST headers J791, J821 and J861 keep accepted_mm 1.25. The record's header states that the plated holes of J630 and J635 become 0.85 mm, that the entries stand at 1.15 mm in place of 1.25 mm, that they carried the day 2026-11-14 until the acceptance of 2026-11-18, and that the other three headers keep their 0.75 mm drill and 1.25 mm. An entry of a Kinghelm header left at an earlier day is refused. Out of scope is any entry of another connector.
