id: SOL-PRE-ORDER-CHECK-JUDGES-SAME-CONNECTOR-PLATED-HOLE-SPACING-EXCEPTIONS
type: deliverable
category: solution
title: The pre-order check passes a plated-hole spacing shortfall between pins of one connector at its own pitch only on a signed exception in the basis record
status: active
version: 1
text: |
  The pre-order check passes a plated-hole spacing shortfall between pins of one connector at that connector's own pitch only on a same-connector exception the owner has signed in the separation basis record, and fails every other. The board's plated-hole spacing rule (the custom rule of the layout practice's item GROUND-5, a hole_to_hole constraint at the figure derived from the gaps the pins open in the ground plane) is kept. Five 2.0 mm-pitch headers of the main board, J630, J635, J791, J821 and J861, stand closer than that figure between adjacent holes, because a 2.0 mm pitch cannot reach it; the rule is the check's own derivation of where ring copper survives in a plane, not the manufacturer's minimum. The owner has agreed to excuse exactly those pairs, on the ground that these headers carry slow signals only and no fast signal crosses their strip, and to excuse nothing else.

  Settled for the build:
  - The entry form is the third form the separation-basis decision sets: pair same_connector_pins, constraint hole_to_hole, connector, pitch_mm, accepted_mm, reason, bounded_by, accepted_by and accepted_on, with no between. The judgement is the rules decision's. A hole_to_hole shortfall the layout rule check reports under the board's plated-hole spacing rule between two pads of the entry's connector whose centres stand pitch_mm apart is accepted when the measured edge-to-edge distance, read from the layout rule check's own report and not recomputed, is no less than accepted_mm, and is a violation naming the entry when less.
  - Failure is closed. A hole_to_hole shortfall between pads of different parts, between pads of the same connector at another centre spacing, or for a connector with no entry stays the layout rule check's ordinary violation. An entry with an unsigned acceptance or one dated after the record's own acceptance, an accepted_mm not below the distance the board's plated-hole rule holds, a connector absent from the layout or lacking two pads pitch_mm apart, and an entry no reported shortfall uses each fail under the name spacing_exception, naming the entry. A record that is unsigned or synthetic on an orderable board is honoured for no entry.
  - The plated-hole rule, its figure and its derivation are unchanged and the rule keeps its condition on every pair of plated pads; no entry relaxes the rule for a pair outside its connector. The board check's own mechanism for the mains-spacing exceptions is reused, not duplicated: one reader, one judgement, one report.
  - Every accepted exception is printed in the check's text report as its own line with the connector, the pitch, the measured and accepted distances and the owner's reason. The report has one form, text.
  - The record gains one entry for each of the five headers, drafted from the main-board layout with accepted_mm read from it, the ground and the bounding element stated, and its acceptance fields left empty for the owner's acceptance leaf. The hardware notes gain the entry form and the item GROUND-5 in docs/board-design-method.md gains the exception beside its passing condition. The throwaway proof designs gain synthetic entries where a test needs them.
  - Out of scope: the figure and condition of the plated-hole rule, the mains-spacing exceptions, any mains-to-mains or mains-to-low-voltage pair, moving a header or changing its pitch, and the owner's acceptance of the record.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks: a board is judged against every applicable item of the practice, and an item that fails is resolved by a change to the board or by a recorded finding, never by judging the failure unimportant. The plated-hole item cannot be met by a 2.0 mm-pitch header, and a recorded finding that the item does not apply to the pairs of one connector at its own pitch, signed by the owner with its ground, resolves it without loosening the rule for any other pair. Muting or relaxing the rule would stop it finding a pair that merges where a fast signal crosses; an exception that is scoped, signed and fails closed does not.
