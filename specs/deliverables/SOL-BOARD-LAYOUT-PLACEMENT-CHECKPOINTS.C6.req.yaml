id: SOL-BOARD-LAYOUT-PLACEMENT-CHECKPOINTS.C6
type: criterion
title: One command judges the order of the placement and critical routing records against the repository's history
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Add a second command among the repository's hardware tasks that, from a board's folder, reads its layout plan and the repository's history and judges the order the placement and critical routing sections require, so the cross-checks C2 and C3 ask of the method are made by running it. It refuses, without judging, a folder outside a git work tree, a shallow clone, a board or plan that is untracked or differs from the last commit, and a board that cannot be read. On placement it fails: a placement section missing, empty or holding fewer than two candidates in the commit before the first commit carrying a track, arc or via, or differing from the section as it now stands; a track in the first commit, or the first tracks arriving on two lines of history or by a merge; a candidate commit missing from the history, not an ancestor of the first track's commit, or holding the same placement as another; recorded measures that differ from the measures recomputed from the candidate's commit against the floorplan the section is judged against; a placement item without exactly one verdict; a chosen candidate that is not recorded or leaves a part outside its regions; and a part whose reference, position, angle or side differs between the chosen commit and the first track's commit. The critical routing section is a series of numbered passes, only ever appended, so that a re-route made to close a placement-caused finding records its own pass; for each pass it fails: a board judged commit that is not an ancestor of the last commit, holds no track or holds an unlocked one, or for a later pass does not follow the previous pass's router commit; a pass that differs from how it stood in the commit before its router commit; an item bearing on the critical nets without exactly one verdict, or a failing verdict not put right before the router ran; and, when it is told the router has run, a last pass with no router commit. Every commit it cites must lie on the last commit's line of history, so a branch whose history was rewritten by a squash or rebase fails rather than passes. It writes its verdicts as text and as JSON and exits differently for a pass, a failure and a refusal; the hardware tools' guide describes it as it describes the other hardware commands. Tests on throwaway repositories built in a temporary folder outside the repository show each refusal and each failure on a history that commits it, and a pass on a history that keeps the order, including one merged into another branch without rewriting. Out of scope: judging whether the verdicts are right, and the review step's own record history.
