id: SOL-PRE-ORDER-CHECK-HOLDS-MAINS-TO-MAINS-SPACING
type: deliverable
category: solution
title: The pre-order check holds a mains-present design to the signed spacing between conductors at different mains potentials
status: active
version: 3
text: |
  The pre-order check holds a mains-present design to the signed spacing between conductors at different potentials of the mains supply, not only to the spacing from mains to low voltage. Today the basis record signs one pair, and nothing in the check compares a Mains-class item with another Mains-class item on a different net, so a layout can put live and neutral at any distance and pass. This leaf makes the check read the signed mains_to_mains figures and the entry declaration the separation-basis decision now defines, compare the figures with their floor, and enforce them in the layout rule check.

  Settled for the build:
  - The record reader accepts mains_to_mains, the functional insulation value and the location input in table_rows, and still fails any key those decisions do not name. mains_to_mains is required of a record held by a design that declares MAINS present; a design that declares none is exempt, and so is a fixture, a design that declares NOT_FOR_MANUFACTURE true and is held by a record marked synthetic, which passes without the mapping and, when it carries none, without MAINS_ENTRY, has a mapping it carries read in full and is then held to MAINS_ENTRY, while an orderable design is held to both unchanged.
  - The floor is read as the rules decision sets, from the record's own rows. The figures read for the machine at 253 V rms, overvoltage category II, pollution degree 3, material group IIIb and 2000 m are clearance 1.5 mm, terminal clearance 2.0 mm and creepage 4.1 mm both downstream of the entry fuse and ahead of it (the interpolation between the 250 V and 320 V creepage rows, rounded up; a lower downstream figure needs a stated fault-clearing basis); this leaf does not sign them (the record leaf does) and its tests use synthetic figures.
  - The record reader also accepts downstream_basis and held_at_reinforced in the mapping as the separation-basis decision sets them. A creepage_mm below creepage_ahead_of_fuse_mm with no downstream_basis fails. Each held_at_reinforced pair is held by an appended rule to the larger of each mains_to_low_voltage figure and the matching mains_to_mains figure, so the pair across the interlock relay's open contact is never held to a lower figure than an unlisted mains pair.
  - A derived table row at the basis working voltage is read by the floor like any other.
  - The signed rules are appended after the signed Mains rule, in the same manner, so they are last among the rules the check inserts for other leaves and the design's own rules cannot loosen them. Terminal clearance applies between pads of one part and of neighbouring parts; the build fixes the KiCad condition that selects terminals in its readiness pass and shows by a seeded layout that it selects them.
  - Failures are reported under the existing names: separation_basis for the record, separation_floor for the floor, mains_declaration for MAINS_ENTRY, and KiCad's own clearance and creepage for the layout. The hardware notes' tables and the adopter section gain the new keys, the variable and the net class.
  - Reuse: the existing record reader, floor rule and appended-rule path are extended, not duplicated. The proof designs that exist only to exercise the rules gain a synthetic mains_to_mains in their records and MAINS_ENTRY in their projects; the other tracked designs are fixtures and are left as they are.
rationale: |
  Restores the behaviour REQ-ELECTRICAL-INSTALL-001.C15 asks of a board: the spacing between conductors at different mains potentials is signed with the basis and held. The check as built compares only the mains-to-low-voltage pair, and the division record states that the basis gives no mains-to-mains distance, so the requirement had nothing the check could hold a layout to. The check is extended; the signed figures are the record leaf's.
