id: SOL-SEPARATION-BASIS-RECORD-MAINS-TO-MAINS-ACCEPTED-BY-OWNER
type: deliverable
category: solution
title: The owner accepts the separation basis record's mains-to-mains figures and exceptions under their own identity, on their explicit instruction
status: active
version: 3
text: |
  Enters the owner's acceptance of the separation basis record, with the exceptions it holds, after the record's leaf has delivered the record drafted and unsigned, so the check's reader finds it signed and every leaf that waits on a signed record can proceed. The acceptance is the owner's act. This leaf is a request to the owner and an entry made on the owner's instruction; a drafter or a build cannot complete it alone, and does not.

  Settled for the build:
  - Before any acceptance is entered, the owner is shown in plain words, in the session: each signed figure, mains to mains and mains to low voltage, with the table row it rests on and the margin over the standard's own result where there is one; every exception entry with its pair, the distance it accepts, the figure it falls short of, the owner's reason and the element that bounds the fault; and the readings the record marks for the owner's check, which are the household-appliance standard's position on interpolating its creepage table with the 3.2 mm fallback figure at pollution degree 2, the 0.5 mm terminal allowance, the pollution degree 2 material group III column of the Table F.4 rows used, the six conditions of the pollution degree 2 credit (the enclosure being the ground and the coat a supporting measure, including the fall back to pollution degree 3 if the bring-up reading of board temperature against dew point shows condensation), the single-sourced, unread-standards residual risk the owner accepted on 2026-10-31, and, for each net-pair entry, its two lists of nets, its working voltage with the derivation, its band figure and its single-fault table row.
  - Acceptance is entered only when the owner, in the session, explicitly instructs it in words that name the record. An earlier acceptance, silence, or approval of the presentation alone is not that instruction, and the acceptance entered on 2026-10-23 for the earlier figures does not stand for these, nor does any acceptance given before the pollution degree 2 redraft.
  - The entry is its own commit. It changes only accepted_by and accepted_on of the record and of each exception entry: accepted_by is the owner's actor identity, the one the graph's events use, and accepted_on is the day the instruction was given. The commit message quotes the owner's instruction verbatim.
  - The owner's acceptance includes the three readings above. A reading the owner corrects returns to the record's leaf as an amendment and the record is shown again before any acceptance is entered; this leaf changes no figure, row or exception.
  - Out of scope: drafting or changing any figure, table row or exception, judging a bought part, the board layout, and the mains-to-low-voltage figures beyond showing them as the record holds them.
rationale: |
  Restores the behaviour REQ-ELECTRICAL-INSTALL-001.C15 and .C16 ask of a signed basis: the mains-to-mains figures are signed with the basis and every accepted shortfall is the owner's signed exception, not the drafter's. A build cannot enter the owner's acceptance, so the acceptance is its own leaf, closed only by the owner's explicit instruction, and the record's leaf closes on the drafted record.
