id: SOL-HW-REVIEW-FAN-OUT-DRIVER
type: deliverable
category: solution
title: A task runs a judged review as a setup session and one forked read-only reviewer per unit, bounded and recorded, and merges the units by a caller's checks
status: active
version: 3
text: |
  Why this exists. Wall-clock time and token use are what slow this project most, and the method's judged reviews run one reviewer through every unit in one long context. The reasoning, the measurements and the options rejected are in DEC-REVIEW-FAN-OUT-BY-UNIT-FROM-SHARED-SETUP, and DEC-FANNED-OUT-ROUND-IS-THE-SAME-ROUND settles that a round judged by unit is the same round; a session building this does not reopen either. This is the first of five solutions under DEL-HW-REVIEW-FAN-OUT and the one every other builds on: it builds the command, its handling of sessions and its generic merge, and no caller.

  What it does. A task-runner command starts a setup session that reads a review's shared material, then judges each unit of the review in its own reviewer forked from that session, the reviewers running together, and returns each unit's result to a merge that a caller defines. A review with one unit is judged in the setup session itself and is not forked. A caller is a definition the command reads: the prompt every session starts from, how the review's units are found in the review folder, the tools a reviewer is granted, the tables a result may contain and the checks the merge makes.

  Who reads its output. The person who runs a review round, the builder in PER-BUILDER-001 at a bench with a PC, or an agent session with no prior context following the method, as DEL-HW-DESIGN-METHOD.C5 counts it, reads the command's report, its REFUSED and CANNOT RUN lines and the hardware notes; neither has any other source of what the command needs, so each such line names its cause and what to do about it in the line itself.

  Settled before the build.

  - The command is a Python tool beside the other board tools under the hardware tools folder, with a task-runner entry, run on demand and in neither the build round nor the nightly. It starts the agent command line, which must be on the path and logged in; the task's description and the hardware notes say so. The command line's name is read from one environment variable, so the tests stand a stub in its place and the command is not tied to one vendor's in-session features.
  - What the builder reads from the agent command line's JSON output, observed on version 2.1.302 and to be checked against the installed version: the start report lists the session's id, tools, model, MCP servers and working directory; the result report gives the session's token usage (tokens read from and written to the prompt cache, fresh input and generated) which for a fork is the fork's own, and its cost, API time and turn count, which for a fork include the setup session's and so are reduced by the setup session's figures; a fork is started by resuming the setup session's id with the fork option, and may be started from any working directory; its tool set and model are set per fork.
  - The setup session's cache bounds how long forks may wait; forks are started as soon as the setup session returns, and each fork's cache-read tokens are recorded so a lapse shows as a fork that wrote what it should have read.
  - The setup session's prompt reads documents and records and nothing else: no image is opened, nothing is judged, and its answer is a bare acknowledgement. This is what makes a forked reviewer as blind as a fresh one, so the command checks it.
  - The merge holds no model. It fixes each table's columns, rejects a verdict outside the allowed set, renumbers this round's findings in the checklist's order and rewrites the citations of them in the verdict rows while leaving a citation of an earlier round's finding as written, telling the two by the round each citation carries against the round the caller names as this one and refusing an earlier citation that the review folder's earlier rounds do not hold, reports any two findings the caller's key says concern the same item or place without dropping either, and gives the same record whatever order the units arrive in. What a table's rows must cover, and the round's own fields, are the caller's and the starter's.
  - Each unit's result is kept in the output folder, so a unit that failed, or that needs a view the round's starter has since rendered, is run again alone and the results merged again.
  - A caller is a Python module beside the command, named review_caller_<name> in the hardware tools folder, that exposes the fixed set of attributes the definition above lists; the command takes the caller's name, imports that module, and refuses a name with no module or a module missing an attribute. The command also takes the folder to look for caller modules in, defaulting to the tools folder, so the tests load a synthetic caller from a temporary folder. A caller that has no findings table says so, and the merge then renumbers nothing. No caller is registered inside the command, so adding a caller never edits it.
  - The reviewer bound is a flag whose default is the caller's value; a bound below one is refused.
  - The output folder is kept apart from the review folder, because a reviewer that can read the review folder must not be able to read another unit's verdicts: an output folder inside the review folder, one that contains it, or one inside the repository is refused.
  - The check that the setup session opened no image is structural: the tool uses in its output are read and any read of a file whose type is not text fails the run naming the file. The check that it judged nothing is also structural: the setup prompt asks for one fixed token as its only text, and any text the setup session writes in its answer or between its tool uses other than that token, after trimming, and any content block of its history that is neither text nor a tool use, fails the run.
  - Every session is started with no MCP server and with the instruction sources (user instructions, hooks, memory, skills and plugins) excluded as far as the installed agent command line allows while it stays logged in; the start report is checked for them, and a source the command line cannot exclude is named in the hardware notes. The existing blind proofs, which start a fresh session with read tools only, carry the same exposure.
  - A single unit is judged in a second turn of the setup session, resumed without a fork and with the caller's tools; the fixed-token and no-image checks apply to the setup turn only, and a test covers the one-unit case.
  - A fresh run refuses an output folder that already holds a record, and the output folder holds a lock while a run is in it, so two runs never share one folder; running named units again is the one way back into a folder that holds a record.
  - A run of named units again starts a new setup session, since the first one's cache has lapsed, and the record says so.
  - The command reuses the board tools' clean-folder and CANNOT RUN handling and the review-seed commands' refusal pattern and exit statuses, and takes its text and JSON report form from the board history command; it is a new seam the four callers share, and it extends none of the review-seed commands. The task runner's tooling-tests description and the hardware notes' list of tested tools name the new command's tests, as the test that pins that description requires.
  - The hardware notes name what the start report cannot show or exclude (the built-in plugins and agents, the account email, and the git status and recent commit subjects when the review folder is in a git work tree) and say the model flag takes a full model id.
  - The tests need no model and no KiCad: a stub in place of the agent command line records how it was started, plays a session's start report and result report, including the cumulative figures a fork reports, and sleeps to show concurrency, over synthetic folders and synthetic callers.

  Out of scope: any caller, the content of any review, and the folder a review runs in.
