id: SOL-SEPARATION-BASIS-STALE-C606-CREEPAGE-EXCEPTION-REMOVED
type: deliverable
category: solution
title: The separation basis record no longer holds the C606 creepage exception the layout does not need
status: active
version: 1
text: |
  Removes the accepted_exceptions entry at index 16 of the main board's separation basis record, a creepage exception for the C606 pad pair (0.65 mm accepted) that the layout rule check no longer reports a shortfall for. The pre-order check reports it as stale and fails the board until it is removed or the geometry it excused is restored. The pair is not restored; the entry goes.

  Settled for the build:
  - Only that entry is removed; the 32 others and every figure stay. The record's own tests and the records that restate the count of 33 follow in the same change.
  - The owner has authorised re-signing on his word only: a signature day is entered only as he states it, as the sibling re-signing item records, and the build never picks one.
  - Out of scope: any other entry, figure, or the derating policy.
rationale: |
  Restores the behaviour REQ-ELECTRICAL-INSTALL-001.C15 asks of the record: a pair is held below the full figure only where the record lists it with its derivation and the layout needs it; an exception the layout does not need excuses nothing and leaves a signed claim that the pair is short. Found by the pre-order check on the finished board.
