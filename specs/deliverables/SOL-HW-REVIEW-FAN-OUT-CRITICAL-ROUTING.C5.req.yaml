id: SOL-HW-REVIEW-FAN-OUT-CRITICAL-ROUTING.C5
type: criterion
title: The layout folder command writes a critical-routing folder with the pass's own round fields and no review record
status: active
version: 2
measurement_type: binary
verification: test
text: |
  Over a synthetic repository with a routed board, the folder command with `--review critical-routing` writes a folder whose round file holds the pass number, commit and views and no kind or check lines, whose method extract holds the routing section, with a placement folder only when one is given and no check report, and for a pass after the first copies no review record; it refuses missing or malformed pass fields, a check report, and the layout mode's own options (the kind, check lines, listed items, regions, others and any round fields other than the pass's), and the layout mode's behaviour and tests are unchanged. Out of scope: rendering the views.
