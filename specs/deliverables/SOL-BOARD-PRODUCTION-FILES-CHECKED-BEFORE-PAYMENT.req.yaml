id: SOL-BOARD-PRODUCTION-FILES-CHECKED-BEFORE-PAYMENT
type: deliverable
category: solution
title: The method's ordering step checks a board's production files against the assembler's preview and on rendered layers before payment
status: active
version: 3
text: |
  The method gains an ordering step that checks the production files before a board is paid for. Every board's design task orders its board and is required to check its production files against the assembler's preview before payment; this solution writes how that check is done, so it is the same each time and a rebuilder can follow it.

  The step compares, for every placed part, the position, the rotation and the polarity or first-pin orientation in the assembly files with the assembler's own rendered preview of the assembled board, and the mapping of each position to its catalogue part with the parts specification record. It then renders the fabrication files, every copper, mask, legend and drill layer and the board outline, and has each looked at for missing, shifted or mirrored content. Each finding is corrected in the design and the files regenerated before payment.

  The step is proven blind on a proof design whose production files are seeded with known defects, a part rotated and a polarised part reversed among them, and following the step finds every one.

  Settled before build:

  - The step lands as a new ordering section in the board design method, after the layout review section, and the method's paragraph giving the order of its sections gains it, so the layout review is followed by the ordering step before the board is paid for. The method is the single followable document, so no new document is made. The assembler's dated facts stay in the manufacturer record and the step cites them by role: the placement file's columns and the assembler's own correction of rotation from the silkscreen polarity mark are read from that record, not restated in the method. Where the Konnect manufacture skill's ordering steps conflict with the step, the method's section on those skills says the step governs.
  - The step names the board toolchain's own export commands for the placement file, the parts list, every fabrication layer and the drill files, and the commands are run against the proof design when the step is written so what the step says runs. No task wrapper is added for them.
  - The step writes a production-files check record, committed with the board in the place and form the layout review record takes: a table with a row for every placed part (reference, position, rotation, polarity or first-pin orientation as the placement file gives them against the preview, the catalogue part the parts specification record maps it to, and a verdict) and a verdict for every fabrication layer and the outline. A row or layer not marked as matching blocks the order until the design is corrected and the files regenerated. A board whose files were exported but whose record is absent or has an unjudged row is not ready to pay for.
  - A layer is looked at by viewing its rendered image against the same layer of the design's own rendered views and stating what was compared; a layer with no content where the design has copper, mask, legend or holes, content shifted from the design's, and content mirrored are the three things the look is for.
  - The assembler's own preview needs an account and an upload, which a blind read-only session cannot hold. The step as written has the agent obtain the assembler's preview by uploading the files before payment, and the proof stands in for that preview with the design's rendered placement and three-dimensional views of the unseeded proof design, which show every part at its intended position, rotation and polarity. The evidence states the stand-in and why.
  - The proof design is the layout review's proof design, reused as it stands and not copied or extended: it is a committed throwaway design marked not for manufacture, with synthetic records, that passes the pre-order check, and it already holds a polarised surface-mount diode, a quad flat no-lead integrated circuit with a pin-one marker, small-outline packages whose rotation the assembler's convention decides, a crystal and keyed connectors, so the assembler's rotation and polarity conventions are exercised without drawing a board. Its production files are exported from the committed design by the commands the step names; nothing under the design's own folder changes.
  - A seeding script, run on demand and in no gate, writes a production-files folder outside the repository from the proof design's exported files: it seeds the placement file with a part rotated and a polarised part reversed, and seeds fabrication layers by exporting from an edited copy of the board so that a layer is missing content, shifted or mirrored. The script reuses the existing seeding mechanics generalised to take the design to copy. It writes the seed list apart, to a path the caller names, refused inside the folder or inside a design folder; per seed an identifier, the criterion area it covers, the layer or part, and what it is. The folder holds only what the step gives a follower: the seeded files, the design's rendered views (the stand-in preview), the method as written and the manufacturer record. A fixed prompt, which names nothing seeded, is printed by the script. The script has tests that catch a seed not landing and a seed list written inside the folder.
  - The blind follow is a fresh mid-tier session, with read tools only, working in the folder; it returns its production-files check record as its output. The comparison is recorded as one demonstration evidence entry stating the verified commit, the tool versions, the commands, the stand-in, and for each seed whether it was found and by which row or layer verdict. Findings matching no seed are listed: one showing a real defect in the clean proof design is fixed and the proof repeated; a false positive is recorded and does not fail the proof. A seed not reported is closed where the gap lies, in the step or in what it gives a follower, and the follow repeated in a new session.
  - The hardware readme's description of the layout review's proof design names the command that seeds its production files, and the method's ordering section names that proof design and the command.
rationale: |
  An assembled board most often goes wrong in its production files while its design is right: a footprint's rotation that differs from the assembler's convention, a diode or capacitor placed reversed, a layer exported mirrored. None of this is visible to the checks on the design, and all of it is visible in the assembler's preview and the rendered files before payment. The requirement was carried on the design-verification task and retired from it to each board's design task, where ordering happens, but nothing said how the check is made.
