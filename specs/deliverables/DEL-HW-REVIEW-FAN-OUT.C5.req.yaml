id: DEL-HW-REVIEW-FAN-OUT.C5
type: criterion
title: Each fanned-out review is shown to find every defect its single-reviewer form finds, in no more time and at no more cost
status: active
version: 1
measurement_type: binary
verification: demonstration
closes_by: cascade
text: |
  A blind run of each fanned-out review on a seeded copy reports every seeded defect, and the single-reviewer form is run on the same copy for comparison. For both forms the run records the seeds found, the findings that match no seed, the verdicts item by item, and for each unit and for the run the time, the tokens read, written and generated, and the cost. The fanned-out form finds every seed the single-reviewer form finds, and takes no more time and costs no more; a difference in verdicts is explained. The figures behind the decision are thereby checked at each review's real unit count. A seed not reported is closed where the gap lies and the run repeated in a new session.
