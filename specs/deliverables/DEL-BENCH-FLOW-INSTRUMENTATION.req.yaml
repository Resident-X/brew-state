id: DEL-BENCH-FLOW-INSTRUMENTATION
type: deliverable
category: task
title: The flow the machine already senses is read, positioned and resolved
status: active
level: task
version: 2
text: |
  The flow the machine already senses becomes flow the machine can use. A meter is fitted in the water
  path and wired to the OEM controller this project replaces, so the reading exists but is not
  available to anything being built. Its position is established (docs/sunbeam-em7000/reference-machine.md, "Already
  fitted"): on the coffee (brew and hot-water) pump's own suction line, roughly 5-7 cm ahead of the
  pump, drawing from a tank that sits above it -- not a supply shared with steam. What it measures,
  what it resolves, and whether a brew delivery can be told from a steam draw by it are established on
  the bench rather than assumed from the part.

  That position is exactly what DEC-FLOW-SENSED-UPSTREAM-OF-PUMP prefers, so no meter needs to move
  for position's sake -- though DEL-BENCH-FLOW-INSTRUMENTATION.C2's resolution requirement is a
  separate, still-open question, and if the fitted meter cannot resolve finely enough, a different or
  additional meter is still what C2 requires regardless of position. What is not yet established is
  whether the confirmed position actually makes a coffee delivery distinguishable from a steam draw
  once read for real, and what the existing suction-line restriction costs the vibratory pump in
  priming and cavitation margin under real operation -- the owner's account is that it has not caused
  a noticeable problem in factory use, but that is not yet bench-verified evidence. The meter sits
  below the tank's water level, so the suction line stays flooded rather than needing to self-prime by
  lift, which bears on that cavitation risk without settling it.

  What the reading resolves is set by the smallest difference between drinks an operator would
  notice, which is a property of the deliveries the machine is judged by rather than of what the part
  conveniently provides. This work does not wait on the sensitivity analysis: the roadmap carries
  instrumentation as the exception to procurement following that analysis, because bench
  characterisation, and so the committed model, is blocked without it.

  A pump that is energised but moving nothing becomes distinguishable from one that is working, which
  is the observation a commanded-flow fault has to rest on. What the machine then does about such a
  fault belongs to the control law.

  Out of scope: the flow term in the plant model, which is software-track work established against
  estimated values; the thermal, hydraulic and electrical bench characterisation of the other
  channels, which this phase carries separately; the safety and pressure-relief investigation; and
  withdrawing heat fed forward for a delivery that is not happening, which is a control-law behaviour.
