id: SOL-HW-BOARD-FOUR-POINT-FIXING-RESTORED.C5
type: criterion
title: Each wall-board triac can be fitted and removed with the board in place and without desoldering
status: active
version: 1
measurement_type: binary
verification: analysis
text: |
  The heater wall board's record states the order in which the board and the two triacs are fitted to the machine and removed, and shows that each triac can be mounted to the metal wall and removed from it, with its mounting screw reached by a driver, while the board stays in place and without desoldering any joint. The owner's intent is that each triac extends beyond the board's short edge with its leads folded to the pads so the screw is reached from beside the board; where the record finds that geometry does not hold, it weighs another form that gives the same independence, such as triacs mounted on the wall at a distance and joined to the board by insulated wires, and states the lead length, the bend and the creepage the form needs. A form that needs a triac's leads re-bent at each fitting fails. Out of scope: the spreader plate and the thermal interface between tab and wall.
