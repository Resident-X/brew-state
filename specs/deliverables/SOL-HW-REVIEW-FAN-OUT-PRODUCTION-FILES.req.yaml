id: SOL-HW-REVIEW-FAN-OUT-PRODUCTION-FILES
type: deliverable
category: solution
title: A task fans the production-files check out by group of placed parts and by layers and merges them into one check record that blocks the order on any row that is not a match
status: active
version: 5
text: |
  Why this exists. The ordering step's production-files check gives a verdict to every placed part and to every fabrication layer, one reviewer in one context, and it is repeated at every order and in its blind proof. The reasoning, measurements and options rejected are in DEC-REVIEW-FAN-OUT-FROM-SHARED-CONTEXT-WITH-REPLICAS, and DEC-FANNED-OUT-ROUND-IS-THE-SAME-ROUND settles that a check judged by unit is the same check; a session building this does not reopen either. This is the fifth of seven solutions under DEL-HW-REVIEW-FAN-OUT. It adds the production-files check as a declaration and a small module of checks and a rendered record for the review kit SOL-HW-REVIEW-KIT, and adds nothing to the kit; it is independent of the layout, critical-routing and schematic solutions. Its units are smaller than the reviews', so its saving is smaller, and it is built because the check is repeated at every order and in its proof.

  What it does. The check is judged by a few reviewers each holding a bounded group of placed parts that share footprints, and one reviewer holding every fabrication layer, the drill file and the outline, and the merge writes one production-files check record through the rendered record the kit's caller contract provides, with the commit judged and the tools and commands read from the review folder the kit passes the caller's prompts.

  Settled before the build.

  - The parts are grouped by footprint, because the rotation and polarity of a part is judged against the drawing of its footprint at rotation zero, and a group never exceeds ten rows, so a reviewer holds one drawing set and a bounded table. A reviewer for one row would pay for too little. The layers are one unit, because each needs only its own image and the design's view of that layer.
  - The parts are grouped by the footprint the footprint drawings' index gives each designator, at most ten rows a unit, the item count of the layout catalogue's largest areas, a larger group split into chunks in the placement file's order. A placed part whose footprint has no drawing goes in a unit of its own footprint name from the parts list, its prompt saying it has no drawing, and the merge refuses any verdict for it but cannot judge, since the method makes it a part whose first pin or polarity cannot be judged, which blocks the order.
  - The verdicts are the ordering step's three, matches, differs and cannot judge; a cannot judge is not resolved within the check and blocks the order as any row that is not matches does.
  - A reviewer is granted read tools only. The check is the last before payment, so it runs the pre-order round's three replicas, a full and a hunt framing on the mid-tier and the third on the small tier, with a time budget of about 350 seconds and the layout caller's bound of 30.
  - The merge checks that the parts rows equal the placement file's rows, one each and no other, and that there is a row for every fabrication layer, the drill file and the outline, each with a verdict from the three the ordering step allows; any row that is not a match is reported and blocks the order. The record's opening fields, the commit judged and the tools and commands, are inputs from whoever runs the check.
  - The opening fields, the commit judged, the tools, the commands and the preview, are written by the folder command into the round file from its arguments, through the round-file machinery of the layout folder command, and checked when the declaration is resolved, before any session starts.
  - The assembler's preview needs an account and an upload that a read-only session cannot hold. The step that obtains it stays outside every reviewer. The review folder holds the real preview for a real order, and for the proof the design's own rendered views as the proof's folder does.
  - The review folder for a real order is assembled by a command from the committed design and the production files the ordering step exports, holding what the step gives a reviewer. The exported files carry no record of the commit they came from, so the command takes the commit as an input and records it in the check record's opening fields; it does not claim to detect a mismatch.
  - The blind proof of the fanned-out form is SOL-HW-REVIEW-FAN-OUT-PRODUCTION-FILES-PROOF; until it is recorded the method relies on the single-reviewer form of the check.
  - The tests need no model and no KiCad, using the kit's stub over synthetic placement files, parts lists and unit results.

  Out of scope: placing an order; the layout, critical-routing and schematic solutions; the kit's mechanics.
