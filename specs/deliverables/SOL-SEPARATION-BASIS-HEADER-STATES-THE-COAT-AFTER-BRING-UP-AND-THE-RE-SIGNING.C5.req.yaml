id: SOL-SEPARATION-BASIS-HEADER-STATES-THE-COAT-AFTER-BRING-UP-AND-THE-RE-SIGNING.C5
type: criterion
title: The records that restate the basis's signature day or the coat's timing agree with the record
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  Inspection of every document in the main-board folder (apart from the frozen rounds of the layout and schematic review records) and the machine-record folder finds each statement of the day the separation basis record or one of its entries now carries saying 2026-11-18, the day the owner accepted the whole record in the working session, and finds each statement of an earlier signing day (2026-11-05, 2026-11-06, 2026-11-07 or 2026-11-14) naming it as the day that acceptance was made and not as the day an entry now carries, and none saying the coat is applied before the boards are energised or before mains is first connected. The derating policy's statements keep 2026-11-05. Out of scope is any document outside those folders and the frozen review rounds.
