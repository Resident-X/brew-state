id: SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT
type: deliverable
category: solution
title: The main board is laid out, reviewed and proven against its design records before it is ordered
status: active
version: 5
text: |
  Lays out the main controller board that the schematic leaf (SOL-HW-MAIN-BOARD-SCHEMATIC-PROVEN) drew and wrote records for, through the board design method (docs/board-design-method.md): the layout planned, placed, routed and reviewed from rendered views, and the pre-order check passing on the finished board. It lays out the schematic as that leaf left it; a schematic change found here is an amendment to that leaf, not a silent edit, and a layout change that moves a judged figure is a finding recorded and resolved.

  It covers every separation and fixing distance holding with each retained tab's footprint; the suppression parts placed if the judgements leaf finds the entry needs them; the inner-layer routes of the nets the division record joins there; the finished layout meeting the signed separation basis on every layer; the layout checklist read from rendered views; the division record naming the pump-figures leaf as owner of the pump drives' margins, with its selftest passing on the floorplan; and the pre-order check passing with no judgement weighed against a failure.

  Settled for the build:
  - All board work runs in the main session, because the Konnect toolsets are invisible to subagents; only the judged reviews fan out, to fresh reviewers that did not draw the board. The method's steps run in order and each is committed before the next.
  - A barrier the signed basis does not list is reported and the owner re-declares the basis before the part forming it is ordered; a distance is never relaxed to fit the layout.
  - The division record's note that the pump drives' margins are the design task's is corrected to name the pump-figures leaf (SOL-HW-PUMP-DRIVE-FIGURES-CLOSED), which owns them; the order leaf depends on it so a pump-drive part found later cannot follow the board's proof. The division record's selftest is rerun after any floorplan revision.

  Locus: hardware/sunbeam-em7000/ (the board's KiCad layout), docs/sunbeam-em7000/ division record. Ordering the board belongs to the order leaf.
rationale: |
  Split on the owner's decision (2026-10-29): the layout starts from the reviewed schematic of the schematic leaf, and the layout and proof are the cost of full blind review rounds, which a board design change forces.
