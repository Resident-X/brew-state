id: SOL-HW-CONTROLLER-BOARDS-ORDERED
type: deliverable
category: solution
title: Both controller boards' production files are checked against the manufacturer's preview and the cost is weighed before payment, and the order is placed on the checked files
status: active
version: 2
text: |
  Checks both controller boards' production files against the manufacturer's assembly preview, weighs the quoted cost of the order against the running total of the declared spend before payment, makes the files themselves correct for the assembler, and records the placed order, so the order goes in on files that match what the assembler will build. Receipt of the boards is the sibling leaf's.

  Settled for the build:
  - Both boards ride in one order and one parcel, as the cost estimate prices them, so the quote and the running total are weighed once for both. Each board still has its own production-files check, its own assembly preview and its own part-by-part table, recorded as the method's ordering step directs; payment waits until every row of both tables matches.
  - Placing the order and paying are the owner's acts. The leaf records the check, the cost weighed before payment and, after the owner reports the order in, the order confirmation, and closes there. Receiving the boards is not this leaf's, so the two weeks or so of manufacture and shipping do not hold it open.
  - The production files are generated from the design and never edited by hand. The parts list gives one comment for each catalogue number. The placement file is written in the assembler's own footprint frame, found by matching the board's pads to the assembler's published footprint for each catalogue number, which replaces passing the board editor's footprint origin and rotation through as they stand. The first real upload's assembler preview is the oracle for the rotation direction and the origin convention, since no test can say which way the assembler counts.
  - Whether the assembler fits the through-hole parts is not yet decided, so each part carries a recorded choice of who fits it and the files are written as a full set and a surface-mount-only set from the same design. The set uploaded is chosen at order time. Only the parts the assembler places are compared with its preview.
  - If the owner decides the heater wall board is a section of the main board, there is one board to check and the wall board's check drops out; the judgements leaf's record of that decision carries the consequence.

  Locus: the placement and parts list steps in hardware/tools/production_files.py, the method's ordering section in docs/board-design-method.md and the manufacturer record it cites, the production-files check records beside each board under hardware/sunbeam-em7000/, docs/sunbeam-em7000/controller-board-cost-estimate.md and the declared spend in the component specification.
rationale: |
  Sized as one leaf because both boards ride in one order priced against one running total, so splitting by board would weigh the same quote twice and order in two steps what the cost estimate prices as one parcel. It is its own leaf, apart from the design leaves, because it begins only when both boards are proven and ends on an owner's act; keeping that wait out of the design leaves lets them close when their designs do. It ends on the order confirmation and not on receipt, which is the received-boards leaf's, because manufacture and shipping take weeks and holding an implementation leaf open across them leaves work that is finished looking unfinished.

  It replaces the earlier leaf that held ordering and receipt together. The criteria that carried over keep their numbers, so the references to the catalogue read and the laminate request still name the same criterion.
