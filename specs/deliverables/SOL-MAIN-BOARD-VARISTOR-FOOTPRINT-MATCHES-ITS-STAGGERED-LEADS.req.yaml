id: SOL-MAIN-BOARD-VARISTOR-FOOTPRINT-MATCHES-ITS-STAGGERED-LEADS
type: deliverable
category: solution
title: The main board's varistor footprint matches the part's staggered leads so RV101 stands square
status: active
version: 2
text: |
  Corrects the main board's varistor footprint `RV_Disc_14D471K_P7.5mm`, whose two pads lay in one line 7.5 mm apart while the part's leads do not. A disc varistor of this family (the 14 mm 470 V part, 7.5 mm lead pitch) has its leads on the opposite faces of the disc, offset across the thickness. The assembler's own footprint for the part draws the pads 7.5 mm apart along and 3.0 mm across, and the Bourns drawing of the like 14 mm part gives 3.2 mm typical; the Ruilon drawing of the fitted part shows the offset without a figure. With in-line pads the part can be fitted only by tilting it about 22 degrees, which the ordering files had to carry as a rotation override of 201.8 degrees, and the footprint's own description wrongly said the leads are "straight in one plane". The layout was judged and ordered-ready with the mismatch in place; it is a workmanship shortfall of the footprint, not a safety or function fault.

  The correction makes the footprint a staggered pair at 7.5 mm along and 3.0 mm across (drill and pad size kept), states the stagger in its description, keeps RV101 square to the board at 180 degrees, and extends the locked neutral pour on the inner layer by 1.5 mm so the moved pad stays inside it, with the mains separation and creepage held to the board's signed basis and the signed record of the filter distance annotated. The wall board's varistor RV911 uses a staggered footprint already and is not touched.
rationale: |
  REQ-BOARD-LAYOUT-PRACTICE-001 names the workmanship of placement in its scope, and a board judged against it is changed, not accepted as unimportant, when an item fails. A part that stands crooked in holes drawn for a different lead arrangement is a workmanship failure that the owner chose to correct before the next order. The change touches mains copper, so it is held to the separation basis and the board's full checks, and its design-file change is reviewed blind as any design change to this board is.
