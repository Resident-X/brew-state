id: SOL-BOARD-REVIEW-RECORD-HISTORY-CHECK
type: deliverable
category: solution
title: A board's layout review record is checked by a command for rounds changed after they were recorded
status: active
version: 2
text: |
  Why this exists. The method's layout review step requires each round of a board's review record to stand as it was first recorded, so that the planning-shortfall check reads round 1 as first written and no finding is quietly dropped. The check is written as git commands for the reviewer to run by hand, and nothing runs it: during the workmanship build a commit replaced the layout review proof design's whole record with its latest round, deleting five earlier rounds, and no check failed. The history was restored by hand. A rule whose breach a command can detect belongs in a command that fails, not only in prose a reviewer must remember to follow.

  What it does. Puts the review step's history checks, each round standing as first recorded and the closing round judging the board as it stands, into one command that reads a board's review record and the repository's history and fails, naming the round and what changed, when either does not hold; and has the method's review step run it in place of the hand-run git commands.

  Out of scope: the review step's judgement checks, which a reviewer makes.

  Placement and settled choices. The command is a new module beside the placement history check in the board tooling, a new task beside that check's task, and it reuses that check's history reader, report and markdown section and table parsers and the pre-order check's list of design files, less the board folder's own records (markdown and YAML, the review record among them), rather than copying it; the design files the checks key on are the files KiCad reads, so a record's own commits and a finding's closure never count as a design change. It is not a mode of the placement history check (a different record), not part of the pre-order check (wrong cadence, needs the CAD tool) and not in the firmware tree. Its tests live with the board tooling's tests, use no CAD tool and are not proof-derived, so the build round runs them whenever a board path changes; the round gate and its list of board-read paths need no change. Round parsing: a round is a `## Round <n>` section; its opening lines run to the first subheading, its verdict table is the Verdicts table, its findings are the Findings table read by column name. The Closed by column is the one field that legitimately changes after a round is recorded, so it is never compared: the comparison covers the opening lines, the verdict table and each finding's number, Raised by, Severity and What and where, the fields the method names. A round's end-of-round commit is the first commit in the record's history that holds that round's heading. A round present in any earlier version of the record and absent now fails, so the proof design's restore history is the shape to test. The closing round is the highest-numbered round at HEAD. The method's ordering rule, that the end-of-round commit is an ancestor of, and not, every later commit changing the design files after the round's Board judged commit, is carried by the command because the hand-run commands it replaces held it. The command refuses, as the placement history check does, a shallow clone, a record or design file that is untracked, absent or differs from HEAD; it prints CHECK and RESULT lines, a JSON document with the same content, and exits 0 on pass, 1 on a failed check, 2 when it refuses. Each failure names the board, the round and what differs.
