id: DEL-HW-MAINS-ENTRY-ASSEMBLY-DESIGNED
type: deliverable
category: task
title: The mains-entry assembly's parts, ratings and mounting place are fixed from the makers' documents and the owner's decisions
status: active
priority: must
level: task
version: 1
text: |
  The mains-entry assembly is the off-board assembly holding the bought inlet, the filter and the inlet fuse. The division record places no position for it inside the enclosure and holds where it mounts, and whether the fuse and a varistor move onto the main board in its place, as owner decisions pending. This task fixes the assembly's parts and place from the owner's decisions and the makers' current documents.
