id: SOL-PRE-ORDER-CHECK-TEST-POINT-COURTYARD-DISTANCE
type: deliverable
category: solution
title: The pre-order check fails a test pad closer to a part's courtyard than the layout review's item allows
status: active
version: 2
text: |
  The layout review's item TEST-1 asks that every test point stand at least 1.0 mm from the courtyard of any part, on either side of the board, and gives the figure from its own published source. The layout review's proof design failed it on three test points in round 14, and finding 14.3 of that review judged the check a measured rule: the distance from a test pad to each part's courtyard is a figure the pre-order check can read from the layout file, as it already reads courtyards for the mounting-hole and crystal keep-clear checks. Today a reviewer's judgement is the only thing that catches a test point under a part's outline. This leaf puts the measure in force as a rule of the pre-order check, set in each board's rules with its source, and adds it to the catalogue as a rule-kind item, as the review step requires of a finding that can be a rule.

  Placement: the rule extends the existing courtyard measurement beside the designator-astray check in hardware/tools/board_check.py, reusing its per-side courtyard box and polygon gap, and its figure joins the workmanship figures the check already reads from the project text variables and fails on when omitted. No new geometry module, no KiCad custom rule (KiCad measures a courtyard only against another courtyard) and no new record form are introduced.

  Settled: the catalogue item is TEST-5, named by finding 14.3 as the new rule-kind item, and TEST-1 is amended to defer spacing from part outlines to it. A test point is a part whose reference designator begins TP, as a connector is a part whose reference begins J. Any part is every other footprint that draws a courtyard on either side; the test point's own footprint is excluded and a part drawing no courtyard is skipped. The figure is 1.0 mm from the item's published source and lives in a project text variable with a row in each tracked design's rules naming that source; a design that omits it fails, and a design with no test point passes. The report names the fix, in the form of the designator-astray message. The seed fault is made in a throwaway copy outside the repository.
