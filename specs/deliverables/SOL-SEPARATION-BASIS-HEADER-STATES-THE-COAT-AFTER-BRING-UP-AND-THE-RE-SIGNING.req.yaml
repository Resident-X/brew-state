id: SOL-SEPARATION-BASIS-HEADER-STATES-THE-COAT-AFTER-BRING-UP-AND-THE-RE-SIGNING
type: deliverable
category: solution
title: The separation basis header states the coat as applied after bring-up with the credit on the enclosure, and the record carries the owner's acceptance of 2026-11-18
status: active
version: 2
text: |
  Makes the separation basis record's header and its signature say what the owner decided on 2026-11-06 about the conformal coat and what the owner accepted on 2026-11-18. The sealed solution that redrafted the record at pollution degree 2 holds, as its third criterion, a header whose first condition has the coat applied "before the boards are energised in the machine", and its test pins that phrase. The owner decided (in session, 2026-11-06) that the conformal coat comes at a much later stage, once the machine is deemed functional from a hardware perspective; the pollution degree 2 credit rests on the enclosure, the owner's sealed cavity whose only openings are the harness entries, and the coat is a supporting measure; the first connection to mains and the bring-up bench tests run on the uncoated boards in a clean room. The main board's fabrication-note criterion, the heater wall board's, and the bring-up task's coat criterion already say so. The owner re-signed the whole record in writing on 2026-11-06 ("Accept all and resign", entered by Claude on that instruction). On 2026-11-18, shown the record and the readings it marks for his check, the owner accepted the whole record in the working session ("I accept the separation basis record as signed."), and the acceptance was entered on the record and on each of its 42 exceptions (commit 771eba09), so the record's top-level accepted_on and that of each of its 42 exceptions read 2026-11-18; the earlier acceptances (2026-11-05, 2026-11-06, 2026-11-07 and 2026-11-14) are history, each superseded on every entry. No figure, pair, distance, reason or bound changed with the date.

  Settled for the build:
  - Condition 1 of the header states the credit as standing on the enclosure, the coat as a supporting measure applied after bring-up once the machine is deemed functional from a hardware perspective, the first connection to mains and the bring-up bench tests as running on the uncoated boards in a clean room, and the coat as no part of the bound on any fault between mains pads until it is applied. The two other places in the header that repeated the old timing say the same.
  - The header states that the owner accepted the whole record in the working session on 2026-11-18, that Claude entered the acceptance in the record and in each of its 42 exceptions, that no figure, pair, distance, reason or bound changed with the date, and the earlier acceptances (2026-11-05, 2026-11-06 re-signing, 2026-11-07 and 2026-11-14) as history each superseded on every entry; no sentence of the header gives an earlier day as the one the record or an entry now carries.
  - By DEC-SIGNED-BASIS-RECORD-FACTS-HAVE-ONE-OWNING-LEAF this item owns the header's wording and the statements of the signature day and of the coat's timing in the records that restate them. The count of entries and the day value they carry are pinned by SOL-SEPARATION-BASIS-RE-SIGNING-ITEM-DAY-COUNTS-MATCH-THE-RECORD, the owner's acceptance and its commit belong to SOL-SEPARATION-BASIS-RECORD-MAINS-TO-MAINS-ACCEPTED-BY-OWNER, and the record's exception set and the forms that make it up belong to SOL-SEPARATION-BASIS-RECORD-STANDS-SIGNED-ON-THE-FINISHED-LAYOUTS-EXCEPTION-SET. The reading is shared by design and the ownership is not: C4 requires the record and each of its 42 entries to read 2026-11-18 because the header's statement of that day is checked against the day the entries carry, so a record or an entry reading another day fails this item's test as it fails the day-count item's; the day value and the count stay owned by the day-count item, and this item's own content is the header's statement of the acceptance, the earlier days kept as history, and the signer words on the record and on each entry (that the acceptance read there is the owner's, entered by Claude).
  - The sealed criterion C3 of the redrafting solution and its evidence are not edited; this item's criteria govern the wording of condition 1 and the header's statement of the signature, and the record's test that pinned the old phrase reads the new. Superseding that solution's whole deliverable, the route the engine names for a frozen criterion that says the wrong thing, retires thirteen criteria and repoints six dependants, and is left for a decision of the owner's; until then this item is the record of what condition 1 must say.
  - Out of scope: the derating policy, which keeps its own 2026-11-05 signature; the coat's choice, supplier and application; any figure of the record.
rationale: |
  Restores the behaviour REQ-ELECTRICAL-INSTALL-001.C15 asks: the figures are read for the declared pollution degree on stated conditions, and the signed record states those conditions as they are. A header that says the coat goes on before the boards are energised, when the owner has decided it goes on after bring-up and the credit stands on the enclosure, misleads the owner who accepts the record and the bring-up reader who decides what protects the first mains-on; the sealed criterion that required that wording said the wrong thing after the owner's decision of 2026-11-06 and is left as what was verified then.
