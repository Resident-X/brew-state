id: SOL-HW-HEATER-WALL-BOARD-PROVEN-AND-LAID-OUT.C12
type: criterion
title: No line the board drives from its header is supplied from a source that stands while the main board's +3V3 is absent
status: active
version: 3
measurement_type: binary
verification: analysis
text: |
  The board's records state, with the reasoning, that the board places no source of its own on the header and that its only supply enters on +5V_WB from the main board's isolating link, so no line it can drive from the header is driven from a supply that can stand while the main board's +3V3 is absent. Each statement carries its source. Making the main board enforce the limit is out of scope.
