id: SOL-HW-REVIEW-KIT.C15
type: criterion
title: A caller may name the verdict that counts as its fail verdict, and the kit holds that verdict as it holds fail
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Over synthetic declarations and a stub executor, a caller may name which of its verdicts is its fail verdict, a verdict of the verdict set of a table it declares; the kit then treats that verdict exactly as it treats fail: replicas are merged any-fail with it standing over a passing verdict, and no repair turn, cannot-judge turn or rerun clears it, the refusal naming the item and the verdict. A caller naming none keeps fail as its fail verdict, and a caller that names fail behaves as one that names none. A name outside the verdicts of the table is refused naming it and the table, before any session starts. Out of scope: any real caller.
