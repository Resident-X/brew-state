id: SOL-PLANT-FIXTURES-BUILD-CLEAN-UNDER-GCC
type: deliverable
category: solution
title: The fixture plant structures build without warnings under GCC as well as clang
status: active
version: 2
text: |
  The fixture plant structures do not build under GCC with the project's strict warning settings. Each assigns the result of a conditional expression of plain unsigned type to a heated-mass identifier whose type is eight bits wide; GCC's conversion warning, which the host build treats as an error, rejects the implicit narrowing, while Apple clang accepts it. The two reported sites are in firmware/src/plant/fixture/plant_structure.c and firmware/src/plant/flow_fixture/plant_structure.c, and the same pattern is to be looked for in every plant structure and anywhere else a heated-mass identifier or another narrow identifier type is assigned from an integer expression. Because the host build fails on a Linux host, the build-time checks and the host run fail downstream of it there too.

  The correction makes every such assignment produce a value of the identifier's own type, so both compilers accept it under the unchanged strict settings; the settings themselves are not relaxed. It also makes sure that a verification run compiles the host tier with each compiler a supported host defaults to, GCC on Linux and clang on macOS, so a reintroduced narrowing one compiler tolerates is caught by a run rather than by the next contributor on the other platform. Where that second compiler runs, in the round gate or only in the nightly, is for the build to settle against the round gate's time budget.

  Settled for the build. Locus: the conditional assignments at firmware/src/plant/fixture/plant_structure.c line 74 and firmware/src/plant/flow_fixture/plant_structure.c line 77, each corrected so both branches carry the identifier's own type; a search of every other plant structure and of every other narrow-identifier assignment under firmware/ confirms no further site, and no warning setting changes. Placement: the second compiler runs only in the nightly full verification and never in the round gate. DEC-VERIFICATION-ROUND-TARGETED-NIGHTLY-FULL rejects running every tier on every round for its cost and puts the host's second-platform proof on hosted runners, and the author's host has no GCC, so a GCC tier in the round would add local state a clean checkout is required not to need. The existing hosted Linux job already supplies GCC. The nightly workflow gains a hosted macOS arm64 job that runs the host-tier build task declaration under Apple clang, installed and pinned the way the Linux job installs its tools and held to the same workflow constraints as every change to that workflow, and the workflow's header and the firmware documentation say which compiler each nightly job builds with. Rejected: injecting clang on Linux through a compiler setting, which adds a compiler-selection seam beside the one the mutation sweep already uses and builds with an upstream clang no contributor on a Mac runs; counting the mutation sweep's clang build, which drops the strict settings; and a GCC build in the round gate. Evidence: the build-task result of each nightly job, not a green night, because SOL-HOST-ARITHMETIC-REPRODUCIBLE-ACROSS-HOSTS still fails the Linux night in later gates on correct code.
rationale: |
  Found by the first hosted run of the nightly full verification (https://github.com/Resident-X/brew-state/actions/runs/38529890266, ubuntu-24.04, GCC); every build until then had run on the author's macOS arm64 machine with Apple clang, which does not warn on this narrowing. SOL-VERIFY-NIGHTLY-FULL-ON-MAIN directs a defect its nightly run finds on main to a maintenance item of its own, and this is one: nothing the graph says is wrong — SOL-PLANT-STRUCTURE-SEAM-FIRST-STRUCTURE.C9 already requires the structures to compile under strict warnings with a conversion treated as a failure, and a clean checkout is already required to build without the author's machine — it is the delivered code that met those only under one compiler. It is kept separate from the host-arithmetic reproducibility item the same run found because the cause and the correction are unrelated: this one is a type error a compiler reports, that one is floating-point results differing between hosts.
