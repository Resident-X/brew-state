id: SOL-HW-CONTROLLER-BOARDS-ORDERED-AND-RECEIVED.C5
type: criterion
title: The written laminate request to the manufacturer and the laminate note on the order, with the answer, are recorded before payment; a comparative tracking index certificate is not a precondition at pollution degree 2
status: active
version: 2
measurement_type: binary
verification: inspection
text: |
  Before payment, the owner's written request to the manufacturer's support for the laminate maker and product the order will use, and for a certificate or test report of that laminate's comparative tracking index to IEC 60112, is recorded in a board record with its date, together with the laminate note carried on the order; the manufacturer's answer, or the absence of one, is recorded there as evidence with its source and date. At pollution degree 2 the separation basis uses the material group III column, which covers groups IIIa and IIIb alike, so a comparative tracking index certificate is not a precondition to payment. An answer naming a laminate whose published index is below 100, which falls in no material group, is reported and the order is not paid for until the owner re-declares the basis; so is a pollution degree 3 fallback taken without an index of 175 or more recorded. Out of scope are choosing a different laminate supplier, the certificate that arrives with the received boards, and a test of a delivered sample.
