id: SOL-HW-CONTROLLER-BOARDS-ORDERED-AND-RECEIVED
type: deliverable
category: solution
title: Both controller boards' production files are checked against the manufacturer's preview, the cost is weighed before payment, and the received boards are the ones checked
status: active
version: 2
text: |
  Checks the production files of both controller boards against the manufacturer's assembly preview, weighs the quoted cost of the order against the running total of the declared spend before payment, and takes the boards through ordering and receipt, so the boards that arrive are the ones the checked files describe.

  Settled for the build:
  - Both boards ride in one order and one parcel, as the cost estimate prices them, so the quote and the running total are weighed once for both. Each board still has its own production-files check, its own assembly preview and its own part-by-part table, recorded as the method's ordering step directs; payment waits until every row of both tables matches.
  - Placing the order, paying and receiving are the owner's acts. The leaf records the check and the cost weighed before payment, and its last criterion closes on the owner's report that the received boards are the ones the checked files describe; it stays open until then.
  - Parts the owner fits by hand are not part of the manufacturer's assembly, so only the surface-mount parts the manufacturer places are compared with its preview.
  - If the owner decides the heater wall board is a section of the main board, there is one board to check and the wall board's check drops out; the judgements leaf's record of that decision carries the consequence.

  Locus: the production-files check records beside each board under hardware/sunbeam-em7000/, docs/sunbeam-em7000/controller-board-cost-estimate.md and the declared spend in the component specification.
rationale: |
  Sized as one leaf because both boards ride in one order priced against one running total, so splitting by board would weigh the same quote twice and order in two steps what the cost estimate prices as one parcel. It is its own leaf, apart from the design leaves, because it begins only when both boards are proven and ends only on an owner's act; keeping that wait out of the design leaves lets them close when their designs do.
