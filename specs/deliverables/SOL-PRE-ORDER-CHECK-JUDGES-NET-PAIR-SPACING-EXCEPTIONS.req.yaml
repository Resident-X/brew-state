id: SOL-PRE-ORDER-CHECK-JUDGES-NET-PAIR-SPACING-EXCEPTIONS
type: deliverable
category: solution
title: The pre-order check passes a mains-to-mains shortfall between two sets of nets only on a signed net-pair exception no lower than the record's band figure and fails every other
status: active
version: 3
text: |
  The pre-order check passes a mains-to-mains creepage or clearance shortfall between two sets of nets only on a net-pair exception the owner has signed in the separation basis record, down to a distance no lower than the creepage the record's band rows give for the voltage the entry states across the gap, and fails every other. The decision DEC-MAINS-BASIS-TAKES-POLLUTION-DEGREE-2-ON-A-COATED-BOARD lets the record lower the 2.6 mm creepage for pairs of nets joined by a part or a chain that divides the supply, each at its own working voltage, and the existing spacing exception names one pair of pads or two nets; a divider chain, a neutral-referenced group or a pair of mains nets with copper of every kind between them needs one entry for a set of nets, covering a pad, a track, a via or a zone of either net.

  Settled for the build:
  - The entry form is a fourth form of accepted_exceptions, selected by the presence of the key nets_a, which the reader tests before choosing the key set. It holds pair (mains_to_mains only), constraint (creepage or clearance), nets_a (a non-empty list of net names), nets_b (an optional non-empty list of net names; omitted, or equal to nets_a, the entry covers every pair of different nets inside nets_a), working_voltage_v (a positive number, the largest rms voltage across a gap between a net of one list and a net of the other in normal operation at the top of the declared supply span), accepted_mm (a positive number of millimetres), reason, bounded_by, accepted_by and accepted_on, all required, and no between. The reader fails an entry that holds both between and nets_a, a key outside those named, a repeated key, a nets list that is empty, repeats a net or holds a non-text item, a pair other than mains_to_mains, a constraint outside creepage and clearance, or a working_voltage_v or accepted_mm that is not a positive number, each as separation_basis naming the entry and the key. The key set of the other three forms and every reading of them is unchanged.
  - The judgement is the rules decision's, applied to the new form. A creepage or clearance shortfall the layout rule check reports under a rule the check appends for mains_to_mains, whose two items carry two different nets, one in each list (or both inside nets_a where nets_b is omitted or equal), for the entry's constraint, is accepted when the distance KiCad reports is no less than accepted_mm and a violation naming the entry when less. Any copper item may be either side: a pad, a track, a via or a zone. The distance is the one KiCad reports, never recomputed, and a shortfall whose report carries no distance counts as 0.0 mm, so a missing distance never meets an entry. A shortfall already judged by a between entry or a same_connector_pins entry is not judged again: net-pair entries are judged in a second pass, after those entries, so the more specific entry wins. Where the Mains net class cannot be resolved, every net-pair entry fails closed as spacing_exception rather than being judged. The judgement of one entry against the basis, its signature, its working voltage, its band figures and its lists, is a pure helper that needs no layout, so a test of a committed record can call it; the layout-dependent parts (nets present, class membership, shortfalls used) are judged around it. A shortfall between nets outside the lists, or of the other constraint, stays the layout rule check's ordinary violation.
  - The band figures. The record's table_rows of insulation functional and location conductor (or none), whose pollution_degree and material_group equal the record's, give a creepage band figure and a clearance band figure for a working voltage, each read from the rows' creepage_mm or clearance_mm: the figure of the row at that voltage; the linear interpolation between the two adjacent rows rounded up to 0.1 mm, exact in decimal and not in floating point (126.5 V gives 1.6 mm, 84.5 V gives 1.4 mm); the lowest row's figure for a voltage below it; and no band figure above the highest row. At the record's rows the creepage figures are 10 V 0.40, 25 V 0.50, 50 V 1.20, 125 V 1.5, 160 V 1.6, 200 V 2.0, 250 V 2.5 and 320 V 3.2 mm, and the clearance figures 0.2 mm to 50 V and 1.5 mm from 125 V. A row lacking the figure a read needs gives none.
  - Failure is closed. An entry fails under the name spacing_exception, naming the entry, when: its acceptance is unsigned, a placeholder or in angle brackets, dated later than today or later than the record's own acceptance; a net it lists is absent from the layout or is not in the Mains net class, so a pair spanning mains and low voltage cannot be excused by this form; its working_voltage_v is above the record's working voltage or above the highest band row, so there is no band figure; its constraint is creepage and accepted_mm is below the creepage band figure for its working_voltage_v or below the clearance band figure for it (creepage is never accepted below the clearance of the pair); its constraint is clearance and accepted_mm is below the clearance band figure for its working_voltage_v; or its accepted_mm is below 0.2 mm; its accepted_mm is not below the figure of the rule that reports the shortfalls it covers, so it relaxes nothing; its lists put both nets of any pair in held_at_reinforced on opposite sides, so the pair across the open interlock contact cannot be excused; or no reported shortfall uses it, so a stale entry fails. A record that is unsigned or synthetic on an orderable board is honoured for no entry.
  - Reporting. Every accepted net-pair exception is printed in the check's text report as one ACCEPTED line per entry giving the constraint, both lists of nets, the number of shortfalls it covered, the narrowest distance KiCad reported, the accepted distance, the signed figure it falls short of, the stated working voltage with its band figure, the owner's reason and the bounding element. The report has one form, text.
  - The working voltage is the owner's assertion with a derivation in the reason. The check does not recompute it from the derated-voltage machinery's net voltages: that machinery works in peak volts from pin-limit domains of one design and needs the pin-limit record, the entry's working voltage is rms across a gap and is read on proof designs that carry no pin-limit record, and a second derivation would give two figures to reconcile for no more assurance than the band floor and the signature give. The reason states the derivation (each net's fraction of the line voltage, or its stated offset from neutral) for the owner to accept or correct. The record's single-fault table, which shows for each entry that a single fault creating a higher voltage across the gap is current-limited and creates no hazard, is a comment block the check does not read and does not judge; the entry's judgement here is unchanged by it.
  - Records and proof. The hardware notes gain the entry form in the record keys, the reader row and the spacing_exception row, and adopter step 6. The seeded-fault rows of the proof run (the rows of board_prove.py) gain one fault each, run on a throwaway copy of a proof design and never on the tracked designs: a malformed entry (a missing key, an unknown key, an entry with both between and nets_a, a non-positive working_voltage_v, an empty list), an unsigned entry, an accepted_mm below the band figure, an accepted_mm below the clearance, an accepted_mm not below the rule figure, a net absent from the layout, a net outside the Mains class, a pair across the open contact, a working voltage above the highest row, and an entry no shortfall uses; and one shortfall outside the lists that still fails and one below the accepted distance that fails. The shared KiCad fixtures (board_kicad_fixtures.py) gain a proof layout with nets in the sets. The proof designs' own synthetic records gain the functional band rows, creepage and clearance, where a test needs them. Tests carry the criterion text and each guard is shown to fail when its condition is removed.
  - Out of scope: the owner's signature of any entry; the entries drafted for the main board; the figures and band rows of the record; the open-contact pair's reinforced rule; clearance or creepage figures below the band figures, the low-voltage rows of which are unverified readings; the plated-hole and pad-pair forms; and the derated-voltage rule's exceptions.
rationale: |
  Restores the behaviour REQ-ELECTRICAL-INSTALL-001.C16 asks of the check: a shortfall is passed only as an exception the owner has signed, with the least distance accepted, now for a set of nets whose gap carries less than the supply voltage. REQ-ELECTRICAL-INSTALL-001.C15 lets a listed pair be held to the creepage for its own working voltage; a check that can only excuse one pair of pads or two nets at a time cannot hold the divider and neutral-referenced groups of the main board without a hundred entries, and a check that muted them would pass a pair whose geometry later worsens. A set entry that is scoped by net, bounded below by the record's band rows and the pair's clearance, signed, and failed when stale, keeps the owner's acceptance pair by pair without loosening the rule for any pair outside it.
