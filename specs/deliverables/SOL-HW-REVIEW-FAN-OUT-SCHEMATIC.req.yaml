id: SOL-HW-REVIEW-FAN-OUT-SCHEMATIC
type: deliverable
category: solution
title: A task fans a schematic review round out by catalogue area and merges the areas into one round, checking every net, part and sheet is covered
status: active
version: 5
text: |
  Why this exists. The schematic review judges every net, part and sheet of a schematic against every item of the circuit practice catalogue, one reviewer in one context, and its blind proof repeats that on a seeded copy. The reasoning, measurements and options rejected are in DEC-REVIEW-FAN-OUT-FROM-SHARED-CONTEXT-WITH-REPLICAS, and DEC-FANNED-OUT-ROUND-IS-THE-SAME-ROUND settles that a round judged by unit is the same round; a session building this does not reopen either. This is the fourth of seven solutions under DEL-HW-REVIEW-FAN-OUT. It adds the schematic review as a declaration and a small module of checks and a rendered record for the review kit SOL-HW-REVIEW-KIT, and adds to the kit only a verdict table keyed by several columns (SOL-HW-REVIEW-KIT.C14), since its record gives one row to each item and net, part or sheet; it is independent of the layout, critical-routing and production-files solutions.

  What it does. The schematic review is judged by one reviewer per catalogue area and one for the whole-schematic free pass, from a shared context that holds the schematic's records, the sheet drawings and the part pages, and the merge writes one round of the schematic review record through the rendered record the kit's caller contract provides.

  Settled before the build.

  - The units are the circuit catalogue's area headings in the review folder's own method, found as the layout caller finds its own, and one unit for the free pass. The pin-voltage item selects every net and the derating item every part, so their areas are the largest units; the merge does not split them.
  - What an item selects is the reviewer's judgement from the item's condition and is not recorded, so the merge does not check it. It checks what can be computed: every catalogue item has a verdict row, every net and part the review folder's netlist holds and every sheet of the schematic has a row in some item's rows, and no row names a net, part or sheet that does not exist. A net, part or sheet no unit covered fails the run naming it. The sheet list comes from the schematic's own files.
  - The answer's Verdicts table is keyed by Item and Net or part, replicas merged any-fail per pair; a Findings table with the method's columns and the item that raised each; one unit for the free pass, whose findings carry the checklist's last entry as the layout caller's do.
  - A cannot judge is resolved within the round as the method says: the merge fails a round that holds one, naming the item and the document or sheet it needs; whoever started the round adds it with the schematic folder command's add-document or add-view mode and re-runs that unit, and the row is rendered as `cannot judge, then <verdict>` with the added document in Rests on.
  - The caller runs the design loop's two replicas, a full and a hunt framing, on the small-tier model, with a time budget of about 350 seconds and the layout caller's bound of 30.
  - The proof takes a seeded work tree and a seed list, and a finding matches a seed when its Item cell equals the seed's item, because no seeding command exists for this review; a seeding session makes both.
  - The answer's Findings table has the columns Finding, Item, Raised by, Severity, What and where and Closed by, and the record omits Item.
  - The free-pass unit gives one row with item FREE-PASS and `none`, and the hunt framing reverses item order only.
  - The root sheet is named by the design, a sheet below it by its sheet name, and nested sheets are joined with /.
  - The verdict table uses the kit's key-column rule.
  - The round's fields, its number, the commit judged, the netlist command and the records read, are written by the folder command into the round file and checked when the declaration is resolved, before any session starts; for a round after the first the folder holds the earlier rounds of `schematic-review.md` as recorded, since a fail's Why may cite a finding an earlier round closed by a reason.
  - A reviewer opens every datasheet at its published address and never recalls it, so the caller grants read tools and read-only retrieval of a document at an address, through the retrieval grant the kit's caller contract provides, and nothing else; the kit checks the tool set from each session's start report. Retrieval from a forked reviewer worked in the layout caller's proof (four retrievals in its design-loop run and seven in its pre-order run, none failed); the schematic review leans on datasheets far more, so the proof run records the retrievals per unit and any that failed.
  - The review folder for a committed schematic holds what the step gives a reviewer: the schematic and its project files, the netlist the first step exports, every record the step reads, the drawing of each sheet that the sheet-drawing command writes, which the drawing-convention item opens, the method, the hardware notes and the check's report, and nothing of the designer's reasoning. The method's own list of what the proof folder holds leaves the sheet drawings out; this solution amends it to name them.
  - The blind proof keeps its seeding as it is: a separate session that has not read the catalogue seeds a copy, writes the seed list apart and exports the netlist, and the review is run on that folder by sessions with no record of the seeds, in both forms, as the layout solution's proof does.
  - No single-reviewer run of the circuit review proof is recorded in a form the kit loads (its seed list and session records were kept outside the repository), so the proof runs the single form once through the kit on the mid-tier on the same seeded copy and records it as this review's baseline file.
  - The tests need no model and no KiCad, using the kit's stub over synthetic folders, netlists and unit results.

  Out of scope: the layout, critical-routing and production-files solutions; the kit's mechanics; the content of the circuit catalogue.
