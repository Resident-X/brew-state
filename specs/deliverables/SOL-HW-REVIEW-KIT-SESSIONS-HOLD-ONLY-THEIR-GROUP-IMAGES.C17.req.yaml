type: criterion
title: Replicas of a group read its root and are counted once in the total of tokens written
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Over a synthetic declaration, replicas of a group are each started from that group's root, and the plan's total of tokens written counts the root once for the group and not once per replica. Out of scope: the replicas' prompts.
