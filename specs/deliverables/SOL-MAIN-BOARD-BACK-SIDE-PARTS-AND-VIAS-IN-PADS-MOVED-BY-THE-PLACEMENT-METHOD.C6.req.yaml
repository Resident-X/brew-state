id: SOL-MAIN-BOARD-BACK-SIDE-PARTS-AND-VIAS-IN-PADS-MOVED-BY-THE-PLACEMENT-METHOD.C6
type: criterion
title: The BAT54SW,115 sheet holds every figure the records use for D502 and D506 at least as good as the BAT54S figures
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  The maker's sheet for the swapped part (https://www.lcsc.com/datasheet/lcsc_datasheet_2407241045_Nexperia-BAT54SW-115_C78606.pdf, fetched by curl and read with pdftotext) is read, and each figure the records use for D502 and D506 is compared with the sheet's figure for the BAT54SW,115 with the arithmetic shown in the evidence: reverse leakage against the 2 uA at 25 V and 25 degC that the error budget's 0.56 degC clamp-leakage term and the front-end proof script use; forward voltage against the 0.24 V at 0.1 mA and 0.32 V at 1 mA maxima that fit the thermistor clamp decks and the shorted-lead verdict rows; reverse voltage against the 30 V of the pin limits and the 0.75 derating share of 22.5 V; total power and forward current against the 250 mW, 200 mA and 0.4 mW fault stress of the derating rows; and diode capacitance against the 10 pF of the line-capacitance sum. Each figure of the swapped part is at least as good as the one used, or the record that uses it is re-derived with the sheet's figure and its margin shown to hold. The inspection fails on a sheet figure worse than the one a record uses with that record unchanged, and on a figure compared without the sheet's test condition. Out of scope: parts other than the BAT54SW,115, the pad-to-pin mapping (the swap criterion), and measurement on built boards.
