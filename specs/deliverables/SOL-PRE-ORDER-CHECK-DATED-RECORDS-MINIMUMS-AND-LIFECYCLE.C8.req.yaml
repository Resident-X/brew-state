id: SOL-PRE-ORDER-CHECK-DATED-RECORDS-MINIMUMS-AND-LIFECYCLE.C8
type: criterion
title: The recorded review baselines are keyed on the files the review reads, so a change to a file it does not read leaves them valid
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The recorded layout and production-files review baselines are keyed on the files the review reads of a design, taken from the list the review's seeding reads, and not on the git tree of the whole design folder, so a change to a file the review does not read, such as the catalogue extract or a record the check alone reads, leaves every recorded baseline valid, and a change to a file it reads changes the key. The stored keys are rewritten to the hash of those files as they stood when the recorded runs were made, so no run is repeated. Out of scope: re-recording any run, the keys of the schematic and critical-routing baselines, which are made over a seeded copy, and any change to a file the review reads.
