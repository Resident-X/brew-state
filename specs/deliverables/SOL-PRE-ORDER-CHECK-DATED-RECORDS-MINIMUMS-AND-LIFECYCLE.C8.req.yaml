id: SOL-PRE-ORDER-CHECK-DATED-RECORDS-MINIMUMS-AND-LIFECYCLE.C8
type: criterion
title: The recorded review baselines are keyed on the files the review reads, so a change to a file it does not read leaves them valid
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  The recorded layout and production-files review baselines are keyed on the files the review reads of a design, each review's key being over its own read list, the layout review's the design files its seeding gives a reviewer (KiCad files, library tables and its named records) and the production-files review's the design's KiCad files and library tables and its parts specification record, computed by one helper given the list, and not on the git tree of the whole design folder, so a change to a file the review does not read, such as the catalogue extract or a record the check alone reads, leaves every recorded baseline valid, and a change to a file it reads changes the key. The stored keys are rewritten to the hash of those files as the tree the stored key names holds them, so no run is repeated. Out of scope: re-recording any run, the keys of the schematic and critical-routing baselines, which are made over a seeded copy and will not match a fresh seeding of the amended designs, being re-recorded when those proofs next run, and any change to a file the review reads.
