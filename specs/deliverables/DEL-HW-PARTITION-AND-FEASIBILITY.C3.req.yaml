id: DEL-HW-PARTITION-AND-FEASIBILITY.C3
type: criterion
title: The separation basis is declared and signed for before layout
status: active
version: 1
measurement_type: binary
verification: inspection
closes_by: cascade
text: |
  The basis states the distances and barriers, the environment assumed, and who accepted it.

  The distances come from the tables of a named published standard, read with the working voltage, pollution degree and material group stated, and are expressed against the declared supply so an adopter on a different supply recomputes them rather than inherits them.
