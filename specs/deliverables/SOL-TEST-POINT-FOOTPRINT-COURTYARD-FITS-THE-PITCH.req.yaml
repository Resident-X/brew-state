attributes:
  deprecation_reason: 'Premise wrong: no tracked footprint has the defect. The main board''s 96 test points use the stock TestPoint:TestPoint_Pad_D1.5mm and fail the test-point courtyard rule at 2.5 mm pitch; the fix is a board-design hygiene step (swap to a small test-point footprint in the board''s own library), covered by SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT and its pre-order check, not by a library-footprint solution.'
