id: SOL-TEST-POINT-FOOTPRINT-COURTYARD-FITS-THE-PITCH
type: deliverable
category: solution
title: The test-point footprint's courtyard is narrow enough that test points at the method's pitch pass the courtyard-distance rule
status: deprecated
version: 1
text: |
  Gives the test-point footprint a courtyard 1.5 mm across, centred on its pad, so that test points set 2.5 mm apart pass the courtyard-distance rule of the layout practice (TEST-5) while the rule keeps measuring a test point against every other footprint, as the method states. The method sets test points at least 2.5 mm apart centre to centre and requires a test pad to stand at least 1.0 mm from the courtyard of any other part. The pad is 1.0 mm across, so at the 2.5 mm pitch a neighbour's courtyard edge, 2.5 − 0.75 = 1.75 mm from the pad's centre, leaves 1.75 − 0.5 = 1.25 mm to the pad's copper against the 1.0 mm required. A courtyard wider than 2.0 mm across would leave less than 1.0 mm and fail the rule at that pitch.

  Settled for the build:
  - Only the library footprint changes: its courtyard on the side it is placed, the other side's layer drawn alike if the footprint is two-sided. Placement, the rule, its figure and the method text are out of scope and unchanged; a test point is still a part whose designator begins TP, and the rule still skips none of the other footprints.
  - The footprint is the one the boards draw their test points from, in the footprint library their design uses. The throwaway proof design that exercises the rule has its own copy, which this leaf also changes so the rule's test and seeded fault run against the same courtyard.
  - The footprint's description records the courtyard figure and the arithmetic above, so a reader changing it finds the pitch it serves.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of the catalogue: every board is judged against every applicable item and can pass it. The method sets test points 2.5 mm apart and the rule keeps each test pad 1.0 mm from every other part's courtyard, and a footprint whose courtyard is wide enough to put a neighbouring test point inside that distance makes the two items impossible to meet together. The footprint is corrected, not the rule.
