id: DEL-CONTROLLER-HARDWARE
type: deliverable
category: epic
title: The replacement controller boards are built from designs proven before they are ordered
status: active
level: epic
version: 5
text: |
  The machine's control electronics are replaced by boards designed for this project and made to order by a manufacturer that also assembles them, rather than hand-wired around a bought controller module. The work runs in a fixed order. First the constraints the boards must meet are fixed with their sources: what this graph requires, what the machine as found imposes — the enclosure the controller lives in, the harnesses that stay and the connectors they end in — and what the manufacturer can make, stock and charge. Then the boards are shown to be feasible against those constraints, including how the circuitry divides between them, before any detailed design. The interval within which loss of the controller's proof of life must remove heater power is derived from the held casting peak before the interlock's timing is designed, and it waits on the corrected control, not on the partition. Each design is proven against the design record before it is ordered, the mains-to-low-voltage separation rests on a basis a person has signed for, the boards are brought up on the bench before mains is connected, and sensing accuracy is measured with the loads switching. The result is reproducible by someone else from the repository.

  The boards hold every load off whenever the controller is not running, and they carry the interlock that makes heater power depend on the controller demonstrably running. They reserve spare capacity for the kinds of channel the machine is expected to gain, such as a further valve or more temperature and pressure sensing, wherever that costs no other criterion.

  Each board's schematic is reviewed, every net and every part of it, against a written checklist drawn from published circuit practice before layout begins, because the checks a board passes cannot see whether a pin is driven beyond its limits or a part lacks the companions its maker requires.

  Each board is laid out to published layout practice, planned in before any part is placed, and each layout is reviewed against a written checklist drawn from that practice, on rendered views of every layer and every critical net, before it is ordered, because the checks a board passes cannot see whether it is laid out well.

  Each board's schematic is drawn to a written convention before its review begins, so that someone who did not draw it can open it, find each function's circuit on a sheet named for it and follow a net between sheets by its name, because a schematic that is correct but cannot be followed is not part of a build path someone else can take.
rationale: |
  No node owned the controller hardware: the graph specified channels and selected parts, but nothing required that the boards carrying them be designed, checked, built or brought up in any particular way, so each of those was decided in conversation and recorded nowhere durable.

  Designing boards rather than wiring modules together is what makes the build reproducible: a design and its parts list can be reordered by anyone, a hand-wired carrier cannot. It also puts the grounding and layout of the sensing front end under the project's control rather than inherited from a module.

  The order is the point. A constraint found during layout sends the layout back to its start, so constraints are fixed first and feasibility is shown before detail. A board is paid for before it is tested, so the design is proven against the record before ordering, and a check that can be passed by judging a failure unimportant is not a check. A trial on a throwaway board, recorded in DEC-BOARD-TOOLCHAIN-KICAD-KONNECT, showed a router reporting no violations while the board's own rule check found many, so the proof is the board's own checks, not a tool's report of its own success.
