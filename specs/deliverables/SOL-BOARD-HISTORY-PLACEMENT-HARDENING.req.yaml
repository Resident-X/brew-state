id: SOL-BOARD-HISTORY-PLACEMENT-HARDENING
type: deliverable
category: solution
title: The placement history check fails the orderings a final review found it passing
status: active
version: 2
text: |
  Why this exists. The placement checkpoints put the order of a board's placement and critical routing records into a command that reads the repository's history and fails on every ordering those records forbid. After its review loop closed, a final blind review found three more ways a producer can satisfy the command without keeping the order the method asks for, and two places where the method's text leaves a designer to guess. Two candidate placements are told apart by the bytes of the board file, so one placement saved twice, differing only in a text label or an identifier, passes as two. Each candidate is measured against the floorplan as the placement section's judged commit holds it, but that floorplan is never compared with the one the planning step judged before placement, so widening a region in the commit that records the section lets a part outside its region pass. The first copper the command looks for is a track, arc or via, so a board whose first copper is a hand-drawn pour can have its placement section recorded after copper went down. The planning step requires every part on the schematic to be listed in a floorplan region, while the placement command stops on a listed part that is not on the board, so a part the schematic keeps off the board cannot satisfy both. And the routing step's instruction to repeat from step 2 after a failed compare, before any router commit, does not say that the first pass is rewritten then rather than a second appended, which the command fails.

  What it does. Tells candidates apart by their placements, holds the floorplan a section is judged against to the floorplan the planning step judged, counts a copper pour as first copper, settles the two method wordings, and brings every statement of the changed behaviour into agreement with the command.

  Settled decisions.
  - Candidates are the same placement when their parts agree exactly on reference, position, angle and side, as the existing parts comparison already measures them; no tolerance is added, and a differing set of references makes them distinct.
  - The plan is judged in the commit before the first commit whose board holds a footprint, the commit the method and the layout practice catalogue both name. The anchor comes from history alone and never from the producer's own placement section. The command fails when that commit is the root, is a merge, or is one of several first appearances on separate lines of history, and when no plan is readable there, which is a planning failure and not an unreadable-history stop.
  - The compare covers the region rows, each region's bounds and each region's parts set. The only allowed difference is a reference appended to a region's parts, with no bound changed and no reference removed or moved between regions; the commit that first lists an added reference must be a strict ancestor of the first commit whose board holds that footprint. Candidates are measured against the plan as the section is judged with the added references removed that the candidate's board does not hold, so a part added after placement started neither fails the earlier candidates nor stops the measuring; the chosen candidate must still equal the first-track board, so a part added and placed after the choice still fails.
  - A zone counts as first copper unless it is a rule area, a zone carrying a keepout, which carries no net and is not copper; an unfilled outline counts. Only the first-copper test changes: the set of copper kinds shared with the first-pass check and with the search for the router's commit is not widened, since that would misread an unlocked non-critical pour as the router's commit.
  - A schematic symbol marked excluded from the board is absent from the netlist in the schematic tool's native format, which is the source the planning cross-checks use (shown on a copy of a repository schematic with the export tool). It is therefore not a part for the floorplan and is listed in no region; listing it fails the existing second cross-check. The method's loose wording of every part on the schematic is replaced by every part in the schematic's netlist, and no new listing line or check is added.
  - The routing rule holds for any pass: only the last pass may lack a router commit, so after a failed compare the pass with no router commit is rewritten in place and a further pass is not appended.

  Locus. The history tool in hardware/tools (board_history.py: the distinct-candidates comparison, the first-copper search, the plan compare and the module description), the hardware tools' guide and the hw:history task description in the Taskfile, and docs/board-design-method.md (the floorplan parts bullet, the plan's cross-check and amendment sentence, step 6's description of the command, and the routing repeat instruction). Existing test pins on the method wording and check labels are kept; every history test fixture gains a plan-only commit before the first placement. Existing capability: the command is extended, no new command or seam is created; the parts comparison, the first-copper search and the plan reader are reused.

  Out of scope: judging whether a recorded verdict is right.
