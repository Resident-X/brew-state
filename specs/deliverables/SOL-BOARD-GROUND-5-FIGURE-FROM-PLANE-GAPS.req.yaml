id: SOL-BOARD-GROUND-5-FIGURE-FROM-PLANE-GAPS
type: deliverable
category: solution
title: The GROUND-5 plated-hole spacing figure is derived from the gaps opened in the ground plane, not from a mains pour
status: active
version: 2
text: |
  Why this exists. The practice catalogue's item GROUND-5 gives the figure for its custom plated-hole spacing rule as twice the widest annulus, plus twice the larger of the ground zones' thermal-relief gap and the largest clearance any net class or zone of the board states, plus the zone's minimum thickness. On a board that carries mains copper pours with a 3 mm clearance, the largest-clearance term is the mains zone's, so the figure for the review-proof design comes to 7.8 mm (1.30 + 2 x 3 + 0.5), a spacing no connector at a 2.5 mm pitch can meet. Rings merge only between pins whose own gaps are opened in a ground plane: a ground pin's thermal-relief gap, or the clearance of the ground plane's own zone around another pin. A mains pour is not a ground plane, so its clearance does not enter. The review-proof layout review closed finding 9.4 (rounds 9 to 11) as "does not apply" because the rule as figured cannot be met, and its actual ring-merge analysis found one merging pair, connector J2 pads 1 and 2, needing 0.95 mm against 0.80 mm available (before commit 2102a19 set the ground planes' thermal-relief gap to 0.25 mm; the pair now needs 0.70 mm). An item that cannot be met on a board it applies to is closed by waiver and no longer finds the defect it was written for. The item was added by SOL-BOARD-LAYOUT-WORKMANSHIP-ITEMS from the method-proof layout review, round 1, finding 1.1.

  What it does. Restates the item's figure in docs/board-design-method.md so it is derived from the gaps the pins open in the plane the rings merge in: the ground zones' clearance and thermal-relief gap, and the clearance a net class states for a pin's net where that governs the gap in the plane, and not from a pour that is not a ground plane. The item's existing reading of a pad that is not round stays.

  Settled before build.

  - Both the annulus term and the gap terms are taken over the plated pins that open a gap in a ground plane: a pin whose pad lies within the outline of a ground-net zone on a layer where that zone is filled. A pin outside every ground plane's outline enters neither term, so mains connectors in a mains region do not inflate the figure. Taking the gap terms from the plane but the annulus from the whole board would leave the review-proof figure at 2.05 mm, still above the 1.50 mm its closed design keeps between hole edges, so the item would stay unmeetable.
  - A pin's gap in the plane is the ground zones' thermal-relief gap for a ground pin. For any other pin it is the greatest of the ground zone's clearance, the clearance of the net class of the pin's net, and the clearance any rule of the board's rules file states for that pin in that plane, since KiCad takes the greatest of them. A mains pour's clearance enters only when a mains pin itself lies in the ground plane.
  - A board with no plated pin in a ground plane has no figure; its rules table states the item as none for that reason and the rule is not needed.
  - The rule keeps its condition on every pair of plated pads. The figure is the least spacing at which rings in a plane cannot merge, and a pair outside every plane that stands closer is held to it as a margin.
  - The change is to the item's prose in docs/board-design-method.md only. No pre-order check code computes the figure; the check reports KiCad's hole_to_hole result against the figure the rules file holds.
  - Worked on the proof designs from their files: review-proof has four plated pins in a ground plane (J2 pads 1 and 2, J4 pads 1 and 2), each 1.7 mm wide across the pitch with a 1.0 mm drill, annulus 0.35 mm, the ground pin J2 pad 2 opening the 0.25 mm relief gap and the others 0.2 mm, zone minimum thickness 0.25 mm: 2 x 0.35 + 2 x 0.25 + 0.25 = 1.45 mm, against 1.50 mm between the hole edges of the closest in-plane pairs. method-proof's in-plane pins give 2 x 0.375 + 2 x 0.25 + 0.2 = 1.45 mm, the figure its rules file already holds. gate-proof has no ground plane, so no figure.

  Out of scope: moving copper on any proof design, and every other catalogue item.
