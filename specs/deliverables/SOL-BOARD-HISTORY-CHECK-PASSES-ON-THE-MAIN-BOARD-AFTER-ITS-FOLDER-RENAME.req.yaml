id: SOL-BOARD-HISTORY-CHECK-PASSES-ON-THE-MAIN-BOARD-AFTER-ITS-FOLDER-RENAME
type: deliverable
category: solution
title: The placement history check passes on the main board its folder rename left it failing, and is run where a regression is caught
status: active
version: 2
text: |
  Why this exists. The placement and critical routing history command exists so that the order the method requires of a board's placement and routing records is judged by running it. It is run by neither the build round's gate nor the nightly complete verification, so nothing noticed when it stopped passing on the main board. Run on the committed main board in plain and in routed mode against the repository's present history it fails four of its checks, 4 of 25, from five causes.
  1. The placement section check fails because the command takes an earlier design's commit, one that holds a board at the folder name the present board later reused, as this board's first copper; the earlier design's commits are on the branch's line of history, but the present board's placement section was written later, under the folder name the board had while it was called v2.
  2. The first routing pass's board-judged check and
  3. its before-router check fail because the commits that pass cites hold the board under that earlier folder name, which a later commit renamed (DEC-BOARD-VERSION-NAMING-V2-WORKING-NAME), and the command reads each cited commit only at the board's present path.
  4. The first routing pass's verdict check fails because the command, when it cannot find the router commit, reads the pass's checklist from today's practice catalogue, which holds an item added after the pass was recorded. Probed with renames followed, this one clears.
  5. The first routing pass's before-router check also fails for a reason that following renames does not clear: pass 1 was edited after its router ran. Commit 0de500cb (2026-11-17) changed the Views command's folder from main-board-v2 to main-board (the rename commit 0302d32a) and changed the BOARD-22 row's via count from 320 to 541, so the pass in the repository differs from the pass as it stood in the commit before the router's. Probed with renames followed and the plan path mapped, the command reports 22 checks, 21 passing, the one failure being this check.
  The decision that records the folder rename says the earlier design never reached the main branch; git shows it reached main in #247 (a84205c6, 2026-11-07), a fact the command's rule below does not depend on.

  Counts. The correct count after the fix is the number the command reports: 22 checks in each mode on the main board. The earlier 25 was counted while the command had fallen back to an earlier design's four candidates. The two sibling criteria that state "22 checks in each" (the mains-side re-laying solution's C9 and the optocoupler footprint solution's C5) are therefore right as they stand and are not amended by this solution; the main board's low-voltage copper solution's routed-mode criterion states no count.

  What it does. Judges a board's history from the commit that first holds that board, including under an earlier folder name, so a rename is followed and an earlier design that reused the folder name is not that board's history. Reads a pass's checklist as the practice catalogue stood when the pass's router ran, so an item added later does not fail an earlier pass while an item missing at that time still does. Treats a pass that differs from its state before the router only by the board's folder name at the judged commit, replaced by the board's present folder name, as unchanged. Runs the command where a regression in it, or in the records it judges, is caught again. Nothing in the repository's history is rewritten.

  Settled for the build (owner decisions of 2026-11-28 and the readiness pass).
  - Where a board's history starts. The board is the chain of paths from the head commit's board path backward through renames git detects at its default similarity, judged per commit against each parent, the rename destination being the current path. The board's history begins at the commit where the chain's file is added; commits before it, and any commit off the chain, hold no board. A commit whose parents give conflicting board paths is a fault of the same kind as the command's existing two-lines-of-history faults. A deletion and an addition at the same path in one commit is the same board, an in-place replacement. The plan's path at a commit is the board's folder at that commit plus layout-plan.md; the plan's own renames are never followed, because the plan was renamed from the earlier design's folder while the board was added anew, and following the plan would pull the earlier design back in. Rejected: `git log --follow`, which follows one linear path and mishandles merges; and translating the path at each call site, which misses callers.
  - Placement. hardware/tools/board_history.py: the History class gains a per-commit board path, which `judge` supplies, and every read of the board or the plan in first_track, first_placement, first_commits, judge_placement, judge_critical and judge_verdicts goes through that one mapping, extending the existing seam. The exact git call strategy (one `git log -M --name-status` over the board's paths, or one call per commit) is the build's.
  - The folder-name rule is an exact string substitution of the board's folder name at the judged commit by its present folder name in the pass's text, so the Views command still names a real folder. No tolerance for numbers and no signed exception are added to the command.
  - The BOARD-22 row of pass 1 in hardware/sunbeam-em7000/main-board/layout-plan.md is restored by a new commit, not a rewrite, to the text it held when the pass was judged, "Of the 320 vias none lies inside a surface-mount pad, read from the pad outlines in the board file.", the row otherwise as 0de500cb changed it. That records only that the plan equals what was written when the router ran; it does not assert that 320 is the board's true count, and the final board's via count is not restated in the plan.
  - C4 is already met in the code when the router commit is found (the pass is read at the router's parent); it failed on the board only because the board-path failure left the router unfound, so C4 needs tests and no new code.
  - Which boards the nightly runs it on: every tracked layout-plan.md holding a `## Placement` heading, found from tracked files so that a new board joins on its own. Today these are heater-wall-board, main-board and method-proof; review-proof has no such section and is not one. The nightly job's checkout carries full history (fetch-depth 0), with the action's commit pin kept.
  - C1 is verified by running the command on the real board in each mode (about 80 seconds per mode) and recording it in the nightly run's record. It is not a test in hw:test:round, because the command refuses when the working tree differs from the last commit, which a round's tree may.

  Files the build touches: hardware/tools/board_history.py; hardware/tools/tests/test_board_history_critical.py, test_board_history_placement.py, test_board_history_plan.py and board_history_fixtures.py (which gains a rename helper); hardware/sunbeam-em7000/main-board/layout-plan.md (the BOARD-22 restore); Taskfile.yml (a task running the command over the boards above, added to the complete verification's gate list, and the descriptions of fw:verify, check:round and hw:history); .github/workflows/nightly-verify.yml (fetch-depth); firmware/tools/tests/test_verify_gate.py if it pins the gate list; CLAUDE.md and hardware/README.md, where they say that the nightly runs the command and the build round's gate does not.

  Out of scope: judging whether a recorded verdict is right.
rationale: |
  Defect in already-sealed work: the behaviour SOL-BOARD-LAYOUT-PLACEMENT-CHECKPOINTS.C6 requires, one command judging the order of the placement and critical routing records against the repository's history, holds on its throwaway repositories but not on the board it exists for, because the main board's folder was renamed and an earlier design had used the folder name now carried by this board. The spec was right; the behaviour needs correcting. Placed under the maintenance lane as the lane's rules require, tracing to the requirement criterion the behaviour restores. Verified by running the command in both modes on the committed main board.
