id: DEL-DELIVERY-PROFILE-SEGMENTS.C2
type: criterion
title: A segment ends on its own stated exit condition, in a quantity the machine measures as the delivery proceeds
status: active
version: 2
measurement_type: binary
verification: test
closes_by: cascade
text: |
  The exit condition is one of elapsed time, delivered volume, delivered weight where weight is measured, or a pressure or flow threshold, and is evaluated while the segment runs. A segment whose exit condition names a quantity the machine does not measure is refused before the delivery begins.
