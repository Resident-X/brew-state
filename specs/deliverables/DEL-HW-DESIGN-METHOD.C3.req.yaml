id: DEL-HW-DESIGN-METHOD.C3
type: criterion
title: Each layout is reviewed against a written checklist using rendered views of every layer and every critical net, with findings recorded and resolved
status: active
version: 2
measurement_type: binary
verification: inspection
closes_by: cascade
text: |
  The checklist is drawn from the method's layout practice catalogue and written before the layout it reviews, and a finding is closed by a change to the board or by a recorded reason showing the item is met, does not apply, or is overridden by a named requirement it must also meet, never by judging it unimportant. The views show which copper belongs to which critical net, since an image of a layer alone cannot show a ground drawn as a thin trace.
links:
