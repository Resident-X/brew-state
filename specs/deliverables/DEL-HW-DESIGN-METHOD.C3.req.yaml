id: DEL-HW-DESIGN-METHOD.C3
type: criterion
title: Each layout is reviewed against a written checklist using rendered views of every layer and every critical net, with findings recorded and resolved
status: active
version: 2
measurement_type: binary
verification: inspection
closes_by: cascade
text: |
  The checklist is written before the layout it reviews, and a finding is closed by a change to the board or a recorded reason it stands. The views show which copper belongs to which critical net, since an image of a layer alone cannot show a ground drawn as a thin trace.
