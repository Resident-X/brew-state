text: |-
  The case's checks hold at the least plate height that keeps the case inside the plate's footprint and at the greatest height the unit's opening in the plastic wall admits, with the lower edge unchanged, and the case record states both heights and the standard bar sizes between them. Out of scope: the owner's wall cut.
