id: DEL-SIM-SEAMS-HARNESS
type: deliverable
category: epic
title: Seams, the plant description, and the host verification tier
status: active
level: epic
version: 2
text: |
  The control logic reaches hardware only through a named interface, and the plant structure sits behind its own named interface with plant parameters carried as data. A structure behind that interface says what it is: which of the machine's actuation channels it answers, and whether any hardware has verified it. The reference machine's plant description is populated behind that seam, and the host verification tier exercises the whole under memory and undefined-behaviour analysis with the target absent entirely.
rationale: |
  This is the thinnest end-to-end path through the software track — a plant description, a control loop, and something that runs both — and every later unit of phase-one work is exercised through it. Pairing the seams with the host tier is deliberate: a harness with nothing to run proves nothing, and control logic with no harness cannot be shown separable from the hardware it drives.

  The plant description belongs here rather than being left implicit. Everything downstream in this phase reasons against it — the estimator reconstructs states it defines, the loops are demonstrated against it, the dominance ranking analyses it — and until it exists with the origin of each value recorded, the phase rests on an artefact nothing produced.

  Two things a structure has to say about itself are answered here rather than later: which actuation channels it answers, and whether hardware has verified it. Both only become visible once a second architecture exists. A single structure that answers every channel hides the first, and a single unverified structure describing the project's own machine makes the second look like a documentation note rather than a property an adopter depends on. Neither changes the shape of the seam; both are claims a structure has always had to make and nothing had asked it for.

  The host tier is the memory and undefined-behaviour net, and it is not optional given the language the firmware is written in. Emulation is a separate unit of work rather than part of this one, because it needs nothing here beyond the seams and would otherwise gate every other node in the phase behind the heaviest piece of infrastructure in it. Measuring worst-case timing is not in this phase at all — it needs a board.
