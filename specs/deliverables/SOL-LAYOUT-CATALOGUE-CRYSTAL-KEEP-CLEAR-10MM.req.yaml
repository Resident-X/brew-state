id: SOL-LAYOUT-CATALOGUE-CRYSTAL-KEEP-CLEAR-10MM
type: deliverable
category: solution
title: The catalogue holds parts unrelated to the oscillator 10 mm from the crystal, not 25 mm, and the board check, tests and proof design agree
status: active
version: 1
text: |
  The layout practice catalogue's CLOCK-3 and CLOCK-4 hold every part unrelated to the oscillator 25 mm from the crystal's courtyard. The owner has ruled the figure is lowered to 10 mm. The 25 mm is the one-inch figure of the cited source, already called conservative for the 8 MHz and 32.768 kHz crystals the boards use. What protects such a crystal is close load capacitors, short tracks, ground beneath it and no digital track beside it, and each of those has its own catalogue item; the wide empty zone adds little to them and costs board area on a compact controller board. The definition of a part related to the oscillator is unchanged.

  Approach: the figure falls from 25 mm to 10 mm in the method's CLOCK-3 and CLOCK-4 (CLOCK-3's Passes and Fails text; CLOCK-4's heading, Asks, Passes, Fails and rule block `min`, and its sentence naming CLOCK-3's figure), in the board check's floor constant, in the check's messages and in the README's description of the check, and CLOCK-3's Source records that the owner lowered the figure and why. The check keeps its form: a rule at or above the floor passes and a rule below it fails. Tests and the seeded-fault harness that restate 25 follow the new floor.

  Settled before build: these change. docs/board-design-method.md, CLOCK-3 and CLOCK-4 (the figure in every clause, and CLOCK-3's Source). hardware/tools/board_check.py, the KEEP_CLEAR_MM constant (25.0 to 10.0); its messages read the constant and need no other edit. hardware/README.md, the crystal_keepclear row of the check table (:546) and the paragraph after the table (:562) that says the rule's constraint is `courtyard_clearance` at 25 mm or more; both become 10 mm. In hardware/tools/tests/test_board_check.py, the class docstring (about :3773) that says the rule keeps unrelated parts 25 mm from the courtyard, and the crystal keep-clear fixture rule and its passing figure (25mm, with 30.5mm kept as a figure above the floor), the below-floor case (24.9mm becomes 9.9mm, with the message text asserted at 10 mm), and the no-unit case. In hardware/tools/board_prove.py the one seeded rule (the exempt-everything rule, about :825) is written with 25mm and becomes 10mm; the check fails it for exempting every other part whatever its figure, so the seed does not depend on the floor, and no seed in the file is figure-dependent. In hardware/tools/tests/test_crystal_keep_clear_agreement.py the test whose name embeds 25 mm and which quotes "Every other part keeps the 25 mm" carries a trace comment to the sealed sibling SOL-LAYOUT-CATALOGUE-CRYSTAL-RELATED-PARTS.C1; in the build it is renamed, quotes the 10 mm text and is re-traced to this solution's criteria. That sibling's sealed text 'keep 25 mm' was true when delivered, and the figure moves here by the owner's ruling; the sibling is neither edited nor superseded. These stay as committed. hardware/proof/review-proof/design-rules.md and review-proof.kicad_dru keep their 25 mm rule, because editing either invalidates the recorded layout-review baselines, which would force full blind review rounds for no change in what the proof proves. The check fails only a figure below the floor, so 25 mm still passes, and the proof board's parts were placed to it, so KiCad still reports no courtyards_overlap. The design-rules.md row (about :34) cites 'CLOCK-3's 25 mm (one inch), its source's "closer than 1 inch to the crystal"'; once CLOCK-3 states 10 mm that citation is stale text in a recorded proof design, which is accepted. Nothing parses the row's figure or citation: the agreement file reads only the row's exempt-reference set (the text after 'exempting') and its kind words (after 'related to the oscillator:'), and takes the proof's figure from the rules file review-proof.kicad_dru, so C3's test does not depend on the stale citation. The recorded layout-review.md and layout-plan.md of the proof design, the replayed review answers and streams under hardware/tools/tests/fixtures, and the method-proof design (which has no crystal) stay as committed: they are records of past reviews or of a design with no crystal, and no test compares them with the method's figure. No other crystal board exists yet to carry a rules file. No graph node other than the delivered SOL-LAYOUT-CATALOGUE-CRYSTAL-RELATED-PARTS records the figure, and its statement that the 25 mm stays was true when delivered, so it is left as delivered.

  The test that holds the method, the check and the proof together: a test in the agreement file, needing no board-design program, reads the figure from CLOCK-3 and from CLOCK-4 and the check's constant and fails when the three differ, and reads the proof rules file's figure and fails when it is below that floor. The test file contains no figure of its own for the floor. The catalogue's 10 mm floor is the only machine-checked distance; keeping switching and supply parts away from a crystal is left to the layout review's judgement, and no further distance is set, since the measured placement has no switching part nearer than 12 mm to either bare crystal and the supply module is 17.5 mm away.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of the catalogue: every board is judged against every applicable item and can pass it. An item sized to a one-inch rule of thumb written for generic oscillators overstates the practice for these crystals and fixes board area for no protection the other items do not already give, so the figure is amended at its definition rather than waived board by board. Leaving the proof design at 25 mm keeps the recorded baselines valid, and the check's floor lets it pass.
