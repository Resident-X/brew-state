id: SOL-LAYOUT-CATALOGUE-CRYSTAL-KEEP-CLEAR-10MM
type: deliverable
category: solution
title: The catalogue holds parts unrelated to the oscillator 10 mm from the crystal, not 25 mm, and the board check, tests and proof design agree
status: active
version: 1
text: |
  The layout practice catalogue's CLOCK-3 and CLOCK-4 hold every part unrelated to the oscillator 25 mm from the crystal's courtyard. The owner has ruled the figure is lowered to 10 mm. The 25 mm is the one-inch figure of the cited source, already called conservative for the 8 MHz and 32.768 kHz crystals the boards use. What protects such a crystal is close load capacitors, short tracks, ground beneath it and no digital track beside it, and each of those has its own catalogue item; the wide empty zone adds little to them and costs board area on a compact controller board. The definition of a part related to the oscillator is unchanged.

  Approach: the figure falls from 25 mm to 10 mm in the method's CLOCK-3 and CLOCK-4 (their Passes, Fails and Asks text, the rule block's `min` and CLOCK-3's measure from body to body), in the board check's floor constant, in the check's messages and in the README's description of the check, and CLOCK-3's Source records that the owner lowered the figure and why. The check keeps its form: a rule at or above the floor passes and a rule below it fails. Tests and the seeded-fault harness that restate 25 follow the new floor.

  Settled before build: these change. docs/board-design-method.md, CLOCK-3 and CLOCK-4 (the figure in every clause, and CLOCK-3's Source). hardware/tools/board_check.py, the KEEP_CLEAR_MM constant (25.0 to 10.0); its messages read the constant and need no other edit. hardware/README.md, the crystal_keepclear row of the check table (at 25 mm or more becomes at 10 mm or more). In hardware/tools/tests/test_board_check.py the crystal keep-clear fixture rule and its passing figure (25mm, with 30.5mm kept as a figure above the floor), the below-floor case (24.9mm becomes 9.9mm, with the message text asserted at 10 mm), and the no-unit case. In hardware/tools/board_prove.py the seeded rule written with 25mm becomes 10mm, so it stays a rule at the floor. In hardware/tools/tests/test_crystal_keep_clear_agreement.py the tests that quote "Every other part keeps the 25 mm" now quote the 10 mm text. These stay as committed. hardware/proof/review-proof/design-rules.md and review-proof.kicad_dru keep their 25 mm rule: a rule above the floor passes the check unchanged, the proof board's parts were placed to it so KiCad still reports no courtyards_overlap, and editing either invalidates the recorded layout-review baselines, which would force full blind review rounds for no change in what the proof proves. The proof's row names 25 mm as its figure and the method as its source; the row is a recorded figure above the floor, not a restatement of the floor. The recorded layout-review.md and layout-plan.md of the proof design, the replayed review answers and streams under hardware/tools/tests/fixtures, and the method-proof design (which has no crystal) stay as committed: they are records of past reviews or of a design with no crystal, and no test compares them with the method's figure. No other crystal board exists yet to carry a rules file. No graph node other than the delivered SOL-LAYOUT-CATALOGUE-CRYSTAL-RELATED-PARTS records the figure, and its statement that the 25 mm stays was true when delivered, so it is left as delivered.

  The test that holds the method, the check and the proof together: a test in the agreement file, needing no board-design program, reads the figure from CLOCK-3 and from CLOCK-4 and the check's constant and fails when the three differ, and reads the proof rules file's figure and fails when it is below that floor. The test file contains no figure of its own for the floor.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of the catalogue: every board is judged against every applicable item and can pass it. An item sized to a one-inch rule of thumb written for generic oscillators overstates the practice for these crystals and fixes board area for no protection the other items do not already give, so the figure is amended at its definition rather than waived board by board. Leaving the proof design at 25 mm keeps the recorded baselines valid, and the check's floor lets it pass.
