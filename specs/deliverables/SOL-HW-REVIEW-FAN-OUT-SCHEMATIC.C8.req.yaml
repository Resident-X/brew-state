id: SOL-HW-REVIEW-FAN-OUT-SCHEMATIC.C8
type: criterion
title: The proof command refuses unsafe or malformed inputs and records a single run as a baseline only once for a key
status: active
version: 3
measurement_type: binary
verification: test
text: |
  Over the kit's stub and synthetic folders, the proof command `task hw:schematic-review-proof` refuses a work folder inside the repository, a file or non-empty; a bound below 1 or an empty model; a seeded repository that is missing, not a git work tree with a commit, inside this repository or the work folder, dirty, or lacking the design; a seed list that is missing, unreadable, empty or malformed, has an id twice, names an item not in the catalogue, or lies inside this repository, the seeded repository or the work folder; a copy the pre-order check fails; and an unreadable baselines file. It never adds to a baselines file already holding the key, and a failed single session leaves no baseline written. It also checks the command's other behaviour. The single form is one session holding every item, with no replica and one fork, merged by the caller's own rules and written as a baseline file the kit loads; a verdict the caller names as a fail stands in the run's merged verdicts. A finding names a seed by its Item cell, and the merged round's Raised by cells are read with or without the round heading. The review folder is written by the folder command from the seeded commit with the netlist and the sheets, no folder from its parent up to the work folder holds anything else, and the check runs on the seeded copy with a report naming no path outside it and the round's records those of the committed method. A check that cannot run, a copy the check refuses, a failing export or drawing, or a missing agent command line stops the command with a cannot run before any session. The dry mode prints the plan, the group and fork counts and the predicted cost and time beside the bounds, takes the bounds from the prediction when no single run is recorded, warns when the prediction is over a bound or within a tenth of it, and starts no session. The proof record is written in text and in JSON with the same content: each run's seeds found, wall time, cost, findings matching no seed, sessions with their figures, retrievals and those that failed, calls refused for a rate limit, and the verdict differences between the forms, naming a seed no replica reported and the replicas that raised the others. The pooled criterion judges the fanned-out run, failing it, and the command exiting 1, when the seeds found fall below the floor, a seed every single run found is missed, the wall time exceeds half the single mean or the cost exceeds the stated multiple of the single mean, and requires a second fanned-out run when the first is within ten per cent of a bound. Out of scope: any live run, which the schematic proof solution holds.
