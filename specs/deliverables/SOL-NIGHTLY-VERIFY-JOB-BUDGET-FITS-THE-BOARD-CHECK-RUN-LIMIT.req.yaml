id: SOL-NIGHTLY-VERIFY-JOB-BUDGET-FITS-THE-BOARD-CHECK-RUN-LIMIT
type: deliverable
category: solution
title: The nightly gates job's time budget outlasts the board check's one-run limit so a hung KiCad run fails the design
status: active
version: 2
text: |
  The nightly verification's time budget is raised so that a hung KiCad run reaches the board check's own limit and fails the design by name, rather than the job being cancelled first. In .github/workflows/nightly-verify.yml the job `gates` runs `task fw:verify`, which includes the board gates (`hw:verify` and `hw:test:round`); both run KiCad several times, each run allowed up to KICAD_TIMEOUT_S in hardware/tools/board_check.py, 7200 s as built. The job's `timeout-minutes` is 120 as built, its comment citing only the emulation tier, so it equals the one-run limit: a truly hung run cannot reach its limit before the job is cancelled, the message "KiCad did not finish within 7200 s" never appears in the nightly, and the night shows cancelled instead of a named board failure.

  Settled for the build:
  - The smaller correct change is to raise the budget of the existing job, not to split the board gates into a job of their own. The gates are declared once in `task fw:verify` and the job runs that declaration so a gate added later runs without a line changing; a split would put a second list of gates in the workflow. The job's `timeout-minutes` is set to 240: the one-run limit of 120 minutes plus two hours for everything else the job does. The two hours is judged against the measurements on record, about twenty minutes for the emulation tier and a full main-board design check of about 50 minutes (hardware/README.md, beside the one-run limit); it has not been timed in a hosted nightly, and 240 minutes is under the hosted job maximum of 360 and meets the floor of 180.
  - The relationship is a floor: `timeout-minutes` must be at least KICAD_TIMEOUT_S / 60 plus 60. Neither figure is lowered; the one-run limit stays as the sibling solution set it.
  - The workflow comment beside `timeout-minutes` is rewritten to name the board gates and the one-run limit as well as the emulation tier, and states the floor. hardware/README.md, beside the one-run limit, states that the nightly job's budget is held above it by that floor, and that a larger limit needs a larger budget.
  - A test of the kind the repo already has for its workflows (alongside the nightly workflow tests in firmware/tools/tests) reads `timeout-minutes` of the `gates` job from the workflow file and KICAD_TIMEOUT_S from board_check.py and requires the floor. Raising the limit without the budget fails it, and so does lowering the budget. It runs without KiCad.
  - Locus and placement. The test is a new method on the class TheNightlyRunsTheSameDeclaration in firmware/tools/tests/test_verify_gate.py (line 340), which already finds the gates job's keys with workflow_declarations.find(text, "jobs", "gates", key) (used at line 590 for runs-on); that seam is reused, and a new test file is rejected. The floor sits in a small helper taking the workflow text and the board check's source text, returning whether the budget meets the floor; the test asserts it holds on the real files and fails on two altered texts, the limit raised (to 14400 s) with the budget unchanged, and the budget lowered below the floor, so the test is shown to fail and does not only read as if it would. The test reads KICAD_TIMEOUT_S by parsing hardware/tools/board_check.py with ast (already imported in that file) for the module-level integer assignment, and does not import board_check, because that file allows only the standard library and its listed local modules (line 724, TheVerificationNeedsOnlyTheStandardLibrary); board_check.py is under the host tier's reads, so the host closure still passes. The workflow edit is the timeout-minutes value and the comment at lines 61-64 of .github/workflows/nightly-verify.yml; the pinned action versions are untouched. The comment does not repeat the old twenty-to-thirty-minute figure as the full check time. hardware/README.md line 13 is where the one-run limit is stated, and the budget sentence goes beside it.
  - The budget is proven by the declaration test and not by a real nightly run: a dispatched nightly does not yet reach the board gates, which the nightly's KiCad installation owns, so the leaf does not depend on that work.

  Out of scope: speeding the board gates, the other jobs' budgets, the sweep workflow, and any change to the limit.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks, that every board is judged before it is ordered, in the nightly run. The raised one-run limit is only true if the job that runs the board gates outlasts it; at equal budgets a hung run cancels the job and the design is never reported as failing. The budget is corrected and the relationship is pinned so it cannot drift.
