id: SOL-PRE-ORDER-CHECK-DECOUPLING-PINTYPE-SKIPS-PART-WITH-NO-SUPPLY
type: deliverable
category: solution
title: The pre-order check does not refuse an optocoupler or opto-triac for lacking a supply pin when the catalogue extract's published category says the part has none
status: active
version: 1
text: |
  The decoupling rule finds a circuit's decoupling parts from the pads of the circuit that the layout file types power input or power output, and a pre-order rule, decoupling_pintype, refuses an orderable board whose integrated circuit has netted pads and none so typed, since the decoupling rule would measure nothing for it and the board would pass on that. The rule takes every footprint whose reference begins with U for an integrated circuit. An optocoupler or an opto-triac is referenced U and has no supply pin: its pads are an LED, a phototransistor or a triac output, and its symbol types none of them as a supply (the symbols for the MOC3052M and the LTV-814S carry only passive and no-connect pins, so typing a pad as a supply would state a supply the part does not have). The check therefore refuses each, and no change to the symbol's pin types can satisfy it. The main board's isolators U602, U701 and U711 are reported for this reason.

  Settled before build: nothing the rule reads says today which U parts have no supply, and the part kind does not tell them apart. part_kind in hardware/tools/board_check.py reads the reference's leading letters, so U602 is an integrated circuit there as it is here. The class key of the parts specification record is the derating class, and U602, U701 and U711 are all in the class integrated circuit with every real integrated circuit, so it cannot tell them apart either. The fact that does is the part's published category, which the manufacturer's catalogue states and the catalogue extract is the committed reading of. So the declaration goes in the extract, not on a position. An entry of catalogue-extract.yaml gains an optional key category, the manufacturer's published category text for the part copied verbatim from the parts-library record it cites, a non-empty string when present. It joins OPTIONAL_ENTRY_KEYS beside lifecycle, and a malformed category (an empty string, or a value that is not a string) fails the extract read naming the entry, as a malformed library_class does. board_check.py gains a closed constant of category strings for parts that have no supply pin, naming only two kinds: optocouplers with a triac or SCR output, and optocouplers with a phototransistor or photovoltaic output. Optocouplers with a gate-driver or logic output and digital isolators have supply pins and are not in it. The build reads the real category strings off the supplier pages for C108051 (the LTV-814S) and C899826 (the MOC3052SVM) and records them verbatim in the constant and in the main board's extract; the strings are not invented here, and if the two parts' published texts differ, each is listed as published.

  The rule changes in one place. untyped_circuits skips a U footprint only when the catalogue number of that footprint's position (the number placed_positions reads from the symbol's LCSC field, the source check_parts compares the record against) maps to an extract entry whose category is exactly one of the strings in the closed constant. A skipped part with any pad typed power input or power output still fails decoupling_pintype naming the position, because the layout contradicts the category. The skip fails closed, and the part is refused as before when: the extract cannot be read or is unusable, the extract being found by the nearest-folder rule as check_parts finds it; the position's lcsc is none; the number is absent from the extract; the entry has no category; or the category is outside the closed list. A real integrated circuit, such as a regulator or a gate-drive optocoupler, whose pads are netted and none typed power, is therefore still refused, so the defect the rule exists for is not silenced. No position key is added and POSITION_KEYS is unchanged, so no U position can declare itself exempt. A second guard already exists and is untouched: the method's DECOUPLE-6 (the rule-kind verdict, docs/board-design-method.md) makes a count in the report's decoupling paths measured line that falls short of the schematic's decoupling capacitors on integrated circuits a fail. Rejected: a supply: none key on a position of the parts specification (any U position could carry it, which silences exactly the defect the rule exists for, a real integrated circuit with untyped supply pads), a guard keyed on the record's class (it cannot tell an isolator from a regulator), keying part_kind on class (the same), and typing a supply pin on an optocoupler (false: the part has none).

  Placement: hardware/tools/board_check.py: OPTIONAL_ENTRY_KEYS and the extract reader (the Extract tuple carries the category by catalogue number beside stock and lifecycle), the closed constant, untyped_circuits and its caller in check_design, the docstring, and the violation message, which points at the category route (record the part's published category in the extract) and at typing the pads. hardware/README.md: the decoupling_pintype row of the checks table (about :551), the DECOUPLE-6 paragraph (about :375) and the catalogue-extract key list (the extract paragraph and the record-keys table row). docs/board-design-method.md: DECOUPLE-6 Passes, where the pin-type refusal is stated. hardware/tools/board_prove.py: a row near the existing decoupling_pintype seed (about :1532) for an in-list category on a part with a power-typed pad, and a second for a real integrated circuit whose extract entry has a category outside the list; both join the required-names dictionary in hardware/tools/tests/test_board_check_kicad_marks.py. Unit tests are in a new file, hardware/tools/tests/test_board_parts_category.py, beside test_board_parts.py, with synthetic references and LCSC numbers of the form C9000xxx. The main board's catalogue-extract.yaml gains category on C108051 and C899826 in the main-board leaf that depends on this change, not here; this change touches no main-board file. DEC-BOARD-DESIGN-RECORDS-AS-YAML names the category key in its catalogue-extract paragraph and DEC-BOARD-PRE-ORDER-RULE-READINGS states the reading, both amended in the graph change that authored this leaf.
rationale: |
  Restores the behaviour that REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of the decoupling item and its rule: every integrated circuit that has a supply is held to the decoupling practice, and a part that has none is not refused for lacking one. A refusal that no symbol or layout change can satisfy is a defect in the check; the declared record key keeps an undeclared, untyped supply a failure.
