id: SOL-HW-BOARD-FOUR-POINT-FIXING-RESTORED
type: deliverable
category: solution
title: 'The board division record is corrected to the owner''s intent: four-point fixing, removable triac mounting and the Extended part count as read'
status: active
version: 2
text: |
  Restores REQ-RETROFIT-FIT-001.C1 and REQ-RETROFIT-FIT-001.C2 for the board division and floorplan record: that record draws point 3 as no screw and no hole, the board resting on the plastic boss, and attributes that to the owner's decision of 2026-10-24. The owner's intent is a screw at point 3, the board held at all four of the machine's mounting points as the original board was, and the owner did not decide otherwise. The record is corrected to the owner's intent, and the work that follows from a hole at point 3 is done with it.

  A hole at point 3 puts the rule of DEC-BOARD-PRE-ORDER-RULE-READINGS in force there: mains copper keeps 13.25 mm from the hole's centre (the signed 10.0 mm, the 3.0 mm extent of the footprint and the 0.25 mm drawing tolerance). The record's own distance check, run against point 3 on 2026-10-25, finds one mains rectangle inside it: the pad of tab 9, 11.38 mm from the centre, 1.87 mm short. The steam-pump strip, the next nearest, stands 16.45 mm away. Tab 9 therefore moves down by at least 1.87 mm, and any tab the as-found minimum pitch of 8.3 mm or another rule of the record then forces to move moves with it (tab 8 stands at exactly that pitch from tab 9 once tab 9 is redrawn at 109.5 mm, so the record's own check, not this text, decides whether tabs 8 and 7 move), which makes the move a harness change of each lead that moves, named and justified as the record names the moves of tabs 1 to 3, with the lead slack each keeps stated. The owner's measurement of that slack with a rule is theirs and is taken before the board is ordered.

  The correction is made in the division record and carried through every statement of the point 3 decision there and in any record that restates it, including the decision it lists as pending about the fixing rule, and the record's own check script and expected output are regenerated from the corrected data. The board's fixing and its stiffness are stated in the record, not assumed.

  The same record is corrected where its parts list departs from the parts the machine needs and the catalogue as read. The main board's count of unique Extended part types leaves out the 120 kΩ mains-sense resistor of the supply-timing front end, so the count is 19 where the record says 18, and every figure that follows from the count, among them the Extended-fee total and the comparison with Standard assembly, is recomputed. The seven header types and the shunt, which the record grades as assumed to be Extended parts, were read in the manufacturer's catalogue on 2026-10-25 and are all Extended, so the assumption is replaced by the reading and the figures that rested on it lose their assumed grade. Both corrections are made in the same regeneration of the record's check script as the point 3 correction.

  The record's pending owner decision about the extended-part fee against hand-sourcing the through-hole parts (D10) is recorded as decided on 2026-10-25: the owner hand-solders the through-hole types that drive the assembly cost, and the manufacturer assembles only the surface-mount parts. The record's baseline, comparison tables and the statements that every part stays on the manufacturer's order meanwhile are brought to match, with the saving the decision brings.

  The heater wall board's record is corrected where it leaves the triacs' mounting unresolved. The owner's intent is that the triacs do not have their leads folded: both stand on a right-angle heat-spreader bracket whose one leg is fixed to the board by two mounts, placed so that every mounting hole keeps the signed distance from the mains copper, and whose other leg bolts to the metal wall, so that the board and the triacs are fitted and removed as one unit without desoldering and the depth the bracket adds stays within the cavity. The record shows that form, weighs it against the triacs past the board's short edge with their leads folded to the pads and against the triacs on the wall at a distance joined to the board by insulated wires, and states the order in which the board and the triacs are fitted and removed. The bracket replaces the record's owner row of 2026-10-24 (triac leads bent, the board standing off the wall by at least 5.0 mm on plastic standoffs), its assumption of that standoff, and its statement that no metal fixing joins the board to the wall; each is brought to match. The two bracket mounts are mounting holes under the same 13.25 mm margin as every other hole, the earth-bonded bracket keeps the basic creepage from mains copper that the separation basis states, the area of the wall cut is recomputed for the bracket's leg, and the depth the bracket adds is stated and graded as unconfirmed for the owner to check at assembly, since the record does not locate the metal wall.

  The board-mounted tab chosen for the seven 6.3 mm tabs and the return landing, C20626100, is titled 4.8 mm by 0.5 mm in the manufacturer's catalogue and only named 6.3 mm in the footprint library, and its blade is 0.5 mm thick where the harness blade is 6.36 mm wide and 0.81 mm thick, so the record states the blade the harness needs and corrects the part to one that fits it.

  The block-level cost estimate record, controller-board-cost-estimate.md, prices the hand-fitting decision and the corrected Extended-part count ahead of this record carrying them; this item is what brings the record into agreement with the estimate and must land before the per-board design tasks start from it.

  The wall board's varistor, C49072860, is read as Extended in the cost estimate and assumed Basic in the division record; the record states the reading, which moves no figure because the wall board is entirely hand-fitted.
