text: |
  Each channel's accuracy is measured against the figure the graph claims for it, under the conditions the machine runs in.

  The method is one a builder without a laboratory can carry out, such as substituting precision reference resistances at a sensor's connector while the loads run, or comparing against a calibrated probe.
