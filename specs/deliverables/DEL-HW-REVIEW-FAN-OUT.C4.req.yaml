text: |
  The merged record has a parts row for every row of the placement file and a layers row for every fabrication layer, the drill file and the outline, each with the verdict the ordering step allows, and a row that is not a match blocks the order. The assembler's preview, which needs an account and an upload, stays outside every reviewer.
