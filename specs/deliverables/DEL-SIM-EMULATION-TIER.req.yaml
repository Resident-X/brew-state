id: DEL-SIM-EMULATION-TIER
type: deliverable
category: task
title: The emulation tier exercises the shipping firmware binary with no hardware present
status: active
level: task
version: 2
text: |
  The compiled firmware binary runs under emulation against modelled peripherals and the plant model, with no hardware present. The artefact under test is the one the target would run rather than a re-expression of it, so logic, peripheral-interaction and timing-structure defects are caught against what actually ships.
rationale: |
  Separated from the seams and the host tier so that it does not gate them. It is the heaviest piece of infrastructure in this phase and nothing else in the phase consumes it, so bundling it with the seams would have put every other unit of work behind it for no gain. It needs the seams and nothing further, and runs alongside the estimator and both loops.

  It belongs in this phase rather than the on-target one despite exercising the implementation, because the verification approach deliberately rejected writing the control law in one language and porting it. There is therefore no design artefact separate from the implementation: what the host tier compiles is already the thing that ships, and deferring emulation would hold the logic and peripheral-interaction net back until a board had been bought.

  Two prerequisites are worth naming because they look like they belong to later phases and do not. A part family is nominated for pre-hardware verification, which is enough to emulate against and settles nothing about the controller the machine is eventually built on, so nothing here waits on the selection that phase four owns. The modelled peripheral set is bounded to the channels the control logic reaches through the hardware seam, so it does not wait on the instrumentation the physical track fits either.
