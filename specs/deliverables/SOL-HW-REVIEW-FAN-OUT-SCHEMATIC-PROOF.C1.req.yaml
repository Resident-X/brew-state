id: SOL-HW-REVIEW-FAN-OUT-SCHEMATIC-PROOF.C1
type: criterion
title: A fanned-out blind review of a seeded proof schematic meets the kit's pooled criterion against the single-reviewer run recorded as its baseline
status: active
version: 1
measurement_type: binary
verification: demonstration
text: |
  Run the single-reviewer form and the fanned-out form on one copy of the circuit review proof design seeded by a session that has not read the catalogue, in sessions with no record of the seeds, the fanned-out form at the full unit count with the design loop's two small-tier replicas. The fanned-out form reports every seeded defect as a finding against the catalogue item that covers it, and every seed the single reviewer reports; the findings that match no seed and the verdicts item by item are compared and a difference explained. Record for the shared context and each session and for each run the wall time, the tokens read, written and generated, the cost, the number of datasheet retrievals and any that failed, any call refused for a rate limit, and for each fanned-out run whether its merged round was accepted or refused, with the reason and the cannot judge items held. The kit's pooled criterion judges the fanned-out run against the recorded single-reviewer runs of this review's seeded proof, the single form being run once through the kit on the mid-tier on the same seeded copy, since none is recorded in a form the kit loads, and recorded as this review's baseline file: the seeds found are no fewer than the fewest any single run found, the wall time is at most half the single mean and the cost is at most 1.25 times the single mean, the multiple the layout proof uses, unless a measured run shows its replicas need more, in which case the proof states the new multiple and the evidence says why. A second fanned-out run is made, on a seed list that includes defects other than value and rating edits, because the first run's seeds found sat at the floor. A seed not reported is closed where the gap lies and the run repeated in a new session. The evidence names the exact model and the commit. Out of scope: the other reviews' proofs.
