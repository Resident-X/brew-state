id: DEL-HW-PRE-ORDER-CHECKS-EXTENDED.C14
type: criterion
title: A test point closer to a part's courtyard than the layout practice allows fails the check
status: active
version: 1
measurement_type: binary
verification: test
closes_by: cascade
text: |
  A design with a test point whose pad stands closer to a part's courtyard than the layout review's test-point item allows fails the check before it can be ordered, so that a probe can always land on a test point without a part's outline in the way, and the defect is found by measurement, not by a reviewer's eye.
