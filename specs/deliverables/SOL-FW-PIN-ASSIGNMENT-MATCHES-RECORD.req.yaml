id: SOL-FW-PIN-ASSIGNMENT-MATCHES-RECORD
type: deliverable
category: solution
title: The firmware's channel-to-pin assignment is checked against a pin allocation record, each fault proven on synthetic input
status: active
version: 3
text: |
  The firmware's host check tier gains a check that compares the firmware's own assignment of output channels to controller pins with a pin allocation record, in the form the design-records decision sets, so a board and the code that drives it cannot disagree about which output is which. It reads the firmware's output pin table, the positional array of pins in the order of the channel vocabulary's enumerators, and the port the table's pins are initialised on, which it reads from the source and never fixes in the check. It writes each pin as the port letter then number, as in PC6, the notation the decision sets for the record, and matches each firmware channel to the record entry whose firmware_channel names it. It fails a channel the firmware assigns that no record entry names, a record entry naming a channel the firmware does not assign, a channel assigned to a different controller pin, a channel named twice, and two channels on one pin, and each failure names the channel and both pins where both exist. A record that cannot be parsed, repeats a key, has no entry naming a channel, or has an entry whose firmware_channel is empty or not a name, or that names a channel but lacks its controller_pin, fails, and so does firmware in which no pin table is found. An entry with no firmware_channel key is not an output channel and is left to the checks that own it.

  Placement, settled before build. The check is a new tool in the firmware's check tooling, with its tests in the firmware's test tier, so it runs with the rest of the host tier and the board tool never reads firmware source. It reuses the firmware tier's comment stripping and the exit convention its other checks use to separate a failed check from one that could not inspect its input, and carries its own strict reader of the record that refuses a repeated key rather than importing the board tool's, so the firmware tier never reads a board. It needs PyYAML, as the firmware tier's mutation sweep already does; without it the check reports that it could not inspect, with an install hint, and its tests require it rather than skip. The firmware README states the prerequisite. It compares the firmware with whichever record it is given. Its tests use synthetic firmware tables and synthetic records, and it is proven on seeded faults in those. It is not added to the firmware check target yet, since no real record exists to give it.

  Scope. The check covers the firmware's output channels, whose assignment is a pin. A sensor channel is held on a converter input, which names a pin only through a controller-specific map, so comparing sensor channels is a separate solution that carries that map as an input; this one neither compares them nor lists them. This solution does not point the check at a machine's real record: that record does not exist until the board it describes is designed, and the design task that authors the record also wires this check to it.
