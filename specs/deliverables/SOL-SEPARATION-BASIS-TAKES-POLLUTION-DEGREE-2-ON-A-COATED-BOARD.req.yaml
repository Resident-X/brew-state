id: SOL-SEPARATION-BASIS-TAKES-POLLUTION-DEGREE-2-ON-A-COATED-BOARD
type: deliverable
category: solution
title: The separation basis record is redrafted at pollution degree 2 on coated boards, with the band rows for working-voltage creepage and the restated documents, unsigned
status: active
version: 2
text: |
  Redrafts the machine's separation basis record at pollution degree 2 on coated boards, as DEC-MAINS-BASIS-TAKES-POLLUTION-DEGREE-2-ON-A-COATED-BOARD sets, and brings every document that restates the replaced figures into line. The record today reads pollution degree 3 with uncoated boards and signs 4.1 mm of creepage between any two different mains nets, a figure the main board cannot be routed to. The record stays unsigned: nothing in this leaf is signed by an agent.

  Settled for the build:
  - Inputs. pollution_degree is 2. The environment text says the boards are "protected against moisture: coated" in those words and drops "uncoated and not protected against moisture". The header paragraph that says coating them later would be a fresh basis is replaced by the six conditions of the decision, numbered, as the conditions of the pollution degree 2 credit: the coat before the boards are energised in the machine, with the coat type and its datasheet named in the fabrication notes and the coat covering the gaps between mains pads except documented keep-outs for contacts; the protection stated as coated and credited at pollution degree 2 only, never 1; a laminate comparative tracking index of at least 175; slots in creepage paths at least 1.0 mm wide, 1.5 mm if a pollution degree 3 credit must survive; the bring-up humidity reading confirming no condensation while energised, with a fall back to pollution degree 3 and 4.1 mm as a fresh basis if condensation appears; and the whole record re-signed by the owner. The header names, by their node ids, the layout leaves of the main board and of the heater wall board that carry the coat and laminate requirements and the bring-up task that carries the coat and humidity checks.
  - Figures. mains_to_mains creepage_mm and creepage_ahead_of_fuse_mm become 2.6, replacing 4.1. clearance_mm 1.5, terminal_clearance_mm 2.0, entry_fuse F101 and held_at_reinforced are unchanged, and so are mains_to_low_voltage clearance_mm 3.0 and creepage_mm 10.0.
  - The derived row. The basic creepage row at 253 V is read at pollution degree 2, material group IIIa, from the 250 V (2.5 mm) and 320 V (3.2 mm) rows of IEC 60664-1 Table F.4, the pollution degree 2 material group III column ("other materials", not the printed-board column), by linear interpolation 2.5 + (3.2 - 2.5) x (253 - 250) / (320 - 250) = 2.53 mm, signed rounded up to 2.6 mm under the record's convention. The standard's own rounding to the table's digits gives 2.5 mm, so the row says that 2.6 mm is a deliberate margin of 0.1 mm over the standard's result, as the 4.1 mm row did. The citation names both rows, the arithmetic, IEC 60664-1:2007 clause 5.2.4 (clause 5.2.3 for functional insulation) and the reproductions, and says they are reproductions and not the standard's text. The household-appliance standard's position on interpolating its own table stays unverified, with the fallback of the 320 V row, 3.2 mm at pollution degree 2.
  - The existing rows move to pollution degree 2. At the record's pollution degree 2 the five table rows now at pollution degree 3 stop applying and the floor rule fails for want of a row, so each of them is rewritten at pollution degree 2 with its figure unchanged, apart from the reinforced mains-to-low-voltage creepage row, which becomes 6.4 mm (the 3.2 mm of the 320 V row doubled) while the signed 10.0 mm stays, the 3.6 mm margin being deliberate.
  - The mains-to-low-voltage rows. The reinforced creepage row is re-read at pollution degree 2 (3.2 mm basic at 320 V, doubled to 6.4 mm) and the clearance row at pollution degree 2 (Table F.2, 4.0 kV, 3.0 mm), so the floor rule finds an applicable row for each figure; the signed 3.0 mm and 10.0 mm stay, above their floors, and the record says the 3.6 mm of creepage margin over the floor is deliberate. The rows keep their pollution_degree equal to the record's, because the floor rule reads only rows at the basis pollution degree.
  - The band rows. The record carries eight table_rows of insulation functional, location conductor, pollution degree 2, material group IIIa, each with a creepage_mm and a clearance_mm: 10 V (creepage 0.40, clearance 0.2), 25 V (0.50, 0.2), 50 V (1.20, 0.2), 125 V (1.5, 1.5), 160 V (1.6, 1.5), 200 V (2.0, 1.5), 250 V (2.5, 1.5) and 320 V (3.2, 1.5) mm. Creepage is the "other materials" column of Table F.4, not the printed-wiring column (0.04 mm, whose footnote conditions were not read); clearance is Table F.2 up to 1.0 kV for the rows to 50 V (Table F.1: up to 50 V at overvoltage category II, 500 V impulse, 0.2 mm) and the signed 1.5 mm from 125 V. The rows from 10 V to 50 V are readings from open reproductions and KiCad's source tables (below 25 V), the IEC text unread, and the record's citation says so. They are the table the net-pair exception judgement reads. Each band row's keys are exactly inputs {working_voltage_v, insulation functional, location conductor, pollution_degree 2, material_group IIIa} and figure {creepage_mm, clearance_mm}, and the mapping holds no downstream_basis. A functional row never enters the floor of a mains_to_mains figure unless the mapping holds downstream_basis, which it does not. The citation of the set states the band rule: between two adjacent rows the figure is the linear interpolation rounded up to 0.1 mm; below 10 V the 10 V row is read; above the 320 V row there is no band figure; a pair at the supply voltage is not reduced and keeps 2.6 mm.
  - Sources. The record's header cites the EMA Design Automation creepage table (https://www.ema-eda.com/ema-resources/blog/pcb-clearance-and-creepage-distance-table/), the Texas Instruments papers SLUP421 and SLUAAR5, IECEx document 1422 on interpolation and an IECEE decision sheet quoting note 1 of Table F.4, and says they are reproductions and not the standard's text. The header's list of readings for the owner to check gains the pollution degree 2 column of Table F.4 and the coat conditions; the former material-group reading is restated for pollution degree 2.
  - Restated documents. The board division record (docs/sunbeam-em7000/controller-board-division.md) states the new figures wherever it states 4.1 mm of creepage or pollution degree 3: its separation row, assumption A3, the option row on the second division, the paragraph on mains against mains, the rule list, finding 3, D15 and the bracket paragraph (the basic mains-to-earth pair takes 2.6 mm from the same row), the verification table's creepage row, the verification script's basis constants, expected-output strings and seeded faults, and the sentences that report pairs under the basic creepage; a distance the record chose larger than the figure for a reason of its own (the 5.0 mm wall-edge distance) is left as drawn. The controller board design constraints record (docs/sunbeam-em7000/controller-board-design-constraints.md) restates the pollution degree row (2, boards protected against moisture by a coat, inferred) and the separation and material-group rows. The hardware notes (hardware/README.md) restate the adopter steps for pollution degree and the band rows. The design method (docs/board-design-method.md) item MAINS-4 states that the slot width it requires is the pollution degree 2 groove width and that a pollution degree 3 basis needs 1.5 mm.
  - Tests. The record's tests (hardware/tools/tests/test_separation_basis_record.py) pin the new figures, the pollution degree, the environment wording, the band rows, the derived row and the six conditions, read through the check's own reader and never a second validator; the tests that pinned 4.1 mm or the 5.0 mm fallback read 2.6 mm and 3.2 mm. Writing an acceptance into the record is never done by a test.
  - The coat requirement has homes already or gains them: the main board's fabrication-note criterion for the laminate sits in the main-board layout leaf (its criterion C16), and the coat gains its own criterion there (C17), in the heater wall board's layout leaf (C10) and in the bring-up task (C16 for the coat applied before mains is first connected, C17 for the humidity reading). This leaf delivers none of those; it names them in the record.
  - Supersession. Criteria C4, C5 and C10 of this leaf supersede criteria C1, C2 and C10, and C6, of SOL-SEPARATION-BASIS-SIGNS-MAINS-TO-MAINS-SPACING-AND-EXCEPTIONS, whose figures were read at pollution degree 3 and stay in the graph as what was verified then; its criteria are frozen and are not edited. The tests that traced those criteria trace this leaf's instead.
  - Out of scope: the owner's acceptance of the record; the net_pairs exception entries and the check that judges them; the mains-to-low-voltage figures; any board layout; the clearance rows; and the reading of the household-appliance standard's own text.
rationale: |
  Restores the behaviour REQ-ELECTRICAL-INSTALL-001.C15 and .C14 ask: the figures are read for the declared pollution degree, with the boards stated as protected against moisture only on the stated conditions, and signed with the basis. The owner accepted pollution degree 2 on a coated board on 2026-10-31 so the main board can be routed; the record, the documents that restate its figures and the tests that pin them are redrafted together, so no document keeps a figure the record no longer signs. The owner's acceptance cannot be entered by a build and stays its own leaf.
