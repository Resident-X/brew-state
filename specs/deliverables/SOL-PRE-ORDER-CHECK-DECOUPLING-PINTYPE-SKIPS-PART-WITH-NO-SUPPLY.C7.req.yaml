id: SOL-PRE-ORDER-CHECK-DECOUPLING-PINTYPE-SKIPS-PART-WITH-NO-SUPPLY.C7
type: criterion
title: A seeded copy of the proof design with an in-list category on a part with a power-typed pad is caught as decoupling_pintype
status: active
version: 1
measurement_type: binary
verification: test
text: |
  The seeded-fault harness holds a row on an orderable copy of the throwaway proof design, with a non-synthetic extract whose entry for a U position's number carries an in-list category and that position's footprint holding a pad typed power input or power output, and the check reports decoupling_pintype with the message saying the layout contradicts the category. The committed proof designs' records are out of scope.
