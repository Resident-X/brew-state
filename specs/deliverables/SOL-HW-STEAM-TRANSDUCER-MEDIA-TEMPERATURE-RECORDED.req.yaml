id: SOL-HW-STEAM-TRANSDUCER-MEDIA-TEMPERATURE-RECORDED
type: deliverable
category: solution
title: The steam-path transducer's recorded basis states the media temperature the part must survive and each candidate is checked against it
status: active
version: 1
text: |
  The recorded basis for the steam-path transducer states the pressure the part must survive and the ratings it must carry, and no temperature, although the transducer is exposed to the steam the block produces and saturated steam at the casting ceiling of about 150 degC is far above the media temperature many pressure transducers are rated for. Candidates are rated by media temperature as well as by pressure: the Ashcroft S1, one sourced candidate, is limited to 125 degC media, so a candidate could pass the recorded check on pressure and still be unfit for the steam it would meet.

  The basis is corrected to state the media temperature the transducer must survive, derived from the casting ceiling, with its premise, who stated it, its grade and what ends it, in the shape the basis already uses for the pressure figure. The check that closes the figures against the chosen part is extended to the part's own datasheet media temperature rating, recorded against the part with its source, and each candidate already cited is checked against it, any that falls short being recorded as unfit rather than adequate. Where the datasheet gives no media temperature the rating is recorded as absent, not adequate. The pressure figures, ratings and range bounds already recorded are unchanged.
