id: SOL-PRE-ORDER-CHECK-CREEPAGE-IS-CHECKED-ONCE-PER-DESIGN
type: deliverable
category: solution
title: The pre-order check hands no pass but one a creepage constraint, and judges the signed creepage once per design in a pass of its own that leaves out the ground pours that cannot matter
status: active
version: 3
text: |
  The pre-order check runs KiCad's rule check on a board with Mains three times: with the design's own rules plus the signed rules, with the mounting-hole rules, and with the sensing rules (the passes in hardware/tools/board_check.py named mounting_holes and sensing_clearance after the first). Each pass was handed the design's rules text as it stood, so each carried KiCad's creepage test against every ground pour: on the main board as laid out the test did not finish in over 100 CPU-minutes (KiCad issue 21482, the creepage search on a board of many zones), and the check paid it three times. The mounting-hole pass reads only the findings of its own mounting-hole rules and the sensing pass only the clearance findings of its own sensing rules, and neither reads a creepage finding.

  Settled for the build:
  - No pass but one is handed a creepage constraint. A function in hardware/tools/board_check.py takes the whole rules text a pass writes and returns it without any creepage constraint in the one form the check reads and writes, (constraint creepage (min <number>mm)), and without any rule left holding no constraint. The first pass, which refills the zones and saves the board, the mounting-hole pass and the sensing pass apply it to the whole text they write, so the design's own creepage line, the signed one, the ahead-of-the-fuse one and the mains-to-mains ones are all taken out of their copy. The design's file is never changed.
  - The signed creepage is judged once per design check, by a creepage pass run after the first pass and the resolution of the Mains class. A second function is the inverse of the first: it keeps, from the same rules text, only the creepage constraints, in any form, in the order and under the rule names the rules carry, and drops every other constraint and every rule left with none, so a finding is worded and judged by the signed exceptions as it was. The pass runs KiCad's rule check on the layout the first pass saved after refilling its zones, with no refill of its own, less the ground pours that the guard below clears, with a marker rule so that a rules file KiCad did not load fails the design. Only the creepage findings of its report are kept, and they are added to the first pass's findings. The layout file is put back as it was after the run.
  - A guard computed from the refilled layout, with the check's own copper geometry, says which ground pours may be left out. A ground pour is a zone, a rule area excepted, on a net of a ground net class. It is cleared only where its straight-line distance, on every copper layer, to every conductor a creepage rule reaches from is at least the largest creepage figure the rules hold. Those conductors are the Mains-class copper and the nets a creepage rule's condition names. A creepage between two conductors is never shorter than the straight line between them, so a cleared pour is neither one end of a pair under the figure nor on a path shorter than it.
  - A ground pour nearer than the figure to Mains-class copper alone is also left out of the creepage pass, and is judged by the check itself: on each layer it shares with that copper, the shortest way between them round the barrier slots is held to the figure, and a shortfall is a creepage finding in KiCad's wording, judged by the signed exceptions as KiCad's are. A path between two conductors that runs along such a pour begins with a path from the one to the pour, so no finding is hidden; a layer the two do not share is the cross-layer rule's. A ground pour nearer than the figure to a conductor of a net a rule names stays in the layout the creepage pass reads, the pass may then be slow, and a failure of the pass names the pour and its distance. A creepage rule whose condition names neither a Mains class nor a net, or whose figure is not in millimetres in the form the check reads, leaves every pour in.
  - Both functions are fail-safe: a creepage constraint in a form the first does not recognise, and text that does not balance, stay as written, so a pass is then slower and never reads a different answer. A rule that held no constraint before is left as written. Every other constraint is untouched, the signed clearance and the sensing clearance included, and so is the order of the rules, since the last matching rule decides.
  - The arrangement is evidenced three ways: unit tests of the two functions, the guard and the pass; a run of the check on the throwaway proof design carrying a creepage shortfall, a mounting hole inside the signed distance of Mains and a sensing item inside the signed clearance, whose hole and sensing findings are the same with the first function and with it replaced by the identity, whose creepage findings come from the creepage pass, whose rules text for the first, hole and sensing passes holds no creepage while the creepage pass's holds nothing else, and which fails when the function is taken out; and a timed run of the passes on the main board as laid out, which finishes and finds no creepage shortfall at the signed figure.
  - hardware/README.md and the hw:verify task's description say the creepage is computed once, in a pass of its own, and the other passes hold none.
  - The seeded-fault proof (task hw:prove) is run once on the change, and a seed of it that no longer finds its place in the proof design's records, which stopped the whole proof before it judged any fault, is corrected so that the run is complete.

  Out of scope: running the passes in parallel, caching a pass's result between runs, speeding KiCad's creepage search itself, and any change to what any pass judges or reports.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks, that every board is judged against every applicable item before it is ordered, within the time the check can be run. The pre-order check on the main board takes about three KiCad passes of about 50 minutes where one creepage test is all that any pass reads, so the check is run less often and the board is judged less often than the requirement wants. The first sibling solution raised the limit and left parallel runs out of scope, so this is a separate item, not an amendment of it; the passes' own judgement is not changed.
