id: DEL-MAINTENANCE.C3
type: criterion
title: A build's source filter is read by the paths its terms name rather than by the characters they begin with
status: active
version: 1
measurement_type: binary
verification: test
closes_by: cascade
text: |
  `SOL-PLANT-STRUCTURE-SEAM-FIRST-STRUCTURE.C7` requires a build naming no structure to stop with a message identifying the problem, rather than letting the linker be where the question surfaces. The check that establishes it reads the build's source filter by stripping a set of characters from the front of each term rather than a prefix, so a term naming a path the build does not name is read as one it does: `../plant/<structure>/` and `/plant/<structure>/` both arrive at `plant/<structure>/`. A build compiling none of the tree's structures is then reported as naming exactly one, cleared, and handed to the linker, which fails on the model's operations being undefined — the confusing arrival the check exists to replace with a clear refusal. The mirror case is the same misreading with the sign turned round: a term excluding a path outside the root cancels an inclusion inside it, and a correctly configured build is refused.

  No environment in the tree writes such a term, so this has cost nothing yet. What it has taken away is the guarantee: the check's answer is right for the terms the tree happens to contain rather than for the terms it reads.

  Remediation restores the reading — a term is normalised by removing the prefix that means "here", and a term naming anything else keeps naming it. The state that shows it is a build whose filter reaches outside the source root being refused for naming no structure, which is what it names.
