id: SOL-HW-HEATER-WALL-BOARD-PLATE-CLEARANCE-HOLDS-OVER-OUTLINE-AND-LEAD-PLAY-TOLERANCE
type: deliverable
category: solution
title: The wall board's plate clearance and creepage hold over the board outline's routing tolerance and the leads' play
status: active
version: 4
text: |
  Corrects the printed case's account of the gap between the board edge and the spreader plate, and the clearance that follows from it. The case record and its checks take the gap as the maker's tab-face-to-lead-centre range less the lead centre's fixed distance from the board edge, 0.785 to 1.21 mm. That range leaves out two tolerances that move the same distance: the board outline's routing tolerance, 0.2 mm at the fabricator's regular tier and 0.1 mm at its precision tier (the manufacturer record marks both as published and unverified), and the play of each lead in its 1.1 mm drilled hole, 0.20 to 0.305 mm to either side from the hole and the lead's 0.49 to 0.70 mm thickness, which the assembler's soldering freezes. With them the gap is wider and narrower than recorded, and the straight-air clearance from a pad edge to the plate, the pad-edge-to-board-edge distance of 1.010 mm plus the gap, falls below the signed 1.5 mm wherever the gap falls below 0.49 mm. The record's statement that clearance holds without the barrier is optimistic to that extent, and a barrier is not credited against clearance, which is an air distance.

  The form the owner agreed in conversation on 2026-11-27, pending its entry in the sign-off record: the plate is a narrower flat bar whose lower edge stands above the board's pads, so that no plate metal faces the board edge, the pads or the lower leads, and the tray's printed end wall fills the volume the plate leaves, takes no creepage credit and stands clear of the board edge. The plate's triac screw holes are tapped through from the triac side, since a slot or an oversize hole would let the plate stand off the wall and a countersink would put a screw head in the heat path; that is the departure from the owner's ruling of 2026-11-24 that the printed case's seating-scatter criterion leaves outstanding, and it is recorded here for the owner to accept.

  Settled at readiness, 2026-11-27: the plate's lower edge stands 6.0 mm above the board's component face, the figure the owner signed in W-9 1c for the lift. The bare lead's rear face stands at least 2.40 mm off the plate plane and its metal rises to the body underside at 4.55 mm at most, so 2.6 mm of straight air needs a lower edge at or above 4.55 + sqrt(2.6^2 - 2.4^2) = 5.55 mm. The plate is a standard 20 mm by 5 mm flat aluminium bar, 80 mm long, so its upper edge stands 26.0 mm above the component face, 3.5 mm above the lid top. The case's nominal checks pass at 20 mm and at 25 mm. The case holds at any height from the least that keeps the case inside the plate's footprint, 16.8 mm, to the greatest the unit's opening in the plastic wall admits, about 27.5 mm, and the build checks both ends of that range. The thermal re-run at 20 mm, with the plate's own conduction recomputed, is the build's own judgement. Clearance and creepage are both proved as a straight-line distance of at least 2.6 mm from every mains pad edge and bare lead to the plate solid and the machine-wall plane, since no creepage path is shorter than the straight line. The thermal plate term becomes thickness / (15 W/(m.K) x length x height), the record's conductivity floor, and the window height becomes the plate height; lateral spreading along the narrower bar is not modelled and the bring-up case-temperature measurement closes it. The tray end wall occupies the former plate volume across the tray width from the floor to the new lower edge less the 0.2 mm seam, its front face 0.2 mm behind the plate plane and its back face 0.5 mm in front of the wall plane, so only the plate touches the wall. The case stays within the former 80 x 30 mm outline, and the plastic-wall opening is the plate's outline plus 1.5 mm, which reaches 3.5 mm higher than the former window and stays within the unit's opening in the plastic wall. The tray screws move to 9.5 and 14.0 mm, since a pilot at 19.5 mm would cut the lid-toe pocket, and the tray root's tension and the triac end's motion are re-judged at the 4.5 mm stance; each end takes one M4 wall bolt at mid-height, which leaves the earth bond resting on two bolts and the toothed-washer hedge, for the owner. The triac holes are M3 tapped through with M3 x 5 screws, whose tip depth of at most 4.01 mm and engagement of at least 3.44 mm over the screw length tolerance and the tab thickness range leave the tip short of the back face. The seating-range check rebuilds at 32 extremes: body, lean, tab-face distance, outline routing 0.2 mm and lead play 0.305 mm. The end wall is unfilled printed plastic, with no carbon-fibre or metal-filled filament, because it stands about 1.3 mm from the pads at the extremes.

  This item corrects the premise of the printed case solution it depends on, including that solution's statement that its 6.0 mm fallback leaves the leads 3.4 mm from the plate: that is the nominal figure, and at the 4.55 mm body maximum it is 2.80 mm. The wall-steel solution's thermal judgement is a separate item: it records the wall and re-judges the triacs on it at the present plate, and this item re-judges them at the narrower plate.

  Locus: hardware/sunbeam-em7000/heater-wall-board/case/ (params, model, checks, record and plate drawing), the separation basis's barrier text, the owner sign-off record, and the thermal judgement's margin script and the records that quote it.
