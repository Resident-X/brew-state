id: SOL-HW-BOARD-DIVISION-AND-FLOORPLAN
type: deliverable
category: solution
title: The circuitry is divided between boards and a block-level floorplan shows each fits the enclosure as found, with harness connectors, the interlock and reserved headroom placed
status: active
version: 1
text: |-
  Assigns every function to a board or off-board assembly, weighing the owner's starting points as inputs. It draws a block-level floorplan per board against the recorded enclosure, mounting and harness entries, placing the large parts, every connector, the proof-of-life interlock and the separation from mains. It records, for each anticipated channel kind, where it is reserved or why it is not.
