id: SOL-PRE-ORDER-CHECK-POLARITY-MARK-SKIPS-A-PART-WHOSE-HOLES-FIX-ITS-ORIENTATION.C3
type: criterion
title: A polarised part whose two through-hole pads differ only in the shape or size of their copper fails polarity_mark
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A polarised part with two through-hole pads named + and -, no pad numbered 1, holes of one drill and the pads one rect and one round, or of two sizes of copper, fails polarity_mark, because the holes fit the board either way. The same part with holes of two different drill diameters passes. Out of scope: which parts are polarised, the silk marks on the main board and the mark margin.
