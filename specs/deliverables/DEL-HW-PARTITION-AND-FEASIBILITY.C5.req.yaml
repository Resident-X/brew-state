id: DEL-HW-PARTITION-AND-FEASIBILITY.C5
type: criterion
title: Each board the division produces has a design task carrying the interlock or headroom allotted to that board
status: active
version: 12
measurement_type: binary
verification: inspection
closes_by: cascade
text: |
  Each such task delivers, for its board, the epic's proof before order, separation and held-off criteria, its schematic review and its layout review, with the design method applied to that board rather than only written. Each covers ordering and receiving its board, checks the manufacturer's production files against its assembly preview before payment, records the quoted order cost against the running total of the declared spend before ordering, depends on the further pre-order checks, so no board's records need a key the pre-order check does not yet accept, and is a prerequisite of bring-up, so none of the epic's criteria can close on the gate or the method alone without a board having been designed, proven and made.

  Each such task also records, with its source, every figure the controller boards' constraints record holds pending against the design of its board, such as a rail's budget, a branch fuse's rating, or the time a protective device takes to clear and the energy it lets through at the declared fault current, ending those marks.

  Each such task also authors, for its board, the pin allocation record, the parts specification record, the derating policy record and the pin-limit record, and keeps the catalogue extract current, in the forms the design-records decision sets, so the connectivity and parts checks have a record to hold the board to before it is ordered, and it points the firmware's pin assignment checks, the one for output channels and the one for sensor channels, at that board's pin allocation record, authoring beside it the controller's converter-input map that the sensor check reads, in the forms the decision sets.

  The derating policy record each such task authors grades every part chosen for its board against the enclosure air temperature the controller boards' constraints record holds, and where no catalogue part holds at that figure the task records the revisit of the figure in the constraints record, with its reason, instead of stretching the part's rating.

  Each such task that carries the interlock depends on DEL-HW-INTERLOCK-INTERVAL-CHOSEN, which records the 100 ms proof-of-life removal interval, so the interlock's timing is designed to a recorded figure and does not wait on the first-trip ceiling check, DEL-HW-INTERLOCK-INTERVAL-DERIVED, which bring-up waits on. That task also judges the interlock's own barrier part, such as a relay's coil-to-contact barrier if the mechanism is a relay, against the separation basis with the arithmetic shown, and where the signed basis lists no such barrier the owner re-declares the basis before the part is ordered.

  The main board's design task routes each net that the board division record joins on an inner layer, the valve-relay net from its tab and the pump-strip net from its tab among them, on the inner layer clear of every mounting hole, slot and low-voltage block, with the signed separation basis kept from all other copper on that layer, and records each route; where a net cannot be so routed, the task revises the division record's floorplan rather than relaxing the basis.

  Each off-board assembly the choice of form creates, such as the heater-switch assembly on the machine's wall (a designed wall board for the two heaters, its triacs standing on a right-angle bracket whose one leg is fixed to the board and whose other leg bolts to the machine's metal wall, and the element harness to the wall), also has a design task. That task designs the wall board, selecting its opto-triacs and triacs against the targets the function-forms record sets; judges against the triacs' own thermal ratings whether the machine's wall alone sinks the heat or a spreader plate is needed; judges the assembly thermally against the enclosure air temperature the controller boards' constraints record holds, an assumption that bring-up measures, including the heat it passes into the enclosure through the wall; designs the element harness to the wall; and fixes the height of each triac's tab hole on the bracket's standing leg, from the triac's package drawing and the board's fixing, so that each triac's leads reach the board's pads and its tab face lies flat on the leg, and records the height with its source. The design task for an off-board assembly that includes the steam-path transducer's condensate leg designs the leg and records the temperature it delivers to the transducer, with its source, against the media temperature the basis states. The design task that carries a pressure channel also selects the transducer actually fitted and records, from its maker's current document with the source, its insulation withstand between its circuit and its wetted body, judged against the barrier the separation basis declares for that sensor, with the arithmetic shown. A withstand that cannot be sourced counts as absent, not adequate. Where no candidate meets the barrier, the task forms the barrier elsewhere in the assembly, or the owner re-declares the basis from the machine's own earth bonding before the part is ordered. It records, with its source, every figure the constraints record holds pending against it.
