id: SOL-HW-REVIEW-FAN-OUT-CRITICAL-ROUTING
type: deliverable
category: solution
title: A task fans the critical-routing check out by catalogue area and merges the areas into one pass of the layout plan
status: active
version: 5
text: |
  Why this exists. Step 4 of the method's routing section judges the layout checklist items that bear on the critical nets, with the board still closed and before the router runs, because a critical net's route costs one net's re-route to change then and a great deal once the router has built around it. It is the cheapest place in the method to protect a first-pass board, it is repeated on every board and after every re-route, and it is one reviewer going through the whole checklist to find which items bear. The reasoning, measurements and options rejected are in DEC-REVIEW-FAN-OUT-FROM-SHARED-CONTEXT-WITH-REPLICAS, and DEC-FANNED-OUT-ROUND-IS-THE-SAME-ROUND settles that a review judged by unit is the same review; a session building this does not reopen either. This is the third of seven solutions under DEL-HW-REVIEW-FAN-OUT. It adds the critical-routing check as a caller of the review kit, and adds nothing to the kit. The catalogue helpers the layout caller holds (reading the catalogue's areas and items for a method section, the board's own items, the couplings) move to a shared module both callers import, the layout caller's behaviour and tests unchanged.

  What it records is not a review round. The check records a pass in the board's layout plan, under a section of passes numbered from 1 and only ever appended, each pass holding the commit judged, the views as they were run, a verdict table with a row for every item that bears on the critical nets and, below it, every other item with the reason it bears on none. It has no findings table and no round number, and a different command reads it: the board placement and critical routing history check, not the review record history check.

  Settled before the build.

  - The units are the layout catalogue's areas, found as the layout caller finds them, and one for the board's own items when the plan's table has rows, since the history command's checklist holds them; there is no unit for a comparison with the plan or a free pass, which step 4 does not make. The couplings are the layout caller's, power with mains and the manufacturing items with power, since one area's verdicts rest on the other's findings at this step as at the review. Each reviewer gives every item of its unit one verdict row: pass, fail, not applicable or cannot judge for an item that bears on the critical nets, and `bears on no critical net`, with the reason in Why, for one that does not; the replicas are merged any-fail with that verdict last, so an item one replica judged as bearing is judged. Each fail raises a finding naming the item and what and where, numbered by the kit, whose What and where the render writes into the fail's Why; the pass has no findings table.
  - The merge writes one pass: every catalogue item and every board item has one verdict row, and those judged `bears on no critical net` are rendered as the list below the table with their reasons, once; the pass number, the commit judged and the views are inputs from whoever runs the check, as the layout round's fields are; the pass is rendered through the rendered record the kit's caller contract provides, in the form the plan's section holds, into the output folder, which is outside the repository; whoever runs the check appends it below the earlier passes and never in place of one, since the history command refuses that.
  - The rule-kind items rest on the rules table alone here, as the method says, because the pre-order check fails a board that is not fully routed and is not run at this step.
  - A fail is put right before the router runs, as step 4 says: the net is re-routed, locked and committed, the views rendered again and the one item judged again by a reviewer as step 4 judges an item, a single reviewer of one item being valid, and the verdict reached is written in the same row as `fail, then <verdict> at <commit>`. A re-route the layout review calls for once the router has run is the next pass, a new run of the check with the next pass number. A cannot judge is resolved within the pass as the layout caller resolves one, through the folder command's add-view and add-document modes and a re-run of the unit, and written `cannot judge, then <verdict>`.
  - The review folder is written by the layout folder command with `--review critical-routing`: its round fields are the pass number, the commit judged and the views; the method extract adds the routing section; the placement view is taken only when given and the pre-order check's report not at all; a later pass copies no review record, its earlier passes being in the plan the commit holds. A reviewer is granted read tools and read-only retrieval, as the layout caller's are. The caller runs the design loop's two replicas, a full and a hunt framing, on the small-tier model, with a time budget of about 350 seconds and the layout caller's bound of 30 reviewers at once.
  - The tests need no model and no KiCad, using the kit's stub over synthetic plans.
  - The blind proof of the fanned-out form is SOL-HW-REVIEW-FAN-OUT-CRITICAL-ROUTING-PROOF; until it is recorded the method relies on the single-reviewer form of this check.

  Out of scope: the layout review round, the placement judging, and the history command's own checks.
