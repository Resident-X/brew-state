text: |
  The owner's sign-off record states its W-19 entry again at the new fixing, the 85 mm bar and the wider opening in place of the 80 mm cut, as a dated entry signed on the owner's behalf under his standing instruction. The entry sets the 85 mm bar beside the owner's recorded statement that he could probably mount an 80 by 30 to 35 mm spreader. Out of scope: the owner's reasons, which the entry records as said.
