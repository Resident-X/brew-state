id: SOL-HW-HEATER-WALL-BOARD-PRINTED-CASE-DESIGNED-TO-THE-REQUIREMENTS-THE-BOARD-RELIES-ON
type: deliverable
category: solution
title: The printed case that retains the heater wall board and mounts to the spreader plate is designed to the requirements the board and the signed separation basis rely on
status: active
version: 7
text: |
  Designs the printed case that retains the heater wall board and mounts to the spreader plate, to the requirements the board's layout and the signed separation basis rely on and that the earlier decision deferred to a case-design step. The board is a plain 45.0 by 75.0 mm rectangle with one mounting hole and two slots open at its right edge, hung on the triac leads and that hole, with its triacs on the plate's inner face; the case holds it, covers its mains copper with slots that let heat out, and mounts to the plate so that the plate, case and board leave the wall as one unit.

  It covers: the tray's creepage barrier over the bare plate face (or the 6.0 mm plate lift as the fallback); the case within the plate's footprint and the wall opening the plate outline plus clearance; the plate's length against the case's width and two bolt zones; the lid fitting and coming off with everything installed in the machine, and no lid screw against the wall opening; the board held by the tray, not the lid, by its one hole and printed features; every case screw keeping the mounting-hole distance from mains copper; no case material across the slot mouths; rigid backing under the three blades; the plate's earth bond and the owner's decision on a strap; and the fitting order and reach of every fixing.

  Settled for the build:
  - The case is 3D printed at home in ASA, ABS or PC and fixed with ordinary screws, as the owner stated; its design, material and fixings are this leaf's within the criteria.
  - The barrier is a creepage barrier of the tray, never of the lid. A triac seated on its lead shoulders stands with its body underside 3.75 mm above the board (2.55 to 4.55 mm over the seating range) and its tab hole about 16.4 mm up, from the maker's drawing (ST DS2114 Rev 11, Figure 13, dimensions a1 and I4); the earlier 0.85 mm and 13.6 mm were a slip and are corrected in the records. The board-to-plate gap is 1.0 mm nominal and 0.785 to 1.21 mm over the triac's package tolerance, so a printed 0.8 mm wall cannot be guaranteed to fit it. The barrier is therefore a thin bought insulating film held by the tray (0.25 mm, rated at least 105 degC, flame-rated, flat on the plate and not behind the tab), notched under the bodies, and the 6.0 mm plate lift is not used; the case drawing states the creepage it gives against the 2.6 mm the basis signs, at the worst seating.
  - The case is designed in a single-colour and a two-colour form sharing every safety-fixed dimension, printed on a 220 by 220 mm bed with a 0.4 mm nozzle in ASA, and drawn as a parametric model from the board's layout file, never from figures in prose.
  - The case carries the Staircase logo itself: the project's logo asset (owner-held, David Baker; the owner expects it on the case) traced to a printable vector. Its publication in the public repository is the owner's to confirm on the end list.
  - Lid removal and terminal push-on are proved on the model here; their physical demonstrations are the delivered-board leaf's.
  - The plate's size is provisional; the case adapts to the figure the owner records after cutting and measuring.
  - The earth strap is the owner's decision; the case design records it and carries it.
  - This leaf takes over, from SOL-HW-BOARD-FOUR-POINT-FIXING-RESTORED.C5 and SOL-HW-HEATER-WALL-BOARD-ASSEMBLY-JUDGED.C3, the mounting content those criteria record in the earlier ear-and-bracket form.

  Locus: a case record in the heater wall board's design folder (hardware/sunbeam-em7000/heater-wall-board/), the printed case's model and drawing, and the plate drawing's length figure. The locus also holds the Taskfile tasks and the hardware README section that reproduce the case build and its checks and slice (the toolchain is recorded in the project so another person can rebuild it), and the pointer in the board design lessons that the earlier bracket form is superseded by the case record. It changes no board copper or outline.

  Amended 2026-11-27: the film form this text describes, a thin bought insulating film held by the tray with the 6.0 mm plate lift not used, was replaced after the board outline's routing tolerance, the board's thickness and the leads' play were counted in the board-to-plate gap (0.28 to 1.715 mm, not 0.785 to 1.21 mm). The case now takes the third branch of the first criterion: the plate's lower edge stands 6.0 mm above the board's component face with a printed end wall and ledge beneath it and no film, and the owner's decision that branch needs is recorded in his sign-off W-19 (signed on his behalf). The figure that criterion gives for the leads' distance from the plate, 3.4 mm, is the nominal one; at the 4.55 mm body maximum it is 2.80 mm. The criteria of this solution are left as they were: each is met by the form built. The form, the lower edge, the triac screws and the tolerances are settled in DEC-HEATER-WALL-BOARD-CASE-HOLDS-CLEARANCE-AND-CREEPAGE-BY-GEOMETRY, DEC-HEATER-WALL-BOARD-PLATE-LOWER-EDGE-IS-6-MM-FROM-2-6-MM-OF-STRAIGHT-AIR, DEC-HEATER-WALL-BOARD-TRIAC-SCREWS-ARE-M3-X-5-TAPPED-THROUGH-THE-PLATE and DEC-HEATER-WALL-BOARD-GAP-RANGES-INCLUDE-OUTLINE-THICKNESS-AND-LEAD-PLAY, built by SOL-HW-HEATER-WALL-BOARD-PLATE-CLEARANCE-HOLDS-OVER-OUTLINE-AND-LEAD-PLAY-TOLERANCE.
rationale: |
  Added because the decision that the board is a plain rectangle screwed to a printed case on a flat spreader defers the case design to a later step, and that step has no requirement in the graph: the owner's case-step requirements of 2026-11-19 (the barrier in the tray, the case within the plate, the lid removable in place, the earth-strap question) and the board's own carried items (slot mouths, blade backing, one-hole retention) are recorded only in the board's open-items record, which is not durable. The signed basis relies on the barrier for the plate's creepage, so a case that omits it would leave the heater switch's basis unmet; stating each requirement as a criterion makes the case verifiable when it is designed. Sized as one leaf because every criterion is one case drawing or model judged against the same board and basis, with two fitting demonstrations.
