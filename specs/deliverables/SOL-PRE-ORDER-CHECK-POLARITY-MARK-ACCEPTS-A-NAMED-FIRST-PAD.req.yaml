id: SOL-PRE-ORDER-CHECK-POLARITY-MARK-ACCEPTS-A-NAMED-FIRST-PAD
type: deliverable
category: solution
title: The polarity-mark rule does not require a first pin of a through-hole part whose hole pattern fixes its orientation
status: active
version: 1
text: |
  The polarity-mark rule finds each polarised part and requires a mark on its own side's silkscreen nearer its first pad than any other. A part is polarised when its pins are named for anode and cathode or plus and minus, when its symbol is a polarised capacitor's, or when it has three or more pads on distinct nets; the first pad is the pad numbered 1, and a polarised part with no pad numbered 1 fails as having no first pin to mark. A relay's pads are named for its contacts and coil, so the main board's relays K201 (pads 13, 13, 14, 14, A1 and A2) and K731 and K741 (pads 13, 14, A1 and A2) have no pad numbered 1, and four distinct nets make them polarised, so each fails however its footprint is drawn.

  Settled before build: the rule gains an exemption, and the first pad is not guessed. The owner has ruled that the rule does not require a first pin of a part whose hole pattern fixes its orientation. The facts behind it were read from the main board's relays and the records. Each relay's pad pattern maps onto itself under no turn but the identity, so its holes fit the board one way only. These relays are through-hole parts fitted by hand (docs/board-manufacturer-jlcpcb.md lists parts the assembler fits by hand as through-hole parts assembled manually, and K201 has no catalogue number), and no assembler's preview has to judge their orientation by a mark. The method's production-files check already lets a part with no polarity state none. The new reading, rule (d): a polarised part with no pad numbered 1 needs no first pin and no mark when both hold. Every plated pad of the footprint is through-hole, non-plated mounting holes being ignored as is_polarised already ignores them. And no turn about the centre of the plated pads other than the identity maps the pads onto themselves in position, size and shape. Reflections do not count, since a placed part cannot be mirrored. Otherwise the part fails as it does now: a footprint with a surface-mount pad, or with through-hole pads that some turn maps onto themselves. The message keeps its text "has no pad numbered 1" and adds why the exemption did not apply, either "its pads are surface-mount" or "its pads map onto themselves when turned". A footprint with a pad numbered 1 is judged exactly as it is today, whatever its pads are, and a polarised footprint with no numbered pad at all fails, because there is nothing to fix its orientation by. This narrows the wording of the sealed sibling SOL-PRE-ORDER-CHECK-FIDUCIALS-AND-POLARITY-MARKS, whose text and C1 say that a polarised part with no pad numbered 1 fails. That wording was true when delivered and is narrowed here by the owner's ruling; the sibling is neither edited nor superseded, as the leaf that lowered the crystal keep-clear floor did for its sibling. Rejected: judging the part on the first numbered pad its footprint lists (file order is not a property of the part: for a relay it picks a contact pad, and a different library ordering picks another), a record key naming the first pad (it declares a choice with no guard against a convenient one), and treating relays as not polarised (too broad: it keys on the kind of part and would also exempt a surface-mount relay, whose orientation an assembler does judge).

  Placement: unmarked_pins in hardware/tools/board_check.py, at the branch taken when no pad is numbered 1. pad_symmetries cannot serve there: with an empty list of first pads its final condition, which asks whether every first pad is left in place, is true of an empty list, so it returns nothing. A sibling helper beside it returns the non-identity turns only: it tries each turn that sends the pad furthest from the centre to a pad as far from it, as pad_symmetries does, drops the reflections, and drops the identity candidate (the anchor sent to itself at angle 0) by requiring some pad centre to move by more than PAD_MATCH. The branch passes a part when every plated pad is through-hole and that helper returns nothing, and otherwise reports the failure with its reason. A footprint with pads numbered 1 and a footprint with no numbered pad take the paths they take now. The places that restate the old behaviour change with it: the unmarked_pins docstring and the message in hardware/tools/board_check.py; hardware/README.md, the polarity-mark paragraph (about :379, "Its first pin is the pad numbered 1") and the polarity_mark row of the checks table (about :556); and the "Fiducials and marks" paragraph of DEC-BOARD-PRE-ORDER-RULE-READINGS, amended in the graph change that authored this leaf. The sealed sibling is not edited. Unit tests are in hardware/tools/tests/test_board_marks.py, with synthetic references and pad names. Pass: the geometry of K731 (pads 13, 14, A1, A2, through-hole, asymmetric under turns) and of K201 (the same with duplicate pads 13 and 14). Fail: four through-hole pads named A1, A2, 13, 14 in a 2 by 2 grid that a quarter turn maps onto itself; a surface-mount asymmetric pattern with no pad 1; the existing case in that file with surface-mount pads A and B at (-1.5, 0) and (1.5, 0), unchanged; a polarised footprint with no numbered pad; the failure's text report carrying the added reason (the check has one text report and no machine-readable one, so no JSON form exists to test); and the unchanged judgement of a part with pad 1. The seeded-fault rows in hardware/tools/board_prove.py stay, and a new row beside the plated through-hole row renames a polarised part's through-hole pads to names a turn maps onto themselves, with no pad numbered 1, and requires polarity_mark; the row joins the required-names dictionary in hardware/tools/tests/test_board_check_kicad_marks.py. The main board's silkscreen is not touched.
rationale: |
  Restores the behaviour that REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of the polarity-mark rule, which the pre-order check holds as a catalogue-kind rule: the marks an assembler and an inspector rely on are present on every assembled part with an orientation, so an orientation error can be seen at arrival inspection. A relay with named pads has an orientation and a first pad; the rule that cannot find the first pad of a part whose pads are not numbered reports a defect of the rule, and excluding the part would withdraw the check where it is needed.
