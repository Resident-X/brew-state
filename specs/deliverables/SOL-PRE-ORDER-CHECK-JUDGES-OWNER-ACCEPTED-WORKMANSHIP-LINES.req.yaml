id: SOL-PRE-ORDER-CHECK-JUDGES-OWNER-ACCEPTED-WORKMANSHIP-LINES
type: deliverable
category: solution
title: The pre-order check passes a workmanship or neatness line only on an owner-signed acceptance for that rule and place and fails every other
status: active
version: 2
text: |
  Corrects the pre-order check's handling of a workmanship or neatness line that the owner has accepted. The check passes a mains spacing shortfall only on a signed exception in the separation basis record and a derated-voltage position only on a signed entry of the derating policy, but it has no such mechanism for the workmanship and neatness rules, which are rule-kind items of the practice catalogue (route corner angle and segment length, pad entry, detour, courtyard overlap, test-point courtyard, stray designator, silkscreen overlap and a part outside its region). A board whose only remaining lines are ones the owner has accepted on a stated ground therefore still exits non-zero, and the failure of its pre-order check cannot be told from a defect. The owner's policy is that workmanship items are fixed where reasonable in context and not chased to perfection, and the main board's decision of residual risks records that the check stays red on the remaining lines on the owner's condition; this item gives the check the means to read that acceptance so that such a board can pass while every other line still fails.

  Settled for the build:
  - Record shape. Each board design's records gain an optional workmanship acceptance record, an explicit empty list being a record that accepts none. Each entry names the rule, the place or scope the acceptance covers (a reference designator, a net, or a class of line the rule reports with the figure it reads), the number of lines it excuses, the owner's reason, the element or argument that bounds the harm, who accepted and the date. All keys must be present. An entry that is not a mapping, lacks a key, holds another key, repeats a rule and scope, or gives a non-positive count fails the record naming the entry and the key.
  - Judgement. A line of a rule that the record covers, up to the entry's count, is reported as an ACCEPTED line in the check's text report, which is its only report, with the rule, the place, the measured figure against the allowed one and the reason, and does not fail the check. A line with no entry, a line beyond the entry's count, and a line of a rule the record does not name fail as before. An entry excuses nothing but its own rule and scope.
  - Closed set of rules. A record may accept lines of these rules only, named as the check names them in its report and in the rule table of the hardware notes: workmanship_detour, workmanship_pad_entry, workmanship_pad_corner, workmanship_width, workmanship_direction, KiCad's track_angle and track_segment_length, courtyards_overlap (only a plain part-courtyard overlap, never a line that names a custom rule of the design such as the crystal keep-clear), test_point_courtyard, designator_astray, silk_overlap and items_not_allowed (only the line that names the floorplan region rule FLOOR-4, a part outside its region, and no other custom rule that reports that type), and seven further names that the main board's check reports: pour_gap, decoupling_via, starved_thermal, silk_over_copper, footprint_symbol_field_mismatch, footprint_symbol_mismatch and lib_footprint_mismatch, nineteen names in all. side_fiducials is not in the set: the missing back-side fiducials are not accepted, the parts that cause them move to the front. The seven are assembly-yield and schematic-to-board parity-text items (a pour that stops short of its own net's copper, a via between a decoupling capacitor and its pin, a thermal relief with too few spokes, silkscreen clipped by the mask, and fields, attributes or a library copy that differ between the board and the schematic or library), none of them a mains, creepage, clearance, derating, pin-limit or safety rule, and each of them leaves the copper, the fitted part and the bill as they are. Each is accepted by place, with a count, by a signed entry, and never by class: an entry for one of them excuses that rule at that place up to its count and nothing else. KiCad's own names (starved_thermal, footprint_symbol_field_mismatch, footprint_symbol_mismatch, lib_footprint_mismatch) and silk_over_copper are not yet rows of the hardware notes' rule table; the build adds their rows. The record never accepts hole_to_hole, whose shortfall DEC-BOARD-PRE-ORDER-RULE-READINGS accepts only by a same_connector_pins entry of the separation basis record, because the owner can vouch for a connector's use but not for an arbitrary pair; never workmanship_rule, workmanship_figure or workmanship_pad_copper, which report a rules file, a figure or a pad the check cannot measure, so there is no measured line to accept; and never any mains, creepage, clearance, derating, pin-limit or other safety rule.
  - Fail closed. An entry fails the check, naming it, when it is unsigned (the accepted-by value empty, a placeholder or in angle brackets) or its date is empty, malformed or later than today; when its rule is not a workmanship or neatness rule of the check; when it covers a place the design does not have; or when no line uses it, so that it is stale. Rules that carry safety, mains spacing, derated-voltage or pin-limit findings are not accepted through this record, since they have their own exception forms or none, and an entry naming one fails.
  - Signing. Nothing in the check signs an entry; an entry is the owner's, and a drafted entry stays unsigned until the owner signs, and the check fails an unsigned entry. The owner may sign by his written standing instruction carried out by Claude, in which case the accepted-by value says so in words (for example 'david (signed by Claude on his standing instruction of 2026-11-07)'); the check reads that value as signed, since it is neither empty, a placeholder nor in angle brackets, and the instruction itself is recorded in the decision of residual risks.
  - Proof designs. The throwaway proof design gains synthetic entries where a test needs them, with a seeded fault caught for each failure above. The hardware notes state the entry form, the ACCEPTED line and the failures.

  Out of scope: which lines of any board are accepted, the owner's signing of any entry, the rules' thresholds and measures, any change to a board's design files, and the safety, mains-spacing and derating exception forms.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C5 asks of the workmanship rules: a failing workmanship item is resolved by a change to the board or a recorded finding that it is overridden, never by judging the failure unimportant. The check can record an override for spacing and derating but not for workmanship, so an owner-accepted workmanship line can only be left as a failure that the check cannot distinguish from a defect. A scoped, signed, fail-closed record gives the check the same footing for workmanship that it has for spacing, without the agent signing for the owner.

  The closed set grows by seven names because the main board's remaining lines of those rules are assembly-yield or parity-text items whose correction would move parts or locked ground copper on a full board for a risk lower than the move carries; the owner's standing instruction of 2026-11-07 accepts such items by place on a stated ground, and an acceptance by place and count still fails a new line of the same rule elsewhere.
