id: SOL-SEPARATION-BASIS-SIGNS-MAINS-TO-MAINS-SPACING-AND-EXCEPTIONS
type: deliverable
category: solution
title: The separation basis record signs the machine's mains-to-mains spacing and the owner's accepted spacing exceptions
status: active
version: 5
text: |
  Writes the machine's signed mains-to-mains spacing and the owner's accepted spacing exceptions into the separation basis record, in the form the separation-basis decision sets, and brings the records that restate the mains-to-mains distance into line. The record signs one pair today, mains to low voltage, and the board division record holds mains copper to 3.0 mm straight and 5.0 mm by surface path as a conservative upper bound because the basis gives no figure of its own. This leaf replaces that bound with figures read for the machine's inputs, and records as exceptions the shortfalls the owner has accepted instead of leaving them as unreadable prose.

  Settled for the build:
  - Inputs are those the record already signs: 253 V rms, overvoltage category II, pollution degree 3, material group IIIa, on the ground that the main board's fabrication notes require a laminate with a comparative tracking index of at least 175 (see the material-group criterion) and 2000 m. The figures read from them are clearance 1.5 mm between conductors at different mains potentials, 2.0 mm between the terminals of a part, and creepage 4.1 mm both ahead of the entry fuse F101 and downstream of it.
  - Clearance 1.5 mm is the 2.5 kV row of the insulation-coordination standard's clearance table (Table F.2). The 2.0 mm terminal figure adds 0.5 mm for movement and assembly, which the household-appliance standard's Table 16 footnote gives as reproduced in two certification reports; that reading and the clause are the drafter's and unverified against the standard's text.
  - Creepage: 253 V lies between the 250 V row (4.0 mm, basic, pollution degree 3, group III) and the 320 V row (5.0 mm) of Table F.4. The record carries one derived row at 253 V, the linear interpolation 4.0 + 1.0 x 3/70 = 4.04 mm, citing both rows (per the 2007 edition, rows as read from reproductions). IEC 60664-1:2007 clause 5.2.4 allows linear interpolation for intermediate voltages and rounds the result to the same number of digits as the table values, which gives 4.0 mm; the record signs 4.1 mm, rounded up, a deliberate design margin of 0.1 mm over the standard's result, not the standard's figure. The mains-to-low-voltage 10.0 mm figure was read from the 320 V row (5.0 mm doubled) and stays: it is the larger, and is unchanged. The household-appliance standard's functional row for 320 V is not in the sources read, so no functional figure is derived: the basic figure applies downstream of F101 as well as ahead of it, until the owner has a stated basis that F101 clears a tracking fault between the pair, when a lower downstream figure may be signed.
  - The pair across the open interlock contact, LINE and LINE_IN against LINE1, stays at the signed reinforced 3.0 mm and 10.0 mm, recorded in held_at_reinforced, with no credit for the relay's own contact gap.
  - The accepted exceptions are the owner's, each naming the one pair of pads or nets it excuses, which the entry writer reads from the main-board layout. Mains to mains, against the terminal figure: the triacs T701 and T711, lead-pad to lead-pad (pin 2 against pin 1 or pin 3; the tab is not the shortfall), 1.08 mm; the shunt R105, 1.65 mm; the 1206 series resistors, 1.8 mm. Mains to low voltage, creepage: U601 at 8.0 mm and U701 and U711 at 7.0 mm, the owner's recorded acceptance of bought-part creepage under the board's 10.0 mm figure. The resistors are named by reference from the main-board schematic when the entries are written. The drafter proposes each reason and bounding element for the owner to accept or correct in the acceptance leaf.
  - The build delivers the drafted record and stops there. The record's own accepted_by and accepted_on, and every exception entry's, are left empty, so the check's reader finds the record unsigned. The record in the tree today carries an acceptance entered earlier on the owner's instruction; this leaf blanks it, because the figures it covered are replaced and the owner has not yet seen the new ones. The owner's acceptance is not this leaf's: the owner-acts acceptance leaf that depends on this one enters it, and this leaf closes on the drafted record being delivered. The test reads the committed record through the check's own reader, never a second validator, and never writes acceptance values into the record.
  - The entry values are drafted from the schematic and the division record. Confirming each against the finished main-board layout belongs to the main-board layout leaf's pre-order criterion, and the entries stay drafts until that layout exists.
  - Mains copper against the earth-bonded metal wall or bracket (the division record's basic mains-to-earth pair) is not a mains-to-mains pair and stays outside this record, but it takes its basic creepage from the same interpolated row, 4.1 mm, so the division record states one row selection.
  - Out of scope: the owner's acceptance of the record, the mains-to-low-voltage figures, barriers and inputs, which this leaf leaves unchanged, the exceptions of the derating rule, which the board check does not hold, and the bought parts K201, K731, K741 and U602, which their own leaf judges.
rationale: |-
  Restores the behaviour REQ-ELECTRICAL-INSTALL-001.C15 and .C16 ask: the spacing between mains conductors is signed with the basis, and every accepted shortfall is the owner's signed exception. The 3.0 mm and 5.0 mm bound the division record uses was chosen as conservative because no figure was signed, and several parts' geometry cannot meet it; reading the figures for the signed inputs and signing the accepted shortfalls replaces a bound nothing could meet with figures the check can hold.
   The owner's acceptance cannot be entered by a build, so it is split out as its own owner-acts leaf and this leaf closes on the drafted record.
