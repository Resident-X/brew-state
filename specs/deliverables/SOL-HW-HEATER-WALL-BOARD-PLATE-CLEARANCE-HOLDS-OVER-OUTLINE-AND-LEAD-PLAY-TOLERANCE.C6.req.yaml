text: |-
  The wall-assembly thermal judgement is re-run from its margin script at the plate height the case takes, with the plate's own conduction recomputed for that height, and every case holds the maker's junction limit. Out of scope: the bolted joint's measured resistance, which the bring-up measurement closes.
