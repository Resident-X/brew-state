id: DEL-CONTROLLER-HARDWARE.C13
type: criterion
title: The ceiling on the proof-of-life removal interval is derived from the held casting peak and the chosen interval is shown under it
status: active
version: 2
measurement_type: binary
verification: analysis
closes_by: cascade
text: |
  The time a heater takes to reach its retained protection's trip point, starting from the hottest its casting reaches while the control is holding it, is derived as the ceiling on the proof-of-life removal interval, and the controller boards' figures record shows the chosen interval below it, before mains is first connected to the boards.
