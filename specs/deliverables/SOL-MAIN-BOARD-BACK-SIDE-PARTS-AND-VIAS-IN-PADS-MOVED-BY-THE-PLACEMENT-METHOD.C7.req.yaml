id: SOL-MAIN-BOARD-BACK-SIDE-PARTS-AND-VIAS-IN-PADS-MOVED-BY-THE-PLACEMENT-METHOD.C7
type: criterion
title: The seven clamps are connected on the board to their former nets, add no check or rules line, and the re-routed critical copper is locked and recorded
status: active
version: 1
measurement_type: binary
verification: test
text: |
  After the move and swap, the pads of D502, D504, D506, D523, D524, D527 and D528 are connected on the board and not only in the netlist to the nets they were connected to before (GND, the supply, and the signal node: NTC_COF for D502, NTC_STM for D504, NTC_WAND for D506, and the steam and brew I2C bus nodes for the other four), checked from the board file's copper; the new routes add no pre-order check line and no KiCad rules line beyond the baseline of the board before this item; and the locked critical copper they re-route, the NTC_COF, NTC_STM and NTC_WAND critical copper and any other locked copper at the seven clamps, is re-routed with the copper lock and a fresh copper record covering it. No signed mains, derating or separation figure changes and no mains copper or mains pour is touched or moved by any of the seven clamp changes, and the re-derivation of the clamp records relaxes no figure; the ground via inside pad 1 of D523 stays where it is, on GND, and is not moved by this item. The test fails on a pad of any of the seven joined to a different net or left unconnected, on a new check or rules line, on re-routed critical copper outside the lock or the record, on any mains copper or pour that differs from the board before this item, and on the D523 via moved or on a different net. Out of scope: R301, the copper lock for any other net, the question whether that via should leave the pad (the sibling vias-in-pads item owns the decision), and lines the baseline already carries.
