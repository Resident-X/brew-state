id: SOL-HW-REVIEW-FAN-OUT-PRODUCTION-FILES.C6
type: criterion
title: The production-files declaration grants read tools only and sets the replicas, time budget and bound, and the start report is checked against the grant
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Over synthetic declarations and a stub executor, the production-files declaration grants a reviewer the read tools only and no retrieval tool; sets three replicas, the full and hunt framings on the mid-tier model and the third on the small-tier model; sets the time budget at 350 seconds and the bound on reviewers at once at 30; and the kit's check of the start report against the grant fails a run whose reviewer holds any other tool. Out of scope: a live session.
