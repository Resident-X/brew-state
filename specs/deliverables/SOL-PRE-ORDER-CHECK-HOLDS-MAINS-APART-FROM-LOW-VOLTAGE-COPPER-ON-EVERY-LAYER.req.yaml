id: SOL-PRE-ORDER-CHECK-HOLDS-MAINS-APART-FROM-LOW-VOLTAGE-COPPER-ON-EVERY-LAYER
type: deliverable
category: solution
title: The pre-order check holds Mains-class copper apart from low-voltage copper on every copper layer, round the barrier slots and clear of their walls
status: active
version: 2
text: |
  Adds to the pre-order check a rule that holds Mains-class copper on every copper layer apart from every other net's copper on every copper layer. KiCad's design rule check compares copper on the same layer only, so inner-layer low-voltage copper (a ground plane, a ground fill, signal tracks) can sit directly under, or within the signed distance in plan view of, mains copper on the surface, or beside a barrier slot's wall, and no existing rule flags it; a single ply of prepreg between two layers is 0.21 mm and is not reinforced insulation. The rule closes that gap for the signed mains-to-low-voltage figures. It judges and fixes no layout.

  Settled for the build:
  - Items. A Mains-class item is a pad, a track, a via or a pour of a net in the Mains class. A low-voltage item is every other copper item of the board: a pad, a track, a via or a pour of any other net, and a copper item with no net. A pour is its filled polygons as the layout file stores them, and a zone that stores no fill on a layer is counted by its outline there. A plated through hole (a through-hole pad or a via) is copper on every copper layer. Items are taken on all copper layers, surface and inner, and each pair is one Mains-class item and one low-voltage item on any two layers, the same layer included only where KiCad's own rule does not already report that pair.
  - The three tests, each against the figures of the record's mains_to_low_voltage mapping, read through the existing reader. (1) Plan-view clearance: the straight-line distance between the two items seen from above, layers ignored, is at least clearance_mm (3.0 mm at the committed record). (2) Plan-view creepage: the shortest path between the two items in plan view that does not cross a barrier slot is at least creepage_mm (10.0 mm at the committed record); a barrier slot is a closed cut-out inside the board outline on the outline layer that is not a round hole, and the path goes round its ends. (3) Overlap: a low-voltage item that overlaps a Mains-class item in plan view, on a layer other than the Mains-class item's own, fails whatever the distances are. A separate pull-back test holds every inner-layer copper item of any net at least 1.5 mm from the wall of every barrier slot, because the wall is exposed glass fibre; surface copper is left to the existing rules. The board's thickness is not added to any distance, so the plan-view figure is the conservative one.
  - Exceptions. A pair of pads of one part, or two nets, that a between entry of the record names with pair mains_to_low_voltage is judged on the cross-layer distance by that entry as the layout rule check's shortfalls are: accepted at or above the entry's accepted_mm and a violation naming the entry when less. No other pair is excused, and an entry no reported shortfall uses still fails as the check fails it today.
  - Reporting and closure. The rule is named mains_layer_separation. A failure names the two items, their layers and nets, the test (clearance, creepage, overlap or pull-back), the measured distance and the figure it falls short of. A design that declares MAINS present and whose record lacks the mapping, or whose Mains class cannot be resolved, fails closed under the existing names; a design that declares none is exempt as the other mains rules are. The rule runs inside the existing one-run limit on a board with poured planes.
  - Records and proof. The hardware notes gain a rule row and say that KiCad compares same-layer copper only. The seeded-fault rows of the proof run (the rows of board_prove.py) gain one fault each on a throwaway copy of a proof design, never on a tracked design: a ground plane on an inner layer under surface mains copper, a low-voltage track on an inner layer within the clearance in plan view, a path round a slot shorter than the creepage, inner-layer copper within 1.5 mm of a slot wall, and an overlap of a low-voltage pour with a mains pad on another layer. The shared KiCad fixtures gain a proof layout with inner-layer copper. Tests run on temporary directory copies of proof designs and carry the criterion text.
  - Out of scope: pairs of two Mains-class items (the mains-to-mains rules hold them); fixing any layout, including the main board's planes; the figures of the record; and creepage across the board's thickness.

  Placement, settled for the build: the rule extends the existing item model and geometry and builds no parallel one. It reads the same copper pieces the other mains rules read (board_check.copper_pieces and Piece: every track, arc, via, pad and stored zone fill as a polygon outline with its net and layers, plated holes on every stack layer) and the stored fills (zone_fills), and measures with board_geometry.polygon_distance, segment_distance, swept and disc, as mains_barrier and the mounting-hole rule do. What it adds: a reader for netless copper zones (a pour with no net, told from a keepout by its keepout clause), the loops of the board outline (edge_loops) and the barrier slots among them, and an exact path length round slot vertices. A zone with no stored fill on a layer is counted by its outline on that layer, as the existing pieces do. The cross-layer shortfalls are computed before the signed exceptions are judged and handed to judge_exceptions as extra shortfalls in KiCad's description form, so an entry used only by a cross-layer pair is not reported unused. Only pairs whose stored copper layers are disjoint are judged here, since KiCad judges pairs that share a layer.
rationale: |
  Restores the behaviour OBL-ELECTRICAL-THERMAL-SAFETY-001.C6 and .C7 ask of a board: mains-referenced copper is isolated from low-voltage copper by the signed distances on every layer, not only the layer a design rule check compares. An independent review of the main board's package found that the mains-to-low-voltage figures are checked on the same layer only, so inner-layer ground planes and fills and inner signals can sit under or beside mains copper, or a barrier slot, with no flag. A rule that measures every Mains-class item against every other net's copper on all layers, with the slot wall and overlap tests, makes the signed figures mean what the basis says.
