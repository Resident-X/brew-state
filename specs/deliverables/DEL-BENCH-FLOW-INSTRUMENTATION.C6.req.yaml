id: DEL-BENCH-FLOW-INSTRUMENTATION.C6
type: criterion
title: The fitted suction-line meter leaves the pump enough margin to prime and deliver
status: active
version: 2
measurement_type: threshold
verification: test
closes_by: cascade
text: |
  The fitted meter, already installed on the coffee pump's own suction line rather than pending
  insertion, leaves that pump enough priming and cavitation margin to prime and deliver -- established
  by measurement now that the machine already runs in that configuration, rather than as a check
  before some future adoption. The line is fed from a tank rather than a pressurised supply, and a
  vibratory pump is sensitive to restriction ahead of it, which is why this cannot be assumed from the
  fitting alone. Measuring the cost without requiring it be acceptable would trade a measurement
  problem for a delivery one.
links:
