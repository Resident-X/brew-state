id: SOL-HW-REVIEW-KIT-SESSIONS-HOLD-ONLY-THEIR-GROUP-IMAGES.C12
type: criterion
title: A group's root holds only its group's views and the proof harness records a fanned-out run under a new key without editing a baseline
status: active
version: 2
measurement_type: binary
verification: test
text: |-
  A test over a synthetic declaration proves that each group's root holds only the views that group's units declare, and that the proof harness refuses to record a fanned-out run whose key is already recorded and records one whose key differs by adding it to the run record without editing any baseline. Out of scope: a model call and any change to the proof design or its baselines.
