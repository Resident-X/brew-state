id: DEL-HW-MAIN-BOARD-DESIGNED.C5
type: criterion
title: Every load the board switches is held off while the controller is in reset, unpowered or disconnected
status: active
version: 1
measurement_type: binary
verification: inspection
closes_by: cascade
text: |
  The design holds each heater switch, pump and valve drive off without firmware acting, while the controller's supply is rising or failing, and when a cable to a load's switch comes loose.
