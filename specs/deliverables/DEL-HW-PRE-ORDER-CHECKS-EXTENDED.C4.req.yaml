id: DEL-HW-PRE-ORDER-CHECKS-EXTENDED.C4
type: criterion
title: A part whose net can exceed its derated voltage rating fails the check
status: active
version: 1
measurement_type: binary
verification: test
closes_by: cascade
text: |
  The rating comes from the parts specification record's rating field and the derating share from the board's declared derating policy. The working voltage is the highest the part sees in service: for a part on a mains-referenced net, the peak of the supply at the top of the declared span; for any other part, the highest rail its nets connect to.
links:
