id: SOL-HW-REVIEW-FAN-OUT-CALLER-SEAM
type: deliverable
category: solution
title: The review fan-out driver carries a retrieval grant, a prompt that sees the review folder, a per-folder checklist and a rendered record for the callers
status: active
version: 5
text: |+
  Why this exists. The driver SOL-HW-REVIEW-FAN-OUT-DRIVER is finished and has no caller, and building the layout caller showed that four things a caller needs have no place in it as built: a reviewer's grant is limited to the read tools, so the read-only retrieval of a published document that a rule-kind item or a datasheet needs is refused at load; a reviewer's prompt is given the unit and not the review folder, so it cannot name the round's listed items or the board's own items; the checklist is a fixed list fixed at load, so a checklist that is the catalogue's items plus the board's plan rows and a free pass cannot be stated; and the merge writes only the table form of the record, so a caller whose record is a document has no place to write it. The layout, schematic, critical-routing and production-files solutions each need some of the four. They are requirements of the driver as the shared seam, not a defect in work the driver's criteria asked for, so they are built once, here, before the callers. The reasoning for the mechanism is in DEC-REVIEW-FAN-OUT-BY-UNIT-FROM-SHARED-SETUP and DEC-FANNED-OUT-ROUND-IS-THE-SAME-ROUND, and a session building this does not reopen either. This is the sixth solution under DEL-HW-REVIEW-FAN-OUT and is built before the layout, schematic and production-files solutions.

  What it does. It extends the driver's caller definition with three optional attributes (the retrieval grant, the checklist as a function and the rendered record) and one required change (the reviewer prompt takes the review folder), and a caller that supplies none of the three optional attributes behaves exactly as before. No caller exists yet, so the required change costs nothing outside the driver's own synthetic test callers.

  Settled before the build.

  - Retrieval. The driver names one read-only retrieval tool beside the three read tools, WebFetch, which fetches a published document at an address and writes nothing; it is the only tool the driver accepts that sends a request out, and what it sends is a request for a document. A caller may grant its reviewers the read tools alone or the read tools and that one tool; any other tool is refused at load as now. The setup turn that reads the review's documents keeps the read tools alone, so it fetches nothing. The one unit judged in a second turn of the setup session is given the caller's tools, as the driver's settled text has it, so its start report is checked against the caller's set and each forked reviewer's against the same set. DEC-REVIEW-FAN-OUT-BY-UNIT-FROM-SHARED-SETUP names the read tools the proofs grant and lists read-only retrieval of a document from a fork as not yet measured; this grant is that retrieval, and the layout caller's proof run measures it.
  - The review folder in the prompt. A caller's reviewer prompt function takes the unit and the review folder, both required, so it can read the round's own fields and listed items from a file the starter wrote there. The driver checks the function's signature at load and refuses one that does not accept both, naming the attribute and the caller; the driver's synthetic test callers gain the folder argument and nothing else changes in them. The driver reads no file from the folder and names none; what the folder holds is the caller's and the starter's. Where the driver refuses or fails a run for a caller's attribute, it names the caller by the name given to the command's caller option, as well as the attribute or unit.
  - The checklist. A caller's checklist is either the list it is now or a function of the review folder, resolved once per run, from the review folder, after load and before the setup session starts, so a function that raises costs no session; the per-unit checks that drive the one further run of a unit and the merge use that same resolved list, and a rerun of named units resolves it again from the folder. The merge treats the resolved list as it treats a list: it refuses a finding whose item is outside it, and orders the findings by it; which items must have a verdict stays a check the caller makes, as now. So a caller whose checklist places the board's plan rows and the free pass after the catalogue's items gets those findings numbered after the items' own.
  - The rendered record. A caller may supply a function of the review folder and the merged tables that returns file names with their text. After the merge the driver writes each into the output folder beside the record in table form, accepts a name only if it is one plain component of ASCII letters, digits, full stops, underscores and hyphens that begins with a letter or digit and ends in neither a full stop nor the suffix the driver gives its own scratch files, is at most sixty-four characters long and is not a name the Windows file system reserves for a device (such as CON, PRN, AUX, NUL, COM1 to COM9 and LPT1 to LPT9, with or without an extension), so that no name reaches another file by a path, a letter case, a trailing character or a Unicode-normalisation alias; it refuses a name that, compared without regard to case, equals a name the driver itself uses in the output folder (its record, rerun list, per-unit, failed and unsettled folders and its lock) or another name rendered in the same merge, and a name the output folder already holds unless an earlier merge wrote it and it is still a regular file, which the driver knows from a list of rendered names it keeps in the record it writes. It calls the function before writing anything; if the function raises, it still writes the record in table form, its report names the files of the earlier merge as not of this merge, and the run fails naming the caller. Whenever a merge does not render a file that an earlier merge wrote and the folder still holds, including every such file when the caller no longer defines the function, the record and the report name that file as not of this merge, and the driver tells an earlier merge's file from another by the exact name the earlier record lists, never by a comparison that ignores letter case. The driver names the rendered files in its report, in text and in JSON. A caller that supplies none writes nothing more.
  - The proof the driver has is kept: the driver's existing tests pass unchanged, the new tests use the driver's stub over synthetic callers and synthetic review folders, and need no model and no KiCad.
  - The driver's module description, the hardware notes and the command's description name the four attributes (the retrieval grant, the review folder in the prompt, the checklist as a function and the rendered record) where they list what a caller defines. The hardware notes also state which names a rendered record may carry, and the retrieval grant's risk and why it is bounded: the grant lets a reviewer send a request for a document and a fetched page is text the reviewer did not write, and it is bounded because reviewers write nothing, the setup session fetches nothing and every verdict is checked structurally at the merge.

  Out of scope: any caller; what a retrieved document is or whether retrieval works from a forked reviewer, which the layout solution's proof run measures; the merge's other rules.


