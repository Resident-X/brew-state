id: SOL-BOARD-REVIEW-LOOP-PROPORTIONATE
type: deliverable
category: solution
title: 'The layout review loop is proportionate: a fix is re-reviewed narrowly, only a full round closes it, the designer fixes the class, and a recurring nit becomes a measured rule'
status: active
version: 3
text: |
  Why this exists. A fresh session followed the board design method to a throwaway design, and its layout review took seven rounds of about twenty minutes each, rounds 3 to 5 each finding one silkscreen designator nit in a different place. The method as it stands judges the whole checklist again after any change (SOL-BOARD-LAYOUT-REVIEW-FEEDS-RULES.C3), and the designer fixed the one instance a reviewer named, so the next fresh reviewer found a neighbour. The designator nit has no figure to source: a designator inside a courtyard or off its part is an inherent zero, like DECOUPLE-6 and MFG-7, so a measured rule can state it and SOL-BOARD-METHOD-FOLLOWABLE-AND-MACHINE-FREE.C4's no-source case does not apply.

  What it does. Makes the loop proportionate without weakening what closes it. After a fix a fresh reviewer may judge only the items the change touches, while only a full round closes the review, and the review record's check refuses a closing round that is not full. The designer, before the next round, sweeps for every instance of a finding's class and fixes them together. A recurring cosmetic nit that a measurement can state becomes a measured rule, so a reviewer never sees it.

  Settled before the build. A board judged failing is not ordered and a review closes only with no finding open, both unchanged. Carrying cosmetic findings was considered and deferred, because it would amend REQ-BOARD-LAYOUT-PRACTICE-001.C1 and contradicts SOL-BOARD-LAYOUT-REVIEW-FEEDS-RULES.C3; it is taken up only if cosmetic nits still recur after the class sweep and the measured rule. A quality only a measured rule could state which a closed proof design already breaks is answered by amending that proof and running one more round, not by a new item kind. The narrow round supersedes only the wording of SOL-BOARD-LAYOUT-REVIEW-FEEDS-RULES.C3 and .C1 that requires the whole checklist and a full set of verdicts in every round, through successor criteria SOL-BOARD-LAYOUT-REVIEW-FEEDS-RULES.C5 and .C6 in the same change. A finding of safety severity is not touched. The designer must not write what the reviewer owns.

  Out of scope: the review's views, the catalogue's other items, the pre-order check's other rules, and carrying cosmetic findings.
