id: SOL-PLANT-STEAM-FLASH-GENERATOR.C7
type: criterion
title: The feed holds pressure and heater power holds a declared superheat setpoint, and no pressure loop drives the heater
status: active
version: 1
measurement_type: threshold
verification: test
text: |
  During a draw the steam control law drives the feed pump to hold measured pressure inside the declared band and drives heater power to hold the modelled outlet superheat at a declared setpoint carrying its origin; no loop takes pressure error into the heater command. In host simulation, closing the loop through the truth plant, a test shows: pressure stays in band for the whole of a draw, from the first steam actually delivered, of any duration within the declared model-error tolerance, the controlled variable being temperature while idle and pressure while a draw is open; superheat stays at or above its setpoint for the whole draw; and perturbing heater power changes superheat while leaving the pressure loop's feed command the sole pressure actuator. The existing steam control law and declaration are extended in place rather than a parallel loop built. The law reads no demand value. It forms its own estimate of the outlet superheat from the casting temperature, the measured pressure through the declared saturation relation and the feed it commands, through a declared casting-to-outlet relation carrying its origin and error, and reads nothing from the truth plant; the test judges the estimate and the held superheat against the plant's quantity of C6. Each loop withholds integration while its actuator is pushed past its limit, and holding either at the limit and then removing demand produces no overshoot attributable to that interval, so SOL-SIM-ROBUSTNESS-ACTUATOR-LIMIT-BEHAVIOUR-DESIGNED.C1 keeps its meaning for the steam loop. Does not cover: the feed-withhold-below-ready behaviour itself, which stays the readiness gate's (C12 holds it coherent here), and the casting margin in every phase, which DEL-CASTING-MARGIN-HELD-IN-EVERY-PHASE owns.
