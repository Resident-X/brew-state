id: SOL-HW-REVIEW-PROOFS-RUN-A-SECOND-FANNED-OUT-RUN
type: deliverable
category: solution
title: The proof commands run the fanned-out form a second time when the kit's pooled criterion requires one
status: active
version: 1
text: |
  Why this exists. SOL-HW-REVIEW-KIT.C12 has the kit's pooled criterion require a second fanned-out run when the first is within ten per cent of a bound, and the kit judges any number of fanned-out runs together. The proof commands each passed the kit exactly one fanned-out run, so a first run near a bound could never be resolved: a second invocation was judged alone and asked for a second run again. The seeds found by a fanned-out run that sits exactly at the single run's floor are always within ten per cent of that floor, so a proof whose fanned-out run found every seed the single run found could never be accepted.

  What it does. The shared proof harness runs the fanned-out form once and judges it; only when the kit's verdict requires a second run does it run the form a second time, in its own output folder and under its own run id, and it returns both runs, which the command records and the kit judges together. It never runs a third. The schematic, critical-routing, production-files and layout review proof commands make their fanned-out runs through it, and their dry runs say a second run may follow and count its cost and time as up to twice the first's.

  Out of scope: the figures of any one proof's runs, which are that proof's own demonstration.
