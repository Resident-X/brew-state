id: DEL-HW-INTERLOCK-INTERVAL-DERIVED
type: deliverable
category: task
title: The first-trip ceiling on the proof-of-life removal interval is derived and the chosen interval is shown to sit under it
status: active
level: task
version: 2
text: |
  The ceiling on the proof-of-life removal interval is the time each heater takes to reach its retained protection's trip point, starting from the temperature its casting reaches under the corrected control, the shorter of the two setting it. The controller boards' figures record carries the ceiling and shows the chosen 100 ms interval below it. The derivation is an analysis over the regenerated peak casting record. It is not board design and needs no board to exist, and the board designs do not depend on it; bring-up does, because it gates the first connection of mains.
rationale: |
  The ceiling checks the chosen interval; it does not set the timing of the interlock's circuit, which is designed to the chosen 100 ms recorded by DEL-HW-INTERLOCK-INTERVAL-CHOSEN. Holding the partition and every board's design until the control that keeps the castings below their trip points has been corrected and re-simulated would tie the first schematics to an unrelated simulation programme, and a short interval is safe only if it sits under the time to the hazard, which is a check, not a design input. Giving the ceiling its own task keeps the dependency where the figure is used: bring-up.

  A ceiling taken from a control that lets the casting pass its trip point would understate the hazard, so the check waits for the corrected control.
