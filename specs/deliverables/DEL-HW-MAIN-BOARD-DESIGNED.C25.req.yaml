id: DEL-HW-MAIN-BOARD-DESIGNED.C25
type: criterion
title: A single fault in the interlock removes heater power, leaves its hazard bounded by an independent element, or is detected
status: active
version: 2
measurement_type: binary
verification: analysis
closes_by: cascade
text: |
  Each part of the interlock (its switching contact, its coil, its drive and the parts that feed the drive) is taken in turn as failed in each way its kind can fail, open, short or stuck, and the design shows that the outcome is one of: heater power removed; the hazard the interlock guards against still bounded by a named element of the chain that is independent of the failed part and of the controller; or the fault detected by the chain's own means before a second fault can combine with it, the machine then being held from heating until a person attends. Detection never rests on the controller or its firmware noticing. A fault that leaves the interlock looking healthy while no independent element still bounds the hazard is the case this excludes.
