text: |
  Each defect and maintenance item grouped under this lane reaches an end-state in which the behaviour it restores is evidenced against the requirement criterion it targets. The lane's own state composes by cascade over its contributing tasks and solutions, so the lane reports rolled-up progress without being a unit of work in itself.
