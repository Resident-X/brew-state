id: SOL-PLANT-STEAM-FLASH-GENERATOR.C12
type: criterion
title: A wand opened at the ready pressure is not starved by the feed-withhold gate under the orifice law
status: active
version: 1
measurement_type: binary
verification: test
text: |
  The feed-withhold gate and the pressure loop agree on the threshold. The gate judges the trusted pressure of the shut block at the moment the wand opens and holds that verdict until the wand shuts: a wand opened at or above the declared ready pressure is fed from its first step, at the draw-start level of C10, and holds the draw in band from the first steam actually delivered rather than collapsing to zero because the instantaneous pressure under the orifice law sits below the threshold, and a wand opened below it is starved for the whole draw, its feed staying at zero throughout. A test in host simulation opens the wand at the ready pressure and at just below it, and shows the first case delivers in band while the second is starved. The gate stays a proxy for the predictive readiness decision. Out of scope: replacing the gate with predicted readiness, which DEL-READINESS-PREDICTED-IN-BAND owns. Every standing closed-loop steam test runs the loop against the truth plant at its declared initial inventory, and the sealed readiness-gate criteria that stay true keep their meaning.
