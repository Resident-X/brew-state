id: SOL-HW-CONTROLLER-BOARDS-ORDERED.C10
type: criterion
title: On the order date each board's catalogue extract is read again and re-dated before payment
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  On the order date, before payment, each board's catalogue extract is read again from the manufacturer's catalogue and re-dated, so the check that gates payment judges stock and lifecycle read that day and not at the design's lock; a part the new read shows out of stock or past its lifecycle is brought to the schematic leaf as an amendment before the board is ordered. Placing the order is out of scope.
