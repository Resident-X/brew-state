id: DEL-SIM-BREW-LOOP
type: deliverable
category: epic
title: The coffee side holds its targets in simulation across both deliveries it serves
status: active
level: epic
version: 5
text: |
  In simulation against the plant description, the coffee side holds both of the deliveries it serves. Water arriving at the group tracks the commanded temperature for a whole extraction from whatever thermal state the preceding demand left behind, hot water is dispensed within the drinking-temperature band with rate yielding to temperature, and contention between the two for the shared heated mass is resolved by the machine. The commanded course is acted on before its effect reaches the water rather than after the error it
  leaves behind, so the loop is exercised against a known future input rather than as a reactive loop
  that happens to pass a nominal test. Deliveries the machine ends are commanded as a profile carrying
  its own end condition, refused before starting if they cannot be achieved, and reported on when they depart from what was asked.
rationale: |
  The coffee side is the constrained side of this machine: it serves both espresso and hot water from one heated mass and runs close enough to its protection trip point that the margin is thin. Both deliveries are demonstrated together rather than separately because the hard part is neither of them alone — it is the contention between them, which no split that puts them in different units of work would exercise.

  Hot water belongs in simulation rather than being met first on energised hardware. It is the heaviest sustained demand the machine takes and it asks for a large volume with no opportunity to recover partway, so the trade it forces — rate yielding to temperature — is exactly the kind of decision that is cheap to get wrong here and expensive to get wrong later. Leaving it out would also have left an inconsistency, since holding brew temperature after a hot water draw already requires the draw itself to be modelled and commanded.

  The profile command surface is built with the temperature loop rather than separately because a commanded course is what the loop tracks — a controller demonstrated against a single held setpoint would not have been exercised against the thing it will actually be given. It also changes what the controller knows: a commanded profile is a known future input rather than demand estimated as it arrives, so the loop is to be exercised with that feedforward coupling live rather than as a reactive loop that happens to pass a nominal test.
