id: SOL-HW-REVIEW-FAN-OUT-LAYOUT
type: deliverable
category: solution
title: A task fans a layout review round out by coupled catalogue areas from one shared context and merges the areas into one round of the review record
status: active
version: 4
text: |
  Why this exists. The layout review judges sixty-nine items in twelve catalogue areas, one reviewer in one context, and took about twenty minutes a round in the run recorded in SOL-BOARD-REVIEW-LOOP-PROPORTIONATE; its blind proof repeats that on a seeded copy. The reasoning, measurements and options rejected are in DEC-REVIEW-FAN-OUT-FROM-SHARED-CONTEXT-WITH-REPLICAS, and DEC-FANNED-OUT-ROUND-IS-THE-SAME-ROUND settles that a round judged by unit is the same round; a session building this does not reopen either. This is the second of five solutions under DEL-HW-REVIEW-FAN-OUT. It adds the layout review as the first caller of the kit as a declaration and a small module of checks and a rendered record for the review kit SOL-HW-REVIEW-KIT, which carries the sessions, the planner and the merge, and is where the figures behind the decision are checked at the layout review's full unit count.

  What it does. A layout review round, full or narrow, is judged by forks of one shared context, one group per set of coupled catalogue areas, one for the board's own items and one for the comparison with the plan and the free pass, each group by two differing forks merged so that any fail stands, and the merge writes one round of the board's review record.

  Settled before the build.

  - The units are the area headings of the layout practice catalogue in the review folder's own method, the board's own items from the plan's table when it has rows, and a unit of its own for the comparison with the plan and the free pass over every view, which belong to no one area. The declaration states which units are coupled, because one's verdicts can rest on another's finding, as the catalogue's own cross-references show for power and mains and for the manufacturing items and power, and a coupled set is judged in one group; a coupling is declared only where one area's verdicts depend on another's findings, as the run that lost a mains seed to the power area showed, and a test fails when a declared coupling has no supporting cross-reference in the catalogue; a cross-reference alone is a mention and not a dependence, since the cross-references link nine of the twelve areas and would make one group of them. The Planning shortfall entry for a finding is written by the unit that raised it, from the plan row and never from the designer's reasoning, as the method says; after the merge the designer names the item or step to amend, amends it and adds the commit.
  - A narrow round's units are the groups its listed items fall in, and each fork judges only the listed items of its group; a narrow round that falls in one group is judged by a fork of the shared context like any other. A narrow round never closes a review, as the method says.
  - The round's own fields, its number, kind, the commit judged, the views and the pre-order check's lines, are inputs from whoever starts the round, since the merge has no model. The folder command takes them, and for a narrow round its listed items, the reason for each, the changed regions named from the fix commits and the line saying why every other item is not judged, as arguments and writes them into the review folder as one round file; the caller's prompts and merge read that file through the review folder the kit passes them. The set of round fields is a parameter of the folder command, the layout round's being those above, so that another review's round, whose pass has no kind or check lines, names its own set. The merge checks them for presence and form and writes the opening lines the method gives. The rendered round is appended below the record's earlier rounds, and whoever started the round commits it at the end of the round, before any board change, as the method says of a round.
  - The shared context holds everything any unit may need: the method's layout review section, its views section and the whole layout practice catalogue, the plan, the rules table and the records those name, the round file, the check's report, the view and placement indexes, every rendered view and the placement view as an image, and a layout-facts extract that the folder command writes from the board file (positions, pads, segments, vias and zones), so that a unit reads a distance from the extract and opens no view again. Each unit's prompt names its own items and catalogue area and holds nothing of another unit, and no unit's prompt is in the shared context. This replaces the earlier split, in which the setup held the documents alone and each reviewer opened the views itself: that cost twice the single reviewer because every reviewer rebuilt the survey.
  - A layout reviewer keeps what the method gives it: read tools and read-only retrieval of a published document at its address, granted through the retrieval grant the kit's caller contract provides, which a rule-kind item whose figure rests on one needs, an unfetchable document making the item cannot judge. The kit checks the tool set from each session's start report. Whether retrieval works from a forked reviewer is not yet measured; the proof run records the retrievals per unit and whether any failed.
  - Two units can raise a finding for the same place, the free-pass unit most likely, and two replicas of one unit can raise the same one. The merge reports them for the designer, as the kit's merge does, and drops neither.
  - A review folder for a committed board is assembled by a command from the commit, holding the design files, the plan, rules table and records, the method, the hardware notes, the rendered views and placement view, the check's report and the round file, and never the designer's reasoning; for a round after the first it also holds the earlier rounds of the review record as recorded, which a verdict row may cite. The review seeding command's assembly takes one proof design's names as fixed, so reusing it means generalising that assembly to take the design, and the seeding command's existing tests keep passing.
  - The tests need no model and no KiCad, using the kit's stub over synthetic folders with synthetic catalogue headings, plan tables and unit results.
  - A cannot judge verdict is resolved within the round, as the method says, so the merge fails a round that holds one and names the item and the view it needs; whoever started the round renders the view, or supplies the document the Why asks for when the plan names no address to fetch it from, and adds it with the folder command's add-view or add-document mode, which puts the view and its command in the review folder's added-views folder and records the item, its cannot judge Why and the view in a resolutions file there, neither being part of the shared context and the round file not being rewritten, so that the kit's re-run, which refuses a changed review folder except for the paths the declaration lists as added during the round, accepts the change; it then re-runs that unit alone. The re-run's verdict stands, and the row records the cannot judge, then the view, then the verdict, as the method gives for a single reviewer: the merge builds the row from the resolutions file and the re-run's verdict, since a re-run replaces the unit's kept result, and folds the added views into the Views field when it renders. The merged findings are numbered with the item units' findings in the checklist's order first and the comparison and free-pass unit's findings after, in its own order. The caller gives the kit its checklist as a function of the review folder, the catalogue's items in the method's order, then the board's own plan rows, then the free pass, and writes the round through the rendered record the kit's caller contract provides.
  - The proof is the kit's: the recorded single-reviewer runs of the layout proof are the baseline and the single reviewer is not run again, and the fanned-out form is run on one seeded copy at the full group count with the groups running together. The seeded copy is the one the folder command assembles with the design taken from the seeded copy's repository and commit, which the seeding command keeps behind a new opt-in flag instead of deleting, and the method, notes and other documents taken from the host repository as the seeding command takes them, so that it holds a round file; the seeding command's default behaviour, folder and tests are unchanged. The pooled criterion, with a cost multiple of 1.25 for a round of the design loop, whose two replicas run on the small-tier model because a pass on it found all 21 seeds for USD 1.21 against the single reviewer's mean of USD 2.84, and five small-tier replicas found 19 to 21 of 21 each, the spread of the single mid-tier reviewer's 19 to 21, while two replicas of one model missed the same seed once, which is why the pre-order round, whose misses cost most, runs the mid-tier for its first two replicas and the small tier for its third; the pre-order figures are recorded and not bounded, is the criterion of C8 below. The caller declares a time budget of about 350 seconds so that groups are sized clear of the bound of half the single mean. The layout caller's bound on groups at once is set from the observed behaviour as a change to that value and not to the kit's mechanics, and the run records whether any call was refused for a rate limit.

  - The caller is rebuilt on the kit and the earlier driver, the tap and the proof command's use of them are removed in this solution, since this branch holds the layout caller and proof built on them and the kit leaves them in place until the last caller has moved.

  - The comparison and free-pass unit's findings carry the key of the last checklist entry, since the merge orders a finding whose key is not on the checklist first. The round-field checks run where the declaration and checklist are resolved, before any session starts, since the caller's checks receive the merged tables alone. The proof command is one command: it seeds with the keep flag, writes the review folder with the layout facts, runs the fanned form on the kit's real executor at the baselines' model with two replicas and again with three, loads the recorded single runs as baselines, counts document retrievals and calls refused for a rate limit from the saved streams and the executor, and writes the kit's proof record.

  Out of scope: the critical-routing check, the schematic review and the production-files check; the content of any catalogue item; what a round or a finding is.
