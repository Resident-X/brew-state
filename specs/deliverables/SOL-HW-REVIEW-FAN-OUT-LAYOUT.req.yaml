id: SOL-HW-REVIEW-FAN-OUT-LAYOUT
type: deliverable
category: solution
title: A task fans a layout review round out by catalogue area from one shared setup and merges the areas into one round of the review record
status: active
version: 2
text: |
  Why this exists. The layout review judges sixty-nine items in twelve catalogue areas, one reviewer in one context, and took about twenty minutes a round in the run recorded in SOL-BOARD-REVIEW-LOOP-PROPORTIONATE; its blind proof repeats that on a seeded copy. The reasoning, measurements and options rejected are in DEC-REVIEW-FAN-OUT-BY-UNIT-FROM-SHARED-SETUP, and DEC-FANNED-OUT-ROUND-IS-THE-SAME-ROUND settles that a round judged by unit is the same round; a session building this does not reopen either. This is the second of six solutions under DEL-HW-REVIEW-FAN-OUT. It adds the layout review as the first caller of the driver SOL-HW-REVIEW-FAN-OUT-DRIVER as the caller-seam solution SOL-HW-REVIEW-FAN-OUT-CALLER-SEAM extends it, adds nothing to the driver beyond that seam, and is where the figures behind the decision are checked at the layout review's full unit count.

  What it does. A layout review round, full or narrow, is judged by one reviewer per catalogue area, one for the board's own items and one for the comparison with the plan and the free pass, and the merge writes one round of the board's review record.

  Settled before the build.

  - The units are the area headings of the layout practice catalogue in the review folder's own method, the board's own items from the plan's table when it has rows, and a unit of its own for the comparison with the plan and the free pass over every view, which belong to no one area. The planning-cause trace for a first-review failure stays with the designer after the merge.
  - A narrow round's units are the areas its listed items fall in, and each reviewer judges only the listed items of its area; a narrow round that falls in one area is judged in the setup session. A narrow round never closes a review, as the method says.
  - The round's own fields, its number, kind, the commit judged, the views and the pre-order check's lines, are inputs from whoever starts the round, since the merge has no model. The folder command takes them, and a narrow round's listed items, as arguments and writes them into the review folder as one round file; the caller's prompts and merge read that file through the review folder the driver passes them. The merge checks them for presence and form and writes the opening lines the method gives.
  - A layout reviewer keeps what the method gives it: read tools and read-only retrieval of a published document at its address, granted through the retrieval grant the caller-seam solution adds and which a rule-kind item whose figure rests on one needs, an unfetchable document making the item cannot judge. The driver checks the tool set from each session's start report. Whether retrieval works from a forked reviewer is not yet measured; the proof run records the retrievals per unit and whether any failed.
  - Two units can raise a finding for the same place, the free-pass unit most likely. The merge reports them for the designer, as the driver's merge does, and drops neither.
  - A review folder for a committed board is assembled by a command from the commit, holding the design files, the plan, rules table and records, the method, the hardware notes, the rendered views and placement view, the check's report and the round file, and never the designer's reasoning; for a round after the first it also holds the earlier rounds of the review record as recorded, which a verdict row may cite. The review seeding command's assembly takes one proof design's names as fixed, so reusing it means generalising that assembly to take the design, and the seeding command's existing tests keep passing.
  - The tests need no model and no KiCad, using the driver's stub over synthetic folders with synthetic catalogue headings, plan tables and unit results.
  - A cannot judge verdict is resolved within the round, as the method says, so the merge fails a round that holds one and names the item and the view it needs; whoever started the round renders the view and re-runs that unit alone, which the driver supports. The merged findings are numbered with the item units' findings in the checklist's order first and the comparison and free-pass unit's findings after, in its own order. The caller gives the driver its checklist as a function of the review folder, the catalogue's items in the method's order, then the board's own plan rows, then the free pass, and writes the round through the rendered record the caller-seam solution adds.
  - The proof runs the single-reviewer form and the fanned-out form on one seeded copy and compares them, at the full unit count with the reviewers running together. Its default number of reviewers at once is a value in the driver's configuration, set from the observed behaviour as a change to the value and not to the driver's mechanics, and the run records whether any call was refused for a rate limit.

  Out of scope: the critical-routing check, the schematic review and the production-files check; the content of any catalogue item; what a round or a finding is.
