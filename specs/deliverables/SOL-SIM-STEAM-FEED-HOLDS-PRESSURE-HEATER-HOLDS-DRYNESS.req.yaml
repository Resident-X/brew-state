id: SOL-SIM-STEAM-FEED-HOLDS-PRESSURE-HEATER-HOLDS-DRYNESS
type: deliverable
category: solution
title: The steam loop holds pressure with the feed and dryness with the heater, against a modelled outlet superheat
status: active
version: 1
text: |
  Re-allocate the steam control law so the feed pump holds pressure and quantity and heater power holds a declared superheat setpoint at the plant's modelled outlet, computed from the measured pressure; every dryness claim names that superheat and pressure and carries the carry-over caveat in text and JSON; the declaration's ready and band figures are re-derived from the new relations.

  Retires, at close-out, the clauses of SOL-SIM-STEAM-BAND-SUSTAINED that state the heater-driven pressure law: C1 (temperature while idle, pressure while a draw is active), C7 (recovery as the same ready-holding control continuing) and C8 (heater leads and feed lags on demand starting). Its other criteria still stand, so the successor carries each surviving criterion forward when that solution is superseded, and the readiness pass at build time settles which survive after reading each in full.
