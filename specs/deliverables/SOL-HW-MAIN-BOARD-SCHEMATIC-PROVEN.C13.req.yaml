id: SOL-HW-MAIN-BOARD-SCHEMATIC-PROVEN.C13
type: criterion
title: The board provides a serial port on a connector for the display unit
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  The schematic carries header J522 with its pin 3 joined to the controller's PB6 pin and its pin 4 joined to the controller's PB7 pin, the pair that carries the controller's first serial port, through the header's series resistors and surge protection at 3.3 V logic. Pin 1 carries the board's 3.3 V and pin 2 ground. A display unit connects to that one header. The firmware's use of the port and the display unit's own connector are out of scope.
