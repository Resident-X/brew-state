id: SOL-PRE-ORDER-CHECK-CRYSTAL-KEEP-CLEAR-EXEMPTS-THE-OTHER-CRYSTAL
type: deliverable
category: solution
title: The crystal keep-clear does not count an exemption of the other crystal as a rule naming it, so a board with two crystals can pass
status: active
version: 1
text: |
  The crystal keep-clear rule holds each crystal of a board to a rule in the board's rules file in one form, and also fails any other courtyard_clearance rule that names the crystal, because KiCad may apply such a rule after the keep-clear and loosen it (CLOCK-4). The board check decides "names the crystal" by looking for the crystal's quoted reference anywhere in the rule's condition. A rule that exempts a crystal with B.Reference != 'Y1' therefore counts as naming Y1. CLOCK-3's closed list of the controller's pin-side parts makes any other crystal on the controller's oscillator pins a related part, so on a board with two crystals each keep-clear rule exempts the other, and each is then reported as a loosening rule naming the other crystal. No layout can pass, and the board check reports a defect the method requires the board to have.

  Settled before build: the one mention that does not name a crystal is a B.Reference != 'X' clause inside a rule whose whole condition matches the keep-clear form (KEEP_CLEAR_CONDITION in hardware/tools/board_check.py), the form being A.Reference == '<a reference>' followed by any number of && B.Reference != '<a reference>'. Inside that form a != only removes pairs from the rule, so it exempts and never loosens. Every other mention of a crystal still counts as naming it: A.Reference == or B.Reference == anywhere, and a != in any form but that one. A != outside the form does not exempt, because KiCad evaluates a constraint's condition for both orders of a pair of items. A rule with the condition A.Reference != 'Y1' and a minimum of 0mm matches the pair with some part as A and Y1 as B, and a bare B.Reference != 'Y1' rule with a small minimum matches the pair with Y1 as A and some part as B, so each loosens the keep-clear of Y1 and each is reported for Y1. A rule in the keep-clear form for another reference is skipped in this crystal's naming loop, because its != clauses only exempt. When that other reference is a crystal of the layout, its own pass over the rules holds the rule to the floor and to leaving some part unexempted, so a keep-clear for Y2 below the floor is reported once, for Y2, and not again for Y1. A rule for Y2 whose condition is A.Reference == 'Y2' && B.Reference == 'Y1', with a loose minimum, is not in the form, since B is compared with ==, so it is examined and reported for Y1. The failures that stay: a courtyard_clearance rule outside the form that names the crystal in any way above, a keep-clear below the 10 mm floor, a keep-clear that exempts every other part, a crystal with no rule, and a keep-clear that does not name its crystal as A. Each crystal of the layout is still held to its own rule, so a second crystal with no rule of its own still fails. Rejected: skipping every rule that mentions the crystal in a != (the pair-symmetric loosening above passes unseen), skipping every rule in the keep-clear form wherever it appears without holding it to its own crystal's figure (a sub-floor form rule would go unreported), and a count of exempted crystals (the check holds nothing that depends on how many crystals there are).

  Placement: the final loop of crystal_keep_clear in hardware/tools/board_check.py, where a rule outside the one form is examined for a mention of the crystal. The mention test stays a search for the crystal's quoted reference in the rule's condition. The skip changes: a rule is passed over there only when its one condition fully matches the keep-clear form with another reference as A. The message is unchanged. In hardware/tools/tests/test_board_check.py, the class TheCrystalKeepClearIsInTheRulesFileOfABoardWithACrystal gains a fixture of two crystals with synthetic references and two rules, each exempting the other, which passes, and a case for each failing form above, including the single-crystal layout reporting as before. hardware/tools/board_prove.py gains two seeded rows, each a two-crystal copy of the throwaway proof design: one whose second crystal's keep-clear is followed by a rule naming the first crystal as B with ==, and one followed by a rule whose condition is A.Reference != naming the first crystal with a minimum of 0mm; the check reports each as crystal_keepclear, so the narrowing is shown not to hide a real loosening. Both rows join the required-names dictionary in hardware/tools/tests/test_board_check_kicad_marks.py. The hardware notes' crystal_keepclear row and the paragraph after the checks table state which mention exempts and which names. docs/board-design-method.md needs no change: CLOCK-3 and CLOCK-4 already define the other crystal as a related part and state the form. The main board's rules file is not touched; it already writes the two rules in this form.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of the catalogue: every board is judged against every applicable item and can pass it. CLOCK-3 and CLOCK-4 require a board with two crystals on one controller to exempt each as related to the other, and the check as built reports that required exemption as a defect, so the item cannot be met. The check is corrected, not the item.
