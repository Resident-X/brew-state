id: SOL-PRE-ORDER-CHECK-CRYSTAL-KEEP-CLEAR-EXEMPTS-THE-OTHER-CRYSTAL
type: deliverable
category: solution
title: The crystal keep-clear does not count an exemption of the other crystal as a rule naming it, so a board with two crystals can pass
status: active
version: 1
text: |
  The crystal keep-clear rule holds each crystal of a board to a rule in the board's rules file in one form, and also fails any other courtyard_clearance rule that names the crystal, because KiCad may apply such a rule after the keep-clear and loosen it (CLOCK-4). The board check decides "names the crystal" by looking for the crystal's quoted reference anywhere in the rule's condition. A rule that exempts a crystal with B.Reference != 'Y1' therefore counts as naming Y1. CLOCK-3's closed list of the controller's pin-side parts makes any other crystal on the controller's oscillator pins a related part, so on a board with two crystals each keep-clear rule exempts the other, and each is then reported as a loosening rule naming the other crystal. No layout can pass, and the board check reports a defect the method requires the board to have.

  Settled before build: a rule names a crystal only where its condition says A.Reference == 'X' or B.Reference == 'X' with that crystal's reference. A mention inside B.Reference != 'X' is an exemption, which is the whole point of the one form, and is not a naming. A reference compared with != on the A side (A.Reference != 'X') applies to every part but the crystal and so is not a naming either. A rule already in the keep-clear form for another crystal is that crystal's keep-clear, and the check does not examine it a second time as a rule that might loosen this one. The rules that fail stay as they are: a courtyard_clearance rule outside the form that names the crystal as A or B with ==, a keep-clear below the 10 mm floor, a keep-clear that exempts every other part, a crystal with no rule, and a keep-clear that does not name its crystal as A. Each crystal of the layout is still held to its own rule, so a second crystal with no rule of its own still fails. Rejected: skipping every rule in the keep-clear form wherever it appears (a rule in the form for crystal Y2 that also carries B.Reference == 'Y1' does not match the form, and so is still examined), and a count of exempted crystals (the check holds nothing that depends on how many crystals there are).

  Placement: the final loop of crystal_keep_clear in hardware/tools/board_check.py, where a rule outside the one form is examined for a mention of the crystal. The mention test becomes a match for A.Reference == or B.Reference == against the crystal's reference, and a rule that matches the keep-clear form for any crystal of the layout is skipped there. The message is unchanged. In hardware/tools/tests/test_board_check.py, the crystal keep-clear class gains a fixture of two crystals with synthetic references and two rules, each exempting the other, which passes, and cases for each failing form above. hardware/tools/board_prove.py gains one seeded row, a two-crystal copy of the throwaway proof design whose second crystal's keep-clear is followed by a rule in another form that names the first crystal as B with ==, which the check reports as crystal_keepclear, so the narrowing is shown not to hide a real loosening; the row joins the required-names list in the records test. The hardware notes' crystal_keepclear row and the paragraph after the checks table state which mention counts. docs/board-design-method.md needs no change: CLOCK-3 and CLOCK-4 already define the other crystal as a related part and state the form. The main board's rules file is not touched; it already writes the two rules in this form.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of the catalogue: every board is judged against every applicable item and can pass it. CLOCK-3 and CLOCK-4 require a board with two crystals on one controller to exempt each as related to the other, and the check as built reports that required exemption as a defect, so the item cannot be met. The check is corrected, not the item.
