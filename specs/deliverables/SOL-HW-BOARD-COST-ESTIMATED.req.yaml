id: SOL-HW-BOARD-COST-ESTIMATED
type: deliverable
category: solution
title: Each board's block-level cost is estimated from the manufacturer's charges and weighed against what remains of the declared spend before detailed design
status: active
version: 1
text: |-
  Estimates each board's and off-board assembly's cost at its chosen outline and layer count: fabrication against the manufacturer's price breaks, assembly with its setup and loading fees, parts, shipping and a likely second spin. It weighs the total against what remains of the declared spend and ends the pending cost marks held against the estimate.
