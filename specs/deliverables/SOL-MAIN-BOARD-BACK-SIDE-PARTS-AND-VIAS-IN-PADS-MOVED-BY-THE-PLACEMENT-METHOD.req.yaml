id: SOL-MAIN-BOARD-BACK-SIDE-PARTS-AND-VIAS-IN-PADS-MOVED-BY-THE-PLACEMENT-METHOD
type: deliverable
category: solution
title: The main board's seven BAT54S clamps are all the SOT-323 BAT54SW,115, and D502, D506 and R301 stand on the front
status: active
version: 1
text: |
  Moves the main board's three back-side assembled parts, D502, D506 and R301, to the front so the board is assembled on one side, and changes all seven BAT54S clamp diodes to one SOT-323 part so the whole board carries one part number and one bill-of-materials line for the clamp. A scratch run of the pre-order check on the finished board reports one side_fiducials line, because the back side holds those three surface-mount parts and no fiducial. The owner decided on 2026-11-07 that the three parts stand on F.Cu, for single-sided assembly, and does not accept the back-side parts as a carried line; no acceptance of them is recorded anywhere. The owner then decided on 2026-11-07 that all seven clamps change to the same part rather than two of them only. The owner-requested placement search found the plan below.

  Settled for the build:
  - R301 (0 ohm, +3V3A_FB to +3V3A link) moves to F.Cu at (105.25, 39.5), rotation 270, pads at (105.25, 38.675) and (105.25, 40.325). That spot is 10.9 mm from the Y401 courtyard, so the 'Crystal keep-clear Y401' rule needs no exemption, and it is inside the analog sensing rectangle. One new 1.5 mm segment joins the locked +3V3A_FB F.Cu track, and the old B.Cu R301 stubs are removed after checking the +3V3A tree stays connected. R301 changes no part.
  - All seven BAT54S dual Schottky clamps, D502, D504, D506, D523, D524, D527 and D528 (pin 1 anode of diode 1, pin 2 cathode of diode 2, pin 3 the common node), change from the SOT-23 Nexperia BAT54S,215 (LCSC C47546) to the SOT-323 Nexperia BAT54SW,115 (LCSC C78606, Extended), the same maker and die family. D502 (NTC_COF), D504 (NTC_STM) and D506 (NTC_WAND) clamp the thermistor inputs with pin 1 on GND and pin 2 on +3V3A; D523 and D524 steer the steam-path pressure I2C pins and D527 and D528 the brew-path pressure I2C pins, with pin 1 on GND, pin 2 on +3V3 and pin 3 on the bus node; the build reads each node's use from the netlist. D502 and D506 also move from B.Cu to F.Cu: D502 to about (123.5, 42.75) rotation 180 next to its existing copper and D506 to about (110.5, 30.25) rotation 180 in the island pocket, positions the placement method run confirmed (SOT-323 courtyard 2.99 x 2.29 mm). D504, D523, D524, D527 and D528 are already on F.Cu and are swapped in place; their SOT-323 pads sit slightly closer than the SOT-23 pads, so each needs the short re-route of its locked copper that the placement method requires. The pinout equivalence of BAT54S in SOT-23 and BAT54SW in SOT-323 is verified against the maker datasheet in the build.
  - The smaller pad of D523 does not change the open item on the five ground vias inside surface-mount pads, which a sibling item owns, and must not make it worse: pad 1 of D523 holds a ground via inside the pad today, and this item does not move that via.
  - The schematic symbol fields of the seven references (footprint, LCSC, MPN, description) change through the schematic tools as a like-for-like swap with the same electrical function, with the diligence of the earlier resistor swaps: netlist and bill of materials difference, the proof scripts, and a targeted re-review.
  - The records that name the old clamp part for any of the seven references are corrected to the new one: the parts specification, the schematic specification and the sheet records, the circuit verdicts rows, the circuit-proof clamp decks and the generators that write them, the traceability rows, the catalogue extract, and the generic mentions in the error budget and circuit proof. The pin-limits record's single shared clamp entry is re-keyed to C78606, so no clamp reference is evaluated against no entry, because the pin-limit and derating check skips a part with no entry without printing a line; the C47546 clamp entry is removed unless another part still uses it.
  - The electrical equivalence is read from the maker's sheet for the swapped part, not assumed from the family: reverse leakage, forward voltage, reverse voltage, power and capacitance are compared with the figures the error budget, the clamp decks, the shorted-lead verdicts, the bus-capacitance sums and the derating rows use, for every node the seven clamps protect, with the arithmetic shown, or those records are re-derived with the sheet's figures.
  - The routes of the seven clamps are stated like R301's: pads connected on the board to the same nets as before, no new check or rules line, and the locked critical copper they re-route re-routed with the copper lock and a fresh copper record.
  - All board edits go through the placement method of docs/board-design-method.md with Konnect, never by file edit.
  - No signed separation figure, no mains copper and no mains pour is touched.
  - The closing steps are owed and not skipped: the copper lock and a fresh copper record, a layout review round, the placement and critical-routing history, and a full pre-order check on the changed board.
  - Out of scope: the five ground vias inside surface-mount pads (a sibling maintenance item), the pour, decoupling-via, thermal-relief and silkscreen lines, the footprint field lines, the C606 exception, and the courtyards_overlap and items_not_allowed lines.
rationale: |
  Honours the judgement REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of a layout: every applicable practice item judged before the board is ordered, here by a change to the board that removes the back-side assembled parts and so the second assembly side, as the owner decided on 2026-11-07. The placement search showed the front has room for each part at the stated spots, so the change to the board is made and no acceptance is recorded in its place.
