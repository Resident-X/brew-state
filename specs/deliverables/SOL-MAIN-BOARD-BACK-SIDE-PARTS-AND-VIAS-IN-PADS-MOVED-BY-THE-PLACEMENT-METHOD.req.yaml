id: SOL-MAIN-BOARD-BACK-SIDE-PARTS-AND-VIAS-IN-PADS-MOVED-BY-THE-PLACEMENT-METHOD
type: deliverable
category: solution
title: The main board's D502, D506 and R301 stand on the front, the two clamps swapped to SOT-323 and R301 clear of the crystal keep-clear
status: active
version: 1
text: |
  Moves the main board's three back-side assembled parts, D502, D506 and R301, to the front so the board is assembled on one side. A scratch run of the pre-order check on the finished board reports one side_fiducials line, because the back side holds those three surface-mount parts and no fiducial. The owner decided on 2026-11-07 that the three parts stand on F.Cu, for single-sided assembly, and does not accept the back-side parts as a carried line; no acceptance of them is recorded anywhere. The owner-requested placement search found the plan below.

  Settled for the build:
  - R301 (0 ohm, +3V3A_FB to +3V3A link) moves to F.Cu at (105.25, 39.5), rotation 270, pads at (105.25, 38.675) and (105.25, 40.325). That spot is 10.9 mm from the Y401 courtyard, so the 'Crystal keep-clear Y401' rule needs no exemption, and it is inside the analog sensing rectangle. One new 1.5 mm segment joins the locked +3V3A_FB F.Cu track, and the old B.Cu R301 stubs are removed after checking the +3V3A tree stays connected.
  - D502 and D506, the BAT54S dual Schottky clamps on NTC_COF and NTC_WAND (pin 1 GND, pin 2 +3V3A, pin 3 the NTC node), change from SOT-23 (LCSC C47546) to SOT-323: Nexperia BAT54SW,115, LCSC C78606 (Extended), the same maker and die family. D502 goes to about (123.5, 42.75) rotation 180 next to its existing copper, and D506 to about (110.5, 30.25) rotation 180 in the island pocket; the placement method run confirms the positions (SOT-323 courtyard 2.99 x 2.29 mm). D504, the same clamp at NTC_STM, is already on F.Cu and does not change. The pinout equivalence of BAT54S in SOT-23 and BAT54SW in SOT-323 (pin 1 anode of diode 1, pin 2 cathode of diode 2, pin 3 common) is verified against the maker datasheet in the build.
  - The schematic symbol fields of D502 and D506 (footprint, LCSC, MPN, description) change through the schematic tools as a like-for-like swap with the same electrical function, with the diligence of the earlier resistor swaps: netlist and bill of materials difference, the proof scripts, and a targeted re-review.
  - The records that name the old part for these two references are corrected to the new one: the parts specification, the schematic specification and thermistor sheet records, the circuit verdicts rows, the thermistor clamp decks and their generator, and the traceability rows. The pin-limits record gains its own C78606 entry, because the pin-limit and derating check skips a part with no entry without printing a line, and the shared C47546 entry does not cover the new part.
  - The electrical equivalence is read from the maker's sheet for the swapped part, not assumed from the family: reverse leakage, forward voltage, reverse voltage, power and capacitance are compared with the figures the error budget, the clamp decks, the shorted-lead verdicts and the derating rows use, with the arithmetic shown, or those records are re-derived with the sheet's figures.
  - The routes of D502 and D506 are stated like R301's: pads connected on the board to the same nets as before, no new check or rules line, and the locked NTC_COF and NTC_WAND critical copper re-routed with the copper lock and a fresh copper record.
  - All board edits go through the placement method of docs/board-design-method.md with Konnect, never by file edit.
  - No signed separation figure, no mains copper and no mains pour is touched.
  - The closing steps are owed and not skipped: the copper lock and a fresh copper record, a layout review round, the placement and critical-routing history, and a full pre-order check on the changed board.
  - Out of scope: the five ground vias inside surface-mount pads (a sibling maintenance item), the pour, decoupling-via, thermal-relief and silkscreen lines, the footprint field lines, the C606 exception, and the courtyards_overlap and items_not_allowed lines.
rationale: |
  Honours the judgement REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of a layout: every applicable practice item judged before the board is ordered, here by a change to the board that removes the back-side assembled parts and so the second assembly side, as the owner decided on 2026-11-07. The placement search showed the front has room for each part at the stated spots, so the change to the board is made and no acceptance is recorded in its place.
