id: SOL-MAIN-BOARD-BACK-SIDE-PARTS-AND-VIAS-IN-PADS-MOVED-BY-THE-PLACEMENT-METHOD
type: deliverable
category: solution
title: The main board's three back-side parts stand on F.Cu and its five same-net vias leave their pads by the placement method
status: active
version: 1
text: |
  Corrects the main board's layout where a scratch run of the pre-order check on the finished board (severity policy and workmanship record applied) leaves a side_fiducials line and five same-net vias inside surface-mount pads. The back side (B.Cu) holds three assembled surface-mount parts, D502, D506 and R301, and no fiducial; the layout plan's MFG-10 row says F.Cu is the one side with assembled surface-mount parts, so the three on the back are a placement drift. Moving them to F.Cu clears the line and lets the order use single-sided assembly. The via-in-pad survey lists seven vias whose centre lies inside an SMD pad; five are same-net ground vias, and the board's rule is no via-in-pad without a justified narrow exception (the fabricator leaves vias over 0.5 mm unfilled, so solder can wick).

  Settled for the build:
  - The three parts move to F.Cu through the placement method's scripted edit; fiducials are not added to B.Cu.
  - The five vias move out of their pads; an exception is the fallback only, written in the board's rules file with via, pad, net and reason.
  - No signed mains or other figure is relaxed.
  - The closing steps are owed: layout review round, placement and critical-routing history, pre-order check re-run.
  - Out of scope: the two survey hits on pads of another net, the pour, decoupling-via, thermal-relief and silkscreen lines (a sibling maintenance item), the footprint field lines, the C606 exception, the U601 library footprint (SOL-HW-MAIN-BOARD-U601-LIBRARY-FOOTPRINT-MATCHES-BOARD) and the do-not-populate parity lines (SOL-HW-DO-NOT-POPULATE-PARITY-LINES-ARE-LISTED-AND-BOARD-DRIVES-BILL), which existing items own, and the courtyards_overlap and items_not_allowed lines, which the owner-signed workmanship acceptance record passes under SOL-PRE-ORDER-CHECK-JUDGES-OWNER-ACCEPTED-WORKMANSHIP-LINES.
rationale: |
  Restores the judgement REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of a layout: every applicable practice item, here the fiducial item MFG-10 and the via-in-pad rule, judged met before the board is ordered, by a change to the board rather than by judging a failure unimportant. Found by the pre-order check run on the finished board; the drift of three parts to the back side was not caught by the placement review.
