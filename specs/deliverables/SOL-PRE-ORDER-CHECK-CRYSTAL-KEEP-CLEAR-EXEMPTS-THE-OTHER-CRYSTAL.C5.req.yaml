text: |
  Each of these still fails the crystal keep-clear: a keep-clear below the 10 mm floor; a keep-clear that exempts every other part; a crystal of the layout with no rule of its own, including a second crystal with none; and a keep-clear that does not name its crystal as A. Out of scope: the related-part list of CLOCK-3, the 10 mm floor and the main board's rules file.
