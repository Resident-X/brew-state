id: SOL-HW-HEATER-WALL-BOARD-PROVEN-AND-LAID-OUT.C14
type: criterion
title: Every mounting hole keeps the signed distance from mains copper, and the holes fix the board securely to the printed case
status: active
version: 1
measurement_type: binary
verification: inspection
text: |
  The board carries enough mounting holes to fix it securely to the printed case, at least three, whose number and places the layout chooses together with the placement. Each hole's pad and courtyard keep the distance from mains copper that the separation basis signs for mounting holes, whatever the screw is made of, so no safety property depends on a particular screw. The drawing states the number and the centre of each hole, and how the holes hold the board when the case is fitted. Designing the case is out of scope.
