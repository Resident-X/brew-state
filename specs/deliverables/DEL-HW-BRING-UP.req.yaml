id: DEL-HW-BRING-UP
type: deliverable
category: task
title: The built boards are brought up with every safety default demonstrated before the machine runs on them
status: active
level: task
version: 5
text: |
  The boards are first powered with no mains present and their low-voltage functions shown working. Every load is then shown held off with the controller in reset, unpowered and disconnected, and loss of the controller's proof of life is shown to remove heater power whatever has happened to the controller's clock, reset or supply. Only after that is the mains side energised, under supervision. In the machine, sensing accuracy is measured with the loads switching, protective continuity of touchable parts is measured on the finished installation, the enclosure's air temperature and the hottest parts' temperatures are measured at sustained full load with the enclosure closed, and the whole machine is shown to come back safe from a loss and return of mains.
rationale: |
  A fault first found at mains potential is found the most expensive way there is, so everything that can be shown without mains is shown first. The safety defaults are demonstrated rather than inferred from the design, because they are exactly the behaviours a design review cannot see fail.
