id: SOL-PRE-ORDER-CHECK-CREEPAGE-RESULT-IS-THE-SAME-ON-EVERY-RUN
type: deliverable
category: solution
title: The pre-order check's creepage result is the same on every run of an unchanged design, and a run that cannot show it complete fails
status: active
version: 1
text: |
  The pre-order check judges the signed creepage of a board with Mains by one KiCad creepage pass per design run. On 2026-11-15 the check ran several times on the main board v2 with its mains copper unchanged. In every run but one, KiCad's creepage pass reported the creepage shortfall between pads 1 and 2 of the coffee pump triac T701 (NEUTRAL against PUMP_C_MT2, 2.00 mm against the signed 2.6 mm), which entry 0 of the board's separation basis accepts. The runs that reported it were the task hw:verify runs of three build-round gates and of three working checks, and a run of the whole-repository test on its own. The one run that did not report it was the whole-repository test of the round's board tooling tests, test_board_check_kicad_connectivity, run beside three other test workers that were also running KiCad. The check then failed that run, because an accepted exception that no reported shortfall uses fails, so this miss was caught. A shortfall that no exception covers, missed the same way, would pass unseen.

  Settled for the build:
  - The cause is found and stated. The candidates to separate are KiCad's creepage search, the zone refill the creepage pass is given, the guard that leaves ground pours out of the pass, and the check's reading of KiCad's report, each under the machine load of the round.
  - A creepage shortfall present in a design is reported on every run of the check. A run in which the check cannot show that its creepage result is complete fails, naming why, and never passes.
  - hardware/README.md states how the check makes the creepage result repeatable.

  Out of scope: any change to the signed figures, to the board's copper or to which pairs the separation basis accepts.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks, that every board is judged against every applicable item before it is ordered: a creepage item that the check can miss on one run in several is not judged on that run. The main board's own verdict is not in doubt. Its mains copper is held unchanged by the locked copper record across every run of the day, and the shortfall the missed run left out is one the separation basis accepts. The defect lies in the check, and the next board relies on the check alone. It is found by the check's own rule that an accepted exception which no reported shortfall uses fails, which is why that rule is kept as it is.
