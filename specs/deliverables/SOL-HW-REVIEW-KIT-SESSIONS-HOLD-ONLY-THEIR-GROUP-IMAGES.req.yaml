id: SOL-HW-REVIEW-KIT-SESSIONS-HOLD-ONLY-THEIR-GROUP-IMAGES
type: deliverable
category: solution
title: Every session of a review holds the shared artefacts and its own group's, within a declared model-context budget, and a group over the budget is refused before any session starts
status: active
version: 13
text: |
  Why this exists. The review kit builds one shared context holding every artefact any unit of a review needs, every rendered view included as an image, and forks one reviewer per group from it (DEC-REVIEW-FAN-OUT-FROM-SHARED-CONTEXT-WITH-REPLICAS). That is sound on the small proof designs, where the decision measured a flat prefix against a tree and found the saving under one per cent. On the first real full-size main controller board it failed twice. With 1744 views (321 MB of images) the agent command line refused the stream for being over 256 million characters; the net views were then cut to the tiles that hold the net's copper, giving 560 images (72.8 MB). The plan for those 560 images read "6 groups | 12 forks | bound 12 | shared context 2472436 tokens", and the root session ended "Prompt is too long": an image costs about 4.4 thousand tokens, and the model's context window is a small fraction of 2.47 million. The shared context was never compared with the window because the callers declare no context budget, and the kit's refusal of a prefix over the budget only fires when one is declared. The critical-routing check (the method's routing step 4), the layout review and the production-files check have the same shape and meet the same wall, so the kit cannot carry them out on a full-size board; the independent reviewer's verdict table the method requires was made by hand, with a brief per group that opened only the images the group needs.

  The decision's measure of a tree against a flat prefix was taken at the sizes of the proof designs. This solution does not reopen the choice of shared context, forks and any-fail replicas; it bounds what any one session holds. Each root is flat, and an artefact that only some groups need is held only by the roots that serve those groups. A forked session's message carries text only and a fork of a fork is neither supported nor tested, so a group cannot be handed its own views on top of a shared root; each group is judged instead from a flat root that holds the shared documents and the views of the units of the groups the root serves; groups whose views fit one root together share it, so that a small design is one root with every group's forks reading it, as the kit built before, and a design too large for one root is several roots. The groups are the kit's packing of units by expected output, run in parallel, and each keeps its replicas with any fail standing; the groups' results are merged into the one pass the method requires, with exactly one verdict row per checklist item and the merge's existing refusals.

  Measured scale. On the six-layer main controller board the rendered views for the nine critical net classes came to 865 images, 173.6 MB, about 1.33 million model tokens (net tiles about 647 thousand, whole-board layer tiles about 552 thousand, class maps 62 thousand, assembly views 55 thousand), and rendering them took about 55 minutes, zone refill dominating. Rendering again to change what a group holds is therefore not an option; the set of views a group holds is chosen from the rendered set, and the views command can also leave out the layers' non-copper tiles and thin the tiles of the large power and ground nets. The kit's parallelism is not the limit: the caller's bound is 30 and the bound option raises it. The token size of a group's root is estimated from the image dimensions before any session starts, and the layout review's caller is grouped the same way as the critical-routing caller. The method relies on the fanned-out form only once its proof is recorded, so the proof is re-run on the changed form and recorded.

  Cost model. A review's cost is dominated by writing each root's context into the model's cache; reading it back is cheap. Letting a reviewer open images on demand instead of holding them in the root was tested earlier and cost the same or more, so it is not a saving and is not the design. The kit went to one flat root holding everything because splitting only duplicates writes, and that held on a small board. On a large board a single root exceeds any model's window, so grouping is unavoidable and has to be sized: the aim is the fewest total tokens written across all roots, each root within the budget. Replicas of a group read the cached root their group continues, so they stay cheap and the any-fail merge stays.

  Run evidence. On the main controller board the review was carried out by hand in six area groups, one of them doubled, run in parallel in about ten minutes of wall time. Each reviewer used roughly 200 to 240 thousand tokens in all and opened only three to eight of the 865 tiles, judging most items by measuring the board file, so a unit's real image needs are small and declared needs can pack groups larger than the estimate from the full view set suggests. Several items came back as unable to judge, or were judged by the reviewer's own measurement, because the pre-order check's reports (hole-to-hole spacing, pour gaps) are deliberately left out of the review folder. Each group's root therefore also holds the extract of those deterministic check results that its units need, so a reviewer cites the check and does not measure again. The layout caller's folder holds the check's report and the critical-routing caller's does not; the extract is the report's lines for the rules a unit declares it judges, and where a figure a reviewer needs is not in the report the check must emit it, which is outside this item. The headroom fraction of the model's window that a root may fill is a declared value set from a measured first run, not a figure fixed in a criterion.

  Who it serves. The consumer of the kit's plan, refusals and merged pass is the Builder (PER-BUILDER-001), who designs the controller boards with hobbyist means, no laboratory and no second board to spoil, and who personally pays for a respin; the judged review is the Builder's only independent check of a full-size board before it is ordered, so a review that cannot run on the real board leaves the Builder to order an unreviewed design or to review it by hand. The Builder, or an agent working for them, reads the plan figures and the refusal line to correct a declaration, so each must carry the cause, the group, the figures and the correction in plain text.

  Out of scope in addition: chained or nested forks and forks carrying extra images, which are a larger change to the kit than this item makes and are carried by their own maintenance item, and any change to a board design or to the board's own checks.

  What it does. Every session of a review holds a context within a declared model-context budget. Each root holds the shared documents and the views its groups' units declare, and no view only the groups of another root need. A group whose own artefacts together with the shared context exceed the budget is refused before any session starts, naming the group and the figures, so the caller's declaration is corrected and not the model's window found out at run time. The caller declares units and the views each needs; the kit forms the groups, and the caller's remedy for a unit alone over the budget is fewer views for it. The plan reports, per group, the root it continues and, per root, the groups it serves and the number of images and tokens it holds. The three callers that carry the image-heavy reviews, critical routing, layout and production files, and the schematic caller declare each unit's needs and the budget.

  The frozen proof designs and their recorded baselines. The recorded single-reviewer baselines are keyed by the hash of the seed list, the design commit, the model, the form and the prompt, and the design by the bytes of the files the review reads. This change edits no design file and no baseline, so every recorded key is unchanged and no baseline is re-recorded; recording a fanned-out run under its new key adds a run to the proof's run record and edits no baseline. The fanned-out form's shared context changes shape, which gives each root a prefix hash of its own in the plan record; the harness refuses to run a baseline form whose key is recorded and records a fanned-out run in the proof's run record as the form fanned, keyed by no baseline key, so the next fanned-out proof run is a new run against the unchanged baselines and no recorded run is invalidated; the harness needs no change.

  Out of scope: the single-reviewer form, which holds every view in one session and exists to prove the fanned-out form on the small proof designs; a tree-shaped plan; the value of any model's window, which is data the budget states; and the layout of any particular board's views.

  Settled for the build. A unit's needs stay a list of artefact names; the kit offers a selection from an already-rendered folder's view index, by view kind, net, net class, layer and board region, which also matches on any other field the index lists, returns artefact names and renders nothing, may return no view for a unit that holds only the shared documents, and each caller builds a unit's needs from the shared documents plus that selection. The model's context window is declared data in a table keyed by model id beside the kit's price table; a budget is stated as a figure or as a headroom fraction of that window, the two together are refused, a fraction with no declared window for the model is refused naming the model, and a model whose window is not declared is never given a default. The window of the models the kit's reviews run on is recorded from the agent command's own reported context window for them, and the headroom fraction is a value a measured run sets. Groups are the kit's packing of units: one for each set of units the declaration couples and the rest packed first-fit by expected output up to the largest single unit's expected output, as when no budget is declared. Roots start as one for each group and merge greedily by the tokens saved, the tokens of every artefact two roots both hold including the shared documents, never past the budget, ties by declaration order of the pairs' first groups; a group is never parted and a group alone over the budget is refused. A group's forks continue the root that holds its views, the roots start together within the bound, and replicas on another model hold a root of their own for each root whose groups' replicas run on that model, as set out below. The plan-only invocation is a flag of the review command that builds and reports the plan without the agent program and without starting a session, exits 0 on a plan within the budget and 1 on a refusal. The views command gains an option leaving out the whole-board tiles of layers that are not copper and an option giving the number of tiles above which a net is thinned to the tiles holding its pads, vias and ends. A unit declares the check rules it judges, and the group's extract is the report's lines for the union of its units' rules. The build is staged in commits by concern: budget and window, group roots, plan-only and report, views options, callers and extract, documents.

  A review over several groups whose replica policy places replicas on another model, as the production-files caller's third replica and the layout pre-order round's third replica do on the small tier, gives each root whose groups' replicas run on such a model a root for that model, held to that model's declared context budget, and a root none of whose groups' replicas runs on it no root for it; a fork of a group's other-model replica continues the root of its root and that model, the plan, a run, the merged record and a rerun carry the roots, and a root over that model's budget is refused naming the groups, the model and the figures.

  The remaining details the build settles: a unit's check extract is declared by the report it reads and the rules it judges, the rule being a named part of each report line; the plan-only invocation is refused together with a rerun and prints its result as a planned plan, and the plan's prediction states the tokens written; the views command refuses a thinning threshold below one; the saving that decides whether a tree plan is worth building counts the extra writes a tree plan would make, which the flat roots already avoid; and a review whose declaration states a headroom fraction is run with the review's model named, because the fraction is of that model's window; and the layout caller's checklist for a narrow round is the items its units judge, not the whole catalogue and the plan entry, because the merge now requires every item of the checklist to have exactly one row.

  Verification of the demonstration. The synthetic tests carry the build's own check of every criterion that can be tested. The one demonstration this item holds is the fanned-out proof on the method's proof design, a model run whose cost the proof records, run after the code is complete. The plan of the main controller board's own review folders, which needs that board committed and its folders rendered once, is carried by its own item, not by this one, because the board is not yet on main; the callers' declarations of views and headroom are the values that item checks and corrects.
