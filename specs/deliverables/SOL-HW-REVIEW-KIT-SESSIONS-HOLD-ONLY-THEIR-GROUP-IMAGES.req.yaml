id: SOL-HW-REVIEW-KIT-SESSIONS-HOLD-ONLY-THEIR-GROUP-IMAGES
type: deliverable
category: solution
title: Every session of a review holds the shared artefacts and its own group's, within a declared model-context budget, and a group over the budget is refused before any session starts
status: active
version: 3
text: |
  Why this exists. The review kit builds one shared context holding every artefact any unit of a review needs, every rendered view included as an image, and forks one reviewer per group from it (DEC-REVIEW-FAN-OUT-FROM-SHARED-CONTEXT-WITH-REPLICAS). That is sound on the small proof designs, where the decision measured a flat prefix against a tree and found the saving under one per cent. On the first real full-size main controller board it failed twice. With 1744 views (321 MB of images) the agent command line refused the stream for being over 256 million characters; the net views were then cut to the tiles that hold the net's copper, giving 560 images (72.8 MB). The plan for those 560 images read "6 groups | 12 forks | bound 12 | shared context 2472436 tokens", and the root session ended "Prompt is too long": an image costs about 4.4 thousand tokens, and the model's context window is a small fraction of 2.47 million. The shared context was never compared with the window because the callers declare no context budget, and the kit's refusal of a prefix over the budget only fires when one is declared. The critical-routing check (the method's routing step 4), the layout review and the production-files check have the same shape and meet the same wall, so the kit cannot carry them out on a full-size board; the independent reviewer's verdict table the method requires was made by hand, with a brief per group that opened only the images the group needs.

  The decision's measure of a tree against a flat prefix was taken at the sizes of the proof designs. This solution does not reopen the choice of shared context, forks and any-fail replicas; it bounds what any one session holds. Each group's root is flat, and an artefact that only some groups need is held by those groups' roots and not by the others. A forked session's message carries text only and a fork of a fork is neither supported nor tested, so a group cannot be handed its own views on top of a shared root; each group is judged instead from its own flat root, holding the shared documents and only the views that group's units declare. The groups' roots are independent, run in parallel, and each keeps its replicas with any fail standing; the groups' results are merged into the one pass the method requires, with exactly one verdict row per checklist item and the merge's existing refusals.

  Measured scale. On the six-layer main controller board the rendered views for the nine critical net classes came to 865 images, 173.6 MB, about 1.33 million model tokens (net tiles about 647 thousand, whole-board layer tiles about 552 thousand, class maps 62 thousand, assembly views 55 thousand), and rendering them took about 55 minutes, zone refill dominating. Rendering again to change what a group holds is therefore not an option; the set of views a group holds is chosen from the rendered set, and the views command can also leave out the layers' non-copper tiles and thin the tiles of the large power and ground nets. The kit's parallelism is not the limit: the caller's bound is 30 and the bound option raises it. The token size of a group's root is estimated from the image dimensions before any session starts, and the layout review's caller is grouped the same way as the critical-routing caller. The method relies on the fanned-out form only once its proof is recorded, so the proof is re-run on the changed form and recorded.

  Cost model. A review's cost is dominated by writing each root's context into the model's cache; reading it back is cheap. Letting a reviewer open images on demand instead of holding them in the root was tested earlier and cost the same or more, so it is not a saving and is not the design. The kit went to one flat root holding everything because splitting only duplicates writes, and that held on a small board. On a large board a single root exceeds any model's window, so grouping is unavoidable and has to be sized: the aim is the fewest total tokens written across all roots, each root within the budget. Replicas of a group read the group's cached root, so they stay cheap and the any-fail merge stays.

  Run evidence. On the main controller board the review was carried out by hand in six area groups, one of them doubled, run in parallel in about ten minutes of wall time. Each reviewer used roughly 200 to 240 thousand tokens in all and opened only three to eight of the 865 tiles, judging most items by measuring the board file, so a unit's real image needs are small and declared needs can pack groups larger than the estimate from the full view set suggests. Several items came back as unable to judge, or were judged by the reviewer's own measurement, because the pre-order check's reports (hole-to-hole spacing, pour gaps) are deliberately left out of the review folder. Each group's root therefore also holds the extract of those deterministic check results that its units need, so a reviewer cites the check and does not measure again. The headroom fraction of the model's window that a root may fill is a declared value set from a measured first run, not a figure fixed in a criterion.

  Out of scope in addition: chained or nested forks and forks carrying extra images, which are a larger change to the kit than this item makes and are carried by their own maintenance item, and any change to a board design or to the board's own checks.

  What it does. Every session of a review holds a context within a declared model-context budget. Each group's root holds the shared documents and the views that group's units declare, and no view only another group needs. A group whose own artefacts together with the shared context exceed the budget is refused before any session starts, naming the group and the figures, so the caller's declaration is corrected and not the model's window found out at run time. The caller declares units and the views each needs; the kit forms the groups, and the caller's remedy for a unit alone over the budget is fewer views for it. The plan reports, per group, the number of images and tokens it holds. The three callers that carry the image-heavy reviews, critical routing, layout and production files, and the schematic caller declare each unit's needs and the budget.

  The frozen proof designs and their recorded baselines. The recorded single-reviewer baselines are keyed by the hash of the seed list, the design commit, the model, the form and the prompt, and the design by the bytes of the files the review reads. This change edits no design file and no baseline, so every recorded key is unchanged and no baseline is re-recorded; recording a fanned-out run under its new key adds a run to the proof's run record and edits no baseline. The fanned-out form's own prompt and shared context change shape, which gives that form a new key; the harness runs a form whose key differs and refuses one whose key is recorded, so the next fanned-out proof run is a new run against the unchanged baselines and no recorded run is invalidated.

  Out of scope: the single-reviewer form, which holds every view in one session and exists to prove the fanned-out form on the small proof designs; a tree-shaped plan; the value of any model's window, which is data the budget states; and the layout of any particular board's views.
