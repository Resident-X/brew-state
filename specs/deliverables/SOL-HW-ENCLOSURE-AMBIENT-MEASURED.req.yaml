id: SOL-HW-ENCLOSURE-AMBIENT-MEASURED
type: deliverable
category: solution
title: The air temperature inside the controller's enclosure is measured on the running machine and recorded as the figure parts are graded to
status: active
version: 5
text: |
  Measures the air temperature inside the controller's enclosure on this machine and records it in the machine's design-constraints record as an input to the partition, so the grade of every part on the boards is chosen against the enclosure the boards sit in rather than against the room or an estimate. The enclosure's surroundings are at present an estimate, unmeasured, and a part graded for that estimate is graded for a guess.

  The air temperature is read with a temperature logger, or with two probe thermometers read by hand at intervals of ten minutes or less; either way the instrument's stated accuracy is recorded. Its sensors sit where the boards will sit, at least one near the top of the space and one near the heater side, with the leads routed out so the enclosure closes as it does in service. The machine runs at sustained full heat, both heaters at the duty that holds them at their highest set temperature with steam drawn, and the room temperature is read beside every reading. The readings have settled when none of them has moved by more than 0.5 degC over fifteen minutes. The builder runs the machine and supplies the log; the record states the positions, the instrument and its stated accuracy, the run's duration and duty, every reading with the room temperature beside it, the point at which they settled, and how each was established.

  The measured rise is the highest settled reading across the positions less the room temperature read at the same time, with the instrument's stated accuracy added once for each of those two readings, worst-case. The figure the parts are graded to is that rise added to the top of the room-temperature span the machine's declared configuration states, which SOL-HW-AMBIENT-SPAN-DECLARED declares. The rise is taken as independent of the room temperature the run happened to see: a warmer room lowers the heat the heated blocks give up to the enclosure air, so a rise measured in a cooler room over-states the rise in a warmer one and the sum is conservative. The replacement boards dissipate differently from the parts present during the measurement; their own dissipation is added by the boards' derating analysis and confirmed at bring-up, not estimated here.

  Humidity cannot be measured inside a running machine with what the builder has, so it is recorded as taken at its worst, condensing, which is the condition the separation basis's pollution degree assumes unless the boards are protected against moisture.
rationale: |
  Part temperature grades and the derating analysis start from the air around the boards, and that air is heated by two thermoblocks a few centimetres away. Every figure for it so far is an estimate. Measuring it once, on the machine as it is, costs a logger and an afternoon; grading parts on an estimate costs either a part run outside its rating or a part bought a grade higher than it needed.
