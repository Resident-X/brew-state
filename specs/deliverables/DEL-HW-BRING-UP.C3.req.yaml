title: Loss of the controller's proof of life is shown to remove heater power
status: active
version: 1
measurement_type: binary
verification: test
closes_by: cascade
text: |
  The interval from loss to removal is measured against the bound the safety chain requires.

  The proof of life is also shown not to be satisfied by a controller whose main loop has stopped while its timers and interrupts still run, or by an output stuck high or stuck low.
