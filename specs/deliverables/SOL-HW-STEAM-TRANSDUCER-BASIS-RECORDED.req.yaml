id: SOL-HW-STEAM-TRANSDUCER-BASIS-RECORDED
type: deliverable
category: solution
title: The pressure the steam-path transducer must survive and the ratings the part must carry are recorded as a derived basis with its premise and its check
status: active
version: 2
text: |
  Records, in the board design constraints record, controller-board-design-constraints.md, the pressure the steam-path transducer must survive in service and the proof and burst ratings the chosen part must carry, so the transducer can be chosen without waiting on inspection of the machine. The record takes a new subsection between the enclosure air temperature and the sensing accuracy sections, in the shape the enclosure air assumption already uses (a figure table, a statement of what ends the assumption, a premises table), and the pending mark held against the transducer's part cites it.

  The steam block holds no standing water and the transducer is exposed to the steam the block produces. With the wand open the feed sets the pressure; with the wand shut and liquid left in the block the pressure is saturation at the casting temperature, and the casting ceiling of about 150 degC bounds that to under 4 bar gauge. The steam pump carries an over-pressure valve directly on it, on the cold water side and downstream of the pump's own check valve, opening at about 4 to 5 bar (owner statement 2026-10-11, recorded in reference-machine.md, not yet confirmed on the machine). Because it sits at the pump outlet it limits the pressure the feed can put into the block whether or not a check valve lies further downstream. The in-service pressure is therefore the larger of that setting and the saturation bound, 5 bar gauge, graded inferred. The premises are three, each marked as one the machine inspection confirms or revises: the relief opens at no more than about 5 bar gauge (owner statement); the relief sees the pump outlet (owner statement, positioned on the pump); the casting ceiling holds (a control limit). That no check valve lies between the relief and the block is the owner's reasoning, not a statement, and it does not carry the in-service figure: it decides only whether the relief also vents a heat-driven over-pressure, which is the fault case.

  The record states the ratings the part must carry above it: proof pressure at least 1.5 times, 7.5 bar gauge, and burst pressure at least 2 times, 10 bar gauge, graded project assumption as margins chosen where no requirement fixes them, with what replaces them named (an adopter's own figures, or a published rating basis if one is later adopted). The margins also cover the relief's tolerance and accumulation above its setting. It states the earlier design's 0.5 MPa XDB401 as the baseline the figures are checked against, with the overload of 7.5 bar gauge and burst of 15 bar gauge relayed from the owner-supplied family datasheet, graded published unverified, reading the datasheet's overload as the proof pressure, so the baseline meets both ratings and the proof rating at equality.

  The record states the range requirement as two bounds. The upper bound follows from accuracy: the family's accuracy is a fraction of full scale, so the absolute error grows with range, and a part meets the steam accuracy only if its full scale does not exceed the accuracy divided by that fraction. The record's steam accuracy figure of 0.775 bar is a ceiling, and the same record states that a part is chosen against the tighter 0.25 bar where the floor is to be told from no pressure, so 0.25 bar is the binding figure (at 1 percent of full scale, a full scale of no more than 25 bar). The lower bound is that the range covers the highest pressure the control reads, ready-pressure-bar, 2.0 bar, in firmware/params/steam_control.declaration; clipping between that and the in-service pressure is acceptable.

  The record states the check: the partition and feasibility task's choice of form for the channel chooses the transducer, and the chosen part's own datasheet gives a proof pressure and a burst pressure at or above these ratings and a range inside both bounds, with the figures recorded against the part and their source. The comparison of the relief's opening pressure on the machine with the in-service figure belongs to the machine inspection's relief criterion, which the record names as the owner of the premise check. The record states that the highest pressure the machine could generate in a fault, 14.5 bar gauge at the steam thermostat's nominal trip with liquid trapped, is not this figure: the independent hardware layer answers to it. The component specification's line that the transducer's range and accuracy are not yet specified points at the new basis.
rationale: |
  The transducer part is chosen separately, and its choice would otherwise wait on the inspection of a relief valve whose only evidence is an owner statement on a machine that is out of service. The pressure the transducer meets in service is bounded by the feed, the casting ceiling and the pump's relief, all of which the record already holds; the 14.5 bar saturation at the thermostat trip is a fault pressure that a sensor is not asked to contain. Recording a derived basis with its premises lets the part be chosen now, and the machine inspection compares its relief finding with the basis and confirms or revises it.

  The in-service figure rests on the relief's position at the pump outlet, which is stated, and not on the absence of a check valve downstream, which is only the owner's reasoning; tying an in-service figure to a fault-path fact would put the premise on the wrong axis. The range rule follows the record's own accuracy source, which already says the 0.775 bar figure is not enough alone, so the basis does not restate a looser rule than the record it extends.
