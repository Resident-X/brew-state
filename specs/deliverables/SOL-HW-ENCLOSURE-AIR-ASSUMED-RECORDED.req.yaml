id: SOL-HW-ENCLOSURE-AIR-ASSUMED-RECORDED
type: deliverable
category: solution
title: The air temperature the controller's parts are graded to is recorded for the design as a derived project assumption with its premises and its check
status: active
version: 2
text: |
  Records, in the board design constraints record, controller-board-design-constraints.md, the air temperature inside the controller's enclosure that the parts on the boards are graded to, as a project assumption. The machine is out of service with its original controller removed, so the air temperature cannot be measured on it running before the boards are designed; the design needs a figure to grade against now, and the measurement is moved to the closed machine at bring-up, where it checks the figure.

  The figure is the top of the declared room-temperature span, which SOL-HW-AMBIENT-SPAN-DECLARED declares as 35 degC, plus an assumed rise of 35 K: 70 degC. The record gives it the grade project assumption, which that record defines as a value chosen where no fact exists, marked to replace, and states the derivation. The rise is unmeasured. It is set at the figure where the rating examined here, the logic supply's, still holds, and every other part's rating, including the mains inlet filter's derating above 50 degC, is for the derating analysis to grade against it: the IRM-10-5 carries 1.0 A at 70 degC on the chart values read for it, against a worst-case load of 0.66 to 0.86 A, and the chart gives it no rating above 70 degC. A lower figure cannot be checked until the boards exist, so the figure is set at that ceiling and not below it. The record says that an adopter's machine takes its own declared span and its own rise in place of both, and that the figure is replaced by what the bring-up measurement of the enclosure's air temperature establishes.

  The record states the premises the figure rests on, with who stated each and when. First, the owner's plan, stated 2026-10-23: the two heater switching devices are mounted outside the controller enclosure, directly on the machine's metal wall at the bottom of the machine near the pumps, by cutting away the plastic side wall, so the owner's plan places the switches and their dissipation outside the enclosure, and any heat they pass to the enclosure through the shared wall is for the partition task to assess; if they are mounted inside it, the figure is derived again. Second, the heat the two thermoblocks give off near the enclosure is what drives the rise, and it is not estimated here. Third, the boards' own dissipation is not part of the air figure: the derating analysis adds it when it grades each part. The record also states that humidity is declared once, in reference-machine.md § Ambient, as condensing until measured, and cites it without declaring anything of its own.

  Two entries are marked pending against the work that settles them. The check of the figure on the running machine is pending against the bring-up criterion that measures it, and ends when that work records the measured figure and its source. Whether mounting the heater switching devices on a cut wall keeps the retrofit within the requirement that the replacement electronics drop into the machine as found, or makes the switching assembly a device the retrofit adds, which that requirement leaves outside its scope, is pending against the partition and feasibility task, which also settles where each heater switch is judged against its rated temperature.
rationale: |
  The grade of every part, and the derating analysis that follows it, start from the air around the boards, and the figure for it is still an estimate. The machine cannot be run with its original controller to measure it, and waiting for the new boards to measure it would hold the partition of the circuitry for a figure that moves no part choice. Recording a conservative, derived and checked assumption lets design proceed on a stated figure, and the bring-up measurement that the requirement asks for confirms it or replaces it.
