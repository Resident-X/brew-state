id: DEL-HW-PRE-ORDER-CHECKS-EXTENDED.C15
type: criterion
title: A connected pin of a semiconductor or integrated circuit that the pin-limit record leaves unlisted fails the check
status: active
version: 1
measurement_type: binary
verification: test
closes_by: cascade
text: |
  Every connected pin of a semiconductor or integrated-circuit part has an entry in its pin-limit record entry, carrying the pin's domain and its absolute limits, and a connected pin the entry leaves out is failed by name with its part, so a pin whose net can exceed its absolute maximum cannot pass by being left unlisted.
