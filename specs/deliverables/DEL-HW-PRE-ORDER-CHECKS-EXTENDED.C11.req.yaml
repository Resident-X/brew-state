text: |
  Every board design the repository tracks, the proof designs included, carries the records these rules read, synthetic where the design is not for manufacture, and passes them; the rules run in the build round of every change to a board design or to any of those records, and in the nightly full verification of main, with the derating policy and pin-limit records among what the round reads for a design.
