id: DEL-MAINTENANCE
type: deliverable
category: epic
title: Maintenance and business-as-usual — ongoing defect correction and emergent work
status: active
level: epic
version: 2
text: |
  The standing home for emergent, corrective, and business-as-usual work that arises outside the roadmap's value-delivery phases: defects in delivered behaviour, small corrections, cleanup, and patching, together with remediation of work that shipped without honouring its own sealed criteria. Each item is grouped here as a child task or solution and traces to the requirement criterion whose behaviour it restores, so this work can be ranked and scheduled independently of net-new delivery while each item still points at the intent it serves.

  The lane is continuous: it is never itself sealed, and its state is only ever the rolled-up state of whatever work it currently holds. It carries the maintenance role marker so it is distinguishable from strategic delivery by query rather than by title or prose, and it sits outside the roadmap's phases — reached by name, not by walking the delivery tree from the roadmap.
rationale: |
  A closed deliverable admits no further work, yet defects surface in delivered behaviour and ordinary maintenance never stops. Both need a delivery-chain home that is ranked alongside strategic work but is not a phase of it and never itself completes. This epic is that home. It groups standalone corrective and business-as-usual work at the epic level so cross-domain items attach as ordinary children rather than as solutions hung directly off a single milestone.

  It replaces an earlier, narrower model in which every confirmed shortfall in sealed work became its own criterion, naming the closed criterion it missed, with a solution beneath. That model conflated a criterion — a specification of done — with a work-tracking slot, grew the criterion list by one for every fix, and by construction excluded general maintenance that corrects live or emergent behaviour rather than remediating a sealed criterion. The continuous-lane model keeps a single criterion that composes by cascade over its children, and carries admission discipline on each child's trace to the requirement it restores rather than on a criterion per shortfall. DEC-MAINTENANCE-CONTINUOUS-LANE records that change and the gate it accepts loosening.

  The lane sits outside the roadmap's phases because maintenance is not a stage of the work and does not sequence against the others. Its consequence is accepted: it does not surface when the delivery tree is walked from the roadmap, so its contents are reached by naming it. Its continuous closure is what keeps the seal surfaces from ever asking it to complete; its state is only the state of the work it currently holds.
attributes:
  role: maintenance
  closure: continuous
