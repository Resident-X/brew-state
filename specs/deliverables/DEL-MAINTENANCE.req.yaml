id: DEL-MAINTENANCE
type: deliverable
category: epic
title: Remediation of delivered work that fell short of its own criteria
status: active
level: epic
version: 1
text: |
  Work closed out under a sealed or attested deliverable sometimes turns out not to have delivered what that deliverable's own criteria required. brew-state carries the remediation of those shortfalls here rather than in the closed deliverable, which admits no further work.

  Each confirmed shortfall becomes one criterion of this epic, naming the closed deliverable whose stated intent went unmet and the observable state that remediation restores, with the task or solution that closes it wired beneath. Nothing is admitted that does not meet that description: the gap must be against intent the closed deliverable already stated, and the deliverable must be closed to further work. A gap against intent recognised only since closure is new scope and is authored where that scope belongs; a gap in work still open is closed in the open work.

  This epic carries no criteria until a shortfall is confirmed, and it is sealed only when the graph itself is complete.
rationale: |
  Sealing and attestation are deliberately one-way: a closed deliverable's criteria are the historical record of the spec its work was built against, and editing them destroys the evidence of what was actually agreed. That leaves a real hole. When a defect surfaces that the closed criteria plainly already required, there is nowhere to put the fix — the deliverable that owed it cannot take it, and inventing a new phase for every such fix would shred the roadmap.

  Supersession is the wrong instrument for this case, and the distinction is worth stating because the two are easily conflated. Supersession corrects a spec that was wrong: the criterion said the wrong thing, so a successor deliverable carries the right thing. This epic covers the opposite case, where the criterion said the right thing and the delivery did not honour it. Superseding a sound criterion to re-state it unchanged would misrecord the history as a specification error.

  The admission gate is what stops this from becoming a dumping ground, and it is deliberately narrow on two axes rather than one. Closure is the first: work still open absorbs its own defects, so routing a fix here to avoid reopening a live deliverable is an evasion, not a use. Intent already stated is the second, and it is the load-bearing one — it forces the author to point at the specific closed criterion that was not honoured. Anything that cannot name that criterion is not remediation; it is scope discovered late, and the discipline this project runs on is that discovered scope is authored as new nodes rather than smuggled in as a fix.

  This epic sits outside the roadmap's phases rather than under one of them, because remediation is not a stage of the work and does not sequence against the others. Its consequence is accepted: the epic does not surface when the delivery tree is walked from the roadmap, so its contents are reached by naming it. That is preferable to fitting a non-phase into a phase list and corrupting what a phase means.
