id: SOL-HW-HEATER-WALL-BOARD-WALL-STEEL-RECORDED-AND-TRIAC-THERMAL-JUDGEMENT-HOLDS-ON-IT
type: deliverable
category: solution
title: The wall steel's grade and thickness at the cut are on record and the triacs' thermal judgement is re-judged on them
status: active
version: 2
text: |
  Record the steel's magnetic grade, thickness and bolted-joint thermal resistance at the owner's cut, with source or marked as the owner's measurement, and re-judge the triacs' wall-assembly thermal margin on them.

  The leaf cannot close before the owner's dated statement of the measured grade and thickness exists (its third criterion): the judgement is made provisionally on bounding figures meanwhile, and the owner's existing acceptance that carries these quantities to the cut-time checks is the statement's home, not a second request.


  Settled at readiness, 2026-11-21: the owner's statement is that the wall at the cut is 2.5 mm thick and non-magnetic, scratches easily with a screwdriver to bright bare metal under a dark grey finish, and is aluminium, not the stainless steel earlier records assumed; no eddy-current (magnet-drag) test was made, so the identification rests on the scratch test and the appearance, and the stainless figures stay in the record as the bounding case. The judgement's live basis is the external household air at 25 degC nominal and 40 degC bound, with 70 degC kept for the board-side parts; the 45 and 70 degC wall-path tables are superseded history and are not redone. The bolted joint's resistance has no published source in the records, so it is carried as the range of 0, 1 and 3 K/W with 3 K/W as the stated limit that the bring-up case-temperature measurement closes. Placement: the machine record's division and constraints documents, the board's constraints-figures, open-items, circuit-proof and owner-sign-off records, and the margin script that generates the judgement's arithmetic.
