id: SOL-MAIN-BOARD-BACK-SIDE-PARTS-AND-VIAS-IN-PADS-MOVED-BY-THE-PLACEMENT-METHOD.C5
type: criterion
title: Every record naming a clamp for any of the seven BAT54S references states BAT54SW,115 C78606 and the pin-limit check evaluates all seven
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Every record in the main board folder that names the clamp part for any of D502, D504, D506, D523, D524, D527 and D528 states the swapped part, Nexperia BAT54SW,115 (LCSC C78606): the per-reference rows of the parts specification, the per-reference rows of the schematic specification and of every sheet record that names a clamp, the per-reference clamp rows of the circuit verdicts, the circuit-proof clamp decks and the generators and comments that write them, the traceability rows that name the clamp, the catalogue extract, which carries an entry for C78606 so the board tier's catalogue check passes, and the generic mentions of the part in the error budget and the circuit proof. The pin-limits record's single shared clamp entry is re-keyed to C78606 with pins 1, 2 and 3 limited from the maker's sheet, with no split entries, and the C47546 clamp entry is gone unless another part still uses it, so the pin-limit and derating check evaluates all seven references and prints no skipped-part line for any. The test fails when any such record still names C47546 for one of the seven, when a record names C78606 for a reference outside the seven, when the pin-limits record lacks the C78606 entry or keeps a second clamp entry for the same references, when the catalogue extract lacks C78606, and when the check run on the main board evaluates a clamp reference against no entry. Out of scope: the electrical-equivalence reading (the equivalence criterion), and the schematic symbol and board fields.
