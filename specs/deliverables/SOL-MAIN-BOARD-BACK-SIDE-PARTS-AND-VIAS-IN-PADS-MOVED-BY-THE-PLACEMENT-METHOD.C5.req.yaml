id: SOL-MAIN-BOARD-BACK-SIDE-PARTS-AND-VIAS-IN-PADS-MOVED-BY-THE-PLACEMENT-METHOD.C5
type: criterion
title: Every record naming the clamp for D502 or D506 states BAT54SW,115 C78606 and the pin-limit check evaluates both parts
status: active
version: 1
measurement_type: binary
verification: test
text: |
  Every record in the main board folder that names the clamp part for D502 or D506 states the swapped part, Nexperia BAT54SW,115 (LCSC C78606), for those two references and still states the earlier BAT54S (LCSC C47546) for D504, D523, D524, D527 and D528: the per-reference rows of the parts specification, the per-reference rows of the schematic specification and of the thermistor sheet record, the per-reference clamp rows of the circuit verdicts, the thermistor clamp decks and the generator that writes them in the circuit proof folder, and the traceability row of each thermistor block that names the clamp. The pin-limits record carries its own entry for C78606 with pins 1, 2 and 3 limited from the maker's sheet, so the pin-limit and derating check evaluates D502 and D506 and prints no skipped-part line for either; a shared C47546 entry is not read as covering them. The test fails when any such record still names C47546 for D502 or D506, when a record names C78606 for a reference other than D502 or D506, when the pin-limits record lacks the C78606 entry, and when the check run on the main board evaluates D502 or D506 against no entry. Out of scope: the electrical-equivalence reading (the equivalence criterion), the schematic symbol and board fields, and records of D504 and the I2C clamps.
