id: SOL-HW-MAIN-BOARD-INTERLOCK-ENTRY-JUDGED.C8
type: criterion
title: The interlock's single faults are each examined and the mechanism chosen to remove power or detect them
status: active
version: 1
measurement_type: binary
verification: analysis
text: |
  Every part of the interlock mechanism is taken as failed open, short and stuck, and each outcome is stated as heater power removed or the fault detected by the chain's own means before a second fault can combine with it, with the machine held from heating until a person attends. The mechanism is chosen to meet that, and the choice and the faults it leaves to detection are recorded. Drawing the mechanism and demonstrating it on a built board are out of scope.
