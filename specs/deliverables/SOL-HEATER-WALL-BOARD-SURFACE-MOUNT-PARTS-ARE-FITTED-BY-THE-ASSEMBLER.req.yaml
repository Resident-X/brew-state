id: SOL-HEATER-WALL-BOARD-SURFACE-MOUNT-PARTS-ARE-FITTED-BY-THE-ASSEMBLER
type: deliverable
category: solution
title: The heater wall board's surface-mount parts are fitted by the assembler, with the fiducials its process asks for
status: active
version: 1
text: |
  Brings the heater wall board to the owner's decision of 2026-11-23 that the assembler fits every numbered part of the board, in place of the decision of 2026-11-19 that the board is a bare-PCB order with every part fitted by hand. The board's two opto-triacs and four gate resistors are surface-mount parts that the layout excluded from the position file because they were to be hand-fitted; the assembler can place them only once they are in it. The assembler's rule for a side carrying assembled surface-mount parts asks for fiducial marks, which the board, drawn for hand fitting, does not carry.

  The change takes the exclusion off the six parts, adds the fiducials in low-voltage copper clear of the mains copper, places the opto-triacs with a recorded override (the assembler's footprint for them does not match the board's pads within the default tolerance, so their rotation is judged against the assembler's preview), and amends the board's records and parts specification to the new decision. The varistors keep their footprint; the stagger of their leads is out of scope.
rationale: |
  The owner wants one assembled order for the wall board to see its cost and to have the assembler's preview check the fitment of every part. Honours REQ-BOARD-LAYOUT-PRACTICE-001: a board is laid out for the way it will be made, and a board assembled by the maker carries the marks the maker's process asks for. Mains copper stays locked and the separation basis is not changed.
