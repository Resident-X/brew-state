id: SOL-PRE-ORDER-CHECK-MEASURES-SAME-PART-MAINS-PAD-PAIRS-AND-MAINS-ZONE-FILL-ITSELF
type: deliverable
category: solution
title: The pre-order check measures the pad pairs of one Mains part and the fill of a Mains zone itself, reads a zone clearance of 0 as unset, and fails a rule engine list cut at its cap
status: active
version: 1
text: |
  The pre-order check judged a spacing shortfall between two pads of one part from the lines the rule engine lists, and the rule engine does not list every line. KiCad cuts each list it reports at a cap, 499 lines for the clearance class, and which lines it cuts is not fixed between runs. A signed same-part clearance entry could therefore fail as covering no shortfall in one run, while the design failed its clearance in another, with nothing changed in the layout. On the main board as laid out, the first pass reported exactly 499 clearance lines in every run and 33 pad-to-pad lines were cut on each of them, 18 of them between different parts, so a shortfall between two parts could have gone unseen. A zone clearance written as 0 was read as below the signed figure, though the tool that writes the layout file writes 0 for an unset clearance. A Mains zone with a local clearance could also fill trimmed or empty and no finding followed.

  Settled for the build:
  - Every pair of pads of one part that stand on two different Mains-class nets is measured by the check from the pads' own copper, in the refilled layout. A pair nearer than the signed pad-to-pad clearance is a clearance finding worded as KiCad words its line and placed where KiCad's line would be, so the pair is one finding and the existing exception judgement reads it. A signed same-part entry is judged against this measurement and fails as covering no shortfall only when the measurement finds none, whatever the rule engine lists.
  - A zone clearance written as 0 is no local clearance, as an unset one.
  - A Mains-class zone is held to a fill floor after the refill: its filled area on each layer is at least 90 % of its outline area, and a zone below it fails the design naming the zone, the layer and the fraction. The floor is 90 % and not 97 % because of the fractions measured. Sound pours on the main board fill at least 0.992 of their outline after the refill. The throwaway proof design carries two sound pours at 0.946 and 0.939, which a floor of 97 % failed. The trimmed and empty pours the rule exists to find fill 0.09 to 0.49. A floor of 90 % lies between the two groups with room on both sides. A rule area is not a pour and is not judged.
  - A rule engine list that reaches its cap on a pass carrying a Mains rule fails the design, naming the pass and the count, so a cut list is never read as a complete one.
  - The Mains clearance findings of the first pass are gathered in two runs that each stay under the cap, the second reading the layout the first refilled and saved, without a refill of its own. The first run leaves the pairs of two Mains-class pads to the second, a finding both runs list is reported once, and the findings are judged by the signed exceptions as before. On the main board the runs report 420 and 112 clearance lines, where one run reported 499 and lost 33, and the second run adds about 12 seconds. The accepted entry for the fifteen-net neutral group then covers 491 shortfalls where it covered between 457 and 477 in earlier runs, the verdict unchanged.
  - The seeded-fault proof (task hw:prove) holds a seed for each rule the change adds. A seed adds 256 short Mains tracks to the proof design so that the first run reaches its cap (report_cut_short), and a seed gives a Mains pad a custom shape so the pad pair is measured from its own copper (mains_pad_pair). The seed that empties a Mains pour was already present. The seeded-fault proof's design constants for the review-proof design no longer shadow the circuit-review ones, which made the pin-coverage seed fail to apply and stopped the whole proof before it judged any fault.
  - Four defects in tests, found when the tests were run beside the change, are corrected with it: a stub standing in for the check's report took a shorter argument list than the report passes; the recorded list of the divided KiCad tests was out of step with the tests the divided files yield; the tests of the signed-exception judgements looked for the separation basis record in the design's own folder where the check finds it nearest at or above that folder; and the two tests that judged every tracked design, of the mains-to-mains rules and of the marks, now judge the designs under hardware/proof/ only. The machine's own board is judged by the whole-repository run of the check (task hw:verify) and by the whole-repository test, so the narrowed tests lose no verdict on it.
  - Four further defects in tests, found when the machine's own board first passed the check, are corrected with it. A test of the tracked designs read a design's verdict from the end of its line, which a signed warning count now follows, and it now reads the verdict field. The seed copies of a tracked design lacked the records the check finds above the design's folder, and they now carry every one of them. The sensing test required no line at all where a signed severity policy now prints its counted warning lines, and it now allows those lines for a tracked design and holds the proof designs to none. The exception tests forbade accepted lines on every design where the machine's board carries its own signed entries, and they now forbid violations on every design and accepted lines on the proof designs only.
  - hardware/README.md and the hw:verify task's description say the same-part Mains pad pairs and the Mains zone fill are measured by the check itself, and state the 90 % floor.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks, that every board is judged against every applicable item before it is ordered, and judged the same way on every run. A check whose verdict on a same-part clearance entry changes with a list KiCad cuts at random, and which cannot see a shortfall whose line was cut, does not judge the board against the signed clearance. The creepage and judgement items delivered the passes and the exception readings; neither measured a pad pair itself or looked for a cut list, so this is a separate item, not an amendment of them. What the signed clearances are, and how an exception is judged, are not changed.
