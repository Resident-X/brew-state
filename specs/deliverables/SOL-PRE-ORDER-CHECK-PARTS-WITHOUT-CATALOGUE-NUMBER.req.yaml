id: SOL-PRE-ORDER-CHECK-PARTS-WITHOUT-CATALOGUE-NUMBER
type: deliverable
category: solution
title: The pre-order check accepts a part stated to have no assembler catalogue number and looks nothing up for it
status: active
version: 1
text: |
  The parts rule holds every placed position to the parts specification record and the catalogue extract, and fails a position whose LCSC field is absent or whose number the extract does not show in stock (SOL-HW-PARTS-CHECK.C1, .C2). A hand-fitted connector, test point or link has no assembler catalogue number and so cannot pass, which the first real board meets.

  Settled before build: a position that is not placed by the manufacturer states its catalogue number as the word none, lowercase, in both the record's lcsc key and the design's LCSC symbol field, and the two must agree, so an absent number stays a failure and silence never reads as compliance. For such a position the rule looks nothing up in the catalogue extract, consults no stock or age figure, and still compares value, package and rating. The change lands in the existing parts rules in hardware/tools/board_check.py and the hardware notes. DEC-BOARD-DESIGN-RECORDS-AS-YAML is amended to state the convention in the same change.
rationale: |
  Restores the behaviour of the parts rule that a design is held to its record, without making a hand-fitted part impossible to pass.
