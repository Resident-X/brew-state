id: SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT.C16
type: criterion
title: The fabrication notes specify laminate families with a published comparative tracking index of at least 175
status: active
version: 3
measurement_type: binary
verification: inspection
text: |
  The fabrication notes kept with the board's design records, which the order passes to the manufacturer, specify the laminate families whose published comparative tracking index is at least 175 (material group IIIa or better), the figure the separation basis record's material group rests on. For each family the notes cite the laminate maker's document for that index and the revision read, state the order note that requires the family, and state the written request the owner makes of the manufacturer for the shipped laminate's identity and a certificate of its index; a family whose maker publishes no index in the documents read, or only a typical value or a figure with no test method named, is listed as such and is not specified. A laminate whose published index is below 175, or one specified with no such document cited, is reported and the owner re-declares the basis before the board is ordered. Choosing the laminate's supplier, and receiving the certificate, are out of scope.
rationale: |
  Amended from version 1 in this pull request, before any evidence existed, and amended again once the evidence was found to overstate. Version 1 asked the notes to cite the laminate maker's current document for the index. Version 2 dropped "current" and asked for the document and the revision read, because the repository cannot show a copy to be the maker's current one: the makers' sites could not be reached and every copy read is hosted by a distributor. That narrowing was made to fit what the work could do, and it leaves the question of the current document unanswered; the answer is moved, not removed, to the order leaf, whose C5 requires the manufacturer's written statement of the laminate and a certificate of its index, or the owner's re-declared basis, recorded before payment. Version 3 adds that a family whose maker prints only a typical value, or a figure with no test method named, is listed and not specified, because a typical value is not a minimum: Shengyi S1141 prints 175 as typical with no specification limit, and Kingboard KB-6165F prints 175 V with no method. Only Shengyi S1000-2M and S1000-2, which print the PLC3 class and range, are specified.
