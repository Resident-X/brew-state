id: DEL-HW-REVIEW-FAN-OUT.C1
type: criterion
title: A review that names its folder, its units and its reviewer prompt runs each group of units as concurrent read-only forks of one shared context and merges the results
status: active
version: 3
measurement_type: binary
verification: test
closes_by: cascade
text: |
  A review whose folder, units and reviewer prompts are declared is carried out by forks of one shared context that the command builds from every artefact the units need, sent as one message with no tool use, with the units that depend on one another judged together and each unit judged by more than one differing fork whose results are merged so that any fail stands. Every session of one review starts from the same system prompt, tools, model and result schema. A review with one group is judged in a fork of the shared context as well. The number of sessions running at once is bounded, a unit that fails or returns a malformed result is repaired or run again and then fails the run naming that unit, and the merged result does not depend on the order in which the sessions finish. Each session's own time, tokens and cost are recorded against the prediction, and the command reports in text and in JSON.
links:
