id: SOL-PRE-ORDER-CHECK-CLASSIFIES-COSMETIC-LINES-AS-RATCHETED-WARNINGS-UNDER-OWNER-SIGNED-POLICY
type: deliverable
category: solution
title: The pre-order check prints a cosmetic or neatness line as a non-failing warning only for a class the owner-signed severity policy names, bounded by a count that fails when it rises, and fails every other line
status: active
version: 5
text: |-
  Gives the pre-order check a second tier for purely cosmetic and neatness lines, under an owner-signed severity policy with a ratchet, so that a board whose only remaining lines are of those classes can pass while every other line still fails. Today the check exits non-zero on any line it prints. The sibling item for a per-line signed acceptance record lets the owner excuse particular lines, each by rule and place and count, which suits a few lines but not hundreds of router-neatness lines whose number moves with every re-route. A severity policy states, once per class of line, whether the class is an error or a warning, and bounds the warnings by a count, so the owner signs a classification rather than a list of lines.

  The check reads this record from each board design, so a board whose remaining lines are cosmetic can end green by policy and does not end red on them.

  Settled for the build:
  - Record shape. Each board design's records gain an optional severity policy record, `severity-policy.yaml`, found and read as the derating policy record and the workmanship acceptance record are: the nearest at or above the design's folder, tracked. Its top level holds `severity_policy`, a list that is required, an explicit empty list being a policy that marks nothing a warning, and optionally `synthetic`. No board ships with a policy, and the main board's real policy file is the owner's to sign. Each entry, whose keys are `class`, `severity`, `count`, `reason`, `accepted_by` and `accepted_on`, names a class of line, as the check names it in its report (the rule name, such as silk_overlap or track_angle); a severity, ERROR or WARNING; for a WARNING entry the count of warning lines of the class the owner accepted, a non-negative whole number; the owner's reason; who signed; and the date. An ERROR entry is allowed and states a class the owner has considered and keeps as an error; it carries no count. Every key is present on an entry except `count`, which is required on a WARNING entry and absent on an ERROR entry. An entry that is not a mapping, lacks a key, holds another key, repeats a class, gives another severity or gives a bad count fails the record naming the entry and the key. Failures of the policy are reported under the rule name `severity_policy`.
  - Judgement. The policy is judged before the per-line acceptance record: a line that qualifies as a WARNING is made a WARNING line and is counted, and every line left goes to the per-line judging, so no line is both a WARNING and ACCEPTED. A line of a class the signed policy marks WARNING is printed as a WARNING line with the class, the place, the measured figure against the allowed one and the class's recorded count, is counted, and does not fail the check, so a design with only warning lines exits zero and is reported as passing with its warning count. The check's text report, which is its only report and has no JSON form, gives for each class the found count beside the recorded one.
  - Ratchet. A class whose found count is above its recorded count fails the check, naming the class, the recorded count and the found count, so warnings cannot drift upward unseen. A count at or below the record passes and is reported, and lowering the record is the owner's to do when a class improves. KiCad cuts the lists for `track_angle` and `track_segment_length` at its cap, `REPORT_LIMIT` (199) in the check's tooling. When the list of a class has reached the cap, the found count is reported as at least the cap, and the class passes only if the owner's signed count equals the cap; a signed count below the cap with a capped list fails, naming the class, the signed count and the cap. A list below its cap is ratcheted normally, so a found count above the recorded one fails.
  - Fail closed. A line of a class the policy does not name, and every line of every class when the policy is absent, unreadable, or has an unsigned entry (the signed-by value empty, a placeholder or in angle brackets, or a date empty, malformed or later than today), is printed and fails exactly as it does today. A malformed entry, and an entry that names a refused class (one outside the closed list, one in the never-warnings list below, or one the check does not report), each fail the record naming the entry and void the whole policy exactly as an unsigned entry does: no line becomes a WARNING and all lines stand as errors.
  - Never warnings. The check refuses a policy naming a class that carries safety, mains spacing, creepage, clearance, derated-voltage, pin-limit, mounting-hole, plated-hole, connectivity, hole, annular ring, drill, other manufacturing, paste, solder, courtyard overlap or separation basis findings, and refuses one naming a class the check does not report. The classes the policy may name, at either severity, are a closed list of fourteen rule names kept in the check: the silkscreen and designator lines `silk_overlap`, `silk_edge_clearance`, `designator_astray` and `reference_off_silkscreen`, and the routing-neatness lines `track_angle`, `track_segment_length`, `workmanship_direction`, `workmanship_pad_entry`, `workmanship_pad_corner` and `workmanship_detour`, and the narrow-track and return-path lines `track_width`, `workmanship_width`, `ground_return` and `test_point_courtyard`. An ERROR entry is limited to the same list. A routing-neatness line, `track_width` and `ground_return` lines included (decided 2026-11-07), is a WARNING on any net, with no net-class qualification, because clearance, creepage and every other separation rule have their own rules that still fail on any shortfall, so a neatness line cannot hide a spacing fault. `silk_over_copper` is not in the list: KiCad reports it as silkscreen clipped by solder mask, and the check cannot tell silk over a pad's solderable area, which stays an error, from other cases. `courtyards_overlap` and `items_not_allowed` stay errors that no policy can mark WARNING. a class is added to the list only by changing the check.
  - Relation to the per-line record. The per-line acceptance record of the sibling stays for what a class policy cannot cover, a few lines of one rule and place; it may still name `test_point_courtyard` and `workmanship_width`, whose lines a valid policy WARNING entry makes stale. The plated coil-pin lines of the relays K201, K731 and K741 are not among them: they were an artefact of the mounting-hole rule's straight-line measure, which the sibling item that measures a low-voltage part's plated hole round the barrier slots corrects, so no such line remains to be recorded, and they are never a warning. Under a valid signed policy, an entry of that record for a class the policy marks WARNING is unused and is reported stale; a void policy marks nothing, so the per-line entries are judged as before.
  - No signing by the agent. Nothing in the check or in a record is signed by the agent; the policy is the owner's, a drafted policy stays unsigned until the owner signs, and the check fails closed on it meanwhile.
  - Proof designs and notes. The throwaway proof design gains synthetic policies where a test needs them, on designs not for manufacture (an agent never writes `accepted_by` for the owner; tests and seeds use synthetic copies), with a seeded fault caught for each failure above, and the hardware notes state the tiers, the entry form, the WARNING and count lines and the failures.
    - A policy record marked synthetic on a design that is not marked not for manufacture fails as a severity_policy line and voids the policy.
    - A per-line workmanship entry that a valid policy WARNING entry makes stale is reported under the rule name workmanship_acceptance.

  Out of scope: which classes the owner signs as WARNING, the owner's signing of any policy, the counts, the rules' thresholds and measures, any change to a board's design files, the per-line acceptance record's own behaviour, and the safety, mains-spacing and derating exception forms.

  Build order with the per-line acceptance record. On 2026-11-07 the owner decided that this item and SOL-PRE-ORDER-CHECK-JUDGES-OWNER-ACCEPTED-WORKMANSHIP-LINES are built together on one branch and verified by one round gate, because the per-line record cannot carry the main board's neatness lines (a record entry names one net, part or text variable, the lines lie on hundreds of places, and two of KiCad's lists are capped so a different subset of lines shows on each run) and the gate cannot pass on the main board until a policy of this kind is signed. The wait on the per-line item is therefore not held as a dependency; the per-line judging is implemented first inside the branch, because this item extends the judging step it builds.
rationale: |
  Restores the behaviour REQ-BOARD-LAYOUT-PRACTICE-001.C5 asks of the workmanship rules: a failing workmanship item is resolved by a change to the board or a recorded finding that it is overridden, never by judging the failure unimportant. A warning tier is a recorded override at the level of a class: the owner signs, once, that a named class is cosmetic or neatness only, on a stated reason, with a ceiling on its count that the check enforces, so no line is judged unimportant by the agent or by the tooling, and a rise is an error. The practice catalogue's severities (safety, function, quality, cosmetic) say how much an item matters in general; the policy says what the owner accepts as a printed non-failing line on a given board, and it may be narrower than the catalogue but never wider than the closed list of fourteen classes the check allows. The catalogue marks only silkscreen and designator items and the 1 mm jog and the edge-parallel items as cosmetic, while corner angle, detour and pad entry are quality or function items, so the starting classification below includes quality-severity routing classes by the owner's choice, which is why it is the owner's to sign and not derived from the catalogue.

  Why a policy beside the per-line record. DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER item (o) records the owner accepting the check red on about 750 routing lines, 93 stray designators, 14 silkscreen overlaps and others, on the condition that no change is a net gain across safety, then performance, then workmanship. A per-line record of that many lines would be rewritten at every re-route; a signed class policy with a count states the same acceptance in a few lines and keeps it bounded. DEC-BOARD-PRE-ORDER-RULE-READINGS fixes that each rule reads declared records and fails what is missing; the policy follows that reading, so an absent or unsigned policy fails closed and is not read as permission.

  Not built. This item is authored and unbuilt. The wall board should have it built first, so that board can end green on cosmetic lines by policy.

  Proposed starting classification, for the owner to sign. Nothing here is signed.
  WARNING candidates:
  - silk_overlap (silkscreen over silkscreen): legibility only, no electrical or assembly consequence; the manufacturer prints it as drawn.
  - silk_edge_clearance: silk is trimmed at the board edge by the manufacturer; appearance only.
  - designator_astray and reference_off_silkscreen: where a reference designator stands bears on legibility and bring-up reading, not on function; the catalogue marks MFG-9 cosmetic. The reference_off_silkscreen rule is MFG-7, a quality item, so the owner should sign it knowingly.
  - track_width, workmanship_width, ground_return and test_point_courtyard, on any net: added on 2026-11-07, when the owner decided to widen the closed list from ten to fourteen. They are neatness lines that the owner's acceptance (o) of DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER already covered among the remaining workmanship and neatness lines (the classes it added on 2026-11-06 include ground_return 17, track_width 51 and workmanship_width 14): narrow tracks and return-path lines in dense areas that the layout passes could not widen without breaking a spacing figure, and test-point courtyards (21), which need moves on dense copper that disturb the sense and mains spacing the board was proven against. Like the routing-neatness classes they carry no net-class qualification, since clearance, creepage and every other separation rule keep their own failures. Only track_angle and track_segment_length are capped lists, so the cap rule is unchanged.
  - track_angle, track_segment_length, workmanship_direction, workmanship_pad_entry, workmanship_pad_corner and workmanship_detour, on any net: neatness of routing. These are the classes about 750 of the main board's lines fall in, and in dense routing the corner rule and the short-segment rule conflict, so a count ceiling is the honest bound. The owner decided on 2026-11-07 that no net-class qualification applies, because clearance, creepage and every other separation rule have their own rules that still fail on any shortfall, so a neatness line cannot hide a spacing fault.
  Not a candidate: silk_over_copper. KiCad reports it as silkscreen clipped by solder mask, and the check cannot tell silk over a pad's solderable area, which stays an error, from other cases, so it fails closed.
  ERROR for everything else: every safety, mains spacing, creepage and clearance line, derating and pin-limit lines, mounting-hole and plated-hole rules, connectivity, hole, annular ring and drill rules and other manufacturing rules, paste and solder-related rules, courtyard overlap and separation_basis. Courtyard overlap stays an error because two courtyards overlapping can mean parts that cannot be assembled or reworked, which is a manufacturing consequence and not appearance.
  The per-line record of the sibling remains for what the policy cannot cover, a few lines of one rule and place. The plated coil-pin lines of the relays K201, K731 and K741, an artefact of the mounting-hole rule that the owner accepted on 2026-11-06 with that description, are removed by the slot-aware plated-hole measure and need no entry.

  Wrong-axis check: the line is drawn where the consequence lands (appearance and legibility against assembly, function and safety), not where the rule sits in the check, so a class that can reach a board's function is never a warning however neat its rule is; routing neatness is not such a class, since every function and separation consequence has its own rule.
