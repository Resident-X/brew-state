id: SOL-HW-FUNCTION-FORM-DECIDED
type: deliverable
category: solution
title: Each controller function is given its form, a designed circuit or a bought module, with its reason, and the figures held pending against that choice are recorded
status: active
version: 1
text: |-
  Decides, for every function the replacement electronics serve, whether it is a circuit the project designs or a module it buys, each with a reason weighed against the fixed constraints and the cost boundary, reopening every module of the earlier design, and records with its source each figure the controller boards' design-constraints record holds pending against that choice.
