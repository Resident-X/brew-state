id: SOL-HW-FUNCTION-FORM-DECIDED
type: deliverable
category: solution
title: Each controller function is given its form, a designed circuit or a bought module, with its reason, and the figures held pending against that choice are recorded
status: active
version: 2
text: |
  Decides, for every function the replacement electronics serve, whether it is a circuit the project designs or a module it buys, each with a reason weighed against the fixed constraints and the cost boundary, reopening every module of the earlier design, and records with its source each figure the controller boards' design-constraints record holds pending against that choice.

  The forms settled for the four choices the record rests on are these. The controller's microcontroller is designed onto the controller board and assembled by the board manufacturer, not bought as a module, and the module of the earlier design is not kept; the part is expected within the family the target build nominates, the selection stating the effect on the firmware's target build if it is not, and the part itself is selected by the partition task's controller-selection criterion before any board's pin allocation. The coffee and steam elements are switched by a designed circuit on one small all-through-hole wall board for the two heaters only: per heater a zero-cross opto-triac, an insulated-tab snubberless triac, a snubber and a MOV, with faston tabs for the live feed and the element lead and a low-voltage-only control cable to the controller board. The owner hand-solders it and the bare board is ordered with the other boards; the triac tabs bolt to the machine's metal wall, which is the heatsink, with a spreader plate if the assembly's design task finds one needed, and the pump drives stay on the mains board. It is a device the retrofit adds on the wall, outside the drop-in scope of the requirement that the electronics fit the machine as found, and its thermal judgement belongs to the design task for the assembly carrying it, against the assumed enclosure air temperature. The reason is that it is the same circuit a zero-cross relay contains, at a small fraction of a branded relay's cost (about 3 USD per channel designed, against 34 to 69 USD for a branded zero-cross relay with a maker-published isolation rating), with every barrier rating sourced from the opto-triac's and triac's datasheets, the gate parts at the triac so no gate lead runs beside the load wires, and no mains on the control cable. The relay of the earlier design has no manufacturer datasheet, so its rating counts as absent. The logic supply is a bought, certified, encapsulated AC-DC module soldered on the board, the carrier board is dropped, and the module is rated with margin over the logic-supply budget. Each mains-barrier part is recorded with the rating it is required to carry as a design target and proven feasible with one candidate whose figure is sourced from its manufacturer's current datasheet; the part fitted is selected by the board design task against that target, from the board manufacturer's catalogue, and nothing in the earlier design is selected by this record.

  The record of forms is the machine's function-forms record beside the controller boards' design-constraints record. The pending marks in the constraints record that this choice ends are replaced there with their value, source and grade, and the component specification is changed only where it restates an ended figure.
