id: SOL-PRE-ORDER-CHECK-POLARITY-MARK-SKIPS-A-PART-WHOSE-HOLES-FIX-ITS-ORIENTATION.C8
type: criterion
title: A part with a pad numbered 1 and every part that passed before are judged as before
status: active
version: 1
measurement_type: binary
verification: test
text: |
  A part with a pad numbered 1 is judged on that pad whatever its pads are, a mark on the wrong side, a text-only mark and a part that is not polarised report as they did, and every design that passed before still passes. Out of scope: which parts are polarised, the silk marks on the main board and the mark margin.
