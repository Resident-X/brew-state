id: SOL-HW-PRE-ORDER-CHECK-HOLDS-BOARD-WITHOUT-CONTROLLER
type: deliverable
category: solution
title: The pre-order check holds a board that places no controller to the channels crossing its header, and lists a connector's supply and return pins
status: active
version: 2
text: |
  Extends the pre-order board check so a board that places no controller is held to the channels that cross its header, and so a connector's supply and return pins can be listed on any board. As built, the check requires every pin allocation record to name a port-named controller pin for every channel and to list every pin of a connector it names, so the heater wall board, which places no controller, cannot pass it, and a supply or ground pin on the main board's header to the wall board cannot be listed either.

  The rule is settled in the board design records decision as amended for it: a pin allocation record whose top level carries controller: none declares that its design places no controller; its entries carry no controller pin and exactly one of far_channel or rail; each far channel must be a channel with a controller pin and a connector in another design's record in the same machine folder; and a rail entry may also appear in the record of a design that does place a controller.

  Settled for the build:
  - The declaration is accepted only for a design that places no part with a port-named pin and no part whose LCSC number equals the machine's controller part record; a design that places either fails, naming the part. The residual, a different microcontroller with no port-named pin and another catalogue number, is stated in the readme.
  - The connectivity checks are unchanged apart from the controller-pin test: a channel whose net does not reach its connector pin, a channel the record lists that the design lacks, and any net on a pin of a listed connector that the record does not list still fail.
  - A design with no machine folder, such as a proof design, is exempt from the cross-board check, as a synthetic controller already exempts it from the controller part rule.
  - A rail entry still carries a channel, as a label unique within the record rather than a name from the channel enumeration; rail entries are exempt from the net-listed-once rule so a header with several ground or supply pins can be listed in full, and each connector pin is still listed once. A far channel is held against every other design's record found in the same machine folder.
  - The check has one text report and no machine-readable report, so failures are reported in text and none is added here. The seeded case for a far channel no other record lists runs in a synthetic machine folder, since the proof designs are copied to paths with no machine folder.
  - The check does not compare the cable pin for pin between two headers; it holds that each far channel exists and is driven by the other board.
  - The firmware tier's pin and sensor checks read only the controller's record and are not changed. The wall board authors no converter-input map.
  - The change reads no firmware source, but hardware/README.md and hardware/tools/board_check.py are among the paths the build round's host tier reads, so the round runs the host tier as well as the board tier. The seeded-fault proof is on demand and in neither gate, so its new cases are run by hand.

  Locus: hardware/tools/board_check.py (the pin allocation reader, the connectivity rule, the controller part rule and the list of files a design reads), its tests under hardware/tools/tests/, the seeded cases in hardware/tools/board_prove.py, hardware/README.md where it states the rule and the record form, and docs/board-design-method.md where it says a board with no controller cannot pass. Tests use synthetic designs and records in a temporary directory.
rationale: |
  Sized as one leaf because the declaration, the cross-board check and the rail entry are one change to one reader and one rule, and the documents and seeded cases that describe them change with it. It is a tooling change, a different kind of work from drawing a board, so it is built and reviewed before either board's design leaf starts to depend on it; folding it into a board leaf would run a board design session and a code change through the same review rounds.
