id: SOL-HW-REVIEW-FAN-OUT-DRIVER.C8
type: criterion
title: The command can run named units again and merge the kept results with the new ones
status: deprecated
version: 3
measurement_type: binary
verification: test
text: |
  The command keeps each unit's result in its output folder. Given the names of units to run again, it runs only those, replaces their results, and merges again; it refuses a name that is not a unit of the review and refuses a run that leaves out a unit whose last run again failed, naming that unit, and the record shows which units were run again and when, and that a new setup session was started for them. A unit that failed, or that needs a view the round's starter has since rendered, is therefore run without repeating the others. Out of scope: deciding which units to run again.
