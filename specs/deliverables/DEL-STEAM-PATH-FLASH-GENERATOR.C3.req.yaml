id: DEL-STEAM-PATH-FLASH-GENERATOR.C3
type: criterion
title: The steam loop drives the feed to hold pressure and quantity, and drives the heater to hold dryness
status: active
version: 1
measurement_type: binary
verification: test
closes_by: cascade
text: |
  No pressure loop drives the heater. Dryness is the balance of heater power, the sensible heat of the water fed and the latent heat carried out, and the loop holds it with heater power.
