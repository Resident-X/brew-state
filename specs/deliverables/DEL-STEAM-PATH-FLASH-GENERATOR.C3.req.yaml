id: DEL-STEAM-PATH-FLASH-GENERATOR.C3
type: criterion
title: Steam pressure and dryness each hold under their own actuator's control
status: active
version: 1
measurement_type: binary
verification: test
closes_by: cascade
text: |
  The feed is the actuator for pressure and quantity and heater power is the actuator for dryness, as DEC-STEAM-BLOCK-IS-A-FLASH-GENERATOR sets out. No pressure loop drives the heater. Dryness is the balance of heater power, the sensible heat of the water fed and the latent heat carried out, and the loop holds it with heater power.
