id: DEL-BARISTATE-DELIVERY.C3
type: criterion
title: The committed plant model is validated against measured reality and the design is re-verified against it
status: active
version: 1
measurement_type: binary
verification: demonstration
closes_by: cascade
text: |
  The plant model committed to the machine is fitted to the bench measurements and validated against data withheld from the fit, and the control design is re-verified against the committed model rather than the estimated one. The phase closes when its child work fitting, validating, and re-verifying the model is complete.
