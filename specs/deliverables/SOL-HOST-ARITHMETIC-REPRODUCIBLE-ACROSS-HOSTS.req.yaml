id: SOL-HOST-ARITHMETIC-REPRODUCIBLE-ACROSS-HOSTS
type: deliverable
category: solution
title: The host tier's committed values hold on every supported host
status: active
version: 2
text: |
  The host tier's floating-point results differ between the two supported host platforms, macOS on arm64 with Apple clang and Linux on x86-64 with GCC, and two checks that compare against committed values fail on correct code on Linux. The golden-trajectory test in the plant-model suite compares computed values byte for byte with recorded literals, and one byte differs by one unit in the last place. The record-staleness check in the emulation tier regenerates the committed analysis records and compares them with what is committed, and on Linux several figures come out different: in the parameter-stability record the brew thermal mass high corner during early brew reads 0.0195 against 0.0187 committed, and the water heat capacity low corner reads 0.00474 against 0.00382; in the protection-margin record corner 20 reads 0.0529 against 0.0558.

  The homework points to a shared cause. The plant model's exponential terms call the host's own maths library (firmware/tools/pio_link_maths.py links it), which is Apple's on macOS and glibc on Linux, and nothing fixes whether a multiply followed by an add may be fused, which Apple clang on arm64 does and GCC on x86-64 does not by default. Either produces one-unit differences. The record figures move by far more than that, up to about a quarter of their value, so somewhere a one-unit difference flips a discrete outcome, such as a step at which a threshold is crossed or a corner's settling decision, or the figure is computed in an ill-conditioned way. Such a figure is not trustworthy on any host, and the correction either shows it is well conditioned or changes how it is computed.

  SOL-TRAJECTORY-GOLDEN-TOOLCHAIN-SPLIT met an instance of the same divergence for the mutation build alone and answered it by keying a second recorded literal to toolchain and architecture; that answer does not extend to every host and toolchain pair, and it left the ordinary host build untreated. The mechanism is settled: arithmetic that is bit-reproducible across hosts, not tolerances. Contraction of a multiply and an add is pinned off in every build that compiles the plant sources (the host and test environments, the mutation build, the emulation plant library and the target build). The three single-precision elementary functions the plant calls, the exponential, the exponential minus one and the sine, which are the only calls whose results the maths library of each host defines, are replaced by one project-owned implementation in the plant's shared sources, compiled into the host, mutation, emulation and target builds alike, so host and board run the same arithmetic. Square root and absolute value are exact on every host and stay as they are. The accuracy bound of the implementation is stated with it. The alternate trajectory literal that SOL-TRAJECTORY-GOLDEN-TOOLCHAIN-SPLIT keyed to toolchain and architecture is removed, leaving one recorded literal. Every committed bit-exact value and every analysis record is regenerated on the same change with its own tool, and the Linux half is proved by a run on a hosted Linux runner, which the macOS gate cannot give. Whatever is chosen, no comparison gains a tolerance wide enough to absorb a change a mutant makes, since that is the change these checks exist to catch.
rationale: |
  Found by the first hosted run of the nightly full verification (https://github.com/Resident-X/brew-state/actions/runs/38529890266, ubuntu-24.04, GCC); every host-tier run until then had been on the author's macOS arm64 machine, so committed values recorded there had only ever been compared on the host that recorded them. SOL-VERIFY-NIGHTLY-FULL-ON-MAIN directs a defect its nightly run finds on main to a maintenance item of its own, and this is one: a clean checkout is already required to build and verify without the author's machine, and a check is already required to fail on a defect rather than on correct code; it is the delivered checks and records that meet those on one host only.

  The two failures are one item because the homework traces both to the same host-dependent arithmetic, and correcting one without the other would leave the host tier failing on Linux. It is separate from the fixture build item the same run found, which is a compiler type error with an unrelated correction. The record figures that move far more than a rounding difference are part of this item, not a separate one, because an ill-conditioned figure is what turns an otherwise harmless one-unit difference into a staleness failure, and making arithmetic bit-reproducible would hide that figure's fragility without curing it.
