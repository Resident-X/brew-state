id: SOL-PRE-ORDER-CHECK-MAINS-BARRIER-IGNORES-PADS-THAT-CARRY-NO-NET
type: deliverable
category: solution
title: The mains barrier rule counts a no-connect pad and a netless pad with no number or copper as pads off the Mains class, so a part that does not bridge is refused
status: active
version: 1
text: |
  The barrier rule (MAINS-5) takes, for each part with a pad on a Mains-class net and a pad off it, the box of each group of pads and measures the copper in the strip between them. It fails by name a part it cannot measure: one whose two groups' boxes overlap along both axes, and one whose pads off the Mains class have no net. The main board meets two cases the rule was not written for. A pad that KiCad names unconnected-(...) because the schematic flags it no-connect counts as a netted pad off the Mains class, so U701's no-connect pad 5, which lies between its mains pads 4 and 6, widens the off-class group's box over the mains group's and the part is reported unmeasurable (U711 has the same no-connect pads). T701 and T711 draw unnumbered pads that carry no copper, aperture or paste pads of the package, and with no net they are the only pads off the class, so the part is reported as not known to bridge. U601 is also reported once by the same rule; whether its single violation has the same cause is not known from the layout alone, and the build reads U601's footprint and its pads' nets to find out. If the cause is another, that violation is not covered here.

  Settled before build: the exemption is decided by the pad's net, never by what the pad is, so a pad on a Mains-class net can never escape the rule. A pad on a Mains-class net is a pad on the Mains class and defines the Mains group and its edge whatever its number or copper layer, so a shield or tab pad on a mains net, or a pad whose copper layer was set wrongly, still counts. Only a pad that carries no net is exempt, in two kinds. First, a pad on a net named unconnected-(...), KiCad's name for a pin flagged no-connect, where the net is carried by no other pad of the board; the name is read as the last segment of the net's path beginning unconnected-(, as the board check reads it where it counts a connector's pins, and a net of that name carried by two or more pads is a real net whose pads are netted pads. A user-named net that happens to begin unconnected-( and is carried by one pad is not told apart from a no-connect and is a known non-case, not refused. Second, a pad with no net that has no pad number or no copper layer, as T701 and T711 draw, since such a pad is a feature of the package and not a connection. An exempt pad is in neither group and is not unnetted. A part whose pads off the Mains class are all exempt does not bridge the barrier and is not judged by this rule. What stays as it is: a numbered pad with copper and no net, which has no flag saying it is meant to be open, still makes the part fail by name as not known to bridge; a pad on any other real net, with a number or without, is a pad off the class and counts in its group; the two groups' boxes overlapping along both axes still fails by name; and the area of all copper lying in the strip, every pad of the board included, an exempt pad's copper among them, is still added up against the figure, so a no-connect pad whose copper lies in the strip still counts as copper there. Rejected: treating every netless pad as exempt (a numbered, coppered pad with no net is an unfinished connection, not a part feature), deciding the exemption by the pad's number or copper for every pad (a pad on a mains net with no number would drop out of the group and could hide a bridging part), and leaving the no-connect pad in a group (it is not a connection of either side, and no layout can move a pad within a package).

  Placement: the grouping in mains_barrier in hardware/tools/board_check.py: the pads on a Mains-class net and the pads on any other net other than a lone unconnected-(...) net are the two groups, the pads with no net, a number and copper are the unnetted pads, and the exempt pads enter neither group while every pad still enters the copper summed in the strip. The failure message's closing advice, "with every pad that is not Mains-class on a net", is inaccurate once pads are exempt and reads instead that every numbered, coppered pad that is not Mains-class is on a net, a pin that is meant to be open being flagged no-connect in the schematic. In docs/board-design-method.md, MAINS-5's Passes names a pad "that is not Mains-class" as needing a net and the fails-by-name clauses; they gain the exemption in the terms above. Unit tests in the class NoCopperLiesUnderAPartThatBridgesTheBarrier in hardware/tools/tests/test_board_check.py use synthetic references and nets and cover the cases of C1 and C2. The seeded-fault rows in hardware/tools/board_prove.py for the unmeasurable part stay, because they are made with a numbered, coppered netless pad, which still fails. Two new rows are added there on the throwaway proof design's bridging part: a no-connect pad beside a mains pad with copper under the part, which the check must still measure and fail as mains_barrier, and a pad on a Mains-class net given no number, which must still be a pad on the class and so still fail the same part. Both rows join the required-names dictionary in hardware/tools/tests/test_board_check_kicad_marks.py. The hardware notes' mains_barrier entry and the MAINS-5 paragraph state the grouping. The main board is not touched.
rationale: |
  Restores the behaviour that REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of the barrier item: a part that bridges the barrier is measured, and a part that cannot bridge it is not refused. A no-connect pad and a pad with no copper are not pads of a net and cannot carry a creepage path to a pad on the other side, so counting them as pads off the Mains class reports a defect the board does not have and hides the copper measurement for the part.
