id: SOL-PRE-ORDER-CHECK-MAINS-BARRIER-IGNORES-PADS-THAT-CARRY-NO-NET
type: deliverable
category: solution
title: The mains barrier rule counts a no-connect pad or a pad with no copper as no pad off the Mains class
status: active
version: 1
text: |
  The barrier rule (MAINS-5) takes, for each part with a pad on a Mains-class net and a pad off it, the box of each group of pads and measures the copper in the strip between them. It fails by name a part it cannot measure: one whose two groups' boxes overlap along both axes, and one whose pads off the Mains class have no net. The main board meets three cases the rule was not written for. A pad that KiCad names unconnected-(...) because the schematic flags it no-connect counts as a netted pad off the Mains class, so U701's no-connect pad 5, which lies between its mains pads 4 and 6, widens the off-class group's box over the mains group's and the part is reported unmeasurable. T701 and T711 draw unnumbered pads that carry no copper, aperture or paste pads of the package, and with no net they are the only pads off the class, so the part is reported as not known to bridge. U601 is reported once by the same rule. A no-connect pad among its isolated-side pads would be the same cause; the build confirms it on the part's footprint, and if the cause is another, that violation is not covered here.

  Settled before build: a pad is electrical when it carries a pad number and has copper on a copper layer. A pad that is not electrical is neither a pad on the Mains class, a pad off it, nor an unnetted pad, and enters no group. A pad on a net named unconnected-(...), KiCad's name for a pin flagged no-connect, is a known non-connection: it is also in neither group and is not unnetted. A part whose pads off the Mains class are all of these kinds does not bridge the barrier and is not judged by this rule. What stays as it is: a numbered pad with copper and no net, which has no flag saying it is meant to be open, still makes the part fail by name as not known to bridge; the two groups' boxes overlapping along both axes still fails by name; and the area of all copper lying in the strip, every pad of the board included, a no-connect pad's copper among them, is still added up against the figure, so a no-connect pad whose copper lies in the strip still counts as copper there. Rejected: treating every netless pad as non-electrical (a numbered, coppered pad with no net is an unfinished connection, not a part feature), and leaving the no-connect pad in a group (it is not a connection of either side, and no layout can move a pad within a package).

  Placement: the grouping in mains_barrier in hardware/tools/board_check.py. In docs/board-design-method.md, MAINS-5's Passes names a pad "that is not Mains-class" as needing a net and the fails-by-name clauses; they gain that a pad with no number or no copper, and a pad KiCad names unconnected, is no pad off the class. Unit tests in the barrier test module use synthetic references and nets and cover the cases of C1 and C2. The seeded-fault rows in hardware/tools/board_prove.py stay, because they are made with a numbered, coppered netless pad, which still fails; a new row seeds a no-connect pad beside a mains pad on the throwaway proof design's bridging part and requires the check to still measure and fail the copper under it. The hardware notes' mains_barrier entry and the MAINS-5 paragraph state the grouping. The main board is not touched.
rationale: |
  Restores the behaviour that REQ-BOARD-LAYOUT-PRACTICE-001.C1 asks of the barrier item: a part that bridges the barrier is measured, and a part that cannot bridge it is not refused. A no-connect pad and a pad with no copper are not pads of a net and cannot carry a creepage path to a pad on the other side, so counting them as pads off the Mains class reports a defect the board does not have and hides the copper measurement for the part.
