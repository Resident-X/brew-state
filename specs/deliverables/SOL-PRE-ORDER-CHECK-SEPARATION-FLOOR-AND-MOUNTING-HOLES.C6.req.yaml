id: SOL-PRE-ORDER-CHECK-SEPARATION-FLOOR-AND-MOUNTING-HOLES.C6
type: criterion
title: Every tracked design passes the rules, which run in the build round for board changes and nightly on main
status: active
version: 1
measurement_type: binary
verification: test
text: |-
  Every design git tracks passes the separation-floor rule and the mounting-hole rule, carrying the records they read, synthetic where the design is not for manufacture. A change to a design's board files or to any record these rules read re-runs the board tier of the build round, and the nightly run of main runs the rules whatever changed, through the board gate the pre-order check already uses. The board-reads listing's description names every record these rules read. Out of scope: a new gate, a new tool, the full seeded-fault proof, which stays on demand, and any real board's records.
