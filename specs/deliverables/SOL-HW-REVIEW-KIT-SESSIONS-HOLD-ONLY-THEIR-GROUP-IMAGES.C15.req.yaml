id: SOL-HW-REVIEW-KIT-SESSIONS-HOLD-ONLY-THEIR-GROUP-IMAGES.C15
type: criterion
title: Each group's root is sized to the model's window less a declared headroom, and the kit forms the groups by greedy merge on overlap
status: active
version: 3
measurement_type: binary
verification: test
text: |-
  Over a synthetic review folder of generic units, each declaring the views it needs by view kind, net, net class, layer and board region taken from the folder's view index and resolved to artefact names, the kit forms the groups from the units' needs: each group's root is the union of its units' declared views plus the fixed text, and every root is held to the budget of the model's window multiplied by a declared headroom fraction, which is the declared budget of the budget criterion when the caller states the fraction in place of a figure. The groups are formed from one group per set of units the declaration couples, in two steps: first the pair whose merged root is within the budget, whose merged expected output is within the largest single unit's expected output, and whose needs share the most tokens of artefacts that not every group holds, is merged again and again while that figure is above zero, ties by declaration order of the pairs' first units; then the groups left are packed first-fit, largest expected output first, up to the largest single unit's expected output and the budget, as the kit packs units when no budget is declared; units the declaration couples are never parted and a coupled set over that output stays whole; the headroom fraction is a budget key a declaration may state in place of a figure. A test of units with high overlap shows them grouped together with a total of all roots' tokens below that of a partition that separates them, a test of units with no overlap shows no view written twice and the groups equal the kit's packing of the same declaration, and every root is under the budget. A single unit whose own needs exceed the budget alone is refused naming the unit, its tokens and the budget. Out of scope: the value of the headroom fraction, which a measured run sets, and any model call, the stub standing in for the model.
