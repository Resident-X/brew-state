id: SOL-PROOF-OF-LIFE-INTERVAL-CHOSEN-RECORDED.C3
type: criterion
title: The casting-peak record's check requires the chosen interval and refuses a pending or derived one
status: active
version: 1
measurement_type: binary
verification: test
text: |
  The check on the casting-peak record requires the figures record to state the chosen interval and name the ceiling, and refuses a record that marks the interval pending or states a derived time as the interval; the casting-peak record is regenerated by its tool. Out of scope: computing the ceiling.
