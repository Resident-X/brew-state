id: SOL-PROOF-OF-LIFE-INTERVAL-CHOSEN-RECORDED.C3
type: criterion
title: The casting-peak record's check requires the chosen interval and refuses a pending or derived one
status: active
version: 2
measurement_type: binary
verification: test
text: |
  The check on the casting-peak record requires the figures record to state the chosen interval and name the ceiling, and refuses a record that marks the interval pending or states a derived time as the interval. The interval row is held structurally: its value cell holds 100 ms and cites the decision's id, it carries no pending mark, and it states no other time figure. The generator's wording states the interval as 100 ms, chosen, and the ceiling as derived from the peak later; the casting-peak record is regenerated by its tool and a test holds the committed record to that wording. Out of scope: computing the ceiling.
