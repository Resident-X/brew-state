id: SOL-BOARD-HISTORY-CHECK-PASSES-ON-THE-MAIN-BOARD-AFTER-ITS-FOLDER-RENAME.C5
type: criterion
title: The nightly complete verification runs the history command and a shallow clone is refused, not passed
status: active
version: 2
measurement_type: binary
verification: test
text: |
  The complete verification that runs nightly against main runs the placement and critical routing history command in plain and in routed mode on every board whose tracked layout plan holds a placement section heading, today the main board, the heater wall board and the method proof, so a later commit that moves a board or breaks a record the command judges fails that run and is seen, and a board that adds such a plan joins without a further edit. The nightly job's checkout carries the repository's full history, so the command is not refused for a shallow clone there; when a run's clone is shallow the command refuses, naming the shallow clone, and the run does not read it as met. The build round's gate is stated not to run it, because the command refuses a board or plan that differs from the last commit and a working tree in a round may differ, in the places that state when the board check runs. Out of scope: the build round's gate.
