id: SOL-BOARD-CIRCUIT-REVIEW-SEEDED-PROOF
type: deliverable
category: solution
title: The schematic review is proven blind on a proof schematic seeded with known defects
status: active
version: 2
text: |
  A proof that the schematic review sees the defects it checks for, the counterpart of the layout review's seeded proof. A clean throwaway proof schematic, not for manufacture, is committed so the pre-order check over every design stays passing; a session that has never read the circuit practice catalogue seeds realistic schematic defects of its own choosing into a copy outside the tracked tree and records each apart from the copy; and a fresh session with no record of the seeds reviews the copy by the method's schematic review step. The review's findings are compared with the seed list afterwards.

  Settled before build:

  - The proof design is its own folder under the hardware proof folder, beside the layout review's proof design and the pre-order check's, and extends neither: the layout proof's review is closed and editing its schematic would reopen it, and the schematic proof is drawn to be circuit-clean, which that one was not. It declares mains, so the mains-to-low-voltage barrier, surge, touch-current and heater-removal independence items apply to it, and it carries its own synthetic separation basis and design records (derating policy, pin limits, parts specification) holding every key the circuit catalogue's items read. The pre-order check requires a laid-out board beside every project, so the folder holds a board that passes the check; the review under proof judges the schematic only.
  - The proof schematic holds at least one part or net for each catalogue item that a condition selects, so every item has something to seed against: a pin reaching a supply above its absolute maximum, an integrated circuit with its datasheet's external parts, a ceramic capacitor that sets a filter, an open-drain bus line, a strap pin, a debug connector, an RC filter ahead of a converter, a supply with inrush and undervoltage lockout, polarised parts, a cable with a retained-harness pinning, a protective chain, a mains-to-low-voltage barrier part, a mains-side transient protector, a connector a person can reach, the supply inlet filter with its earth leakage, the element that removes heater power, and switched mains loads. It is drawn through the board toolchain's agent interface by the session that builds this solution.
  - The seeds are chosen by the session that has not read the catalogue, so they test whether the catalogue covers the defects a designer actually makes. That session works on a copy outside the repository, in a temporary work tree, and writes the seed list to a path outside both the copy and the review folder. A toolset of the board toolchain's agent interface is visible only to the session that loaded it, so the seeding session, being a separate session, edits the copy's files directly and checks them with the board toolchain's command-line tool. Per seed it records an identifier, the net or part, and a description. The review does not require the seeded copy to pass the pre-order check, since the schematic review runs before layout; the seeding session keeps the copy's records consistent so that no tool output reveals a seed.
  - The review folder holds only what the review step gives a reviewer: the seeded copy at its repository-relative path with no history, the netlist exported from the copy by the seeding session, every record the review step reads (the board's circuit-proof, bring-up provision and constraints records, its separation basis, pin allocation, parts specification and catalogue extract records, and the derating policy and pin limits records the catalogue's items read) kept consistent with the copy, the method as written, the hardware readme the method points to, and the pre-order check's report on the copy; the review record itself is never in it. The reviewing session is a fresh mid-tier session, so the proof holds for any reviewing agent at or above it; the evidence names the exact model. It is granted read tools only, with read-only retrieval of a datasheet at its published address because the review step opens every datasheet at its address and never recalls it, so the proof schematic uses real parts whose datasheets are published; it works in the review folder, and is given a fixed prompt that asks it to follow the method's schematic review step and names nothing seeded. It returns its schematic review record, with a verdict on every item for every net and part the item selects, as its output.
  - The comparison is recorded as one demonstration evidence entry stating the verified commit, the tool versions and the commands, and for each seed whether it was found and by which finding against which catalogue item. Findings that match no seed are listed too: one that shows a real defect in the clean design is fixed in the design and the proof repeated; a false positive is recorded and does not fail the proof.
  - A seed not reported is closed where the gap lies: a catalogue amendment citing its published source, or a correction to the review step, and the blind review is then repeated in a new session.
  - The hardware readme's description of the proof folder and the method's schematic review section name the proof design and how its copy is seeded.
rationale: |
  Seeds written by someone who has read the catalogue test only whether the review applies the catalogue; seeds written by someone who has not test whether the catalogue covers the defects a designer actually makes, which is the question a blind proof exists to answer. The layout review's proof is its own solution for the same reason this one is: the proof needs a proof design that exists only once the catalogue it exercises does, and here the design also needs the pre-order check to accept the separation and design-record keys that the insulation and surge items read, so the proof waits on that work and the catalogue and review step do not.
