id: DEL-BENCH-SAFETY-CHAIN-INSPECTION
type: deliverable
category: task
title: The pressure relief and non-restoring protection the safety chain relies on are established from the machine as found
status: active
level: task
version: 1
text: |
  The facts about the machine's pressure relief and protective devices that the safety chain rests on are established by inspecting this machine as found, and the choices that follow from them are made. They are: the steam side's over-pressure valve, whether a check valve lies between it and the steam block, and the pressure it opens at; whether a check valve lies between the brew pump's outlet and the brew block, which decides whether a relief or a pressure tap on the brew pump's outlet side sees the block's pressure or only the pump's; which variant of the steam pump is fitted and so its rated pressure; whether each thermostat resets itself or must be reset by hand; and the rating and location of any thermal fuse inside a heater assembly. Each is recorded with how it was established.

  The two element thermostats are wired in series with their element leads at the board terminals and the pump thermostat with the coffee pump's lead, so the board carries the same current whether a thermostat resets itself or not, and these facts do not change a board's circuit as designed. They gate the hardware layer that contains pressure without power, sensing or command, the non-restoring protection and the energising of mains. Where the protection found does not hold a load off once it has operated, the device supplied sits in series with the load at its block, off the boards; a device that would have to sit on a board is a change to that board's design, taken through the design's own amendment.
rationale: |
  These facts were held inside the criterion that fixes the constraints the boards are designed against, which made the design of every board wait on measurements that change no circuit. The distinction that matters is where the consequence lands: pressure containment, the non-restoring protection and energisation, not the boards. Giving the facts their own task keeps the dependency where they are used. The roadmap's physical-configuration criterion already names the open pressure-relief question as part of this phase.
