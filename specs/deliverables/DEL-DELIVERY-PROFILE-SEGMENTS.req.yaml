id: DEL-DELIVERY-PROFILE-SEGMENTS
type: deliverable
category: task
title: A brew delivery is commanded as segments that each command pressure or flow, and everything that treated the command as flow alone follows
status: active
level: task
version: 2
text: |
  A brew delivery is commanded as an ordered list of segments. Each segment commands one of pressure or flow and holds the other as a limit, and states the shape of the transition into it, the condition on which it ends and the water temperature the brew loop holds through it. The choice of primary variable belongs to the segment, not to the machine, so a profile can fill and wet a puck on flow and hold the extraction on pressure.

  Everything that treated the command as flow alone follows the segment's primary variable instead: the trim that corrects the pump toward the command, the report of departure from the commanded course, the plant model's flow term and the confirmation that commanded pumping moved water. Quantities the machine only reports, namely the volume delivered, the puck resistance derived from pressure and flow together, and the supply voltage, are neither commanded nor limited by a segment.

  The reason a delivery is commanded as segments is that operators shape how a drink is delivered (JRN-DESIGN-PROFILE-001). A household member presses a preset and gets the usual drink; an operator who wants to shape it states each segment's aims and keeps what they arrive at. A segment's aims are stated as outcomes at the group, never as anything specific to one machine: a pressure or a flow, a limit on the other, and a water temperature. A segment ends on elapsed time, delivered volume, delivered weight where weight is measured, or a pressure or flow threshold. Because a profile states nothing specific to one machine, it can be passed on as a file, and the machine decides whether it can deliver it (DEC-PROFILE-IS-RECIPE-DATA).

  The presets ONE and TWO, and possibly MAN, each hold a complete recipe on the controller, start on one press and stop on a second, and work with nothing else connected; the library of profiles lives with the display unit (DEC-PRESETS-ARE-HELD-ON-THE-CONTROLLER). Upkeep routines that move water, a back-flush and a flush, are profiles of the same kind (DEC-UPKEEP-ROUTINES-THAT-MOVE-WATER-ARE-PROFILES).
rationale: |
  The owner decided that the choice of pressure or flow belongs to each segment, and the decision recording it supersedes the earlier decision that a profile commands flow and caps pressure mechanically. Work built under the earlier decision is sealed or finished, so nothing in the graph owned bringing it up to the new command surface; this task owns it.

  Placement: a task directly under the roadmap's simulation phase criterion, as the other simulation tasks are. The brew-loop epic's criteria are sealed as delivered, so a task that changes what was delivered cannot hang beneath them. Slicing into solutions is a later step.

  What this replaces, each read in this session. Sealed or finished work that states the command as flow alone, to be superseded or brought current when this task is sliced: the profile surface that commands a course of flow with an elapsed-time end condition (SOL-DELIVERY-COMMANDED-AS-A-PROFILE, criterion C1 and its test evidence); the plant model's flow term and the reported rate that follows the pump's commanded level (DEL-SIM-FLOW-TERM, SOL-PLANT-FLOW-ENERGY-BALANCE, SOL-PLANT-FLOW-REPORTED criterion C3); the brew loop's feedforward from the commanded flow (SOL-BREW-TEMPERATURE-TRACKED-AT-GROUP-OUTLET criterion C4 and its test evidence); the pump trim toward the commanded flow and its departure account (SOL-PUMP-TRIMMED-TO-COMMANDED-FLOW, DEC-CORRECTION-KEEPS-THE-ACCOUNT); the departure report and its decision (SOL-DELIVERY-PROFILE-DEPARTURE-REPORTED, DEC-DEPARTURE-OBSERVED-NOT-MODELLED). The attestations that read the profile as a course of flow (EVD-REQ-DELIVERY-PROFILE-001.C1-ATTEST, EVD-REQ-SEQUENCE-CONSISTENCY-001.C2-ATTEST) are historical evidence and are not edited. SOL-BREW-PRESSURE-RATIONALE-CORRECTED corrected the rationale of the deprecated decision and is historical.

  Not edited from here: criteria on sealed solutions cannot be superseded one by one, because supersession is an operation on a deliverable. The criteria below therefore state the replaced behaviour in full, so the slicing session can supersede the owning solutions and re-anchor their contributions.

  Pressure measured in the brew path is now load-bearing for control and not only for the pressure map, so the requirement for it stays open until the sensor is fitted and read. A segment's pressure limit is a control limit below the safety relief and never the relief itself. The relief setting is a figure the owner has not yet set.


  Also read in this session and left unchanged. SOL-BREW-RECOVERS-AFTER-DRAW describes a draw as a commanded course of flow through the pump channel, and SOL-HOT-WATER-BAND-HOLDS-RATE-YIELDS.C3 states duty under a drinking target as following the same relation to commanded flow as a brew target. Neither depends on flow being the only commandable variable: a segment that commands flow remains a valid case under the new command surface, so both stand as delivered and are not in the replaced list. DEL-BENCH-FLOW-INSTRUMENTATION and SOL-FLOW-SENSED-CHANNEL concern the flow the machine senses and not the flow it commands, and are unaffected.

  Ordering with the plant-fidelity task. A pressure segment's delivered flow is what the puck produces, and the puck resistance is added by DEL-BREW-PLANT-FIDELITY, which cannot be built before the flow-based work here. So that the two tasks do not wait on each other, the dependency is stated between leaves when this task is sliced: the plant-fidelity task depends on the flow-based leaves, and the leaves that simulate a pressure segment depend on the plant-fidelity task. The earlier task-level dependency of DEL-BREW-PLANT-FIDELITY on this task is removed for that reason.

  Slicing record. This task is sliced just in time. The first leaf is the segment structure and exit conditions (SOL-PROFILE-SEGMENT-STRUCTURE-AND-EXIT-CONDITIONS, criteria C1 and C2), which fixes the data shape every other leaf builds on, and it extends the existing profile surface rather than replacing it, so nothing built before it is superseded by it. Criteria C3 to C15 are left to be sliced once that leaf is built, because their leaves would otherwise guess its fields. The criteria stay uncovered in the graph until then, and that is the signal that they are owed.

  What the later leaves owe, so that it is not lost. The pump trim, the departure report, the plant model's flow term and reported flow, the brew loop's feedforward and the pre-delivery refusal each state the command as flow alone today, and each is superseded by the leaf that restates it for the segment's primary variable, wired when that leaf is sliced: SOL-PUMP-TRIMMED-TO-COMMANDED-FLOW, SOL-DELIVERY-PROFILE-DEPARTURE-REPORTED, SOL-PLANT-FLOW-REPORTED, SOL-BREW-TEMPERATURE-TRACKED-AT-GROUP-OUTLET and SOL-DELIVERY-INFEASIBLE-PROFILE-REFUSED. SOL-DELIVERY-COMMANDED-AS-A-PROFILE and its dependents are re-judged against the first leaf when it is built. Leaves that simulate a pressure segment depend on DEL-BREW-PLANT-FIDELITY, and that task depends on the flow-based leaves it needs, which are named when they are sliced. The relief figure that a segment's pressure limit must lie below is owner-pending: its leaf builds the check against a declared figure and states no value. The functions of the MAN and PRG keys are open and are not decided by this task.
