id: SOL-PRE-ORDER-CHECK-EVERY-CONNECTED-PIN-LISTED
type: deliverable
category: solution
title: The pre-order check fails a connected pin of a semiconductor or integrated circuit that its pin-limit entry omits
status: active
version: 1
text: |
  Extends the pin-limit rule so that every connected pin of a semiconductor or integrated circuit has its own entry in the part's pin-limit record, and a connected pin the entry omits fails by part and pin, shown to fail on a seeded fault.

  Placement: extends the pin-limit rule of the derated-voltage and pin-limit leaf in hardware/tools, reusing the schematic pin-node and net map it already reads for the pins of each placed part and the listed-pin loop that already compares a record entry with the placed part. No new record key, tool or reader. Rejected: an entry that stands for the pins it leaves unlisted, and requiring an entry for a pin on no other pin or rail. Every proof design that places a semiconductor or integrated circuit gains an entry for each of its connected pins, with limits taken from the part's cited datasheet source.
