version: "3"

# brew-state uses the Staircase requirement graph. The engine binary, the
# /staircase-* skills, and the type schema all come from the (private)
# Resident-X/staircase repo — this Taskfile owns fetching and refreshing
# them so brew-state needs no local checkout of Staircase.
#
# Pin STAIRCASE_REF to a tag/commit for reproducibility; `main` tracks HEAD.

vars:
  STAIRCASE_MODULE: github.com/Resident-X/staircase/engine/cmd/staircase
  STAIRCASE_REPO: git@github.com:Resident-X/staircase.git
  STAIRCASE_REF: main
  SPECS_DIR: specs
  FW_DIR: firmware
  # PlatformIO installs into its own virtual environment rather than onto PATH.
  PIO: '{{.PIO | default "$HOME/.platformio/penv/bin/pio"}}'

tasks:
  sc:install:
    desc: Install/update the staircase binary into THIS repo (engine/staircase) via `go install` — repo-local GOBIN, never on global PATH (private module → GOPRIVATE + SSH rewrite applied inline)
    env:
      # Repo-local install: GOBIN puts the binary at ./engine/staircase, mirroring
      # the dogfooding layout the skills expect. It is NOT on global PATH, so the
      # staircase dev repo can never accidentally use this (possibly stale) copy —
      # it keeps building its own ./engine/staircase from source.
      GOBIN: "{{.ROOT_DIR}}/engine"
      # Private module: bypass the public proxy/sumdb and fetch over SSH.
      # Set inline so this works without mutating global git/go config.
      GOPRIVATE: github.com/Resident-X/*
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.git@github.com:.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    cmds:
      - go install {{.STAIRCASE_MODULE}}@{{.STAIRCASE_REF}}
      - ./engine/staircase --version || true

  sc:sync-skills:
    desc: Refresh .claude/skills from STAIRCASE_REF (verbatim — skills call ./engine/staircase, which this repo provides locally, so no rewrite is needed)
    cmds:
      - |
        set -euo pipefail
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        git clone --depth 1 --branch {{.STAIRCASE_REF}} --filter=blob:none --sparse {{.STAIRCASE_REPO}} "$tmp"
        git -C "$tmp" sparse-checkout set .claude/skills
        rm -rf .claude/skills && mkdir -p .claude
        cp -R "$tmp/.claude/skills" .claude/skills
        echo "skills synced verbatim from {{.STAIRCASE_REF}} (invoke via ./engine/staircase)"

  sc:seed-schema:
    desc: Seed .staircase/schema.yaml from STAIRCASE_REF ONCE (skipped if present — schema becomes brew-state-owned after seeding)
    cmds:
      - |
        set -euo pipefail
        if [ -f .staircase/schema.yaml ]; then
          echo ".staircase/schema.yaml exists — leaving brew-state-owned copy untouched"; exit 0
        fi
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        git clone --depth 1 --branch {{.STAIRCASE_REF}} --filter=blob:none --sparse {{.STAIRCASE_REPO}} "$tmp"
        git -C "$tmp" sparse-checkout set --skip-checks .staircase/schema.yaml
        mkdir -p .staircase && cp "$tmp/.staircase/schema.yaml" .staircase/schema.yaml
        echo "schema.yaml seeded (now brew-state-owned; evolve it additively here)"

  sc:embed:
    desc: Link the shared machine-global embedder cache so `query --mode semantic|hybrid` works (else it degrades to lexical)
    cmds:
      - |
        set -euo pipefail
        cache="${STAIRCASE_MODEL_CACHE:-$HOME/.cache/staircase/models}"
        if [ ! -d "$cache/potion-retrieval-32M" ]; then
          echo "no embedder at $cache/potion-retrieval-32M — provision it (task sc:download-embed-model in the staircase repo) or drop the embedder block from .staircase/config.yaml"; exit 1
        fi
        ln -sfn "$cache" .staircase/models
        echo "linked .staircase/models -> $cache"

  sc:index:
    desc: (Re)build the graph index from specs/ after manual edits or a git pull
    cmds:
      - ./engine/staircase build ./{{.SPECS_DIR}}

  sc:init:
    desc: One-shot bootstrap — install binary, sync skills, seed schema, link embedder, build index, arm git hooks
    cmds:
      - task: sc:install
      - task: sc:sync-skills
      - task: sc:seed-schema
      - task: sc:embed
      - task: sc:index
      # Not staircase work, but this is the task a fresh clone runs, and a
      # guardrail nobody arms is the state this one was already in.
      - task: repo:hooks

  sc:update:
    desc: Update the binary + skills to STAIRCASE_REF (leaves your graph and schema untouched)
    cmds:
      - task: sc:install
      - task: sc:sync-skills
      # Idempotent, and it is what reaches the clones that were bootstrapped
      # before the hooks existed — they will never run sc:init again.
      - task: repo:hooks

  # ---------------------------------------------------------------------------
  # Repository hygiene. Not staircase and not firmware.
  # ---------------------------------------------------------------------------

  repo:hooks:
    desc: Arm the tracked git hooks (pre-push refuses a direct push to main) by pointing core.hooksPath at .githooks
    cmds:
      # .git/hooks is not tracked, so a hook copied into it protects one clone
      # and no other. Pointing core.hooksPath at a directory that IS tracked is
      # what makes the guardrail travel with the repository.
      - git config core.hooksPath .githooks
      - echo "core.hooksPath -> .githooks (pre-push refuses pushes to main)"

  # ---------------------------------------------------------------------------
  # Firmware. The seams' properties are asserted by the build itself, so these
  # tasks are the same commands the checks run under PlatformIO -- nothing here
  # is a second implementation of a check.
  # ---------------------------------------------------------------------------

  fw:build:
    desc: Build the host executable behind each plant structure, and the target build behind the STM32 hardware seam
    dir: "{{.FW_DIR}}"
    cmds:
      - "{{.PIO}} run -e native"
      - "{{.PIO}} run -e native_fixture"
      - "{{.PIO}} run -e native_flow_fixture"
      - "{{.PIO}} run -e native_boiler"
      - "{{.PIO}} run -e native_outlet_only_fixture"
      - "{{.PIO}} run -e native_correction_read_only_fixture"
      - "{{.PIO}} run -e stm32"

  fw:test:
    desc: Run the control-logic and plant-model tests on the host, and the tests covering the build-time checks
    dir: "{{.ROOT_DIR}}"
    cmds:
      # Which environments carry tests is discovered, so a structure's tests run
      # because they exist rather than because a line here names them. The suite
      # covering the check tools is named because it is one fixed thing rather
      # than a set that grows with the tree.
      - cd {{.FW_DIR}} && python3 tools/run_host_tests.py --project . --pio {{.PIO}} --plant-root src/plant --include-dir include
      - python3 -m unittest discover -s {{.FW_DIR}}/tools/tests

  fw:check:
    desc: Run every build-time check the seams' criteria are verified by
    dir: "{{.FW_DIR}}"
    cmds:
      # The hardware seam. The artefacts the seam's calls are inspected in are
      # discovered from the build, so an environment added later is covered
      # without a line here naming it.
      - python3 tools/check_header_neutral.py include/hw_interface.h
      - python3 tools/check_encapsulation.py src/control src/estimator include/estimator.h
      - python3 tools/check_direct_calls.py --project . --header include/hw_interface.h --objects-in src/control
      # Two environments are named here because comparing that pair is what the
      # check is, not because it carries a list.
      - python3 tools/check_control_identical.py --project . --env native --env stm32
      # The plant-model seam.
      - python3 tools/check_plant_header.py include/plant_model.h --plant-root src/plant --include-dir include
      - python3 tools/check_plant_header.py include/estimator.h --plant-root src/plant --include-dir include
      # Wherever the control logic is compiled, the estimator it drives from is
      # compiled beside it. The environments are discovered from the build file.
      - python3 tools/check_estimator_compiled.py --project .
      # The estimator pairs each quantity with the state that observes it, or
      # refuses it outright. Which quantities are paired must be exactly which
      # ones a channel measures: a refused quantity a channel reaches is never
      # corrected against and reports that identically to a channel nobody
      # reads, and a paired quantity nothing measures is a claim no test can
      # reach until an instrument is fitted and makes it wrong.
      - python3 tools/check_estimator_pairing.py --estimator src/estimator/estimator.c --include-dir include
      - python3 tools/check_plant_header.py include/plant_types.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_plant_header.py include/plant_support.h --plant-root src/plant --include-dir include --vocabulary-only
      # The vocabulary a value's origin is recorded in, and every description
      # that claims a machine accounting for the values it carries. The
      # structures and their descriptions are discovered, so a description added
      # later is inspected without a line here naming it.
      - python3 tools/check_plant_header.py include/plant_origin.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_parameter_origins.py --project . --plant-root src/plant --include-dir include --params-dir params
      # The vocabulary the error the design assumes for a value is recorded in,
      # and every description that claims a machine stating how far out each of
      # its values may be. Separate from the origins check because the two
      # answer different questions about the same number -- where it came from,
      # and how wrong it may be -- and a description can carry either without
      # the other.
      - python3 tools/check_plant_header.py include/plant_budget.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_assumed_error.py --plant-root src/plant --include-dir include --params-dir params
      # The vocabulary the design classifies its own behaviours in against a
      # wrong model, and the declaration itself. An unclassified behaviour is
      # the failure this exists to prevent: it reads as covered to everybody who
      # looks at it, because nobody notices the absence of a sentence.
      - python3 tools/check_plant_header.py include/plant_robustness.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_robustness_declaration.py --include-dir include --declaration params/robustness.declaration
      - python3 tools/check_estimator_limits.py --include-dir include --plant-root src/plant --params-dir params
      - python3 tools/check_cadence_declaration.py --include-dir include --source-dir src --declaration params/cadence.declaration
      # The figures the control law itself rests on, and the band a delivery is
      # held to. Separate from the cadence check because the two answer
      # different questions about the loop -- the rate it runs at, and what it
      # does at that rate -- and because the band is the one figure here that
      # lives as data rather than as a definition, so it is checked from the
      # opposite direction: present in the declaration, absent from the source.
      # Both delivery headers are named explicitly because the include
      # directory as a whole is not scanned -- the rest of what it holds
      # answers for a machine or for another loader under its own check -- and
      # naming them here is what keeps a bound either declares answerable
      # whichever directory its source sits in: delivery_profile.h's source is
      # under src/control now that the evaluator it declares is control logic
      # reached by control_step on every step, and delivery_tolerance.h's
      # stays under src/delivery beside the loader it declares.
      - python3 tools/check_control_declaration.py --include-dir include --source-dir src/control --source-dir src/delivery --source-header include/delivery_tolerance.h --source-header include/delivery_profile.h --source-header include/steam_control_declaration.h --source-header include/pump_trim_declaration.h --declaration params/control.declaration --tolerance params/tolerance.declaration --tree-dir src --tree-dir include
      # The vocabulary both seams draw the machine's actuation channels from,
      # and every structure's statement of which of them it answers.
      - python3 tools/check_plant_header.py include/machine_actuation.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_actuation_declaration.py --plant-root src/plant --include-dir include
      - python3 tools/check_plant_encapsulation.py src test --plant-root src/plant --include-dir include
      - python3 tools/check_support_status.py --plant-root src/plant --include-dir include --documentation README.md
      # The vocabulary a structure says whether its equations describe a machine
      # from, and every structure's claim. This is what the mutation sweep draws
      # its population from, so a structure arriving without a claim fails here
      # rather than silently joining or missing that population.
      - python3 tools/check_plant_header.py include/plant_machine_claim.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_machine_claim.py --plant-root src/plant --include-dir include
      # And every build that would be energised selecting a structure whose
      # equations claim to describe a machine, rather than merely selecting one.
      # The environments are discovered from the platform each names, so a
      # second board is covered without a line here naming it.
      - python3 tools/check_machine_structure_selected.py --project . --plant-root src/plant --include-dir include
      # And that it compiles the model under the settings it applies to the
      # control logic already there. The gate that asks this of the host builds
      # covers only those, so without this the one artefact that gets energised
      # is the one nothing asks it of.
      - python3 tools/check_machine_build_settings.py --project . --plant-root src/plant
      # The description each of those builds would carry compiled in, compared
      # against the one the host verification tier is pinned to. It runs inside
      # the target build as well, before anything is compiled; here it asks the
      # same question of the artefact that was actually built, which is the run
      # that would notice a build directory carrying something else.
      - python3 tools/check_embedded_description.py --project .
      # And the artefact itself, because none of the above survives the linker
      # on its own: it discards what nothing reaches, and nothing on the machine
      # drives the model yet. An artefact the equations were dropped from passes
      # every check before this one.
      - python3 tools/check_target_carries_model.py --project . --include-dir include --params-dir params
      - python3 tools/check_direct_calls.py --project . --header include/plant_model.h --objects-in src/app/native
      # Every structure in the tree, and the artefact carrying it, are
      # discovered: forgetting to add a line cannot leave one unchecked.
      - python3 tools/check_structure_exclusive.py --project . --plant-root src/plant --include-dir include
      # Two descriptions are named here because the check needs a pair differing
      # in a single coefficient before it can conclude anything.
      - python3 tools/check_parameters_are_data.py .pio/build/native/program --params params/thermoblock.params --params params/thermoblock-variant.params --limits params/thermoblock.limits
      - python3 tools/check_parameters_are_data.py .pio/build/native_boiler/program --params params/boiler.params --params params/boiler-variant.params --limits params/boiler.limits
      # The misconfigured configurations are named because a forgotten name here
      # fails loudly rather than quietly.
      - python3 tools/check_selection_refused.py --project . --env native_no_structure --env native_two_structures --env native_boiler_two_structures --env stm32_no_structure --env stm32_two_structures --env stm32_actuation_map_incomplete --pio {{.PIO}}
      # The analysis the host tier runs everything of ours under, over every
      # environment the build declares for the host.
      - python3 tools/check_sanitizers.py --project .

  fw:run:
    desc: Run every host executable the build declares through its control-logic and plant-model entry paths under the sanitizers
    dir: "{{.FW_DIR}}"
    cmds:
      # The artefacts and the descriptions they are run against are discovered,
      # because an artefact built under the sanitizers and never run has been
      # analysed for nothing.
      - python3 tools/run_host_artefacts.py --project . --plant-root src/plant --include-dir include --params-dir params

  fw:emulate:provision:
    desc: Fetch the emulator and the register description the emulation tier runs against, pinned by digest, into .tooling (ignored by git), sharing the fetch across worktrees via a machine-global cache
    cmds:
      # Neither is committed: one is a platform-specific build far larger than
      # this repository, the other is the vendor's and carries terms this
      # repository does not hold. What makes the fetch reproducible is the
      # digest each is pinned to, not where it is kept — so .tooling (which
      # provision.py always resolves relative to the repo root, regardless of
      # cwd) can be a symlink into a cache shared by every worktree, the same
      # pattern sc:embed uses for the query embedder, instead of a per-worktree
      # copy.
      - |
        set -euo pipefail
        cache="${FW_TOOLING_CACHE:-$HOME/.cache/brew-state/firmware-tooling}"
        mkdir -p "$cache"
        # Re-point unconditionally when .tooling is already a symlink (so a
        # changed FW_TOOLING_CACHE takes effect, matching sc:embed's ln -sfn),
        # but never touch a pre-existing real directory.
        if [ -L .tooling ] || [ ! -e .tooling ]; then
          ln -sfn "$cache" .tooling
        fi
      - |
        cd "{{.FW_DIR}}" && python3 emulation/tools/provision.py

  fw:emulate:
    desc: Run the target build's own artefact under emulation and require every hardware-seam channel to have a peripheral model behind it that only its own commands reach
    dir: "{{.FW_DIR}}"
    cmds:
      # The build is run by the check itself rather than named as a dependency
      # here, because what the check has to establish is that the artefact it
      # emulated is the one that build just wrote -- and a build run separately
      # leaves that a matter of the order two lines happen to be in.
      - python3 -m unittest discover -s emulation/tests {{.CLI_ARGS}}

  fw:mutate:
    desc: Break each guarded property on purpose and require its check to notice — on demand, not part of the gate
    dir: "{{.FW_DIR}}"
    cmds:
      - python3 tools/mutate.py {{.CLI_ARGS}}

  fw:sweep:
    desc: Alter every comparison and operator in the plant model's arithmetic and require a test to notice — part of the full gate, and runnable alone
    dir: "{{.FW_DIR}}"
    cmds:
      # The structures the mutants are drawn from are discovered, so a structure
      # added later joins the population without a line here naming it.
      - python3 tools/mull_sweep.py --project . --plant-root src/plant --include-dir include --pio {{.PIO}} {{.CLI_ARGS}}

  fw:verify:
    desc: The full firmware gate — build every environment, run every check, run the tests, run the host executables, run the target artefact under emulation against modelled peripherals, sweep the plant model's arithmetic
    cmds:
      - task: fw:build
      - task: fw:check
      - task: fw:test
      - task: fw:run
      # The tier below the host one: the artefact itself, executed, against
      # models of the peripherals it drives. It is here rather than left to be
      # remembered because the class of defect it nets -- a command addressing
      # the wrong peripheral, or none -- is invisible to every gate above it,
      # which all sit above the addressing.
      - task: fw:emulate
      # Last because it is the longest and because it asks the hardest question:
      # not whether the checks pass, but whether the tests would notice the model
      # being wrong. It needs an LLVM toolchain matching the mutation plugin, so
      # a host without one fails the gate here rather than passing quietly.
      - task: fw:sweep
