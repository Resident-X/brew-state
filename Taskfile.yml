version: "3"

# brew-state uses the Staircase requirement graph. The engine binary, the
# /staircase-* skills, and the type schema all come from the (private)
# Resident-X/staircase repo — this Taskfile owns fetching and refreshing
# them so brew-state needs no local checkout of Staircase.
#
# STAIRCASE_REF floats on upstream main, so `task sc:update` moves the binary,
# the skills and (on first seeding) the schema to whatever main is at that
# moment, all in one run. To hold a known revision instead, override it with a
# commit SHA: `task sc:update STAIRCASE_REF=<sha>`.

vars:
  STAIRCASE_MODULE: github.com/Resident-X/staircase/engine/cmd/staircase
  STAIRCASE_REPO: git@github.com:Resident-X/staircase.git
  STAIRCASE_REF: main
  # Upstream skills this repository replaces with its own copy of the same
  # name. The sync never installs or removes them, and .gitignore tracks them.
  # start-work is here because its targets are this project's epics, not the
  # engine repository's.
  REPO_SKILLS: start-work
  SPECS_DIR: specs
  FW_DIR: firmware
  # PlatformIO installs into its own virtual environment rather than onto PATH.
  PIO: '{{.PIO | default "$HOME/.platformio/penv/bin/pio"}}'
  HW_DIR: hardware
  # KiCad's command-line tool is often installed off the search path; point at
  # it with KICAD_CLI=... (hardware/README.md gives the usual place per system).
  KICAD_CLI: '{{.KICAD_CLI | default "kicad-cli"}}'
  # resvg, which turns the review views into images, may be installed off the
  # search path too; point at it with RESVG=... (hardware/README.md says where to get it).
  RESVG: '{{.RESVG | default "resvg"}}'
  # The virtual environment gerbonara 1.6.3 is installed in, which draws the
  # exported fabrication layers: `task hw:gerbonara` creates it here, and
  # GERBONARA_VENV=... puts it elsewhere (hardware/README.md says more).
  GERBONARA_VENV:
    sh: 'echo "${GERBONARA_VENV:-${XDG_CACHE_HOME:-$HOME/.cache}/brew-state/gerbonara}"'
  # The Python that draws them: GERBONARA_PYTHON=... when set, else the Python of
  # that environment once it exists, else the bare python3.
  GERBONARA_PYTHON:
    sh: 'if [ -n "${GERBONARA_PYTHON:-}" ]; then echo "$GERBONARA_PYTHON"; elif [ -x "{{.GERBONARA_VENV}}/bin/python" ]; then echo "{{.GERBONARA_VENV}}/bin/python"; else echo python3; fi'

tasks:
  sc:install:
    desc: Install/update the staircase binary into THIS repo (engine/staircase) via `go install` — repo-local GOBIN, never on global PATH (private module → GOPRIVATE + SSH rewrite applied inline)
    env:
      # Repo-local install: GOBIN puts the binary at ./engine/staircase, mirroring
      # the dogfooding layout the skills expect. It is NOT on global PATH, so the
      # staircase dev repo can never accidentally use this (possibly stale) copy —
      # it keeps building its own ./engine/staircase from source.
      GOBIN: "{{.ROOT_DIR}}/engine"
      # Private module: bypass the public proxy/sumdb and fetch over SSH.
      # Set inline so this works without mutating global git/go config.
      GOPRIVATE: github.com/Resident-X/*
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.git@github.com:.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    cmds:
      - go install {{.STAIRCASE_MODULE}}@{{.STAIRCASE_REF}}
      - ./engine/staircase --version || true

  sc:sync-skills:
    desc: Install the upstream skills into .claude/skills at STAIRCASE_REF (verbatim; skills call ./engine/staircase). Replaces only skills a previous sync installed, so repo-local repo-* skills and the REPO_SKILLS this repository owns survive
    cmds:
      - |
        set -euo pipefail
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        # Fetch by ref: the ref may be a branch or a commit SHA, which `git clone --branch` cannot take.
        git init -q "$tmp"
        git -C "$tmp" remote add origin {{.STAIRCASE_REPO}}
        git -C "$tmp" fetch -q --depth 1 --filter=blob:none origin {{.STAIRCASE_REF}}
        git -C "$tmp" sparse-checkout set .claude/skills
        git -C "$tmp" checkout -q FETCH_HEAD
        # Check the whole upstream set before touching anything installed.
        names=()
        for path in "$tmp"/.claude/skills/*; do
          [ -e "$path" ] || { echo "no skills at {{.STAIRCASE_REF}}; nothing changed" >&2; exit 1; }
          name=$(basename "$path")
          case "$name" in
            repo-*) echo "upstream ships $name, which collides with the repo-local repo-* prefix" >&2; exit 1 ;;
          esac
          case " {{.REPO_SKILLS}} " in
            *" $name "*) echo "keeping this repository's own $name; upstream's is not installed" >&2; continue ;;
          esac
          names+=("$name")
        done
        mkdir -p .claude/skills
        # The manifest names what the last sync installed, so a skill upstream
        # removes is removed here too, and nothing outside the manifest is touched.
        manifest=.claude/skills/.upstream-skills
        if [ -f "$manifest" ]; then
          while IFS= read -r name; do
            case "$name" in ''|.|..|*/*) continue ;; esac
            case " {{.REPO_SKILLS}} " in *" $name "*) continue ;; esac
            rm -rf ".claude/skills/$name"
          done < "$manifest"
        fi
        for name in "${names[@]}"; do
          rm -rf ".claude/skills/$name"
          cp -R "$tmp/.claude/skills/$name" ".claude/skills/$name"
        done
        # Written last, so an interrupted run leaves the previous manifest to clean up from.
        printf '%s\n' "${names[@]}" > "$manifest.new" && mv "$manifest.new" "$manifest"
        echo "skills synced verbatim from {{.STAIRCASE_REF}} (invoke via ./engine/staircase)"

  sc:seed-schema:
    desc: Seed .staircase/schema.yaml from STAIRCASE_REF ONCE (skipped if present — schema becomes brew-state-owned after seeding)
    cmds:
      - |
        set -euo pipefail
        if [ -f .staircase/schema.yaml ]; then
          echo ".staircase/schema.yaml exists — leaving brew-state-owned copy untouched"; exit 0
        fi
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        git init -q "$tmp"
        git -C "$tmp" remote add origin {{.STAIRCASE_REPO}}
        git -C "$tmp" fetch -q --depth 1 --filter=blob:none origin {{.STAIRCASE_REF}}
        git -C "$tmp" sparse-checkout set --skip-checks .staircase/schema.yaml
        git -C "$tmp" checkout -q FETCH_HEAD
        mkdir -p .staircase && cp "$tmp/.staircase/schema.yaml" .staircase/schema.yaml
        echo "schema.yaml seeded (now brew-state-owned; evolve it additively here)"

  sc:embed:
    desc: Link the shared machine-global embedder cache so `query --mode semantic|hybrid` works (else it degrades to lexical)
    cmds:
      - |
        set -euo pipefail
        cache="${STAIRCASE_MODEL_CACHE:-$HOME/.cache/staircase/models}"
        if [ ! -d "$cache/potion-retrieval-32M" ]; then
          echo "no embedder at $cache/potion-retrieval-32M — provision it (task sc:download-embed-model in the staircase repo) or drop the embedder block from .staircase/config.yaml"; exit 1
        fi
        ln -sfn "$cache" .staircase/models
        echo "linked .staircase/models -> $cache"

  sc:index:
    desc: (Re)build the graph index from specs/ after manual edits or a git pull
    cmds:
      - ./engine/staircase build ./{{.SPECS_DIR}}

  sc:init:
    desc: One-shot bootstrap — install binary, sync skills, seed schema, link embedder, build index, arm git hooks
    cmds:
      - task: sc:install
      - task: sc:sync-skills
      - task: sc:seed-schema
      - task: sc:embed
      - task: sc:index
      # Not staircase work, but this is the task a fresh clone runs, and a
      # guardrail nobody arms is the state this one was already in.
      - task: repo:hooks

  sc:update:
    desc: Update the binary + skills to STAIRCASE_REF (leaves your graph and schema untouched)
    cmds:
      - task: sc:install
      - task: sc:sync-skills
      # Idempotent, and it is what reaches the clones that were bootstrapped
      # before the hooks existed — they will never run sc:init again.
      - task: repo:hooks

  # ---------------------------------------------------------------------------
  # Repository hygiene. Not staircase and not firmware.
  # ---------------------------------------------------------------------------

  repo:hooks:
    desc: Arm the tracked git hooks (pre-push refuses a direct push to main) by pointing core.hooksPath at .githooks
    cmds:
      # .git/hooks is not tracked, so a hook copied into it protects one clone
      # and no other. Pointing core.hooksPath at a directory that IS tracked is
      # what makes the guardrail travel with the repository.
      - git config core.hooksPath .githooks
      - echo "core.hooksPath -> .githooks (pre-push refuses pushes to main)"

  # ---------------------------------------------------------------------------
  # Firmware. The seams' properties are asserted by the build itself, so these
  # tasks are the same commands the checks run under PlatformIO -- nothing here
  # is a second implementation of a check.
  # ---------------------------------------------------------------------------

  fw:build:
    desc: Build the host executable behind each plant structure, and the target build behind the STM32 hardware seam
    dir: "{{.FW_DIR}}"
    cmds:
      - "{{.PIO}} run -e native"
      - "{{.PIO}} run -e native_fixture"
      - "{{.PIO}} run -e native_flow_fixture"
      - "{{.PIO}} run -e native_boiler"
      - "{{.PIO}} run -e native_outlet_only_fixture"
      - "{{.PIO}} run -e native_correction_read_only_fixture"
      - "{{.PIO}} run -e native_write_discarding_fixture"
      - "{{.PIO}} run -e stm32"

  fw:test:
    desc: Run the control-logic and plant-model tests on the host, and the tests covering the build-time checks
    dir: "{{.ROOT_DIR}}"
    cmds:
      # Which environments carry tests is discovered, so a structure's tests run
      # because they exist rather than because a line here names them. The suite
      # covering the check tools is named because it is one fixed thing rather
      # than a set that grows with the tree.
      - cd {{.FW_DIR}} && python3 tools/run_host_tests.py --project . --pio {{.PIO}} --plant-root src/plant --include-dir include
      # Each test module runs in a process of its own, side by side; the runner
      # fails when it finds no module or runs no test. Arguments after -- reach
      # it, so `task fw:test -- --workers 1` sets the worker count.
      - python3 {{.FW_DIR}}/tools/run_tool_tests.py {{.CLI_ARGS}}

  fw:check:
    desc: Run every build-time check the seams' criteria are verified by
    dir: "{{.FW_DIR}}"
    cmds:
      # The hardware seam. The artefacts the seam's calls are inspected in are
      # discovered from the build, so an environment added later is covered
      # without a line here naming it.
      - python3 tools/check_header_neutral.py include/hw_interface.h
      - python3 tools/check_encapsulation.py src/control src/estimator include/estimator.h
      - python3 tools/check_direct_calls.py --project . --header include/hw_interface.h --objects-in src/control
      # Two environments are named here because comparing that pair is what the
      # check is, not because it carries a list.
      - python3 tools/check_control_identical.py --project . --env native --env stm32
      # The plant-model seam.
      - python3 tools/check_plant_header.py include/plant_model.h --plant-root src/plant --include-dir include
      - python3 tools/check_plant_header.py include/estimator.h --plant-root src/plant --include-dir include
      # Wherever the control logic is compiled, the estimator it drives from is
      # compiled beside it. The environments are discovered from the build file.
      - python3 tools/check_estimator_compiled.py --project .
      # The estimator pairs each quantity with the state that observes it, or
      # refuses it outright. Which quantities are paired must be exactly which
      # ones a channel measures: a refused quantity a channel reaches is never
      # corrected against and reports that identically to a channel nobody
      # reads, and a paired quantity nothing measures is a claim no test can
      # reach until an instrument is fitted and makes it wrong.
      - python3 tools/check_estimator_pairing.py --estimator src/estimator/estimator.c --include-dir include
      - python3 tools/check_plant_header.py include/plant_types.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_plant_header.py include/plant_support.h --plant-root src/plant --include-dir include --vocabulary-only
      # The vocabulary a value's origin is recorded in, and every description
      # that claims a machine accounting for the values it carries. The
      # structures and their descriptions are discovered, so a description added
      # later is inspected without a line here naming it.
      - python3 tools/check_plant_header.py include/plant_origin.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_parameter_origins.py --project . --plant-root src/plant --include-dir include --params-dir params
      # The vocabulary the error the design assumes for a value is recorded in,
      # and every description that claims a machine stating how far out each of
      # its values may be. Separate from the origins check because the two
      # answer different questions about the same number -- where it came from,
      # and how wrong it may be -- and a description can carry either without
      # the other.
      - python3 tools/check_plant_header.py include/plant_budget.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_assumed_error.py --plant-root src/plant --include-dir include --params-dir params
      # The vocabulary the design classifies its own behaviours in against a
      # wrong model, and the declaration itself. An unclassified behaviour is
      # the failure this exists to prevent: it reads as covered to everybody who
      # looks at it, because nobody notices the absence of a sentence.
      - python3 tools/check_plant_header.py include/plant_robustness.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_robustness_declaration.py --include-dir include --declaration params/robustness.declaration
      - python3 tools/check_estimator_limits.py --include-dir include --plant-root src/plant --params-dir params
      - python3 tools/check_cadence_declaration.py --include-dir include --source-dir src --declaration params/cadence.declaration
      # The figures the control law itself rests on, and the band a delivery is
      # held to. Separate from the cadence check because the two answer
      # different questions about the loop -- the rate it runs at, and what it
      # does at that rate -- and because the band is the one figure here that
      # lives as data rather than as a definition, so it is checked from the
      # opposite direction: present in the declaration, absent from the source.
      # Both delivery headers are named explicitly because the include
      # directory as a whole is not scanned -- the rest of what it holds
      # answers for a machine or for another loader under its own check -- and
      # naming them here is what keeps a bound either declares answerable
      # whichever directory its source sits in: delivery_profile.h's source is
      # under src/control now that the evaluator it declares is control logic
      # reached by control_step on every step, and delivery_tolerance.h's
      # stays under src/delivery beside the loader it declares.
      # The steam declaration's figures are re-derived from the flash-generator
      # relations: each carries an origin, and none names a relation the steam
      # side has retired.
      - python3 tools/check_steam_declaration_origins.py --include-dir include --declaration params/steam_control.declaration
      - python3 tools/check_control_declaration.py --include-dir include --source-dir src/control --source-dir src/delivery --source-header include/delivery_tolerance.h --source-header include/delivery_profile.h --source-header include/steam_control_declaration.h --source-header include/pump_trim_declaration.h --declaration params/control.declaration --tolerance params/tolerance.declaration --tree-dir src --tree-dir include
      # The vocabulary both seams draw the machine's actuation channels from,
      # and every structure's statement of which of them it answers.
      - python3 tools/check_plant_header.py include/machine_actuation.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_actuation_declaration.py --plant-root src/plant --include-dir include
      - python3 tools/check_plant_encapsulation.py src test --plant-root src/plant --include-dir include
      - python3 tools/check_support_status.py --plant-root src/plant --include-dir include --documentation README.md
      # The vocabulary a structure says whether its equations describe a machine
      # from, and every structure's claim. This is what the mutation sweep draws
      # its population from, so a structure arriving without a claim fails here
      # rather than silently joining or missing that population.
      - python3 tools/check_plant_header.py include/plant_machine_claim.h --plant-root src/plant --include-dir include --vocabulary-only
      - python3 tools/check_machine_claim.py --plant-root src/plant --include-dir include
      # And every build that would be energised selecting a structure whose
      # equations claim to describe a machine, rather than merely selecting one.
      # The environments are discovered from the platform each names, so a
      # second board is covered without a line here naming it.
      - python3 tools/check_machine_structure_selected.py --project . --plant-root src/plant --include-dir include
      # And that it compiles the model under the settings it applies to the
      # control logic already there. The gate that asks this of the host builds
      # covers only those, so without this the one artefact that gets energised
      # is the one nothing asks it of.
      - python3 tools/check_machine_build_settings.py --project . --plant-root src/plant
      # The description each of those builds would carry compiled in, compared
      # against the one the host verification tier is pinned to. It runs inside
      # the target build as well, before anything is compiled; here it asks the
      # same question of the artefact that was actually built, which is the run
      # that would notice a build directory carrying something else.
      - python3 tools/check_embedded_description.py --project .
      # And the artefact itself, because none of the above survives the linker
      # on its own: it discards what nothing reaches, and nothing on the machine
      # drives the model yet. An artefact the equations were dropped from passes
      # every check before this one.
      - python3 tools/check_target_carries_model.py --project . --include-dir include --params-dir params
      - python3 tools/check_direct_calls.py --project . --header include/plant_model.h --objects-in src/app/native
      # Every structure in the tree, and the artefact carrying it, are
      # discovered: forgetting to add a line cannot leave one unchecked.
      - python3 tools/check_structure_exclusive.py --project . --plant-root src/plant --include-dir include
      # Two descriptions are named here because the check needs a pair differing
      # in a single coefficient before it can conclude anything.
      - python3 tools/check_parameters_are_data.py .pio/build/native/program --params params/thermoblock.params --params params/thermoblock-variant.params --limits params/thermoblock.limits
      - python3 tools/check_parameters_are_data.py .pio/build/native_boiler/program --params params/boiler.params --params params/boiler-variant.params --limits params/boiler.limits
      # The misconfigured configurations are named because a forgotten name here
      # fails loudly rather than quietly.
      - python3 tools/check_selection_refused.py --project . --env native_no_structure --env native_two_structures --env native_boiler_two_structures --env stm32_no_structure --env stm32_two_structures --env stm32_actuation_map_incomplete --pio {{.PIO}}
      # The analysis the host tier runs everything of ours under, over every
      # environment the build declares for the host.
      - python3 tools/check_sanitizers.py --project .
      # What the plant's objects really carry: the flags of the compile commands the
      # build runs, the symbols left undefined, and any fused multiply-add.
      - python3 tools/check_plant_arithmetic.py --project .

  fw:run:
    desc: Run every host executable the build declares through its control-logic and plant-model entry paths under the sanitizers
    dir: "{{.FW_DIR}}"
    cmds:
      # The artefacts and the descriptions they are run against are discovered,
      # because an artefact built under the sanitizers and never run has been
      # analysed for nothing.
      - python3 tools/run_host_artefacts.py --project . --plant-root src/plant --include-dir include --params-dir params

  fw:host-closure:
    desc: Run the host tier (fw:build, fw:check, fw:test, fw:run) in a git repository holding only the files git tracks under the paths the build round declares it reads (HOST_READS in round_gate.py), so a host test that reads anything else fails here rather than slipping past the round's selection; fails when those paths select no tracked file. Part of the complete verification, never of the build round
    dir: "{{.ROOT_DIR}}"
    cmds:
      # The tasks are handed over, as the round and fw:verify hand them over,
      # and the paths are not: they are taken from round_gate.py so they are
      # declared once.
      - python3 {{.FW_DIR}}/tools/host_closure.py --task "{{.TASK_EXE}}" --host fw:build --host fw:check --host fw:test --host fw:run

  fw:emulate:provision:
    desc: Fetch the emulator and the register description the emulation tier runs against, pinned by digest, into .tooling (ignored by git), sharing the fetch across worktrees via a machine-global cache
    cmds:
      # Neither is committed: one is a platform-specific build far larger than
      # this repository, the other is the vendor's and carries terms this
      # repository does not hold. What makes the fetch reproducible is the
      # digest each is pinned to, not where it is kept — so .tooling (which
      # provision.py always resolves relative to the repo root, regardless of
      # cwd) can be a symlink into a cache shared by every worktree, the same
      # pattern sc:embed uses for the query embedder, instead of a per-worktree
      # copy.
      - |
        set -euo pipefail
        cache="${FW_TOOLING_CACHE:-$HOME/.cache/brew-state/firmware-tooling}"
        mkdir -p "$cache"
        # Re-point unconditionally when .tooling is already a symlink (so a
        # changed FW_TOOLING_CACHE takes effect, matching sc:embed's ln -sfn),
        # but never touch a pre-existing real directory.
        if [ -L .tooling ] || [ ! -e .tooling ]; then
          ln -sfn "$cache" .tooling
        fi
      - |
        cd "{{.FW_DIR}}" && python3 emulation/tools/provision.py

  fw:emulate:
    desc: Run the target build's own artefact under emulation and require every hardware-seam channel to have a peripheral model behind it that only its own commands reach
    dir: "{{.FW_DIR}}"
    cmds:
      # The build is run by the check itself rather than named as a dependency
      # here, because what the check has to establish is that the artefact it
      # emulated is the one that build just wrote -- and a build run separately
      # leaves that a matter of the order two lines happen to be in.
      - python3 -m unittest discover -s emulation/tests {{.CLI_ARGS}}

  fw:mutate:
    desc: Break each guarded property on purpose and require its check to notice — on demand, part of neither the build round's gate nor the nightly complete verification
    dir: "{{.FW_DIR}}"
    cmds:
      - python3 tools/mutate.py {{.CLI_ARGS}}

  fw:sweep:
    desc: Alter every comparison and operator in the plant model's arithmetic and require a test to notice — in full, part of the complete verification that runs nightly against main and runnable alone; a build round's gate runs it only restricted to the lines the branch changes in the population (--changed-lines), never in full. Needs LLVM 19 and the matching Mull package
    dir: "{{.FW_DIR}}"
    cmds:
      # The structures the mutants are drawn from are discovered, so a structure
      # added later joins the population without a line here naming it.
      - python3 tools/mull_sweep.py --project . --plant-root src/plant --include-dir include --pio {{.PIO}} {{.CLI_ARGS}}

  fw:verify:
    desc: The complete verification, run nightly against main rather than in a build round — build every environment, run every check, run the tests, run the host executables, run the whole host tier again in a tree holding only the files git tracks under the paths the build round declares it reads, run the target artefact under emulation against modelled peripherals, check every board design the repository tracks with KiCad's own rule checks, run the tests of the board tooling without those that run the seeded-fault proof (which stays on demand), sweep the plant model's arithmetic. The board gates need KiCad 10.0 or newer, resvg 0.47 or newer and a monospaced font. Every gate runs to completion even after an earlier one fails, and the run fails naming every gate that did. Leave a gate out by name with task fw:verify -- --leave-out GATE (a name that is not a gate here, or named twice, is refused, and nothing else may be passed on); the closing lines then say it was left out, so the run never reads as the complete verification passing
    dir: "{{.ROOT_DIR}}"
    cmds:
      # The gates are handed over in order rather than run as a plain list, so
      # a gate failing does not stop the ones after it from running: this runs
      # unattended, and what a later gate would have found is as much the
      # night's result as the earlier failure.
      #
      # The host tier: every environment, every build-time check, the tests and
      # the host executables under the sanitizers.
      #
      # Then the host tier once more in a tree holding only the files the build
      # round declares it reads (HOST_READS in round_gate.py), because the round
      # skips the tier for a change outside those paths and that is safe only
      # while they are the whole of what the tier reads. The round never runs it.
      #
      # Then the tier below it: the artefact itself, executed, against models of
      # the peripherals it drives. It is here rather than left to be remembered
      # because the class of defect it nets -- a command addressing the wrong
      # peripheral, or none -- is invisible to every gate above it, which all sit
      # above the addressing.
      #
      # Then the board gates, which hold every board design the repository
      # tracks to KiCad's own rule checks and run the tests of the board tooling
      # that does it, without the tests that run the seeded-fault proof, which
      # stays on demand. A build round runs them only for a change that can
      # matter to a board; here they run unconditionally. They need KiCad, the
      # rasteriser and a monospaced font, and a host lacking one fails the gate
      # naming it rather than passing quietly.
      #
      # Last the sweep, because it is the longest and because it asks the
      # hardest question: not whether the checks pass, but whether the tests
      # would notice the model being wrong. It needs an LLVM toolchain matching
      # the mutation plugin, so a host without one fails the gate here rather
      # than passing quietly. The hosted nightly leaves it out here and runs it
      # sharded across runners instead.
      #
      # The '--' ends the declaration. What is passed on from the command line
      # comes after it, where the driver accepts only a gate left out, so it
      # can never name another task runner or add a gate.
      - python3 {{.FW_DIR}}/tools/verify_gate.py --task "{{.TASK_EXE}}" --gate fw:build --gate fw:check --gate fw:test --gate fw:run --gate fw:host-closure --gate fw:emulate --gate hw:verify --gate hw:test:round --gate fw:sweep -- {{.CLI_ARGS}}

  # ---------------------------------------------------------------------------
  # Cadences. A build round runs check:round once, and it is the only
  # verification a change gets before it merges; there is no separate
  # pull-request gate. fw:verify stays the single declaration of the complete
  # verification, which runs nightly against main.
  # ---------------------------------------------------------------------------

  check:round:
    desc: The build round's gate, and the only verification before a merge — runs the host tier in full (fw:build, fw:check, fw:test, fw:run) only when the branch changes a path the host tier reads (the firmware tree, this task definition file, the workflow declarations and the few other files its tests open, declared in HOST_READS), and the emulation tier (fw:emulate) only when it changes a path the emulation reads, both measured from its merge-base with the local remote-tracking origin/main and counting uncommitted edits and new files (a stale origin/main can mis-measure a branch, so branch from a freshly fetched main); runs the host tier and emulation anyway when it cannot tell what changed, including when there is no remote-tracking origin/main; a branch changing only documents, the requirement graph or a board design runs neither. Then runs the board tier (hw:verify, the pre-order check of every board design, and hw:test:round, the tests of the board tooling without those that run the seeded-fault proof) only when the branch changes a tracked KiCad file anywhere, anything under the hardware tree, anything a board design reads, the board tooling, the round gate's own code or this task definition file, judged on the changed paths alone and run anyway when they cannot be told or the files the designs read cannot be listed; a KiCad design file git does not track fails the round naming it, a branch changing none of those paths needs no KiCad, rasteriser or font, and a missing or too-old tool stops the round naming it rather than skipping the tier. Then runs the changed-lines mutation sweep (fw:sweep restricted to the mutants on the plant lines the branch changes, as the sweep derives its population) and never the full one; a branch changing no such line runs no sweep and needs no mutation toolchain, a branch that does needs LLVM 19 and the matching Mull package and fails without them, and a change whose lines cannot be told fails the round after the host (when it ran), emulation and board tiers. Stops at the first failing tier, so the sweep is not reached after one; its closing lines say which tiers ran, why one was skipped or was not reached, whether the sweep ran, was skipped, was not reached or could not run, and how many changed lines it covered. Its exit status is the verdict
    dir: "{{.ROOT_DIR}}"
    cmds:
      # The tasks are handed over rather than their commands copied, so the
      # round and fw:verify run the same thing. The paths that trigger the
      # host tier are declared once, as HOST_READS in round_gate.py, and those
      # that trigger the emulation tier as EMULATION_READS beside it.
      # The board tier is handed over the same way, as the board check and the
      # tooling tests fw:verify declares, and the task that lists what the board
      # designs read is how the gate learns which changed paths reach one. Which
      # paths run the tier by name are declared once, as BOARD_READS in
      # round_gate.py. A further round-scoped check is added here, beside the
      # tiers. The sweep is handed over as the same task fw:verify runs, and the
      # gate restricts it to the changed lines through the task's own arguments.
      - python3 {{.FW_DIR}}/tools/round_gate.py --task "{{.TASK_EXE}}" --host fw:build --host fw:check --host fw:test --host fw:run --emulation fw:emulate --board hw:verify --board hw:test:round --board-reads hw:reads --sweep fw:sweep

  check:daily:
    desc: The latest nightly verification of main, read first by an operator session — the first output line is green, red, none (no run has completed) or unknown (the history could not be read), then the conclusion, the commit it verified and a link to the run. Cancelled, skipped and neutral runs and runs still in progress are passed over for an older completed run. Exits zero whenever a result was read, red included, and non-zero only for unknown. Needs the GitHub command-line tool (gh), signed in, and Python 3.9 or newer; a missing or signed-out gh reads as unknown and names it
    dir: "{{.ROOT_DIR}}"
    cmds:
      - python3 {{.FW_DIR}}/tools/daily_status.py --workflow "Nightly verification" --branch main

  hw:verify:
    desc: The pre-order check — every board design in the repository through KiCad's own electrical, layout, schematic-parity and separation checks. Needs KiCad 10.0 or newer (set KICAD_CLI=/path/to/kicad-cli when kicad-cli is not on PATH), Python 3.9 or newer with PyYAML 5.1 or newer, and git 2.11 or newer
    dir: "{{.ROOT_DIR}}"
    cmds:
      # The designs are found from what git tracks, so a board joins the check
      # because it exists rather than because a line here names it.
      - python3 {{.HW_DIR}}/tools/board_check.py --root . --kicad-cli "{{.KICAD_CLI}}"

  hw:reads:
    desc: List every file the board designs the repository tracks read, one per line, a folder read whole ending in a slash and the repository's top level written ./ — each design's own folder, every sheet its schematic reaches, every library its tables name and the separation basis, pin allocation, parts specification, catalogue extract, derating policy, pin-limit and board rules records it is held to. Runs no check and needs no KiCad, and is how the build round's gate learns which changed paths reach a board design. Needs Python 3.9 or newer and git 2.11 or newer only
    dir: "{{.ROOT_DIR}}"
    cmds:
      - python3 {{.HW_DIR}}/tools/board_check.py --root . --list-reads

  hw:prove:
    desc: Seed every fault the pre-order check guards against into a throwaway copy of the proof design and require the check to catch each — on demand, in neither the build round's gate nor the nightly complete verification. Needs the same tools as hw:verify
    dir: "{{.ROOT_DIR}}"
    cmds:
      - python3 {{.HW_DIR}}/tools/board_prove.py --kicad-cli "{{.KICAD_CLI}}" {{.CLI_ARGS}}

  hw:review-fan-out:
    desc: Run a judged review as a setup session and forked reviewers (review_fan_out.py) — one setup session reads the review folder's shared material and judges nothing, then each unit of the review is judged in its own read-only reviewer forked from that session, up to a bound at once (a review with one unit is judged in a second turn of the setup session and is not forked), and the units' results are merged with no model by the checks of a caller, a Python module named review_caller_<name> beside the command that defines the prompts, how the units are found, the tools a reviewer is granted, the tables a result may hold and the merge's checks. A unit that errors or returns a malformed result is run once more, a call refused for a rate limit is retried after a growing wait, and a unit that still fails is named while the other units' results stay in the output folder, from which --rerun <unit> runs named units again in a new setup session and merges the kept results with the new ones. The report, as text or with --json, records every session's own time, tokens (read from the cache, written to it, fresh and generated, a fork that reads no cache flagged), turns and cost, with the setup session's cumulative figures taken off each fork's, the units run again and when, and the findings that concern one place. Run on demand, in neither the build round nor the nightly complete verification. Needs the agent command line on the search path and logged in (the program is named by the environment variable REVIEW_FAN_OUT_AGENT, claude when it is unset), and Python 3.9 or newer; no KiCad. Pass the caller, the review folder and the output folder after --, for example task hw:review-fan-out -- --caller layout --review /tmp/review --out /tmp/review-out; the output folder is outside the repository and apart from the review folder. Exits 0 when the merged record is written, 1 when it refuses or a unit fails (REFUSED lines), 2 when the agent command line is missing or not logged in (a CANNOT RUN line)
    # Run from where it is called, so the paths given are read as the caller wrote them.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/review_fan_out.py" {{.CLI_ARGS}}

  hw:review-seed:
    desc: Seed known layout defects, one or more for every area of the method's layout practice catalogue, into a throwaway copy of the layout review proof design (hardware/proof/review-proof), refuse the copy unless the pre-order check passes it, and write a review folder outside the repository holding only what the layout review step gives a reviewer (the seeded copy's KiCad files with its floorplan, plan and rules records and never its own review record, the method, the hardware readme, every review view, the placement view and its measures in a folder of their own, and the check's report), with the seed list written apart — on demand, not part of the gate. Pass the seed list path and the new or empty review folder after --, for example task hw:review-seed -- --seeds /tmp/seeds.json --out /tmp/review; task hw:review-seed -- --print-prompt prints the fixed prompt a blind review is started with. Needs the same tools as hw:views
    # Run from where it is called, so the paths given are read as the caller wrote them.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/review_seed.py" --kicad-cli "{{.KICAD_CLI}}" --resvg "{{.RESVG}}" {{.CLI_ARGS}}

  hw:production-seed:
    desc: Seed known defects into the production files of the layout review proof design (hardware/proof/review-proof), exported from its last commit with the commands the method's ordering step names, and write a production-files folder outside the repository holding only what the ordering step gives a follower (the seeded placement file, as the step converts it, with a part rotated, a polarised part reversed, an integrated circuit's first pin turned and a part moved, and the parts list with a catalogue number replaced; the Gerber and drill files exported from an edited copy of the board in which a layer is missing content, shifted and mirrored; the image of every layer and of the drill file drawn from those files by gerbonara 1.6.3 and resvg; the unseeded design's rendered views and placement view, which stand in for the assembler's preview; the design's parts specification record, the method, the hardware readme and the manufacturer's record), with the seed list written apart — on demand, not part of the gate. Refuses a seed that does not land, and a seed list inside the folder or inside a design's folder. Pass the seed list path and the new or empty folder after --, for example task hw:production-seed -- --seeds /tmp/seeds.json --out /tmp/production; task hw:production-seed -- --print-prompt prints the fixed prompt a blind follow is started with. Needs the same tools as hw:views, and gerbonara 1.6.3 in a virtual environment of its own (set GERBONARA_PYTHON=/path/to/that/python when python3 is not it)
    # Run from where it is called, so the paths given are read as the caller wrote them.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/production_seed.py" --kicad-cli "{{.KICAD_CLI}}" --resvg "{{.RESVG}}" --gerbonara-python "{{.GERBONARA_PYTHON}}" {{.CLI_ARGS}}

  hw:rules-confirm:
    desc: Confirm, by asking KiCad, that it loads a board's custom rules file (an appended marker rule fires only if it does) and list the nets it places in each named class, failing on an undefined or empty class or a board with no MAINS declaration. Pass the layout, its own project file and each class after --, for example task hw:rules-confirm -- --board b.kicad_pcb --project b.kicad_pro --class Power --class Ground. Needs the same tools as hw:verify
    # Run from where it is called, so the paths given are read as the caller wrote them.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/locked_copper.py" --kicad-cli "{{.KICAD_CLI}}" confirm {{.CLI_ARGS}}

  hw:copper-lock:
    desc: Lock every track, arc, via and zone on a board's critical-class nets in the board file, with the board closed in every editor, changing nothing else; refuses an undefined or empty class, a class list leaving out Mains on a board declaring mains, and a board KiCad's lock file shows open. Pass the layout, its own project file and each critical class after --, for example task hw:copper-lock -- --board b.kicad_pcb --project b.kicad_pro --class Power --class Ground. Needs the same tools as hw:verify
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/locked_copper.py" --kicad-cli "{{.KICAD_CLI}}" lock {{.CLI_ARGS}}

  hw:copper-record:
    desc: Record every track, arc, via and zone on a board's critical-class nets immediately before the routing round trip's export, refusing an undefined or empty class, a class list leaving out Mains on a board declaring mains, any unlocked item, and a board KiCad's lock file shows open. Pass the layout, its own project file, each critical class and where to write the record (never inside any design's folder) after --, for example task hw:copper-record -- --board b.kicad_pcb --project b.kicad_pro --class Power --class Ground --record /tmp/b.record.json. Needs the same tools as hw:verify
    # Run from where it is called, so the paths given are read as the caller wrote them.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/locked_copper.py" --kicad-cli "{{.KICAD_CLI}}" record {{.CLI_ARGS}}

  hw:copper-compare:
    desc: Compare a board's critical-class copper after the routing round trip's import with the record taken before export, failing on any missing, unlocked, changed or added item, and refusing a board KiCad's lock file shows open. Pass the imported layout, its own project file and that board's record after --, for example task hw:copper-compare -- --board b.kicad_pcb --project b.kicad_pro --record /tmp/b.record.json. Needs the same tools as hw:verify
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/locked_copper.py" --kicad-cli "{{.KICAD_CLI}}" compare {{.CLI_ARGS}}

  hw:views:
    desc: Render every layout review view of a board from its design files into a new or empty folder outside every design's folder — an image of each copper, mask, paste, silkscreen and edge layer and of every other layer holding an item, every whole-board view framing whatever its layers hold past the outline, an assembly view of each side, each critical net over a faint image of the whole board, a map of the critical classes, a crop around each integrated circuit and its own decoupling parts, and top, bottom and angled three-dimensional views — each PNG on a dark background with its caption drawn in, at three pixels across the smaller of the board's minimum track width and minimum clearance, tiled to stay within the size a reviewing model reads without downsampling, with an index of every image and a table of per-net facts, each as text and JSON. Refuses a board open in an editor, an undefined or empty class, a class list leaving out Mains on a board declaring mains, a missing layer, a board stating no minimum track width or clearance, and an output folder inside a design's folder or already holding files. Pass the layout, its own project file, each critical class and the output folder after --, for example task hw:views -- --board b.kicad_pcb --project b.kicad_pro --class Power --class Ground --out /tmp/b-views. Needs the same tools as hw:verify, and resvg 0.47 or newer (set RESVG=/path/to/resvg when resvg is not on PATH)
    # Run from where it is called, so the paths given are read as the caller wrote them.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/board_views.py" --kicad-cli "{{.KICAD_CLI}}" --resvg "{{.RESVG}}" {{.CLI_ARGS}}

  hw:sheets:
    desc: Render every sheet of every board design git tracks, drawn by KiCad's own command-line tool from a copy of the tracked files as the pre-order check reads a design, into a new or empty folder outside every design's folder — one SVG file for each sheet, in a subfolder for each design that follows the design's place in the repository, the root sheet named for the design and a sheet below it for the design and its own name. Writes nothing into the repository, and the images are never committed, so a render cannot drift from the schematic it shows. Fails a design it cannot draw by name, an output folder inside a design's folder or already holding files, and a repository that tracks no design; a missing or too-old KiCad stops it with CANNOT RUN naming kicad-cli. Pass the new or empty output folder after --, for example task hw:sheets -- --out /tmp/sheets. Needs KiCad 10.0 or newer and nothing else (set KICAD_CLI=/path/to/kicad-cli when kicad-cli is not on PATH)
    # Run from where it is called, so the output folder is read as the caller wrote it.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/schematic_sheets.py" --root "{{.ROOT_DIR}}" --kicad-cli "{{.KICAD_CLI}}" {{.CLI_ARGS}}

  hw:placement:
    desc: Render the placement view of a placed board, routed or not, from its design files and the floorplan table of the layout-plan.md beside it, into a new or empty folder outside every design's folder — the board's parts with each net's connections drawn straight between the pads they join (the minimum spanning tree over the net's pad centres, any copper laid left out) and the floorplan's regions drawn and named, in the layout review views' form, a PNG named placement on a dark background with its caption drawn in, at three pixels across the smaller of the board's minimum track width and minimum clearance, tiled to stay within the size a reviewing model reads without downsampling — with its index and the placement's measures (the connections' total length and each net's length, their crossings in total and by net, and every part outside its regions), each as text and JSON. Refuses a board open in an editor, a board stating no minimum track width or clearance, and an output folder inside a design's folder or already holding files; stops on a missing floorplan, a region row it cannot read, a part listed in a region recorded as none, and a listed part not on the board. Pass the layout, its own project file and the output folder after --, for example task hw:placement -- --board b.kicad_pcb --project b.kicad_pro --out /tmp/b-placement. Needs the same tools as hw:views, resvg 0.47 or newer among them (set RESVG=/path/to/resvg when resvg is not on PATH)
    # Run from where it is called, so the paths given are read as the caller wrote them.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/board_placement.py" --kicad-cli "{{.KICAD_CLI}}" --resvg "{{.RESVG}}" {{.CLI_ARGS}}

  hw:history:
    desc: Judge a board's placement and critical routing sections of the layout-plan.md beside it against the repository's history, reading every version of the board file reachable from HEAD — the floorplan in the commit the placement section is judged in held to the floorplan in the commit before the first commit whose board holds a footprint (comparing the set of region names, each region's bounds and each region's parts; no other text in the table is compared; the only difference allowed is a reference appended to a region's parts, committed before its footprint first appears and kept in the plan until then), the placement section as it stood in the commit before the first commit carrying a track, an arc, a via or a copper pour on a copper layer, a rule area being none (at least two candidates, each commit before that copper, holding the board, placing its parts differently from every other by reference, position, angle and side and not by the file's bytes, and named by its Renders, its recorded totals and parts outside recomputed from its commit against the floorplan the section is judged with, one verdict per placement item, the chosen one with no part outside and every footprint where the first copper's commit holds it), and each critical routing pass as it stood in the commit before its router commit (its Board judged commit on HEAD's line of history, the first holding critical copper all locked, a later one following the previous router commit with no unlocked copper added between, every checklist item judged or listed once, every fail put right before the router). Fails on copper or a footprint in the root commit, copper, footprints or router copper first appearing on two lines of history or in a merge commit, a commit before the first placement with no readable floorplan, and any cited commit a squash, rebase or force-push left out of the history; refuses a board or plan differing from HEAD, a shallow clone and a board it cannot read. Pass the layout after --, for example task hw:history -- --board b.kicad_pcb, --routed once the router's commit is made, so a last pass with no router commit fails, and --json for the verdicts as JSON. Exits 0 on a pass, 1 on a fail, 2 when refused. Needs git and Python 3.9 or newer only
    # Run from where it is called, so the board's path is read as the caller wrote it.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/board_history.py" {{.CLI_ARGS}}

  hw:review-history:
    desc: Judge a board's layout review record, the layout-review.md in its folder, against the repository's history, reading every version of the record reachable from HEAD — every round heading exactly `## Round <n>`, none given twice, no code fence left open, and each round only the parts the command reads (a `### Verdicts` table, an optional `### Findings` table or its no-finding line, an optional `### Plan and free pass` of prose, and no other heading or unreadable table), in the record or any earlier version of it, every round recorded in any version still there, each round's opening lines, verdict table and findings (their number, Raised by, Severity and What and where; Closed by is never compared) as they stood in the round's end-of-round commit, the first commit whose record holds its heading, the end-of-round commit an ancestor of, and not, every commit after the round's Board judged commit that changes the board's design files (the files KiCad reads for it, never the board's own markdown and YAML records, the review record among them), and no design file changed since the closing round's commit, and the closing round stating its round kind in its opening lines as a Round kind line giving full or narrow, and being full, and holding a verdict for every item round 1 and each earlier full round hold. Fails on any of these, a narrow closing round included, naming the board, the round and what differs; refuses a shallow clone, a folder not tracking exactly one KiCad project, a closing round stating no round kind, stating it more than once or one other than full or narrow, and a record or design file that is untracked, absent or differs from HEAD. Pass the board's folder after --, for example task hw:review-history -- --folder hardware/<machine>/<board>, and --json for the verdicts as JSON. Exits 0 on a pass, 1 on a fail, 2 when refused. Needs git and Python 3.9 or newer only
    # Run from where it is called, so the folder is read as the caller wrote it.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 "{{.ROOT_DIR}}/{{.HW_DIR}}/tools/board_review_history.py" {{.CLI_ARGS}}

  hw:gerbonara:
    desc: Create the virtual environment gerbonara 1.6.3 is installed in, at GERBONARA_VENV (by default a folder in your user cache, outside the repository), and read the version back, so the tasks and tests that draw exported fabrication layers find it without GERBONARA_PYTHON being set. Safe to run again. Needs Python 3.9 or newer with venv and pip, and network access to the Python package index the first time
    dir: "{{.ROOT_DIR}}"
    cmds:
      - python3 -m venv "{{.GERBONARA_VENV}}"
      - '"{{.GERBONARA_VENV}}/bin/python" -m pip install --quiet gerbonara==1.6.3'
      - '"{{.GERBONARA_VENV}}/bin/python" -c "import gerbonara; assert gerbonara.__version__ == \"1.6.3\", gerbonara.__version__; print(\"gerbonara\", gerbonara.__version__, \"in {{.GERBONARA_VENV}}\")"'

  hw:test:
    desc: Run the tests covering the board tooling (the pre-order check, the locked-copper check, the layout review views, the placement view, the placement and critical routing history check, the layout review record history check, the layout review proof's seeding command, the schematic sheet drawing command, the review fan-out command, and the production-files conversion, rendering and seeding command), against the real kicad-cli, resvg and gerbonara, the seeded-fault proof's own tests included — on demand; the build round's gate and the nightly complete verification run hw:test:round instead. Needs the same tools as hw:verify, resvg 0.47 or newer (set RESVG=/path/to/resvg when resvg is not on PATH), gerbonara 1.6.3 in a virtual environment of its own (set GERBONARA_PYTHON=/path/to/that/python when python3 is not it), and Task
    dir: "{{.ROOT_DIR}}"
    env:
      KICAD_CLI: "{{.KICAD_CLI}}"
      RESVG: "{{.RESVG}}"
      GERBONARA_PYTHON: "{{.GERBONARA_PYTHON}}"
    cmds:
      - python3 -m unittest discover -s {{.HW_DIR}}/tools/tests {{.CLI_ARGS}}

  hw:test:round:
    desc: Run the tests covering the board tooling as hw:test does, the review fan-out command's among them (they stand a stub in place of the agent command line and need no model), without the tests that need the seeded-fault proof, which stays on demand (hw:test runs the whole suite) — the part the build round's gate runs for a change that can matter to a board and the nightly complete verification runs every night. Against the real kicad-cli and resvg, so it needs the tools hw:test does, KiCad 10.0 or newer, resvg 0.47 or newer, a monospaced font for the layout review views' captions, which the tests need as well as the views, and gerbonara 1.6.3 in a virtual environment of its own (set GERBONARA_PYTHON=/path/to/that/python when python3 is not it) for the production-files tests, and a missing one stops the run with a CANNOT RUN line naming it
    dir: "{{.ROOT_DIR}}"
    env:
      KICAD_CLI: "{{.KICAD_CLI}}"
      RESVG: "{{.RESVG}}"
      GERBONARA_PYTHON: "{{.GERBONARA_PYTHON}}"
      BOARD_TESTS_WITHOUT_PROOF: "1"
    cmds:
      - python3 -m unittest discover -s {{.HW_DIR}}/tools/tests {{.CLI_ARGS}}
