# The project's own exponential, exponential less one and sine
# (src/plant/common/plant_maths.c). Every mutant of them that the tests can tell
# apart from the original is killed: the three functions' results are recorded as
# bits over arguments chosen to land on every reduction and every edge they have,
# so a change to a coefficient, a sign, an operator or a constant moves a bit
# somewhere in the set. What is left is a comparison at an argument where both
# sides of it give the same bits.

