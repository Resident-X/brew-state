  cxx_lt_to_le:src/plant/common/plant_maths.c:149:31:
    verdict: equivalent
    reason: >-
      The sine's magnitude, `x < 0.0f ? -x : x` widened to `<=`. The two differ
      only at x equal to zero, where the mutant takes the negation: minus zero for
