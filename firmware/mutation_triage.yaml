  cxx_gt_to_ge:src/plant/thermoblock/plant_structure.c:234:21:
    verdict: equivalent
    reason: >-
      The trapped pressure's lower guard, `!(casting_c > saturation_temperature)`
      widened to `!(casting_c >= ...)`, so a casting exactly at the saturation
      temperature no longer returns nothing at once and goes on to the
      subtraction. There the casting is bounded by the ceiling, which the relation
      refused at load keeps above the saturation temperature, so the bound is the
      casting itself, and the figure is the absolute pressure at the saturation
      temperature less the absolute pressure at the same argument, through the
      same function. The two are the same float, the difference is a zero, and
      `fmaxf(0, 0)` is the zero the guard returned. Were the saturation figure
      not finite the difference would be not-a-number, which `fmaxf` also answers
      as the zero.

