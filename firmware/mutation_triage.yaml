# What each surviving mutant was judged to be, and why.
#
# A mutant the tests do not kill is not a defect until somebody has decided it
# could be one. Some of these cannot change what the program does at all, so no
# test could kill them and writing one to try would mean asserting something
# untrue in order to move a number. Deciding which is which is a reading of what
# the code means, and the sweep does not make that judgement -- it requires that
# somebody has, and reports an unjudged survivor as unreviewed rather than as a
# fault found.
#
# Each key is the mutant as tools/mull_sweep.py names it:
#
#     <mutator>:<source relative to firmware/>:<line>:<column>
#
# The line and column are part of the identity on purpose. Editing the code
# these were judged about moves them, the judgement stops matching any mutant
# the sweep finds, and the sweep fails on the stale entry rather than carrying a
# decision forward past the code it was made about.
#
# verdict is one of:
#
#   equivalent  The mutant provably cannot change any observable behaviour. No
#               test can kill it because there is nothing to observe.
#   analysis    The mutant does change what the program does, but only by
#               reading or writing outside something -- which no assertion can
#               see, and which the sanitized build aborts on. The sweep runs
#               with that analysis deliberately switched off, so it cannot see
#               it either. Admissible only when some test really does reach the
#               line, or nothing is watching it in either build.
#   gap         A real hole in what the tests catch. The sweep fails while any
#               of these stand: the point of finding one is to close it.
#
# There are no `gap` entries here, and there never have been for long. Six were
# found when this sweep was first run and all six were closed by tests rather than
# recorded -- see the suite's own entries for indented lines, a final line without
# a newline, the two reports that quote a line, the declared bounds being
# admissible values, and a value token longer than the loader can hold.
#
# Eleven more were found when the population stopped being a written-down list and
# took in the single-boiler structure's equations and the origin parsing that had
# arrived in the loader unswept. All eleven were closed the same way. Nine were in
# the boiler structure, whose suite asserted properties that hold whatever the
# coefficients are and so left the arithmetic itself unpinned; it now checks the
# vessel's step against the closed form of the relaxation, at a step long enough
# for the correction to matter as well as a short one, along with the duty scaling,
# a description that loses nothing, and the steam pressure either side of
# saturation. Two were in the loader: an annotation whose kind is separated from
# the marker by whitespace, which every shipped description happens to write
# without, and the text a refused origin statement reports itself against.

# Every judgement about plant_parameters.c below was re-made at a new line rather
# than carried forward. The loader grew by 124 lines between the sweep being
# written and the description work merging -- two branches in parallel, neither
# wrong -- and nobody ran the sweep in between, so the whole record went stale at
# once. Each entry was checked against the code now at its line before being
# moved: the reasoning is unchanged because the arithmetic is unchanged, and an
# entry whose code had actually moved would have had to be judged again.

# Both steam-pressure judgements were re-made at new lines when the water drawn
# through a block started taking energy out of it. Neither expression moved
# relative to anything it depends on: the thermoblock's was pushed down by its
# parameter table gaining four entries and by the note above that table growing a
# paragraph about the two water properties, and the boiler's by the same table
# gaining two and by the flow relation being lifted above the vessel's step so
# the step could read it. The comparison at each new line is character for
# character the one the judgement was written about, and what it is about -- a
# gauge pressure that is nothing below saturation either way -- is untouched by
# anything the flow term added, which reaches neither steam mass.
#
# The arithmetic that term did add produced mutants of its own in both
# structures, and the suites killed every one of them; none of it is recorded
# here, which is what that means. One of them was a real gap when it first
# appeared -- the vessel's relaxation correction, which the drawn coefficient now
# enters, was pinned by no test at a step long enough for the correction to
# matter with the pump open -- and it was closed by a test rather than recorded,
# the way the others before it were.

# Both steam-pressure judgements were re-made at new lines again when the steam
# side started paying for what is drawn off it. Neither expression moved relative
# to anything it depends on: the thermoblock's was pushed down by its parameter
# table gaining two entries and by the note above that table growing a sentence
# about the latent heat's bounds, and the boiler's by the same table gaining two
# and by that structure's note growing a paragraph about its three water
# properties. The comparison at each new line is character for character the one
# the judgement was written about.
#
# What it is about is untouched by any of it, and that is worth being exact about
# rather than asserting, because this is the first change to reach the steam
# pressure relation itself. The judgement is that a gauge pressure is nothing
# below saturation whether the comparison is written `>` or `>=`, since the two
# differ only at exactly zero where the product and the literal are the same
# value. The draw does not enter that expression: it is applied to the expression's
# answer afterwards, as a gap subtracted from it, and the gap is bounded above by
# that same answer -- so at exactly saturation the mutant and the original hand
# the same zero to the same subtraction of a gap that is itself clamped to zero.
#
# The arithmetic the draw did add produced mutants of its own in both structures,
# and the suites killed every one of them; none of it is recorded here, which is
# what that means. The comparison that decides whether a draw is open is the one
# that would most plausibly have survived -- widening it to `>=` changes nothing
# at a fresh instance, since the gap it then fails to clear is already nothing --
# and it is killed by the tests that close a draw and require the pressure to be
# the saturation relation again on the next step, which is the only place a gap
# left standing at no demand is visible.

# Every judgement about plant_parameters.c was re-made at a new line a second
# time, when the grammar grew the error the design assumes for a value. The
# loader gained a second annotation to read, a helper both of its public loaders
# share, and an accessor of its own, which moved every line below the first of
# them. Each entry was checked against the code now at its coordinates before
# being moved: the reasoning is unchanged wherever the arithmetic is unchanged,
# the two entries whose subject genuinely changed shape say so, and the
# accessor's own copy of the spec-table guard is judged on its own terms rather
# than by pointing at the walk's.

# The judgements in plant_parameters.c and the boiler's structure file were moved
# to new lines when the loader gained the relations a structure declares between
# its coefficients and the accessor that reads one figure back by position: the
# loader's relation walk sits above the entries from `plant_parameter_budget_for`
# down, the value accessor above `plant_parameter_supply_driven`, and the boiler's
# own empty relation table above its steam-pressure relation. Each moved line is
# character for character the one the judgement was written about, so the
# reasoning stands unaltered. The value accessor's own copy of the table-size
# guard is judged on its own terms below; its position guard is killed by the
# test that asks for the position one past the last.

# The thermoblock's and the boiler's steam-pressure judgements were re-made at
# new lines again when the commanded margin arrived: `plant_parameter_scale`,
# `plant_parameter_position` and `plant_parameter_supply_driven` were added to
# the end of plant_parameters.c, which moves nothing already in that file, and
# each structure gained a `plant_structure_supply_driven_parameters` accessor
# above its own steam-pressure relation, which does. Both comparisons are
# character for character the ones the judgements were written about, so the
# reasoning stands unaltered at the new lines.
#
# The three new range guards those functions added -- one per function -- are
# the same compiled-in spec-table size check judged equivalent twice already,
# made a third, fourth and fifth time on the same terms. The two range-boundary
# comparisons in `plant_parameter_scale` were closed by a test instead: nothing
# before called it with a coefficient already sitting at the edge of its
# declared range, so `>` and `>=` had never been told apart there, and a corner
# consumer scaling by a declared error small enough to land exactly on that
# edge is not implausible enough to leave unwatched. The boiler's own
# `plant_structure_supply_driven_parameters` was closed the same way: it is
# this structure's file rather than the shared one, so the thermoblock-side
# test could not have reached it, and nothing had asked this structure the
# question before.

# Two more mutants in those same functions surfaced unjudged later with no
# change to plant_parameters.c at all: the position guard in
# `plant_parameter_scale` and the loop bound in `plant_parameter_supply_driven`.
# Neither is new code. Each one's only effect is a read one entry past a
# compiled-in static table, so each is killed or not according to what the
# linker happened to place after that table -- the host-dependence the
# value-token and spec-lookup entries below already describe. The sweep that
# last re-judged this file did not report either as surviving; a later run with
# the code unchanged reports both. Both are judged `analysis`, and for each the
# sanitized tier was shown to catch it rather than argued to.

