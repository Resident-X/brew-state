; Which implementation of the hardware seam a build gets follows from which
; environment is built. No environment changes a source file under src/control:
; the difference between them is entirely which directory under src/hw is
; compiled in, and that is a link-time fact.
;
; Which plant structure a build gets follows the same way: from which directory
; under src/plant is compiled and put on the include path, and from nothing
; decided while the software runs. A build compiling the plant model must name
; exactly one; the pre-build check stops a build naming none or naming two
; rather than letting a default or the linker decide.
;
; The STM32 family the target environment names is nominated for the
; pre-hardware build. It is not the machine's controller selection, which is
; answered later against measured parameters.

[platformio]
default_envs = native

[common]
; The control logic is compiled into every environment, unchanged.
control_sources = +<control/>

; The parameter loader is shared by every structure and is not one itself, so
; it is compiled into every environment that compiles the plant model.
plant_sources = +<plant/common/>

; The control logic drives from a reconstructed state, so wherever the control
; logic is compiled the estimator is compiled beside it. It is not a host-tier
; convenience the target can be left without: an environment that took the
; control sources and not these would not link.
estimator_sources = +<estimator/>

; Applied to everything the build compiles, including third-party code.
base_flags = -std=c11 -Wall -Wextra

; Applied only to this project's own sources. A warning in code we wrote is a
; defect; the same warning inside a vendored library is not ours to fix, and
; making it fatal would only mean turning the strictness off everywhere.
;
; -Wdouble-promotion is here because the plant model's quantities are single
; precision deliberately, to leave the choice of controller open. A stray
; promotion reintroduces the wider arithmetic silently -- an unsuffixed literal
; is enough -- and the build is where that should be caught rather than in a
; reading of the source.
strict_flags = -Werror -Wconversion -Wshadow -Wdouble-promotion

; The control logic's own header is on the include path of every environment;
; each environment adds only the implementation directory it links.
control_includes = -I $PROJECT_DIR/src/control

[native_base]
platform = native
build_src_filter = ${common.control_sources} ${common.estimator_sources} ${common.plant_sources} +<hw/sim/>
build_flags = ${common.base_flags} ${common.control_includes} -O1 -g -I $PROJECT_DIR/src/hw/sim
build_src_flags = ${common.strict_flags}
; Sanitizer flags reach both the compile and the link step through the script;
; putting them in build_flags alone does not survive linking on every host. The
; maths library is named through a script of its own, for a reason that script
; states: it is part of the standard library on some hosts and a separate one on
; others, and the build should not depend on which host it was run on.
extra_scripts =
    pre:tools/pio_seam_checks.py
    post:tools/pio_link_maths.py
    post:tools/pio_sanitize.py

[env:native]
; The host executable the tier-one analysis stage runs, built against the
; machine-describing structure.
extends = native_base
build_src_filter = ${native_base.build_src_filter} +<plant/thermoblock/> +<app/native/>
build_flags = ${native_base.build_flags} -I $PROJECT_DIR/src/plant/thermoblock

[env:native_fixture]
; The same consumers built against the fixture structure instead. It exists so
; the exclusivity check compares two real artefacts: a check that only ever
; sees one structure cannot fail, and a check that cannot fail is not a check.
extends = native_base
build_src_filter = ${native_base.build_src_filter} +<plant/fixture/> +<app/native/>
build_flags = ${native_base.build_flags} -I $PROJECT_DIR/src/plant/fixture

[env:native_boiler]
; The same consumers built against the single-boiler structure: a different
; architecture rather than the same equations with different numbers. One
; heated vessel serves both paths, so it answers two of the machine's three
; actuation channels and reports both temperature quantities from one state.
;
; It is a separate environment for the same reason every structure is: which
; structure a build gets is which directory it compiles, decided here and
; nowhere while the software runs.
extends = native_base
build_src_filter = ${native_base.build_src_filter} +<plant/boiler/> +<app/native/>
build_flags = ${native_base.build_flags} -I $PROJECT_DIR/src/plant/boiler

[env:native_no_structure]
; Deliberately misconfigured: it compiles the plant model and names no
; structure. It must not build. Driving it is what keeps the refusal honest.
;
; The declaration below is what keeps the discovering gates away from it: an
; environment required to be refused cannot also be required to build cleanly
; under the analysis, and a gate reading the reason out of the environment
; itself leaves nobody an exclusion to remember somewhere else.
extends = native_base
custom_must_not_build = it names no structure, and is required to be refused rather than built
build_src_filter = ${native_base.build_src_filter} +<app/native/>

[env:native_two_structures]
; Deliberately misconfigured: it names both structures, so the linker would
; have two definitions of every operation to choose between. It must not build.
extends = native_base
custom_must_not_build = it names two structures, and is required to be refused rather than built
build_src_filter = ${native_base.build_src_filter} +<plant/thermoblock/> +<plant/fixture/> +<app/native/>
build_flags = ${native_base.build_flags} -I $PROJECT_DIR/src/plant/thermoblock

[env:native_boiler_two_structures]
; Deliberately misconfigured: it names the single-boiler structure alongside the
; machine-describing one, so the linker would have two definitions of every
; operation to choose between. It must not build.
;
; It is here rather than left to the pair that existed before because the
; refusal is a property of every pair of structures in the tree, and a pair
; nothing drives is a pair nothing establishes. An arriving structure buys that
; guarantee for itself; it does not inherit it.
extends = native_base
custom_must_not_build = it names two structures, and is required to be refused rather than built
build_src_filter = ${native_base.build_src_filter} +<plant/thermoblock/> +<plant/boiler/> +<app/native/>
build_flags = ${native_base.build_flags} -I $PROJECT_DIR/src/plant/thermoblock

[env:native_test]
; The same sources without the host entry point, so the unit-test runner
; supplies main() instead. It is built against the machine-describing
; structure, which is what the model's own tests have to be asserting about.
;
; The reference description is named here rather than copied into the suite, so
; that the tests are exercised against the description the machine's numbers
; actually live in. A suite carrying its own coefficients would keep passing
; after the description drifted from the structure it describes, and nothing
; else reads that file closely enough to notice.
;
; The statement beside it and the variant compared against it are named on the
; same terms and for the same reason. The description is all three: a list of
; values, the account of what they mean, and the near-copy that establishes the
; values are read rather than compiled in. A coefficient can be added to the
; first and left out of the other two, and the suite is entitled to say so
; rather than leaving it to a build check alone.
extends = native_base
build_src_filter = ${native_base.build_src_filter} +<plant/thermoblock/>
build_flags = ${native_base.build_flags} -I $PROJECT_DIR/src/plant/thermoblock
    -D REFERENCE_DESCRIPTION_PATH='"$PROJECT_DIR/params/thermoblock.params"'
    -D REFERENCE_STATEMENT_PATH='"$PROJECT_DIR/params/thermoblock.md"'
    -D REFERENCE_VARIANT_PATH='"$PROJECT_DIR/params/thermoblock-variant.params"'
test_build_src = yes
; The test runner's own generated support file is compiled alongside the
; project's sources here and is not ours to keep warning-free. The same control
; and plant translation units are compiled under the strict flags by the native
; environment, so nothing goes unchecked by relaxing them for the test run.
;
; The declaration below is the same statement in a form the gate can read. It
; is honoured only on an environment that really does compile foreign sources
; through this path -- the key above is what establishes that -- so it cannot
; become a way of turning the settings off somewhere they could be kept.
custom_strict_flags_exemption = the test runner's generated support file is compiled through this path and is not ours to keep warning-free
build_src_flags =
; The suites naming this structure's coefficients, and the control logic's,
; which is compiled the same way into every environment. The suite that drives a
; structure answering fewer channels than the machine has is not among them:
; this structure answers all of them and could not fail against it.
test_filter = test_plant, test_control, test_estimator

[env:native_fixture_test]
; The same test runner against the fixture structure, which answers one channel
; of the three the machine has. Its narrowness is the whole point: the seam's
; refusal of a command on an unanswered channel cannot be shown to fail against
; a structure that answers everything, and a refusal nothing can trigger is
; indistinguishable from not having one.
extends = native_base
build_src_filter = ${native_base.build_src_filter} +<plant/fixture/>
build_flags = ${native_base.build_flags} -I $PROJECT_DIR/src/plant/fixture
test_build_src = yes
custom_strict_flags_exemption = the test runner's generated support file is compiled through this path and is not ours to keep warning-free
build_src_flags =
; Only the suite written against a narrowly-declared structure. The other suites
; name the thermoblock's coefficients, which this structure does not have.
test_filter = test_plant_narrow

[env:native_boiler_test]
; The test runner against the single-boiler structure. Its suite asserts what
; holds of any model of that architecture whatever its coefficients are -- that
; nothing applied moves nothing, that heat raises the temperatures and lowers
; no quantity, that a sequence repeats exactly, and that both temperature
; quantities follow the one vessel. Whether the equations describe a real
; single-boiler machine is not something a test can settle and nothing here
; claims to.
;
; No reference description is named, unlike the environment built against the
; machine-describing structure. There is no machine behind this one, so there is
; no description whose numbers a suite should be pinned to; the suite carries
; its own coefficients as text instead.
extends = native_base
build_src_filter = ${native_base.build_src_filter} +<plant/boiler/>
build_flags = ${native_base.build_flags} -I $PROJECT_DIR/src/plant/boiler
test_build_src = yes
custom_strict_flags_exemption = the test runner's generated support file is compiled through this path and is not ours to keep warning-free
build_src_flags =
; Only this structure's own suite. The others name coefficients belonging to
; structures this one does not share a parameter table with.
test_filter = test_plant_boiler

[env:native_mutation]
; The test build again, compiled so that it carries mutants of the plant
; model's own arithmetic, for the sweep to run against. It builds the same
; sources as native_test and asserts nothing new; what differs is entirely the
; toolchain it is compiled by, which is why it is a separate environment rather
; than a flag on that one.
;
; The declaration below is what keeps the gates covering every host build away
; from it. Those gates build what they cover, and building this requires a
; mutation toolchain -- so covering it would make installing that toolchain a
; condition of running the ordinary gates on every host, to analyse translation
; units native_test already analyses. The reason sits here rather than in a
; gate's argument list because reading it out of the environment leaves nobody
; an exclusion to remember somewhere else.
;
; It is the one host environment compiled without the sanitizer script, and the
; omission is the point: a mutant that AddressSanitizer stops is a mutant the
; test suite was not shown to notice. The sweep asks what the tests catch, so it
; is asked with nothing else watching. tools/pio_mutation.py says why at length.
extends = env:native_test
custom_mutation_sweep = it is compiled by a mutation toolchain the ordinary gates do not require, over sources native_test already covers
extra_scripts =
    pre:tools/pio_seam_checks.py
    post:tools/pio_link_maths.py
    post:tools/pio_mutation.py

[env:native_fixture_mutation]
; The narrow test build, compiled the same way, so that the shared sources are
; swept against the suite that can actually refuse a command.
;
; It is here because a mutant is only evidence about the tests once every suite
; compiling the mutated source has been asked. The seam's refusal of a command
; on a channel no structure answers cannot be triggered against the thermoblock,
; which answers all of them -- so sweeping only that build reports the whole
; refusal as unnoticed, when what is true is that the suite which notices it was
; never run. The sweep counts a mutant as caught when any suite kills it, and
; this is the other suite.
;
; Only src/plant/common is drawn from here. The fixture structure declares that
; its equations describe no machine, which is what keeps it out of the population
; the sweep derives; what this build contributes is a second oracle over the
; sources every structure shares.
extends = env:native_fixture_test
custom_mutation_sweep = it is compiled by a mutation toolchain the ordinary gates do not require, over sources native_fixture_test already covers
extra_scripts =
    pre:tools/pio_seam_checks.py
    post:tools/pio_link_maths.py
    post:tools/pio_mutation.py

[env:native_boiler_mutation]
; The single-boiler test build, compiled the same way, so that the second
; machine-describing structure's equations are swept too.
;
; It is here because the population follows the tree: the boiler structure
; declares that its equations describe a machine, so the sweep draws mutants from
; them -- and mutants of a source no mutation build compiles are mutants that
; never exist. Widening the scope without a build to compile it would have left
; the sweep reporting a score over the thermoblock alone while naming both, which
; is the failure the derivation exists to end rather than a smaller version of
; it. mull_sweep.py refuses to run when a machine-describing structure has no
; environment here, so this cannot be forgotten for a structure arriving later:
; the sweep stops instead of quietly reporting a narrower number.
extends = env:native_boiler_test
custom_mutation_sweep = it is compiled by a mutation toolchain the ordinary gates do not require, over sources native_boiler_test already covers
extra_scripts =
    pre:tools/pio_seam_checks.py
    post:tools/pio_link_maths.py
    post:tools/pio_mutation.py

[stm32_base]
; What every build for the target board has in common. The plant model is
; compiled in here rather than in the environment below, because a build for a
; machine that carried no model of itself is not a variation this project has:
; the deliberately misconfigured environments further down inherit the model and
; differ only in which structure they name, which is what makes their refusal a
; statement about structure selection rather than about the plant being absent.
;
; The maths library is named by the same script the host builds use. The
; reason that script gives -- that leaving the dependency implicit works on
; some hosts and not others -- applies at least as strongly to a toolchain
; nobody has put these sources through before.
platform = ststm32
board = genericSTM32F407VGT6
framework = stm32cube
build_src_filter = ${common.control_sources} ${common.estimator_sources} ${common.plant_sources} +<hw/stm32/> +<app/stm32/>
build_flags = ${common.base_flags} ${common.control_includes} -I $PROJECT_DIR/src/hw/stm32
; The plant sources arrive through the source filter above, so they are compiled
; under the settings this environment applies to everything this project wrote,
; alongside the control logic. They are not admitted through a relaxation of
; them, and nothing here widens them to match the host tier's analysis: that
; analysis is the host tier's to run, and these translation units are already
; covered by it.
build_src_flags = -Werror
extra_scripts =
    pre:tools/pio_seam_checks.py
    pre:tools/pio_embed_description.py
    post:tools/pio_retain_plant_model.py
    post:tools/pio_link_maths.py

[env:stm32]
; The target build, carrying the machine-describing structure and the
; description the design was established against.
;
; The description is declared rather than named as a path for the artefact to
; open, because the target has no filesystem to open one from. The build
; renders it into the artefact as data and the entry point reads it back
; through the plant seam's own loader; the check that runs alongside that
; rendering is what establishes it is this description and not another.
extends = stm32_base
custom_embedded_description = params/thermoblock.params
build_src_filter = ${stm32_base.build_src_filter} +<plant/thermoblock/>
build_flags = ${stm32_base.build_flags} -I $PROJECT_DIR/src/plant/thermoblock

[env:stm32_no_structure]
; Deliberately misconfigured: it builds for the machine and names no structure.
; It must not build.
;
; The host environments already drive this refusal, and this is not a second
; copy of that. A machine built with no model is the case with no symptom --
; nobody is watching a target build's console the way they watch a host test
; run -- so the refusal is established on the environment that would be
; energised rather than inferred from the one that would not.
extends = stm32_base
custom_must_not_build = it names no structure, and is required to be refused rather than built
; Only the seam checks. The script that renders the carried description would
; also stop this build, for want of a description to render -- and a build with
; two reasons to fail is one whose refusal says whichever the script order
; happens to reach first. The gate requires the stop to come from the selection
; check by name, so leaving the second reason in place would make reordering the
; list above silently turn a passing gate into a failing one.
extra_scripts = pre:tools/pio_seam_checks.py

[env:stm32_two_structures]
; Deliberately misconfigured: it names two structures, so the linker would have
; two definitions of every operation to choose between. It must not build.
extends = stm32_base
custom_must_not_build = it names two structures, and is required to be refused rather than built
extra_scripts = pre:tools/pio_seam_checks.py
build_src_filter = ${stm32_base.build_src_filter} +<plant/thermoblock/> +<plant/fixture/>
build_flags = ${stm32_base.build_flags} -I $PROJECT_DIR/src/plant/thermoblock
