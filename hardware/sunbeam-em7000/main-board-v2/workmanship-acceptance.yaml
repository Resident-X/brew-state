# workmanship-acceptance.yaml  --  Sunbeam EM7000 v2 main board.  Signed on the owner's behalf in the session of 2026-11-12.
#
# HOW THE CHECK READS THIS FILE (hardware/tools/board_check.py, judge_workmanship; hardware/README.md "Owner-accepted workmanship lines")
#   - One entry accepts the lines of ONE rule at ONE place (a net, a reference designator or a project text variable), up to `count`, in the
#     order the check reports them. A line beyond the count, at another place or of another rule fails as before.
#   - An entry that no line uses is STALE and fails the check. So an entry exists only where the check reports a line on the board, and the
#     counts below are the lines found on the board of the commit that adds this file. After ANY change to the board, take the check's own
#     lines again and re-derive the counts: a fixed line leaves its entry stale.
#   - An entry for a rule the severity policy marks WARNING is also stale. This file holds none of those rules.
#   - The rules the check accepts are a closed list. track_width, silk_edge_clearance, ground_return and reference_off_silkscreen are NOT on it;
#     track_width and silk_edge_clearance go in severity-policy.yaml.
#
# BOARD: the neat low-voltage routing of this design, sha256 183c5f7b923cfabe272aafd2225cc744f00e87b8a4fbb49b7f5e02b9e9500591 of the board file as imported (its router commit). The counts were taken with
# the creepage constraint left out of the copy of the rules KiCad read, so no creepage or spacing line is among them; the full pre-order check
# reports those itself.
# Project figure: WORK_DETOUR_RATIO = 1.5, set in main-board.kicad_pro by the commit that moved it from the catalogue item's 1.3; with 1.3 the
# detour list would hold many more short nets. The reason is in the `Route length` row of design-rules.md.
# SIGNER: every entry reads "owner (signed on behalf, session 2026-11-12)": the owner's standing instruction of that day was to sign on his behalf
# the relaxations the routing sessions recorded, and to list them for him at the end. The block headed BASELINE MAINS COPPER is the exception in
# kind: neatness lines on locked mains copper that is identical item for item to the copper of the previous, signed routing (417 of 417 items,
# `task hw:copper-compare`). No source list names them; the owner confirms or deletes the block. It changes no mains copper and no spacing rule.
#
# RELAXATIONS THE OWNER SIGNED THAT THE CHECK READS NO LINE FOR. No entry can exist for them (it would be stale and fail). They are carried by the
# deviation rows of design-rules.md and layout-plan.md and by the Pass 1 rows of layout-plan.md, which state the measured figures:
#   KEY lanes on B.Cu under the processor's east pin column and their vias; the via cases of CURR1_AN, SPARE_AN2, NTC_COF, NRST, PUMP_C_GATE and
#   BUZZER; the USB pair's length difference (full speed, 12 Mbit/s); test points as vias with stubs; hooks (two tracks meeting at a pad); the
#   segment counts of the supply meshes. The check has no rule for any of these.
#   Region exceptions: written into the three places that hold each region's parts list, so the project rules report no items_not_allowed line.
#
# The check prints each accepted line as an ACCEPTED report line; nothing here is read as a pass for a mains spacing, a creepage or any safety rule.
# Not in this file on purpose: ground_return (the connectors' ground-return ratio) and test_point_courtyard (test points must stay reachable, the
# owner's strict item), and workmanship_pad_entry, workmanship_pad_corner, workmanship_direction and workmanship_detour lines that no signed
# relaxation covers: they stay failing lines of the check until the routing changes or the owner classes them.
accepted_workmanship:

  # ---- T branches on supply, ground and slow nets ----
  # track_angle at +5V: 10 line(s) on the board. e.g. Track angle (rule 'Corners' min angle 135.000°; actual 90.000°) (workmanship item WORK-4 corners turned at 45 degrees or as arcs)
  - rule: track_angle
    scope: "+5V"
    count: 10
    reason: "A plain square T branch on a supply, ground or slow net: the branch leaves the trunk at 90 degrees where a bend asks 135. This board has no high-frequency or timing signal on these nets, so a T joins a branch to its trunk with no cost to the signal, and the owner kept the strict form (no T) only for fast, sense, crystal and USB nets."
    bounded_by: "net class is Supply5V, Supply3V3, Ground, Default or Noisy and the name has no HSE, LSE or USB in it; the branch carries one load's current, well under the trunk's 0.45 mm width"
    accepted_by: "owner (signed on behalf, session 2026-11-12)"
    accepted_on: "2026-11-12"

  # ---- 0.2 mm pieces at pad entries and within 2 mm of fine-pitch pads ----
  # track_segment_length at +3V3A: 1 line(s) on the board. e.g. Track segment length (rule 'Jogs' min length 0.5000 mm; actual 0.4243 mm) (workmanship item WORK-5 no jog)
  - rule: track_segment_length
    scope: "+3V3A"
    count: 1
    reason: "A piece shorter than 0.5 mm that is at least 0.2 mm, at the entry of a pad or within 2 mm of a 0.5 mm pitch pad. A stub from a 0.5 mm pitch pad is shorter than 0.5 mm whatever is done, and 0.2 mm is more than twice the maker's 0.09 mm track and space minimum."
    bounded_by: "no piece shorter than 0.2 mm exists on any low-voltage net (measured); the maker's minimum track is 0.09 mm"
    accepted_by: "owner (signed on behalf, session 2026-11-12)"
    accepted_on: "2026-11-12"
