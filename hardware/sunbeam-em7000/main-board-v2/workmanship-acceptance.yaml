  - rule: workmanship_width
    scope: "GND"
    count: 2
    reason: "A 0.2 mm ground stub inside the controller's pin field (U401 ground pins 10 and 19 and the stubs at C410): 0.2 mm is narrower than the 0.45 mm ground class, over 0.4 to 1.1 mm only, between a pad and the ground pour or via. A stub that short carries one pin's return current, and a 0.45 mm track does not fit between 0.5 mm pitch pads."
    bounded_by: "owner-signed 0.2 mm GND stubs inside U401's courtyard (2026-11-11); the stub is under 1.2 mm long and ends on a pad and the ground pour"
    accepted_by: "owner (signed on behalf, session 2026-11-12)"
    accepted_on: "2026-11-12"

