# The pin allocation record of the Sunbeam EM7000 main board, read by the pre-order board
# check (connectivity and pin_allocation rules).
#
# Every channel is a used port pin of the STM32H743VIT6 (U401, LQFP100) with the net it
# drives, taken from controller-pin-table.md (DS12110 Rev 11 Table 9, LQFP100 column, read
# 2026-10-29) and checked pin by pin against sheets/31-controller.yaml. The 22 port pins
# that table leaves unconnected are not listed: they carry no net. A channel is named for
# its net, lower case. A net local to a sheet is written with its sheet path, as KiCad
# names it; a global net is written plain.
#
# A connector and connector pin are given only where the controller net itself lands on
# a connector pin, which is what the check compares: J401 (serial-wire debug), J402 (USB
# panel cable), J821 (operator panel), J861 (knob microswitches) and J862 (tank reed).
# Every other controller net reaches its cable through a series part, a divider or a
# buffer, so its channel stays on the board and is held to its controller pin alone.
# Each remaining connected pin of the five named connectors is listed as a rail entry
# (the check requires every connected pin of a named connector to be listed); a rail
# entry's channel is a label and its net is held to its connector pin. J401 pin 10 is
# listed as the rail entry NRST because NRST is not a port pin and so has no
# controller_pin to give.
#
# No firmware_channel or firmware_sensor key is written: no source maps the firmware's
# channel enumerations to these nets.
channels:
  - channel: key1
    net: KEY1
    controller_pin: PE2
    connector: J821
    connector_pin: '3'
  - channel: key2
    net: KEY2
    controller_pin: PE3
    connector: J821
    connector_pin: '4'
