  - position: F731
    accepted_v: 357.8
    reason: "The valve pair branch fuse F731 (5x20 mm slow-blow, listed 250 VAC, 353.553 V peak) stands across NEUTRAL and VALVE_COM, which swing the 357.8 V peak of the 253 V rms top of the declared supply span, about 1 % over the cartridge's 250 VAC rating. Owner, 2026-10-29: accepted with the entry fuse, for the reasons that the machine's other factory parts are rated 250 V (DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER item (c2))."
    bounded_by: "The usual margin on 230 V and 240 V mains, and firmware voltage monitoring that may warn near the top of the span; the 253 V top of the declared span is a declared worst case that the mains does not sit at (item (c2) of DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER). Revisited if the declared span is widened above 253 V or monitoring shows the supply above it."
