    accepted_v: 357.8
    reason: "Each of R102 and R104 is one of the two 1 Mohm resistors of a series discharge string across C101 (R101-R102 on DISCH_A, R103-R104 on DISCH_B), standing between the string's midpoint and NEUTRAL, so it carries half of the line-to-neutral swing: 0.5 x 357.8 = 178.9 V peak (126.5 V rms), which is under its 200 V maximum working voltage (1206, UNI-ROYAL C17927). The rule reads the full 357.8 V because the pin-limit record states the midpoint as riding on LINE alone and NEUTRAL is a second host it cannot name, so the figure here is the rule's over-reading, not the real stress. ACCEPTED on 2026-11-05: the owner instructed Claude to enter the acceptance after Claude's recommendation to accept on the ground that the real stress is the half, 178.9 V peak against the 200 V rating; this position was not among the acceptances of 2026-10-29."
    bounded_by: "The real stress, 178.9 V peak, is 21.1 V (10.6 %) under the 200 V rating. Were the other resistor of a string to fail short, the survivor would stand the full 357.8 V for as long as the fault lasts, above its 200 V working voltage; that fault leaves the second string discharging C101, and a string's current is only 253 V / 2 Mohm = 0.13 mA, far below any fuse (circuit-proof.md, discharge conductor row)."
    accepted_by: "David Baker (owner), entered by Claude on the owner's written instruction"
    accepted_on: "2026-11-05"
  - position: R706
    accepted_v: 357.8
    reason: "R706 (100 ohm, 2512, 200 V maximum working voltage, UNI-ROYAL C35218) is the unfitted snubber resistor of the coffee pump triac, in series with C701 (100 nF X2) from PUMP_C_MT2 to NEUTRAL; it is not fitted (owner decision of 2026-10-29, item (d) of DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER), so it carries no stress on the board as built, and the derating rule has no handling for a position that is not fitted and reads it as if present. The rule reads the full 357.8 V across it because the pin-limit record declares the snubber midpoint PUMP_C_SNUB as a mains domain of its own, not riding on the triac's net. If fitted, the steady stress is the capacitor's 7.95 mA at 50 Hz across 100 ohm: 0.8 V rms (1.1 V peak) and 6.3 mW; the stress that exceeds 200 V is the turn-on pulse, up to the 357.8 V crest, 3.6 A and 6.4 mJ with a 10 us time constant, which the maker's sheet states no pulse limit for (open-items.md row M15). ACCEPTED on 2026-11-05: the owner instructed Claude to enter the acceptance on the ground that the part stays unfitted (item (d) of DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER); it is not accepted as a stress on a fitted part, and fitting it is revisited at the bring-up measurement."
    bounded_by: "Not fitted, so nothing stands the stress: bring-up measurement of the turn-off voltage at TP702 and TP712 decides whether either snubber is fitted (open-items.md rows M15 and M16, item (d) of DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER). Fitting the part without a published pulse rating for it is revisited at that measurement; the pulse is a 10 us event of 6.4 mJ."
    accepted_by: "David Baker (owner), entered by Claude on the owner's written instruction"
    accepted_on: "2026-11-05"
