    reason: "The hot water valve relay K741 (Hongfa HF32FA-G, contacts 10 A 250 VAC, 353.553 V peak) switches the valve's live lead against a 357.8 V peak, the 253 V rms top of the declared supply span, about 1 % over the contacts' 250 VAC maximum switching voltage. Owner, 2026-10-29: accepted, the machine's other factory parts are rated 250 V (DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER item (c))."
    bounded_by: "The usual margin on 230 V and 240 V mains, and firmware voltage monitoring that may warn near the top of the span; the overshoot is about 1 % (357.8 V against 353.553 V peak). Item (c) of DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER. Revisited if the declared span is widened above 253 V or monitoring shows the supply above it."
    accepted_by: "David Baker (owner), entered by Claude on the owner's written instruction"
    accepted_on: "2026-11-05"
  - position: R102
    accepted_v: 357.8
    reason: "Each of R102 and R104 is one of the two 1 Mohm resistors of a series discharge string across C101 (R101-R102 on DISCH_A, R103-R104 on DISCH_B), standing between the string's midpoint and NEUTRAL, so it carries half of the line-to-neutral swing: 0.5 x 357.8 = 178.9 V peak (126.5 V rms), which is under its 200 V maximum working voltage (1206, UNI-ROYAL C17927). The rule reads the full 357.8 V because the pin-limit record states the midpoint as riding on LINE alone and NEUTRAL is a second host it cannot name, so the figure here is the rule's over-reading, not the real stress. ACCEPTED on 2026-11-05: the owner instructed Claude to enter the acceptance after Claude's recommendation to accept on the ground that the real stress is the half, 178.9 V peak against the 200 V rating; this position was not among the acceptances of 2026-10-29."
    bounded_by: "The real stress, 178.9 V peak, is 21.1 V (10.6 %) under the 200 V rating. Were the other resistor of a string to fail short, the survivor would stand the full 357.8 V for as long as the fault lasts, above its 200 V working voltage; that fault leaves the second string discharging C101, and a string's current is only 253 V / 2 Mohm = 0.13 mA, far below any fuse (circuit-proof.md, discharge conductor row)."
    accepted_by: "David Baker (owner), entered by Claude on the owner's written instruction"
    accepted_on: "2026-11-05"
