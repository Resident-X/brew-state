    reason: "The steam pump branch fuse F711 (5x20 mm slow-blow, listed 250 VAC, 353.553 V peak) stands across PUMP_S_MT2 and STEAMPUMP, which swing the 357.8 V peak of the 253 V rms top of the declared supply span, about 1 % over the cartridge's 250 VAC rating. Owner, 2026-10-29: accepted with the entry fuse, for the reasons that the machine's other factory parts are rated 250 V (DEC-MAIN-BOARD-RESIDUAL-RISKS-ACCEPTED-BY-OWNER item (c2))."
