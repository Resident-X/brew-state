nets:
  "NTC_COF_SENS": {scope: local, pins: ["J501.1", "R501.2", "D501.1", "R502.1"]}
  "GND": {scope: power, pins: ["J501.2", "D501.2", "C501.2", "D502.1", "J502.2", "D503.2", "C502.2", "D504.1", "J503.2", "D505.2", "C503.2", "D506.1"]}
  "+3V3A": {scope: power, pins: ["R501.1", "D502.2", "R503.1", "D504.2", "R505.1", "D506.2"]}
  "NTC_COF": {scope: global, pins: ["R502.2", "C501.1", "D502.3", "TP501.1"]}
  "NTC_STM_SENS": {scope: local, pins: ["J502.1", "R503.2", "D503.1", "R504.1"]}
  "NTC_STM": {scope: global, pins: ["R504.2", "C502.1", "D504.3", "TP502.1"]}
  "NTC_WAND_SENS": {scope: local, pins: ["J503.1", "R505.2", "D505.1", "R506.1"]}
  "NTC_WAND": {scope: global, pins: ["R506.2", "C503.1", "D506.3", "TP503.1"]}
