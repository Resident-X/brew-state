custom_symbols: []
custom_footprints: []
power_flags: []
notes: "Signal flows left to right: header (left) -> divider node -> series resistor -> filter node -> converter pin label. +3V3A at the top, GND at the bottom. Each header pin 1 is the square pad; the wand header is fitted rotated 180 degrees on the board (placement only, no electrical difference). The three channels are identical; draw them as three stacked identical cells. BAT54S symbol Diode:BAT54S pins: 1=A (to GND), 2=K (to +3V3A), 3=COM (to the converter pin node)."
