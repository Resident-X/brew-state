  "KNOB_HOT": {"scope": "global", "pins": ["J861.1", "R861.1", "C861.1", "TP861.1"]}
  "KNOB_STEAM": {"scope": "global", "pins": ["J861.3", "R862.1", "C862.1", "TP862.1"]}
  "TANK_LEVEL": {"scope": "global", "pins": ["J862.2", "R863.1", "C863.1", "TP863.1"]}
  "+3V3": {"scope": "power", "pins": ["R861.2", "R862.2", "R863.2"]}
  "GND": {"scope": "power", "pins": ["J861.2", "J861.4", "J862.1", "C861.2", "C862.2", "C863.2"]}
no_connect: []
custom_symbols: []
custom_footprints:
  - {"name": "REED_PADS_P20.00mm", "from": "docs/sunbeam-em7000/controller-board-division.md, The tank reed (pads 20.0 mm apart along Y) and connector-pinouts.md (leads 20 mm apart, through holes)", "detail": "2 plated through-hole pads, pad 1 at (0,0) and pad 2 at (0,20.0); drill 1.0 mm, pad 2.0 mm round (the element's lead diameter is unmeasured: the owner reads it; open item)."}
power_flags: []
notes: "KNOB header (J861): pin 1 hot-water switch lead (red) = KNOB_HOT, pin 2 its other lead to GND, pin 3 steam switch lead (red) = KNOB_STEAM, pin 4 its other lead to GND; a contact has no polarity (connector-pinouts.md), so either lead may be the grounded one. Pin 1 is the contact nearest the right edge of the board. Reed (J862): two through-hole pads 20.0 mm apart, hand-fitted; pad 2 = TANK_LEVEL, pad 1 = GND. 10 k to +3V3 and 100 nF to ground on each line. The mains-presence inputs are not drawn."
