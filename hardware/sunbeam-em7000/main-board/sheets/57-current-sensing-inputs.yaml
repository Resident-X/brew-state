notes: "Two identical cells, signal left to right: header -> TVS -> divider -> series R -> filter -> label. R572 and R576 are drawn with the value text DNP and marked do-not-populate: they are the burden positions parallel to the bottom resistor. A current-output sensor is served by fitting a burden there, replacing the top resistor with a zero-ohm link and removing the bottom resistor; the values wait for the sensor, which the records leave to the owner."
