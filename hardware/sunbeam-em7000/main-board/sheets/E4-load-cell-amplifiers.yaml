notes: |
  Drawing: two identical blocks, weight channel 1 above channel 2. In each: the load-cell header on the left (pins E+, E-, A-, A+, SHIELD labelled), the filter R/R/C to its right, the amplifier in the middle with +5V on VSUP and AVDD (tied, 10 uF below), +3V3 on DVDD (0.1 uF), the labels WT1_DATA (DOUT) and WT1_CLK (PD_SCK) leaving to the right. Unused inputs and strap pins to GND: VFB, XI, RATE, INB+, INB- (draw a small GND symbol at each and a text 'channel B, on-chip oscillator and 10 SPS rate unused'). BASE and XO carry no-connect flags.
  Supply arrangement: the analog supply and the bridge excitation are the +5V rail (E+ is the +5V net at the header, E- is GND); the on-chip regulator (BASE, VFB) is not used, so VSUP joins AVDD (Avia V2.0 Power Supply Options: VSUP to AVDD or DVDD, whichever is higher) and VFB goes to ground. The digital supply DVDD is +3V3, the controller's supply, so DOUT swings 0-3.3 V and goes to the controller pin with no level shifter and PD_SCK is driven from a 3.3 V pin.
  Header pin order (E+, E-, A-, A+, SHIELD) follows the maker's reference board order (E+, E-, S-, S+) with a shield pin added; the records give the way count (five) and not the order, so it is drawn here and logged as an open item.
  Rate: RATE is tied low (10 SPS); the controller has no pin for it.
