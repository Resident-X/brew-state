  - {"name": "RELAY_HF32FA-G_1H_TYPE1_THT", "from": "Hongfa HF32FA-G datasheet 2026 Rev 1.00, page 90 'Outline dimensions, wiring diagram and PC board layout', 1 Form A & Type 1, bottom view (read 2026-10-29)", "detail": "body 17.6 x 10.1 mm, 12.7 mm high, pins 3.6 mm below the board; 4 pads: coil A1 at (0,0) and A2 at (0,7.6) (holes 1.0 mm), contact 13 at (15.24,0.625) and 14 at (15.24,6.975) (holes 1.3 mm), the contact pair 6.35 mm apart and centred on the coil pair; coil column left in the bottom view (the division record's floorplan draws the coil end at the right and the contact end at the left of the component face, so mirror about the vertical axis when placing). Dimensions read off the sheet's drawing; tolerance +/-0.1 mm."}
power_flags: []
notes: "Each relay has its contact between the valve's tab net and VALVE_COM; VALVE_COM runs to the relay-side clip of the shared valve fuse F731, whose other clip is NEUTRAL: the valve's live lead arrives on LINE1 by the retained harness wire, so the contact opens the return. Coil side: +5V -> coil -> AO3400A drain; 1N4148WS across the coil (cathode on +5V); gate from VALVE_2W_DRV (PD4) / VALVE_3W_DRV (PD5) through 100 ohm, 100 k to ground. Draw K731 above K741. Contacts are mains (draw them to the left, with the barrier line between contact and coil sides)."
