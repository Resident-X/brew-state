sheet: "Supply voltage and current measurement"
function: "One isolated two-channel delta-sigma converter reads the mains voltage through a three-resistor divider (channel 0) and the supply current through the neutral shunt (channel 1) and hands both to the controller over the shared SPI2 bus."
parts:
  # ---- the isolating converter and its clock --------------------------------------------------
  - {ref: U601, lib_id: AMC131M02, value: "AMC131M02", rating: "reinforced isolation VIORM 1700 V pk, VIOTM 7070 V pk, creepage and clearance 8.0 mm min (SBASA56 6.5); DVDD 3.0-5.5 V", footprint: AMC131M02_SOIC-20W_DFM0020A, mpn: "AMC131M02DFMR", maker: "Texas Instruments", lcsc: C31423783, class: extended, hand: false, function: "isolated 2-channel 24-bit delta-sigma ADC with integrated isolated supply; pins 1-10 are the mains-referenced side, pins 11-20 the low-voltage side", mains: true, sim_exclude: true}
  - {ref: Y601, lib_id: "Oscillator:ASE-xxxMHz", value: "8.000MHz", rating: "2.97-3.63 V supply range, 3.3 V LVCMOS, +/-25 ppm, 45-55 % duty, VOH 90 % Vdd, -40..85 degC (SiTime SiT8008B Rev 1.08)", footprint: "Oscillator:Oscillator_SMD_Abracon_ASE-4Pin_3.2x2.5mm", mpn: "SiT8008BI-22-33E-8.000000", maker: "SiTime", lcsc: C819601, class: extended, hand: false, function: "continuous LVCMOS clock the AMC131M02 requires at CLKIN (it has no oscillator of its own); 8.000 MHz with NDIV = 2 gives a 4.000 MHz modulator clock (DCDC_FREQ 0000b)", mains: false, sim_exclude: true}
  # ---- channel 0: mains voltage divider and its filter --------------------------------------
  - {ref: R601, lib_id: Device:R, value: "300k", rating: "1% 100ppm 2512 1W 200V working, 400V overload", footprint: "Resistor_SMD:R_2512_6332Metric", mpn: "FRC2512F3003TS", maker: "FOJAN", lcsc: C2960835, class: extended, hand: false, function: "divider element 1 of 3 from LINE", mains: true, sim_exclude: false}
  - {ref: R602, lib_id: Device:R, value: "300k", rating: "1% 100ppm 2512 1W 200V working, 400V overload", footprint: "Resistor_SMD:R_2512_6332Metric", mpn: "FRC2512F3003TS", maker: "FOJAN", lcsc: C2960835, class: extended, hand: false, function: "divider element 2 of 3", mains: true, sim_exclude: false}
  - {ref: R603, lib_id: Device:R, value: "300k", rating: "1% 100ppm 2512 1W 200V working, 400V overload", footprint: "Resistor_SMD:R_2512_6332Metric", mpn: "FRC2512F3003TS", maker: "FOJAN", lcsc: C2960835, class: extended, hand: false, function: "divider element 3 of 3", mains: true, sim_exclude: false}
  - {ref: R604, lib_id: Device:R, value: "750", rating: "1% 100ppm 0603 100mW", footprint: "Resistor_SMD:R_0603_1608Metric", mpn: "0603WAF7500T5E", maker: "UNI-ROYAL", lcsc: C23241, class: preferred, hand: false, function: "divider low leg to NEUTRAL; sets +/-0.30 V at the converter at 253 V rms", mains: true, sim_exclude: false}
  - {ref: R605, lib_id: Device:R, value: "49.9", rating: "1% 100ppm 0603 100mW", footprint: "Resistor_SMD:R_0603_1608Metric", mpn: "0603WAF499JT5E", maker: "UNI-ROYAL", lcsc: C23185, class: basic, hand: false, function: "channel 0 anti-alias filter, positive leg (SBASA56 Fig. 9-1)", mains: true, sim_exclude: false}
  - {ref: R606, lib_id: Device:R, value: "49.9", rating: "1% 100ppm 0603 100mW", footprint: "Resistor_SMD:R_0603_1608Metric", mpn: "0603WAF499JT5E", maker: "UNI-ROYAL", lcsc: C23185, class: basic, hand: false, function: "channel 0 anti-alias filter, negative leg to NEUTRAL", mains: true, sim_exclude: false}
  - {ref: C601, lib_id: Device:C, value: "4.7n", rating: "C0G 50V 10% 0805", footprint: "Capacitor_SMD:C_0805_2012Metric", mpn: "C0805N472K050T", maker: "IHHEC (Holy Stone)", lcsc: C105936, class: extended, hand: false, function: "channel 0 anti-alias capacitor across AIN0P/AIN0N; C0G because SBASA56 9.4.1 asks for C0G on the analog inputs", mains: true, sim_exclude: false}
  # ---- channel 1: neutral shunt sense and its filter ------------------------------------------
