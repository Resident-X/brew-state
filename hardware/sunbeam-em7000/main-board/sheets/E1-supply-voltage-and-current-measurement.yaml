custom_footprints:
  - name: AMC131M02_SOIC-20W_DFM0020A
    from: "Texas Instruments SBASA56 package option addendum, drawing DFM0020A (4225640/A 01/2020), Example Board Layout"
    detail: "20 SMD pads 2.1 x 0.6 mm, pitch 1.27 mm, two rows of 10 with 9.7 mm between pad-row centrelines (pads 1-10 left, 11-20 right, numbered as the package, pin 1 top-left); pad rows are 7.6 mm apart edge to edge, so the on-board pad-to-pad gap under the package is 7.6 mm (the package's own pin-to-pin creepage is 8.0 mm min). Stock Package_SO:SOIC-20W_7.5x12.8mm_P1.27mm has rows 9.3 mm apart (7.25 mm edge gap) and is not used because it shortens the gap further. Courtyard 10.6 x 12.9 mm body outline 10.63 x 12.93 typ; the barrier slot and the board-edge distances are the layout leaf's."
power_flags: [AMC_DCDC_HGND, AMC_HLDO_IN]   # nets whose only power pin is an input of U601 and whose driver is inside the part (the isolated supply is made inside U601); +3V3, GND and NEUTRAL are driven by their owners' sheets
notes: |
  Drawing: signal flow left to right. Mains-referenced circuits on the left half of the sheet, the barrier part U601 in the middle with pins 1-10 on its left, pins 11-20 on its right, low-voltage circuits on the right. Left to right on the left: LINE -> R601 -> R602 -> R603 -> VMEAS_DIV (-> R604 down to NEUTRAL) -> R605 -> AIN0P; NEUTRAL <- R606 <- AIN0N; C601 across AIN0P/AIN0N; SHUNT_SENSE_IN -> R607 -> AIN1P, SHUNT_SENSE_NEUTRAL -> R608 -> AIN1N, C602 across them. Supply decoupling of the four high-side pins sits left of U601. Put the text "channel 0: supply voltage, gain 1" and "channel 1: supply current, gain 32" beside the two filters.
  The high-side ground HGND is NEUTRAL (the neutral pour); SBASA56 9.3 wants HGND taken from the shunt terminal on the AIN0N side by its own trace, the layout leaf does that at the pour. NEUTRAL is a global label, not a power symbol (it is a mains net owned by the entry sheet).
  Channel assignment: channel 0 carries the mains voltage (gain 1 or 2), channel 1 the shunt (gain 32). SBASA56 Table 5-1 note 3 says channel 0 is the more precise; the record declares no accuracy for either, so the assignment is the brief's.
  Barrier: U601 is a mains-to-low-voltage barrier the signed separation basis does not list; its creepage (8.0 mm) is shorter than the basis's 10.0 mm. See the verdicts and open items. The footprint's gap under the body is 7.6 mm. Nothing is relaxed here.
  The two 33 ohm resistors on SCLK/DIN, the CS and DOUT series resistors and the 100 kohm pull-ups follow SBASA56 9.4.2 ("terminate long digital input lines with resistors") and Fig. 9-8.
  Conversion pins PB1 and PA1 stay free: this converter's digital link replaces the division record's analogue VM_C and I_C signals (the division records this as a consequence).
  Consequence for the division's VMEAS block: the divider is three 2512 resistors (a failed one must not leave another over its 200 V working figure), not two, so the block of 37.5 x 5.0 mm (an estimate, A29) is too small: see the open items.
