notes: "Signal flows left to right: controller nets (GAUGE_RST, GAUGE_STEP1, GAUGE_DIR1, GAUGE_STEP2, GAUGE_DIR2) -> 1 k series -> buffer input (10 k to ground) -> buffer output -> 100 ohm -> SP2. Unused buffer inputs A5-A7 and both output enables to ground; Y5-Y7 unconnected. SP2 (J791) pin map from connector-pinouts.md, contact 1 nearest the top edge of the board: 1 +5V_GAUGE (through JP791), 2 GND, 3 RST, 4 FA (STEP1), 5 DIRA (DIR1), 6 WAT cathode (LOWWATER_CATHODE, driven on the panel sheet), 7 anode rail (ANODE_RAIL, gated on the panel sheet), 8 DIRB (DIR2), 9 FB (STEP2). Mating housing: JST PH 9-way (family inferred in the record; a test fit settles it)."
