notes: "CON2 (J821) pin map from connector-pinouts.md, contact 1 nearest the bottom edge of the board: 1 buzzer drive side (BUZZER_P, +5V through 100 ohm), 2 buzzer return (BUZZER_N, switched to ground), 3 PWR (KEY1), 4 MAN (KEY2), 5 ONE (KEY3), 6 TWO (KEY4), 7 anode rail (ANODE_RAIL), 8 PRG (KEY5), 9 GND. KEY1..KEY5 follow the record's table order PWR, MAN, ONE, TWO, PRG. Anode rail: ANODE_GATE (PB5) -> R821 -> Q821 (AO3400A) pulls the gate of Q822 (AO3401A, source on +5V) low through two 22 k pull-ups; Q822 drain -> ANODE_SW (TP821) -> JP821 -> ANODE_RAIL, 22 k bleed to ground. Key lines: 10 k to +3V3, read as inputs, sunk by the controller (open-drain) to light an indicator; configure KEY pins with internal pulls off. Low-water: LOWWATER_K (PE0) -> R829 -> Q824, drain = LOWWATER_CATHODE (SP2.6, on the gauge sheet). Buzzer: BUZZER (PE1) -> R826 -> Q823; D821 across the buzzer (cathode on BUZZER_P)."
