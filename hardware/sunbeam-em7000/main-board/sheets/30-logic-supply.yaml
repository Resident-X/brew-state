nets:
  "LINE": {scope: global, pins: [JP303.1, RT301.1]}
  "LINE_MOD": {scope: local, pins: [JP303.2, RT301.2, U301.1]}
  "NEUTRAL": {scope: global, pins: [U301.2]}
  "GND": {scope: power, pins: [U301.3, C301.2, C302.2, C303.2, U302.2, C304.2, C305.2]}
  "+5V_MOD": {scope: power, pins: [U301.4, C301.1, C302.1, TP301.1, JP301.1]}
  "+5V": {scope: power, pins: [JP301.2, C303.1, U302.1]}
  "USB_VBUS_F": {scope: global, pins: [JP301.3]}
  "+3V3_REG": {scope: power, pins: [U302.3, C304.1, C305.1, TP302.1, JP302.1]}
  "+3V3": {scope: power, pins: [JP302.2, FB301.1]}
  "+3V3A_FB": {scope: local, pins: [FB301.2, TP303.1, R301.1]}
  "+3V3A": {scope: power, pins: [R301.2]}
