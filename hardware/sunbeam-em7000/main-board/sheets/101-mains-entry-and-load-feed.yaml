sheet: "Mains entry and load feed"
function: "Lands the retained mains harness on seven board tabs and the heater return landing, fuses and clamps the live entry, suppresses and discharges across it, and carries the neutral return through the current-sense shunt."
# Signal/current flow, left to right: plug-side tabs (LINE_IN, NEUTRAL_IN) -> fuse F101 -> first-power link JP101 -> LINE
#   (varistor RV101, X2 capacitor C101 and discharge resistors R101-R104 across LINE/NEUTRAL; LINE continues to the interlock sheet,
#   whose contact returns as LINE1 to tab 1). Neutral: tab 3 (NEUTRAL_IN) -> shunt R105 -> NEUTRAL. Everything on this sheet is mains copper.
