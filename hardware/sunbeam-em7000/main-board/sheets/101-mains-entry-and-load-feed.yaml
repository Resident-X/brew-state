notes: |
  Placement and drawing notes. (1) The whole sheet is mains: draw it as the left, mains-referenced region of the board with the plug-side tabs at the left edge and signal flow left to right: J102 (LINE_IN) -> TP101 -> F101 -> TP102 -> JP101 -> LINE bus; the LINE bus carries RV101, C101, the R101-R102 / R103-R104 discharge strings (drawn as two parallel strings across C101, each of two resistors in series, DISCH_A and DISCH_B between the pair) and goes off-sheet to the interlock sheet (K201 pin 13); LINE1 returns from the interlock sheet to J101 and TP104. Neutral at the bottom: J103 -> TP105 -> R105 (pin 1) -> R105 pin 4 -> NEUTRAL bus (RV101, C101, R102/R104, J110, TP106). R105's sense pins 2 and 3 leave as global labels SHUNT_SENSE_IN and SHUNT_SENSE_NEUTRAL (owner E filters them). (2) J106 to J109 each show the net on the pin (COFVALVE, COFFPUMP, STEAMPUMP, HOTVALVE); no other part of this sheet touches them. (3) Suppression placement: RV101 hard against F101's load-side clip on the LINE copper (the varistor is downstream of the fuse and JP101); C101 beside RV101; the discharge strings R101..R104 directly across C101's two leads, so that the discharge path exists whenever the capacitor is on the board; keep the 4 resistors off the shunt copper. (4) Values are written for SPICE: the resistor value 1Meg is mega (an M alone is milli in SPICE and KiCad's simulator). (5) Tabs 4 and 5 are not fitted on this board (heater leads go to the wall-board joiners). (6) The 6.3 mm blade tab, F101's clips, RV101, C101 and JP101 are through-hole parts the owner hand-fits and leaves off the manufacturer's order (hand: true); the clips are two of C151075 for F101. (7) No choke and no Y capacitor, by the record's decision. (8) TP107 and TP108 are the second pad on NEUTRAL_IN and on NEUTRAL beside R105, so the voltage across the shunt is read apart from the pads TP105 and TP106 that carry the current; drawn under TP105 and TP106 on the same nets. (9) H1 to H4 (lid-screw holes) and FID1 to FID3 (fiducials) are mechanical symbols with in_bom no and on_board yes, drawn in a row at the foot of the sheet; they are on no net and carry the LCSC field none.
