custom_footprints:
  - name: Tab_BZXC_BTC-3-PCB634908T
    from: "Dongguan Bozhong Electrical Co., Ltd drawing of BTC-3-PCB634908T (LCSC C20626104), Rev. A1, 2021-10-12, read 2026-10-29 from the datasheet linked on the part's jlcpcb.com page. The record's own figures: blade B 6.3 +-0.2 mm wide, T 0.8 mm thick (+0/-0.03), blade length A 14.3 +-0.2 mm, mating terminal 250 female T=0.8 (controller-board-division.md, Sources read P15). The drawing also prints D 1.8 +-0.1, E 7.9 +-0.2, F 3.8 +-0.2, G 1.2 +-0.1, C 3.8 +-0.2, W 8.1 +-0.1, J 2.4 +-0.1, H 2.6 +-0.2."
    detail: "One plated pad, number 1. Copper at least 7.0 mm (along the blade's width) by 1.45 mm: the blade's section from connector-pinouts.md (division record assumption A2; the pad is at least the part's own footprint). Hole: one oval plated slot, 4.2 x 1.0 mm provisional = the drawing's leg width C 3.8 +-0.2 and thickness T 0.8 plus 0.2 mm clearance each way; the drawing does not dimension the leg's barbs separately, so confirm the slot against a received part before ordering (open item). The blade stands 9.9 mm clear of the board by the harness record; the drawing gives blade length 14.3 mm, not the stand-off."
  - name: JP101_WireLink_P10mm
    from: "Own design for the first-power link of the board method (bring-up step 3): a pair of through-hole pads taking a wire link in service or a lamp / resistor on first power. Hole 1.7 mm is KiCad's stock SolderWire-1.5sqmm pattern (1.5 mm2 wire); pad gap set to the division record's basic creepage 5.0 mm or more."
    detail: "Two plated holes, drill 1.7 mm, pads round 3.0 mm, pitch 10.0 mm along X (pad edge to pad edge 7.0 mm, at least the basic 5.0 mm across the open link at 253 V rms). Pin 1 = LINE_F side, pin 2 = LINE side. On the mains net class."
  - name: R_WSK2512_4T
    from: "Vishay Dale WSK2512, document number 30108, revision 04-Apr-2022, 'Solder pad dimensions' table for 0.0005 to 0.0049 ohm: a 3.30 mm, b 3.30 mm, c 0.76 mm, d 0.51 mm, e 1.70 mm, l 1.65 mm; body L 6.35 x W 3.18 mm (inch figures converted)."
    detail: "Four pads: 1 = current terminal I1 and 4 = current terminal I2 (the two large pads, 3.30 mm along the body by 3.30 mm across, the gap between them l = 1.65 mm), 2 = sense E1 and 3 = sense E2 (two small pads c 0.76 mm by d 0.51 mm, spacing e 1.70 mm, inside the gap beside the large pads). The placement of the sense pads against the large pads is read from the maker's land-pattern figure when the footprint is drawn (open item): the text of the sheet gives the dimensions, not the sketch's layout. Kelvin rule: each sense pad connects only to the sense nets and to the sensing circuit, never to the current copper beyond its own terminal."
  - name: MountingHole_3.1mm_Lid
    from: "Own design for the machine's four lid-screw points (layout-plan.md BOARD-7: four holes of 3.1 mm, a part-free circle of 3.5 mm radius)."
    detail: "One non-plated hole, drill 3.1 mm, pad number empty, no copper; courtyard 7.0 mm square about the centre. Footprint attributes exclude_from_bom and exclude_from_pos_files."
