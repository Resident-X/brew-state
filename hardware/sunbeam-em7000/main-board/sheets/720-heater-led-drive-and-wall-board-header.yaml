nets:
  "HEAT_C_DRV": {"scope": "global", "pins": ["R761.1", "TP762.1"]}
  "HEAT_C_G": {"scope": "local", "pins": ["R761.2", "Q761.1", "R762.1"]}
  "HEAT_C_LED_K": {"scope": "global", "pins": ["J761.2", "R763.1"]}
  "HEAT_C_SINK": {"scope": "local", "pins": ["R763.2", "Q761.3"]}
  "HEAT_S_DRV": {"scope": "global", "pins": ["R771.1", "TP772.1"]}
  "HEAT_S_G": {"scope": "local", "pins": ["R771.2", "Q771.1", "R772.1"]}
  "HEAT_S_LED_K": {"scope": "global", "pins": ["J761.3", "R773.1"]}
  "HEAT_S_SINK": {"scope": "local", "pins": ["R773.2", "Q771.3"]}
  "+5V_WB": {"scope": "global", "pins": ["JP761.2", "J761.1", "TP761.1"]}
  "+5V": {"scope": "power", "pins": ["JP761.1"]}
  "GND": {"scope": "power", "pins": ["J761.4", "Q761.2", "R762.2", "Q771.2", "R772.2", "R765.2", "R775.2"]}
  "MAINS_PRES_C_J": {"scope": "local", "pins": ["J761.5", "R764.1"]}
  "MAINS_PRES_C": {"scope": "global", "pins": ["R764.2", "R765.1"]}
  "MAINS_PRES_S_J": {"scope": "local", "pins": ["J761.6", "R774.1"]}
  "MAINS_PRES_S": {"scope": "global", "pins": ["R774.2", "R775.1"]}
no_connect:
  - {"pin": "J761.7", "reason": "spare way of the ten-way header (reserved, labelled NC at the pad)"}
  - {"pin": "J761.8", "reason": "spare way of the ten-way header (reserved, labelled NC at the pad)"}
  - {"pin": "J761.9", "reason": "spare way of the ten-way header (reserved, labelled NC at the pad)"}
  - {"pin": "J761.10", "reason": "spare way of the ten-way header (reserved, labelled NC at the pad)"}
custom_symbols: []
custom_footprints: []
power_flags: []
notes: "Header WB_LV10 pinout is fixed in the shared conventions: 1 +5V_WB, 2 HEAT_C_LED_K, 3 HEAT_S_LED_K, 4 GND, 5 MAINS_PRES_C, 6 MAINS_PRES_S (each through a 27 kohm series resistor, R764 and R774, to the controller pin PE15 or PD7, where an 82 kohm pull-down, R765 or R775, to ground holds the pin low with the wall board absent; the header-side nets are MAINS_PRES_C_J and MAINS_PRES_S_J), 7-10 spare. Each LED return runs from its header pin through a 180 ohm resistor (R763, R773) to the AO3400A drain; gate from HEAT_C_DRV (PD2) / HEAT_S_DRV (PD3). +5V reaches the header through JP761, with TP761 on +5V_WB. Draw the header at the right edge of the sheet; no mains on this sheet."
