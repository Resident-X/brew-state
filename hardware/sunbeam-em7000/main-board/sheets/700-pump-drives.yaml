custom_footprints:
  - {"name": "MOC3052SVM_SMD-6", "from": "onsemi MOC3052M/D Rev. 3 (May 2019), case outline PDIP6 8.51x6.35 2.54P CASE 646BY Issue A (15 Jul 2019, the SMT lead-bend package of MOC3052SM, MOC3052SVM and MOC3052SR2VM), recommended mounting footprint", "detail": "6 SMD pads 1.78 mm along the row by 1.52 mm across, pitch 2.54 mm along the row, rows 9.02 mm apart centre to centre (outer edges 10.54 mm, gap between the rows' pad edges 7.49 mm: the maker's recommended footprint); pads 1, 2, 3 down one row and 4, 5, 6 up the other, numbered counter-clockwise seen from above as the package (pin 4 opposite pin 3, pin 6 opposite pin 1); body 8.51 x 6.35 mm (nominal), lead span E1 8.43 to 9.90 mm. The LED side (1, 2) is low voltage and the output side (4, 6) mains; pins 3 and 5 are not connected. Stock Package_DIP:SMDIP-6_W9.53mm has 2.0 x 1.78 pads at rows 9.53 mm apart (outer edges 11.53 mm, inner gap 7.53 mm) and is not the maker's pattern."}
  - {"name": "FUSEHOLDER_5x20_XC_BLX-A", "from": "XC Electronics (ShenZhen), specification XCRD-C Ver.1.1, BLX-A, 2024-07-26, file read 2026-10-29 (LCSC C3131)", "detail": "2 pads for the holder's flat legs 1.5 x 0.35 mm (slot holes 1.8 x 0.6 mm, pad 2.4 x 1.2 mm); body 22 +/-0.5 x 9.5 +/-0.5 mm, 13.5 mm high; fuse 5.2 x 20 mm. The maker's file dimensions the body length (22 mm) and the leg width, not the leg centre pitch: draw the legs 22.0 mm apart (the body length) and let the layout task read the pitch from a sample (open item)."}
power_flags: []
notes: "Mains side is the left of this sheet: tab net -> fuse -> triac MT2; triac MT1 on NEUTRAL (the pump's neutral piece joins the neutral pour on an inner layer: layout). No snubber and no varistor are fitted across the triac or the pump (decided in the division record, The pump drives, and kept by the owner on 2026-10-29), but each triac has an unfitted RC snubber position across MT2 and MT1 (R706 with C701 for the coffee pump, R716 with C711 for the steam pump, an X2-class capacitor and a 2512 resistor, DNP) and a test point on MT2 (TP702, TP712) for the turn-off measurement that decides whether to fit it (bring-up, pump drives); the surge and emission margins stay open (open-items.md). The snubber nets PUMP_C_SNUB and PUMP_S_SNUB are mains class, with the parts' mains flag set. Low-voltage side: +5V -> R703 -> MOC3052M pin 1; pin 2 -> AO3400A drain; gate from PUMP_C_GATE (PA9) through R701 with R702 to ground. Draw coffee above steam, signal left to right: controller pin, gate stage, opto-triac, triac, fuse, tab net on the right. The opto-triac straddles the barrier: pins 1-2 low voltage, 4-6 mains; draw a dashed barrier line through the package. Fuse values: coffee 0.8 A, steam 0.5 A (SETfuse SCT520T0.8A250V / SCT520T0.5A250V)."
