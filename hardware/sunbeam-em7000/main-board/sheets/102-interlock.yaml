sheet: "Interlock"
function: "Closes the live feed to every load only while the controller's proof-of-life output keeps producing edges: a two-channel edge-pumped drive of the relay coil, with test access."
# Signal flow, left to right: POL_OUT (controller) -> pull-downs / buffer U201 -> two identical edge-pump channels A (top) and B (bottom)
#   -> two N-FETs in series (Q201 source to ground, Q202 above it) -> relay coil low end POL_COIL_LO; the coil's high end is +5V. The relay
#   contact (K201 pins 13 and 14) is drawn at the right and belongs to the LINE -> LINE1 feed. Supply +5V at the top, GND at the bottom.
