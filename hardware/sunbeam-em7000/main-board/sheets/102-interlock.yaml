custom_footprints:
  - name: Relay_HF115F-Q_1H_Vertical
    from: "Hongfa HF115F-Q datasheet, 2024 Rev. 1.00, pages 205-206 (https://source.hongfa.com/Uploads/Product/PDF/HF115F-Q_en.pdf), 'PCB Layout (bottom view)' for the 1 Form A, vertical quick-connect type, read 2026-10-29"
    detail: "Bottom view, origin on coil pad A1. Pads: A1 (0, 0) and A2 (0, 7.56) plated holes drill 1.4 mm (the drawing gives 2 x diameter 1.3 +0.1/0; the drill is the upper tolerance end, 1.3 plus 0.1) pad 2.2 mm round; contact pole a = pad number 13 at (32.5, 0) and (37.5, 0); pole b = pad number 14 at (32.5, 7.56) and (37.5, 7.56): four holes drill 1.6 mm (drawing 4 x diameter 1.5 +0.1/0, so 1.6 is the upper end) pad 2.5 mm round; the two pads of one number are one pin (duplicate pad numbers). Pole a is on LINE and pole b on LINE1; the pad gap between the poles is 7.56 - 2.5 = 5.06 mm at least the basic 5.0 mm. The drawing's tolerances for the layout are +-0.1 mm. Body outline 29 +-0.3 x 12.7 +-0.3 mm with the quick-connect tabs reaching 41 mm overall (vertical type), 15.7 mm high, 3.6 mm stand-off pins; body starts 2.5 mm before the coil holes (drawing dimension 2.5). The coil has no marked polarity in the sheet (A1 and A2 are interchangeable)."
power_flags: []
notes: |
  Drawing notes. (1) One function: the interlock. Draw left to right: U201's input net POL_OUT enters at the left with R201 and R202 to ground and TP203; U201's output POL_BUF feeds two identical rows, channel A above and channel B below (coupling capacitor, then the pump node with D201 to ground and D202 to the gate, then the gate with C203, R203 and the FET). R205 and R206 hang from each pump node to ground. (2) The FET stack at the right: Q201 source at GND, Q201 drain = POL_MID = Q202 source, Q202 drain = POL_COIL_LO, which goes to K201's A2. K201's A1 is +5V at the top. The clamp: two parallel branches from POL_COIL_LO up to +5V, each a zener Z (pin 3 cathode to POL_COIL_LO, pin 1 anode) in series with a diode D (pin 1 anode on the zener's anode, pin 3 cathode on +5V). (3) Both channels use the same parts and values; the second channel must not share any part with the first except U201 (the one common element, by the record's design), the coil and the clamp. (4) K201's contact pins 13 (LINE) and 14 (LINE1) are drawn apart from the coil with a dashed barrier line between coil and contact (BARRIER-1: the coil-to-contact barrier is unlisted in the signed basis; its distances are not shown to reach 10.0 mm creepage and 3.0 mm clearance). (5) The relay's coil is low voltage and its contact mains: keep >= 10.0 mm creepage from the coil pads (A1, A2) to the contact pads by the layout, slotting between them as the division record does; the footprint's own coil-to-contact pad distance is 32.5 mm along the body. (6) Values in SPICE form: 5.6Meg is mega. (7) Behaviour with R205/R206 absent is the record's 19-part circuit; see circuit-proof.md row 'Interlock rest states' and open-items.md.
