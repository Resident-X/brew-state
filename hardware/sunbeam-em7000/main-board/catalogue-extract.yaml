# The catalogue extract of the Sunbeam EM7000 main board: one entry for each distinct LCSC
# catalogue number parts-specification.yaml gives a position, 98 numbers, read from JLCPCB's
# parts library on 2026-10-29 (about 14:00 to 14:55 local time) through the search service the
# library's own page uses, https://jlcpcb.com/api/overseas-pcb-order/v1/shoppingCart/smtGood/
# selectSmtComponentList/v2, one keyword search for each number, every number matched exactly.
#
# library_class: the service's component library type, base as basic, expand as extended,
#   and preferred where the service flags the part preferred. It agrees with the catalogue
#   class the schematic sheets carry for every number.
# stock: the service's stock count for the number at the time of reading, as a whole number.
#   C899826 (onsemi MOC3052SVM, positions U701 and U711) was read later the same day,
#   with the same search service and the same exact match, when C8965 (onsemi MOC3052M,
#   through-hole) had shown 0 in this extract's first reading: the extract's entry for C8965
#   is removed since no position uses it now. The MOC3052SR2VM, C899825, tape and reel,
#   showed stock 1383, extended, 0.8058 USD at 1 to 9 on that reading; no position uses it.
# unit_price: US dollars for one unit at the quantity tier of 1 to 9 pieces, the price the
#   service lists for the first tier.
# lifecycle: the library's search record carries no lifecycle field and no maker lifecycle
#   page was read, so every entry states no source publishes one, with the source naming
#   what was looked at. It is not a finding that the part is active.
#
# The 98 positions whose catalogue number is "none" (test points, owner-fitted links,
# hand-fitted wire) have no catalogue entry to read; the check as written looks every
# position's number up, so it does not find "none" here.
