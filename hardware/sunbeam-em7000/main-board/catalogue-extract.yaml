# The catalogue extract of the Sunbeam EM7000 main board: one entry for each distinct LCSC
# catalogue number parts-specification.yaml gives a position, 98 numbers, read from JLCPCB's
# parts library on 2026-10-29 (about 14:00 to 14:55 local time) through the search service the
# library's own page uses, https://jlcpcb.com/api/overseas-pcb-order/v1/shoppingCart/smtGood/
# selectSmtComponentList/v2, one keyword search for each number, every number matched exactly.
#
# library_class: the service's component library type, base as basic, expand as extended,
#   and preferred where the service flags the part preferred. It agrees with the catalogue
#   class the schematic sheets carry for every number.
# stock: the service's stock count for the number at the time of reading, as a whole number.
#   C899826 (onsemi MOC3052SVM, positions U701 and U711) was read later the same day,
#   with the same search service and the same exact match, when C8965 (onsemi MOC3052M,
#   through-hole) had shown 0 in this extract's first reading: the extract's entry for C8965
#   is removed since no position uses it now. The MOC3052SR2VM, C899825, tape and reel,
#   showed stock 1383, extended, 0.8058 USD at 1 to 9 on that reading; no position uses it.
# unit_price: US dollars for one unit at the quantity tier of 1 to 9 pieces, the price the
#   service lists for the first tier.
# comment: one line of plain text for each number, describing the part as the assembler's parts list (BOM) shows it:
#   maker, maker part number and what the part is. It is the only source of the parts list's comment column
#   (production_files.py parts-list --catalogue), so it is one record for the number however many positions use it
#   and however the schematic spells each position's value (a net or role label, a cartridge rating). Not blank,
#   one line, no comma (the parts list is comma-separated).
# C23179 (UNI-ROYAL 0603WAF4700T5E, 470 ohm, positions R607, R608 and R791 to R795) was read on
#   2026-11-06 with the same search service and the same exact match, for the value change that
#   replaced C23138 (330 ohm, R607 and R608) and moved R791 to R795 off C22775; the extract's entry
#   for C23138 is removed since no position uses it now, so the extract still holds 98 numbers.
#   Its entry carries its own lifecycle read_on; the extract's own read_on is unchanged.
# C133937 (TAI-TECH FCM1608KF-601T05, positions F601, F602 and FB301), C2775980 (UNI-ROYAL
#   HP122WF5902T4E, R630 and R631) and C78606 (Nexperia BAT54SW,115, D502, D504, D506, D523, D524,
#   D527 and D528) were read on 2026-11-07 for the stock-driven part changes of that day, from the
#   local copy of JLCPCB's parts library (the database Konnect's library tools read, a file dated
#   2026-10-12, so its stock and price are as of that build) and not through the search service: library_class, stock and unit_price are that copy's figures for the number,
#   the price its single price field gives and not a quantity tier. They replace C141723, C5126066
#   and C47546, and C1591 and C170182 (the two 100 nF line merges onto C14663 and C97946, already in
#   this extract) have no position now, so their entries are removed and the extract holds 96 numbers.
# C7486 (Texas Instruments SN74AHCT1G14DCKR, positions U201 and U203) was read on 2026-11-10 from the same local copy of JLCPCB's parts library as the three numbers above (library_class, stock and unit_price are
#   that copy's figures: Extended, 3178, one price field; LCSC's own listing showed 2360 pieces on 2026-11-09). It replaces C554579 (Nexperia 74AHCT1G17GW, 3 in stock), which has no position now,
#   so its entry is removed and the extract still holds 96 numbers.
# C22962 (UNI-ROYAL 0603WAF2200T5E, 220 ohm, position R545) was read on 2026-11-10 from the same local copy of JLCPCB's parts library (library_class, stock and unit_price are that copy's figures:
#   Basic, 2016616, one price field). It is the series resistor R545 added at FLOW_IN, so the extract now holds 97 numbers.
#   Each of the four entries carries its own lifecycle read_on; the extract's own read_on is unchanged.
# C2971290 (STMicroelectronics T835-800B, positions T701 and T711) was read on 2026-11-13 through JLCPCB's parts search (class expand, so extended; stock 68; 1.2303 USD, the price its first
#   tier lists), for the pump triac change from WeEn BTA204S-600B (C256462, 4745 in stock on 2026-10-29), whose entry is removed since no position uses it now, so the extract still holds 97 numbers.
#   Its entry carries its own lifecycle read_on; the extract's own read_on is unchanged.
# C2976795 (Hongfa HF115F-I/005-1HS3A, K201), C22447834 (SETfuse SCT520PT10A250V, F101) and C86469 (TE Connectivity
#   63849-1, J101, J102, J103, J106 to J110) were read on 2026-11-13 through the same search service and exact match
#   (library class expand, so extended; stock 20, 767 and 204475; the price its first tier lists, 1 to 9 pieces for
#   C2976795, 1 to 49 for C22447834, 1 to 99 for C86469), for the part swaps of that day. They replace C20626104 (tabs)
#   and C22447847 (F101 cartridge for clips), whose entries are removed since no position uses them now, so the
#   extract holds 98 numbers. Each of the three entries carries its own lifecycle read_on; the extract's own read_on is unchanged.
# C151285 (Littelfuse SMCJ400CA, D701 and D711) was read on 2026-11-14 through the same search service and exact match
#   (library class expand, so extended; stock 475; the price its first tier lists, 1 to 9 pieces), for the pump-triac
#   clamps added that day. It replaces C35218 (the unfitted snubber resistors R706 and R716), whose entry is removed
#   since no position uses it now, so the count of numbers is unchanged. Its entry carries its own lifecycle read_on.
# C1523 (FH 0402B102K500NT, 1 nF X7R 50 V 0402, position C606) was read on 2026-11-14 through the same search service and exact match
#   (library class base, so basic; stock 3594365; the price its first tier lists, 1 to 999 pieces), for the move of C606 from 0603 to 0402. It joins the
#   extract and C1588 (position C606 before) stays, since other positions still use it, so the extract holds 99 numbers.
#   Its entry carries its own lifecycle read_on; the extract's own read_on is unchanged.
# C7394034 (UMW SN74LVC1G17DCKR(UMW), position U520) was read on 2026-11-14 through the same search service and exact match
#   (library class expand, so extended; stock 3125; the price its first tier lists, 1 to 99 pieces), for the swap from TI C10425, which
#   had 11 in stock that day (49321 on 2026-10-29), too few for a one-shot order of 5. The record has no field saying whether the part is
#   machine placed; it lists a least patch number of 5. C10425 has no position now, so its entry is removed.
# C492401 (XFCN PZ254V-11-02P, 1x2 2.54 mm header, positions JP302, JP401, JP402 and now J622, J623, J627, J628) was read again on 2026-11-14 through the
#   same search service (extended; stock 774881; 0.019 USD, the price its first tier lists): the four J62x positions were on C2337, a 40-pin strip (BOOMELE
#   2.54-1*40P), a pin count the 1x2 footprint does not take, and move to this 1x2 part. C2337 has no position now, so its entry is removed and
#   the extract holds 98 numbers.
# Every one of the 98 numbers was read again on 2026-11-14 (about 16:09 to 16:12 local time) through the same search service, one
#   keyword search for each number, every number matched exactly: library_class, stock and unit_price are that day's figures (the price the
#   first tier lists, so the entries first read from the local copy of the parts library, C133937, C2775980, C78606, C7486 and C22962, now
#   carry a first-tier price), and every entry's lifecycle read_on and the extract's read_on are that day. No number's class changed.
#   The record's field assemblyComponentFlag is false for every one of the 98 numbers, basic parts included, so it does not say whether a
#   part is machine placed.
# lifecycle: the library's search record carries no lifecycle field and no maker lifecycle
#   page was read, so every entry states no source publishes one, with the source naming
#   what was looked at. It is not a finding that the part is active.
#
# The 98 positions whose catalogue number is "none" (test points, owner-fitted links,
# hand-fitted wire) have no catalogue entry to read; the check as written looks every
# position's number up, so it does not find "none" here.
# The window (max_age_days) is not a claim of freshness: the design is held, and the read that matters is the one made on the order date, which re-reads this extract and re-dates it (SOL-HW-CONTROLLER-BOARDS-ORDERED.C10).
read_on: 2026-11-14
max_age_days: 36500
