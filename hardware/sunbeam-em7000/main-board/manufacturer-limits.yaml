    outer_copper_oz: 1
    limits:
      min_clearance:
        mm: 0.09
        citation:
          section: "Tracks and spacing"
          limit: "Minimum track width and spacing"
          condition: "Multilayer boards, 1 oz"
      min_track_width:
        mm: 0.09
        citation:
          section: "Tracks and spacing"
          limit: "Minimum track width and spacing"
          condition: "Multilayer boards, 1 oz"
      min_through_hole_diameter:
        mm: 0.15
        citation:
          section: "Drills, vias and annular rings"
          limit: "Drill diameter range"
          condition: "2-layer and multilayer boards; holes of 6.3 mm and over are routed from a smaller drill"
      min_hole_to_hole:
        mm: 0.45
        citation:
          section: "Hole-to-hole and clearances to holes and edges"
          limit: "Pad hole to pad hole"
          condition: "Any board"
      min_via_annular_width:
        mm: 0.15
        citation:
          section: "Drills, vias and annular rings"
          limit: "PTH annular ring"
          condition: "Multilayer boards, 1 oz"
      min_via_diameter:
        mm: 0.25
        citation:
          section: "Drills, vias and annular rings"
          limit: "Minimum via hole / via diameter"
          condition: "2-layer and multilayer boards"
      min_hole_clearance:
        mm: 0.28
        citation:
          section: "Hole-to-hole and clearances to holes and edges"
          limit: "Plated hole to track"
          condition: "Any board"
      min_copper_edge_clearance:
        mm: 0.2
        citation:
          section: "Hole-to-hole and clearances to holes and edges"
          limit: "Copper to a routed board edge or routed slot"
          condition: "Board outline routed"
  - copper_layers: 6
