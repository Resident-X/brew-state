# The pin-limit record of the Sunbeam EM7000 main board, read by the pre-order board
# check (pin-limit rule and the derated-voltage rule's net voltages). Every integrated
# circuit and semiconductor the schematic places is listed, found by its LCSC number,
# with the limits of each pin that is connected on a position of the part (the
# controller lists all 100 of its pins). Every limit was read on 2026-10-29 from the
# datasheet named in the entry, at the revision stated there.
#
# What the keys hold. absolute_max_v and absolute_min_v are the datasheet's absolute
# maximum ratings for the pin, in volts against the board ground. The isolated-measurement
# chip's high-side pins ride on HGND, which is mains neutral; their datasheet figures are
# against HGND, so each is written here against board ground at the mains peak, the
# datasheet figure above or below HGND plus or minus 357.8 V (the peak of 253 V rms). A figure a datasheet does not
# state is marked 'not stated' in the comment above the pin, and the number written is
# then the nearest stated figure (a recommended operating limit, a stand-off voltage or
# the supply's own limit), never a guess; the record's form needs a number. The
# recommended operating range of a pin sits in its comment where it differs from the
# absolute maximum. tolerates_driven_unpowered is true only where the datasheet states a
# tolerance for the pin with its part unpowered (or the part has no supply to lose);
# where the datasheet is silent it is false, which the pin-limit rule reads as not
# tolerated.
#
# A domain is a supply the pins hang from; its rail is a net of the design and
# highest_voltage_v the most that net can reach. The rail nets of the three mains
# domains are not yet in the Mains net class: the board's net classes are assigned when
# the layout is drawn, and the mains domains must be on Mains-class nets by then.
domains:
  # the 3.3 V logic rail and +3V3A, which is fed from it; +3V3 3.135 to 3.6 V (circuit-proof.md, rails); +3V3A up to 3.6 V (DS12110 Table 112 VDDA maximum). One domain for both: a pin entry carries one domain for every position of its part
  - name: logic
    rail: +3V3
    highest_voltage_v: 3.6
  # the 5 V rail, 4.75 to 5.25 V (circuit-proof.md, rails; IRM-20 output +/-2.5 % gives 5.125 V, 5.25 V is the brief's rail-high case)
  - name: supply5
    rail: +5V
    highest_voltage_v: 5.25
  # board ground
  - name: ground
    rail: GND
    highest_voltage_v: 0
  # the cable-side USB VBUS ahead of the fuse, 4.75 to 5.25 V (USB 2.0 7.2.1 high-power function limit as circuit-proof.md uses it)
  - name: usb_vbus
    rail: /Controller/USB_VBUS
    highest_voltage_v: 5.25
  # switched-live side of the mains; the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak)
  - name: mains_line
    rail: /LINE
    highest_voltage_v: 357.8
  # the live feed to the supply module after its inrush position; the same mains peak
  - name: mains_line_module
    rail: /Logic supply/LINE_MOD
    highest_voltage_v: 357.8
  # mains neutral; alternates against board ground in the isolated-measurement chip's reference, so the same peak is stated
  - name: mains_neutral
    rail: /NEUTRAL
    highest_voltage_v: 357.8
  # the AMC131M02 analog inputs, which ride on HGND (mains neutral) and so on a Mains-class net: the peak of the mains conductor they ride on, 253 V rms is 357.8 V peak (separation-basis.yaml working_voltage), as a Mains-class rail must state. The input range above and below HGND (SBASA56 6.1, HGND - 1.6 V to HGND + 2.7 V) is in the pins' limits, written against board ground at that peak
  - name: amc_inputs
    rail: /Supply voltage and current measurement/AMC_AIN0P
    highest_voltage_v: 357.8
  # the AMC131M02 DCDC_CAP node, the output of its internal primary-side regulator; only a capacitor and a test point are on it. The datasheet states no operating voltage for the node, so its absolute maximum (6.1, DCDC_CAP to DGND 3.5 V) stands as the ceiling
  - name: amc_dcdc_cap
    rail: /Supply voltage and current measurement/AMC_DCDC_CAP
    highest_voltage_v: 3.5
  # the AMC131M02 high side, which rides on HGND (mains neutral) and so on Mains-class nets: the peak of the mains conductor it rides on, 357.8 V, as a Mains-class rail must state. The high-side regulator output is 2.6 to 3.2 V above HGND (SBASA56 6.5 table, HLDO_OUT); that offset is in the pins' limits, written against board ground at that peak (357.8 + 3.2 = 361.0 V)
  - name: amc_high_side
    rail: /Supply voltage and current measurement/AMC_HLDO_OUT
    highest_voltage_v: 357.8
  # the live between the plug-in tab and the board's input fuse F101, and the fuse's far side LINE_F up to the first-power link JP101: F101 joins LINE_IN and LINE_F, so one rail covers both; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_line_input
    rail: /Mains entry and load feed/LINE_F
    highest_voltage_v: 357.8
  # the live after the interlock relay K201 contact (pin 14), out to the load tab J101: the open contact leaves the whole mains peak across it; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_line_switched
    rail: /LINE1
    highest_voltage_v: 357.8
  # the coffee pump's live tab J107 and the pump fuse F701 pin 1, with PUMP_C_MT2 (triac T701 main terminal 2) on F701's far side: F701 joins COFFPUMP and PUMP_C_MT2, so one rail covers both; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_coffee_pump
    rail: /COFFPUMP
    highest_voltage_v: 357.8
  # the steam pump's live tab J108 and the pump fuse F711 pin 1, with PUMP_S_MT2 (triac T711 main terminal 2) on F711's far side: F711 joins STEAMPUMP and PUMP_S_MT2, so one rail covers both; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_steam_pump
    rail: /STEAMPUMP
    highest_voltage_v: 357.8
  # the coffee valve live tab J106 and valve relay K731 contact pin 13 (pin 14 is VALVE_COM); switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_coffee_valve
    rail: /COFVALVE
    highest_voltage_v: 357.8
  # the hot-water valve live tab J109 and valve relay K741 contact pin 13 (pin 14 is VALVE_COM); switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_hot_valve
    rail: /HOTVALVE
    highest_voltage_v: 357.8
  # the midpoint of the discharge pair R101 and R102 (1 Mohm each) between LINE and NEUTRAL: half the line-to-neutral peak in the circuit, but a Mains-class rail states the peak; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_discharge_a
    rail: /Mains entry and load feed/DISCH_A
    highest_voltage_v: 357.8
  # the midpoint of the discharge pair R103 and R104 (1 Mohm each) between LINE and NEUTRAL: half the line-to-neutral peak in the circuit, but a Mains-class rail states the peak; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_discharge_b
    rail: /Mains entry and load feed/DISCH_B
    highest_voltage_v: 357.8
  # the coffee triac's gate network between R705 and R704: the gate returns to MT2 and carries only the optocoupler's gate current, but the net is Mains class and states the peak; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_pump_c_gate
    rail: /Pump drives/PUMP_C_GATE_R
    highest_voltage_v: 357.8
  # the steam triac's gate network between R715 and R714: the gate returns to MT2 and carries only the optocoupler's gate current, but the net is Mains class and states the peak; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_pump_s_gate
    rail: /Pump drives/PUMP_S_GATE_R
    highest_voltage_v: 357.8
  # the coffee triac's snubber midpoint between R706 and the X2 capacitor C701 to NEUTRAL; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_pump_c_snubber
    rail: /Pump drives/PUMP_C_SNUB
    highest_voltage_v: 357.8
  # the steam triac's snubber midpoint between R716 and the X2 capacitor C711 to NEUTRAL; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_pump_s_snubber
    rail: /Pump drives/PUMP_S_SNUB
    highest_voltage_v: 357.8
  # the first node of the 3 x 300 kohm line divider R601 to R603: two thirds of the line-to-neutral peak in the circuit (238.5 V), but a Mains-class rail states the peak; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_divider_n1
    rail: /Supply voltage and current measurement/VMEAS_N1
    highest_voltage_v: 357.8
  # the second node of the 3 x 300 kohm line divider: one third of the line-to-neutral peak in the circuit (119.4 V), but a Mains-class rail states the peak; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_divider_n2
    rail: /Supply voltage and current measurement/VMEAS_N2
    highest_voltage_v: 357.8
  # the tap of the line divider, 750 ohm (R604) above NEUTRAL, 0.30 V peak in the circuit (357.8 x 750 / 900750), but a Mains-class rail states the peak; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_divider_tap
    rail: /Supply voltage and current measurement/VMEAS_DIV
    highest_voltage_v: 357.8
  # the midpoint of the two 60.4 kohm feed resistors R630 and R631 from LINE to the detector LED; switched or unswitched mains conductor: the peak of 253 V rms, the top of the declared span (separation-basis.yaml working_voltage: 253 V rms, 358 V peak); a Mains-class rail states at least that peak
  - name: mains_zero_cross
    rail: /Zero-crossing detector/ZC_N1
    highest_voltage_v: 357.8
  # the gauge harness supply, +5V through the link JP791 (sheet 730: pin 1 of SP2 is +5V_GAUGE through JP791); the +5V figure
  - name: gauge_supply
    rail: /+5V_GAUGE
    highest_voltage_v: 5.25
  # the operator panel's gated indicator rail: Q822 (AO3401A) source on +5V, drain to ANODE_SW, then JP821 to ANODE_RAIL with a 22 kohm bleed to ground (sheet 740 notes); the +5V figure
  - name: anode_rail
    rail: /ANODE_RAIL
    highest_voltage_v: 5.25
  # the USB cable shield at J402 pin 4, tied to GND only through R403 (1 Mohm) and C419 (4.7 nF) in parallel with no direct tie (sheet 31). The shield belongs to the cable and the host, whose only supply on the cable is VBUS, so the working voltage is taken as the VBUS figure; the 8 kV human-body discharge the sheet notes leaves roughly 255 V for a moment on the 4.7 nF, which is a transient the 1 kV capacitor rating covers and not a working voltage
  - name: usb_shield
    rail: /Controller/USB_SHIELD
    highest_voltage_v: 5.25
  # output of the 5 V gauge buffer U791 through its 100 ohm series resistor R793 to SP2 pin 5 (sheet 730: the buffer lifts the 3.3 V gauge lines to 5 V logic); the +5V figure
  - name: gauge_dir1_out
    rail: /Gauge drive/GAUGE_DIR1_B
    highest_voltage_v: 5.25
  # output of the 5 V gauge buffer U791 through its 100 ohm series resistor R795 to SP2 pin 8; the +5V figure
  - name: gauge_dir2_out
    rail: /Gauge drive/GAUGE_DIR2_B
    highest_voltage_v: 5.25
  # output of the 5 V gauge buffer U791 through its 100 ohm series resistor R791 to SP2 pin 3, with a 10 kohm pull-down R806; the +5V figure
  - name: gauge_reset_out
    rail: /Gauge drive/GAUGE_RST_B
    highest_voltage_v: 5.25
  # output of the 5 V gauge buffer U791 through its 100 ohm series resistor R792 to SP2 pin 4; the +5V figure
  - name: gauge_step1_out
    rail: /Gauge drive/GAUGE_STEP1_B
    highest_voltage_v: 5.25
  # output of the 5 V gauge buffer U791 through its 100 ohm series resistor R794 to SP2 pin 9; the +5V figure
  - name: gauge_step2_out
    rail: /Gauge drive/GAUGE_STEP2_B
    highest_voltage_v: 5.25
  # the coffee heater's wall-board opto-triac LED cathode at WB_LV10 pin 2, returned through R763 (180 ohm) to the AO3400A drain; the LED anode is on +5V_WB, which is +5V through JP761 (sheet 720 notes), so the cathode cannot rise above the +5V figure
  - name: heater_led_c_cathode
    rail: /HEAT_C_LED_K
    highest_voltage_v: 5.25
  # the steam heater's wall-board opto-triac LED cathode at WB_LV10 pin 3, returned through R773 (180 ohm) to the AO3400A drain; the LED anode is on +5V_WB, so the cathode cannot rise above the +5V figure
  - name: heater_led_s_cathode
    rail: /HEAT_S_LED_K
    highest_voltage_v: 5.25
  # the wall board's coffee mains-present line at WB_LV10 pin 5, through the 27 kohm series resistor R764 to the controller pin PE15 (sheet 720 notes); the only supply on the ten-way header is +5V_WB, so the line cannot rise above the +5V figure
  - name: mains_present_c_header
    rail: /Heater LED drive and wall board header/MAINS_PRES_C_J
    highest_voltage_v: 5.25
  # the wall board's steam mains-present line at WB_LV10 pin 6, through the 27 kohm series resistor R774 to the controller pin PD7 (sheet 720 notes); the only supply on the ten-way header is +5V_WB, so the line cannot rise above the +5V figure
  - name: mains_present_s_header
    rail: /Heater LED drive and wall board header/MAINS_PRES_S_J
    highest_voltage_v: 5.25
  # load cell 1 signal minus at J630 pin 3 ahead of its 100 ohm series resistor R671 to the amplifier input; the bridge is excited from +5V (sheet E4: E+ is the +5V net, E- is GND), so its outputs lie between ground and the +5V figure
  - name: load_cell_1_sense_n
    rail: /Load-cell amplifiers/WT1_SN_RAW
    highest_voltage_v: 5.25
  # load cell 1 signal plus at J630 pin 4 ahead of its 100 ohm series resistor R670; the bridge is excited from +5V (sheet E4), so the +5V figure
  - name: load_cell_1_sense_p
    rail: /Load-cell amplifiers/WT1_SP_RAW
    highest_voltage_v: 5.25
  # load cell 2 signal minus at J635 pin 3 ahead of its 100 ohm series resistor R676; the bridge is excited from +5V (sheet E4), so the +5V figure
  - name: load_cell_2_sense_n
    rail: /Load-cell amplifiers/WT2_SN_RAW
    highest_voltage_v: 5.25
  # load cell 2 signal plus at J635 pin 4 ahead of its 100 ohm series resistor R675; the bridge is excited from +5V (sheet E4), so the +5V figure
  - name: load_cell_2_sense_p
    rail: /Load-cell amplifiers/WT2_SP_RAW
    highest_voltage_v: 5.25
  # the 8 MHz oscillator Y601 output, 3.3 V LVCMOS from its +3V3 supply (sheet E1), through R609 (33 ohm) to the isolated measurement chip's clock input; it cannot rise above its supply, the +3V3 figure
  - name: amc_clock_out
    rail: /Supply voltage and current measurement/AMC_CLK_OUT
    highest_voltage_v: 3.6
parts:
  # U401 controller: U401
  # All 100 pins of the LQFP100 are listed, the 22 left unconnected included. The datasheet states no tolerance for a pin driven while VDD is absent: Table 109's formula Min(VDD,...)+4.0 gives 4.0 V at VDD = 0, with the pull resistors off, and no leakage figure at VDD = 0 is stated (Table 147 gives leakage only for VIN up to Max(VDDXXX) and up to 5.5 V above it). tolerates_driven_unpowered is therefore false for every pin: not stated.
  # Injection (Table 110, Table 146): -5 mA / 0 mA on FT_xxx, TT_xx, NRST and BOOT0 pins except PA4 and PA5, which take 0 / 0; the sum limit is +/-25 mA. Positive injection is not possible on these pins.
  # The 'recommended operating' figures sit in each pin's comment; the record's absolute_max_v and absolute_min_v carry the Table 109 absolute maximum.
  - lcsc: C114409
    source:
      document: "STM32H742xI/G STM32H743xI/G datasheet DS12110"
      revision: "Rev 11 (January 2026)"
      section: "7.2 Absolute maximum ratings, Table 109 Voltage characteristics; 7.3.1 General operating conditions, Table 112; 7.3.15 I/O port characteristics, Table 147; Table 9 pin definition and Table 8 legend for the class of each pin"
      read_on: 2026-10-29
    pins:
      # PE2 (KEY1), Table 9 class FT_h; FT_xxx row of Table 109: VSS-0.3 to Min(Min(VDD,VDDA,VDD33USB,VBAT)+4.0, 6) V, which is 6.0 V for every supply of 2.0 V and above (formula applies to the supplies of the pin's I/O structure; the internal pull resistors must be off above 4 V); recommended maximum Min(VDD,VDDA,VDD33USB)+3.6 V and below 5.5 V (Table 112 note 2), -0.3 V minimum
      - pin: "1"
        domain: logic
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # PE3 (KEY2), Table 9 class FT_h; FT_xxx row of Table 109: VSS-0.3 to Min(Min(VDD,VDDA,VDD33USB,VBAT)+4.0, 6) V, which is 6.0 V for every supply of 2.0 V and above (formula applies to the supplies of the pin's I/O structure; the internal pull resistors must be off above 4 V); recommended maximum Min(VDD,VDDA,VDD33USB)+3.6 V and below 5.5 V (Table 112 note 2), -0.3 V minimum
      - pin: "2"
        domain: logic
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # PE4 (KEY3), Table 9 class FT_h; FT_xxx row of Table 109: VSS-0.3 to Min(Min(VDD,VDDA,VDD33USB,VBAT)+4.0, 6) V, which is 6.0 V for every supply of 2.0 V and above (formula applies to the supplies of the pin's I/O structure; the internal pull resistors must be off above 4 V); recommended maximum Min(VDD,VDDA,VDD33USB)+3.6 V and below 5.5 V (Table 112 note 2), -0.3 V minimum
      - pin: "3"
        domain: logic
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # PE5 (KEY4), Table 9 class FT_h; FT_xxx row of Table 109: VSS-0.3 to Min(Min(VDD,VDDA,VDD33USB,VBAT)+4.0, 6) V, which is 6.0 V for every supply of 2.0 V and above (formula applies to the supplies of the pin's I/O structure; the internal pull resistors must be off above 4 V); recommended maximum Min(VDD,VDDA,VDD33USB)+3.6 V and below 5.5 V (Table 112 note 2), -0.3 V minimum
      - pin: "4"
        domain: logic
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # PE6 (KEY5), Table 9 class FT_h; FT_xxx row of Table 109: VSS-0.3 to Min(Min(VDD,VDDA,VDD33USB,VBAT)+4.0, 6) V, which is 6.0 V for every supply of 2.0 V and above (formula applies to the supplies of the pin's I/O structure; the internal pull resistors must be off above 4 V); recommended maximum Min(VDD,VDDA,VDD33USB)+3.6 V and below 5.5 V (Table 112 note 2), -0.3 V minimum
      - pin: "5"
        domain: logic
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # VBAT (+3V3), Table 9 class S; Table 109 external main supply VDDX-VSS -0.3 to 4.0 V; recommended VDD 1.62 to 3.6 V, VDDA 1.62 to 3.6 V with the ADC used (Table 112)
      - pin: "6"
        domain: logic
        absolute_max_v: 4
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # PC13 (no connect), Table 9 class FT; FT_xxx row of Table 109: VSS-0.3 to Min(Min(VDD,VDDA,VDD33USB,VBAT)+4.0, 6) V, which is 6.0 V for every supply of 2.0 V and above (formula applies to the supplies of the pin's I/O structure; the internal pull resistors must be off above 4 V); recommended maximum Min(VDD,VDDA,VDD33USB)+3.6 V and below 5.5 V (Table 112 note 2), -0.3 V minimum
      - pin: "7"
        domain: logic
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # PC14 (LSE_IN), Table 9 class FT; FT_xxx row of Table 109: VSS-0.3 to Min(Min(VDD,VDDA,VDD33USB,VBAT)+4.0, 6) V, which is 6.0 V for every supply of 2.0 V and above (formula applies to the supplies of the pin's I/O structure; the internal pull resistors must be off above 4 V); recommended maximum Min(VDD,VDDA,VDD33USB)+3.6 V and below 5.5 V (Table 112 note 2), -0.3 V minimum
      - pin: "8"
        domain: logic
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # PC15 (LSE_OUT), Table 9 class FT; FT_xxx row of Table 109: VSS-0.3 to Min(Min(VDD,VDDA,VDD33USB,VBAT)+4.0, 6) V, which is 6.0 V for every supply of 2.0 V and above (formula applies to the supplies of the pin's I/O structure; the internal pull resistors must be off above 4 V); recommended maximum Min(VDD,VDDA,VDD33USB)+3.6 V and below 5.5 V (Table 112 note 2), -0.3 V minimum
      - pin: "9"
        domain: logic
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # VSS (GND), Table 9 class S; VDDX-VSS supply row, Table 109
      - pin: "10"
        domain: ground
        absolute_max_v: 4
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # VDD (+3V3), Table 9 class S; Table 109 external main supply VDDX-VSS -0.3 to 4.0 V; recommended VDD 1.62 to 3.6 V, VDDA 1.62 to 3.6 V with the ADC used (Table 112)
      - pin: "11"
        domain: logic
        absolute_max_v: 4
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # PH0 (HSE_IN), Table 9 class FT; FT_xxx row of Table 109: VSS-0.3 to Min(Min(VDD,VDDA,VDD33USB,VBAT)+4.0, 6) V, which is 6.0 V for every supply of 2.0 V and above (formula applies to the supplies of the pin's I/O structure; the internal pull resistors must be off above 4 V); recommended maximum Min(VDD,VDDA,VDD33USB)+3.6 V and below 5.5 V (Table 112 note 2), -0.3 V minimum
      - pin: "12"
        domain: logic
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # PH1 (HSE_OUT), Table 9 class FT; FT_xxx row of Table 109: VSS-0.3 to Min(Min(VDD,VDDA,VDD33USB,VBAT)+4.0, 6) V, which is 6.0 V for every supply of 2.0 V and above (formula applies to the supplies of the pin's I/O structure; the internal pull resistors must be off above 4 V); recommended maximum Min(VDD,VDDA,VDD33USB)+3.6 V and below 5.5 V (Table 112 note 2), -0.3 V minimum
      - pin: "13"
        domain: logic
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # NRST (NRST), Table 9 class RST; 'any other pins' row of Table 109 (NRST is neither FT nor TT nor BOOT0)
      - pin: "14"
        domain: logic
        absolute_max_v: 4
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # PC0 (NTC_COF), Table 9 class FT_a; an FT_a pin used by the ADC is held to 4.0 V (Table 109 note 5)
      - pin: "15"
        domain: logic
        absolute_max_v: 4
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      # PC1 (NTC_STM), Table 9 class FT_ha; an FT_a pin used by the ADC is held to 4.0 V (Table 109 note 5)
