  custom_footprints:
  - name: TS1187A_5.1x5.1mm_SMD
    from: XKB Connection TS-1187A-X-X-X drawing, rev A0 (LCSC C318884 maker sheet), PCB LAYOUT top view
    detail: four SMD pads 1.0 mm (X) by 0.75 mm (Y); pad centres X = +/-3.0 mm, Y = +/-1.875 mm (outer span 7.0 x 4.5 mm, inner span 5.0 x 3.0 mm); the two upper pads (A and B) are both numbered 1 and the two lower pads (C
      and D) are both numbered 2, since the drawing joins A to B and C to D inside; body 5.1 x 5.1 mm
  power_flags:
  - +3V3
  - +3V3A
  - DBG_VTREF
  drawing_notes: 'Signal flow left to right: supply (left) -> U401 -> signals (right, global labels with the dictionary names). Positive supply at the top, ground at the bottom.

    U401: draw all 100 pins; pins listed under no_connect carry a no-connect flag. Supply pins: five VDD (11, 27, 50, 75, 100) each with its own 100 nF placed at the pin, five VSS (10, 26, 49, 74, 99), VSSA (19) to GND, VDDA
    (21) on +3V3A, VREF+ (20) on VREF+, VBAT (6) on +3V3, VCAP (48 and 73) joined on net VCAP with one 2.2 uF at each pin.

    Crystals: Y401 with C414 and C415 close to PH0/PH1; Y402 with C416 and C417 close to PC14/PC15. Probe point TP406 is on HSE_IN, a probe point on the crystal''s own node: no pin is free for a buffered clock (PA8 is MCO1
    and is the steam pump gate; PC9 is MCO2 and is a load-cell clock), so the clock is observed at TP406 with a 10 Mohm 10 pF-class probe and the loading noted in the bring-up record.

    Reset: SW401 and C418 from NRST to GND; no external pull-up (the part has one, 30 to 50 kohm, inside the 10 kohm to 1 Mohm the supervisor''s sheet asks of its RESET pull-up); J401.10 on NRST. U402 (TLV803S supervisor)
    on +3V3 with C422 at its VDD pin: its open-drain RESET (pin 2) is on NRST, wire-ORed with the button, the probe and the controller''s own reset, and holds the controller in reset while +3V3 is under 2.87 to 2.99 V and
    for 120 to 280 ms after it recovers (arithmetic in circuit-proof.md, Reset supervisor).

    Debug: J401 is the Cortex Debug 10-pin header: 1 VTref (through R402, TP405 and JP402), 2 SWDIO, 3 GND, 4 SWCLK, 5 GND, 6 SWO, 7 key, 8 not connected, 9 GND detect, 10 reset.

    Boot: R401 holds BOOT0 low; JP401 fitted puts BOOT0 on +3V3 for the ST bootloader. Fit the jumper only with the board in a state where the pump gates are held off by their own pull-downs (see the hold-off facts).

    USB: J402 is a five-way header for the panel cable to a side-of-machine USB connector (bought separately, not on the board): 1 USB_DP, 2 USB_DM, 3 GND, 4 cable shield (to GND through R403 and C419 in parallel), 5 USB_VBUS.
    D401 (USBLC6-2SC6) sits at J402 with D+ and D- passing through its pins 1/6 and 3/4, pin 2 on GND and pin 5 on USB_VBUS. USB_DP goes to PA12 and USB_DM to PA11 and to nothing else. No series resistor and no D+ pull-up:
    the controller''s full-speed driver manages its output impedance and has the embedded D+ pull-up (AN4879 Rev 10, 3.1 and Table 4). The shield is not tied straight to GND: R403 (1 MOhm) and C419 (4.7 nF, 1 kV) in parallel
    join it to GND, so a panel connector shell touching earthed machine metal cannot tie earth to controller ground, while the capacitor still returns discharge current (AN4879 states no shield arrangement in its text). PA9
    stays the coffee pump gate: the controller''s VBUS sense function is not used, so VBUS reaches the board but not PA9; firmware runs the port with VBUS detection off and the B-session-valid override on (RM0433 Rev 8, 57.14.1).

    Cable power (bench work with mains disconnected): USB_VBUS -> D402 (SMF6.0A, to GND) and F401 (500 mA hold PTC) -> USB_VBUS_F (TP413), which goes straight to pin 3 of the selector JP301 (Logic supply sheet) and nowhere
    else. There is no series blocking element: JP301 is the only thing that stops the cable and the module feeding each other. Its one shorting jumper joins +5V to the module (pins 1-2, as drawn) or to USB_VBUS_F (pins 2-3),
    never both, and no jumper position joins them. On the module pins the cable side is open at JP301 and the cable carries only the clamp''s and the controller''s own small currents; on the cable pins the module output is
    open. The board never sources current into the cable.

    PB3 is wired to SWO (net SWO): it leaves the allocation record''s free list.

    '
