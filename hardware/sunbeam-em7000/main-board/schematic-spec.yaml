  no_connect: []
  custom_symbols: []
  custom_footprints: []
  power_flags:
  - +5V
  - LINE_MOD
  - NEUTRAL
  drawing_notes: 'Left to right: LINE/NEUTRAL (mains, left) -> JP303 wire link (RT301, the inrush thermistor, is the not-fitted alternative across the same two nets: LINE_MOD joins them to U301 pin 1) -> U301 -> +5V_MOD (TP301,
    C301, C302) -> JP301 (pins 1-2 as drawn; pins 2-3 takes USB_VBUS_F from the Controller sheet instead) -> +5V -> U302 -> +3V3_REG (TP302, C304, C305) -> JP302 -> +3V3 -> FB301 -> +3V3A_FB (TP303) -> R301 -> +3V3A.

    Mains side is the left of U301 only (pins 1 and 2) with the link JP303 and the thermistor position RT301 in the live feed (net LINE_MOD between them and U301 pin 1 is mains class, like LINE); everything right of U301 is
    low voltage and the module is the barrier (4.2 kVac in-out, maker sheet). U301, JP303 and RT301 are hand-fitted through-hole; RT301 is not fitted (DNP). JP303 and RT301 are alternatives: the link is fitted in service,
    and the thermistor replaces it only if the entry fuse opens at cold start (bring-up step 8). JP303 uses the first-power link''s footprint (JP101_WireLink_P10mm, 7.0 mm between pad edges); both positions carry the mains
    net class and sit on the mains side of the board with U301''s input pins.

    Power flags: +5V (beyond JP301 it has power_in pins only) needs a PWR_FLAG; LINE_MOD and NEUTRAL each carry one on U301''s AC input pin (1 and 2), because the mains source is off the sheet and the module''s inputs are
    power_in pins; +5V_MOD and +3V3_REG each have a power_out pin (U301.4, U302.3). +3V3 and +3V3A are flagged on the Controller sheet.

    +3V3 and +5V load-side nets are seen by every other sheet by name. +3V3A is a rail made here; the Controller sheet uses it for VDDA and for VREF+ (through R302).

    JP301 is a selector, not a link: its one shorting jumper joins +5V to +5V_MOD (module, as drawn) or to USB_VBUS_F (cable power, the fuse output USB_VBUS_F from the Controller sheet), and a shorting jumper cannot span both
    pairs, so no jumper position joins the module''s output to the cable''s supply: on pins 1-2 the cable side (pin 3) is open and nothing is driven into the cable, on pins 2-3 the module output (pin 1) is open. The selector
    alone stops the two feeding each other, and the board never sources current into the cable. The first-power position is the same selector: a 22 ohm 5 W resistor''s leads soldered to pins 1 and 2 limit the +5V rail''s draw
    while loads are checked (arithmetic in the proof record).

    U302 is an LT1963AEST-3.3#TRPBF (Analog Devices, 20 V input), replacing the AP7361C-33ER-13 (6.5 V absolute maximum input) because the module''s over-voltage trip reaches 6.75 V and a clamp cannot hold a 4 A source (circuit-proof.md,
    3.3 V regulator rows). Its pins are 1 IN, 2 GND (tab), 3 OUT, so the tab and pad 2 are ground: the layout joins the tab to the ground pour with at least 100 mm2 of top copper (the proof''s 56 degC/W). The output stage
    is two 22 uF X5R capacitors, C304 and C305.

    '
