    of one number are one pin (duplicate pad numbers). Pole a is on LINE and pole b on LINE1; the pad gap between the poles is 7.56 - 2.5 = 5.06 mm at least the basic 5.0 mm. The drawing''s tolerances for the layout are +-0.1
