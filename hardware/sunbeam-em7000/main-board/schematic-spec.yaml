board: Sunbeam EM7000 main controller board
schema: 'Each sheet is one hierarchical sheet. parts lists every symbol; nets lists every net with every REF.PIN it joins (REF.PIN is the part reference and the symbol pin NUMBER). scope: local = a label on that sheet only;
  global = a global label carrying the net name across sheets; power = a power symbol / power-flagged net of that name on every sheet it reaches. custom_symbols / custom_footprints list what has no stock KiCad 10 equivalent.'
generated_by: spec-tools/build_spec.py from sheets/*.yaml; do not edit by hand
drawing:
  tool_notes:
  - 'Root sheet: one sheet symbol per entry of sheets, in order, named exactly as the sheet name, with no sheet pins; every connection between sheets is a global label (or a power symbol for scope: power).'
  - Every net carries the designer name given here; no tool-named net may remain. A pin in no_connect gets a no-connect flag.
  - 'Symbol fields on every part: Reference, Value (value), Footprint (footprint), LCSC (lcsc), Rating (rating), plus Manufacturer and MPN (maker, mpn). A part with sim_exclude: true is excluded from simulation in its symbol
    properties.'
  - 'Flow left to right on each sheet: inputs and supply at the left, outputs at the right; positive supply toward the top, ground toward the bottom. Mains-referenced circuits stand at the left of a sheet and are drawn apart
    from low-voltage circuits (the barrier part between them); text clear of text and symbols; connector symbols show pin numbers and the net name beside every pin.'
  - 'Place every part named in a sheet: parts with dnp: true are placed and marked Do not populate; parts with hand: true are through-hole parts the owner fits by hand and are placed like any other.'
  - 'Project text variables: MAINS = present. Net class Mains: the nets listed in mains_class_nets.'
  - 'ERC: a net with only power_in pins needs a PWR_FLAG (the sheet''s power_flags list names them); no warning may be waived or excluded.'
