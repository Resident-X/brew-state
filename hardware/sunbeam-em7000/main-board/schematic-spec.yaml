  drawing_notes: 'Drawing: two identical blocks one above the other, probe 1 on top. In each block: the probe header on the right, the converter in the middle, the SPI lines entering from the left (SPI2_SCK, SPI2_MOSI, SPI2_MISO
    global labels shared by both blocks, its own chip-select label). The reference resistor sits above the converter between BIAS/REFIN+ and REFIN-/ISENSOR/FORCE+; the filter capacitor sits across RTDIN+ and RTDIN- beside
    the header; the configuration parts sit between the converter and the probe header with a legend table: 4-wire = R642 fitted (FORCE2 to GND), R643 not fitted, J622 and J623 open; 3-wire = R642 removed, R643 fitted (FORCE2
    to FORCE+), the FORCE-/RTDIN- link (J623) fitted, the FORCE+/RTDIN+ link (J622) open; 2-wire = R642 fitted, R643 not fitted, both links J622 and J623 fitted. (Probe 2: R647, R648, J627, J628.) R643 and R648 carry the field
    dnp: true.

    Header pin use (PT1_H and PT2_H, first pin at the lower end as the division draws them): 1 = FORCE+ (RTD top drive lead), 2 = RTDIN+ (top sense lead), 3 = RTDIN- (bottom sense lead), 4 = FORCE- (bottom drive lead). The
    pin order is not stated in the records; it is drawn here and logged as an open item.

    Both converters share SCK, MOSI and MISO with the supply-measurement converter on the sheet "Supply voltage and current measurement": mode 1 (clock idle low, data latched on the falling edge), at most 5 MHz (MAX31865 SCLK
    limit); each chip select has its own 100 kohm pull-up so no slave drives MISO while the controller is in reset.

    The net names *_FORCEN: MAX31865''s FORCE- pin is typed power_out in the stock symbol because it is switched to GND2 inside the part; it is the probe''s current return, not a rail.

    '
