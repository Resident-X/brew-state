  from: 'Vishay Dale WSK2512, document number 30108, revision 04-Apr-2022, ''Solder pad dimensions'' table for 0.0005 to 0.0049 ohm: a 3.30 mm, b 3.30 mm, c 0.76 mm, d 0.51 mm, e 1.70 mm, l 1.65 mm; body L 6.35 x W 3.18 mm
    (inch figures converted).'
  detail: 'Four pads: 1 = current terminal I1 and 4 = current terminal I2 (the two large pads, 3.30 mm along the body by 3.30 mm across, the gap between them l = 1.65 mm), 2 = sense E1 and 3 = sense E2 (two small pads c 0.76
    mm by d 0.51 mm, spacing e 1.70 mm, inside the gap beside the large pads). The placement of the sense pads against the large pads is read from the maker''s land-pattern figure when the footprint is drawn (open item): the
    text of the sheet gives the dimensions, not the sketch''s layout. Kelvin rule: each sense pad connects only to the sense nets and to the sensing circuit, never to the current copper beyond its own terminal.'
