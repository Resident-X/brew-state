  custom_footprints:
  - name: Tab_BZXC_BTC-3-PCB634908T
    from: 'Dongguan Bozhong Electrical Co., Ltd drawing of BTC-3-PCB634908T (LCSC C20626104), Rev. A1, 2021-10-12, read 2026-10-29 from the datasheet linked on the part''s jlcpcb.com page. The record''s own figures: blade
      B 6.3 +-0.2 mm wide, T 0.8 mm thick (+0/-0.03), blade length A 14.3 +-0.2 mm, mating terminal 250 female T=0.8 (controller-board-division.md, Sources read P15). The drawing also prints D 1.8 +-0.1, E 7.9 +-0.2, F 3.8
      +-0.2, G 1.2 +-0.1, C 3.8 +-0.2, W 8.1 +-0.1, J 2.4 +-0.1, H 2.6 +-0.2.'
    detail: 'One plated pad, number 1. Copper at least 7.0 mm (along the blade''s width) by 1.45 mm: the blade''s section from connector-pinouts.md (division record assumption A2; the pad is at least the part''s own footprint).
      Hole: one oval plated slot, 4.2 x 1.0 mm provisional = the drawing''s leg width C 3.8 +-0.2 and thickness T 0.8 plus 0.2 mm clearance each way; the drawing does not dimension the leg''s barbs separately, so confirm the
      slot against a received part before ordering (open item). The blade stands 9.9 mm clear of the board by the harness record; the drawing gives blade length 14.3 mm, not the stand-off.'
  - name: JP101_WireLink_P10mm
    from: 'Own design for the first-power link of the board method (bring-up step 3): a pair of through-hole pads taking a wire link in service or a lamp / resistor on first power. Hole 1.7 mm is KiCad''s stock SolderWire-1.5sqmm
      pattern (1.5 mm2 wire); pad gap set to the division record''s basic creepage 5.0 mm or more.'
    detail: Two plated holes, drill 1.7 mm, pads round 3.0 mm, pitch 10.0 mm along X (pad edge to pad edge 7.0 mm, at least the basic 5.0 mm across the open link at 253 V rms). Pin 1 = LINE_F side, pin 2 = LINE side. On the
      mains net class.
  - name: R_WSK2512_4T
    from: 'Vishay Dale WSK2512, document number 30108, revision 04-Apr-2022, ''Solder pad dimensions'' table for 0.0005 to 0.0049 ohm: a 3.30 mm, b 3.30 mm, c 0.76 mm, d 0.51 mm, e 1.70 mm, l 1.65 mm; body L 6.35 x W 3.18
      mm (inch figures converted).'
    detail: 'Four pads: 1 = current terminal I1 and 4 = current terminal I2 (the two large pads, 3.30 mm along the body by 3.30 mm across, the gap between them l = 1.65 mm), 2 = sense E1 and 3 = sense E2 (two small pads c
      0.76 mm by d 0.51 mm, spacing e 1.70 mm, inside the gap beside the large pads). The placement of the sense pads against the large pads is read from the maker''s land-pattern figure when the footprint is drawn (open item):
      the text of the sheet gives the dimensions, not the sketch''s layout. Kelvin rule: each sense pad connects only to the sense nets and to the sensing circuit, never to the current copper beyond its own terminal.'
  - name: MountingHole_3.1mm_Lid
    from: 'Own design for the machine''s four lid-screw points (layout-plan.md BOARD-7: four holes of 3.1 mm, a part-free circle of 3.5 mm radius).'
    detail: One non-plated hole, drill 3.1 mm, pad number empty, no copper; courtyard 7.0 mm square about the centre. Footprint attributes exclude_from_bom and exclude_from_pos_files.
  power_flags: []
  drawing_notes: 'Placement and drawing notes. (1) The whole sheet is mains: draw it as the left, mains-referenced region of the board with the plug-side tabs at the left edge and signal flow left to right: J102 (LINE_IN)
    -> TP101 -> F101 -> TP102 -> JP101 -> LINE bus; the LINE bus carries RV101, C101, the R101-R102 / R103-R104 discharge strings (drawn as two parallel strings across C101, each of two resistors in series, DISCH_A and DISCH_B
    between the pair) and goes off-sheet to the interlock sheet (K201 pin 13); LINE1 returns from the interlock sheet to J101 and TP104. Neutral at the bottom: J103 -> TP105 -> R105 (pin 1) -> R105 pin 4 -> NEUTRAL bus (RV101,
    C101, R102/R104, J110, TP106). R105''s sense pins 2 and 3 leave as global labels SHUNT_SENSE_IN and SHUNT_SENSE_NEUTRAL (owner E filters them). (2) J106 to J109 each show the net on the pin (COFVALVE, COFFPUMP, STEAMPUMP,
    HOTVALVE); no other part of this sheet touches them. (3) Suppression placement: RV101 hard against F101''s load-side clip on the LINE copper (the varistor is downstream of the fuse and JP101); C101 beside RV101; the discharge
    strings R101..R104 directly across C101''s two leads, so that the discharge path exists whenever the capacitor is on the board; keep the 4 resistors off the shunt copper. (4) Values are written for SPICE: the resistor
    value 1Meg is mega (an M alone is milli in SPICE and KiCad''s simulator). (5) Tabs 4 and 5 are not fitted on this board (heater leads go to the wall-board joiners). (6) The 6.3 mm blade tab, F101''s clips, RV101, C101
    and JP101 are through-hole parts the owner hand-fits and leaves off the manufacturer''s order (hand: true); the clips are two of C151075 for F101. (7) No choke and no Y capacitor, by the record''s decision. (8) TP107 and
    TP108 are the second pad on NEUTRAL_IN and on NEUTRAL beside R105, so the voltage across the shunt is read apart from the pads TP105 and TP106 that carry the current; drawn under TP105 and TP106 on the same nets. (9) H1
    to H4 (lid-screw holes) and FID1 to FID3 (fiducials) are mechanical symbols with in_bom no and on_board yes, drawn in a row at the foot of the sheet; they are on no net and carry the LCSC field none.

    '
