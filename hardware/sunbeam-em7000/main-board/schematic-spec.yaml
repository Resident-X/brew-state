  detail: '6 SMD pads 1.78 mm along the row by 1.52 mm across, pitch 2.54 mm along the row, rows 9.02 mm apart centre to centre (outer edges 10.54 mm, gap between the rows'' pad edges 7.49 mm: the maker''s recommended footprint);
    pads 1, 2, 3 down one row and 4, 5, 6 up the other, numbered counter-clockwise seen from above as the package (pin 4 opposite pin 3, pin 6 opposite pin 1); body 8.51 x 6.35 mm (nominal), lead span E1 8.43 to 9.90 mm. The
    LED side (1, 2) is low voltage and the output side (4, 6) mains; pins 3 and 5 are not connected. Stock Package_DIP:SMDIP-6_W9.53mm has 2.0 x 1.78 pads at rows 9.53 mm apart (outer edges 11.53 mm, inner gap 7.53 mm) and
    is not the maker''s pattern.'
  sheet: Pump drives
- name: FUSEHOLDER_5x20_XC_BLX-A
  from: XC Electronics (ShenZhen), specification XCRD-C Ver.1.1, BLX-A, 2024-07-26, file read 2026-10-29 (LCSC C3131)
  detail: '2 pads for the holder''s flat legs 1.5 x 0.35 mm (slot holes 1.8 x 0.6 mm, pad 2.4 x 1.2 mm); body 22 +/-0.5 x 9.5 +/-0.5 mm, 13.5 mm high; fuse 5.2 x 20 mm. The maker''s file dimensions the body length (22 mm)
    and the leg width, not the leg centre pitch: draw the legs 22.0 mm apart (the body length) and let the layout task read the pitch from a sample (open item).'
  sheet: Pump drives
- name: RELAY_HF32FA-G_1H_TYPE1_THT
  from: Hongfa HF32FA-G datasheet 2026 Rev 1.00, page 90 'Outline dimensions, wiring diagram and PC board layout', 1 Form A & Type 1, bottom view (read 2026-10-29)
  detail: 'body 17.6 x 10.1 mm, 12.7 mm high, pins 3.6 mm below the board; 4 pads: coil A1 at (0,0) and A2 at (0,7.6) (holes 1.0 mm), contact 13 at (15.24,0.625) and 14 at (15.24,6.975) (holes 1.3 mm), the contact pair 6.35
    mm apart and centred on the coil pair; coil column left in the bottom view (the division record''s floorplan draws the coil end at the right and the contact end at the left of the component face, so mirror about the vertical
    axis when placing). Dimensions read off the sheet''s drawing; tolerance +/-0.1 mm.'
  sheet: Valve drives
- name: REED_PADS_P20.00mm
  from: docs/sunbeam-em7000/controller-board-division.md, The tank reed (pads 20.0 mm apart along Y) and connector-pinouts.md (leads 20 mm apart, through holes)
  detail: '2 plated through-hole pads, pad 1 at (0,0) and pad 2 at (0,20.0); drill 1.0 mm, pad 2.0 mm round (the element''s lead diameter is unmeasured: the owner reads it; open item).'
  sheet: Knob, tank-level and reed inputs
