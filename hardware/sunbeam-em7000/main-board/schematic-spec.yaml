    pump, R716 with C711 for the steam pump, an X2-class capacitor and a 2512 resistor, DNP) and a test point on MT2 (TP702, TP712) for the turn-off measurement that decides whether to fit it (bring-up, pump drives); the surge
    and emission margins stay open (open-items.md). The snubber nets PUMP_C_SNUB and PUMP_S_SNUB are mains class, with the parts'' mains flag set. Low-voltage side: +5V -> R703 -> MOC3052M pin 1; pin 2 -> AO3400A drain; gate
    from PUMP_C_GATE (PA9) through R701 with R702 to ground. Draw coffee above steam, signal left to right: controller pin, gate stage, opto-triac, triac, fuse, tab net on the right. The opto-triac straddles the barrier: pins
    1-2 low voltage, 4-6 mains; draw a dashed barrier line through the package. Fuse values: coffee 0.8 A, steam 0.5 A (SETfuse SCT520T0.8A250V / SCT520T0.5A250V).'
