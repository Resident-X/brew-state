    the gate of Q822 (AO3401A, source on +5V) low through two 22 k pull-ups; Q822 drain -> ANODE_SW (TP821) -> JP821 -> ANODE_RAIL, 22 k bleed to ground. Key lines: 10 k to +3V3, read as inputs, sunk by the controller (open-drain)
