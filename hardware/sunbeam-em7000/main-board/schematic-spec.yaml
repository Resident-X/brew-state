hold_off:
  record: circuit-proof.md section Hold-off; proof-rows A and D tables
  loads:
  - load: interlock relay coil K201
    held_by: R201 and R202 (buffer input pulled low, no edge), the 56.5 ms gate decay, R205 and R206
    states: reset, 3V3 absent, 5 V absent, rising, falling, output high or low or floating
  - load: coffee heater (wall board opto-triac LED)
    held_by: R762 gate pull-down on Q761; the LED has no supply when +5V_WB or its return conductor is open
    states: reset, 3V3 absent, 5 V absent, cable conductor open, header unplugged
  - load: steam heater (wall board opto-triac LED)
    held_by: R772 on Q771
    states: as above
  - load: coffee pump
    held_by: R702 on Q701 (opto-triac LED stage); pump live feed through LINE1 behind the interlock contact
    states: reset, 3V3 absent, 5 V absent; no cable between stage and the opto-triac
  - load: steam pump
    held_by: R712 on Q711
    states: as above
  - load: two-way coffee valve
    held_by: R732 on Q731 (coil driver); relay contact open when the coil is unenergised
    states: as above
  - load: three-way valve
    held_by: R742 on Q741
    states: as above
  not_covered_by_the_stage: A heater return conductor shorted to ground, or the two heater return conductors shorted together, lights an LED the stage did not command; the interlock contact and the supply-current check are
    the cover (open-items.md).
derating_policy_proposed:
  status: 'adopted by the owner on 2026-10-29 ("agree, proceed") and relaxed the same day ("adopt"): integrated circuit voltage share 1, junction cap 110 degC, relay contact current share 1; the record is derating-policy.yaml
    and the factors below are the starting proposal, not the policy'
  source: NASA Goddard Space Flight Center, EEE Parts Derating, Preferred Reliability Practice PD-ED-1201, Table 1 (https://klabs.org/DEI/References/design_guidelines/design_series/1201.pdf, no date printed, read 2026-10-29)
  factors:
    capacitors: at most 60 % of rated voltage
    resistors: at most 60 % of rated power
    semiconductor devices: at most 50 % of rated power, 75 % of rated voltage, junction temperature 110 degC
    microcircuits: supply at most 80 % of rated voltage, 75 % of rated power, junction temperature 100 degC
    inductive devices: at most 50 % of rated voltage, 60 % of rated temperature
    relays and connectors: at most 50 % of rated current
  consequence_for_mains_rated_parts: Taken literally the table puts mains-rated, safety-listed parts (X2 capacitor, varistor, relay contacts, tabs, fuse clips) out of policy at 358 V peak and 15 A; those rows are findings
    until the owner either declares a different factor for safety-listed parts with a stated reason or accepts the findings.
departures_from_the_division_record:
- 'Interlock drive has 21 parts, not 19: R205 and R206 (100 kohm, each coupling node to ground) are added, because the record''s circuit holds the coil about 1.2 s when the output rests high after a rising edge (circuit-proof/A_removal_gate_high_rec.log);
  the record''s sentence that a level cannot cross the coupling capacitor is to be amended.'
- The supply voltage and supply current are read digitally by the AMC131M02 over SPI2, so the record's conversion pins PB1 and PA1 and the conditioning blocks VM_C and I_C are not used; the pins stay free.
- Mains divider is three 300 kohm 2512 resistors and the zero-crossing feed two 60.4 kohm 2512 resistors (a single element would see more than the 200 V working voltage the maker rates); the VMEAS and IN_COND blocks of the
  floorplan are larger than the record drew.
- Three Extended machine-placed part types are added to the record's five (PESD5V0F1BL C45961, BAT54S C47546, MF-NSMF012-2 C163517), +9.21 USD at Economic assembly.
- The debug SWO pin PB3 is wired; the allocation record's free list loses PA0, PB3, PC7, PD9, PD10 and PD11.
- The 8 MHz converter clock oscillator Y601 is added (the AMC131M02 has no oscillator of its own).
- The record's controller current budget (480 MHz, 439 mA) has no stable junction temperature at 70 degC air; the rail skeleton is drawn to 200 MHz at the lowest power scale until the firmware clock is declared (open-items.md).
circuit_verdicts:
  file: circuit-verdicts.md
  covers: every part and every net of every sheet, and each sheet against the drawing convention; a FINDING names its closing action or its owner
sheets:
- order: 1
  sheet: Mains entry and load feed
  function: Lands the retained mains harness on seven board tabs and the heater return landing, fuses and clamps the live entry, suppresses and discharges across it, and carries the neutral return through the current-sense
    shunt.
  parts:
  - ref: J101
    lib_id: Connector_Generic:Conn_01x01
    value: TAB1_LINE1
    rating: 6.3 x 0.8 mm blade, retained red lead (live out to the loads)
