# Parts specification of the Sunbeam EM7000 main controller board: one position for every part
# schematic-spec.yaml lists (455), in sheet order, the sheet named above each group.
#
# Form: the keys board_check.py reads of a position (reference, value, package, rating, lcsc, class)
# and no others, since it fails any other key. So the figures the schema has no key for sit in the
# comment above each position, from schematic-spec.yaml: the maker, the MPN and the catalogue class
# (basic / preferred / extended / none, the LCSC library class).
#
# Fields:
#   value, package, lcsc  as drawn (package is the footprint's library item name).
#   rating                the sheet's rating text for the part, exactly as the drawn symbol's Rating field
#                         carries it. It leads with the part's maximum rated voltage where it has one, since
#                         the derated-voltage rule reads the first figure in V, VDC or VAC as the rated
#                         maximum (an AC figure at its peak): an integrated circuit leads with its absolute
#                         maximum supply, an isolating part with its isolation voltage, a relay with its
#                         maximum switching voltage. Left out where the sheet states none (test points).
#   lcsc                  the catalogue number as drawn; "none" where the part has none (test points,
#                         owner-fitted links, hand-fitted wire), which the drawn symbol's LCSC field then
#                         carries as exactly that word.
#   class                 a class of derating-policy.yaml for a part whose rating states a figure in V, VDC or
#                         VAC; "none" for a part whose rating states none. The classes with no row in the
#                         policy's source table (fuse, resettable fuse, varistor, crystal and oscillator,
#                         thermistor, switch, jumper and link, test point, mains-rated safety part) take the
#                         maker's rating as the limit, share 1, as the owner accepted on 2026-10-29. A tab, a
#                         fuse clip, a link or a crystal whose sheet states no voltage is "none".
#
# Sources of the rated figures (datasheet, revision, address that opened it; from
# schematic-review.md round 2, the sheets' rating and function fields, and circuit-proof.md):
#   STM32H742/743 DS12110 Rev 11 (January 2026): web.archive.org copy of st.com stm32h743vi.pdf
#   AMC131M02 SBASA56 (September 2023): ti.com symlink address
#   Mean Well IRM-20 specification (IRM-20-SPEC 2025-11-21): meanwell.com
#   LT1963A series 1963aff: web.archive.org copy of analog.com 1963aff.pdf
#   TLV803/TLV853/TLV863 SBVS157C: the schematic's address did not open; LCSC-linked copy ZHCS187C
#     (April 2011, revised September 2015), datasheet.lcsc.com 3ffb790481a745eda29097d3bda5ef61.pdf
#   74AHC1G17 / 74AHCT1G17 Rev. 5 (14 March 2025): web.archive.org copy of assets.nexperia.com
#   MAX31865 19-6478 Rev 3 (7/15): web.archive.org copy of analog.com MAX31865.pdf
#   MOC3052M/D Rev. 4 (September 2022): web.archive.org copy of onsemi.com moc3052m-d.pdf
#   MOC3052M/D Rev. 3 (May 2019), the family sheet of the MOC3052SVM (U701, U711): datasheet.lcsc.com 307107d0e3e11abb98837978cd2dba04.pdf
#   LTV-814/824/844 (13 pages, no revision printed): datasheet.lcsc.com bc51d065248a46be93525386c92657f3.pdf
#   NX3008NBK (5 November 2022): web.archive.org copy of assets.nexperia.com
#   BAT54HT1/D Rev. 9 (November 2024): web.archive.org copy of onsemi.com bat54ht1-d.pdf
#   BAT54 series DS11005 Rev. 34-2: diodes.com, the schematic's address
#   BAS116 (5 August 2020): web.archive.org copy of assets.nexperia.com BAS116.pdf
#   BZX84C2V4 ... BZX84C47: diotec.com, the schematic's address; no revision printed
#   PESD5V0F1BL (14 April 2023): web.archive.org copy of assets.nexperia.com
#   USBLC6-2 DS4260 Rev 7 (December 2021): web.archive.org copy of st.com usblc6-2.pdf
#   SMF series (revised 12/06/17): datasheet.lcsc.com 6d382c654924c5ddbeb5b90893b39699.pdf
#   14D series Version A3 (revised 2023-10-27): datasheet.lcsc.com 305ba13b482fd415d345c9b9446eb189.pdf
#   HF32FA-G 2026 Rev. 1.00 and HF115F-Q: source.hongfa.com Uploads/Product/PDF
#   SN74LVC1G17 SCES351Y (October 2025), SN74HCT541 SCLS306E (May 2022): ti.com symlink addresses
#   AO3400A Rev 3.1 (July 2023), AO3401A Rev 3.1 (December 2023): aosmd.com
#   HX711 Avia V2.0: the web.archive.org address in the schematic
#   Bourns MF-MSMF REV. BE 09/26 and MF-NSMF REV. AF 09/26: bourns.com
#   SiTime SiT8008: sitime.com/datasheet/SiT8008
#   Taiyo Yuden LMK212BBJ226MG-T: the LCSC product page link
#   Ruilon NTC series rev. A6 2023-10-16 (RT301): as the sheet's rating field cites it
# Not stated: the rated figures of these parts were not obtained from a datasheet, by any of the
# routes tried (maker address with a browser User-Agent, then web.archive.org, then the LCSC
# product page links), and none is guessed here. A second search is running separately and its
# result is to be folded in.
#   BTA204S-600B (WeEn) T701 T711 ...: no datasheet opened (the BTA204S-600D and BTA208S-800B sheets
#     were reached but are other type numbers and are not used)
#   1N4148WS (vishay.com 85751, doc?85751, the archive copy: no PDF; the LCSC page links only RoHS reports)
#   Crystals Y401 (YXC X50328MSB2GI: a RoHS report and an image-only sheet) and Y402
#     (Seiko Epson Q13FC13500004: not found)
#   Fuses F101 F701 F711 F731 (SETfuse SCT520): only RoHS reports
#   The Arm document DDI0314H cited by J401 (infocenter.arm.com and a web.archive.org copy)
#   Headers (Hanxia PZ1.27-2x5P, XFCN PZ254V-11-03P and the others): mechanical drawings only
#   KNSCHA MPX104K31C3KN15600: neighbouring suffixes only, not the exact sheet
# A position whose rating the spec states without a source above has the figure from the sheet's
# own rating field and no datasheet reading behind it in the records.
#
