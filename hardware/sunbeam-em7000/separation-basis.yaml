# The separation basis record of the Sunbeam EM7000 machine: the one figure for the distance
# between mains-referenced and low-voltage conductors that every board design in this folder
# is held to, read by the pre-order board check. Accepted by the owner under the identity the
# project records their acts under. The owner instructed the drafting assistant in session on
# 2026-10-24 (local time): "Sign it in my behalf as me, I accept", after being told that
# the owner's acceptance criterion has the owner enter the values themselves, and offered to
# prepare the lines blank. accepted_by and accepted_on were entered on that
# instruction; accepted_on is the UTC date, as the check refuses a date later than the day it
# runs. The commit that adds them is the audit trail. A change to any figure, input or barrier
# needs a fresh acceptance.
#
# Fresh acceptance of 2026-10-29 (UTC). The owner instructed the drafting assistant in session
# on 2026-10-29: "agree, proceed. I am signing that off, sign on my behalf". The changes accepted
# are two barrier entries added (interlock-relay, the safety relay K201; isolated-measurement,
# the isolated measurement chip U601) and the exceptions below. accepted_on was set to
# 2026-10-29, the UTC date of that instruction, and accepted_by is unchanged. The figures for
# board spacing (pollution degree 3, 10.0 mm creepage, 3.0 mm clearance, 4.0 kV) are unchanged.
#
# Fresh acceptance of 2026-10-29 (UTC), second re-sign. The owner was told "Creepage ratings: the
# signed basis should list the bought parts' actual ratings per barrier. That is another re-sign,
# which I can enter on your behalf as before." and instructed the drafting assistant in session on
# 2026-10-29: "go". The change accepted is that each barrier's formed_by now states the rating of
# each bought part that forms it, as the makers' documents read, and which stated figures fall below
# the declared 10.0 mm creepage, 3.0 mm clearance and 4.0 kV. accepted_on was set to 2026-10-29,
# the UTC date of that instruction, and accepted_by is unchanged. No declared board figure changed.
#
# The owner's accepted exceptions of 2026-10-29: a bought part whose package fixes a creepage
# smaller than the 10.0 mm above is accepted at the maker's figure, not relaxed in the board
# spacing, which stays 10.0 mm where the board spacing is ours. The reasons the owner gave:
# the enclosure is sealed and inside the machine; the board has slots between the pad rows where
# the spacing is ours to set; a conformal coat is planned (it needs a fresh basis when declared,
# see the pollution degree note below); and nothing mains-referenced is touchable beyond the
# items listed under each barrier. The parts and the makers' figures:
#   - U601 AMC131M02: creepage 8.0 mm (TI SBASA56, September 2023).
#   - K201 HF115F-Q: creepage 'over 8 mm' (Hongfa).
#   - K731 and K741 HF32FA-G: creepage 'over 8 mm' (Hongfa).
#   - U701 and U711 MOC3052M: creepage at least 7 mm (onsemi MOC3052M/D Rev 3 and Rev 1.7); the surface-mount part stays: the owner
#     decided on 2026-10-29 against the through-hole 0.4 inch lead-spacing option (it adds assembly cost and hand
#     soldering), accepting the 7 mm for the reasons above, the box being mostly closed and a coat planned after test.
#   - U602 LTV-814S creepage and clearance, and K201 clearance: not stated by the makers read;
#     unknown until read from the makers.
# The record has no field for accepted exceptions and board_check.py reads none (a key outside
# its list is a violation), so they are recorded here, in each barrier's formed_by below (the one
# free-text field the check accepts, where the bought parts' ratings are stated and signed) and in
# open-items.md, "Owner risk acceptances (2026-10-29)", and are not checked by the tool.
#
# The tables are those of IEC 60664-1 (insulation coordination for equipment within
# low-voltage supply systems), Annex F. The standard is copyrighted and not reproduced; each
# row below is the one row the inputs select, read through two freely published derivations:
#   [TI-SEMINAR] Texas Instruments, "Demystifying clearance and creepage distance for
#     high-voltage end equipment", Power Supply Design Seminar, https://www.ti.com/lit/pdf/SLUP421,
#     read 2026-10-23: its Table F.1 slide (rated impulse voltage by line-to-neutral voltage
#     and overvoltage category) and its Table F.2 slide (clearance by required transient
#     voltage and pollution degree, at 2 000 m, with reinforced insulation dimensioned at the
#     rated impulse voltage one step higher than basic).
#   [TI-SLUAAR5] Texas Instruments, "Circuit Board Insulation Design According to IEC60664",
#     SLUAAR5, August 2023, https://www.ti.com/lit/pdf/sluaar5, read 2026-10-23: the reinforced
#     creepage distance is twice the basic distance of Table F.4.
#   [EMA-CREEPAGE] EMA Design Automation, "PCB clearance and creepage distance table",
#     https://www.ema-eda.com/ema-resources/blog/pcb-clearance-and-creepage-distance-table/,
#     read 2026-10-23: its creepage table by RMS voltage, pollution degree and material group,
#     the 250 V and 320 V rows. At 253 V rms the row at 250 V is below the working voltage, so
#     the next row up, 320 V, is the one used and no interpolation is made.
# The basis the figures are read at: 253 V rms is the top of the declared span, so it falls in
# the 300 V line-to-neutral row of the rated impulse voltage table, which gives 2.5 kV at
# overvoltage category II for basic insulation and so 4.0 kV (one step up) for reinforced.
# Reinforced is the insulation every barrier below that switches or senses mains directly (the safety
# relay and the isolated measurement chip included) is declared to provide; the pressure-sensor water-path barrier alone is basic (see barrier_types).
#
# Pollution degree 3, boards not protected against moisture. The enclosure is sealed from the
# steam wand, but steam may be present in the machine around it and a burst water line beside it
# would put water on the boards (owner statement, reference-machine.md, Ambient span); a conformal
# coat is planned once the boards work and is not applied, so degree 3 is taken and the boards
# count as unprotected. Coating them later would be a fresh basis, not an edit of this one.
#
# Material group IIIb, the worst case. The laminate's tracking index (CTI) is a maker's figure
# not yet read for the board to be ordered; group IIIb (100 <= CTI < 175) is the weakest group,
# and a laminate of any better group (IIIa, 175 <= CTI < 400, as a common FR-4 is sold) needs no
# more at this voltage and pollution degree, as the creepage row for 320 V shows 5.0 mm for both.
# The figure therefore holds whichever of the two the laminate proves to be.
standard: "IEC 60664-1, Annex F tables F.1, F.2 and F.4, read through the freely published derivations [TI-SEMINAR], [TI-SLUAAR5] and [EMA-CREEPAGE] cited above and in table_rows"
supply: "230 V nominal, single phase, 216 V to 253 V, 50 Hz"
working_voltage: "253 V rms (358 V peak), the top of the declared span"
pollution_degree: 3
material_group: IIIb
environment: "household appliance interior; water, steam and repeated heating and cooling at and around the enclosure; condensation possible; boards uncoated and not protected against moisture"
overvoltage_category: 2
altitude_m: 2000
accepted_by: david
accepted_on: 2026-10-29
barriers:
  - supply-module
  - heater-switch
  - pump-drive
  - supply-timing-front-end
  - mains-presence-confirm
  - valve-switch
  - interlock-relay
  - isolated-measurement
  - pressure-sensor-water-path
# Every barrier that switches or senses mains directly (supply module, heater switch, pump drive,
# supply-timing front end, mains-presence confirm, valve switch, interlock relay, isolated
# measurement) is reinforced, mains to low
# voltage, and none has its low-voltage side bonded to protective earth: the logic supply is a
# Class II module whose output is not referenced to earth, and the cavity's walls are plastic
# (docs/sunbeam-em7000/controller-board-design-constraints.md, Logic supply; reference-machine.md,
# What the walls are made of). The USB connector, the debug header and the operator's controls sit
# on the low-voltage side and can be touched, so a single insulation failure must not reach them.
# The one exception is pressure-sensor-water-path, declared basic, on these facts (owner
# statements, 2026-10-23; reference-machine.md, line 269 for the first): the machine's heater
# thermoblocks, solenoids and metal walls elsewhere in the machine (not the cavity's plastic walls) are bonded to
# protective earth, the inlet earth wire splitting to those metal parts. The pressure sensors connect through PTFE tube, so the sensor
# body is not bonded to earth, but the water in the tube touches the earthed block and so is
# referenced to earth through the earthed block (water is a poor earth reference, and the sensor
# is not itself bonded). A single heater or solenoid insulation fault goes into the earthed block,
# so on the owner's reading the water path is not mains-live under a single fault. Whether the
# fault draws enough current to open the inlet fuse or the upstream breaker, in what time, and what
# potential the block and the water in it reach meanwhile, is not shown by this record: the
# clearing time and let-through at the declared fault current are recorded by the design task of
# the board or assembly (the fitted-part design task), and the earth bond's resistance is
# required by the protective-earth continuity requirement and measured on the finished machine. The barrier is
# therefore earth-referenced water to the low-voltage electronics, at low-voltage working
# voltage, and needs basic insulation at that level, not reinforced mains to low voltage; the
# PTFE tube adds creepage. The remaining risk is a double fault, earth lost and a heater faulted,
# which the owner takes as outside what the design must survive (no clause of the standard is
# cited for that) and which relies on the block's earth bond staying sound. If the machine's earth bonding or the PTFE connection changes, the owner
# re-declares this basis. The owner accepts or corrects each insulation type, this one included,
# when signing.
barrier_types:
  - barrier: supply-module
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: >-
      the bought logic-supply module's input-to-output isolation, and the module-to-board spacing the carrier keeps. Bought part U301 Mean Well IRM-20-5 (IRM-20-SPEC 2025-11-21): withstand 4.2 kVac input to output, class II; creepage and clearance not stated, so unsourced and counted as absent against 10.0 mm creepage and 3.0 mm clearance, owner-accepted exception; the 4.2 kVac withstand is stated as a test figure and no impulse figure is stated against 4.0 kV.
  - barrier: heater-switch
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: the opto-triac between the heater drive and the triac gate, and the board spacing around it; the triac's insulated tab to the machine's metal wall (owner statement, `reference-machine.md` line 269; bond not measured; the protective-earth continuity requirement has it measured on the finished machine) is basic, to earth
  - barrier: pump-drive
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: >-
      the opto-triac between each pump drive and its triac, and the board spacing around it. Bought parts U701 and U711 MOC3052SVM (onsemi MOC3052M family, MOC3052M/D Rev 3 and Rev 1.7): creepage and clearance at least 7 mm and VISO 4170 Vrms; 7 mm falls below the declared 10.0 mm creepage and the 3.0 mm clearance is met; the sheet's impulse figure VIOTM 6000 V pk is above 4.0 kV; owner-accepted creepage exception, the 10 mm option (0.4 inch spacing) declined by the owner.
  - barrier: supply-timing-front-end
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: >-
      the AC-input optocoupler presenting both crossings of the supply, and the board spacing around it. Bought part U602 LTV-814S (Lite-On LTV-814 family sheet, no revision): VISO 5000 Vrms; creepage and clearance not stated for the plain part (7.0 mm only in the -V variant's own specification, which is not the part drawn), so unsourced and counted as absent against 10.0 mm creepage and 3.0 mm clearance, owner-accepted exception; no impulse figure stated against 4.0 kV.
  - barrier: mains-presence-confirm
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: the AC-input optocoupler on each heater channel, and the board spacing around it
  - barrier: valve-switch
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: >-
      the relay's coil-to-contact insulation, and the board spacing around it. Bought parts K731 and K741 HF32FA-G (Hongfa 2026 Rev 1.00): creepage and clearance over 8 mm and 5000 VAC coil to contacts; over 8 mm falls below the declared 10.0 mm creepage and meets the 3.0 mm clearance; no impulse figure stated against 4.0 kV; owner-accepted creepage exception.
  - barrier: interlock-relay
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: >-
      the safety relay's coil-to-contact insulation (the series interlock contact carrying the live feed to every load), and the board spacing around it. Bought part K201 HF115F-Q (Hongfa 2024 Rev 1.00): creepage over 8 mm, clearance not stated, 5 kV coil to contact, 10 kV 1.2/50 us; over 8 mm falls below the declared 10.0 mm creepage; the clearance is unsourced and counted as absent against 3.0 mm, owner-accepted exception; the 10 kV 1.2/50 us figure is above 4.0 kV.
  - barrier: isolated-measurement
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: >-
      the isolated measurement chip's integral isolation barrier, and the board spacing around it. Bought part U601 AMC131M02 (TI SBASA56, September 2023): creepage 8.0 mm and clearance 8.0 mm, VIOTM 7070 V pk, VIMP 7700 V pk, working voltage VIORM 1700 V pk; 8.0 mm falls below the declared 10.0 mm creepage, the 3.0 mm clearance and 4.0 kV impulse are met; owner-accepted creepage exception.
  - barrier: pressure-sensor-water-path
    insulation: basic
    earth_bonded: false
    touchable:
      - water path and steam wand
      - USB connector
      - operator controls
    formed_by: the transducer's insulation between its sensing circuit and the wetted water path, which is referenced to earth through the earthed heater or solenoid block it touches, at low-voltage working voltage, with the PTFE tube between sensor and block adding creepage
mains_to_low_voltage:
  clearance_mm: 3.0
  creepage_mm: 10.0
table_rows:
  - citation:
      document: "IEC 60664-1 Table F.1 and Table F.2, as read in [TI-SEMINAR] (https://www.ti.com/lit/pdf/SLUP421)"
      edition: "as reproduced in the 2023 seminar; tables unchanged in kind across editions (2000 m clearance, inhomogeneous field)"
      locator: "Table F.1: up to 300 V line to neutral, overvoltage category II, 2.5 kV for basic, so 4.0 kV for reinforced; Table F.2: 4.0 kV, pollution degree 3, 3.0 mm"
    inputs:
      working_voltage_v: 300
      insulation: reinforced
      overvoltage_category: 2
      pollution_degree: 3
      altitude_m: 2000
    figure:
      clearance_mm: 3.0
  - citation:
      document: "IEC 60664-1 Table F.4, as read in [EMA-CREEPAGE] (https://www.ema-eda.com/ema-resources/blog/pcb-clearance-and-creepage-distance-table/); doubled for reinforced as stated in [TI-SLUAAR5] (https://www.ti.com/lit/pdf/sluaar5)"
      edition: "as reproduced on the page read 2026-10-23"
      locator: "Table F.4: 320 V rms, pollution degree 3, material group IIIa and IIIb, 5.0 mm basic, doubled to 10.0 mm for reinforced insulation"
    inputs:
      working_voltage_v: 320
      insulation: reinforced
      pollution_degree: 3
      material_group: IIIb
    figure:
      creepage_mm: 10.0
