    reason: "The land pattern of the coffee pump triac T701 (TO-252-3) leaves 1.08 mm between the lead pad of pin 2 (MT2, the middle lead) and the lead pad of pin 1 (MT1, on NEUTRAL), a lead-pad to lead-pad gap; the package pitch forces it and the part is not changed. This entry does not excuse the triac's tab (the large pad on pin 2), which stands about 2.0 mm clear of those leads' pads and is held to the figure like any other pair."
