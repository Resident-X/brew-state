  # figure of the functional rows for its working voltage. Their working voltages are the drafter's
  # assertions at 253 V rms, the top of the declared span, each derived in the entry's reason, for the owner
  # to accept or correct; the half-mains and divider midpoints hold only while their resistor chain is intact.
  # The neutral-referenced set N is the thirteen nets the first entry lists. The triac gate nets PUMP_C_TRIAC_G and PUMP_S_TRIAC_G and the zero-cross LED anode ZC_LED_A pair only with /NEUTRAL, in entries 10 and 11.
  # The pump gate network nets (PUMP_C_GATE_R and PUMP_S_GATE_R against any net, and each gate network net against its own MT2 and
  # opto-triac nets) have no net-pair entry and keep the full 2.6 mm: while the opto-triac is off the full
  # supply stands across it and the gate network floats to the MT2 level. The 54 entries after them are of the
  # between form, a creepage and a clearance entry for each of 27 pairs of pads of one part, both pads on
  # nets of set N, whose edge-to-edge gap in the committed main-board layout is under 1.5 mm; accepted_mm is
  # that gap read from the layout, rounded down to 0.01 mm. Pairs the same parts stand 1.5 mm or more apart
