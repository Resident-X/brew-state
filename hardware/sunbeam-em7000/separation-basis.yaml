# The separation basis record of the Sunbeam EM7000 machine: the figures for the distance
# between mains-referenced and low-voltage conductors, and between conductors at different
# potentials of the mains supply, that every board design in this folder is held to, read by the
# pre-order board check.
#
# This record is unsigned. It held an acceptance entered earlier on the owner's instruction; that
# acceptance covered figures this revision replaces (it adds the mains-to-mains figures, the
# material group IIIa and the accepted exceptions), and the owner has not yet seen the new ones,
# so accepted_by and accepted_on are left out and the check reads the record as unsigned. The
# owner's acceptance is the owner's own act, entered by the leaf that records it, and it covers
# the whole record, the exceptions included; each exception's own accepted_by and accepted_on are
# left empty for the same act. The commit that adds them is the audit trail. A change to any
# figure, input, barrier or exception needs a fresh acceptance.
#
# Readings the drafter made for the owner to check before accepting (each is repeated in the
# citation of the row it affects):
#   1. The 0.5 mm terminal allowance (the terminal_clearance_mm of 2.0 mm is the 1.5 mm
#      clearance plus 0.5 mm for the movement and assembly of a terminal). It is the footnote to
#      Table 16 of the household-appliance standard (IEC 60335-1) as reproduced in two
#      certification reports, which this repository does not identify; the clause is not given
#      by them and is stated as not found, and the standard's own text was not read.
#   2. The material-group column of the 250 V and 320 V rows of IEC 60664-1 Table F.4 used for the
#      creepage figures (pollution degree 2, material group III: 250 V = 2.5 mm, 320 V = 3.2 mm, the
#      "other materials" column and not the printed-wiring column), read from the reproductions
#      cited below and not from the standard.
#   3. Whether the household-appliance standard (IEC 60335-1) permits interpolation of its own
#      creepage table. Nothing was found either way. If it refuses, the fallback is the 320 V row,
#      3.2 mm, for creepage_mm and creepage_ahead_of_fuse_mm. The owner, or a test house, confirms
#      the position before certification.
#   4. The conditions below: that the enclosure, with a conformal coat as a supporting measure,
#      credits pollution degree 2, and the functional band rows of table_rows (the eight rows from 10 V to 320 V), which
#      are readings from open reproductions, the rows below 25 V from KiCad's source tables, the IEC
#      text unread.
#
# The credit of pollution degree 2 on a board its enclosure protects rests on six conditions, all of
# them the owner's to accept with the record:
#   1. Enclosure: the credit stands on the enclosure, which keeps liquid water off the boards and
#      allows no more than occasional, temporary condensation. The boards are also conformally coated
#      before they are energised in the machine, as a supporting measure that does not itself earn the
#      credit; the fabrication notes name the coat type and cite its datasheet, and the coat covers the gaps
#      between mains pads, except the keep-outs documented for contacts. The main board's
#      fabrication notes carry it (SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT, criterion C17), the
#      heater wall board's (SOL-HW-HEATER-WALL-BOARD-PROVEN-AND-LAID-OUT, criterion C10) and the
#      bring-up task checks it before mains is first connected (DEL-HW-BRING-UP, criterion C16).
#   2. Degree: the record states the boards are protected against moisture, by the enclosure, with the
#      coat a supporting measure, and credits pollution degree 2 only. Pollution degree 1 is never
#      credited: no coating test is planned and none is claimed.
#   3. Laminate: the comparative tracking index (CTI) is at least 175 (material group IIIa), required by
#      the main board's fabrication notes (SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT, criterion C16).
#   4. Slots: every slot cut to lengthen a creepage path is at least 1.0 mm wide, 1.5 mm if a
#      pollution degree 3 credit must survive. The layout practice's slot item already requires wider
#      than 1 mm.
#   5. Humidity: the bring-up humidity reading of the closed machine confirms no condensation on the
#      boards while energised (DEL-HW-BRING-UP, criterion C17). If condensation appears, the basis falls
#      back to pollution degree 3 and 4.1 mm, which is a fresh basis for the owner to accept.
#   6. Signature: the whole record is re-signed by the owner. The previous acceptance covers figures
#      this revision replaces and does not stand for them.
#
# A pair whose creepage is reduced to the band figure for the voltage across its gap rests on two
# things: its working voltage in normal operation, and a single-fault analysis recorded for that
# listing, which names the fault, the voltage it puts across the gap and the current limit that bounds
# it, and shows that the fault creates no hazard. The fault table is a comment of this record: the
# check does not read it, and the owner's acceptance of the record is what carries it. A pair that
# reaches the supply voltage in normal operation is never reduced.
#
# Residual risk accepted by the owner on 2026-10-31: the figures here are single-sourced
# reproductions, and the text of IEC 60335-1, IEC 60335-2-15 (appliances for heating liquids, the
# Part 2 that applies to this machine), IEC 60664-1 and IEC 60664-3 is unread, so the pollution
# degree, creepage and functional-insulation readings are unverified against the standards. No
# standard is to be bought, no independent read is required and no insulation-resistance or withstand
# test with equipment is planned. The owner's words: "I'm not buying the standards, this is a hobby
# project, we probably won't insulation test with equipment". The conservative reading is used wherever
# it is cheap: the "other materials" column, rounding up, and the full figure for any pair not listed.
#
# The tables are those of IEC 60664-1 (insulation coordination for equipment within
# low-voltage supply systems), Annex F. The standard is copyrighted and not reproduced; each
# row below is the one row the inputs select, read through freely published derivations. They are
# reproductions and not the standard's text, and the standard's own text was not read:
#   [TI-SEMINAR] Texas Instruments, "Demystifying clearance and creepage distance for
#     high-voltage end equipment", Power Supply Design Seminar, https://www.ti.com/lit/pdf/SLUP421,
#     read 2026-10-23: its Table F.1 slide (rated impulse voltage by line-to-neutral voltage
#     and overvoltage category) and its Table F.2 slide (clearance by required transient
#     voltage and pollution degree, at 2 000 m, with reinforced insulation dimensioned at the
#     rated impulse voltage one step higher than basic).
#   [TI-SLUAAR5] Texas Instruments, "Circuit Board Insulation Design According to IEC60664",
#     SLUAAR5, August 2023, https://www.ti.com/lit/pdf/sluaar5, read 2026-10-23: the reinforced
#     creepage distance is twice the basic distance of Table F.4.
#   [EMA-CREEPAGE] EMA Design Automation, "PCB clearance and creepage distance table",
#     https://www.ema-eda.com/ema-resources/blog/pcb-clearance-and-creepage-distance-table/,
#     read 2026-10-23: its creepage table by RMS voltage, pollution degree and material group,
#     the 250 V and 320 V rows. At 253 V rms the row at 250 V is below the working voltage and
#     the row at 320 V above it. IEC 60664-1:2007 clause 5.2.4 (clause 5.2.3 for functional
#     insulation) allows linear interpolation for intermediate voltages where the working voltage
#     of 4.3.2.2.2 is used for dimensioning, requires it to be linear, and rounds the result to
#     the same number of digits as the table values; that is a reading of the 2007 edition text
#     only, the 2020 edition and AMD1:2025 not having been read. The mains-to-mains creepage is
#     therefore interpolated (see the derived row in table_rows). The mains_to_low_voltage
#     creepage keeps the larger 10.0 mm figure, deliberately: the 320 V row, 3.2 mm basic, doubled
#     for reinforced insulation is 6.4 mm, and the signed 10.0 mm stands 3.6 mm over that floor.
#   [IECEX-1422] IECEx document 1422, on the interpolation of the creepage table between rows,
#     https://iecex.com/dmsdocument/1422
#   [IECEE-DECISION] An IECEE decision sheet quoting note 1 of Table F.4,
#     https://www.har-cert.com/doc/doc_12893_main1_OSM-IN%20273.pdf
# The basis the figures are read at: 253 V rms is the top of the declared span, so it falls in
# the 300 V line-to-neutral row of the rated impulse voltage table, which gives 2.5 kV at
# overvoltage category II for basic insulation and so 4.0 kV (one step up) for reinforced.
# Reinforced is the insulation every barrier below that switches or senses mains directly is declared
# to provide; the pressure-sensor water-path barrier alone is basic (see barrier_types).
#
# Pollution degree 2, boards protected against moisture by the enclosure. The enclosure is sealed from
# the steam wand, but steam may be present in the machine around it and a burst water line beside it
# would put water on the boards (owner statement, reference-machine.md, Ambient span); the enclosure is
# the credit, and a conformal coat applied before the boards are energised in the machine, under the
# six conditions above, supports it without being it. Pollution degree 2 is credited, never 1.
#
# Material group IIIa, on the ground of a requirement on the main board's fabrication notes: a
# laminate whose published comparative tracking index (CTI) is at least 175 (IIIa, 175 <= CTI <
# 400, as a common FR-4 is sold). The requirement is carried by the main-board layout leaf
# (SOL-HW-MAIN-BOARD-PROVEN-AND-LAID-OUT); no laminate is chosen yet, so no laminate maker's
# document is cited. The creepage rows at 253 V are equal for IIIa and IIIb in the pollution degree 2
# material group III column (2.5 mm at the 250 V row, 3.2 mm at the 320 V row), so no figure changes
# with the group. The standard's own text, which the reproductions only reproduce, was not read.
standard: "IEC 60664-1, Annex F tables F.1, F.2 and F.4, read through the freely published derivations [TI-SEMINAR], [TI-SLUAAR5] and [EMA-CREEPAGE] cited above and in table_rows; for the terminals of a part, the footnote to Table 16 of IEC 60335-1 as reproduced in two certification reports"
supply: "230 V nominal, single phase, 216 V to 253 V, 50 Hz"
working_voltage: "253 V rms (358 V peak), the top of the declared span"
pollution_degree: 2
material_group: IIIa
environment: "household appliance interior; water, steam and repeated heating and cooling at and around the enclosure; condensation possible; boards protected against moisture: enclosure, with a conformal coat as a supporting measure"
overvoltage_category: 2
altitude_m: 2000
barriers:
  - supply-module
  - heater-switch
  - pump-drive
  - supply-timing-front-end
  - mains-presence-confirm
  - valve-switch
  - pressure-sensor-water-path
# Every barrier that switches or senses mains directly (supply module, heater switch, pump drive,
# supply-timing front end, mains-presence confirm, valve switch) is reinforced, mains to low
# voltage, and none has its low-voltage side bonded to protective earth: the logic supply is a
# Class II module whose output is not referenced to earth, and the cavity's walls are plastic
# (docs/sunbeam-em7000/controller-board-design-constraints.md, Logic supply; reference-machine.md,
# What the walls are made of). The USB connector, the debug header and the operator's controls sit
# on the low-voltage side and can be touched, so a single insulation failure must not reach them.
# The one exception is pressure-sensor-water-path, declared basic, on these facts (owner
# statements, 2026-10-23; reference-machine.md, line 269 for the first): the machine's heater
# thermoblocks, solenoids and metal walls elsewhere in the machine (not the cavity's plastic walls) are bonded to
# protective earth, the inlet earth wire splitting to those metal parts. The pressure sensors connect through PTFE tube, so the sensor
# body is not bonded to earth, but the water in the tube touches the earthed block and so is
# referenced to earth through the earthed block (water is a poor earth reference, and the sensor
# is not itself bonded). A single heater or solenoid insulation fault goes into the earthed block,
# so on the owner's reading the water path is not mains-live under a single fault. Whether the
# fault draws enough current to open the inlet fuse or the upstream breaker, in what time, and what
# potential the block and the water in it reach meanwhile, is not shown by this record: the
# clearing time and let-through at the declared fault current are recorded by the design task of
# the board or assembly (the fitted-part design task), and the earth bond's resistance is
# required by the protective-earth continuity requirement and measured on the finished machine. The barrier is
# therefore earth-referenced water to the low-voltage electronics, at low-voltage working
# voltage, and needs basic insulation at that level, not reinforced mains to low voltage; the
# PTFE tube adds creepage. The remaining risk is a double fault, earth lost and a heater faulted,
# which the owner takes as outside what the design must survive (no clause of the standard is
# cited for that) and which relies on the block's earth bond staying sound. If the machine's earth bonding or the PTFE connection changes, the owner
# re-declares this basis. The owner accepts or corrects each insulation type, this one included,
# when signing.
barrier_types:
  - barrier: supply-module
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: the bought logic-supply module's input-to-output isolation, and the module-to-board spacing the carrier keeps
  - barrier: heater-switch
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: the opto-triac between the heater drive and the triac gate, and the board spacing around it; the triac's insulated tab to the machine's metal wall (owner statement, `reference-machine.md` line 269; bond not measured; the protective-earth continuity requirement has it measured on the finished machine) is basic, to earth
  - barrier: pump-drive
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: the opto-triac between each pump drive and its triac, and the board spacing around it
  - barrier: supply-timing-front-end
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: the AC-input optocoupler presenting both crossings of the supply, and the board spacing around it
  - barrier: mains-presence-confirm
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: the AC-input optocoupler on each heater channel, and the board spacing around it
  - barrier: valve-switch
    insulation: reinforced
    earth_bonded: false
    touchable:
      - USB connector
      - operator controls
      - enclosure
    formed_by: the relay's coil-to-contact insulation, and the board spacing around it
  - barrier: pressure-sensor-water-path
    insulation: basic
    earth_bonded: false
    touchable:
      - water path and steam wand
      - USB connector
      - operator controls
    formed_by: the transducer's insulation between its sensing circuit and the wetted water path, which is referenced to earth through the earthed heater or solenoid block it touches, at low-voltage working voltage, with the PTFE tube between sensor and block adding creepage
mains_to_low_voltage:
  clearance_mm: 3.0
  creepage_mm: 10.0
# Between conductors at different potentials of the mains supply, read at the same inputs for basic
# insulation: the clearance of the 2.5 kV row of Table F.2; the clearance between the terminals of a
# part, which adds 0.5 mm for movement and assembly; and the creepage at 253 V, the linear
# interpolation of the 250 V and 320 V rows of Table F.4 at pollution degree 2 (2.5 mm and 3.2 mm)
# rounded up to 0.1 mm. F101 is the entry
# fuse: only the supply's own protection clears a fault ahead of it, and no stated basis shows F101
# clearing a tracking fault between the pair downstream of it, so the basic creepage applies there
# as well and there is no downstream_basis. The pair across the open contact of the interlock relay,
# LINE and LINE_IN against LINE1, is outside these figures: a bridge across that contact would
# defeat the interlock, so the pair is held at the mains_to_low_voltage figures, 3.0 mm and 10.0
# mm, with no credit for the relay's own contact gap.
mains_to_mains:
  clearance_mm: 1.5
  terminal_clearance_mm: 2.0
  creepage_mm: 2.6
  creepage_ahead_of_fuse_mm: 2.6
  entry_fuse: F101
  held_at_reinforced:
    - ["/LINE", "/LINE1"]
    - ["/Mains entry and load feed/LINE_IN", "/LINE1"]
