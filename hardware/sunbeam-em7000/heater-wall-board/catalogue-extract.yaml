# The catalogue extract of the Sunbeam EM7000 heater wall board: one entry for each distinct LCSC catalogue
# number the parts-specification.yaml gives a position that this record could read.
#
# All six numbers were read from JLCPCB's parts library through the search service the main board's extract
# names (the catalogue number posted as the keyword, one exact match each), on 2026-11-19, which is this
# extract's read_on and each entry's lifecycle read_on. library_class is the service's `expand`, which this
# repository writes `extended` (the main board's extract does the same); stock is `stockCount`; unit_price is
# `initialPrice`; category is `firstSortName`, written only for C899868, the opto-triac, whose first category
# name is the one the check lists as a part with no supply pin (hardware/README.md, The no-supply categories).
#
# C899868 (onsemi MOC3083SVM, the V-option surface-mount opto-triacs U911 and U921, DIN EN/IEC 60747-5-5 approved)
# replaces C111561 (the plain MOC3083SR2M, which the layout agent first used, stock 13049 at 0.7727 USD) and C23552
# (onsemi MOC3083M, the through-hole part, which the service showed at stock 0 on 2026-11-19). Same die, ratings and
# package case 646BY: the family sheet onsemi MOC3081M / MOC3082M / MOC3083M covers all of them. No position uses
# C111561 or C23552 any more, so their entries are removed, as the main board's extract removes an entry no position uses.
#
# comment: one line of plain text for each number, describing the part as the assembler's parts list shows it (maker,
# maker part number, what the part is); the only source of the parts list's comment column, as in the main board's extract.
#
# The window (max_age_days) is not a claim of freshness: the design is held, and the read that matters is the one made on the order date, which re-reads this extract and re-dates it (SOL-HW-CONTROLLER-BOARDS-ORDERED.C10).
read_on: 2026-11-19
max_age_days: 36500
