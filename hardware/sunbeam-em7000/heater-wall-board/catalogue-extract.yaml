# The catalogue extract of the Sunbeam EM7000 heater wall board: one entry for each distinct LCSC catalogue
# number the parts-specification.yaml gives a position that this record could read.
#
# All six numbers were read from JLCPCB's parts library through the search service the main board's extract
# names (the catalogue number posted as the keyword, one exact match each), on 2026-11-19, which is this
# extract's read_on and each entry's lifecycle read_on. library_class is the service's `expand`, which this
# repository writes `extended` (the main board's extract does the same); stock is `stockCount`; unit_price is
# `initialPrice`; category is `firstSortName`, written only for C111561, the opto-triac, whose first category
# name is the one the check lists as a part with no supply pin (hardware/README.md, The no-supply categories).
#
# C111561 (onsemi MOC3083SR2M, the surface-mount opto-triacs U911 and U921) replaces C23552 (onsemi MOC3083M, the
# through-hole part, which the service showed at stock 0 on 2026-11-19). Same die and ratings: the MOC3083SR2M is
# the tape-and-reel surface-mount form of the part in the onsemi MOC3081M / MOC3082M / MOC3083M sheet. No position
# uses C23552 any more, so its entry is removed, as the main board's extract removes an entry no position uses.
#
# The extract allows itself 14 days (max_age_days), so it is stale after 2026-12-03 and is read again before the order.
read_on: 2026-11-19
max_age_days: 14
source: JLCPCB parts library search service (jlcpcb.com/api/overseas-pcb-order/v1/shoppingCart/smtGood/selectSmtComponentList/v2), read on 2026-11-19 for the six catalogue numbers of this board
