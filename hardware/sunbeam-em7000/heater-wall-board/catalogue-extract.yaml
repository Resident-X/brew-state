# The catalogue extract of the Sunbeam EM7000 heater wall board: one entry for each distinct LCSC catalogue
# number the parts-specification.yaml gives a position that this record could read.
#
# All six numbers were read from JLCPCB's parts library through the search service the main board's extract
# names (the catalogue number posted as the keyword, one exact match each), on 2026-11-19, which is this
# extract's read_on and each entry's lifecycle read_on. The three the first version of this file could not list
# (C10065, C23552, C49072860) are now read; the other three (C18002, C86469, C2937625) are read again, so every
# figure here is of the one day. library_class is the service's `expand`, which this repository writes
# `extended` (the main board's extract does the same); stock is `stockCount`; unit_price is `initialPrice`;
# category is `firstSortName`, written only for C23552, the opto-triac, whose first category name is the one the
# check lists as a part with no supply pin (hardware/README.md, The no-supply categories).
#
# C23552 (onsemi MOC3083M, the opto-triacs U911 and U921) read at stock 0 on 2026-11-19. The figure is written as
# read; the check refuses a part shown with no stock as parts_catalogue, so U911 and U921 fail that rule until
# the library shows stock again or the owner's sourcing decision for the part is recorded in the specification
# (open-items.md). The design opinion of 2026-11-18 read the same number at stock 8,800 the day before.
#
# The extract allows itself 14 days (max_age_days), so it is stale after 2026-12-03 and is read again before the order.
read_on: 2026-11-19
max_age_days: 14
source: JLCPCB parts library search service (jlcpcb.com/api/overseas-pcb-order/v1/shoppingCart/smtGood/selectSmtComponentList/v2), read on 2026-11-19 for the six catalogue numbers of this board
