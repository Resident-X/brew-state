notes: 'Header at the right edge of the sheet; no mains on this sheet. The cable lands on positions 1 to 3 of the main board''s ten-way J761: 1 +5V_WB, 2 HEAT_C_LED_K, 3 HEAT_S_LED_K. +5V_WB supplies the two opto-triac LED anodes on the switch sheets and is power-leaving at the main board''s end (JP761); nothing on this board sources it. HEAT_C_LED_K and HEAT_S_LED_K are the LED returns sunk by the main board''s Q761 and Q771. The board has no ground net: the LED current returns through the main board. The mains-presence confirms stay off this board (owner decision D2), so the main board''s J761 pins 4 to 10 are not on this cable. H1 to H4 (case-screw holes, a starting set) and FID1 to FID3 (fiducials) are mechanical symbols on no net, drawn in a row on this sheet with the LCSC field none: the holes take an M3 screw (the board is a plain rectangle screwed to the case, with no ears; the case screws to the flat spreader plate), and none of the seven is in the bill of materials or the position file. The layout chooses the final number of holes (at least three) and their places, each held to the pre-order check''s mounting_hole distance from Mains copper whatever the screw is made of; a different count is a pinless-part change in the schematic, verified with the parity check, and nothing here fixes four. The symbols are drawn with in_bom yes; the exclusion is set on the placed footprints at layout (open-items.md). Low voltage only: the nearest mains net on the board is at least 10.0 mm by surface path from this header (separation basis, heater-switch barrier).'
