notes: "Left to right: element lead landing J201 (OUT_S, mains) at the left, the opto-triac U201 and the triac T201 in the middle, the varistor RV201 across OUT_S and RET. Mains side at the left and middle; the opto-triac is the barrier part and straddles the line: its LED pins 1-2 (+5V_WB, HEAT_S_LED_K) are drawn on the right edge as low voltage, its output pins 4 and 6 on the left with the mains. Separation basis barrier: heater-switch (reinforced, mains to low voltage), formed by the opto-triac and the board spacing around it. Chain: OUT_S -> U201.4; U201.6 -> R201 -> R202 -> T201 gate; T201 MT2 on OUT_S, MT1 on RET. No gate-to-MT1 resistor, no snubber (division record: snubbers dropped, varistors kept). U201.3 and U201.5 carry no-connect flags. The LED series resistor and the low-side sink are on the main board (HEAT_S_DRV stage), none here; the LED is lit only through HEAT_S_LED_K. Triac switches the neutral side; there is no live feed on this board. The triac stands on the owner's bracket with its tab bolted to the bracket (tab hole 17.25 mm above the component face, leads straight); the insulated tab is not a pin. Net RET is shared with the other switch sheet and the return landing sheet."
