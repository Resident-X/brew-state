  accepted_mm: 1.03
  reason: 'U911 (onsemi MOC3083SVM, surface-mount, six-pin) pin 5, which the maker gives no connection and the board leaves
    unconnected, is the output side''s substrate; its net is named in the Mains class so that the check holds it to the
