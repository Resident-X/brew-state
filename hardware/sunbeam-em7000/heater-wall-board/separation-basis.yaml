# The accepted pad pairs, one entry for each constraint of each pair (24 entries). See the header for where each
# reason and bound comes from.
accepted_exceptions:
- pair: mains_to_mains
  constraint: creepage
  between:
  - R911.1
  - R911.2
  accepted_mm: 1.79
  reason: 'R911 (200 ohm, R_1206_3216Metric, UNI-ROYAL C18002) is one of the two series gate resistors of its heater''s
    gate network (R911 and R912, the coffee side), between the opto-triac''s output and the triac gate. Its two pads stand
    1.80 mm apart edge to edge, which is the 1206 package''s own pad gap and not a layout choice; the gap meets the 1.5
    mm clearance and falls short of the 2.0 mm pad-to-pad terminal clearance and the 2.6 mm creepage. The same footprint
    and circuit as the main board''s R704, R705, R714 and R715, whose 1.8 mm entries the machine''s record carries (open-items.md,
    ''A barrier the basis does not list''); accepted by the owner on 2026-11-18 as one of the 1206 gate-resistor pad pairs
    (owner-sign-off.md W-4, W-9 1b). The part is not changed, and the entry excuses only this pair of pads. Measured on
    the committed board: 1.80 mm; accepted down to 1.79 mm.'
  bounded_by: 'Each pad pair is functional insulation inside one switched branch: a tracking short across it fails ''heater
    on'' or ''gate network shorted'', both bounded by the interlock relay K201 (which acts when the controller stops refreshing
    it or the 5 V rail collapses) and the firmware''s stuck-on current threshold with every heater commanded off, which
    must trip at 2.0 A or less (REQ-ACTUATION-CONFIRMATION-001.C10, a requirement no node delivers yet), and by the element''s
    own thermostats and cutoffs; none is a shock path (owner-sign-off.md W-4, W-6, W-9 1b, and the failure-mode table of
    circuit-proof.md). The conformal coat comes after bring-up and is no part of the bound until it is applied.'
  accepted_by: David Baker (owner)
  accepted_on: 2026-11-19
- pair: mains_to_mains
  constraint: clearance
  between:
  - R911.1
  - R911.2
  accepted_mm: 1.79
  reason: 'R911 (200 ohm, R_1206_3216Metric, UNI-ROYAL C18002) is one of the two series gate resistors of its heater''s
    gate network (R911 and R912, the coffee side), between the opto-triac''s output and the triac gate. Its two pads stand
