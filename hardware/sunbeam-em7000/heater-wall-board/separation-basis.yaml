# The separation basis record of the Sunbeam EM7000 heater wall board: the figures for the distance between mains-
# referenced and low-voltage conductors, and between conductors at different potentials of the mains supply, that this
# board design is held to, read by the pre-order board check. It is the board's own record, found before the machine's
# (hardware/sunbeam-em7000/separation-basis.yaml) because the check reads the separation-basis.yaml nearest at or
# above the design: the machine's record names the main board's pad pairs, nets and entry fuse, and every one of its
# 42 exception entries, its entry fuse F101 and its held_at_reinforced nets fail this board, which has none of them.
# The figures below are the machine's, copied unchanged.
#
# Re-signed 2026-11-27, on the owner's behalf (owner-sign-off.md W-19). The text of the mains-to-earthed-plate barrier below,
# which the owner signed on 2026-11-19 as a barrier in the case's tray (W-10), now states the case's form: the spreader
# plate is narrower and its lower edge stands 6.0 mm above the component face, no barrier is credited, and clearance and
# creepage to the plate are geometric. No figure of this record changed; accepted_by and accepted_on and nothing else of the
# signature fields read the re-signing. The 24 accepted pad-pair entries keep their own 2026-11-19 acceptance, which this
# record's later day covers.
#
# Signed. The owner, David Baker, accepted this record on 2026-11-19, in his words "I'm signing those now. Take as
# signed. Proceed." (owner-sign-off.md W-12). The signature covers this file only, the board's own separation basis; it
# rests on the acceptances he gave in his words, W-9 1a, 1b and 1c ("sign as accepted", 2026-11-19; W-2 and W-4 of
# 2026-11-18), which were given on the through-hole figures, and on W-11, by which he delegated the choice of the
# opto-triac part to the layout agent with the safety facts put to him (the part became the V-option onsemi MOC3083SVM,
# LCSC C899868, surface-mount, same case as the MOC3083SR2M of his option A). The opto-triac pin gap is now 1.04 mm
# against the 0.94 mm of W-9 1b, which is the wider gap. Nothing else is signed by this record: the owner's other
# end-of-work items (W-5a, W-5b, W-5d, the outer-face temperature, the case's form of W-19) remain as
# owner-sign-off.md lists them.
#
# What this record holds that the machine's does not. (1) Barrier heater-switch, formed by the opto-triacs U911 and
# U921 and the board spacing around them: the part's own external creepage and clearance of at least 7 mm (onsemi
# MOC3083M/D Rev. 2, p.2 and p.4; VISO 4170 Vrms for one minute) under the declared 10.0 mm creepage, owner-accepted
# as an exception for the through-hole part (W-2), carried to the surface-mount V-option part by W-11 and signed here; the board
# path lengthened by a 1.5 mm slot cut under each part (layout-plan.md MAINS-4, BOARD-3, layout-hedges.md hedge 5);
# the 10.0 mm figure itself unchanged. (2) Barrier mains-to-earthed-plate, the triac's insulated tab and the mains
# copper toward the earthed spreader plate at the basic creepage of 2.6 mm and the clearance of 1.5 mm: the case holds
# the plate's lower edge 6.0 mm above the component face (owner-sign-off.md W-19, which restores the 6.0 mm lift of W-9 1c
# that W-10 had replaced by a barrier), so no plate metal faces the board edge, the pads or the lower leads, and no
# barrier is credited; the distances are geometric and the case's checks hold them over the board outline's routing
# tolerance and the leads' play; the plate's earth bond is measured at bring-up (DEL-HW-BRING-UP.C6). The check cannot
# see the plate or the tray, so this record states the form and no entry excuses it. (3) The accepted pad pairs of this board, below.
#
# The mains_to_mains entry fuse. This board carries no net ahead of the entry fuse (MAINS_ENTRY is none): the entry
# fuse F101 is on the main board and is truthfully named here; the check holds an entry fuse to a design's layout only
# where the design declares a mains entry. held_at_reinforced is empty: this board has no relay contact whose bridge
# would defeat a safety function, and none of /LINE, /LINE1, /LINE_IN.
#
# The accepted pad pairs. Each is a pair of pads of one part whose gap the part's own land pattern or the owner-
# accepted oval triac pads leave under the 2.0 mm terminal clearance and the 2.6 mm creepage. Each pair has two
# entries, one of clearance and one of creepage, as the check reports each. accepted_mm is set 0.01 mm under the gap
# measured on the committed board (HEAD b5f2547d: 1.04 mm for the triac pins T911 and T921 1-2 and 2-3 and for the
# opto-triac pads U911 and U921 4-5 and 5-6; 1.80 mm for the 1206 pads of R911, R912, R921 and R922), because the
# check fails an entry whose accepted distance is above what the layout leaves. The reasons and bounds are those of
# owner-sign-off.md W-2, W-4, W-6, W-7 and W-9 and of open-items.md, quoted or paraphrased there and cited here, not
# new ones. The varistor leads of RV911 and RV921 (5.0 mm apart) and every other pair are not entered, because the
# check reports no shortfall for them.
standard: IEC 60664-1, Annex F tables F.1, F.2 and F.4, read through the freely published derivations [TI-SEMINAR], [TI-SLUAAR5]
  and [EMA-CREEPAGE] cited above and in table_rows; for the terminals of a part, the footnote to Table 16 of IEC 60335-1
  as reproduced in two certification reports
supply: 230 V nominal, single phase, 216 V to 253 V, 50 Hz
working_voltage: 253 V rms (358 V peak), the top of the declared span
pollution_degree: 2
material_group: IIIa
environment: 'household appliance interior; water, steam and repeated heating and cooling at and around the enclosure; condensation
  possible; boards protected against moisture: enclosure, with a conformal coat as a supporting measure'
overvoltage_category: 2
altitude_m: 2000
barriers:
- heater-switch
- mains-to-earthed-plate
# Barrier types: the heater switch is reinforced, mains to low voltage, with its low-voltage side not bonded to protective earth (the logic supply is a Class II module whose output is not referenced to earth), as the machine's record declares; the mains-to-earthed-plate barrier is basic, to the earthed plate.
barrier_types:
- barrier: heater-switch
  insulation: reinforced
  earth_bonded: false
  touchable:
  - USB connector
  - operator controls
  - enclosure
  formed_by: 'the opto-triacs U911 and U921 between the heater drive and the triac gate, and the board spacing around them.
    Bought parts U911 and U921, onsemi MOC3083SVM (LCSC C899868, the V-option surface-mount form of the part in the onsemi MOC3081M
    / MOC3082M / MOC3083M sheet, MOC3083M/D Rev. 2, September 2022): external creepage and clearance at least 7 mm, VISO
    4170 Vrms for one minute, VIORM 850 Vpk, VIOTM 6000 Vpk, CTI 175, pollution degree 2. 7 mm falls below the declared
    10.0 mm creepage and the 3.0 mm clearance is met; the creepage is an owner-accepted exception (owner-sign-off.md W-2
    for the through-hole part, carried to the V-option surface-mount part by W-11 and signed with this record, W-12). The board path under each part
    is lengthened by a 1.5 mm slot (layout-plan.md MAINS-4, BOARD-3), which does not lengthen the path over the moulding;
    the opto-triac pads on the mains side stand apart from the low-voltage pads by the land pattern, with no copper between
    the pad rows (layout-plan.md MAINS-5).'
- barrier: mains-to-earthed-plate
  insulation: basic
  earth_bonded: true
  touchable:
  - earthed spreader plate
  - the machine's steel wall it is screwed to
  formed_by: the insulated tab of the triacs T911 and T921 (ST BTA16-800BWRG, tab rated 2500 Vrms, UL 1557 file E81734,
    ST DS2114 Rev 11 p.1) to the earthed plate, and the board's mains copper toward the plate held to the basic creepage
    of 2.6 mm and the clearance of 1.5 mm with no barrier credited, the case holding the plate's lower edge 6.0 mm above the
    component face, so no plate metal faces the board edge, the pads or the lower leads, and the tray's printed end wall
    fills the volume the narrower plate leaves, with no creepage credit (owner-sign-off.md W-19, which restores the 6.0 mm
    lift of W-9 1c). Clearance and creepage to the plate are geometric, being the straight line from every mains pad edge and
    bare lead to the plate, at least 2.6 mm over the case's tolerance range. The plate is bonded to protective earth through
    the machine's wall and mains-inlet earth, which the owner holds as a fact and bring-up measures (DEL-HW-BRING-UP.C6).
    The form is realised by the case and is not seen by the pre-order check.
mains_to_low_voltage:
  clearance_mm: 3.0
  creepage_mm: 10.0
# The entry fuse F101 is the machine's, on the main board; this board has none (MAINS_ENTRY is none). See the header: the check names it as no reference on this layout.
mains_to_mains:
  clearance_mm: 1.5
  terminal_clearance_mm: 2.0
  creepage_mm: 2.6
  creepage_ahead_of_fuse_mm: 2.6
  entry_fuse: F101
  held_at_reinforced: []
