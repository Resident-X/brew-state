# A generic open-frame FDM machine for the printed case of the heater wall board: 220 x 220 x 250 mm bed, 0.4 mm nozzle,
# 0.2 mm layers, ASA at 245 degC nozzle and 100 degC bed, brim and draft shield on, supports off. The slice step
# (slice.py) loads this file, and loads support-auto.ini beside it for the second run. Every key is PrusaSlicer 2.9's own.
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_multiplier = 1
gcode_flavor = marlin2
use_relative_e_distances = 1
use_firmware_retraction = 0
filament_type = ASA
filament_density = 1.07
filament_cost = 25
temperature = 245
first_layer_temperature = 245
bed_temperature = 100
first_layer_bed_temperature = 100
layer_height = 0.2
first_layer_height = 0.2
perimeters = 4
top_solid_layers = 5
bottom_solid_layers = 5
fill_density = 25%
fill_pattern = gyroid
external_perimeters_first = 0
perimeter_speed = 45
external_perimeter_speed = 30
infill_speed = 60
bridge_speed = 30
first_layer_speed = 20
travel_speed = 120
brim_type = outer_only
brim_width = 6
brim_separation = 0.1
skirts = 1
skirt_distance = 3
skirt_height = 1
draft_shield = enabled
support_material = 0
support_material_auto = 0
support_material_buildplate_only = 0
overhangs = 1
bridge_flow_ratio = 0.95
thick_bridges = 1
bridge_angle = 0
fan_always_on = 0
min_fan_speed = 0
max_fan_speed = 15
bridge_fan_speed = 60
disable_fan_first_layers = 4
fan_below_layer_time = 20
slowdown_below_layer_time = 10
min_print_speed = 10
retract_length = 1
retract_speed = 40
retract_layer_change = 1
wipe = 0
z_offset = 0
start_gcode = G28 ; home\nG92 E0
end_gcode = M104 S0\nM140 S0\nG91\nG1 Z10\nG90\nM84
before_layer_gcode =
layer_gcode = G92 E0
notes =
