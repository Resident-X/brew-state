<text x="93.00" y="93.40" fill="#c60" font-size="1.7" text-anchor="start">wall opening = the plate and the end wall + 1.5 per side</text>
<text x="10.00" y="140.20" fill="#111" font-size="1.8" text-anchor="start">Board is held by: 11 pillars and the H1 boss and screw (seat plane tilted with the board's lean), the backing rib, the hold-down finger on the left wall and the</text>
<text x="10.00" y="143.40" fill="#111" font-size="1.8" text-anchor="start">locating ribs. The lid holds nothing.</text>
<text x="10.00" y="146.60" fill="#111" font-size="1.8" text-anchor="start">Lid: two toes under hooks on the pilasters at the plate end, one M3 x 10 countersunk screw from +z at the far end. It comes off by lifting the far end and</text>
<text x="10.00" y="149.80" fill="#111" font-size="1.8" text-anchor="start">drawing it out along the pilaster grooves.</text>
<text x="10.00" y="153.00" fill="#111" font-size="1.8" text-anchor="start">Tray to plate: two M3 x 10 countersunk screws, one in each pilaster, from the plate's back face into an M3 heat-set insert set flush in the pilaster's end face;</text>
<text x="10.00" y="156.20" fill="#111" font-size="1.8" text-anchor="start">the inserts are set flush and square before the bar is fitted (a proud insert holds the tray off the bar), and the bar's two holes are marked from the printed</text>
<text x="10.00" y="159.40" fill="#111" font-size="1.8" text-anchor="start">tray with the bar seated on its ledge, each countersunk head sitting flush with or below the bar's back face. Tab screws: M3 x 5 through the tab into the plate's</text>
<text x="10.00" y="162.60" fill="#111" font-size="1.8" text-anchor="start">tapped-through holes, reached with the lid off along the blue lines.</text>
<text x="10.00" y="165.80" fill="#111" font-size="1.8" text-anchor="start">No barrier: the plate's lower edge stands 6.0 mm above the board face, resting on the tray's end-wall ledge, so no plate metal faces the board edge, the pads or</text>
<text x="10.00" y="169.00" fill="#111" font-size="1.8" text-anchor="start">the leads; the tray's printed end wall fills the volume the plate leaves, unfilled plastic with no creepage credit.</text>
<text x="10.00" y="172.20" fill="#111" font-size="1.8" text-anchor="start">Opening in the plastic wall: the plate and the end wall together plus 1.5 per side. Slot mouths keep 3.0 mm of clear air to the right wall.</text>
</g>
</svg>
