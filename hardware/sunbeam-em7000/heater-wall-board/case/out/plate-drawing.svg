<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100.00mm" height="133.80mm" viewBox="0 0 100.000 133.800">
<title>Spreader plate drawing, 1:1, seen from the case side (the inner face)</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="monospace" font-size="2.1" fill="#111">
<text x="10.00" y="12.00" fill="#111" font-size="2.0" text-anchor="start">SPREADER PLATE, aluminium, flat, nothing cut from it, seen from</text>
<text x="10.00" y="15.60" fill="#111" font-size="2.0" text-anchor="start">the case side (the inner face, looking toward the wall, the case's</text>
<text x="10.00" y="19.20" fill="#111" font-size="2.0" text-anchor="start">far end behind the viewer), 1:1, millimetres. 80.0 long x 30.0</text>
<text x="10.00" y="22.80" fill="#111" font-size="2.0" text-anchor="start">tall x 5.0 thick; provisional until the owner cuts and measures</text>
<text x="10.00" y="26.40" fill="#111" font-size="2.0" text-anchor="start">the wall.</text>
<polygon points="10.000,24.000 90.000,24.000 90.000,54.000 10.000,54.000" style="fill:#e9ebee;stroke:#000;stroke-width:0.25"/>
<polygon points="20.250,24.425 79.750,24.425 79.750,53.575 20.250,53.575" style="fill:none;stroke:#06c;stroke-width:0.2;stroke-dasharray:1.5 1"/>
<text x="21.25" y="27.43" fill="#06c" font-size="1.9" text-anchor="start">case outline 59.50 x 29.15</text>
<polygon points="10.000,24.000 20.000,24.000 20.000,54.000 10.000,54.000" style="fill:#fbe7cf;fill-opacity:0.7;stroke:#c60;stroke-width:0.12;stroke-dasharray:1 1"/>
<circle cx="15.000" cy="46.500" r="4.500" style="fill:none;stroke:#c60;stroke-width:0.12"/>
<circle cx="15.000" cy="46.500" r="2.250" style="fill:#fff;stroke:#000;stroke-width:0.2"/>
<circle cx="15.000" cy="31.500" r="4.500" style="fill:none;stroke:#c60;stroke-width:0.12"/>
<circle cx="15.000" cy="31.500" r="2.250" style="fill:#fff;stroke:#000;stroke-width:0.2"/>
<text x="15.00" y="58.00" fill="#c60" font-size="1.9" text-anchor="middle">bolt zone 10.0</text>
<polygon points="80.000,24.000 90.000,24.000 90.000,54.000 80.000,54.000" style="fill:#fbe7cf;fill-opacity:0.7;stroke:#c60;stroke-width:0.12;stroke-dasharray:1 1"/>
<circle cx="85.000" cy="46.500" r="4.500" style="fill:none;stroke:#c60;stroke-width:0.12"/>
<circle cx="85.000" cy="46.500" r="2.250" style="fill:#fff;stroke:#000;stroke-width:0.2"/>
<circle cx="85.000" cy="31.500" r="4.500" style="fill:none;stroke:#c60;stroke-width:0.12"/>
<circle cx="85.000" cy="31.500" r="2.250" style="fill:#fff;stroke:#000;stroke-width:0.2"/>
<text x="85.00" y="58.00" fill="#c60" font-size="1.9" text-anchor="middle">bolt zone 10.0</text>
<circle cx="23.000" cy="34.975" r="3.000" style="fill:#fff;stroke:#000;stroke-width:0.2"/>
<circle cx="23.000" cy="34.975" r="1.700" style="fill:#9a9a9a;stroke:#000;stroke-width:0.12"/>
<circle cx="23.000" cy="49.975" r="3.000" style="fill:#fff;stroke:#000;stroke-width:0.2"/>
<circle cx="23.000" cy="49.975" r="1.700" style="fill:#9a9a9a;stroke:#000;stroke-width:0.12"/>
<circle cx="77.000" cy="34.975" r="3.000" style="fill:#fff;stroke:#000;stroke-width:0.2"/>
<circle cx="77.000" cy="34.975" r="1.700" style="fill:#9a9a9a;stroke:#000;stroke-width:0.12"/>
<circle cx="77.000" cy="49.975" r="3.000" style="fill:#fff;stroke:#000;stroke-width:0.2"/>
<circle cx="77.000" cy="49.975" r="1.700" style="fill:#9a9a9a;stroke:#000;stroke-width:0.12"/>
<line x1="38.850" y1="31.675" x2="38.850" y2="29.675" style="stroke:#c00;stroke-width:1.2;stroke-opacity:0.35"/>
<circle cx="38.850" cy="30.475" r="1.550" style="fill:#fff;stroke:#c00;stroke-width:0.25"/>
<text x="35.85" y="27.98" fill="#c00" font-size="1.8" text-anchor="end">T921 tab screw u 12.60 z 16.50</text>
<line x1="63.450" y1="31.675" x2="63.450" y2="29.675" style="stroke:#c00;stroke-width:1.2;stroke-opacity:0.35"/>
<circle cx="63.450" cy="30.475" r="1.550" style="fill:#fff;stroke:#c00;stroke-width:0.25"/>
<text x="66.45" y="27.98" fill="#c00" font-size="1.8" text-anchor="start">T911 tab screw u 37.20 z 16.50</text>
<text x="10.00" y="66.00" fill="#111" font-size="1.9" text-anchor="start">Red bar: the tab hole height range 15.30 to 17.30 (nominal 16.50); the</text>
<text x="10.00" y="69.40" fill="#111" font-size="1.9" text-anchor="start">tapped M3 holes (dia 2.5, 4.0 deep) are drilled at the measured</text>
<text x="10.00" y="72.80" fill="#111" font-size="1.9" text-anchor="start">height.</text>
<text x="10.00" y="76.20" fill="#111" font-size="1.9" text-anchor="start">The range is unconfirmed: the owner measures the delivered board</text>
<text x="10.00" y="79.60" fill="#111" font-size="1.9" text-anchor="start">before marking the plate.</text>
<text x="10.00" y="83.00" fill="#111" font-size="1.9" text-anchor="start">Four M3 countersunk holes, countersunk on the back face (the wall</text>
<text x="10.00" y="86.40" fill="#111" font-size="1.9" text-anchor="start">face, away from the viewer; head dia 6.0 shown by its circle), take</text>
<text x="10.00" y="89.80" fill="#111" font-size="1.9" text-anchor="start">the tray screws; the back face lies on the machine wall. The two M3</text>
<text x="10.00" y="93.20" fill="#111" font-size="1.9" text-anchor="start">tapped holes enter the inner face drawn here.</text>
<text x="10.00" y="96.60" fill="#111" font-size="1.9" text-anchor="start">Wall bolts M4, two at each end, washer dia 9.0, standing in the 10.0</text>
<text x="10.00" y="100.00" fill="#111" font-size="1.9" text-anchor="start">mm end zones outside the case.</text>
<text x="10.00" y="103.40" fill="#111" font-size="1.9" text-anchor="start">Length arithmetic: case outer width at the plate 59.50 + 2 x bolt zone</text>
<text x="10.00" y="106.80" fill="#111" font-size="1.9" text-anchor="start">10.0 = 79.50, not more than the plate length 80.0 (margin 0.50).</text>
<text x="10.00" y="110.20" fill="#111" font-size="1.9" text-anchor="start">Wall opening = plate outline + 1.5 per side: 83.0 x 33.0.</text>
<text x="10.00" y="113.60" fill="#111" font-size="1.9" text-anchor="start">Interface material between the triac faces and the plate, and between</text>
<text x="10.00" y="117.00" fill="#111" font-size="1.9" text-anchor="start">the plate and the wall, is not in the catalogue and is stated in the</text>
<text x="10.00" y="120.40" fill="#111" font-size="1.9" text-anchor="start">case record.</text>
</g>
</svg>
