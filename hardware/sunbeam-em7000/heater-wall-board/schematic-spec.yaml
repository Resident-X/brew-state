  custom_symbols:
  - name: heater-wall-board:TabBlade
    from: 'project symbol in heater-wall-board.kicad_sym: one passive pin numbered 1, drawn as a blade; replaces Connector_Generic:Conn_01x01 for the blade terminals'
    pins:
    - number: '1'
      name: '1'
    used_by:
    - J921
  custom_footprints: []
  power_flags: []
  drawing_notes: 'Left to right: the opto-triac U921, the triac T921, the varistor RV921 across OUT_S and RET, and the element lead landing J921 (OUT_S, mains) at the right. Low voltage at the left edge, mains from the opto-triac''s
    output pins to the right; the opto-triac (surface-mount MOC3083SR2M, hand-fitted) is the barrier part and straddles the line: its LED pins 1-2 (+5V_WB, HEAT_S_LED_K) are drawn on its left as low voltage, its output pins
    4 and 6 on its right with the mains. Separation basis barrier: heater-switch (reinforced, mains to low voltage), formed by the opto-triac and the board spacing around it. Chain: OUT_S -> U921.6; U921.4 -> R921 -> R922
    -> T921 gate; T921 MT2 on OUT_S, MT1 on RET. No gate-to-MT1 resistor, no snubber (division record: snubbers dropped, varistors kept). U921.3 and U921.5 carry no-connect flags. The LED series resistor and the low-side sink
    are on the main board (HEAT_S_DRV stage), none here; the LED is lit only through HEAT_S_LED_K. Triac switches the neutral side; there is no live feed on this board. The triac stands with its insulated tab bolted to the
    flat spreader plate, which carries it on its inner face (tab hole 17.25 mm above the board face, leads straight); the insulated tab is not a pin. The triac is the 800 V BW grade (BTA16-800BWRG): the 775 V clamp of the
    varistor stands under its 800 V and the opto-triac''s 800 V (open-items.md, D7). Net RET is shared with the other switch sheet and the return landing sheet.'
