# Parts specification of the Sunbeam EM7000 heater wall board: one position for every part
# schematic-spec.yaml lists (15), in sheet order, the sheet named above each group.
#
# Form: the keys board_check.py reads of a position (reference, value, package, rating, lcsc, class)
# and no others, as the main board's record (main-board/parts-specification.yaml) states. So the figures
# the schema has no key for (maker, MPN, catalogue class, hand-fitted) sit in the comment above each
# position, from schematic-spec.yaml. The fields mean what they mean there: package is the footprint's
# library item name; rating is the drawn symbol's Rating field exactly as the drawn schematic carries it (shorter than the sheet specification's text where a comment says so), leading
# with the part's maximum rated voltage where it has one (the drawn fields are shorter than the ratings of schematic-spec.yaml, whose fuller text sits in the comment above each position where they differ) (the derated-voltage rule reads the first
# figure in V, VDC or VAC as the rated maximum); class is a class of derating-policy.yaml for a part
# whose rating states a figure in V, VDC or VAC and none for a part whose rating states none.
#
# Classes used: triac (the two BTA16-800BWRG triacs: the shares the assembly judgements carry, see
# derating-policy.yaml), integrated circuit (the two opto-triacs, as the main board classes its
# MOC3052SVM), resistor (the four 1206 gate resistors), varistor (the two 07D471K). The three blade
# terminals and the three-way header state no voltage in their rating, so they take none; their current
# ratings are not stated by the maker's drawing (unsourced), see open-items.md. The one case-screw hole (H1, the board's single mounting hole; the printed case retains the board with a ledge and fingers or ribs, and the hole is held to the mounting_hole distance from Mains copper whatever the screw) states no voltage and takes none; it is not in the bill of materials or the position file (set on the placed footprint at layout, open-items.md). The board carries no fiducials (layout decision of 2026-11-19: the four 1206 gate resistors are hand-fitted, so no assembled surface-mount part needs them).
#
# The four 1206 gate resistors R911, R912, R921 and R922 are hand-fitted (8 joints; excluded from the position file and the assembler's list); they keep their catalogue numbers (C18002) and are compared like any other position. The triacs T911 and T921 take the board's own footprint heater-wall-board:TO-220-3_Vertical_Insulated_OvalPads (oval pads 1.5 x 2.5, drill 1.1, tab face 2.86 mm behind the pad row), so their package is that footprint's item name.
#
# Design change of 2026-11-18 (the design opinion of that day, .stage0/wall-design-opinion.md; open-items.md D7):
# the triacs BTA16-600BRG (C9100) became BTA16-800BWRG (ST, C10065), the opto-triacs Lite-On MOC3083 (C10797)
# became onsemi MOC3083M (C23552), and the references moved to the 9xx series so that none equals a reference of
# the main board or of the shared separation basis's exceptions. The drawn Rating fields of the four parts
# are to carry the rating strings below when the schematic is next redrawn; catalogue figures of C10065
# and C23552 are not read (catalogue-extract.yaml).
#
# The library item names of T911 and T921 (`Triac_Thyristor:BTA16-600B`) and of U911 and U921
# (`Relay_SolidState:MOC3083M`) are KiCad's stock symbol names for these families, not the fitted part numbers:
# `Triac_Thyristor:BTA16-600B` is KiCad's symbol for the BTA16 family's pinout (1 A1/MT1, 2 A2/MT2, 3 G), and
# `Relay_SolidState:MOC3083M` is onsemi's own named symbol. The fitted parts are carried by each instance's own
# Value, Description, Datasheet, MPN, LCSC and Rating fields (the 800 V BTA16-800BWRG triac, the onsemi MOC3083M
# opto-triac). The symbol text cached inside sheets 100 and 200 (a '600V' description, the older onsemi datasheet
# address) is the library's and is not edited, because the symbol is stock; the check compares the instance fields (schematic review finding 3.2).
#
# Sources of the rated figures (datasheet, revision, address that opened it):
#   ST BTA16-800BWRG: DS2114 Rev 11, May 2018 (T1610, T1635, T1650, BTA16, BTB16), the Internet Archive's copy of
#     https://www.st.com/resource/en/datasheet/bta16.pdf, read 2026-11-18, the BW column of Table 4 (p.3), Tables 1, 2, 5, 8 and 9.
#     The sheet's revision history shows no electrical change between Rev 9 (Dec 2009) and Rev 11 (May 2018) other than
#     the status/summary and the T1650 package; the earlier cited Doc ID 7471 Rev 9 was not opened again, so its
#     agreement is the revision history's and the B-grade figures the records carried (checked against Tables 1 to 5).
#   onsemi MOC3083M: MOC3083M/D Rev. 2, September 2022 (MOC3081M, MOC3082M, MOC3083M),
#     https://www.onsemi.com/pdf/datasheet/moc3083m-d.pdf, read 2026-11-18
#   UNI-ROYAL 1206W4F2000T5E (C18002): Part Name 01005/0201/0402/0603/0805/1206/1210/1812/2010/2512 Series, V.3,
#     Feb. 12, 2019, https://datasheet.lcsc.com/datasheet/pdf/0a975aaa49b7c97f38a963127be4a823.pdf, opened 2026-11-18:
#     p.5 1206 maximum working voltage 200 V, maximum overload voltage 400 V (maxima), dielectric withstanding 500 V, and RCWV = sqrt(P x R) with the overload
#     voltage 2.5 x RCWV or the maximum, whichever is less: 7.07 V and 17.7 V for 200 ohm at 1/4 W (amended 2026-11-18, round 4 finding 4.2); p.4 1/4 W at 70 degC, derating curve p.5; the sheet
#     states no pulse rating (amended 2026-11-18; the earlier note said the sheet was not opened)
#   Zhuhai Hongjiacheng 07D series Rev 1.2 (C49072860), as the schematic cites it
#   TE Connectivity 63849-1 drawing C-63849 rev F1: datasheet.lcsc.com d78aaa5668ef44d19432bad6ab97dbf2.pdf
#   XFCN PZ254V-11-03P (C2937625): the main board's JP301 part; the maker's drawing REV A1 p.1 (3 A, -40 to +105 degC, 500 V AC withstanding) as the schematic review round 1 read it
