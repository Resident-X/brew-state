  - reference: T101
    value: "BTA16-600BRG"
    package: TO-220-3_Vertical
    rating: "600 V 16 A insulated TO-220AB standard (4-quadrant, B grade) triac, ST Doc ID 7471 Rev 9; insulated tab 2500 Vrms"
    lcsc: C9100
    class: triac
