# The controller part record of the Sunbeam EM7000 machine: the one microcontroller every
# board design in this folder is held to, read by the pre-order board check.
#
# part is the maker's orderable part number: the STM32H743 in the 100-lead LQFP package with
# 2 Mbytes of flash, for -40 to 85 degC, in trays (STMicroelectronics ordering code, DS12110 Rev 11,
# section 9). lcsc is the board manufacturer's catalogue number of that part, pinned for build 2
# on the stock rule of controller-board-design-constraints.md (stock covers the build quantity of
# two): C114409, in stock at 3 287 on 2026-10-23. Why this part, package and variant, and why this
# catalogue number, is component-specification.md, "The part selected".
#
# pins are the port-pin names of the LQFP100 package, each listed once, read from the
# pin/ball definition table of ST's datasheet DS12110 Rev 11 (January 2026), Table 9, LQFP100
# column: 80 port pins, which with the analogue-only pads PC2_C and PC3_C make the 82 GPIO of its
# Table 2. PC2_C and PC3_C are not port pins by name and are not listed. Every pin the part has is
# listed, including the debug-port pins (PA13, PA14), the crystal-oscillator pins (PH0, PH1) and
# the backup-domain pins (PC13, PC14, PC15): which of them a board may use is the board check's
# pin-limit and allocation rules, not this record's.
part: "STM32H743VIT6"
lcsc: "C114409"
