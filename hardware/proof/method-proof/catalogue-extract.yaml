# NOT FOR MANUFACTURE. A synthetic catalogue extract, made only to prove the parts
# check against the throwaway design beside it. Its entries are not read from any
# catalogue and must never be used for a board that is ordered: being marked
# synthetic, the check accepts it only for a design marked not for manufacture.
# Its age limit is far beyond any real one so the committed proof never goes stale.
