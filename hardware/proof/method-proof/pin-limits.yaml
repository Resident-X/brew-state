        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "4"
        domain: supply3v3
        absolute_max_v: 4.1
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "11"
        domain: supply3v3
        absolute_max_v: 4.1
