# NOT FOR MANUFACTURE. A synthetic pin allocation, made only so the method proof
# design is held to a record the pre-order check accepts. Its channels are not a
# real board's and must never be used for one: being marked synthetic, the check
# accepts it only for a design marked not for manufacture.
synthetic: true
channels:
  - channel: status_led
    net: LED_K
    controller_pin: PA0
  - channel: header_out
    net: PA1_HDR
    controller_pin: PA1
    connector: J3
    connector_pin: 1
