# A synthetic separation basis, made only for the throwaway layout review proof
# design beside it. Its figures are not read from any standard and must never be
# used for a board that is ordered: being marked synthetic, the pre-order check
# accepts it only for a design marked not for manufacture.
standard: none -- synthetic figures chosen to exercise the layout review, not derived from a standard
supply: 230 V 50 Hz
working_voltage: 250 V rms
pollution_degree: 2
material_group: IIIb
environment: indoor, dry, as assumed for a domestic appliance
overvoltage_category: 2
altitude_m: 2000
barriers: []
barrier_types: []
mains_to_low_voltage:
  clearance_mm: 3.0
  creepage_mm: 4.0
line_to_switched_line:
  clearance_mm: 2.0
  creepage_mm: 2.0
mains_to_mains:
  clearance_mm: 2.0
  terminal_clearance_mm: 2.4
  creepage_mm: 2.0
  creepage_ahead_of_fuse_mm: 2.0
  entry_fuse: R1
  held_at_reinforced: []
table_rows:
  - citation:
      document: synthetic clearance table
      edition: none
      locator: row 1
    inputs:
      working_voltage_v: 250
      overvoltage_category: 2
      altitude_m: 2000
    figure:
      clearance_mm: 3.0
  - citation:
      document: synthetic creepage table
      edition: none
      locator: row 2
    inputs:
      working_voltage_v: 250
      pollution_degree: 2
      material_group: IIIb
    figure:
      creepage_mm: 4.0
  - citation:
      document: synthetic conductor clearance table
      edition: none
      locator: row 3
    inputs:
      working_voltage_v: 250
      insulation: basic
      overvoltage_category: 2
      pollution_degree: 2
      material_group: IIIb
      altitude_m: 2000
    figure:
      clearance_mm: 2.0
  - citation:
      document: synthetic terminal clearance table
      edition: none
      locator: row 4
    inputs:
      working_voltage_v: 250
      insulation: basic
      overvoltage_category: 2
      pollution_degree: 2
      material_group: IIIb
      altitude_m: 2000
      location: terminal
    figure:
      clearance_mm: 2.4
  - citation:
      document: synthetic basic creepage table
      edition: none
      locator: row 5
    inputs:
      working_voltage_v: 250
      insulation: basic
      overvoltage_category: 2
      pollution_degree: 2
      material_group: IIIb
      altitude_m: 2000
    figure:
      creepage_mm: 2.0
accepted_by: david
accepted_on: 2026-10-14
synthetic: true
