# A synthetic derating policy, made only to prove that the pre-order check reads
# every key a derating policy record defines, against the throwaway design beside
# it. Its shares are not a real policy's and must never be used for a board that is
# ordered: being marked synthetic, the check accepts it only for a design marked
# not for manufacture.
source: none -- synthetic shares chosen to exercise the check, not taken from a policy
classes:
  - class: resistor
    voltage:
      share: 0.8
      source: none -- synthetic share
    power:
      share: 0.5
      source: none -- synthetic share
    temperature:
      share: 0.9
      source: none -- synthetic share
  - class: connector
    voltage:
      share: 0.7
      source: none -- synthetic share
    power:
      share: 1
      source: none -- synthetic share
    temperature:
      share: 0.8
      source: none -- synthetic share
synthetic: true
