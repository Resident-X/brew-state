# NOT FOR MANUFACTURE. A synthetic pin-limit record for the throwaway design beside it.
# The limits were read from the datasheets named in each entry on the date given. Being
# marked synthetic, the check accepts it only for a design marked not for manufacture.
domains:
  - name: logic
    rail: +3V3
    highest_voltage_v: 3.48
  - name: supply5
    rail: +5V
    highest_voltage_v: 5.25
  # The LED anode net, fed from the 5 V rail through R5, which sets the current. It can sit
  # no higher than the rail, so the rail's figure is its upper bound.
  - name: led_anode
    rail: LED_A
    highest_voltage_v: 5.25
  - name: ground
    rail: GND
    highest_voltage_v: 0
  - name: mains
    rail: MAINS_L
    highest_voltage_v: 353.5533906
  - name: mains_neutral
    rail: MAINS_N
    highest_voltage_v: 353.5533906
  - name: mains_earth
    rail: MAINS_PE
    highest_voltage_v: 353.5533906
  - name: mains_inlet
    rail: MAINS_L_IN
    highest_voltage_v: 353.5533906
  - name: mains_snubber
    rail: MAINS_SNUB
    highest_voltage_v: 353.5533906
parts:
  - lcsc: C9200032
    source:
      document: "MSPM0C1104, MSPM0C1103 data sheet SLASF90E"
      revision: "E"
      section: "7.1 Absolute Maximum Ratings; 9.1.1 Typical Application for the statement that the 5-V open-drain IO PA0 and PA1 are fail-safe"
      read_on: 2026-10-18
    pins:
      - pin: "VDD"
        domain: logic
        absolute_max_v: 4.1
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "PA0"
        domain: logic
        absolute_max_v: 5.5
        absolute_min_v: -0.3
        tolerates_driven_unpowered: true
      - pin: "PA1"
        domain: logic
        absolute_max_v: 5.5
        absolute_min_v: -0.3
        tolerates_driven_unpowered: true
      - pin: "PA2"
        domain: logic
        absolute_max_v: 4.1
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "PA17"
        domain: logic
        absolute_max_v: 4.1
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "PA19"
        domain: logic
        absolute_max_v: 4.1
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "PA20"
        domain: logic
        absolute_max_v: 4.1
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "PA24"
        domain: logic
        absolute_max_v: 4.1
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "PA27"
        domain: logic
        absolute_max_v: 4.1
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "NRST"
        domain: logic
        absolute_max_v: 4.1
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "7"
        domain: ground
        absolute_max_v: 4.1
        absolute_min_v: -0.3
        tolerates_driven_unpowered: true
  - lcsc: C9200020
    source:
      document: "TPS3820, TPS3823, TPS3824, TPS3825, TPS3828 data sheet SLVS165O"
      revision: "O"
      section: "6.1 Absolute Maximum Ratings"
      read_on: 2026-10-18
    pins:
      - pin: "5"
        domain: logic
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "4"
        domain: logic
        absolute_max_v: 3.78
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "3"
        domain: logic
        absolute_max_v: 3.78
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "1"
        domain: logic
        absolute_max_v: 3.78
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "2"
        domain: ground
        absolute_max_v: 6
        absolute_min_v: -0.3
        tolerates_driven_unpowered: true
  - lcsc: C9200030
    source:
      document: "MCP1700 data sheet DS20001826E"
      revision: "E"
      section: "Absolute Maximum Ratings"
      read_on: 2026-10-18
    pins:
      - pin: "3"
        domain: supply5
        absolute_max_v: 6.5
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "2"
        domain: logic
        absolute_max_v: 6.5
        absolute_min_v: -0.3
        tolerates_driven_unpowered: false
      - pin: "1"
        domain: ground
        absolute_max_v: 6.5
        absolute_min_v: -0.3
        tolerates_driven_unpowered: true
  - lcsc: C9200035
    source:
      document: "TPD4E1U06 data sheet SLVSBQ9D"
      revision: "D"
      section: "6.4 Recommended Operating Conditions (VIO 0 V to 5.5 V; the data sheet states no pin absolute maximum)"
      read_on: 2026-10-18
    pins:
      - pin: "1"
        domain: logic
        absolute_max_v: 5.5
        absolute_min_v: 0
        tolerates_driven_unpowered: true
      - pin: "6"
        domain: logic
        absolute_max_v: 5.5
        absolute_min_v: 0
        tolerates_driven_unpowered: true
      - pin: "2"
        domain: ground
        absolute_max_v: 5.5
        absolute_min_v: 0
        tolerates_driven_unpowered: true
  - lcsc: C9200014
    source:
      document: "BSS138 data sheet DS30144"
      revision: "25-2"
      section: "Maximum Ratings (absolute maximum)"
      read_on: 2026-10-18
    pins:
      - pin: "1"
        domain: logic
        absolute_max_v: 20
        absolute_min_v: -20
        tolerates_driven_unpowered: true
      - pin: "3"
        domain: supply5
        absolute_max_v: 50
        absolute_min_v: -0.3
        tolerates_driven_unpowered: true
      - pin: "2"
        domain: logic
        absolute_max_v: 50
        absolute_min_v: -0.3
        tolerates_driven_unpowered: true
  - lcsc: C9200012
    source:
      document: "MOC301XM, MOC302XM data sheet"
      revision: "1.5"
      section: "Absolute Maximum Ratings"
      read_on: 2026-10-18
    pins:
      # Pin 1, the LED anode, and pin 2, the cathode, carry the datasheet's 3 V reverse voltage
      # as the anode's lowest voltage and as the cathode's rise above the anode's highest. The
      # datasheet's limit on the forward side is a current, which R5 sets and circuit-proof.md judges.
      - pin: "4"
        domain: mains
        absolute_max_v: 400
        absolute_min_v: -400
        tolerates_driven_unpowered: true
      - pin: "6"
        domain: mains
        absolute_max_v: 400
        absolute_min_v: -400
        tolerates_driven_unpowered: true
      - pin: "1"
        domain: led_anode
        absolute_max_v: 5.25
        absolute_min_v: -3
        tolerates_driven_unpowered: true
      # Pin 2 is the LED cathode on net LED_K; it takes the led_anode domain because a listed pin's domain voltage feeds the net's reach, and the cathode ceiling is anode + 3 V = 8.25 V, which the figures below encode.
      - pin: "2"
        domain: led_anode
        absolute_max_v: 8.25
        absolute_min_v: 0
        tolerates_driven_unpowered: true
  - lcsc: C9200009
    source:
      document: "BTA16-600B, 600 V repetitive peak off-state voltage"
      revision: "A"
      section: "absolute maximum ratings"
      read_on: 2026-10-18
    # Every pin is held to the 600 V repetitive peak off-state voltage, the part's own figure.
    pins:
      - pin: "1"
        domain: mains
        absolute_max_v: 600
        absolute_min_v: -600
        tolerates_driven_unpowered: true
      - pin: "2"
        domain: mains
        absolute_max_v: 600
        absolute_min_v: -600
        tolerates_driven_unpowered: true
      - pin: "3"
        domain: mains
        absolute_max_v: 600
        absolute_min_v: -600
        tolerates_driven_unpowered: true
  - lcsc: C9200034
    source:
      document: "none -- synthetic limits"
      revision: "A"
      section: "absolute maximum ratings"
      read_on: 2026-10-18
    # The LED's reverse voltage is its only voltage limit; its forward limit is a current, so not listed.
    pins:
      - pin: "2"
        domain: logic
        absolute_max_v: 5
        absolute_min_v: -5
        tolerates_driven_unpowered: true
      - pin: "1"
        domain: ground
        absolute_max_v: 5
        absolute_min_v: -5
        tolerates_driven_unpowered: true
  - lcsc: C9200024
    source:
      document: "none -- synthetic limits"
      revision: "A"
      section: "absolute maximum ratings"
      read_on: 2026-10-18
    pins:
      - pin: "1"
        domain: supply5
        absolute_max_v: 250
        absolute_min_v: -250
        tolerates_driven_unpowered: true
  - lcsc: C9200023
    source:
      document: "none -- synthetic limits"
      revision: "A"
      section: "absolute maximum ratings"
      read_on: 2026-10-18
    pins:
      - pin: "1"
        domain: supply5
        absolute_max_v: 250
        absolute_min_v: -250
        tolerates_driven_unpowered: true
synthetic: true
