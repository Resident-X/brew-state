# The complete verification, run against main every night on hosted runners.
#
# A build round's gate is targeted: it runs the host tier only when a branch
# touches what the host tier reads, the emulation tier only when a branch
# touches what the emulation reads, the board tier only when a branch touches a
# board design, what one reads or the board tooling, and the mutation sweep only
# over the plant lines a branch changes. This is where everything the round can
# skip runs anyway -- the emulation tier and the board tier unconditionally, the
# host tier again in a closed tree holding only the files the round declares it
# reads (fw:host-closure), and the sweep over its whole population -- so its run
# history is the record of what main last verified.
#
# The gates are not listed here. `task fw:verify` is the single declaration of
# the complete verification, and this runs that declaration with the sweep left
# out by name, so a gate added to it later runs here without a line here
# changing. The board gates are among them: they check every board design the
# repository tracks and run the tests of the board tooling, without the tests
# that run the seeded-fault proof, which stays on demand. They need KiCad, the
# rasteriser the tooling tests draw with and a monospaced font, so the gates job
# installs them, from sources named and held to a version and a digest or
# fingerprint below. The sweep is left out of that job because run in one job it takes
# the sum of every shard's time; it runs instead as the sharded sweep workflow,
# called from here so its shards belong to this run and decide its result. The
# night fails if any gate, any shard, or the judging of the combined population
# fails.
#
# The compiler a job builds the host tier with is the one its host defaults to,
# chosen by no setting here: the gates job runs on Ubuntu and so builds with
# GCC, and the host-build job runs on macOS arm64 and so builds with Apple
# clang. A conversion the strict warning settings reject under one compiler and
# the other accepts therefore fails a night instead of reaching a contributor on
# the other platform. The second job runs only the host-tier build, not every
# gate under both compilers: what a second compiler adds is the warnings only
# its build reports, and a build round never needs a second compiler installed
# on the machine it runs on.
#
# It also runs on manual dispatch, against whichever ref it is started on.

name: Nightly verification

on:
  schedule:
    # Off the hour, when scheduled runs are least likely to be delayed.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Each run is its own group, so no run -- scheduled or dispatched -- waits on or
# cancels another. A night cancelled by a later one would leave that night with
# no result, and the run history is only a record if every night has one.
concurrency:
  group: nightly-verify-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  gates:
    name: Every gate but the sweep
    runs-on: ubuntu-24.04
    # The first observed runs took about twenty minutes, most of it the
    # emulation tier, but stopped short of building and running every host
    # environment; the budget stays wide until a run that does has been timed.
    timeout-minutes: 120
    steps:
      # Actions are pinned to the commit a release points at rather than to the
      # tag, for the reason the sweep workflow gives beside its own pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the task runner
        env:
          # renovate: datasource=github-releases depName=go-task/task
          TASK_VERSION: "3.54.0"
          # The digest the release publishes for this archive. Not an
          # independent choice: it changes with the version and only with it.
          TASK_SHA256: "680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/task.tar.gz \
            "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_amd64.tar.gz"
          echo "${TASK_SHA256}  /tmp/task.tar.gz" | sha256sum -c -
          tar -xzf /tmp/task.tar.gz -C /tmp task
          sudo install -m 0755 /tmp/task /usr/local/bin/task

      - name: Install PlatformIO
        env:
          # renovate: datasource=pypi depName=platformio
          PLATFORMIO_VERSION: "6.1.19"
        run: python3 -m pip install "platformio==${PLATFORMIO_VERSION}"

      # The emulation tier's emulator and register description, fetched and
      # checked against their pinned digests before any gate runs, so a fetch
      # that fails is reported as provisioning rather than as the tier failing.
      #
      # The emulator's scripting layer loads the dynamic-loading library by its
      # unversioned name, which this distribution installs only under its
      # versioned one; without the unversioned name every scripted peripheral
      # fails to load and the closed-loop runs never start.
      - name: Provision the emulation tier
        run: |
          set -euo pipefail
          libraries=/usr/lib/x86_64-linux-gnu
          if [ ! -e "${libraries}/libdl.so" ]; then
            sudo ln -s libdl.so.2 "${libraries}/libdl.so"
          fi
          task fw:emulate:provision

      # The tools the board gates need, installed and held to what was read when
      # they were chosen. KiCad comes from the project's own package archive for
      # its 10.0 releases, at the version the board files need or newer: the
      # archive's signing key is fetched and its fingerprint compared with the
      # one the archive publishes before it is trusted, and the package is
      # named at an exact version. The rasteriser is the release the project
      # publishes, checked against the digest that release lists for the archive
      # and again after download. The font and the YAML reader are the
      # distribution's own packages at the versions its release carries. A tool
      # that fails to install fails this step, so it is reported as provisioning
      # rather than as a board gate failing. Which of these installs completes
      # on a hosted runner is what the first nightly run demonstrates.
      - name: Install KiCad, a monospaced font and the YAML reader
        env:
          KICAD_PPA: "kicad/kicad-10.0-releases"
          # The fingerprint the archive's owner publishes for its signing key.
          KICAD_PPA_KEY: "FDA854F61C4D0D9572BB95E5245D5502FAD7A805"
          KICAD_VERSION: "10.0.7~ubuntu24.04.1"
          FONT_VERSION: "2.37-8"
          YAML_VERSION: "6.0.1-2build2"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kicad-ppa.asc \
            "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${KICAD_PPA_KEY}"
          found="$(gpg --show-keys --with-colons /tmp/kicad-ppa.asc \
            | awk -F: '$1 == "pub" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }')"
          if [ "${found}" != "${KICAD_PPA_KEY}" ]; then
            echo "the signing key fetched for ${KICAD_PPA} is ${found:-none}, not ${KICAD_PPA_KEY}" >&2
            exit 1
          fi
          sudo install -d -m 0755 /etc/apt/keyrings
          gpg --dearmor < /tmp/kicad-ppa.asc | sudo tee /etc/apt/keyrings/kicad-ppa.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/kicad-ppa.gpg] https://ppa.launchpadcontent.net/${KICAD_PPA}/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/kicad-ppa.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "kicad=${KICAD_VERSION}" "fonts-dejavu-core=${FONT_VERSION}" "python3-yaml=${YAML_VERSION}"
          kicad-cli version

      - name: Install the rasteriser
        env:
          # renovate: datasource=github-releases depName=linebender/resvg
          RESVG_VERSION: "0.47.0"
          # The digest the release publishes for this archive. Not an
          # independent choice: it changes with the version and only with it.
          RESVG_SHA256: "5c84dcbcd032fe7e8d96e616fd6807a2f9df6561d2e6582b37e91e63c6cb4fe7"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/resvg.tar.gz \
            "https://github.com/linebender/resvg/releases/download/v${RESVG_VERSION}/resvg-linux-x86_64.tar.gz"
          echo "${RESVG_SHA256}  /tmp/resvg.tar.gz" | sha256sum -c -
          tar -xzf /tmp/resvg.tar.gz -C /tmp resvg
          sudo install -m 0755 /tmp/resvg /usr/local/bin/resvg
          resvg --version

      - name: Run the complete verification, the sweep left out for its own jobs
        run: |
          set -euo pipefail
          PIO="$(command -v pio)"
          export PIO
          task fw:verify -- --leave-out fw:sweep

  host-build-macos:
    name: The host build under Apple clang
    runs-on: macos-15
    # Builds every environment, the target's included, and nothing else: no
    # test or emulator runs here.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the task runner
        env:
          # renovate: datasource=github-releases depName=go-task/task
          TASK_VERSION: "3.54.0"
          # The digest the release publishes for this archive, which is not the
          # one the Ubuntu job checks: each platform's archive has its own, and
          # each changes with the version and only with it.
          TASK_SHA256: "12a69fcf37bb8d5bc9150c44f9a936775b73e59ff044c2c245232f198c135637"
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_darwin_arm64.tar.gz"
          echo "${TASK_SHA256}  ${RUNNER_TEMP}/task.tar.gz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/task.tar.gz" -C "${RUNNER_TEMP}/bin" task
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # In a virtual environment of its own, because this runner's Python is
      # managed by its package manager and refuses an install into itself.
      - name: Install PlatformIO
        env:
          # renovate: datasource=pypi depName=platformio
          PLATFORMIO_VERSION: "6.1.19"
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/platformio"
          "${RUNNER_TEMP}/platformio/bin/python" -m pip install "platformio==${PLATFORMIO_VERSION}"
          echo "${RUNNER_TEMP}/platformio/bin" >> "${GITHUB_PATH}"

      - name: Build every environment with this host's own compiler
        run: |
          set -euo pipefail
          PIO="$(command -v pio)"
          export PIO
          task fw:build

  sweep:
    name: The full mutation sweep
    uses: $/.github/workflows/mutation-sweep.yml
