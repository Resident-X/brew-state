# The plant model's mutation sweep, run on a hosted runner when somebody asks
# for it.
#
# It is started by hand and by nothing else. The sweep answers a question --
# does the test suite still notice a change to the model's arithmetic -- that
# does not change between commits the way the tests' own results do, and it
# compiles every swept source afresh and runs the suite once per mutant. Wiring
# that into every push would spend most of its time re-establishing an answer
# nobody was waiting for. The same reasoning keeps `task fw:mutate` out of the
# gate, and the firmware README states it at greater length.
#
# What this being here establishes is that the sweep runs somewhere other than
# the machine it was written on. Nothing in the toolchain discovery names a
# Homebrew path or a Mac, but a verification tool is only portable once it has
# been run somewhere else, and this is where that happens.
#
# The compiler is Ubuntu's own clang-19 rather than a newer one from apt.llvm.org,
# because Mull's package for this release of Ubuntu is built against Ubuntu's
# build of LLVM 19. Taking both from the same distribution is what makes them
# agree.

name: Mutation sweep

on:
  workflow_dispatch:

permissions:
  contents: read

# One sweep per ref at a time, and the newest dispatch is the one that matters.
# The answer is about the state of a ref rather than about a moment, so a run
# still going when another starts is establishing something about a ref that has
# already moved on -- finishing it would burn a runner to produce an answer
# nobody asked for any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Sweep the plant model's arithmetic
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # Actions are pinned to the commit a release points at rather than to the
      # tag, because a tag is a moving reference: whoever owns it can repoint it
      # at other code, and this job holds a checkout of this repository and a
      # package installed with sudo. The version is kept in the comment so the
      # pin still reads as a version to a person, and so an automated updater
      # can bump both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout otherwise leaves a credential in .git/config for the
          # rest of the job. Nothing here pushes anything -- the sweep reads the
          # tree and reports -- so the token is not wanted after the clone, and
          # leaving it behind is what turns an uploaded artefact or a stray
          # `git config` dump into a leak.
          persist-credentials: false

      - name: Install the mutation toolchain
        env:
          # renovate: datasource=github-releases depName=mull-project/mull
          MULL_RELEASE: "0.34.0"
          # The LLVM build the package for this runner's distribution is made
          # against, which is not the newest LLVM 19 -- it is whichever one that
          # distribution ships, and the two have to agree. Not an independent
          # choice, so not something to bump on its own.
          MULL_LLVM: "19.1.1"
        run: |
          set -euo pipefail
          package="Mull-19-${MULL_RELEASE}-LLVM-${MULL_LLVM}-ubuntu-amd64-24.04.deb"
          sudo apt-get update
          sudo apt-get install -y clang-19
          curl -fsSL -o "/tmp/${package}" \
            "https://github.com/mull-project/mull/releases/download/${MULL_RELEASE}/${package}"
          # dpkg does not resolve dependencies; apt is asked to finish the job
          # rather than leaving the package half-installed and the run confusing.
          sudo dpkg -i "/tmp/${package}" || sudo apt-get -f install -y

      - name: Install PlatformIO and what reads the sweep's configuration
        env:
          # renovate: datasource=pypi depName=platformio
          PLATFORMIO_VERSION: "6.1.19"
          # renovate: datasource=pypi depName=PyYAML
          PYYAML_VERSION: "6.0.3"
        run: |
          set -euo pipefail
          # Pinned rather than upgraded to whatever is newest that morning: a
          # sweep whose result changed because a build tool moved underneath it
          # would be a finding about nothing.
          python3 -m pip install "platformio==${PLATFORMIO_VERSION}" "pyyaml==${PYYAML_VERSION}"

      - name: Report the toolchain the sweep resolved
        # Printed before the sweep runs so that a mutant population which looks
        # wrong can be read against the versions that produced it.
        run: |
          set -euo pipefail
          cd firmware
          python3 -c "import sys; sys.path.insert(0, 'tools'); import mull_toolchain, json; \
            print(json.dumps({k: str(v) for k, v in mull_toolchain.resolved(warn=print).items()}, indent=2))"

      - name: Sweep the plant model's arithmetic
        run: |
          set -euo pipefail
          cd firmware
          python3 tools/mull_sweep.py --project . --pio "$(command -v pio)"
